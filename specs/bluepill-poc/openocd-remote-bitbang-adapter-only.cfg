# Host-only/qualified one-Site adapter setup; no Target loaded here.
# The canonical OpenOCDPlanExecutor separately uses -f target/stm32f1x.cfg.
# A trusted private UNIX socket path must be supplied with -c before init.
# This does not configure power, NRST, a Z2 FPGA image, or MMIO.
adapter driver remote_bitbang
remote_bitbang port 0
transport select swd
reset_config none
