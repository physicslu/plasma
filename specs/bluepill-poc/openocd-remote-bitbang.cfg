# Development-only STM32F103C8T6 PoC over an explicitly local
# remote_bitbang UNIX socket. This is NOT a Production backend route.
# Before -f, set: -c "remote_bitbang host /trusted/user-owned/path/socket"
# OpenOCD will only connect on 'init' with an externally approved PS/PL
# Bitbang bridge and independently verified physical hardware.
adapter driver remote_bitbang
remote_bitbang port 0
transport select swd
reset_config none
source [find target/stm32f1x.cfg]
