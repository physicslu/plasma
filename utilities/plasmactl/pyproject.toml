[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasma-unified-cli"
version = "0.2.0"
description = "Portable PLASMA operator CLI (Manager Batch programming, diagnostics, deployment routing)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
plasmactl = "plasma_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
