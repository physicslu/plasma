[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasma-unified-cli"
version = "0.1.0"
description = "Portable PLASMA operator CLI (first read-only diagnostic slice)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
plasmactl = "plasma_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
