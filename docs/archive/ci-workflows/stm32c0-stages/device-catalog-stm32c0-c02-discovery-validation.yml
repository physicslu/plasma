name: STM32C0 C0.2 discovery validation

on:
  pull_request:
    paths:
      - "data/device-catalog/research/stm32c0_phase_c0_2_discovery.py"
      - "data/device-catalog/research/run_stm32c0_phase_c0_2_discovery.py"
      - "data/device-catalog/research/test_stm32c0_phase_c0_2_discovery.py"
      - "data/device-catalog/research/validate_stm32c0_phase_c0_2_retained_evidence.py"
      - "data/device-catalog/research/stm32c0-phase-c0.2-discovery-baseline.json"
      - "data/device-catalog/research/stm32c0-phase-c0.2-discovery-manifest.json"
      - "data/device-catalog/research/evidence/stm32c0-c0.2-official-st-discovery-live-2026-09-11/**"
      - "data/device-catalog/research/stm32c0-phase-c0.1-foundation-baseline.json"
      - "data/device-catalog/research/openocd-parts-canonical.csv"
      - ".github/workflows/device-catalog-stm32c0-c02-discovery-validation.yml"
  push:
    branches: [main]
    paths:
      - "data/device-catalog/research/stm32c0_phase_c0_2_discovery.py"
      - "data/device-catalog/research/run_stm32c0_phase_c0_2_discovery.py"
      - "data/device-catalog/research/test_stm32c0_phase_c0_2_discovery.py"
      - "data/device-catalog/research/validate_stm32c0_phase_c0_2_retained_evidence.py"
      - "data/device-catalog/research/stm32c0-phase-c0.2-discovery-baseline.json"
      - "data/device-catalog/research/stm32c0-phase-c0.2-discovery-manifest.json"
      - "data/device-catalog/research/evidence/stm32c0-c0.2-official-st-discovery-live-2026-09-11/**"
      - "data/device-catalog/research/stm32c0-phase-c0.1-foundation-baseline.json"
      - "data/device-catalog/research/openocd-parts-canonical.csv"
      - ".github/workflows/device-catalog-stm32c0-c02-discovery-validation.yml"

permissions:
  contents: read

jobs:
  discovery-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run C0.2 deterministic boundary and negative controls
        run: python data/device-catalog/research/test_stm32c0_phase_c0_2_discovery.py
      - name: Print deterministic C0.2 target manifest
        run: python data/device-catalog/research/stm32c0_phase_c0_2_discovery.py
      - name: Validate retained evidence when present
        shell: bash
        run: |
          if test -f data/device-catalog/research/validate_stm32c0_phase_c0_2_retained_evidence.py; then
            python data/device-catalog/research/validate_stm32c0_phase_c0_2_retained_evidence.py
          fi
