name: STM32F7 metadata replay v3.5
on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32f7-ordering-authority-v3.5.json'
      - 'data/device-catalog/research/analyze_stm32f7_metadata_replay_v35.py'
      - 'data/device-catalog/research/test_analyze_stm32f7_metadata_replay_v35.py'
      - 'data/device-catalog/research/STM32F7_METADATA_REPLAY_V35.md'
      - 'scripts/device-catalog-family-ci.py'
      - '.github/workflows/device-catalog-stm32f7-metadata-replay-v35.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STM32F7 metadata replay
        run: |
          python data/device-catalog/research/analyze_stm32f7_metadata_replay_v35.py
          python -m unittest discover -s data/device-catalog/research \
            -p test_analyze_stm32f7_metadata_replay_v35.py -v
