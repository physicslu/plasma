# STM32F103xF/xG XL-density extension for pinned OpenOCD 0.12.0.
# Load after upstream target/stm32f1x.cfg; the Production Catalog retains
# its source-locked upstream route while this adds Bank 2 for XL profiles.
# The profile size is checked against the raw, readable silicon register before
# either bank is probed. This prevents the driver's family-maximum fallback
# from admitting an F part as a G part or an unreadable device as either.
flash bank $_CHIPNAME.flash2 stm32f1x 0x08080000 0 0 0 $_TARGETNAME

proc plasma_flash_capacity_guard {expected_kib} {
    if {$expected_kib != 768 && $expected_kib != 1024} {
        error "PLASMA_FLASH_CAPACITY_UNSUPPORTED"
    }
    set device_id [lindex [read_memory 0xE0042000 32 1] 0]
    if {($device_id & 0xFFF) != 0x430} {
        error "PLASMA_FLASH_DEVICE_ID_MISMATCH"
    }
    set actual_kib [lindex [read_memory 0x1FFFF7E0 16 1] 0]
    if {$actual_kib != $expected_kib} {
        error "PLASMA_FLASH_CAPACITY_MISMATCH"
    }
}
