# STM32F103xF/xG XL-density candidate target configuration.
# Use the upstream 0.12.0 STM32F1 target and its first Flash bank.
# Both banks must probe their size; do not accept a FLASH_SIZE override.
set FLASH_SIZE 0
source [find target/stm32f1x.cfg]
flash bank $_CHIPNAME.flash2 stm32f1x 0x08080000 0 0 0 $_TARGETNAME
