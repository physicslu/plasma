ppu:
  id: z2-dev-01
  facility_id: swpc-lab
  model: PYNQ-Z2
  display_name: Plasma Z2 Prototype

server:
  host: 127.0.0.1
  port: 9900
  max_supported_sites: 8
  max_concurrent_jobs: 2
  max_queue_depth_per_site: 16
  output_root: output
  log_root: logs
  max_metadata_bytes: 65536
  max_map_bytes: 1048576
  max_binary_bytes: 67108864

sites:
  - id: 1
    enabled: true
    interface: mock
    target: STM32F103C8T6
    operation_timeout_s: 30.0
    max_retries: 1
    retry_backoff_s: 0.05
    mock:
      flash_size: 262144
      default_delay_s: 0.8
      progress_steps: 30
      delays:
        erase: 1.5
        program: 3.0
        verify: 1.5
        read: 0.8

  - id: 2
    enabled: true
    interface: mock
    target: STM32F103C8T6
    operation_timeout_s: 30.0
    max_retries: 1
    retry_backoff_s: 0.05
    mock:
      flash_size: 262144
      default_delay_s: 0.8
      progress_steps: 30
      delays:
        erase: 1.5
        program: 3.0
        verify: 1.5
        read: 0.8

  - {id: 3, enabled: false, interface: mock}
  - {id: 4, enabled: false, interface: mock}
  - {id: 5, enabled: false, interface: mock}
  - {id: 6, enabled: false, interface: mock}
  - {id: 7, enabled: false, interface: mock}
  - {id: 8, enabled: false, interface: mock}
