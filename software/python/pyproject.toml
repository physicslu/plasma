[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution identity is retained for installation compatibility. The
# canonical Plasma domain vocabulary is Facility -> PPU -> Site.
name = "plasma-multichannel"
version = "0.3.2"
description = "Configurable 1-8 Site Plasma PPU control-plane prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0"]

[project.scripts]
plasma = "plasma_client.cli:main"
plasma-server = "plasma_server.server:main"
plasma-web = "plasma_web.gateway:main"
plasma-manager = "plasma_manager.server:main"

[tool.setuptools]
packages = [
  "plasma_core",
  "plasma_interfaces",
  "plasma_handlers",
  "plasma_server",
  "plasma_client",
  "plasma_web",
  "plasma_manager",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
