[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasma-multichannel"
version = "0.3.1"
description = "Configurable 1-8 channel IC programmer control-plane prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0"]

[project.scripts]
plasma = "plasma_client.cli:main"
plasma-server = "plasma_server.server:main"
plasma-web = "plasma_web.gateway:main"

[tool.setuptools]
packages = [
  "plasma_core",
  "plasma_interfaces",
  "plasma_handlers",
  "plasma_server",
  "plasma_client",
  "plasma_web",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
