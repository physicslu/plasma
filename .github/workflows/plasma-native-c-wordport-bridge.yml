name: PLASMA Native C WordPort Gate 1 Host-only

on:
  pull_request:
    paths:
      - '.github/workflows/plasma-native-c-wordport-bridge.yml'
      - 'software/python/native/bluepill_wordport_bridge.c'
      - 'software/python/plasma_interfaces/native_bluepill_word_port.py'
      - 'software/python/plasma_interfaces/wordport_stage_monitor.py'
      - 'software/python/tests/test_wordport_stage_monitor.py'
      - 'software/python/tests/test_native_bluepill_wordport_host.py'
      - 'software/python/plasma_interfaces/bluepill_remote_bitbang.py'
      - 'software/python/plasma_interfaces/bluepill_z2_word_port.py'
      - 'software/python/plasma_interfaces/linux_mmio.py'
      - 'scripts/bluepill-wordport-session.py'
      - 'scripts/plasma_native_wordport_v02.py'
      - 'scripts/plasma_wordport_program.py'
      - 'scripts/plasma_ab_burn_in.py'
      - 'scripts/ppu-deploy'
      - 'scripts/ppu_deploy.py'
      - 'scripts/ppu_deploy_target.py'
      - 'software/python/tests/test_ppu_deploy_host.py'
      - 'software/python/tests/test_plasma_ab_burn_in_host.py'
      - 'software/python/tests/test_native_wordport_v02_entry_host.py'
      - 'software/python/tests/test_wordport_program_generic_host.py'
      - 'docs/development/native-wordport-v02-path2.md'
      - 'docs/development/image-agnostic-wordport-path2.md'
      - 'docs/development/ppu-deploy-engineering-modules.md'
      - 'scripts/build-native-bluepill-wordport.sh'
      - 'scripts/tests/test_bluepill_wordport_session.py'
      - 'docs/development/native-c-wordport-gate1-host.md'

permissions:
  contents: read

jobs:
  native-wordport-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python dependency and Host-only Tcl interpreter
        run: |
          python -m pip install 'PyYAML>=6.0'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tcl
      - name: Host-only Protocol A/B positive and negative tests
        env:
          PYTHONPATH: software/python
        run: |
          python -m unittest discover -s software/python/tests \
            -p 'test_native_bluepill_wordport_host.py' -v
          python -m unittest discover -s scripts/tests \
            -p 'test_bluepill_wordport_session.py' -v
          python -m unittest discover -s software/python/tests \
            -p 'test_native_wordport_v02_entry_host.py' -v
          python -m unittest discover -s software/python/tests \
            -p 'test_wordport_program_generic_host.py' -v
          python -m unittest discover -s software/python/tests \
            -p 'test_plasma_ab_burn_in_host.py' -v
          python -m unittest discover -s software/python/tests \
            -p 'test_wordport_stage_monitor.py' -v
          python -m unittest discover -s software/python/tests \
            -p 'test_ppu_deploy_host.py' -v
      - name: Python and shell syntax
        run: |
          python -m py_compile software/python/plasma_interfaces/native_bluepill_word_port.py \
            software/python/plasma_interfaces/wordport_stage_monitor.py \
            software/python/plasma_interfaces/bluepill_remote_bitbang.py \
            software/python/tests/test_native_bluepill_wordport_host.py \
            software/python/tests/test_wordport_stage_monitor.py \
            scripts/bluepill-wordport-session.py \
            scripts/plasma_native_wordport_v02.py \
            scripts/plasma_wordport_program.py \
            scripts/plasma_ab_burn_in.py \
            scripts/ppu-deploy \
            scripts/ppu_deploy.py \
            scripts/ppu_deploy_target.py \
            software/python/tests/test_ppu_deploy_host.py \
            software/python/tests/test_plasma_ab_burn_in_host.py \
            software/python/tests/test_native_wordport_v02_entry_host.py \
            software/python/tests/test_wordport_program_generic_host.py
          bash -n scripts/build-native-bluepill-wordport.sh
      - name: Install ephemeral ARMv7 cross toolchain (hosted only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf \
            libc6-dev-armhf-cross
      - name: Cross-build ARMv7 ELF and inspect native DMB SY
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plasma-native-wordport"
          output="$RUNNER_TEMP/plasma-native-wordport/libplasma_wordport_armv7.so"
          bash scripts/build-native-bluepill-wordport.sh armv7 "$output"
          arm-linux-gnueabihf-readelf -h "$output" \
            > "$RUNNER_TEMP/plasma-native-wordport/elf-header.txt"
          arm-linux-gnueabihf-objdump -d "$output" \
            > "$RUNNER_TEMP/plasma-native-wordport/disassembly.txt"
          grep -Eq 'Class:[[:space:]]+ELF32' "$RUNNER_TEMP/plasma-native-wordport/elf-header.txt"
          grep -Eq 'Machine:[[:space:]]+ARM' "$RUNNER_TEMP/plasma-native-wordport/elf-header.txt"
          grep -Eq '\bdmb[[:space:]]+sy\b' "$RUNNER_TEMP/plasma-native-wordport/disassembly.txt"
          (cd "$RUNNER_TEMP/plasma-native-wordport" && sha256sum \
            libplasma_wordport_armv7.so elf-header.txt disassembly.txt > SHA256SUMS)
          echo "ARMv7 cross-build, ELF32 ARM and DMB SY: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Z2 ARMv7 execution, FPGA MMIO, electrical and DUT: NOT_RUN" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve SHA-pinned build candidate and disassembly
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plasma-native-wordport-${{ github.sha }}
          path: ${{ runner.temp }}/plasma-native-wordport/
          if-no-files-found: error
          retention-days: 14
