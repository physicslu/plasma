concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap-scripts:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile stock-PYNQ-compatible bootstrap scripts
        run: >-
          python -m py_compile
          scripts/ppu-bootstrap.py
          scripts/ppu-bootstrap-service.py
          scripts/ppu-bootstrap-deployment.py
          scripts/ppu-bootstrap-kit.py
          scripts/ppu-bootstrap-installer.py
          scripts/ppu_unified_deployment.py
          scripts/ppu_asset_set.py
          scripts/ppu_owner_authorization.py
          scripts/ppu_asset_execution.py
          scripts/ppu_privileged_source.py
          scripts/ppu-privileged-source-install.py
          scripts/ppu_fpga_qualification.py
          scripts/ppu_package_launcher.py
          scripts/ppu_package_entry.py
          scripts/ppu_package_unit_helper.py
          scripts/ppu_package_units.py
          scripts/ppu_package_action.py
          scripts/ppu_site_worker.py
          scripts/ppu_site_worker_service.py
          scripts/ppu_site_engine.py
          scripts/ppu_opf_reference_openocd.py
          scripts/ppu_opf_site_session.py
          scripts/ppu_provider_contract.py
          scripts/ppu_provider_options.py
          scripts/ppu_site_adapter_abi5.py
          scripts/ppu_site_recovery.py
          pl/hil/fpga_image_root.py
          pl/hil/fpga_image_guard.py
          pl/hil/fpga_image_admission.py
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run factory Bootstrap contract regressions
        run: >-
          python -m pytest -q
          software/python/tests/test_ppu_bootstrap_core.py
          software/python/tests/test_ppu_bootstrap_deployment.py
          software/python/tests/test_ppu_deploy_api_host.py
          software/python/tests/test_ppu_b3_z2_install_gate1.py
          software/python/tests/test_ppu_b3_fpga_load_gate1.py
          software/python/tests/test_ppu_owner_authorization_gate1.py
          software/python/tests/test_ppu_asset_execution_gate1.py
          software/python/tests/test_ppu_privileged_source_gate1.py
          software/python/tests/test_ppu_fpga_static_qualification_gate1.py
          software/python/tests/test_ppu_bundle_v3_single_engine_gate1.py
          software/python/tests/test_ppu_bundle_v3_packages_contract.py
          software/python/tests/test_ppu_package_receive_admission_pr1.py
          software/python/tests/test_ppu_b3_factory_refresh_gate1.py
          software/python/tests/test_ppu_single_active_asset_set_gate1.py
          software/python/tests/test_ppu_active_fpga_handoff_gate1.py
          software/python/tests/test_ppu_fpga_root_handoff_gate1.py
          scripts/tests/test_fpga_image_root.py
          software/python/tests/test_fpga_golden_device_pin_b1.py
          software/python/tests/test_z2_bootstrap_deployment_call_graph.py
          software/python/tests/test_z2_hil_artifact_provenance_contract.py

  factory-bundle:
    needs: bootstrap-scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build factory Bootstrap bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          version="0.1.0"
          identity="${version}-${GITHUB_SHA:0:12}"
          root="$RUNNER_TEMP/plasma-ppu-bootstrap-${identity}"
          mkdir -p "$root/scripts"
          cp \
            scripts/ppu-bootstrap.py \
            scripts/ppu-bootstrap-service.py \
            scripts/ppu-bootstrap-deployment.py \
            scripts/ppu-bootstrap-kit.py \
            scripts/ppu-bootstrap-installer.py \
            scripts/ppu_unified_deployment.py \
            scripts/ppu-z2-installer.py \
            scripts/ppu-z2-installer-core.py \
            scripts/ppu_asset_set.py \
            scripts/ppu_owner_authorization.py \
            scripts/ppu_asset_execution.py \
            scripts/ppu_privileged_source.py \
            scripts/ppu-privileged-source-install.py \
            scripts/ppu_package_launcher.py \
            scripts/ppu_package_entry.py \
            scripts/ppu_package_unit_helper.py \
            scripts/ppu_package_units.py \
            scripts/ppu_package_action.py \
            scripts/ppu_site_worker.py \
            scripts/ppu_site_worker_service.py \
            scripts/ppu_site_engine.py \
            scripts/ppu_opf_reference_openocd.py \
            scripts/ppu_opf_site_session.py \
            scripts/ppu_provider_contract.py \
            scripts/ppu_provider_options.py \
            scripts/ppu_site_adapter_abi5.py \
            scripts/ppu_site_recovery.py \
            scripts/ppu_fpga_qualification.py \
            scripts/ppu-fpga-image-contracts.json \
            "$root/scripts/"
          # B2 static FPGA qualification reuses the protected Root parser.
          mkdir -p "$root/scripts/pl/hil"
          cp \
            pl/hil/fpga_image_root.py \
            pl/hil/fpga_image_guard.py \
            pl/hil/fpga_image_admission.py \
            "$root/scripts/pl/hil/"
          # Immutable privileged Root source is shipped as source-only data.
          mkdir -p "$root/scripts/software/python/plasma_interfaces" "$root/scripts/z2"
          cp software/python/plasma_interfaces/__init__.py \
             software/python/plasma_interfaces/linux_mmio.py \
             "$root/scripts/software/python/plasma_interfaces/"
          cp scripts/z2/plasma-path2-root-entry "$root/scripts/z2/"
          # Generic B3 capability belongs to Bootstrap, not any test ZIP.
          cp scripts/ppu-bundle-install-policy.json "$root/scripts/"
          python - "$root/manifest.json" "$version" "$GITHUB_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          path, version, git_sha = sys.argv[1:]
          payload = {
              "schema_version": 1,
              "product": "plasma-ppu-bootstrap",
              "bootstrap_version": version,
              "git_sha": git_sha,
              "python_min": "3.10",
              "runtime_included": False,
              "control_token_included": False,
              "fpga_update": False,
              "publisher_authenticity": "not_qualified",
          }
          Path(path).write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          (
            cd "$root"
            { echo manifest.json; find scripts -type f | LC_ALL=C sort; } \
              | xargs sha256sum > SHA256SUMS
          )
          artifact="$RUNNER_TEMP/plasma-ppu-bootstrap-${identity}.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$artifact" "plasma-ppu-bootstrap-${identity}"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$(basename "$artifact")" > "$(basename "$artifact").sha256"
          )
          printf 'artifact=%s\n' "$artifact" >> "$GITHUB_OUTPUT"
          printf 'sidecar=%s\n' "$artifact.sha256" >> "$GITHUB_OUTPUT"
          printf 'root=%s\n' "$root" >> "$GITHUB_OUTPUT"

      - name: Prove bundle installs only the factory layer
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$RUNNER_TEMP/bootstrap-install-proof"
          mkdir -p "$sandbox"
          python scripts/ppu-bootstrap-installer.py \
            --source-root "${{ steps.bundle.outputs.root }}/scripts" \
            --host 192.168.2.99 \
            --install-root "$sandbox/opt/plasma/bootstrap" \
            --state-root "$sandbox/var/lib/plasma-bootstrap" \
            --systemd-unit "$sandbox/etc/systemd/system/plasma-bootstrap.service" \
            > "$RUNNER_TEMP/bootstrap-install-evidence.json"
          test -f "$sandbox/etc/systemd/system/plasma-bootstrap.service"
          test -f "$sandbox/opt/plasma/bootstrap/ppu_unified_deployment.py"
          test -f "$sandbox/opt/plasma/bootstrap/ppu-z2-installer-core.py"
          test -f "$sandbox/opt/plasma/bootstrap/ppu-bundle-install-policy.json"
          test -f "$sandbox/opt/plasma/bootstrap/ppu_fpga_qualification.py"
          test -f "$sandbox/opt/plasma/bootstrap/ppu-fpga-image-contracts.json"
          test -f "$sandbox/opt/plasma/bootstrap/pl/hil/fpga_image_root.py"
          test "$(stat -c '%a' "$sandbox/opt/plasma/bootstrap/ppu-fpga-image-contracts.json")" = "644"
          test "$(stat -c '%a' "$sandbox/opt/plasma/bootstrap/ppu-bundle-install-policy.json")" = "600"
          test ! -e "$sandbox/opt/plasma/current"
          grep -q 'ppu-bootstrap-service.py serve --host 192.168.2.99 --port 18081' \
            "$sandbox/etc/systemd/system/plasma-bootstrap.service"

      - name: Upload factory Bootstrap bundle
        uses: actions/upload-artifact@v4
        with:
          name: ppu-bootstrap-factory-bundle
          path: |
            ${{ steps.bundle.outputs.artifact }}
            ${{ steps.bundle.outputs.sidecar }}
            ${{ runner.temp }}/bootstrap-install-evidence.json
          if-no-files-found: error
          retention-days: 14

  manager-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Manager package and tests
        run: python -m pip install "./software/python[dev]"
      - name: Run Manager Bootstrap policy regressions
        run: python -m pytest -q software/python/tests/test_manager_bootstrap.py
      - name: Prove production Manager entrypoint composes current Manager with Bootstrap routes
        run: >-
          python -c
          'import importlib.metadata as m; eps=m.entry_points(group="console_scripts", name="plasma-manager"); ep=next(iter(eps)); assert ep.value == "plasma_manager.bootstrap_server:main", ep.value'
