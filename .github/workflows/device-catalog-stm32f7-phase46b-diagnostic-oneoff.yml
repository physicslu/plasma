name: STM32F7 Phase 4.6B live discovery one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f7-phase46b-discovery
    paths:
      - .github/workflows/device-catalog-stm32f7-phase46b-diagnostic-oneoff.yml

permissions:
  contents: read

jobs:
  live-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate offline Phase 4.6A and 4.6B contracts
        env:
          PYTHONPATH: data/device-catalog/research
        run: |
          python data/device-catalog/research/test_stm32f7_phase4_6a_foundation.py
          python data/device-catalog/research/test_stm32f7_phase4_6b_discovery.py
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'playwright==1.62.0'
          python -m playwright install --with-deps chromium
      - name: Run bounded 16-target STM32F7 official-ST discovery
        env:
          PYTHONPATH: data/device-catalog/research
        run: |
          mkdir -p /tmp/stm32f7-phase4.6b-live/evidence
          set +e
          xvfb-run -a python data/device-catalog/research/run_stm32f7_phase4_6b_browser_discovery.py \
            --output /tmp/stm32f7-phase4.6b-live/live-summary.json \
            --evidence-dir /tmp/stm32f7-phase4.6b-live/evidence \
            --timeout 90 \
            --delay 2
          rc=$?
          set -e
          printf '%s\n' "$rc" > /tmp/stm32f7-phase4.6b-live/exit-code.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('/tmp/stm32f7-phase4.6b-live')
          metadata = {
              'github_sha': os.environ.get('GITHUB_SHA'),
              'github_run_id': os.environ.get('GITHUB_RUN_ID'),
              'github_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'github_workflow': os.environ.get('GITHUB_WORKFLOW'),
              'diagnostic_run_id': '34325478619',
              'diagnostic_artifact_id': '10093586727',
              'diagnostic_artifact_zip_sha256': '05258ee448dbfbb2033ab67e1ccd7b2b14b9370ad979f21617891ed82327ff4a',
          }
          (root / 'execution-metadata.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Upload live discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32f7-phase4.6b-live-discovery-20260909
          path: /tmp/stm32f7-phase4.6b-live
          if-no-files-found: error
      - name: Enforce commercial identity acquisition result
        if: always()
        run: |
          test -f /tmp/stm32f7-phase4.6b-live/exit-code.txt
          test "$(cat /tmp/stm32f7-phase4.6b-live/exit-code.txt)" = "0"
