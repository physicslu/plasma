name: STM32F7 Phase 4.6B retained replay one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f7-phase46b-discovery
    paths:
      - .github/workflows/device-catalog-stm32f7-phase46b-diagnostic-oneoff.yml

permissions:
  contents: read

jobs:
  retained-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Phase 4.6A foundation
        run: python data/device-catalog/research/test_stm32f7_phase4_6a_foundation.py
      - name: Validate Phase 4.6B parser and bounded discovery contracts
        run: |
          python data/device-catalog/research/test_stm32f7_dual_surface_evidence.py
          python data/device-catalog/research/test_stm32f7_phase4_6b_discovery.py
      - name: Replay retained Phase 4.6B evidence fail-closed
        run: python data/device-catalog/research/validate_stm32f7_phase4_6b_retained_evidence.py
      - name: Assert Phase 4.6B did not publish STM32F7 to Production
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/device-catalog/production/icpn-v1-manifest.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          sources = manifest.get('sources', [])
          assert all(item.get('family') != 'STM32F7' for item in sources), 'STM32F7 unexpectedly published during Phase 4.6B'
          assert sum(int(item['row_count']) for item in sources) == 544, 'Production exact ICPN count drifted during Phase 4.6B'
          print('Phase 4.6B retained replay PASS; Production remains 544 exact ICPNs with STM32F7 absent')
          PY
