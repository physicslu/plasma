name: STM32F7 Phase 4.6B retained-evidence one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f7-phase46b-discovery
    paths:
      - .github/workflows/device-catalog-stm32f7-phase46b-diagnostic-oneoff.yml

permissions:
  contents: write
  actions: read

jobs:
  retain-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ARTIFACT_ID: '10094200419'
      ARTIFACT_SHA256: '998670e0d8fc6331d60a080dccd48f0dbeb2e967a0169af4e177d9e60f30bf3f'
      LIVE_RUN_ID: '34326658883'
      LIVE_HEAD_SHA: '776ebeafe2156a6cfdea5340dc2c8921e45725ed'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-stm32f7-phase46b-discovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate current Phase 4.6A and 4.6B offline contracts
        env:
          PYTHONPATH: data/device-catalog/research
        run: |
          python data/device-catalog/research/test_stm32f7_phase4_6a_foundation.py
          python data/device-catalog/research/test_stm32f7_dual_surface_evidence.py
          python data/device-catalog/research/test_stm32f7_phase4_6b_discovery.py
      - name: Download exact immutable live artifact and verify ZIP digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/stm32f7-phase4.6b-artifact
          curl --fail-with-body --location \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/stm32f7-phase4.6b-artifact.zip
          echo "${ARTIFACT_SHA256}  /tmp/stm32f7-phase4.6b-artifact.zip" | sha256sum --check --strict
          unzip -q /tmp/stm32f7-phase4.6b-artifact.zip -d /tmp/stm32f7-phase4.6b-artifact
      - name: Deterministically retain disposition-aware evidence
        env:
          PYTHONPATH: data/device-catalog/research
        run: |
          set -Eeuo pipefail
          python data/device-catalog/research/retain_stm32f7_phase4_6b_artifact.py \
            --artifact-root /tmp/stm32f7-phase4.6b-artifact \
            --artifact-id "${ARTIFACT_ID}" \
            --artifact-zip-sha256 "${ARTIFACT_SHA256}" \
            --workflow-run-id "${LIVE_RUN_ID}" \
            --executed-git-sha "${LIVE_HEAD_SHA}" \
            | tee /tmp/stm32f7-phase4.6b-retention-report.json
      - name: Commit only compact retained evidence
        run: |
          set -Eeuo pipefail
          git config user.name 'plasma-ci'
          git config user.email 'plasma-ci@users.noreply.github.com'
          git add \
            data/device-catalog/research/stm32f7-phase4.6b-discovery-baseline.json \
            data/device-catalog/research/evidence/stm32f7-phase4.6b-official-st-discovery-live-2026-09-09
          git diff --cached --check
          git diff --cached --quiet && { echo 'ERROR: retention produced no changes' >&2; exit 1; }
          git commit -m 'device-catalog: retain STM32F7 Phase 4.6B evidence'
          git push origin HEAD:agent/device-catalog-stm32f7-phase46b-discovery
