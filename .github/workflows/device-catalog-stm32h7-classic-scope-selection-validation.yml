name: STM32H7-classic scope selection validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32-post-h7rs-production-prestate.json'
      - 'data/device-catalog/research/stm32h7-classic-scope-selection.json'
      - 'data/device-catalog/research/stm32h7_classic_scope_selection.py'
      - 'data/device-catalog/research/validate_stm32h7_classic_scope_selection.py'
      - 'data/device-catalog/research/stm32h7-partitioned-scope-selection.json'
      - '.github/workflows/device-catalog-stm32h7-classic-scope-selection-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/stm32-post-h7rs-production-prestate.json'
      - 'data/device-catalog/research/stm32h7-classic-scope-selection.json'
      - 'data/device-catalog/research/stm32h7_classic_scope_selection.py'
      - 'data/device-catalog/research/validate_stm32h7_classic_scope_selection.py'
      - 'data/device-catalog/research/stm32h7-partitioned-scope-selection.json'
      - '.github/workflows/device-catalog-stm32h7-classic-scope-selection-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STM32H7-classic remaining-scope selection
        run: python data/device-catalog/research/validate_stm32h7_classic_scope_selection.py
