name: STM32U5 canonical admission bounded probe

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32u5_admission_probe.py'
      - 'data/device-catalog/research/stm32u5_metadata_policy.py'
      - 'data/device-catalog/research/stm32u5-metadata-policy-baseline.json'
      - 'data/device-catalog/research/stm32u5-metadata-authority-delta-resolution.json'
      - 'data/device-catalog/research/stm32u5-security-scope-foundation.json'
      - 'data/device-catalog/research/openocd-parts-canonical.csv'
      - '.github/workflows/device-catalog-stm32u5-canonical-admission-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe STM32U5 canonical admission routing
        working-directory: data/device-catalog/research
        run: python stm32u5_admission_probe.py
