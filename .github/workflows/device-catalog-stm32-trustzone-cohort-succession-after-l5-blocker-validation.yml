name: STM32 TrustZone cohort succession after L5 blocker validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32-trustzone-cohort-succession-after-l5-blocker.json'
      - 'data/device-catalog/research/validate_stm32_trustzone_cohort_succession_after_l5_blocker.py'
      - 'data/device-catalog/research/device-catalog-stm32-trustzone-cohort-succession-after-l5-blocker.md'
      - 'data/device-catalog/research/stm32-trustzone-cohort-gate1-qualification.json'
      - 'data/device-catalog/research/stm32l5-hil-fixture-acquisition-provenance.json'
      - '.github/workflows/device-catalog-stm32-trustzone-cohort-succession-after-l5-blocker-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/stm32-trustzone-cohort-succession-after-l5-blocker.json'
      - 'data/device-catalog/research/validate_stm32_trustzone_cohort_succession_after_l5_blocker.py'
      - 'data/device-catalog/research/device-catalog-stm32-trustzone-cohort-succession-after-l5-blocker.md'
      - 'data/device-catalog/research/stm32-trustzone-cohort-gate1-qualification.json'
      - 'data/device-catalog/research/stm32l5-hil-fixture-acquisition-provenance.json'
      - '.github/workflows/device-catalog-stm32-trustzone-cohort-succession-after-l5-blocker-validation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate TrustZone cohort succession
        run: python data/device-catalog/research/validate_stm32_trustzone_cohort_succession_after_l5_blocker.py
      - name: Enforce zero Production writes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- data/device-catalog/production/)"
          test -z "$changed" || { echo "Production writes are forbidden in TrustZone succession gate:"; echo "$changed"; exit 1; }
