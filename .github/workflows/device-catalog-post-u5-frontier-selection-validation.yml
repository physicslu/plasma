name: STM32 post-U5 frontier selection validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32-post-u5-frontier-selection.json'
      - 'data/device-catalog/research/stm32-post-u5-production-prestate.json'
      - 'data/device-catalog/research/stm32_post_u5_frontier_selection.py'
      - 'data/device-catalog/research/validate_stm32_post_u5_frontier_selection.py'
      - 'data/device-catalog/research/stm32-cross-family-prioritization-baseline.json'
      - '.github/workflows/device-catalog-post-u5-frontier-selection-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/stm32-post-u5-frontier-selection.json'
      - 'data/device-catalog/research/stm32-post-u5-production-prestate.json'
      - 'data/device-catalog/research/stm32_post_u5_frontier_selection.py'
      - 'data/device-catalog/research/validate_stm32_post_u5_frontier_selection.py'
      - 'data/device-catalog/research/stm32-cross-family-prioritization-baseline.json'
      - '.github/workflows/device-catalog-post-u5-frontier-selection-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen post-U5 frontier selection
        working-directory: data/device-catalog/research
        run: python validate_stm32_post_u5_frontier_selection.py
