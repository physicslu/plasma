name: IC Support validation

on:
  push:
    branches:
      - main
    paths:
      - "data/ic-support/**"
      - "data/device-catalog/production/icpn-v1-manifest.json"
      - "data/device-catalog/research/stm32f1-commercial-icpn.csv"
      - "data/device-catalog/research/stm32f4-commercial-icpn.csv"
      - "software/python/plasma_core/ic_support.py"
      - "software/python/plasma_handlers/programming.py"
      - "software/python/plasma_handlers/stm32.py"
      - "software/python/plasma_interfaces/openocd.py"
      - "software/python/plasma_interfaces/openocd_plan.py"
      - "software/python/plasma_interfaces/openocd_executor.py"
      - "software/python/plasma_server/execution_router.py"
      - "software/python/plasma_server/site_manager.py"
      - "software/python/tests/test_ic_support_resolver.py"
      - "software/python/tests/test_execution_router.py"
      - "software/python/tests/test_openocd_plan.py"
      - "software/python/tests/test_openocd_executor.py"
      - ".github/workflows/ic-support-validation.yml"
  pull_request:
    paths:
      - "data/ic-support/**"
      - "data/device-catalog/production/icpn-v1-manifest.json"
      - "data/device-catalog/research/stm32f1-commercial-icpn.csv"
      - "data/device-catalog/research/stm32f4-commercial-icpn.csv"
      - "software/python/plasma_core/ic_support.py"
      - "software/python/plasma_handlers/programming.py"
      - "software/python/plasma_handlers/stm32.py"
      - "software/python/plasma_interfaces/openocd.py"
      - "software/python/plasma_interfaces/openocd_plan.py"
      - "software/python/plasma_interfaces/openocd_executor.py"
      - "software/python/plasma_server/execution_router.py"
      - "software/python/plasma_server/site_manager.py"
      - "software/python/tests/test_ic_support_resolver.py"
      - "software/python/tests/test_execution_router.py"
      - "software/python/tests/test_openocd_plan.py"
      - "software/python/tests/test_openocd_executor.py"
      - ".github/workflows/ic-support-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-ic-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check IC Support diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Validate IC Support pilot
        run: python data/ic-support/validate.py
      - name: Validate IC Evidence Pack contract
        run: python data/ic-support/evidence-pack/validate_contract.py
      - name: Validate deterministic document preprocessing
        run: python data/ic-support/evidence-pack/validate_preprocessing.py
      - name: Validate deterministic DS5319 semantic Evidence Pack
        run: python data/ic-support/evidence-pack/validate_semantic_pack.py
      - name: Validate Evidence Pack A/B benchmark harness
        run: python data/ic-support/benchmarks/stm32f103c/test_ab_benchmark.py
      - name: Validate STM32F103C source lock
        run: python data/ic-support/benchmarks/stm32f103c/validate_source_lock.py
      - name: Compare STM32F103C benchmark
        run: python data/ic-support/compare_benchmark.py
      - name: Run IC Support regression
        run: python data/ic-support/test_ic_support.py
      - name: Report production IC Support coverage
        run: python data/ic-support/coverage_inventory.py --summary
      - name: Test production IC Support coverage normalization
        run: python data/ic-support/test_coverage_inventory.py
      - name: Install Plasma runtime dependencies
        run: python -m pip install -e software/python
      - name: Resolve runtime IC Support pilot
        run: python -m plasma_core.ic_support --summary
      - name: Test runtime IC Support resolver
        run: python software/python/tests/test_ic_support_resolver.py
      - name: Test profile-driven OpenOCD plan compiler
        run: python software/python/tests/test_openocd_plan.py
      - name: Test software-only OpenOCD plan executor
        run: python software/python/tests/test_openocd_executor.py
      - name: Test resolver-driven execution admission
        run: python software/python/tests/test_execution_router.py
      - name: Test isolated extraction contract
        run: python data/ic-support/benchmarks/stm32f103c/test_extraction_contract.py
      - name: Test blind extraction workspace
        run: python data/ic-support/benchmarks/stm32f103c/test_blind_workspace.py
