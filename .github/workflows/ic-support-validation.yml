name: AI IC Support research validation

on:
  push:
    branches:
      - main
    paths:
      - "data/ic-support/**"
      - "data/device-catalog/research/stm32f1-commercial-icpn.csv"
      - ".github/workflows/ic-support-validation.yml"
  pull_request:
    paths:
      - "data/ic-support/**"
      - "data/device-catalog/research/stm32f1-commercial-icpn.csv"
      - ".github/workflows/ic-support-validation.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-ai-ic-support-research:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check AI IC Support research diff whitespace
        run: git diff --check origin/main...HEAD
      - name: Validate IC Support pilot
        run: python data/ic-support/validate.py
      - name: Validate IC Support semantic invariants
        run: python data/ic-support/semantic_validate.py
      - name: Run IC Support semantic-validator regression
        run: python data/ic-support/test_semantic_validate.py
      - name: Validate Programming Execution IR research contract
        run: python data/ic-support/execution-ir/validate.py
      - name: Run Programming Execution IR research regressions
        run: python data/ic-support/execution-ir/test_validate.py
      - name: Validate IC Evidence Pack contract
        run: python data/ic-support/evidence-pack/validate_contract.py
      - name: Validate deterministic document preprocessing
        run: python data/ic-support/evidence-pack/validate_preprocessing.py
      - name: Validate deterministic DS5319 semantic Evidence Pack
        run: python data/ic-support/evidence-pack/validate_semantic_pack.py
      - name: Validate Evidence Pack A/B benchmark harness
        run: |
          python data/ic-support/benchmarks/stm32f103c/test_ab_benchmark.py
          python data/ic-support/benchmarks/stm32f103c/test_ab_score_pipeline.py
          python data/ic-support/benchmarks/stm32f103c/test_ab_timeout.py
          python data/ic-support/benchmarks/stm32f103c/test_ollama_context_probe.py
          python data/ic-support/benchmarks/stm32f103c/test_ollama_extraction_run.py
          python data/ic-support/benchmarks/stm32f103c/test_evidence_citation_paths.py
          python data/ic-support/benchmarks/stm32f103c/test_canonicalize_semantic_facts.py
          python data/ic-support/benchmarks/stm32f103c/test_semantic_v2_pipeline.py
          python data/ic-support/benchmarks/stm32f103c/test_semantic_v3_pipeline.py
          python data/ic-support/benchmarks/stm32f103c/test_semantic_v4_relationship_pipeline.py
          python data/ic-support/benchmarks/stm32f103c/test_semantic_v5_memory_relationship_pipeline.py
          python data/ic-support/benchmarks/stm32f103c/test_semantic_v6_programming_relationship_pipeline.py
          python data/ic-support/benchmarks/stm32f103c/test_semantic_v7_option_relationship_pipeline.py
          python data/ic-support/benchmarks/stm32f103c/test_semantic_v8_security_relationship_pipeline.py
          python data/ic-support/benchmarks/stm32f103c/test_retained_semantic_v8.py
          python data/ic-support/benchmarks/stm32f103c/test_semantic_v9_device_identity_ontology.py
          python data/ic-support/benchmarks/nxp-kl25/test_foundation.py
          python data/ic-support/benchmarks/nxp-kl25/test_discovery.py
          python data/ic-support/benchmarks/nxp-kl25/test_evidence_unit_construction.py
          python data/ic-support/benchmarks/nxp-kl25/test_reviewed_evidence_units.py
          python data/ic-support/benchmarks/nxp-kl25/test_applicability.py
          python data/ic-support/benchmarks/nxp-kl25/test_applicability_binding.py
      - name: Validate NXP KL25 deterministic Evidence Packs
        run: python data/ic-support/benchmarks/nxp-kl25/test_evidence_pack.py
      - name: Validate NXP KL25 pre-AI CI boundary
        run: python data/ic-support/benchmarks/nxp-kl25/test_pre_ai_ci.py
      - name: Validate retained NXP KL25 Evidence Pack provenance
        run: python data/ic-support/benchmarks/nxp-kl25/test_retained_evidence_pack.py
      - name: Validate STM32F103C source lock
        run: python data/ic-support/benchmarks/stm32f103c/validate_source_lock.py
      - name: Compare STM32F103C benchmark
        run: python data/ic-support/compare_benchmark.py
      - name: Run IC Support research regression
        run: python data/ic-support/test_ic_support.py
      - name: Report research coverage projection against current catalog
        run: python data/ic-support/coverage_inventory.py --summary
      - name: Test research coverage normalization
        run: python data/ic-support/test_coverage_inventory.py
      - name: Test isolated extraction contract
        run: python data/ic-support/benchmarks/stm32f103c/test_extraction_contract.py
      - name: Test blind extraction workspace
        run: python data/ic-support/benchmarks/stm32f103c/test_blind_workspace.py

  verify-official-source-lock:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify locked official PDF bytes
        run: python data/ic-support/evidence/source_integrity.py verify
