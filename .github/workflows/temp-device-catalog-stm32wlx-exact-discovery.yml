name: TEMP STM32WLX exact ICPN discovery

on:
  push:
    branches:
      - agent/stm32wlx-exact-icpn-discovery

permissions:
  contents: read

concurrency:
  group: temp-stm32wlx-exact-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded browser acquisition dependencies
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium

      - name: Run deterministic STM32WLX exact-ICPN discovery
        id: acquire
        continue-on-error: true
        run: |
          rm -rf .artifacts/stm32wlx-exact-discovery
          mkdir -p .artifacts/stm32wlx-exact-discovery
          xvfb-run -a python data/device-catalog/research/stm32wlx_exact_icpn_discovery.py \
            --output-dir .artifacts/stm32wlx-exact-discovery \
            --delay-seconds 1.0 \
            --timeout-seconds 90

      - name: Emit retained candidate evidence to workflow log
        if: always() && hashFiles('.artifacts/stm32wlx-exact-discovery/*.json') != ''
        run: |
          python - <<'PY'
          import base64
          import pathlib
          root = pathlib.Path(".artifacts/stm32wlx-exact-discovery")
          for path in sorted(root.glob("*.json")):
              print(f"EVIDENCE_FILE_BEGIN {path.name}")
              print(base64.b64encode(path.read_bytes()).decode("ascii"))
              print(f"EVIDENCE_FILE_END {path.name}")
          PY

      - name: Upload exact-discovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32wlx-exact-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: .artifacts/stm32wlx-exact-discovery/*.json

      - name: Enforce exact-discovery gate
        if: always()
        run: |
          if [ "${{ steps.acquire.outcome }}" != "success" ]; then
            echo "STM32WLX exact discovery requires manual review." >&2
            exit 1
          fi
