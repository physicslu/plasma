name: Microchip official Product Data API bounded probe v1

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/microchip_product_api_probe_v1.py'
      - 'data/device-catalog/research/test_microchip_product_api_probe_v1.py'
      - '.github/workflows/device-catalog-microchip-api-probe-v1.yml'
      - 'data/device-catalog/research/MICROCHIP_BULK_ACQUISITION_V1.md'
      - 'data/device-catalog/research/microchip-bulk-source-registry-v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-public-api-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate probe contract
        run: |
          python -m py_compile data/device-catalog/research/microchip_product_api_probe_v1.py data/device-catalog/research/test_microchip_product_api_probe_v1.py
          python -m unittest discover -s data/device-catalog/research -p 'test_microchip_product_api_probe_v1.py' -v
      - name: Capture fixed official PIC10F202 query and all reported pages
        run: python data/device-catalog/research/microchip_product_api_probe_v1.py --output-dir /tmp/microchip-api-probe
      - name: Upload raw response pages and reconciliation summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: microchip-product-api-probe
          path: /tmp/microchip-api-probe/
          if-no-files-found: warn
          retention-days: 7
