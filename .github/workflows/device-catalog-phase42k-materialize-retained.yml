name: Device catalog Phase 4.2K materialize retained evidence

on:
  push:
    branches:
      - agent/device-catalog-phase4.2k-f407-f417-i-admission
    paths:
      - ".github/workflows/device-catalog-phase42k-materialize-retained.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-phase4.2k-f407-f417-i-admission
      - name: Download and verify retained artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase42k-artifact
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/physicslu/plasma/actions/artifacts/9876857498/zip \
            -o /tmp/phase42k-retained.zip
          echo '47ed30f923fb856637e9787cc1e2c916adf2a29f52570384718418a487704a22  /tmp/phase42k-retained.zip' | sha256sum -c -
          unzip -q /tmp/phase42k-retained.zip -d /tmp/phase42k-artifact
          test -f /tmp/phase42k-artifact/retained/manifest.json
      - name: Materialize immutable cohort
        run: |
          set -euo pipefail
          dest=data/device-catalog/research/evidence/stm32f4-phase4.2k-f407-f417-i-admission-live-2026-09-03
          test ! -e "$dest"
          mkdir -p "$dest"
          cp -a /tmp/phase42k-artifact/retained/. "$dest/"
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir "$dest" \
            --baseline data/device-catalog/research/stm32f4-phase4.2k-f407-f417-i-admission-baseline.json
      - name: Commit retained cohort
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/evidence/stm32f4-phase4.2k-f407-f417-i-admission-live-2026-09-03
          git diff --cached --quiet && { echo 'no retained evidence delta'; exit 1; }
          git commit -m 'device-catalog: retain Phase 4.2K official ST evidence'
          git push origin HEAD:agent/device-catalog-phase4.2k-f407-f417-i-admission
