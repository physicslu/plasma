name: STM32L1 L1.2 retained discovery validation

on:
  pull_request:
    paths:
      - "data/device-catalog/research/stm32l1_phase_l1_1_foundation.py"
      - "data/device-catalog/research/stm32l1-phase-l1.1-foundation-baseline.json"
      - "data/device-catalog/research/stm32l1_phase_l1_2_discovery.py"
      - "data/device-catalog/research/stm32l1_phase_l1_2_sharded.py"
      - "data/device-catalog/research/run_stm32l1_phase_l1_2_discovery.py"
      - "data/device-catalog/research/run_stm32l1_phase_l1_2_shard.py"
      - "data/device-catalog/research/aggregate_stm32l1_phase_l1_2_shards.py"
      - "data/device-catalog/research/test_stm32l1_phase_l1_2_discovery.py"
      - "data/device-catalog/research/test_stm32l1_phase_l1_2_sharded.py"
      - "data/device-catalog/research/validate_stm32l1_phase_l1_2_retained_evidence.py"
      - "data/device-catalog/research/stm32l1-phase-l1.2-discovery-baseline.json"
      - "data/device-catalog/research/stm32l1-post-l4-production-manifest-prestate.json"
      - "data/device-catalog/research/evidence/stm32l1-l1.2-official-st-discovery-live-2026-09-13/**"
      - "data/device-catalog/research/openocd-parts-canonical.csv"
      - ".github/workflows/device-catalog-stm32l1-l12-retained-validation.yml"
  push:
    branches: [main]
    paths:
      - "data/device-catalog/research/stm32l1_phase_l1_1_foundation.py"
      - "data/device-catalog/research/stm32l1-phase-l1.1-foundation-baseline.json"
      - "data/device-catalog/research/stm32l1_phase_l1_2_discovery.py"
      - "data/device-catalog/research/stm32l1_phase_l1_2_sharded.py"
      - "data/device-catalog/research/run_stm32l1_phase_l1_2_discovery.py"
      - "data/device-catalog/research/run_stm32l1_phase_l1_2_shard.py"
      - "data/device-catalog/research/aggregate_stm32l1_phase_l1_2_shards.py"
      - "data/device-catalog/research/test_stm32l1_phase_l1_2_discovery.py"
      - "data/device-catalog/research/test_stm32l1_phase_l1_2_sharded.py"
      - "data/device-catalog/research/validate_stm32l1_phase_l1_2_retained_evidence.py"
      - "data/device-catalog/research/stm32l1-phase-l1.2-discovery-baseline.json"
      - "data/device-catalog/research/stm32l1-post-l4-production-manifest-prestate.json"
      - "data/device-catalog/research/evidence/stm32l1-l1.2-official-st-discovery-live-2026-09-13/**"
      - "data/device-catalog/research/openocd-parts-canonical.csv"
      - ".github/workflows/device-catalog-stm32l1-l12-retained-validation.yml"

permissions:
  contents: read

jobs:
  retained-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run L1.2 negative controls
        run: |
          python data/device-catalog/research/test_stm32l1_phase_l1_2_discovery.py
          python data/device-catalog/research/test_stm32l1_phase_l1_2_sharded.py
      - name: Replay deterministic target boundary and hard-lock retained evidence
        run: python data/device-catalog/research/validate_stm32l1_phase_l1_2_retained_evidence.py
