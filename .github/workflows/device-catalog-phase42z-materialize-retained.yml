name: Device catalog Phase 4.2Z materialize retained evidence
on:
  push:
    branches: [agent/device-catalog-phase4.2z-nh-tfbga216-admission]
    paths: [".github/workflows/device-catalog-phase42z-materialize-retained.yml"]
  workflow_dispatch:
permissions: {actions: read, contents: write}
jobs:
  materialize:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2z-nh-tfbga216-admission, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: phase42z-nh-tfbga216-retained, path: /tmp/phase42z, repository: physicslu/plasma, run-id: 33874543611, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Materialize exact retained evidence
        run: |
          set -euo pipefail
          dst=data/device-catalog/research/evidence/stm32f4-phase4.2z-nh-tfbga216-admission-batch1-live-2026-09-04
          test -f /tmp/phase42z/retained/manifest.json
          test "$(python -c "import json; print(json.load(open('/tmp/phase42z/retained/manifest.json'))['evidence_id'])")" = "stm32f4-phase4.2z-nh-tfbga216-admission-batch1-2026-09-04-retained-20260904T124757Z-6a606b9"
          test ! -e "$dst"
          mkdir -p "$dst"
          cp -a /tmp/phase42z/retained/. "$dst/"
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir "$dst" --baseline data/device-catalog/research/stm32f4-phase4.2z-nh-tfbga216-admission-baseline.json
      - name: Commit retained evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/evidence/stm32f4-phase4.2z-nh-tfbga216-admission-batch1-live-2026-09-04
          git commit -m 'device-catalog: retain Phase 4.2Z official ST evidence'
          git push origin HEAD:agent/device-catalog-phase4.2z-nh-tfbga216-admission
