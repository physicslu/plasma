name: STM32F3 Phase 4.4D publication proposal one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f3-phase44d-publication

permissions:
  contents: read

jobs:
  proposal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute plan and canonical artifact
        env:
          PYTHONPATH: data/device-catalog/research
        run: |
          rm -f data/device-catalog/research/stm32f3-commercial-icpn.csv
          python data/device-catalog/research/stm32f3_phase4_4d_admission.py \
            --output /tmp/stm32f3-phase4.4d-admission-plan.json
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          from device_catalog_admission_framework import write_canonical_dataset
          from stm32f3_admission_policy import CANONICAL_FIELDS

          plan_path = Path('/tmp/stm32f3-phase4.4d-admission-plan.json')
          canonical = Path('/tmp/stm32f3-commercial-icpn.csv')
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          with canonical.open('w', newline='', encoding='utf-8') as handle:
              csv.DictWriter(handle, fieldnames=CANONICAL_FIELDS, lineterminator='\n').writeheader()
          first = write_canonical_dataset(plan=plan, canonical_path=canonical)
          second = write_canonical_dataset(plan=plan, canonical_path=canonical)
          plan_sha = hashlib.sha256(plan_path.read_bytes()).hexdigest()
          canonical_sha = hashlib.sha256(canonical.read_bytes()).hexdigest()
          assert plan_sha == 'd8cdab4d4c8f4fbecdc7fbf58ca7c9b58c8089389f5c8c36f0c7b7cd067b1495', plan_sha
          assert canonical_sha == 'c371b7a1c3b271afb9c8c823a4d12071be57da1aa11d138b59d39911489e1ee8', canonical_sha
          assert first['status'] == 'written' and first['rows_before'] == 0 and first['rows_after'] == 10
          assert second['status'] == 'no_op'
          print('PLAN_SHA256=' + plan_sha)
          print('CANONICAL_SHA256=' + canonical_sha)
          print('PUBLICATION_REPLAY=CLEAN')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stm32f3-phase4.4d-publication-proposal
          path: |
            /tmp/stm32f3-phase4.4d-admission-plan.json
            /tmp/stm32f3-commercial-icpn.csv
          retention-days: 2
