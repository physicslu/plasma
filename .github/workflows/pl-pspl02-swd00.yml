name: PL PSPL-02 SWD-00 offline RTL

on:
  pull_request:
    paths:
      - "pl/rtl/bus/**"
      - "pl/rtl/site/**"
      - "pl/rtl/site/swd_waveform_engine.sv"
      - "pl/rtl/bus/swd_command_axi_lite.sv"
      - "pl/rtl/site/pl_loopback_responder.sv"
      - "pl/sim/swd_command_axi_tb.sv"
      - "pl/verification/sva/pl_axi_waveform_checks.sv"
      - "pl/verification/cocotb/test_swd_command.py"
      - "pl/tests/test_z2_control_waveform_build.py"
      - "pl/verification/cocotb/test_pl_control.py"
      - "pl/verification/cocotb/test_swd_waveform.py"
      - "pl/verification/test_pspl02_swd00_rtl.py"
      - "pl/projects/z2-control-waveform/**"
      - "pl/hil/pspl02/**"
      - "pl/hil/swd04/contract.py"
      - "pl/hil/swd04/collect.py"
      - "pl/hil/swd04/staging.py"
      - "pl/tests/test_pspl02_hil.py"
      - "pl/verification/test_pspl02_hil_rtl.py"
      - "pl/verification/cocotb/pspl02_hil_cocotb.py"
      - "docs/development/pspl02-swd00-hil-runbook.md"
      - "pl/projects/swd-transaction/**"
      - "pl/verification/models/**"
      - "pl/verification/test_swd_transaction_rtl.py"
      - "pl/verification/cocotb/test_swd_transaction.py"
      - "pl/verification/sva/swd_transaction_checks.sv"
      - "pl/sim/swd_transaction_tb.sv"
      - "pl/tests/test_swd_reference.py"
      - ".github/workflows/pl-pspl02-swd00.yml"
  push:
    branches: [main]
    paths:
      - "pl/rtl/bus/**"
      - "pl/rtl/site/**"
      - "pl/rtl/site/swd_waveform_engine.sv"
      - "pl/rtl/bus/swd_command_axi_lite.sv"
      - "pl/rtl/site/pl_loopback_responder.sv"
      - "pl/sim/swd_command_axi_tb.sv"
      - "pl/verification/sva/pl_axi_waveform_checks.sv"
      - "pl/verification/cocotb/test_swd_command.py"
      - "pl/tests/test_z2_control_waveform_build.py"
      - "pl/verification/cocotb/test_pl_control.py"
      - "pl/verification/cocotb/test_swd_waveform.py"
      - "pl/verification/test_pspl02_swd00_rtl.py"
      - "pl/projects/z2-control-waveform/**"
      - "pl/hil/pspl02/**"
      - "pl/hil/swd04/contract.py"
      - "pl/hil/swd04/collect.py"
      - "pl/hil/swd04/staging.py"
      - "pl/tests/test_pspl02_hil.py"
      - "pl/verification/test_pspl02_hil_rtl.py"
      - "pl/verification/cocotb/pspl02_hil_cocotb.py"
      - "docs/development/pspl02-swd00-hil-runbook.md"
      - "pl/projects/swd-transaction/**"
      - "pl/verification/models/**"
      - "pl/verification/test_swd_transaction_rtl.py"
      - "pl/verification/cocotb/test_swd_transaction.py"
      - "pl/verification/sva/swd_transaction_checks.sv"
      - "pl/sim/swd_transaction_tb.sv"
      - "pl/tests/test_swd_reference.py"
      - ".github/workflows/pl-pspl02-swd00.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline simulators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator iverilog
          python3 -m pip install pytest 'cocotb==1.9.2' 'cocotb-test==0.2.6'
      - name: RTL lint and elaboration
        run: |
          verilator --lint-only --sv -Wall -Wno-UNUSEDSIGNAL --top-module pl_control_axi_lite pl/rtl/bus/pl_control_axi_lite.sv
          verilator --lint-only --sv -Wall -Wno-UNUSEDSIGNAL --top-module swd_waveform_engine pl/rtl/site/swd_waveform_engine.sv
          verilator --lint-only --sv -Wall -Wno-UNUSEDSIGNAL --top-module swd_command_axi_lite pl/rtl/bus/swd_command_axi_lite.sv pl/rtl/site/swd_waveform_engine.sv pl/rtl/site/pl_loopback_responder.sv
      - name: Artifact contract tests
        run: python3 -m pytest -q pl/tests/test_z2_control_waveform_build.py
      - name: Real RTL simulation
        run: python3 -m pytest -v pl/verification/test_pspl02_swd00_rtl.py
      - name: PSPL-02 HIL safety contracts and exact functions against RTL
        run: |
          python3 -m pytest -q pl/tests/test_pspl02_hil.py pl/verification/test_pspl02_hil_rtl.py
          python3 -m pl.hil.pspl02.runner --help
          python3 -m pl.hil.pspl02.inventory --help
          python3 -m pl.hil.pspl02.recovery --help
          python3 -m pl.hil.pspl02.staging --help
      - name: SWD transaction strict lint
        run: verilator --lint-only --sv -Wall --top-module swd_transaction_master pl/rtl/site/swd_transaction_master.sv pl/rtl/site/swd_waveform_engine.sv
      - name: SWD transaction and independent target regression
        run: python3 -m pytest -v pl/tests/test_swd_reference.py pl/verification/test_swd_transaction_rtl.py
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pspl02-swd00-failure-${{ github.run_id }}
          path: |
            pl/build/pspl02-swd00/sim/
            pl/build/pspl02-hil/
            pl/build/swd01-02/sim/
          retention-days: 7
          if-no-files-found: warn
      - name: Scope boundary
        run: |
          echo "PSPL-02 / SWD-00 host RTL tests PASS." >> "$GITHUB_STEP_SUMMARY"
          echo "No Vivado synthesis/implementation, AXI system integration, JTAG, Z2 HIL, physical SWD or IC programming qualification." >> "$GITHUB_STEP_SUMMARY"
