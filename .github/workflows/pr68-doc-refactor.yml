name: PR68 canonical contract docs refactor

on:
  push:
    branches:
      - agent/remove-rest-v1-firmware-compat

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-rest-v1-firmware-compat
          fetch-depth: 0
      - name: Fast-forward to latest PR branch
        run: git pull --ff-only origin agent/remove-rest-v1-firmware-compat
      - name: Migrate canonical protocol and programming vocabulary
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("AGENTS.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace("Protocol v3.2 is canonical:", "Protocol v3.3 is canonical:")
          text = text.replace("magic:            PLASMA32", "magic:            PLASMA33")
          text = text.replace("protocol_version: 3.2", "protocol_version: 3.3")
          text = re.sub(
              r"\nProtocol v3\.1 remains an explicit compatibility adapter only:\n\n```text\n.*?```\n\nNew code must not treat `site_id == channel_id` as an invariant, dual-send `channel_id` in v3\.2 requests, or introduce new product/domain behavior using retired Programmer/Channel vocabulary\.\n",
              "\nProtocol v3.3 is the only canonical runtime protocol. Retired Programmer/Channel identity and zero-based Site compatibility must not be reintroduced.\n",
              text,
              flags=re.S,
          )
          text = text.replace("Protocol v3.2 TCP server", "Protocol v3.3 TCP server")
          text = text.replace("Plasma Protocol v3.2 / PLASMA32", "Plasma Protocol v3.3 / PLASMA33")
          text = text.replace("Protocol v3.2 TCP Server", "Protocol v3.3 TCP Server")
          text = text.replace(
              "Legacy `Programmer*`, `Channel*`, `programmer/channels`, and `channel_id` may remain only in explicitly documented compatibility adapters/tests.",
              "Retired `Programmer*`, `Channel*`, `programmer/channels`, and zero-based identity vocabulary must not appear in canonical production code.",
          )
          text = text.replace("firmware rollout", "Programming Asset rollout")
          text = text.replace("firmware", "programming data")
          text = text.replace("Firmware", "Programming Data")
          path.write_text(text, encoding="utf-8")

          protocol = Path("software/python/docs/protocol.md")
          if protocol.exists():
              p = protocol.read_text(encoding="utf-8")
              p = p.replace("3.2", "3.3").replace("PLASMA32", "PLASMA33")
              p = p.replace("firmware_size", "image_size").replace("firmware_sha256", "image_sha256")
              p = p.replace("firmware", "image").replace("Firmware", "Image")
              protocol.write_text(p, encoding="utf-8")

          readme = Path("software/python/README.md")
          if readme.exists():
              p = readme.read_text(encoding="utf-8")
              p = p.replace("3.2", "3.3").replace("PLASMA32", "PLASMA33")
              p = p.replace("firmware", "image").replace("Firmware", "Image")
              readme.write_text(p, encoding="utf-8")
          PY
      - name: Guard canonical docs against retired programming term
        run: |
          if grep -Rni --include='*.md' -E '\b[Ff]irmware\b' AGENTS.md docs/architecture/web-rest-api-contract.md docs/architecture/engineering-programming-workspace.md software/python/docs/protocol.md software/python/README.md; then
            echo 'retired programming vocabulary remains in canonical docs'
            exit 1
          fi
      - name: Commit branch-only contract update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "plasma-pr68-bot"
          git config user.email "plasma-pr68-bot@users.noreply.github.com"
          git add AGENTS.md software/python/docs/protocol.md software/python/README.md
          git commit -m "Align canonical contracts with Protocol v3.3 and Programming Assets"
          git push origin HEAD:agent/remove-rest-v1-firmware-compat
