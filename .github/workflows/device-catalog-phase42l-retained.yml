name: Device catalog Phase 4.2L STM32F427/429 I-pin retained evidence

on:
  push:
    branches:
      - agent/device-catalog-phase4.2l-next-admission
    paths:
      - ".github/workflows/device-catalog-phase42l-retained.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retain:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-phase4.2l-next-admission
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser acquisition dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Acquire bounded control and pilot
        id: acquire
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase42l
          xvfb-run -a python data/device-catalog/research/run_stm32f4_browser_pilot.py \
            --manifest data/device-catalog/research/stm32f4-phase3.1-pilot-manifest.json \
            --catalog data/device-catalog/research/openocd-parts-canonical.csv \
            --output /tmp/phase42l/control.json \
            --scope control --headed --timeout 45 --delay 2
          xvfb-run -a python data/device-catalog/research/run_stm32f4_browser_pilot.py \
            --manifest data/device-catalog/research/stm32f4-phase4.2l-f427-f429-i-admission-manifest.json \
            --catalog data/device-catalog/research/openocd-parts-canonical.csv \
            --output /tmp/phase42l/pilot.json \
            --scope pilot --headed --timeout 45 --delay 2
      - name: Enforce lifecycle observations against frozen discovery
        id: lifecycle
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path('data/device-catalog/research/stm32f4-phase4.2l-f427-f429-i-admission-baseline.json').read_text(encoding='utf-8'))
          pilot = json.loads(Path('/tmp/phase42l/pilot.json').read_text(encoding='utf-8'))
          expected = sorted((x['base_device'], x['icpn'], x['marketing_status']) for x in baseline.get('excluded_non_active_observations', []))
          observed = []
          for result in pilot.get('results', []):
              base = result.get('base_device')
              evidence = result.get('evidence') or {}
              for row in evidence.get('excluded_non_active_part_numbers', []):
                  observed.append((base, row.get('icpn'), row.get('marketing_status')))
          observed.sort()
          if observed != expected:
              raise SystemExit({'expected_non_active': expected, 'observed_non_active': observed})
          PY
      - name: Evaluate retained candidate against locked baseline
        id: evaluate
        continue-on-error: true
        run: |
          python data/device-catalog/research/evaluate_stm32f4_pilot.py \
            --summary /tmp/phase42l/pilot.json \
            --baseline data/device-catalog/research/stm32f4-phase4.2l-f427-f429-i-admission-baseline.json \
            --output /tmp/phase42l/evaluation.json \
            --repository physicslu/plasma \
            --git-sha "$GITHUB_SHA"
      - name: Retain immutable evidence cohort
        id: retain
        if: steps.acquire.outcome == 'success' && steps.lifecycle.outcome == 'success' && steps.evaluate.outcome == 'success'
        run: |
          python data/device-catalog/research/retain_stm32f4_browser_evidence.py \
            --control /tmp/phase42l/control.json \
            --pilot /tmp/phase42l/pilot.json \
            --evaluation /tmp/phase42l/evaluation.json \
            --baseline data/device-catalog/research/stm32f4-phase4.2l-f427-f429-i-admission-baseline.json \
            --output-dir /tmp/phase42l/retained
      - name: Upload immutable retained artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase42l-stm32f427-f429-i-retained
          path: /tmp/phase42l
          if-no-files-found: error
          retention-days: 30
      - name: Enforce retained evidence gate
        if: always()
        run: |
          test '${{ steps.acquire.outcome }}' = 'success'
          test '${{ steps.lifecycle.outcome }}' = 'success'
          test '${{ steps.evaluate.outcome }}' = 'success'
          test '${{ steps.retain.outcome }}' = 'success'
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir /tmp/phase42l/retained \
            --baseline data/device-catalog/research/stm32f4-phase4.2l-f427-f429-i-admission-baseline.json
