name: Device catalog production invariants

on:
  push:
    branches: [main]
    paths:
      - "data/device-catalog/production/**"
      - "data/device-catalog/research/*-commercial-icpn.csv"
      - "scripts/ci/device-catalog-production-invariants.py"
      - ".github/workflows/device-catalog-production-invariants.yml"
  pull_request:
    paths:
      - "data/device-catalog/production/**"
      - "data/device-catalog/research/*-commercial-icpn.csv"
      - "scripts/ci/device-catalog-production-invariants.py"
      - ".github/workflows/device-catalog-production-invariants.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-production-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical Production graph
        run: python scripts/ci/device-catalog-production-invariants.py
