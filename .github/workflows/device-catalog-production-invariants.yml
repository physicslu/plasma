name: Device catalog production invariants

on:
  push:
    branches: [main]
    paths:
      - "data/device-catalog/production/**"
      - "data/device-catalog/research/*-commercial-icpn.csv"
      - "data/device-catalog/research/validate_st_c5_exact_loader_matrix_v1.py"
      - "data/device-catalog/research/test_validate_st_c5_exact_loader_matrix_v1.py"
      - "data/device-catalog/research/st-c5-dfp-commercial-loader-crosswalk-v0.9.*"
      - "scripts/ci/device-catalog-production-invariants.py"
      - ".github/workflows/device-catalog-production-invariants.yml"
  pull_request:
    paths:
      - "data/device-catalog/production/**"
      - "data/device-catalog/research/*-commercial-icpn.csv"
      - "data/device-catalog/research/validate_st_c5_exact_loader_matrix_v1.py"
      - "data/device-catalog/research/test_validate_st_c5_exact_loader_matrix_v1.py"
      - "data/device-catalog/research/st-c5-dfp-commercial-loader-crosswalk-v0.9.*"
      - "scripts/ci/device-catalog-production-invariants.py"
      - ".github/workflows/device-catalog-production-invariants.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-production-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical Production graph
        run: python scripts/ci/device-catalog-production-invariants.py
      - name: Audit pinned OpenOCD source provenance for every exact Production ICPN
        env:
          PYTHONPATH: software/python
        run: |
          set -euo pipefail
          python -m unittest discover -s software/python/tests -p 'test_icpn_backend_provenance_v1.py' -v
          python scripts/device-catalog-backend-provenance.py
      - name: Prevent silent STM32H5 backend or Flash-geometry admission drift
        run: |
          set -euo pipefail
          python -m unittest discover -s data/device-catalog/research \
            -p 'test_validate_st_h5_offline_flash_matrix_v1.py' -v
          python data/device-catalog/research/validate_st_h5_offline_flash_matrix_v1.py
      - name: Fail closed on C5 source-only loader readiness or mapping drift
        run: |
          set -euo pipefail
          python -m unittest discover -s data/device-catalog/research \
            -p 'test_validate_st_c5_exact_loader_matrix_v1.py' -v
          python data/device-catalog/research/validate_st_c5_exact_loader_matrix_v1.py
