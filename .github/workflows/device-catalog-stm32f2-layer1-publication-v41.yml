name: STM32F2 Layer-1 Production publication v4.1

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32f2-commercial-icpn.csv'
      - 'data/device-catalog/research/stm32f2-layer1-production-publication-v4.1.json'
      - 'data/device-catalog/research/validate_stm32f2_layer1_publication_v41.py'
      - 'data/device-catalog/research/STM32F2_LAYER1_PRODUCTION_PUBLICATION_V41.md'
      - 'data/device-catalog/research/validate_stm32f7_layer1_publication_v37.py'
      - 'data/ic-support/test_coverage_inventory.py'
      - 'scripts/device-catalog-family-ci.py'
      - 'software/python/tests/test_device_catalog_stm32f2.py'
      - '.github/workflows/device-catalog-stm32f2-layer1-publication-v41.yml'

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved STM32F2 publication and Production graph
        run: |
          python data/device-catalog/research/validate_stm32f2_layer1_publication_v41.py
          python scripts/ci/device-catalog-production-invariants.py
          python data/ic-support/test_coverage_inventory.py
      - name: Install Python development package
        run: python -m pip install -e './software/python[dev]'
      - name: Validate runtime Catalog Layer-1/Layer-2 separation
        run: |
          python -m pytest -q \
            software/python/tests/test_device_catalog.py \
            software/python/tests/test_device_catalog_stm32f2.py \
            software/python/tests/test_device_catalog_web_gateway.py
