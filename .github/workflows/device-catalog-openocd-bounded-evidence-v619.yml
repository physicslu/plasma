name: OpenOCD bounded evidence review v6.19

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/review_openocd_bounded_evidence_v619.py'
      - 'data/device-catalog/research/test_review_openocd_bounded_evidence_v619.py'
      - 'data/device-catalog/research/OPENOCD_BOUNDED_EVIDENCE_REVIEW_V619.md'
      - 'data/device-catalog/research/openocd-bounded-identifier-bridge-v6.19.json'
      - 'data/device-catalog/research/validate_openocd_bounded_bridge_v619.py'
      - '.github/workflows/device-catalog-openocd-bounded-evidence-v619.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Review exact-set bounded evidence
        run: |
          python data/device-catalog/research/review_openocd_bounded_evidence_v619.py \
            --review /tmp/openocd-bounded-evidence-v619.csv \
            --summary /tmp/openocd-bounded-evidence-v619.json
          python -m unittest discover -s data/device-catalog/research \
            -p test_review_openocd_bounded_evidence_v619.py -v
          python data/device-catalog/research/validate_openocd_bounded_bridge_v619.py
      - uses: actions/upload-artifact@v4
        with:
          name: openocd-bounded-evidence-review-v619
          path: |
            /tmp/openocd-bounded-evidence-v619.csv
            /tmp/openocd-bounded-evidence-v619.json
          if-no-files-found: error
          retention-days: 30
