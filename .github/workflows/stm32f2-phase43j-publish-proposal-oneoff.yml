name: STM32F2 Phase 4.3J publish proposal one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f2-phase43j-publish

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate bound plan and sandbox canonical publication
        run: |
          set -euo pipefail
          python data/device-catalog/research/stm32f2_phase4_3i_policy.py
          python data/device-catalog/research/stm32f2_phase4_3j_admission.py \
            --output /tmp/stm32f2-phase4.3j-admission-plan.json
          cp data/device-catalog/research/stm32f2-commercial-icpn.csv \
            /tmp/stm32f2-commercial-icpn.csv
          python - <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          here = Path('data/device-catalog/research').resolve()
          sys.path.insert(0, str(here))
          from device_catalog_admission_framework import write_canonical_dataset

          plan_path = Path('/tmp/stm32f2-phase4.3j-admission-plan.json')
          canonical_path = Path('/tmp/stm32f2-commercial-icpn.csv')
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          result = write_canonical_dataset(plan=plan, canonical_path=canonical_path)
          assert result['status'] == 'written'
          assert result['rows_before'] == 22
          assert result['rows_after'] == 33
          assert len(result['added']) == 11

          # Re-run against the resulting file to prove idempotency.
          second = write_canonical_dataset(plan=plan, canonical_path=canonical_path)
          assert second['status'] == 'no_op'

          report = {
              'schema_version': 1,
              'phase': '4.3J',
              'policy_phase': '4.3I',
              'status': 'proposal_clean',
              'admission_plan_sha256': hashlib.sha256(plan_path.read_bytes()).hexdigest(),
              'canonical_csv_file_sha256': hashlib.sha256(canonical_path.read_bytes()).hexdigest(),
              'rows_before': 22,
              'rows_after': 33,
              'added': result['added'],
              'production_exact_icpns_before': 481,
              'production_exact_icpns_after_if_published': 492,
              'production_write_applied': False,
              'programming_algorithm_equivalence_claimed': False,
              'runtime_programming_support_claimed': False,
          }
          Path('/tmp/stm32f2-phase4.3j-publish-proposal.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload proposal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32f2-phase4.3j-publish-proposal
          path: |
            /tmp/stm32f2-phase4.3j-admission-plan.json
            /tmp/stm32f2-commercial-icpn.csv
            /tmp/stm32f2-phase4.3j-publish-proposal.json
          retention-days: 7
