name: PLASMA Codex LA2016 read-only diagnostics (Issue 981)

# No hardware-capable PR jobs. Dispatch is possible only from merged main
# after separate Gate 2, via exact trusted owner comment on Issue #981.
on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - ".github/workflows/plasma-codex-la2016-diagnose.yml"
      - "scripts/plasma-codex-la2016-diagnose.py"
      - "docs/development/plasma-codex-la2016-diagnose.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/plasma-codex-la2016-diagnose.yml"
      - "scripts/plasma-codex-la2016-diagnose.py"
      - "docs/development/plasma-codex-la2016-diagnose.md"

permissions:
  contents: read

concurrency:
  group: plasma-codex-la2016-diagnose-981
  cancel-in-progress: false

jobs:
  contract:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Offline owner authorization and non-actuation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/plasma-codex-la2016-diagnose.py
          python3 scripts/plasma-codex-la2016-diagnose.py --self-test

  authorize:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'physicslu/plasma' &&
      github.actor == 'physicslu' &&
      github.event.issue.number == 981 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == '/plasma-codex la2016-diag 981'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      reviewed_sha: ${{ steps.auth.outputs.reviewed_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Authorize exact owner event and pin merged main
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/plasma-codex-la2016-diagnose.py --event "$GITHUB_EVENT_PATH"
          printf 'reviewed_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  diagnose:
    needs: authorize
    if: ${{ needs.authorize.result == 'success' }}
    runs-on: [self-hosted, linux, x64, plasma-codex]
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Checkout pinned reviewed main, never PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.reviewed_sha }}
          persist-credentials: false
          clean: true
      - name: Verify dedicated non-root SWPC identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = physicslu/plasma
          test "$GITHUB_EVENT_NAME" = issue_comment
          test "$GITHUB_REF" = refs/heads/main
          test "$(hostname)" = SWPC
          test "$(id -un)" = plasma-codex
          test "$(id -u)" -ne 0
          test "$RUNNER_NAME" = SWPC-plasma-codex
          test "$(git rev-parse HEAD)" = "${{ needs.authorize.outputs.reviewed_sha }}"
          test -z "$(git status --porcelain)"
          for group in plasma-codex-io plasma-monitor; do
            id -nG | tr ' ' '\n' | grep -Fxq "$group"
          done
          if id -nG | tr ' ' '\n' | grep -Eq '^(sudo|docker|adm|dialout|gpio|i2c|video|plasma-hil)$'; then
            echo "Unexpected privileged Linux worker group" >&2
            exit 1
          fi
      - name: Execute passive AppImage USB and isolated Codex readiness diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/plasma-codex-la2016-diagnose.py --run
      - name: Summarize sanitized diagnostic statuses
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/plasma-la2016-diagnose-$GITHUB_RUN_ID"
          if test -f "$out/report.json"; then
            python3 - "$out/report.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1], encoding="utf-8"))
          print("LA2016 read-only diagnosis:", r["result"])
          for name, status in sorted(r["checks"].items()):
              print(name + ": " + status)
          print("Physical USB/PWM/CH0/FPGA/Hub/DUT operations: NOT_RUN")
          PY
          else
            echo "LA2016 read-only diagnostic report NOT_RUN" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized report and SHA256
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plasma-codex-la2016-diagnose-981-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/plasma-la2016-diagnose-${{ github.run_id }}/report.json
            ${{ runner.temp }}/plasma-la2016-diagnose-${{ github.run_id }}/exit_code
            ${{ runner.temp }}/plasma-la2016-diagnose-${{ github.run_id }}/SHA256SUMS
          if-no-files-found: warn
          retention-days: 14
