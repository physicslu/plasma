name: STM32G4 Phase 4.9D final replay one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32g4-phase49d-admission
    paths:
      - ".github/workflows/device-catalog-stm32g4-phase49d-observe-oneoff.yml"

permissions:
  contents: read

jobs:
  replay-admission-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay STM32G4 evidence, metadata, and admission contracts
        run: |
          python data/device-catalog/research/validate_stm32g4_phase4_9b_retained_evidence.py
          python data/device-catalog/research/test_stm32g4_phase4_9c_policy.py
          python data/device-catalog/research/stm32g4_phase4_9c_policy.py
          python data/device-catalog/research/test_stm32g4_phase4_9d_admission.py
          python data/device-catalog/research/validate_stm32g4_phase4_9d_admission_plan.py
      - name: Assert read-only Phase 4.9D boundary
        run: |
          cmp data/device-catalog/production/icpn-v1-manifest.json data/device-catalog/research/stm32g4-phase4.9c-production-manifest-prestate.json
          test ! -e data/device-catalog/research/stm32g4-commercial-icpn.csv
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/device-catalog/research/stm32g4-phase4.9d-admission-plan.json').read_text())
          assert p['canonical_dataset_admission'] == 'planned'
          assert p['candidate_count'] == 25
          assert p['capability_unresolved_count'] == 0
          assert p['bounded_commercial_surface_complete'] is False
          assert p['production_snapshot']['exact_icpn_count'] == 610
          assert p['production_snapshot']['stm32g4_exact_icpn_count'] == 0
          assert p['source_unavailable_base_devices'] == ['STM32G411C6','STM32G414CB','STM32G471CC']
          assert p['proposal_exact_identity_exclusions'] == ['STM32G441CBT3','STM32G441CBU3','STM32G484CET3']
          print('STM32G4 Phase 4.9D final read-only boundary: PASS')
          PY
      - name: Report immutable Phase 4.9D bindings
        run: |
          sha256sum data/device-catalog/research/stm32g4-phase4.9d-admission-plan.json
          sha256sum data/device-catalog/research/stm32g4-phase4.9c-policy-baseline.json
          sha256sum data/device-catalog/research/openocd-parts-canonical.csv
          sha256sum data/device-catalog/research/stm32g4-phase4.9c-production-manifest-prestate.json
