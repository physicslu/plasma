name: Device catalog Phase 4.1 R/T batch3 retained artifact publish

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  publish-retained-evidence:
    if: >-
      github.actor == 'physicslu' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/device-catalog-phase4.1-rt-admission-batch3'
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ID: '9807572561'
      ARTIFACT_SHA256: '2c2629936db0b6fe3104f6757c2599d6c65554644070cdd8b757621c936702fb'
      EVIDENCE_DIR: data/device-catalog/research/evidence/stm32f4-phase4.1-rt-admission-batch3-live-2026-09-01
      BASELINE: data/device-catalog/research/stm32f4-phase4.1-rt-admission-batch3-baseline.json
      SOURCE_FILE: data/device-catalog/research/stm32f4-phase4.1-rt-admission-batch3-retained-source.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable retained artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/retained.zip
          echo "${ARTIFACT_SHA256}  /tmp/retained.zip" | sha256sum -c -
          test ! -e "${EVIDENCE_DIR}"
          mkdir -p "${EVIDENCE_DIR}"
          unzip -q /tmp/retained.zip -d "${EVIDENCE_DIR}"
      - name: Validate retained evidence offline
        run: |
          set -euo pipefail
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir "${EVIDENCE_DIR}" \
            --baseline "${BASELINE}"
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = Path('data/device-catalog/research/evidence/stm32f4-phase4.1-rt-admission-batch3-live-2026-09-01')
          provenance = json.loads((evidence / 'provenance.json').read_text(encoding='utf-8'))
          evaluation = json.loads((evidence / 'evaluation.json').read_text(encoding='utf-8'))
          assert provenance['evidence_id'] == 'stm32f4-phase4.1-rt-admission-batch3-2026-09-01-retained-20260901T152600Z-1e04e9e'
          assert provenance['workflow_run_id'] == '33525620946'
          assert provenance['live_acquisition_attempts'] == 1
          assert provenance['live_acquisition_attempt_outcomes'] == [{
              'attempt': 1,
              'clean': True,
              'acquisition_success': 5,
              'acquisition_failure': 0,
              'failed_targets': [],
          }]
          assert provenance['exact_icpn_candidate_count'] == 12
          assert provenance['target_count'] == 5
          assert provenance['excluded_non_active_observations'] == [{
              'base_device': 'STM32F413RG',
              'icpn': 'STM32F413RGT3',
              'marketing_status': 'Proposal Marketing proposal for customer feedback. No commitment taken to design or produce. EN',
          }]
          assert evaluation['candidate_baseline_match'] is True
          assert evaluation['candidate_drift'] == []
          assert evaluation['observed_exact_icpn_candidates'] == 12
          assert evaluation['scale_ready'] is True
          assert evaluation['issues'] == []
          PY
      - name: Record artifact binding
        run: |
          cat > "${SOURCE_FILE}" <<'JSON'
          {
            "schema_version": 1,
            "workflow_run_id": "33525620946",
            "artifact_id": "9807572561",
            "artifact_name": "phase41-stm32f4-rt-batch3-retained",
            "artifact_sha256": "2c2629936db0b6fe3104f6757c2599d6c65554644070cdd8b757621c936702fb",
            "evidence_id": "stm32f4-phase4.1-rt-admission-batch3-2026-09-01-retained-20260901T152600Z-1e04e9e",
            "canonical_dataset_admission": false
          }
          JSON
      - name: Commit retained bytes
        run: |
          set -euo pipefail
          git config user.name 'Gordon'
          git config user.email 'physicslu@gmail.com'
          git add "${EVIDENCE_DIR}" "${SOURCE_FILE}"
          git diff --cached --check
          git commit -m 'device-catalog: retain R/T batch3 official ST evidence'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
