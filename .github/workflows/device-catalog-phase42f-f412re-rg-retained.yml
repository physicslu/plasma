name: Device catalog Phase 4.2F F412RE/RG retained evidence

on:
  push:
    branches:
      - agent/device-catalog-phase4.2f-f412re-rg-admission
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retain:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-phase4.2f-f412re-rg-admission
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser acquisition dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Acquire bounded control and pilot
        id: acquire
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase42f
          xvfb-run -a python data/device-catalog/research/run_stm32f4_browser_pilot.py \
            --manifest data/device-catalog/research/stm32f4-phase3.1-pilot-manifest.json \
            --catalog data/device-catalog/research/openocd-parts-canonical.csv \
            --output /tmp/phase42f/control.json \
            --scope control --headed --timeout 45 --delay 2
          xvfb-run -a python data/device-catalog/research/run_stm32f4_browser_pilot.py \
            --manifest data/device-catalog/research/stm32f4-phase4.2f-f412re-rg-admission-manifest.json \
            --catalog data/device-catalog/research/openocd-parts-canonical.csv \
            --output /tmp/phase42f/pilot.json \
            --scope pilot --headed --timeout 45 --delay 2
      - name: Evaluate retained candidate against locked baseline
        id: evaluate
        continue-on-error: true
        run: |
          python data/device-catalog/research/evaluate_stm32f4_pilot.py \
            --summary /tmp/phase42f/pilot.json \
            --baseline data/device-catalog/research/stm32f4-phase4.2f-f412re-rg-admission-baseline.json \
            --output /tmp/phase42f/evaluation.json \
            --repository physicslu/plasma \
            --git-sha "$GITHUB_SHA"
      - name: Retain immutable evidence cohort
        id: retain
        if: steps.acquire.outcome == 'success' && steps.evaluate.outcome == 'success'
        run: |
          python data/device-catalog/research/retain_stm32f4_browser_evidence.py \
            --control /tmp/phase42f/control.json \
            --pilot /tmp/phase42f/pilot.json \
            --evaluation /tmp/phase42f/evaluation.json \
            --baseline data/device-catalog/research/stm32f4-phase4.2f-f412re-rg-admission-baseline.json \
            --output-dir /tmp/phase42f/retained
      - name: Show diagnostics
        if: always()
        run: |
          for f in /tmp/phase42f/control.json /tmp/phase42f/pilot.json /tmp/phase42f/evaluation.json; do
            if [ -f "$f" ]; then echo "===== $f ====="; cat "$f"; fi
          done
      - name: Upload immutable retained artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase42f-stm32f4-f412re-rg-retained
          path: /tmp/phase42f
          if-no-files-found: error
          retention-days: 30
      - name: Enforce retained evidence gate
        if: always()
        run: |
          test '${{ steps.acquire.outcome }}' = 'success'
          test '${{ steps.evaluate.outcome }}' = 'success'
          test '${{ steps.retain.outcome }}' = 'success'
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir /tmp/phase42f/retained \
            --baseline data/device-catalog/research/stm32f4-phase4.2f-f412re-rg-admission-baseline.json
