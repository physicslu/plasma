name: Microchip bulk ICPN research coverage contract v1

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/microchip-bulk-source-registry-v1.json'
      - 'data/device-catalog/research/microchip_bulk_coverage_v1.py'
      - 'data/device-catalog/research/microchip_mcp_probe_v1.py'
      - 'data/device-catalog/research/microchip_mcp_batch_v1.py'
      - 'data/device-catalog/research/microchip_mcp_batch_plan_v1.py'
      - 'data/device-catalog/research/test_microchip_mcp_batch_plan_v1.py'
      - 'data/device-catalog/research/microchip-pic10-pic12-mcp-batch-seeds-v1.json'
      - 'data/device-catalog/research/test_microchip_mcp_batch_v1.py'
      - 'data/device-catalog/research/microchip_mcp_evidence_ledger_v1.py'
      - 'data/device-catalog/research/test_microchip_mcp_evidence_ledger_v1.py'
      - 'data/device-catalog/research/microchip_dfp_index_inventory_v1.py'
      - 'data/device-catalog/research/test_microchip_dfp_index_inventory_v1.py'
      - 'data/device-catalog/research/test_microchip_mcp_probe_v1.py'
      - 'data/device-catalog/research/microchip_product_api_probe_v1.py'
      - 'data/device-catalog/research/test_microchip_product_api_probe_v1.py'
      - 'data/device-catalog/research/test_microchip_bulk_coverage_v1.py'
      - 'data/device-catalog/research/MICROCHIP_BULK_ACQUISITION_V1.md'
      - '.github/workflows/device-catalog-microchip-bulk-coverage-v1.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/microchip-bulk-source-registry-v1.json'
      - 'data/device-catalog/research/microchip_bulk_coverage_v1.py'
      - 'data/device-catalog/research/microchip_mcp_probe_v1.py'
      - 'data/device-catalog/research/microchip_mcp_batch_v1.py'
      - 'data/device-catalog/research/microchip_mcp_batch_plan_v1.py'
      - 'data/device-catalog/research/test_microchip_mcp_batch_plan_v1.py'
      - 'data/device-catalog/research/microchip-pic10-pic12-mcp-batch-seeds-v1.json'
      - 'data/device-catalog/research/test_microchip_mcp_batch_v1.py'
      - 'data/device-catalog/research/microchip_mcp_evidence_ledger_v1.py'
      - 'data/device-catalog/research/test_microchip_mcp_evidence_ledger_v1.py'
      - 'data/device-catalog/research/microchip_dfp_index_inventory_v1.py'
      - 'data/device-catalog/research/test_microchip_dfp_index_inventory_v1.py'
      - 'data/device-catalog/research/test_microchip_mcp_probe_v1.py'
      - 'data/device-catalog/research/test_microchip_bulk_coverage_v1.py'
      - 'data/device-catalog/research/MICROCHIP_BULK_ACQUISITION_V1.md'
      - '.github/workflows/device-catalog-microchip-bulk-coverage-v1.yml'

permissions:
  contents: read

jobs:
  research-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bounded research-only Microchip policy
        run: |
          python -m py_compile data/device-catalog/research/microchip_bulk_coverage_v1.py data/device-catalog/research/microchip_mcp_batch_plan_v1.py data/device-catalog/research/test_microchip_mcp_batch_plan_v1.py data/device-catalog/research/test_microchip_bulk_coverage_v1.py data/device-catalog/research/microchip_product_api_probe_v1.py data/device-catalog/research/test_microchip_product_api_probe_v1.py data/device-catalog/research/microchip_mcp_probe_v1.py data/device-catalog/research/microchip_mcp_batch_v1.py data/device-catalog/research/test_microchip_mcp_probe_v1.py data/device-catalog/research/test_microchip_mcp_batch_v1.py data/device-catalog/research/microchip_mcp_evidence_ledger_v1.py data/device-catalog/research/test_microchip_mcp_evidence_ledger_v1.py data/device-catalog/research/microchip_dfp_index_inventory_v1.py data/device-catalog/research/test_microchip_dfp_index_inventory_v1.py
          python -m unittest discover -s data/device-catalog/research -p 'test_microchip_bulk_coverage_v1.py' -v
          python -m unittest discover -s data/device-catalog/research -p 'test_microchip_product_api_probe_v1.py' -v
          python -m unittest discover -s data/device-catalog/research -p 'test_microchip_mcp_probe_v1.py' -v
          python -m unittest discover -s data/device-catalog/research -p 'test_microchip_mcp_batch_v1.py' -v
          python -m unittest discover -s data/device-catalog/research -p 'test_microchip_mcp_batch_plan_v1.py' -v
          python -m unittest discover -s data/device-catalog/research -p 'test_microchip_mcp_evidence_ledger_v1.py' -v
          python -m unittest discover -s data/device-catalog/research -p 'test_microchip_dfp_index_inventory_v1.py' -v
          python data/device-catalog/research/microchip_bulk_coverage_v1.py > /tmp/microchip-bulk-summary.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/microchip-bulk-summary.json'))
          assert x['complete_global_active_denominator'] is None
          assert x['global_active_identity_coverage'] is None
          assert x['claims']['production_write_authorized'] is False
          assert len(x['segments']) == 5
          print('Research-only Microchip baseline PASS; no ungrounded portfolio claim')
          PY
