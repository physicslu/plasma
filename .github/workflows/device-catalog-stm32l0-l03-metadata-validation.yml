name: STM32L0 L0.3 metadata validation

on:
  pull_request:
    paths:
      - "data/device-catalog/research/stm32l0_metadata_policy.py"
      - "data/device-catalog/research/stm32l0_phase_l0_3_policy.py"
      - "data/device-catalog/research/test_stm32l0_phase_l0_3_policy.py"
      - "data/device-catalog/research/stm32l0-phase-l0.3-ordering-authority.json"
      - "data/device-catalog/research/evidence/stm32l0-l0.2-official-st-discovery-live-2026-09-12/**"
      - "data/device-catalog/production/**"
      - ".github/workflows/device-catalog-stm32l0-l03-metadata-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run L0.3 policy tests
        working-directory: data/device-catalog/research
        run: python -m unittest -v test_stm32l0_phase_l0_3_policy.py
      - name: Build deterministic L0.3 summary
        working-directory: data/device-catalog/research
        run: |
          python stm32l0_phase_l0_3_policy.py --summary-only --output "$RUNNER_TEMP/stm32l0-l03-summary.json"
          cat "$RUNNER_TEMP/stm32l0-l03-summary.json"
      - name: Enforce L0.3 fail-closed boundary
        run: |
          python - <<'PY'
          import json, os
          p = os.path.join(os.environ["RUNNER_TEMP"], "stm32l0-l03-summary.json")
          d = json.load(open(p, encoding="utf-8"))
          assert d["phase"] == "L0.3" and d["family"] == "STM32L0"
          assert d["candidate_count"] == 360
          assert d["base_device_count"] == 99
          assert sum(d["decision_counts"].values()) == 360
          assert d["decision_counts"]["reject"] == 0
          assert d["production_snapshot"]["exact_icpn_count"] == 912
          assert d["production_snapshot"]["base_device_count"] == 293
          assert d["production_snapshot"]["stm32l0_exact_icpn_count"] == 0
          contract = d["metadata_contract"]
          for key in (
              "canonical_admission_authorized",
              "production_write_authorized",
              "programming_policy_defined",
              "flash_geometry_qualified",
              "option_security_semantics_qualified",
              "physical_hil_qualified",
              "runtime_programming_support_claimed",
              "scope_expansion_authorized",
          ):
              assert contract[key] is False, (key, contract[key])
          print("STM32L0 L0.3 fail-closed boundary: PASS")
          PY
      - name: Upload deterministic summary
        uses: actions/upload-artifact@v4
        with:
          name: stm32l0-l03-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stm32l0-l03-summary.json
          retention-days: 30
