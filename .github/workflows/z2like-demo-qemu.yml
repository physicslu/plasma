name: z2like-demo QEMU ARMv7 acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/z2like-demo-qemu.yml"
      - "render.yaml"
      - "scripts/plasmactl"
      - "scripts/plasmactl-z2-ps"
      - "scripts/plasmactl-z2like-demo*"
      - "scripts/render-control-station-start.sh"
      - "scripts/z2like-demo-qemu*.py"
      - "scripts/z2like-demo-nginx-ephemeral.py"
      - "scripts/ppu-bootstrap*.py"
      - "scripts/ppu-z2-installer*.py"
      - "scripts/ppu-runtime.py"
      - "scripts/ppu-release.py"
      - "scripts/openocd-runtime.py"
      - "scripts/build-openocd-runtime.sh"
      - "release/openocd.json"
      - "software/python/plasma_manager/**"
      - "software/python/tests/test_z2like_demo_qemu_contract.py"
      - "software/python/tests/test_z2like_demo_qemu_control_plane_contract.py"
      - "software/python/tests/test_z2like_demo_qemu_e2e_contract.py"
      - "software/python/tests/test_openocd_runtime_artifact.py"
      - "software/python/tests/test_plasmactl_deployment_profiles.py"
      - "software/python/tests/test_render_deployment.py"
      - "docs/deployment/z2like-demo-qemu.md"
      - "docs/deployment/port-profile-matrix.md"
  pull_request:
    paths:
      - ".github/workflows/z2like-demo-qemu.yml"
      - "render.yaml"
      - "scripts/plasmactl"
      - "scripts/plasmactl-z2-ps"
      - "scripts/plasmactl-z2like-demo*"
      - "scripts/render-control-station-start.sh"
      - "scripts/z2like-demo-qemu*.py"
      - "scripts/z2like-demo-nginx-ephemeral.py"
      - "scripts/ppu-bootstrap*.py"
      - "scripts/ppu-z2-installer*.py"
      - "scripts/ppu-runtime.py"
      - "scripts/ppu-release.py"
      - "scripts/openocd-runtime.py"
      - "scripts/build-openocd-runtime.sh"
      - "release/openocd.json"
      - "software/python/plasma_manager/**"
      - "software/python/tests/test_z2like_demo_qemu_contract.py"
      - "software/python/tests/test_z2like_demo_qemu_control_plane_contract.py"
      - "software/python/tests/test_z2like_demo_qemu_e2e_contract.py"
      - "software/python/tests/test_openocd_runtime_artifact.py"
      - "software/python/tests/test_plasmactl_deployment_profiles.py"
      - "software/python/tests/test_render_deployment.py"
      - "docs/deployment/z2like-demo-qemu.md"
      - "docs/deployment/port-profile-matrix.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install contract-test dependencies
        run: python -m pip install ./software/python pytest

      - name: Compile simulation/control scripts
        run: |
          python -m py_compile \
            scripts/z2like-demo-qemu.py \
            scripts/z2like-demo-qemu-target.py \
            scripts/z2like-demo-qemu-control-plane.py \
            scripts/z2like-demo-qemu-kit.py \
            scripts/z2like-demo-qemu-installer.py \
            scripts/z2like-demo-qemu-e2e.py \
            scripts/z2like-demo-qemu-loopback-matrix.py \
            scripts/z2like-demo-qemu-build-kit.py \
            scripts/z2like-demo-qemu-deploy.py \
            scripts/z2like-demo-nginx-ephemeral.py \
            scripts/openocd-runtime.py
          bash -n scripts/build-openocd-runtime.sh
          bash -n scripts/plasmactl
          bash -n scripts/plasmactl-z2-ps
          bash -n scripts/plasmactl-z2like-demo
          bash -n scripts/plasmactl-z2like-demo-managed-ingress
          bash -n scripts/render-control-station-start.sh

      - name: Run z2like-demo architecture and deployment contracts
        run: |
          python -m pytest -q \
            software/python/tests/test_z2like_demo_qemu_contract.py \
            software/python/tests/test_z2like_demo_qemu_control_plane_contract.py \
            software/python/tests/test_openocd_runtime_artifact.py \
            software/python/tests/test_plasmactl_deployment_profiles.py \
            software/python/tests/test_render_deployment.py

      - name: Install disposable Nginx parser/runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nginx

      - name: Run ephemeral Nginx integration gate
        run: python scripts/z2like-demo-nginx-ephemeral.py

      - name: Run documentation integrity
        run: python scripts/tests/test-documentation-integrity.py

  qemu-bootstrap-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up QEMU ARM emulation
        uses: docker/setup-qemu-action@v4
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm

      - name: Start legacy-bind QEMU ARMv7 Bootstrap target
        shell: bash
        run: |
          set -euo pipefail
          python scripts/z2like-demo-qemu.py up
          test "$(docker exec plasma-z2like-demo-qemu uname -m)" = "armv7l" \
            -o "$(docker exec plasma-z2like-demo-qemu uname -m)" = "armv7"
          test -z "$(docker port plasma-z2like-demo-qemu)"
          mount_type="$(docker inspect plasma-z2like-demo-qemu | python -c 'import json,sys; x=json.load(sys.stdin)[0]; print(next(m["Type"] for m in x["Mounts"] if m["Destination"]=="/sim"))')"
          test "$mount_type" = "bind"

      - name: Prove bind-to-commit-pinned control-plane migration
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          python scripts/z2like-demo-qemu-control-plane.py --expected-commit "$sha"
          read -r mount_type mount_name < <(
            docker inspect plasma-z2like-demo-qemu | \
              python -c 'import json,sys; x=json.load(sys.stdin)[0]; m=next(m for m in x["Mounts"] if m["Destination"]=="/sim"); print(m["Type"],m.get("Name",""))'
          )
          test "$mount_type" = "volume"
          test "$mount_name" = "plasma-z2like-demo-scripts-$sha"
          docker exec plasma-z2like-demo-qemu python3 -c \
            'import json,pathlib,sys; p=json.loads(pathlib.Path("/sim/.plasma-control-plane-provenance.json").read_text()); sys.exit(0 if p.get("source_commit")==sys.argv[1] else 1)' \
            "$sha"

      - name: Install Manager and PPU build dependencies
        run: python -m pip install ./software/python pytest

      - name: Build real canonical ARMv7 PPU release and simulation-only Z2 kit fixture
        id: kit
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          version="$(python -c 'import json; print(json.load(open("release/product.json"))["product_version"])')"
          identity="$version-${sha:0:12}"
          runtime="$RUNNER_TEMP/plasma-ppu-runtime"
          output="$RUNNER_TEMP/plasma-ppu-release"
          python scripts/ppu-runtime.py build --output-dir "$runtime"
          python scripts/ppu-runtime.py validate "$runtime"
          python scripts/ppu-release.py \
            --runtime-dir "$runtime" \
            --output-dir "$output" \
            --git-sha "$sha"
          ppu="$output/plasma-ppu-$identity-linux-armv7l.tar.gz"
          test -f "$ppu"
          test -f "$ppu.sha256"
          python scripts/ppu-z2-installer.py verify \
            --release-artifact "$ppu" \
            --sidecar "$ppu.sha256"

          openocd_out="$RUNNER_TEMP/openocd-armv7l"
          bash scripts/build-openocd-runtime.sh "$openocd_out" armv7l
          shopt -s nullglob
          openocd_archives=("$openocd_out"/plasma-openocd-*-linux-armv7l.tar.gz)
          test "${#openocd_archives[@]}" -eq 1
          openocd="${openocd_archives[0]}"
          python scripts/openocd-runtime.py verify "$openocd" --sidecar "$openocd.sha256"

          root="$RUNNER_TEMP/plasma-z2-ps-kit-$identity"
          mkdir -p "$root/scripts" "$root/artifacts" "$root/docs" "$RUNNER_TEMP/python-fixture"
          cp scripts/plasmactl "$root/scripts/plasmactl"
          cp scripts/plasmactl-z2-ps "$root/scripts/plasmactl-z2-ps"
          cp scripts/ppu-bootstrap-deployment.py "$root/scripts/ppu-bootstrap-deployment.py"
          cp scripts/ppu-z2-installer.py "$root/scripts/ppu-z2-installer.py"
          cp scripts/ppu-z2-installer-core.py "$root/scripts/ppu-z2-installer-core.py"
          cp scripts/z2-python-runtime.py "$root/scripts/z2-python-runtime.py"
          cp scripts/openocd-runtime.py "$root/scripts/openocd-runtime.py"
          cp scripts/z2like-demo-qemu-installer.py "$root/scripts/z2like-demo-qemu-installer.py"
          cp "$ppu" "$ppu.sha256" "$root/artifacts/"
          cp "$openocd" "$openocd.sha256" "$root/artifacts/"
          cp docs/deployment/z2-ps-installer.md "$root/docs/README.md"

          # This acceptance exercises the ARMv7 packaged PPU Runtime and the exact
          # kit/deployment control path. The real Plasma-owned Python artifact is
          # separately built/executed by z2-ps-release.yml; the QEMU simulation
          # deliberately verifies but does not execute the kit Python artifact.
          printf '%s\n' 'simulation-only Python artifact fixture; never production-qualified' \
            > "$RUNNER_TEMP/python-fixture/BOUNDARY.txt"
          py="$root/artifacts/plasma-python-3.12.13-linux-armv7l.tar.gz"
          tar -C "$RUNNER_TEMP/python-fixture" -czf "$py" BOUNDARY.txt
          (
            cd "$root/artifacts"
            sha256sum "$(basename "$py")" > "$(basename "$py").sha256"
          )

          chmod +x "$root/scripts/plasmactl" "$root/scripts/plasmactl-z2-ps" \
            "$root/scripts/ppu-bootstrap-deployment.py" "$root/scripts/ppu-z2-installer.py" \
            "$root/scripts/z2-python-runtime.py" "$root/scripts/openocd-runtime.py" \
            "$root/scripts/z2like-demo-qemu-installer.py"
          (
            cd "$root"
            find scripts artifacts docs -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          kit="$RUNNER_TEMP/plasma-z2-ps-kit-$identity.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$kit" "$(basename "$root")"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$(basename "$kit")" > "$(basename "$kit").sha256"
          )
          echo "kit=$kit" >> "$GITHUB_OUTPUT"
          echo "openocd=$openocd" >> "$GITHUB_OUTPUT"

      - name: Install and smoke packaged OpenOCD inside QEMU ARMv7 target
        env:
          OPENOCD_ARTIFACT: ${{ steps.kit.outputs.openocd }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="$(basename "$OPENOCD_ARTIFACT")"
          docker cp scripts/openocd-runtime.py plasma-z2like-demo-qemu:/tmp/openocd-runtime.py
          docker cp "$OPENOCD_ARTIFACT" "plasma-z2like-demo-qemu:/tmp/$artifact_name"
          docker cp "$OPENOCD_ARTIFACT.sha256" "plasma-z2like-demo-qemu:/tmp/$artifact_name.sha256"
          docker exec plasma-z2like-demo-qemu python3 /tmp/openocd-runtime.py install \
            "/tmp/$artifact_name" --sidecar "/tmp/$artifact_name.sha256"
          docker exec plasma-z2like-demo-qemu python3 -c 'import json,subprocess; p=json.load(open("/opt/plasma/install/openocd-runtime.json")); assert p["architecture"] == "armv7l"; assert p["hardware_runtime_ready"] is False; subprocess.run([p["binary"], "--version"], check=True); subprocess.run([p["binary"], "-s", p["scripts_root"], "-c", "adapter driver dummy", "-c", "shutdown"], check=True)'

      - name: Drive Manager to Bootstrap to QEMU deployment E2E
        env:
          KIT: ${{ steps.kit.outputs.kit }}
        run: |
          python scripts/z2like-demo-qemu-e2e.py \
            --kit "$KIT" \
            --sidecar "$KIT.sha256"

      - name: Prove Platform and Managed PS loopback lifecycle matrix
        run: python scripts/z2like-demo-qemu-loopback-matrix.py

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          docker logs --tail 300 plasma-z2like-demo-qemu || true
          docker inspect plasma-z2like-demo-qemu || true

      - name: Stop QEMU target
        if: always()
        run: |
          docker rm -f plasma-z2like-demo-qemu >/dev/null 2>&1 || true
