name: TEMP STM32C0 C0.5 lifecycle v6

on:
  push:
    branches:
      - agent/device-catalog-stm32c0-phase-c05-publication
    paths:
      - ".github/workflows/tmp-stm32c0-c05-lifecycle-v6.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-stm32c0-phase-c05-publication
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply lifecycle closure and current structural negative test
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('data/device-catalog/research/stm32c0_phase_c0_4_admission.py')
          text = p.read_text()
          anchor = 'DEFAULT_FROZEN_PLAN = HERE / "stm32c0-phase-c0.4-admission-plan.json"\n'
          if 'LIVE_PRODUCTION_MANIFEST =' not in text:
              text = text.replace(anchor, anchor + 'LIVE_PRODUCTION_MANIFEST = HERE.parent / "production/icpn-v1-manifest.json"  # compatibility/test helper; not the historical default\n', 1)
          text = text.replace('canonical_path: Path | None = DEFAULT_CANONICAL,', 'canonical_path: Path | None = None,', 1)
          p.write_text(text)

          p = Path('data/device-catalog/research/validate_stm32c0_phase_c0_2_retained_evidence.py')
          p.write_text(p.read_text().replace(
              'PRODUCTION = HERE.parent / "production/icpn-v1-manifest.json"',
              'PRODUCTION = HERE / "stm32c0-phase-c0.2-production-manifest-prestate.json"',
              1,
          ))

          p = Path('data/device-catalog/research/test_stm32c0_phase_c0_4_admission.py')
          p.write_text(p.read_text().replace(
              '"Production manifest blob drifted"',
              '"C0.3 Production prestate blob drifted"',
              1,
          ))

          p = Path('data/device-catalog/research/test_stm32_cross_family_prioritization.py')
          text = p.read_text()
          replacements = {
            'CURRENT_SHORTLIST = ["STM32C0", "STM32L1", "STM32L0"]': 'CURRENT_SHORTLIST = ["STM32L1", "STM32L0", "STM32L4"]',
            'self.assertEqual(report["production_invariants"]["exact_icpn_count"], 703)': 'self.assertEqual(report["production_invariants"]["exact_icpn_count"], 912)',
            'self.assertEqual(report["production_invariants"]["base_device_count"], 243)': 'self.assertEqual(report["production_invariants"]["base_device_count"], 293)',
            '            "STM32F0", "STM32F1", "STM32F2", "STM32F3",\n            "STM32F4", "STM32F7", "STM32G0", "STM32G4", "STM32U0",': '            "STM32C0", "STM32F0", "STM32F1", "STM32F2", "STM32F3",\n            "STM32F4", "STM32F7", "STM32G0", "STM32G4", "STM32U0",',
            'self.assertEqual(report["inventory"]["candidate_series_count"], 14)': 'self.assertEqual(report["inventory"]["candidate_series_count"], 13)',
            'self.assertEqual(report["inventory"]["candidate_source_row_count"], 1321)': 'self.assertEqual(report["inventory"]["candidate_source_row_count"], 1226)',
            'self.assertEqual(report["inventory"]["candidate_ordering_pattern_rows"], 928)': 'self.assertEqual(report["inventory"]["candidate_ordering_pattern_rows"], 855)',
            'self.assertEqual(report["inventory"]["shortlist_eligible_series_count"], 4)': 'self.assertEqual(report["inventory"]["shortlist_eligible_series_count"], 3)',
            '            "standard_nonwireless_research": 4,': '            "standard_nonwireless_research": 3,',
            'row.get("plasma_series") == "STM32C0" and row.get("identifier_kind") == "ordering_pattern"': 'row.get("plasma_series") == "STM32L1" and row.get("identifier_kind") == "ordering_pattern"',
            '"tcl/target/artificial-second-c0.cfg"': '"tcl/target/artificial-second-l1.cfg"',
            'self.assertFalse(candidates["STM32C0"]["structural_gate_pass"])': 'self.assertFalse(candidates["STM32L1"]["structural_gate_pass"])',
            'self.assertFalse(candidates["STM32C0"]["shortlist_eligible"])': 'self.assertFalse(candidates["STM32L1"]["shortlist_eligible"])',
            'self.assertNotIn("STM32C0", {item["plasma_series"] for item in report["research_shortlist"]})': 'self.assertNotIn("STM32L1", {item["plasma_series"] for item in report["research_shortlist"]})',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'cross-family anchor missing: {old}')
          anchor = '        self.assertNotIn("STM32U0", {item["plasma_series"] for item in report["candidates"]})\n'
          if 'family_exact_icpn_counts"]["STM32C0"]' not in text:
              text = text.replace(anchor, anchor + '        self.assertNotIn("STM32C0", {item["plasma_series"] for item in report["candidates"]})\n        self.assertEqual(report["production_invariants"]["family_exact_icpn_counts"]["STM32C0"], 209)\n', 1)
          p.write_text(text)

          p = Path('scripts/device-catalog-family-ci.py')
          text = p.read_text()
          anchor = '            _py("data/device-catalog/research/validate_stm32c0_phase_c0_4_admission_plan.py"),\n'
          if 'test_stm32c0_phase_c0_5_publication.py' not in text:
              text = text.replace(anchor, anchor + '            _py("data/device-catalog/research/test_stm32c0_phase_c0_5_publication.py"),\n', 1)
          anchor = '    assert affected_families(["data/device-catalog/research/stm32c0_phase_c0_4_admission.py"]) == ["stm32c0"]\n'
          if 'affected_families(["data/device-catalog/research/test_stm32c0_phase_c0_5_publication.py"])' not in text:
              text = text.replace(anchor, anchor + '    assert affected_families(["data/device-catalog/research/test_stm32c0_phase_c0_5_publication.py"]) == ["stm32c0"]\n', 1)
          p.write_text(text)
          PY
      - name: Run complete C0 and cross-family validation
        run: |
          python data/device-catalog/research/validate_stm32c0_phase_c0_2_retained_evidence.py
          python data/device-catalog/research/test_stm32c0_phase_c0_3_policy.py
          python data/device-catalog/research/test_stm32c0_phase_c0_4_admission.py
          python data/device-catalog/research/validate_stm32c0_phase_c0_4_admission_plan.py
          python data/device-catalog/research/test_stm32c0_phase_c0_5_publication.py
          python data/device-catalog/research/publish_stm32c0_phase_c0_5.py --verify
          python data/device-catalog/research/test_stm32_cross_family_prioritization.py
          python data/device-catalog/research/test_stm32_post_u0_evidence_probe.py
          python scripts/device-catalog-family-ci.py self-test
      - name: Commit lifecycle closure
        run: |
          git config user.name "plasma-catalog-bot"
          git config user.email "plasma-catalog-bot@users.noreply.github.com"
          git add \
            data/device-catalog/research/stm32c0_phase_c0_4_admission.py \
            data/device-catalog/research/validate_stm32c0_phase_c0_2_retained_evidence.py \
            data/device-catalog/research/test_stm32c0_phase_c0_4_admission.py \
            data/device-catalog/research/test_stm32_cross_family_prioritization.py \
            scripts/device-catalog-family-ci.py
          git commit -m "C0.5: close historical and current catalog lifecycle"
          git push origin HEAD:agent/device-catalog-stm32c0-phase-c05-publication
