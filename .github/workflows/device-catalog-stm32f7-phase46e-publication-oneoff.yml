# rerun after historical Phase 4.6D fixture repair
name: STM32F7 Phase 4.6E publication closure one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f7-phase46e-publication
    paths:
      - .github/workflows/device-catalog-stm32f7-phase46e-publication-oneoff.yml

permissions:
  contents: read

jobs:
  replay-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay frozen STM32F7 admission contract
        run: |
          python data/device-catalog/research/test_stm32f7_phase4_6d_admission.py
          python data/device-catalog/research/validate_stm32f7_phase4_6d_admission_plan.py
      - name: Validate STM32F7 post-publication closure
        run: python data/device-catalog/research/test_stm32f7_phase4_6e_publication.py
      - name: Validate cross-version current Production assertions
        run: |
          python data/device-catalog/research/test_stm32f0_phase4_5d_admission.py
          python data/device-catalog/research/test_stm32f3_phase4_4d_admission.py
