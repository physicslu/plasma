name: STM32F7 Phase 4.6E publication apply one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f7-phase46e-publication
    paths:
      - .github/workflows/device-catalog-stm32f7-phase46e-publication-oneoff.yml

permissions:
  contents: write

jobs:
  apply-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-stm32f7-phase46e-publication
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay frozen Phase 4.6D admission contract
        run: |
          python data/device-catalog/research/test_stm32f7_phase4_6d_admission.py
          python data/device-catalog/research/validate_stm32f7_phase4_6d_admission_plan.py
      - name: Apply digest-locked canonical and Production publication
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path('.')
          research = root / 'data/device-catalog/research'
          production = root / 'data/device-catalog/production'
          plan_path = research / 'stm32f7-phase4.6d-admission-plan.json'
          canonical_path = research / 'stm32f7-commercial-icpn.csv'
          manifest_path = production / 'icpn-v1-manifest.json'
          audit_path = research / 'stm32f7-phase4.6e-publication-audit.json'

          expected_plan_sha = '1e13d87d9d4e445efb5dbb43b79bad1bf3b5b916126095fb5a55c58580691a7e'
          expected_canonical_sha = 'c71434cc85068353a1aabdfe24059573c3e8092505fcdb1d6eda7f2374fa64d7'
          expected_canonical_blob = 'd61ebd2c56edf6bb7b1cadc381c23d071fe7967f'
          expected_manifest_sha = '4b05b3e3e7cb8e9b8cc426f9358d758f04d5bc4944b23e44ee0cad1d3bea1cd3'
          proposal_sha = 'a4b91cfc04af2f950ec2ce0457668a65d9aa081132b6685b15f697c311d136bb'

          assert not canonical_path.exists(), 'STM32F7 canonical already exists before Phase 4.6E publication'
          assert not audit_path.exists(), 'Phase 4.6E publication audit already exists'

          plan_bytes = plan_path.read_bytes()
          plan_sha = hashlib.sha256(plan_bytes).hexdigest()
          assert plan_sha == expected_plan_sha
          plan = json.loads(plan_bytes)
          assert plan['candidate_count'] == 19
          assert plan['decision_counts'] == {
              'admit': 19,
              'already_present': 0,
              'manual_review_required': 0,
              'reject': 0,
          }

          rows = [item['proposed_canonical_row'] for item in plan['candidates'] if item['decision'] == 'admit']
          rows.sort(key=lambda row: row['icpn'])
          fields = [
              'manufacturer','icpn','family','series','base_device','package','pin_count','flash_size',
              'temperature_grade','option_suffix','cmsis_device_name','existing_identifier',
              'existing_identifier_kind','mapping_status','openocd_target_config','source_type',
              'source_reference','source_authority','verification_status'
          ]
          assert len(rows) == 19
          assert all(set(row) == set(fields) for row in rows)
          with canonical_path.open('w', newline='', encoding='utf-8') as handle:
              writer = csv.DictWriter(handle, fieldnames=fields, lineterminator='\n')
              writer.writeheader()
              writer.writerows(rows)

          canonical_sha = hashlib.sha256(canonical_path.read_bytes()).hexdigest()
          canonical_blob = subprocess.check_output(['git', 'hash-object', str(canonical_path)], text=True).strip()
          assert canonical_sha == expected_canonical_sha, canonical_sha
          assert canonical_blob == expected_canonical_blob, canonical_blob

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert all(item.get('family') != 'STM32F7' for item in manifest['sources'])
          assert sum(int(item['row_count']) for item in manifest['sources']) == 544
          assert len(manifest['sources']) == 5
          manifest['sources'].append({
              'manufacturer': 'STMicroelectronics',
              'family': 'STM32F7',
              'path': '../research/stm32f7-commercial-icpn.csv',
              'row_count': 19,
              'git_blob_sha': canonical_blob,
              'sha256': canonical_sha,
          })
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          manifest_sha = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          assert manifest_sha == expected_manifest_sha, manifest_sha

          audit = {
              'phase': '4.6E',
              'status': 'published',
              'publication_proposal_sha256': proposal_sha,
              'admission_plan_sha256': plan_sha,
              'canonical_csv_file_sha256': canonical_sha,
              'canonical_csv_git_blob_sha': canonical_blob,
              'production_manifest_sha256_after': manifest_sha,
              'stm32f7_rows_before': 0,
              'stm32f7_rows_after': 19,
              'stm32f7_base_devices_after': 9,
              'production_exact_icpns_before': 544,
              'production_exact_icpns_after': 563,
              'production_base_devices_before': 188,
              'production_base_devices_after': 197,
              'production_family_count_before': 5,
              'production_family_count_after': 6,
              'added_exact_icpns': sorted(row['icpn'] for row in rows),
              'canonical_write_applied': True,
              'production_write_applied': True,
              'programming_algorithm_equivalence_claimed': False,
              'physical_target_qualification_claimed': False,
              'runtime_programming_support_claimed': False,
              'full_stm32f7_surface_covered': False,
          }
          audit_path.write_text(json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          audit_sha = hashlib.sha256(audit_path.read_bytes()).hexdigest()
          print(json.dumps({
              'canonical_sha256': canonical_sha,
              'canonical_git_blob_sha': canonical_blob,
              'manifest_sha256': manifest_sha,
              'audit_sha256': audit_sha,
              'production_exact_icpns_after': 563,
              'production_base_devices_after': 197,
              'production_family_count_after': 6,
              'stm32f7_rows_after': 19,
              'stm32f7_base_devices_after': 9,
          }, indent=2, sort_keys=True))
          PY
      - name: Commit published data only
        run: |
          set -Eeuo pipefail
          git config user.name 'plasma-ci'
          git config user.email 'plasma-ci@users.noreply.github.com'
          git add \
            data/device-catalog/research/stm32f7-commercial-icpn.csv \
            data/device-catalog/research/stm32f7-phase4.6e-publication-audit.json \
            data/device-catalog/production/icpn-v1-manifest.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'ERROR: publication produced no data changes' >&2; exit 1; }
          git commit -m 'device-catalog: publish STM32F7 Phase 4.6E exact ICPNs'
          git push origin HEAD:agent/device-catalog-stm32f7-phase46e-publication
