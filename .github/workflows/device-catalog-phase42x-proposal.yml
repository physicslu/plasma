name: Device catalog Phase 4.2X M/Y WLCSP81 admission proposal
on:
  push:
    branches: [agent/device-catalog-phase4.2x-my-wlcsp81-admission]
    paths: [".github/workflows/device-catalog-phase42x-proposal.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  propose:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2x-my-wlcsp81-admission}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build proposal
        run: |
          mkdir -p /tmp/phase42x
          PYTHONPATH=data/device-catalog/research python data/device-catalog/research/stm32f4_admission.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2x-my-wlcsp81-admission-live-2026-09-04 \
            --baseline data/device-catalog/research/stm32f4-phase4.2x-my-wlcsp81-admission-baseline.json \
            --admit-base STM32F413MG --admit-base STM32F413MH --admit-base STM32F423MH --admit-base STM32F446MC --admit-base STM32F446ME \
            --output /tmp/phase42x/admission-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/phase42x/admission-plan.json').read_text())
          expected={'admit':7,'already_present':0,'manual_review_required':0,'reject':0}
          expected_icpns={'STM32F413MGY6TR','STM32F413MHY6TR','STM32F423MHY3TR','STM32F423MHY6TR','STM32F446MCY6TR','STM32F446MEY6MTR','STM32F446MEY6TR'}
          if p['candidate_count'] != 7 or p['decision_counts'] != expected or p['conflicts'] != 0 or p['canonical_rows_before'] != 331:
              raise SystemExit('unclean Phase 4.2X plan')
          if {x['icpn'] for x in p['candidates']} != expected_icpns:
              raise SystemExit('unexpected Phase 4.2X candidate set')
          PY
          cd /tmp/phase42x && sha256sum admission-plan.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: {name: phase42x-my-wlcsp81-admission-proposal, path: /tmp/phase42x, if-no-files-found: error, retention-days: 30}
