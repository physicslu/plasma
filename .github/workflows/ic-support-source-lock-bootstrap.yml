name: IC Support source-lock bootstrap

on:
  push:
    branches:
      - agent/ic-support-source-lock-bootstrap
    paths:
      - "data/ic-support/evidence/**"
      - ".github/workflows/ic-support-source-lock-bootstrap.yml"

permissions:
  contents: read

jobs:
  discover-source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover official PDF hashes
        run: python data/ic-support/evidence/source_integrity.py discover
