name: Device catalog Phase 4.2I STM32F405O/415OG controlled publish

on:
  push:
    branches:
      - agent/device-catalog-phase4.2i-f405o-f415og-admission
    paths:
      - ".github/workflows/device-catalog-phase42i-controlled-publish.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-phase4.2i-f405o-f415og-admission
      - uses: actions/download-artifact@v4
        with:
          name: phase42i-stm32f405o-f415og-admission-proposal
          path: /tmp/phase42i-proposal
          github-token: ${{ github.token }}
          repository: physicslu/plasma
          run-id: 33627682129
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable proposal and controlled Production pre-state
        run: |
          set -euo pipefail
          echo '58d5a9c10b82bd13325e04a9931a42a6bf554304b006b797e9cc46b7014c08db  /tmp/phase42i-proposal/plan.json' | sha256sum -c -
          echo '2b3e7aaf50e855957af2072815fd536ac8e4374f7a4326f035e344f2c1abc19b  /tmp/phase42i-proposal/proposed.csv' | sha256sum -c -
          echo '1cf48b6b25f5a9efe43276fd657c94e389ee271da5ef955c27e28320e0760103  /tmp/phase42i-proposal/write-result.json' | sha256sum -c -
          python - <<'PY'
          import csv, hashlib, json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'data/device-catalog/research')
          from device_catalog_admission_framework import write_canonical_dataset

          canonical = Path('data/device-catalog/research/stm32f4-commercial-icpn.csv')
          manifest_path = Path('data/device-catalog/production/icpn-v1-manifest.json')
          audit_path = Path('data/device-catalog/research/stm32f4-phase4.2i-f405o-f415og-admission-audit.json')
          plan_path = Path('/tmp/phase42i-proposal/plan.json')
          proposed = Path('/tmp/phase42i-proposal/proposed.csv')

          pre_sha = hashlib.sha256(canonical.read_bytes()).hexdigest()
          assert pre_sha == '22419b078f1c6436f0aa6dd3b410791170a1976be59a03a814469acc54690f09', pre_sha
          pre_blob = subprocess.check_output(['git', 'hash-object', str(canonical)], text=True).strip()
          assert pre_blob == '13c456ad4b64a0be2d626af45d2b2fddb9ab4c17', pre_blob
          with canonical.open(newline='', encoding='utf-8') as f:
              assert sum(1 for _ in csv.DictReader(f)) == 208
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          f4 = next(x for x in manifest['sources'] if x['family'] == 'STM32F4')
          assert f4['row_count'] == 208, f4
          assert f4['sha256'] == pre_sha, f4
          assert f4['git_blob_sha'] == pre_blob, f4

          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          assert plan['candidate_count'] == 3, plan
          assert plan['decision_counts'] == {
              'admit': 3,
              'already_present': 0,
              'manual_review_required': 0,
              'reject': 0,
          }, plan
          assert plan['conflicts'] == 0 and plan['issues'] == [], plan

          result = write_canonical_dataset(plan=plan, canonical_path=canonical)
          assert result['status'] == 'written', result
          assert result['rows_before'] == 208 and result['rows_after'] == 211, result
          assert sorted(result['added']) == [
              'STM32F405OEY6TR',
              'STM32F405OGY6TR',
              'STM32F415OGY6TR',
          ], result
          assert canonical.read_bytes() == proposed.read_bytes()

          post_sha = hashlib.sha256(canonical.read_bytes()).hexdigest()
          assert post_sha == '2b3e7aaf50e855957af2072815fd536ac8e4374f7a4326f035e344f2c1abc19b', post_sha
          post_blob = subprocess.check_output(['git', 'hash-object', str(canonical)], text=True).strip()

          f4['row_count'] = 211
          f4['sha256'] = post_sha
          f4['git_blob_sha'] = post_blob
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          audit = {
              'schema_version': 1,
              'transaction': 'stm32f4-phase4.2i-f405o-f415og-admission-2026-09-02',
              'retained_evidence_id': 'stm32f4-phase4.2i-f405o-f415og-admission-2026-09-02-retained-20260902T115842Z-c159334',
              'retained_run_id': '33627304458',
              'retained_artifact_id': '9845365879',
              'retained_artifact_sha256': '5ddf79b73a15c3ea412e98a6ed908c2a74f8670f7320d11b880248486fafcbb9',
              'proposal_run_id': '33627682129',
              'proposal_artifact_id': '9845456075',
              'proposal_artifact_sha256': 'b932a860350a03df3881d96d3e8680ed1dd96dbe9d837da7ae83eeefaf41cde6',
              'proposal_plan_sha256': '58d5a9c10b82bd13325e04a9931a42a6bf554304b006b797e9cc46b7014c08db',
              'pre_rows': 208,
              'post_rows': 211,
              'new_exact_icpns': sorted(result['added']),
              'final_csv_sha256': post_sha,
              'final_csv_git_blob': post_blob,
              'canonical_dataset_written': True,
              'algorithm_equivalence_claimed': False,
              'physical_ppu_validation_claimed': False,
          }
          audit_path.write_text(json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(audit, indent=2, sort_keys=True))
          PY
          git diff --check -- \
            data/device-catalog/production/icpn-v1-manifest.json \
            data/device-catalog/research/stm32f4-commercial-icpn.csv \
            data/device-catalog/research/stm32f4-phase4.2i-f405o-f415og-admission-audit.json
      - name: Commit controlled Production publish
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/stm32f4-commercial-icpn.csv \
                  data/device-catalog/production/icpn-v1-manifest.json \
                  data/device-catalog/research/stm32f4-phase4.2i-f405o-f415og-admission-audit.json
          git diff --cached --check
          git commit -m 'device-catalog: admit STM32F405O/415OG exact ICPNs'
          git push origin HEAD:agent/device-catalog-phase4.2i-f405o-f415og-admission
