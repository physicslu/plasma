name: STM32H5 pinned OpenOCD ARMv7 isolated CI v1

on:
  pull_request:
    paths:
      - '.github/workflows/device-catalog-st-h5-armv7-build-v1.yml'
      - 'data/device-catalog/research/ST_H5_ARMV7_BUILD_V1.md'

permissions:
  contents: read

jobs:
  armv7-cross-compile-and-qemu-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Cross-compile pinned vendor OpenOCD to ARMv7 on x86_64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h5-armv7-work" "$RUNNER_TEMP/h5-armv7-evidence"
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$RUNNER_TEMP/h5-armv7-work,dst=/work" \
            debian:bookworm bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                ca-certificates git make gcc gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \
                autoconf automake libtool pkg-config texinfo file
              git clone --quiet https://github.com/STMicroelectronics/OpenOCD.git /work/src
              git -C /work/src checkout --quiet --detach c8d973bdad9a6fddb51459eda109b3b95d23b57a
              test "$(git -C /work/src rev-parse HEAD)" = "c8d973bdad9a6fddb51459eda109b3b95d23b57a"
              test "$(git -C /work/src hash-object tcl/target/stm32h5x.cfg)" = "b9e67c604f7d824fefca03b42d0b112e1785235a"
              test "$(git -C /work/src hash-object src/flash/nor/stm32h5x.c)" = "b5f24a39da05e5235167ff91c110ed89c2e3f9c5"
              test "$(git -C /work/src hash-object src/flash/nor/drivers.c)" = "219dfa9a4a87a96d43b5e7496cbab47092f77b7a"
              git -C /work/src submodule update --init --recursive
              cd /work/src
              ./bootstrap
              export PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
              printf "int main(void){return 0;}\\n" >/work/cc-probe.c
              arm-linux-gnueabihf-gcc /work/cc-probe.c -o /work/cc-probe
              file /work/cc-probe | grep -E "ELF 32-bit.*ARM"
              if ! ./configure --host=arm-linux-gnueabihf \
                --prefix=/work/prefix \
                --enable-dummy --disable-werror --without-capstone; then
                tail -n 140 config.log
                exit 2
              fi
              make -j2
              make install
              test -x /work/prefix/bin/openocd
              test -f /work/prefix/share/openocd/scripts/target/stm32h5x.cfg
              file /work/prefix/bin/openocd
              file /work/prefix/bin/openocd | grep -E "ELF 32-bit.*ARM"
              echo H5_ARMV7_CROSS_BUILD_PASS
            '

      - name: Run ARMv7 ELF, offline H5 config and PLASMA archive verifier under QEMU
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/arm/v7 \
            --mount "type=bind,src=$PWD,dst=/plasma,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/h5-armv7-work,dst=/work" \
            --mount "type=bind,src=$RUNNER_TEMP/h5-armv7-evidence,dst=/evidence" \
            debian:bookworm bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends python3
              test "$(uname -m)" = armv7l
              /work/prefix/bin/openocd --version
              timeout 20s /work/prefix/bin/openocd \
                -s /work/prefix/share/openocd/scripts \
                -c "adapter driver dummy" \
                -c "transport select jtag" \
                -f target/stm32h5x.cfg -c shutdown
              mkdir -p /work/artifacts
              python3 /plasma/scripts/openocd-runtime.py build \
                --prefix /work/prefix \
                --output-dir /work/artifacts \
                --version 0.12.0 \
                --source-commit c8d973bdad9a6fddb51459eda109b3b95d23b57a \
                --architecture armv7l > /work/build.json
              python3 /plasma/scripts/openocd-runtime.py verify \
                /work/artifacts/plasma-openocd-0.12.0-c8d973bdad9a-linux-armv7l.tar.gz \
                > /work/verify.json
              python3 - <<'"'"'PY'"'"'
          import json
          from pathlib import Path
          root = Path("/work")
          built = json.loads((root / "build.json").read_text())
          verified = json.loads((root / "verify.json").read_text())
          assert built["result"] == verified["result"] == "PASS"
          assert built["architecture"] == verified["architecture"] == "armv7l"
          assert built["artifact_sha256"] == verified["archive_sha256"]
          assert built["payload_sha256"] == verified["payload_sha256"]
          assert built["source_commit"] == verified["source_commit"] == "c8d973bdad9a6fddb51459eda109b3b95d23b57a"
          assert built["hardware_runtime_ready"] is verified["hardware_runtime_ready"] is False
          result = {
              "schema_version": 1,
              "status": "ARMV7_CROSS_BUILD_QEMU_SMOKE_PASS",
              "architecture": "armv7l",
              "build_host": "debian-bookworm-x86_64-cross-gcc",
              "execution_host": "debian-bookworm-armv7-qemu-user",
              "runtime_id": built["runtime_id"],
              "source_commit": built["source_commit"],
              "artifact_sha256": built["artifact_sha256"],
              "payload_sha256": built["payload_sha256"],
              "h5_cfg_dummy_jtag_parse": True,
              "fpga_swd_adapter_verified": False,
              "z2_ps_native_qualified": False,
              "real_ic_programmed": False,
              "hardware_runtime_ready": False,
              "production_write_authorized": False,
              "runtime_binary_uploaded": False
          }
          Path("/evidence/armv7-source-build.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
            '
          test -s "$RUNNER_TEMP/h5-armv7-evidence/armv7-source-build.json"
          cat "$RUNNER_TEMP/h5-armv7-evidence/armv7-source-build.json"

      - uses: actions/upload-artifact@v4
        with:
          name: st-h5-armv7-emulated-evidence-only
          path: ${{ runner.temp }}/h5-armv7-evidence/armv7-source-build.json
          if-no-files-found: error
          retention-days: 14
