name: TEMP STM32C0 C0.5 lifecycle repair

on:
  push:
    branches:
      - agent/device-catalog-stm32c0-phase-c05-publication
    paths:
      - ".github/workflows/tmp-stm32c0-c05-lifecycle-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-stm32c0-phase-c05-publication
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preserve historical C0.4 and post-U0 replay boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          c04 = Path('data/device-catalog/research/stm32c0_phase_c0_4_admission.py')
          text = c04.read_text()
          text = text.replace(
              '    DEFAULT_POLICY_BASELINE,\n',
              '    DEFAULT_POLICY_BASELINE,\n    DEFAULT_PRODUCTION_MANIFEST,\n',
              1,
          )
          text = text.replace('LIVE_PRODUCTION_MANIFEST = HERE.parent / "production/icpn-v1-manifest.json"\n', '', 1)
          text = text.replace(
              'production_manifest_path: Path = LIVE_PRODUCTION_MANIFEST,',
              'production_manifest_path: Path = DEFAULT_PRODUCTION_MANIFEST,',
              1,
          )
          text = text.replace('"live Production manifest blob drifted"', '"C0.3 Production prestate blob drifted"', 1)
          text = text.replace('"live Production manifest SHA-256 drifted"', '"C0.3 Production prestate SHA-256 drifted"', 1)
          c04.write_text(text)

          probe = Path('data/device-catalog/research/stm32_post_u0_evidence_probe.py')
          text = probe.read_text()
          anchor = 'HERE = Path(__file__).resolve().parent\n'
          replacement = anchor + 'HISTORICAL_POST_U0_MANIFEST = HERE / "stm32c0-phase-c0.3-production-manifest-prestate.json"\n'
          if anchor not in text:
              raise SystemExit('post-U0 HERE anchor missing')
          text = text.replace(anchor, replacement, 1)
          old = 'manifest_path: Path = DEFAULT_PRODUCTION_MANIFEST,'
          if text.count(old) != 2:
              raise SystemExit(f'unexpected post-U0 manifest default count: {text.count(old)}')
          text = text.replace(old, 'manifest_path: Path = HISTORICAL_POST_U0_MANIFEST,')
          probe.write_text(text)
          PY
      - name: Show post-C0 current cross-family state
        run: |
          python data/device-catalog/research/stm32_cross_family_prioritization.py --output /tmp/post-c0.json
          python - <<'PY'
          import json
          r = json.load(open('/tmp/post-c0.json'))
          print(json.dumps({
            'production_invariants': r['production_invariants'],
            'inventory': r['inventory'],
            'research_shortlist': r['research_shortlist'],
          }, indent=2, sort_keys=True))
          PY
      - name: Commit historical lifecycle repair
        run: |
          git config user.name "plasma-catalog-bot"
          git config user.email "plasma-catalog-bot@users.noreply.github.com"
          git add \
            data/device-catalog/research/stm32c0_phase_c0_4_admission.py \
            data/device-catalog/research/stm32_post_u0_evidence_probe.py
          git commit -m "C0.5: preserve historical admission and post-U0 replay"
          git push origin HEAD:agent/device-catalog-stm32c0-phase-c05-publication
