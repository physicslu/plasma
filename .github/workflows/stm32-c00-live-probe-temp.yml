name: STM32 C0.0 temporary selection freezer

on:
  push:
    branches:
      - agent/device-catalog-stm32c0-phase-c00-evidence-selection
    paths:
      - .github/workflows/stm32-c00-live-probe-temp.yml

permissions:
  contents: write

concurrency:
  group: stm32-c00-selection-freeze
  cancel-in-progress: true

jobs:
  freeze-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-stm32c0-phase-c00-evidence-selection
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate post-U0 evidence boundaries and selection policy
        run: |
          python data/device-catalog/research/test_stm32_post_u0_evidence_probe.py
          python data/device-catalog/research/test_stm32_post_u0_selection.py

      - name: Generate deterministic frozen selection
        run: |
          python data/device-catalog/research/freeze_stm32_post_u0_selection.py \
            --output /tmp/stm32-post-u0-next-family-selection.json

      - name: Retain runner-generated frozen selection
        run: |
          set -euo pipefail
          branch=agent/device-catalog-stm32c0-phase-c00-evidence-selection
          git fetch origin "$branch"
          git rebase "origin/$branch"
          cp /tmp/stm32-post-u0-next-family-selection.json \
            data/device-catalog/research/stm32-post-u0-next-family-selection.json
          git config user.name plasma-ci
          git config user.email plasma-ci@users.noreply.github.com
          git add data/device-catalog/research/stm32-post-u0-next-family-selection.json
          git commit -m "Device catalog: freeze post-U0 STM32 next-family selection"
          git push origin HEAD:"$branch"
