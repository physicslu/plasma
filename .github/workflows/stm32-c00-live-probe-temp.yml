name: STM32 C0.0 temporary post-U0 live evidence probe

on:
  push:
    branches:
      - agent/device-catalog-stm32c0-phase-c00-evidence-selection
    paths:
      - .github/workflows/stm32-c00-live-probe-temp.yml

permissions:
  contents: write

jobs:
  acquire-and-retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-stm32c0-phase-c00-evidence-selection
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate current post-U0 boundary and deterministic targets
        run: |
          python - <<'PY'
          import json
          from data.device-catalog.research import stm32_post_u0_evidence_probe
          PY
        continue-on-error: true

      - name: Install bounded browser acquisition dependencies
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium

      - name: Acquire 26 deterministic current-shortlist representatives
        run: |
          mkdir -p .artifacts/c00/evidence
          xvfb-run -a python data/device-catalog/research/run_stm32_post_u0_evidence_probe.py \
            --delay 1.0 \
            --timeout 75 \
            --output .artifacts/c00/probe-summary.json \
            --targets-output .artifacts/c00/targets.json \
            --evidence-dir .artifacts/c00/evidence

      - name: Record provenance and retained digests
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('.artifacts/c00')
          summary = json.loads((root / 'probe-summary.json').read_text())
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          evidence_files = sorted((root / 'evidence').glob('*.json'))
          provenance = {
              'schema_version': 1,
              'phase': 'C0.0',
              'transaction': 'post_u0_next_family_evidence_selection',
              'source_repository': os.environ['GITHUB_REPOSITORY'],
              'executed_git_sha': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'production_state': {'exact_icpns': 703, 'base_devices': 243, 'stm32_families': 9},
              'candidate_series': summary['candidate_series'],
              'target_count': summary['attempted_targets'],
              'dispositioned_targets': summary['dispositioned_targets'],
              'manual_review_targets': summary['manual_review_targets'],
              'browser': summary.get('browser'),
              'acquisition_transport': summary.get('acquisition_transport'),
              'openocd_catalog_sha256': sha(pathlib.Path('data/device-catalog/research/openocd-parts-canonical.csv')),
              'production_manifest_sha256': sha(pathlib.Path('data/device-catalog/production/icpn-v1-manifest.json')),
              'probe_summary_sha256': sha(root / 'probe-summary.json'),
              'targets_sha256': sha(root / 'targets.json'),
              'evidence_file_count': len(evidence_files),
              'evidence_files': {p.name: sha(p) for p in evidence_files},
              'claims': {
                  'production_write_authorized': False,
                  'selected_next_research_family': False,
                  'programming_algorithm_equivalence_claimed': False,
                  'runtime_programming_support_claimed': False,
              },
          }
          (root / 'provenance.json').write_text(json.dumps(provenance, indent=2, sort_keys=True) + '\n')
          PY

      - name: Retain live evidence on feature branch
        run: |
          set -euo pipefail
          dst=data/device-catalog/research/evidence/stm32-c0-l1-l0-post-u0-live-2026-09-11
          mkdir -p "$dst/evidence"
          cp .artifacts/c00/probe-summary.json "$dst/probe-summary.json"
          cp .artifacts/c00/targets.json "$dst/targets.json"
          cp .artifacts/c00/provenance.json "$dst/provenance.json"
          cp .artifacts/c00/evidence/*.json "$dst/evidence/"
          git config user.name plasma-ci
          git config user.email plasma-ci@users.noreply.github.com
          git add "$dst"
          git commit -m "Device catalog: retain post-U0 STM32 live evidence"
          git push origin HEAD:agent/device-catalog-stm32c0-phase-c00-evidence-selection
