name: PL shared Identity and retired SWD GPIO host-only contracts

on:
  pull_request:
    paths:
      - "pl/**"
      - ".github/workflows/pl-z2-swd-gpio.yml"
  push:
    branches: [main]
    paths:
      - "pl/**"
      - ".github/workflows/pl-z2-swd-gpio.yml"

permissions:
  contents: read

jobs:
  z2-swd-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate host script syntax and compile packaging tool
        run: |
          bash -n pl/projects/z2-swd-gpio/build-on-swpc.sh
          bash -n pl/projects/z2-swd-gpio/run-monitored-on-swpc.sh
          bash -n pl/projects/z2-swd-gpio/build-blocking-on-swpc.sh
          bash -n pl/projects/z2-swd-gpio/check-swpc-vivado-runner.sh
          bash -n pl/projects/z2-swd-gpio/prepare-board-repository.sh
          bash -n pl/projects/z2-swd-gpio/rtl-lint.sh
          bash -n pl/projects/z2-identity/build-on-swpc.sh
          python3 -m py_compile pl/projects/z2-identity/artifact.py
          python3 -m py_compile pl/projects/z2-swd-gpio/artifact.py
          python3 -m py_compile pl/projects/z2-swd-gpio/build-progress.py
      - name: Source layout and artifact unit tests (no Vivado or Z2)
        run: |
          # PL HIL tests import the production Python interfaces and its declared PyYAML dependency.
          python3 -m pip install pytest 'PyYAML>=6.0'
          PYTHONPATH=software/python:. python3 -m pytest -q pl/tests
      - name: Install RTL simulators and cocotb test requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends verilator iverilog
          python3 -m pip install 'cocotb==1.9.2' 'cocotb-test==0.2.6'
      - name: Verilator lint and elaboration
        run: |
          bash pl/projects/z2-swd-gpio/rtl-lint.sh
          verilator --lint-only --sv -Wall -Wno-UNUSEDSIGNAL --top-module pl_identity_axi_lite -GCAPABILITY_FLAGS=0 "-GSTRICT_ADDRESS=1'b1" -GAXI_BASE_ADDRESS=1073741824 -Ipl/sim/identity_constants pl/rtl/bus/pl_identity_axi_lite.sv
      - name: Cocotb real RTL functional regressions
        run: python3 -m pytest -v pl/verification/test_z2_swd_gpio_rtl.py pl/verification/test_z2_identity_rtl.py
      - name: Upload Cocotb simulation failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: z2-swd-cocotb-failure-${{ github.run_id }}
          path: |
            pl/build/z2-swd-gpio/sim/
          retention-days: 7
          if-no-files-found: warn
      - name: Validation boundary
        run: |
          echo "Verilator RTL lint/elaboration + Icarus/Cocotb AXI and SWD digital functional regressions: PASS." >> "$GITHUB_STEP_SUMMARY"
          echo "Vivado IP Integrator, synthesis, implementation, timing, Bitstream, Z2 HIL and real IC NOT tested." >> "$GITHUB_STEP_SUMMARY"
