name: Device catalog Phase 4.0 foundation batch11 controlled publish

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  publish-stm32f4-foundation-batch11:
    if: github.event.pull_request.number == 273 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PROPOSAL_RUN_ID: "33465207580"
      PROPOSAL_ARTIFACT_ID: "9784588327"
      PROPOSAL_ZIP_SHA256: "906ae4219072b29b5f83b40c3e8f587e948758cbfbc4a0e681adb3001993e92f"
      EXPECTED_PLAN_SHA256: "2c024e80102919ff9be2213d48809c0dde07d8a8e5d7ad7dbdd83fab54f433fe"
      EXPECTED_CSV_SHA256: "6a3150e356511dfed679b747515d1ae1380d3da101b11edd3322f27cd936c948"
      EXPECTED_CSV_GIT_BLOB: "21ad3fee8b780949e8184cdb56b5601fe6a48c03"
      PRE_BATCH11_ROWS: "157"
      PRE_BATCH11_CSV_SHA256: "9a5c90fd0b1b326a073fa7d88d7d76962716872505a5f856b6b8f5ba0b2d3a41"
      PRE_BATCH11_GIT_BLOB: "8a6740da10a312612b047b1dd65e79dae8deef56"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable proposal artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROPOSAL_ARTIFACT_ID}/zip" \
            --output /tmp/batch11-proposal.zip
          echo "${PROPOSAL_ZIP_SHA256}  /tmp/batch11-proposal.zip" | sha256sum --check --strict
          rm -rf /tmp/batch11-proposal
          mkdir -p /tmp/batch11-proposal
          unzip -q /tmp/batch11-proposal.zip -d /tmp/batch11-proposal
          echo "${EXPECTED_PLAN_SHA256}  /tmp/batch11-proposal/admission-plan.json" | sha256sum --check --strict
          echo "${EXPECTED_CSV_SHA256}  /tmp/batch11-proposal/stm32f4-commercial-icpn.proposed.csv" | sha256sum --check --strict
          test "$(git hash-object /tmp/batch11-proposal/stm32f4-commercial-icpn.proposed.csv)" = "${EXPECTED_CSV_GIT_BLOB}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('/tmp/batch11-proposal/admission-report.json').read_text(encoding='utf-8'))
          if report.get('plan_sha256') != os.environ['EXPECTED_PLAN_SHA256']:
              raise SystemExit('proposal report plan SHA mismatch')
          if report.get('proposed_csv_sha256') != os.environ['EXPECTED_CSV_SHA256']:
              raise SystemExit('proposal report CSV SHA mismatch')
          if report.get('source_rows') != 157 or report.get('proposed_rows') != 158:
              raise SystemExit(f'unexpected proposal row accounting: {report}')
          if report.get('added') != ['STM32F479ZIT6']:
              raise SystemExit(f'unexpected proposal added list: {report.get("added")}')
          PY

      - name: Rebuild proposal from retained evidence and verify immutable bindings
        run: |
          set -euo pipefail
          rm -rf /tmp/batch11-rebuild
          mkdir -p /tmp/batch11-rebuild
          python data/device-catalog/research/stm32f4_admission.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.0-foundation-batch11-live-2026-09-01 \
            --baseline data/device-catalog/research/stm32f4-phase4.0-foundation-batch11-baseline.json \
            --canonical data/device-catalog/research/stm32f4-commercial-icpn.csv \
            --admit-base STM32F479ZI \
            --output /tmp/batch11-rebuild/admission-plan.json
          echo "${EXPECTED_PLAN_SHA256}  /tmp/batch11-rebuild/admission-plan.json" | sha256sum --check --strict
          python - <<'PY'
          import json
          import os
          import shutil
          import sys
          from pathlib import Path
          root = Path('data/device-catalog/research')
          sys.path.insert(0, str(root))
          from device_catalog_admission_framework import write_canonical_dataset
          import validate_stm32f4_commercial_icpn as validator
          plan = json.loads(Path('/tmp/batch11-rebuild/admission-plan.json').read_text(encoding='utf-8'))
          expected = {'admit': 1, 'already_present': 0, 'manual_review_required': 0, 'reject': 0}
          if plan.get('candidate_count') != 1 or plan.get('decision_counts') != expected:
              raise SystemExit(f'unexpected rebuilt plan: {plan}')
          if plan.get('canonical_rows_before') != int(os.environ['PRE_BATCH11_ROWS']):
              raise SystemExit(f'unexpected pre-row count: {plan.get("canonical_rows_before")}')
          if plan.get('conflicts') != 0 or plan.get('issues') != []:
              raise SystemExit(f'unsafe rebuilt plan: {plan}')
          source = root / 'stm32f4-commercial-icpn.csv'
          proposed = Path('/tmp/batch11-rebuild/stm32f4-commercial-icpn.proposed.csv')
          shutil.copyfile(source, proposed)
          write_report = write_canonical_dataset(plan=plan, canonical_path=proposed)
          if write_report.get('status') != 'written' or write_report.get('rows_before') != 157 or write_report.get('rows_after') != 158:
              raise SystemExit(f'unexpected writer report: {write_report}')
          if write_report.get('added') != ['STM32F479ZIT6']:
              raise SystemExit(f'unexpected writer added list: {write_report}')
          validator.CANONICAL = proposed
          validation = validator.validate()
          if validation.get('errors') or validation.get('rows') != 158 or validation.get('unique_icpns') != 158:
              raise SystemExit(f'proposed validation failed: {validation}')
          PY
          echo "${EXPECTED_CSV_SHA256}  /tmp/batch11-rebuild/stm32f4-commercial-icpn.proposed.csv" | sha256sum --check --strict
          test "$(git hash-object /tmp/batch11-rebuild/stm32f4-commercial-icpn.proposed.csv)" = "${EXPECTED_CSV_GIT_BLOB}"
          cmp /tmp/batch11-proposal/admission-plan.json /tmp/batch11-rebuild/admission-plan.json
          cmp /tmp/batch11-proposal/stm32f4-commercial-icpn.proposed.csv /tmp/batch11-rebuild/stm32f4-commercial-icpn.proposed.csv

      - name: Enforce production precondition and publish canonical bytes
        run: |
          set -euo pipefail
          canonical="data/device-catalog/research/stm32f4-commercial-icpn.csv"
          echo "${PRE_BATCH11_CSV_SHA256}  ${canonical}" | sha256sum --check --strict
          test "$(git hash-object "${canonical}")" = "${PRE_BATCH11_GIT_BLOB}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path('data/device-catalog/production/icpn-v1-manifest.json').read_text(encoding='utf-8'))
          source = next(item for item in payload['sources'] if item['family'] == 'STM32F4')
          expected = (int(os.environ['PRE_BATCH11_ROWS']), os.environ['PRE_BATCH11_CSV_SHA256'], os.environ['PRE_BATCH11_GIT_BLOB'])
          observed = (source['row_count'], source['sha256'], source['git_blob_sha'])
          if observed != expected:
              raise SystemExit(f'production manifest drifted: expected={expected} observed={observed}')
          PY
          cp /tmp/batch11-rebuild/stm32f4-commercial-icpn.proposed.csv "${canonical}"
          test "$(sha256sum "${canonical}" | awk '{print $1}')" = "${EXPECTED_CSV_SHA256}"
          test "$(git hash-object "${canonical}")" = "${EXPECTED_CSV_GIT_BLOB}"

      - name: Update production manifest and admission audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          canonical = Path('data/device-catalog/research/stm32f4-commercial-icpn.csv')
          manifest_path = Path('data/device-catalog/production/icpn-v1-manifest.json')
          audit_path = Path('data/device-catalog/research/stm32f4-phase4.0-foundation-batch11-admission-audit.json')
          plan = json.loads(Path('/tmp/batch11-rebuild/admission-plan.json').read_text(encoding='utf-8'))
          proposal_report = json.loads(Path('/tmp/batch11-proposal/admission-report.json').read_text(encoding='utf-8'))
          added = proposal_report.get('added', [])
          if added != ['STM32F479ZIT6']:
              raise SystemExit(f'invalid immutable added list: {added}')
          csv_sha = hashlib.sha256(canonical.read_bytes()).hexdigest()
          git_blob = subprocess.check_output(['git', 'hash-object', str(canonical)], text=True).strip()
          if csv_sha != os.environ['EXPECTED_CSV_SHA256'] or git_blob != os.environ['EXPECTED_CSV_GIT_BLOB']:
              raise SystemExit('final CSV immutable binding mismatch')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          source = next(item for item in manifest['sources'] if item['family'] == 'STM32F4')
          source['row_count'] = 158
          source['sha256'] = csv_sha
          source['git_blob_sha'] = git_blob
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          audit = {
              'schema_version': 1,
              'phase': 'stm32f4-phase4.0-foundation-batch11',
              'canonical_dataset_written': True,
              'evidence_id': 'stm32f4-phase4.0-foundation-batch11-2026-09-01-retained-20260901T030509Z-4fb6652',
              'evidence_artifact_id': '9784489545',
              'proposal_workflow_run_id': os.environ['PROPOSAL_RUN_ID'],
              'proposal_artifact_id': os.environ['PROPOSAL_ARTIFACT_ID'],
              'proposal_zip_sha256': os.environ['PROPOSAL_ZIP_SHA256'],
              'admission_plan_sha256': os.environ['EXPECTED_PLAN_SHA256'],
              'pre_rows': 157,
              'post_rows': 158,
              'new_exact_icpns': 1,
              'decision_counts': plan['decision_counts'],
              'conflicts': plan['conflicts'],
              'issues': plan['issues'],
              'added': added,
              'pre_csv_sha256': os.environ['PRE_BATCH11_CSV_SHA256'],
              'pre_git_blob_sha': os.environ['PRE_BATCH11_GIT_BLOB'],
              'final_csv_sha256': csv_sha,
              'final_git_blob_sha': git_blob,
          }
          audit_path.write_text(json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(audit, indent=2, sort_keys=True))
          PY

      - name: Validate published production state
        env:
          PYTHONPATH: software/python
        run: |
          python data/device-catalog/research/validate_stm32f4_commercial_icpn.py
          python -m plasma_web.device_catalog \
            --manifest data/device-catalog/production/icpn-v1-manifest.json \
            --json

      - name: Remove one-shot publish workflow and commit controlled promotion
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/device-catalog-phase40-foundation-batch11-publish.yml
          git add \
            data/device-catalog/research/stm32f4-commercial-icpn.csv \
            data/device-catalog/production/icpn-v1-manifest.json \
            data/device-catalog/research/stm32f4-phase4.0-foundation-batch11-admission-audit.json \
            .github/workflows/device-catalog-phase40-foundation-batch11-publish.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "device-catalog: admit STM32F4 foundation batch11 ICPN"
          git push origin "HEAD:${HEAD_REF}"
