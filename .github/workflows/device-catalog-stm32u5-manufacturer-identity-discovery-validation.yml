name: STM32U5 manufacturer identity discovery validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32u5-base-device-discovery.csv'
      - 'data/device-catalog/research/stm32u5-manufacturer-identity-discovery.json'
      - 'data/device-catalog/research/validate_stm32u5_manufacturer_identity_discovery.py'
      - 'data/device-catalog/research/device-catalog-stm32u5-manufacturer-identity-discovery.md'
      - 'data/device-catalog/research/stm32u5-security-scope-foundation.json'
      - 'docs/architecture/icpn-catalog-admission-policy.json'
      - '.github/workflows/device-catalog-stm32u5-manufacturer-identity-discovery-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STM32U5 manufacturer identity discovery
        working-directory: data/device-catalog/research
        run: python validate_stm32u5_manufacturer_identity_discovery.py
      - name: Enforce zero Production writes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if printf '%s\n' "$changed" | grep -q '^data/device-catalog/production/'; then
            echo 'STM32U5 manufacturer identity discovery must not modify Production catalog files.' >&2
            printf '%s\n' "$changed" | grep '^data/device-catalog/production/' >&2
            exit 1
          fi
