name: STM32U3 Production catalog publication validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32u3-*'
      - 'data/device-catalog/research/publish_stm32u3_catalog.py'
      - 'data/device-catalog/research/validate_stm32u3_production_publication.py'
      - 'docs/architecture/icpn-catalog-admission-policy.json'
      - 'scripts/ci/device-catalog-production-invariants.py'
      - '.github/workflows/device-catalog-stm32u3-production-publication-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/stm32u3-*'
      - 'data/device-catalog/research/publish_stm32u3_catalog.py'
      - 'data/device-catalog/research/validate_stm32u3_production_publication.py'
      - 'docs/architecture/icpn-catalog-admission-policy.json'
      - 'scripts/ci/device-catalog-production-invariants.py'
      - '.github/workflows/device-catalog-stm32u3-production-publication-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay deterministic historical STM32U3 canonical
        working-directory: data/device-catalog/research
        run: |
          python - <<'PY'
          from publish_stm32u3_catalog import EXPECTED_ROWS, _publication_rows, _render_csv
          rows, _ = _publication_rows()
          assert len(rows) == EXPECTED_ROWS
          data = _render_csv(rows)
          assert data.startswith(b"manufacturer,icpn,family,")
          print("STM32U3 historical deterministic replay: PASS")
          PY
      - name: Validate checked-in STM32U3 publication
        working-directory: data/device-catalog/research
        run: python validate_stm32u3_production_publication.py
      - name: Validate Production manifest invariants
        run: python scripts/ci/device-catalog-production-invariants.py
      - name: Load Production catalog through runtime implementation
        run: PYTHONPATH=software/python python -m plasma_web.device_catalog --json
