name: Device catalog Phase 4.3B STM32F2 discovery

on:
  push:
    branches: [agent/device-catalog-phase43b-stm32f2-discovery]
    paths:
      - ".github/workflows/device-catalog-phase43b-discovery.yml"
      - "data/device-catalog/research/stm32f2_phase4_3b_discovery.py"
      - "data/device-catalog/research/stm32f2-phase4.3b-discovery-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded browser runtime
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Acquire official ST STM32F2 discovery evidence
        run: |
          mkdir -p /tmp/phase43b
          xvfb-run -a python data/device-catalog/research/stm32f2_phase4_3b_discovery.py \
            --output /tmp/phase43b/pilot-summary.json \
            --timeout 75 \
            --delay 2
          cd /tmp/phase43b
          sha256sum pilot-summary.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase43b-stm32f2-discovery
          path: /tmp/phase43b
          if-no-files-found: error
          retention-days: 30
