name: NXP ADR-0002 65 source-first discovery research gates
on:
  pull_request:
    paths:
      - "data/device-catalog/research/nxp_65_discovery_gates_v1.py"
      - "data/device-catalog/research/test_nxp_65_discovery_gates_v1.py"
      - "data/device-catalog/research/nxp-65-openocd-discovery-gates-v1.csv"
      - "data/device-catalog/research/NXP_OPENOCD_65_DISCOVERY_GATES_V1.md"
      - "data/device-catalog/research/nxp-openocd-exact-active-discovery-v2.json"
      - "data/device-catalog/research/nxp-openocd-source-first-wave3-v1.json"
      - "data/device-catalog/research/nxp-openocd-source-first-wave4-v1.json"
      - "data/device-catalog/research/nxp-501-adr0002-core-transport-qualification-v10.csv"
      - ".github/workflows/device-catalog-nxp-discovery-65-gates-v1.yml"
  push:
    branches: [main]
    paths:
      - "data/device-catalog/research/nxp_65_discovery_gates_v1.py"
      - "data/device-catalog/research/test_nxp_65_discovery_gates_v1.py"
      - "data/device-catalog/research/nxp-65-openocd-discovery-gates-v1.csv"
      - ".github/workflows/device-catalog-nxp-discovery-65-gates-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nxp-discovery-65-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay original 501 plus 65 disjoint OpenOCD-first research leads
        run: python data/device-catalog/research/nxp_65_discovery_gates_v1.py
      - name: Reject false software support, ordering, lifecycle and hardware assumptions
        run: python -m unittest discover -s data/device-catalog/research -p "test_nxp_65_discovery_gates_v1.py" -v
