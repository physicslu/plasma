name: STM32L1 lifecycle requalification validation

on:
  pull_request:
    paths:
      - "data/device-catalog/research/stm32l1_requalification.py"
      - "data/device-catalog/research/stm32l1_requalification_probe.py"
      - "data/device-catalog/research/run_stm32l1_requalification_probe.py"
      - "data/device-catalog/research/test_stm32l1_requalification.py"
      - "data/device-catalog/research/validate_stm32l1_requalification.py"
      - "data/device-catalog/research/stm32l1-requalification-*.json"
      - "data/device-catalog/research/evidence/stm32l1-requalification-live-2026-09-13/**"
      - ".github/workflows/device-catalog-stm32l1-requalification-validation.yml"
  push:
    branches: [main]
    paths:
      - "data/device-catalog/research/stm32l1_requalification.py"
      - "data/device-catalog/research/stm32l1_requalification_probe.py"
      - "data/device-catalog/research/run_stm32l1_requalification_probe.py"
      - "data/device-catalog/research/test_stm32l1_requalification.py"
      - "data/device-catalog/research/validate_stm32l1_requalification.py"
      - "data/device-catalog/research/stm32l1-requalification-*.json"
      - "data/device-catalog/research/evidence/stm32l1-requalification-live-2026-09-13/**"
      - ".github/workflows/device-catalog-stm32l1-requalification-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run STM32L1 requalification tests
        working-directory: data/device-catalog/research
        run: python -m unittest -v test_stm32l1_requalification.py

      - name: Replay frozen requalification result
        working-directory: data/device-catalog/research
        run: |
          python stm32l1_requalification.py --output "$RUNNER_TEMP/stm32l1-requalification-result.json"
          cmp "$RUNNER_TEMP/stm32l1-requalification-result.json" stm32l1-requalification-result.json

      - name: Permanent evidence and result hard-lock
        working-directory: data/device-catalog/research
        run: python validate_stm32l1_requalification.py

      - name: Enforce read-only Production boundary for this PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          if ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- data/device-catalog/production; then
            echo "STM32L1 requalification must not modify Production." >&2
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- data/device-catalog/production
            exit 1
          fi
