name: STM32H7RS exact ICPN discovery validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32h7rs_exact_icpn_discovery.py'
      - 'data/device-catalog/research/validate_stm32h7rs_exact_icpn_discovery.py'
      - 'data/device-catalog/research/evidence/stm32h7rs-exact-icpn-live-2026-09-16/**'
      - '.github/workflows/device-catalog-stm32h7rs-exact-icpn-discovery-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate retained STM32H7RS exact ICPN discovery
        run: python data/device-catalog/research/validate_stm32h7rs_exact_icpn_discovery.py
