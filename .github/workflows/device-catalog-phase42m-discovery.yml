name: Device catalog Phase 4.2M STM32F437/439 I-pin discovery

on:
  push:
    branches:
      - agent/device-catalog-phase4.2m-next-admission
    paths:
      - ".github/workflows/device-catalog-phase42m-discovery.yml"
      - "data/device-catalog/research/stm32f4-phase4.2m-f437-f439-i-admission-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Acquire official ST discovery evidence
        run: |
          set +e
          mkdir -p /tmp/phase42m
          xvfb-run -a python data/device-catalog/research/run_stm32f4_browser_pilot.py \
            --manifest data/device-catalog/research/stm32f4-phase4.2m-f437-f439-i-admission-manifest.json \
            --catalog data/device-catalog/research/openocd-parts-canonical.csv \
            --output /tmp/phase42m/pilot-summary.json \
            --scope pilot \
            --headed \
            --timeout 45 \
            --delay 2
          rc=$?
          printf '%s\n' "$rc" > /tmp/phase42m/acquisition-exit-code.txt
          exit 0
      - name: Hash discovery output
        if: always()
        run: |
          cd /tmp/phase42m
          sha256sum * > SHA256SUMS || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase42m-stm32f437-f439-i-discovery
          path: /tmp/phase42m
          if-no-files-found: error
          retention-days: 30
      - name: Enforce discovery result
        if: always()
        run: |
          test -f /tmp/phase42m/acquisition-exit-code.txt
          test "$(cat /tmp/phase42m/acquisition-exit-code.txt)" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/phase42m/pilot-summary.json')
          if not p.exists():
              raise SystemExit('pilot-summary.json missing')
          data = json.loads(p.read_text())
          if data.get('acquisition_failure') != 0:
              raise SystemExit(f"acquisition failures: {data.get('acquisition_failure')}")
          expected = {'STM32F479ZG','STM32F437IG','STM32F437II','STM32F439IG','STM32F439II'}
          got = {x.get('base_device') for x in data.get('results', [])}
          if got != expected:
              raise SystemExit(f'unexpected target set: {sorted(got)}')
          if data.get('ambiguous_match_count', 0) != 0 or data.get('unmapped_count', 0) != 0:
              raise SystemExit({'ambiguous': data.get('ambiguous_match_count'), 'unmapped': data.get('unmapped_count')})
          PY
