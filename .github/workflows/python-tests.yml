name: Python and PL source tests

on:
  push:
    paths:
      - ".gitignore"
      - ".clineignore"
      - "README.md"
      - "docs/**"
      - "data/device-catalog/production/**"
      - "data/device-catalog/research/*-commercial-icpn.csv"
      - "software/python/**"
      - "pl/rtl/**"
      - "pl/constraints/**"
      - "pl/projects/**"
      - "pl/tests/**"
      - "scripts/plasmactl"
      - "scripts/render-start.sh"
      - "scripts/local-ai-harness"
      - "scripts/tests/**"
      - "scripts/codex-cloud-*.sh"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - ".gitignore"
      - ".clineignore"
      - "README.md"
      - "docs/**"
      - "data/device-catalog/production/**"
      - "data/device-catalog/research/*-commercial-icpn.csv"
      - "software/python/**"
      - "pl/rtl/**"
      - "pl/constraints/**"
      - "pl/projects/**"
      - "pl/tests/**"
      - "scripts/plasmactl"
      - "scripts/render-start.sh"
      - "scripts/local-ai-harness"
      - "scripts/tests/**"
      - "scripts/codex-cloud-*.sh"
      - ".github/workflows/python-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: software/python/pyproject.toml
      - name: Test repository secret-file safety
        run: bash scripts/tests/test-repository-secret-safety.sh
      - name: Test public documentation sanitization
        run: bash scripts/tests/test-public-doc-sanitization.sh
      - name: Test local AI launcher
        run: bash scripts/tests/test-local-ai-harness.sh
      - name: Test documentation integrity
        run: python scripts/tests/test-documentation-integrity.py
      - name: Test deployment config migration
        run: bash scripts/tests/test-plasmactl-config.sh
      - name: Test Engineering Mock deployment wiring
        run: bash scripts/tests/test-plasmactl-engineering-mock.sh
      - name: Install package
        run: python -m pip install -e "./software/python[dev]"
      - name: Run pytest
        run: python -m pytest -q software/python/tests pl/tests
