name: Python and PL source tests

on:
  push:
    paths:
      - "software/python/**"
      - "pl/rtl/**"
      - "pl/constraints/**"
      - "pl/projects/**"
      - "pl/tests/**"
      - "scripts/codex-cloud-*.sh"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "software/python/**"
      - "pl/rtl/**"
      - "pl/constraints/**"
      - "pl/projects/**"
      - "pl/tests/**"
      - "scripts/codex-cloud-*.sh"
      - ".github/workflows/python-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: software/python/pyproject.toml
      - name: Install package
        run: python -m pip install -e "./software/python[dev]"
      - name: Run pytest
        run: python -m pytest -q software/python/tests pl/tests
