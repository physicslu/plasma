name: Python PS source tests

on:
  push:
    branches:
      - "**"
    paths:
      - ".gitignore"
      - ".clineignore"
      - "software/python/**"
      - "software/native/swd/**"
      - "scripts/ci/inject-plasma-openocd5088-native.py"
      - "scripts/z2/plasma_swd_site_admission.py"
      - "scripts/ppu_asset_execution.py"
      - "scripts/ppu_package_launcher.py"
      - "scripts/ppu_site_worker.py"
      - "scripts/ppu_site_adapter_abi5.py"
      - "scripts/ppu_package_entry.py"
      - "scripts/ppu_package_units.py"
      - "scripts/ppu_site_worker_service.py"
      - "scripts/ppu_site_engine.py"
      - "scripts/ppu_site_recovery.py"
      - "scripts/ppu_package_unit_helper.py"
      - "scripts/ppu_package_action.py"
      - "scripts/ppu_asset_set.py"
      - "scripts/ppu_opf_reference_openocd.py"
      - "scripts/ppu_opf_site_session.py"
      - "scripts/ppu_provider_contract.py"
      - "scripts/ppu_provider_options.py"
      - "scripts/ppu-z2-installer.py"
      - "data/ic-support/benchmarks/nxp-kl25/backend-implementation-lock.json"
      - "!software/python/docs/**"
      - "scripts/plasmactl"
      - "scripts/render-start.sh"
      - "scripts/ci/runtime-data-root-contract.py"
      - "scripts/local-ai-harness"
      - "scripts/tests/**"
      - "!scripts/tests/test-public-doc-sanitization.sh"
      - "!scripts/tests/test-documentation-integrity.py"
      - "!scripts/tests/test-ci-domain-boundaries.py"
      - "scripts/codex-cloud-*.sh"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - ".gitignore"
      - ".clineignore"
      - "software/python/**"
      - "software/native/swd/**"
      - "scripts/ci/inject-plasma-openocd5088-native.py"
      - "scripts/z2/plasma_swd_site_admission.py"
      - "scripts/ppu_asset_execution.py"
      - "scripts/ppu_package_launcher.py"
      - "scripts/ppu_site_worker.py"
      - "scripts/ppu_site_adapter_abi5.py"
      - "scripts/ppu_package_entry.py"
      - "scripts/ppu_package_units.py"
      - "scripts/ppu_site_worker_service.py"
      - "scripts/ppu_site_engine.py"
      - "scripts/ppu_site_recovery.py"
      - "scripts/ppu_package_unit_helper.py"
      - "scripts/ppu_package_action.py"
      - "scripts/ppu_asset_set.py"
      - "scripts/ppu_opf_reference_openocd.py"
      - "scripts/ppu_opf_site_session.py"
      - "scripts/ppu_provider_contract.py"
      - "scripts/ppu_provider_options.py"
      - "scripts/ppu-z2-installer.py"
      - "data/ic-support/benchmarks/nxp-kl25/backend-implementation-lock.json"
      - "!software/python/docs/**"
      - "scripts/plasmactl"
      - "scripts/render-start.sh"
      - "scripts/ci/runtime-data-root-contract.py"
      - "scripts/local-ai-harness"
      - "scripts/tests/**"
      - "!scripts/tests/test-public-doc-sanitization.sh"
      - "!scripts/tests/test-documentation-integrity.py"
      - "!scripts/tests/test-ci-domain-boundaries.py"
      - "scripts/codex-cloud-*.sh"
      - ".github/workflows/python-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: software/python/pyproject.toml
      - name: Test repository secret-file safety
        run: bash scripts/tests/test-repository-secret-safety.sh
      - name: Enforce installed-package Runtime Data Root contract
        run: |
          python scripts/ci/runtime-data-root-contract.py --self-test
          python scripts/ci/runtime-data-root-contract.py
      - name: Test local AI launcher
        run: bash scripts/tests/test-local-ai-harness.sh
      - name: Test deployment config migration
        run: bash scripts/tests/test-plasmactl-config.sh
      - name: Test Engineering Mock deployment wiring
        run: bash scripts/tests/test-plasmactl-engineering-mock.sh
      - name: Install package
        run: python -m pip install -e "./software/python[dev]"
      - name: Deny Site admission and revocation without Root ownership (host-only)
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/z2/plasma_swd_site_admission.py
          if python scripts/z2/plasma_swd_site_admission.py admit 2 > "$RUNNER_TEMP/site-admit.json"; then
            echo "Unprivileged Site admission was accepted" >&2
            exit 1
          fi
          grep -F '"code": "ROOT_REQUIRED"' "$RUNNER_TEMP/site-admit.json"
          if python scripts/z2/plasma_swd_site_admission.py revoke 2 > "$RUNNER_TEMP/site-revoke.json"; then
            echo "Unprivileged Site revocation was accepted" >&2
            exit 1
          fi
          grep -F '"code": "REVOKE_DENIED"' "$RUNNER_TEMP/site-revoke.json"
      - name: Run pytest (PS / Python only; PL covered by pl-*.yml)
        run: python -m pytest -q software/python/tests


  # Existing hosted source-test workflow; source-locked native OpenOCD
  # adapter registration is tested without a self-hosted host or DUT.
  swd-openocd-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scope native OpenOCD source build
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # Unknown base must build, never silently bypass source validation.
          required=false
          if [ -z "${BASE_SHA}" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            required=true
          else
            changed="$(git diff --name-only "${BASE_SHA}" HEAD)"
            if printf '%s\n' "${changed}" | grep -Eq '^(software/native/swd/|scripts/ci/inject-plasma-openocd5088-native.py|software/python/tests/test_swd_native_c_compilation.py)'; then
              required=true
            elif printf '%s\n' "${changed}" | grep -Fxq '.github/workflows/python-tests.yml'; then
              # Changes to the Python job must not cold-build Native OpenOCD.
              # A change to this native job (including its recipe) must rebuild.
              if ! git cat-file -e "${BASE_SHA}:.github/workflows/python-tests.yml" 2>/dev/null; then
                required=true
              else
                before="$(git show "${BASE_SHA}:.github/workflows/python-tests.yml" | sed -n '/^  swd-openocd-native:/,$p')"
                after="$(sed -n '/^  swd-openocd-native:/,$p' .github/workflows/python-tests.yml)"
                if [ -z "${before}" ] || [ -z "${after}" ] || [ "${before}" != "${after}" ]; then
                  required=true
                fi
              fi
            fi
          fi
          echo "required=${required}" >> "${GITHUB_OUTPUT}"
          echo "Native OpenOCD source build required: ${required}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Install upstream OpenOCD build requirements
        if: steps.scope.outputs.required == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config make gcc git \
            libusb-1.0-0-dev libftdi1-dev libhidapi-dev \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf libc6-dev-armhf-cross
      - name: Fetch exact original OpenOCD and inject reviewed PLASMA files
        if: steps.scope.outputs.required == 'true'
        env:
          OPENOCD_SHA: 5088db4c9154ca833c6d558381074b33672e127a
        run: |
          set -euo pipefail
          git init "${RUNNER_TEMP}/openocd-pinned"
          git -C "${RUNNER_TEMP}/openocd-pinned" remote add origin https://github.com/openocd-org/openocd.git
          git -C "${RUNNER_TEMP}/openocd-pinned" fetch --no-tags --depth 1 origin "${OPENOCD_SHA}"
          git -C "${RUNNER_TEMP}/openocd-pinned" checkout --detach FETCH_HEAD
          git -C "${RUNNER_TEMP}/openocd-pinned" submodule update --init --depth 1 jimtcl
          python scripts/ci/inject-plasma-openocd5088-native.py \
            --openocd "${RUNNER_TEMP}/openocd-pinned" --plasma "${GITHUB_WORKSPACE}"
      - name: Configure and build exact-source native OpenOCD
        if: steps.scope.outputs.required == 'true'
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/openocd-pinned"
          ./bootstrap
          ./configure --disable-werror --enable-internal-jimtcl --disable-internal-libjaylink
          make -j2
          test -x src/openocd
      - name: ARMv7 native v5 MMIO word width and DMB inspection
        if: steps.scope.outputs.required == 'true'
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/plasma-v5-native-words.o"
          arm-linux-gnueabihf-gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -march=armv7-a -marm -mfloat-abi=hard -mfpu=vfpv3 \
            -I software/native/swd \
            -c software/native/swd/plasma_swd_native_words.c -o "${out}"
          arm-linux-gnueabihf-readelf -h "${out}" > "${RUNNER_TEMP}/plasma-native-v5-elf.txt"
          arm-linux-gnueabihf-objdump -d "${out}" > "${RUNNER_TEMP}/plasma-native-v5-disassembly.txt"
          grep -Eq 'Class:[[:space:]]+ELF32' "${RUNNER_TEMP}/plasma-native-v5-elf.txt"
          grep -Eq 'Machine:[[:space:]]+ARM' "${RUNNER_TEMP}/plasma-native-v5-elf.txt"
          grep -Eq '(^|[[:space:]])dmb[[:space:]]+sy([[:space:]]|$)' "${RUNNER_TEMP}/plasma-native-v5-disassembly.txt"
          grep -Eq '(^|[[:space:]])ldr([[:space:]]|[a-z]*[[:space:]])' "${RUNNER_TEMP}/plasma-native-v5-disassembly.txt"
          grep -Eq '(^|[[:space:]])str([[:space:]]|[a-z]*[[:space:]])' "${RUNNER_TEMP}/plasma-native-v5-disassembly.txt"
          sha256sum "${out}" "${RUNNER_TEMP}/plasma-native-v5-disassembly.txt"
          echo "ARMv7 native ABI-v5 word LDR/STR and DMB SY: HOST BUILD PASS" >> "${GITHUB_STEP_SUMMARY}"
          # Compile the new PS FD-mmap lifecycle for the actual ARMv7-A ISA
          # without invoking it or opening any device on the runner.
          arm-linux-gnueabihf-gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -march=armv7-a -marm -mfloat-abi=hard -mfpu=vfpv3 \
            -I software/native/swd \
            -c software/native/swd/plasma_swd_ps_mapping.c \
            -o "${RUNNER_TEMP}/plasma-v5-ps-mapping.o"
          arm-linux-gnueabihf-readelf -h "${RUNNER_TEMP}/plasma-v5-ps-mapping.o" \
            > "${RUNNER_TEMP}/plasma-v5-ps-mapping-elf.txt"
          grep -Eq 'Class:[[:space:]]+ELF32' "${RUNNER_TEMP}/plasma-v5-ps-mapping-elf.txt"
          grep -Eq 'Machine:[[:space:]]+ARM' "${RUNNER_TEMP}/plasma-v5-ps-mapping-elf.txt"
          sha256sum "${RUNNER_TEMP}/plasma-v5-ps-mapping.o"
          echo "C Root identity comparison: compile PASS; current PL/AXI facts: UNPROVEN" >> "${GITHUB_STEP_SUMMARY}"
          echo "Device mapping attributes / AXI completion / HIL: NOT_RUN" >> "${GITHUB_STEP_SUMMARY}"
      - name: Verify selectable SWD adapter but no unowned device admission
        if: steps.scope.outputs.required == 'true'
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/openocd-pinned"
          set +e
          src/openocd -s tcl -d2 -c 'adapter list' -c shutdown \
            > "${RUNNER_TEMP}/plasma-openocd-list.log" 2>&1
          list_status=$?
          src/openocd -s tcl -d2 -c 'adapter driver plasma_swd' -c 'transport select swd' -c shutdown \
            > "${RUNNER_TEMP}/plasma-openocd-select.log" 2>&1
          select_status=$?
          src/openocd -s tcl -d2 -c 'adapter driver plasma_swd' -c 'transport select swd' -c init -c shutdown \
            > "${RUNNER_TEMP}/plasma-openocd-no-owner.log" 2>&1
          unowned_status=$?
          set -e
          echo "list_status=${list_status} select_status=${select_status} unowned_status=${unowned_status}"
          cat "${RUNNER_TEMP}/plasma-openocd-list.log"
          cat "${RUNNER_TEMP}/plasma-openocd-select.log"
          cat "${RUNNER_TEMP}/plasma-openocd-no-owner.log"
          if [ "${list_status}" -ne 0 ] || [ "${select_status}" -ne 0 ]; then
            echo 'FAIL: source-locked selectable OpenOCD adapter CLI' >&2
            exit 1
          fi
          if ! grep -q plasma_swd "${RUNNER_TEMP}/plasma-openocd-list.log"; then
            echo 'FAIL: plasma_swd not listed as a native driver' >&2
            exit 1
          fi
          if [ "${unowned_status}" -eq 0 ]; then
            echo 'FAIL: unleased native SWD adapter initialized' >&2
            exit 1
          fi
          echo PLASMA_OPENOCD5088_EXACT_SOURCE_BUILD_AND_NO_OWNER_DENY_PASS
