name: Device catalog Phase 4.1 R/T batch4 runtime closure

on:
  pull_request:

permissions:
  contents: write

jobs:
  close-runtime-contract:
    if: >-
      github.actor == 'physicslu' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/device-catalog-phase4.1-rt-admission-batch4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update current runtime contracts and Batch4 acceptance
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog = Path('software/python/tests/test_device_catalog.py')
          text = catalog.read_text()
          text = text.replace('EXPECTED_PRODUCTION_CATALOG_SIZE = 261', 'EXPECTED_PRODUCTION_CATALOG_SIZE = 269')
          text = text.replace('EXPECTED_STM32F4_CATALOG_SIZE = 186', 'EXPECTED_STM32F4_CATALOG_SIZE = 194')
          text = text.replace('    rt_batch3 = catalog.search("stm32f413rgt6tr", limit=1)[0]\n', '    rt_batch3 = catalog.search("stm32f413rgt6tr", limit=1)[0]\n    rt_batch4 = catalog.search("stm32f446ret7tr", limit=1)[0]\n')
          marker = '    assert rt_batch3.target_config == "tcl/target/stm32f4x.cfg"\n'
          addition = marker + '    assert rt_batch4.identifier == "STM32F446RET7TR"\n    assert rt_batch4.family == "STM32F4"\n    assert rt_batch4.package == "LQFP"\n    assert rt_batch4.pin_count == "64"\n    assert rt_batch4.flash_size == "512 KiB"\n    assert rt_batch4.target_config == "tcl/target/stm32f4x.cfg"\n'
          if 'assert rt_batch4.identifier' not in text:
              assert marker in text
              text = text.replace(marker, addition, 1)
          text = text.replace('full 186-row F4 family', 'full 194-row F4 family')
          catalog.write_text(text)

          gateway = Path('software/python/tests/test_device_catalog_web_gateway.py')
          text = gateway.read_text().replace('EXPECTED_PRODUCTION_CATALOG_SIZE = 261', 'EXPECTED_PRODUCTION_CATALOG_SIZE = 269')
          marker = '    def test_research_only_identifier_is_not_exposed_by_production_search(self) -> None:\n'
          test = '''    def test_phase41_rt_batch4_icpn_is_exposed_after_admission(self) -> None:\n        status, payload = self.request("/api/devices/search?q=STM32F446RET7TR&limit=5")\n        self.assertEqual(status, 200)\n        self.assertEqual(payload["catalog_size"], EXPECTED_PRODUCTION_CATALOG_SIZE)\n        self.assertEqual(payload["count"], 1)\n        result = payload["results"][0]\n        self.assertEqual(result["icpn"], "STM32F446RET7TR")\n        self.assertEqual(result["family"], "STM32F4")\n        self.assertEqual(result["package"], "LQFP")\n        self.assertEqual(result["pin_count"], "64")\n        self.assertEqual(result["flash_size"], "512 KiB")\n        self.assertEqual(result["backend"]["target_config"], "tcl/target/stm32f4x.cfg")\n\n'''
          if 'test_phase41_rt_batch4_icpn_is_exposed_after_admission' not in text:
              assert marker in text
              text = text.replace(marker, test + marker, 1)
          gateway.write_text(text)
          PY
          git diff --check
      - name: Install Python test dependencies
        run: python -m pip install -e './software/python[dev]'
      - name: Validate Batch4 runtime closure
        run: |
          pytest -q software/python/tests/test_device_catalog.py software/python/tests/test_device_catalog_web_gateway.py
          python data/device-catalog/research/test_stm32f4_phase4_1_rt_admission_batch4_post_admission.py
      - name: Commit runtime closure
        run: |
          set -euo pipefail
          git config user.name 'Gordon'
          git config user.email 'physicslu@gmail.com'
          git add software/python/tests/test_device_catalog.py software/python/tests/test_device_catalog_web_gateway.py
          git diff --cached --check
          git commit -m 'test: close STM32F4 R/T batch4 runtime contract'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
