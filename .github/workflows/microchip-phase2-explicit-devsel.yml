name: Microchip Phase 2 explicit DEVSEL admission research

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/microchip_phase2_explicit_devsel_audit_v1.py'
      - '.github/workflows/microchip-phase2-explicit-devsel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microchip-phase2-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned upstream driver source bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/microchip-phase2"
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/openocd-org/openocd/9ea7f3d647c8ecf6b0f1424002dfc3f4504a162c/src/flash/nor/at91samd.c' \
            -o "$RUNNER_TEMP/microchip-phase2/at91samd.c"
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/openocd-org/openocd/9ea7f3d647c8ecf6b0f1424002dfc3f4504a162c/src/flash/nor/atsame5.c' \
            -o "$RUNNER_TEMP/microchip-phase2/atsame5.c"
      - name: Replay 1548 exact identities and independently count 892 explicit DEVSEL matches
        shell: bash
        run: |
          set -euo pipefail
          python data/device-catalog/research/microchip_phase2_explicit_devsel_audit_v1.py \
            --driver-d "$RUNNER_TEMP/microchip-phase2/at91samd.c" \
            --driver-e "$RUNNER_TEMP/microchip-phase2/atsame5.c" \
            --output "$RUNNER_TEMP/microchip-phase2/phase2-1548-devsel-review.json"
          python data/device-catalog/research/microchip_phase2_explicit_devsel_audit_v1.py \
            --driver-d "$RUNNER_TEMP/microchip-phase2/at91samd.c" \
            --driver-e "$RUNNER_TEMP/microchip-phase2/atsame5.c" \
            --output "$RUNNER_TEMP/microchip-phase2/phase2-1548-devsel-review.json" --verify
      - name: Assert fail-closed under source tampering and unchanged Product levels
        env:
          PYTHONPATH: software/python
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / 'data/device-catalog/research'))
          import microchip_phase2_explicit_devsel_audit_v1 as a
          from plasma_web.device_catalog import get_default_device_catalog
          from plasma_web.programming_qualification import get_default_programming_qualification_registry
          base = Path(os.environ['RUNNER_TEMP']) / 'microchip-phase2'
          queue = json.loads((base / 'phase2-1548-devsel-review.json').read_text())
          assert queue['candidate_counts'] == {
              'EXACT_DRIVER_PART_DEVSEL_REVIEW_CANDIDATE': 892,
              'NO_EXPLICIT_DRIVER_PART_TABLE_MATCH': 656,
          }
          assert queue['direct_base_device_counts'] == {
              'tcl/target/at91samdXX.cfg': 59,
              'tcl/target/atsame5x.cfg': 25,
          }
          assert len(queue['rows']) == queue['remaining_icpns'] == 1548
          assert all(r['catalog_level'] is None and
                     not r['canonical_identity_admitted'] and
                     not r['canonical_route_admitted'] and
                     not r['execution_authorized'] and
                     not r['job_selectable'] for r in queue['rows'])
          source = a.ORIGINAL.read_bytes()
          original = a.PIC_ADMITTED.read_bytes()
          d = (base / 'at91samd.c').read_bytes()
          e = (base / 'atsame5.c').read_bytes()
          for altered in (
              (source + b'\n#tampered', original, d, e),
              (source, original, d + b'\n#tampered', e),
              (source, original, d, e + b'\n#tampered'),
          ):
              try:
                  a.audit(*altered)
              except ValueError:
                  pass
              else:
                  raise AssertionError('Modified upstream/original source accepted')
          catalog = get_default_device_catalog()
          microchip = [r for r in catalog.records if r.vendor == 'Microchip']
          assert len(microchip) == 1015
          actual = get_default_programming_qualification_registry().summary
          by_level = actual['catalog_level_counts']
          assert by_level['1'] >= 1015
          assert all(catalog.resolve('Microchip', r['exact_icpn']) is None
                     for r in queue['rows'])
          PY
      - name: Upload read-only admission review ledger
        uses: actions/upload-artifact@v4
        with:
          name: microchip-phase2-1548-explicit-devsel-review
          path: ${{ runner.temp }}/microchip-phase2/phase2-1548-devsel-review.json
          retention-days: 30
