name: STM32F2 Phase 4.3J runtime snapshot one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f2-phase43j-publish

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update release-bound runtime count snapshots and remove this workflow
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -rl --include='*.py' '^EXPECTED_PRODUCTION_CATALOG_SIZE = 481$' software/python/tests | sort)
          test "${#files[@]}" -eq 14
          for file in "${files[@]}"; do
            sed -i 's/^EXPECTED_PRODUCTION_CATALOG_SIZE = 481$/EXPECTED_PRODUCTION_CATALOG_SIZE = 492/' "$file"
          done
          test "$(grep -rl --include='*.py' '^EXPECTED_STM32F2_CATALOG_SIZE = 22$' software/python/tests | wc -l)" -eq 1
          sed -i 's/^EXPECTED_STM32F2_CATALOG_SIZE = 22$/EXPECTED_STM32F2_CATALOG_SIZE = 33/' \
            software/python/tests/test_device_catalog.py
          ! grep -R --include='*.py' -q '^EXPECTED_PRODUCTION_CATALOG_SIZE = 481$' software/python/tests
          ! grep -R --include='*.py' -q '^EXPECTED_STM32F2_CATALOG_SIZE = 22$' software/python/tests
          git rm .github/workflows/stm32f2-phase43j-runtime-snapshot-oneoff.yml
          git config user.name 'plasma-ci'
          git config user.email 'plasma-ci@users.noreply.github.com'
          git add software/python/tests
          git commit -m 'tests: update Production catalog snapshot to 492'
          git push origin HEAD:agent/device-catalog-stm32f2-phase43j-publish
