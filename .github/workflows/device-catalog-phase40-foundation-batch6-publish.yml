name: Device catalog Phase 4.0 foundation batch6 controlled publish

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  publish-stm32f4-foundation-batch6:
    if: github.event.pull_request.number == 263 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PROPOSAL_RUN_ID: "33365292387"
      PROPOSAL_ARTIFACT_ID: "9748055114"
      PROPOSAL_ZIP_SHA256: "45bc6e0a40637eee511db61e357b3706fdb4d20d967c9871ebf8fbdc3e3f5aa1"
      EXPECTED_PLAN_SHA256: "37591f9e8375329ab06169ccddf567259939ea2cc38ed4f6aca79044e6bdbc27"
      EXPECTED_CSV_SHA256: "4a6bf6ffbf384ce3d9c91d318b6793c710d621d6f9e11f0a6c5b50206a5acb2a"
      PRE_BATCH6_ROWS: "124"
      PRE_BATCH6_CSV_SHA256: "22f999adb9627231df7b332650271320d96f1957913481a5cb7a57155d9d1b6b"
      PRE_BATCH6_GIT_BLOB: "c0bb4971fa44eb818f423fc2a85efa1ffc06e81f"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify immutable proposal artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROPOSAL_ARTIFACT_ID}/zip" \
            --output /tmp/batch6-proposal.zip
          echo "${PROPOSAL_ZIP_SHA256}  /tmp/batch6-proposal.zip" | sha256sum --check --strict
          rm -rf /tmp/batch6-proposal
          mkdir -p /tmp/batch6-proposal
          unzip -q /tmp/batch6-proposal.zip -d /tmp/batch6-proposal
          echo "${EXPECTED_PLAN_SHA256}  /tmp/batch6-proposal/admission-plan.json" | sha256sum --check --strict
          echo "${EXPECTED_CSV_SHA256}  /tmp/batch6-proposal/stm32f4-commercial-icpn.proposed.csv" | sha256sum --check --strict
      - name: Rebuild proposal from retained evidence and verify immutable bindings
        run: |
          set -euo pipefail
          mkdir -p /tmp/batch6-rebuild
          python data/device-catalog/research/stm32f4_admission.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.0-foundation-batch6-live-2026-08-31 \
            --baseline data/device-catalog/research/stm32f4-phase4.0-foundation-batch6-baseline.json \
            --canonical data/device-catalog/research/stm32f4-commercial-icpn.csv \
            --admit-base STM32F412ZG \
            --admit-base STM32F413CG \
            --admit-base STM32F413ZG \
            --output /tmp/batch6-rebuild/admission-plan.json
          echo "${EXPECTED_PLAN_SHA256}  /tmp/batch6-rebuild/admission-plan.json" | sha256sum --check --strict
          python - <<'PY'
          import json
          import os
          import shutil
          import sys
          from pathlib import Path

          root = Path('data/device-catalog/research')
          sys.path.insert(0, str(root))
          from device_catalog_admission_framework import write_canonical_dataset
          import validate_stm32f4_commercial_icpn as validator

          plan_path = Path('/tmp/batch6-rebuild/admission-plan.json')
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          expected = {
              'admit': 9,
              'already_present': 0,
              'manual_review_required': 0,
              'reject': 0,
          }
          if plan.get('candidate_count') != 9 or plan.get('decision_counts') != expected:
              raise SystemExit(f'unexpected rebuilt plan: {plan}')
          if plan.get('canonical_rows_before') != int(os.environ['PRE_BATCH6_ROWS']):
              raise SystemExit(f'unexpected pre-row count: {plan.get("canonical_rows_before")}')
          if plan.get('conflicts') != 0 or plan.get('issues') != []:
              raise SystemExit(f'unsafe plan: {plan}')

          source = root / 'stm32f4-commercial-icpn.csv'
          proposed = Path('/tmp/batch6-rebuild/stm32f4-commercial-icpn.proposed.csv')
          shutil.copyfile(source, proposed)
          report = write_canonical_dataset(plan=plan, canonical_path=proposed)
          if report.get('status') != 'written' or report.get('rows_before') != 124 or report.get('rows_after') != 133:
              raise SystemExit(f'unexpected writer report: {report}')
          validator.CANONICAL = proposed
          validation = validator.validate()
          if validation.get('errors') or validation.get('rows') != 133:
              raise SystemExit(f'proposed validation failed: {validation}')
          PY
          echo "${EXPECTED_CSV_SHA256}  /tmp/batch6-rebuild/stm32f4-commercial-icpn.proposed.csv" | sha256sum --check --strict
          cmp /tmp/batch6-proposal/admission-plan.json /tmp/batch6-rebuild/admission-plan.json
          cmp /tmp/batch6-proposal/stm32f4-commercial-icpn.proposed.csv /tmp/batch6-rebuild/stm32f4-commercial-icpn.proposed.csv
      - name: Enforce production precondition and publish canonical bytes
        run: |
          set -euo pipefail
          canonical="data/device-catalog/research/stm32f4-commercial-icpn.csv"
          manifest="data/device-catalog/production/icpn-v1-manifest.json"
          echo "${PRE_BATCH6_CSV_SHA256}  ${canonical}" | sha256sum --check --strict
          test "$(git hash-object "${canonical}")" = "${PRE_BATCH6_GIT_BLOB}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('data/device-catalog/production/icpn-v1-manifest.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          source = next(item for item in payload['sources'] if item['family'] == 'STM32F4')
          expected = (
              int(os.environ['PRE_BATCH6_ROWS']),
              os.environ['PRE_BATCH6_CSV_SHA256'],
              os.environ['PRE_BATCH6_GIT_BLOB'],
          )
          observed = (source['row_count'], source['sha256'], source['git_blob_sha'])
          if observed != expected:
              raise SystemExit(f'production manifest drifted: expected={expected} observed={observed}')
          PY
          cp /tmp/batch6-rebuild/stm32f4-commercial-icpn.proposed.csv "${canonical}"
          test "$(sha256sum "${canonical}" | awk '{print $1}')" = "${EXPECTED_CSV_SHA256}"
      - name: Update production manifest and admission audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          canonical = Path('data/device-catalog/research/stm32f4-commercial-icpn.csv')
          manifest_path = Path('data/device-catalog/production/icpn-v1-manifest.json')
          audit_path = Path('data/device-catalog/research/stm32f4-phase4.0-foundation-batch6-admission-audit.json')
          plan = json.loads(Path('/tmp/batch6-rebuild/admission-plan.json').read_text(encoding='utf-8'))
          csv_sha = hashlib.sha256(canonical.read_bytes()).hexdigest()
          git_blob = subprocess.check_output(['git', 'hash-object', str(canonical)], text=True).strip()
          if csv_sha != os.environ['EXPECTED_CSV_SHA256']:
              raise SystemExit('final CSV SHA mismatch')

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          source = next(item for item in manifest['sources'] if item['family'] == 'STM32F4')
          source['row_count'] = 133
          source['sha256'] = csv_sha
          source['git_blob_sha'] = git_blob
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          audit = {
              'schema_version': 1,
              'phase': 'stm32f4-phase4.0-foundation-batch6',
              'canonical_dataset_written': True,
              'evidence_id': 'stm32f4-phase4.0-foundation-batch6-2026-08-31-retained-20260831T063818Z-c3edb20',
              'evidence_artifact_id': '9747959504',
              'proposal_workflow_run_id': os.environ['PROPOSAL_RUN_ID'],
              'proposal_artifact_id': os.environ['PROPOSAL_ARTIFACT_ID'],
              'admission_plan_sha256': os.environ['EXPECTED_PLAN_SHA256'],
              'pre_rows': 124,
              'post_rows': 133,
              'new_exact_icpns': 9,
              'decision_counts': plan['decision_counts'],
              'conflicts': plan['conflicts'],
              'issues': plan['issues'],
              'added': [item['icpn'] for item in plan['decisions'] if item['decision'] == 'admit'],
              'pre_csv_sha256': os.environ['PRE_BATCH6_CSV_SHA256'],
              'pre_git_blob_sha': os.environ['PRE_BATCH6_GIT_BLOB'],
              'final_csv_sha256': csv_sha,
              'final_git_blob_sha': git_blob,
          }
          audit_path.write_text(json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(audit, indent=2, sort_keys=True))
          PY
      - name: Validate published production state
        env:
          PYTHONPATH: software/python
        run: |
          python data/device-catalog/research/validate_stm32f4_commercial_icpn.py
          python -m plasma_web.device_catalog \
            --manifest data/device-catalog/production/icpn-v1-manifest.json \
            --json
      - name: Remove one-shot publish workflow and commit controlled promotion
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/device-catalog-phase40-foundation-batch6-publish.yml
          git add \
            data/device-catalog/research/stm32f4-commercial-icpn.csv \
            data/device-catalog/production/icpn-v1-manifest.json \
            data/device-catalog/research/stm32f4-phase4.0-foundation-batch6-admission-audit.json \
            .github/workflows/device-catalog-phase40-foundation-batch6-publish.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "device-catalog: admit STM32F4 foundation batch6 ICPNs"
          git push origin "HEAD:${HEAD_REF}"
