name: Device catalog Phase 4.2P controlled Production publish
on:
  push:
    branches: [agent/device-catalog-phase4.2p-vh-admission-batch1]
    paths: [".github/workflows/device-catalog-phase42p-publish.yml"]
  workflow_dispatch:
permissions: {actions: read, contents: write}
jobs:
  publish:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2p-vh-admission-batch1, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: phase42p-admission-proposal, path: /tmp/phase42p, repository: physicslu/plasma, run-id: 33730186565, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Publish exact bound proposal
        run: |
          PYTHONPATH=data/device-catalog/research python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from device_catalog_admission_framework import read_csv,write_canonical_dataset
          from device_catalog_pipeline_framework import pipeline_plan_is_clean
          root=Path('data/device-catalog/research'); canonical=root/'stm32f4-commercial-icpn.csv'; evidence=root/'evidence/stm32f4-phase4.2p-vh-admission-batch1-live-2026-09-03'
          raw=Path('/tmp/phase42p/admission-plan.json').read_bytes(); sha=hashlib.sha256(raw).hexdigest()
          if sha!='415a96e772bb422b0af02795f32034fc738d3a0af1198f3a9e9669496c6f07f6': raise SystemExit('proposal hash mismatch')
          plan=json.loads(raw); expected={i['icpn'] for i in plan['candidates']}
          if len(expected)!=18 or not pipeline_plan_is_clean(plan): raise SystemExit('unclean plan')
          _,rows=read_csv(canonical)
          if len(rows)!=265 or len({r['base_device'] for r in rows})!=91: raise SystemExit('pre-state mismatch')
          result=write_canonical_dataset(plan=plan,canonical_path=canonical)
          _,after=read_csv(canonical)
          if result['rows_after']!=283 or len({r['base_device'] for r in after})!=96: raise SystemExit('post-state mismatch')
          (evidence/'admission-plan.json').write_bytes(raw)
          summary={'schema_version':1,'phase':'4.2P','proposal_run_id':33730186565,'proposal_artifact_id':9883517828,'proposal_artifact_zip_sha256':'45e77121461f90758ba4fb555114eed9de99775d6868b425ae86e61ec7fe470c','admission_plan_sha256':sha,'production_rows_before':265,'production_rows_after':283,'production_base_devices_before':91,'production_base_devices_after':96,'added_exact_icpns':sorted(expected),'lifecycle_exclusions':[],'canonical_csv_file_sha256':hashlib.sha256(canonical.read_bytes()).hexdigest(),'status':'published'}
          (evidence/'publish-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/stm32f4-commercial-icpn.csv data/device-catalog/research/evidence/stm32f4-phase4.2p-vh-admission-batch1-live-2026-09-03/admission-plan.json data/device-catalog/research/evidence/stm32f4-phase4.2p-vh-admission-batch1-live-2026-09-03/publish-summary.json
          git commit -m 'device-catalog: admit Phase 4.2P V/H batch1 ICPNs'
          git push origin HEAD:agent/device-catalog-phase4.2p-vh-admission-batch1
