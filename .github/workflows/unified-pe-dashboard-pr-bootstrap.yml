name: Unified P E Dashboard PR Bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/unified-pe-dashboard-pr-bootstrap.yml
      - .github/workflows/unified-pe-dashboard-bootstrap.yml
      - software/web/app/batch-dashboard-panels.tsx
      - software/web/app/batch-dashboard-panels.css

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'agent/unified-pe-batch-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-pe-batch-dashboard
          fetch-depth: 0

      - name: Extract and run one-shot integration script
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/unified-pe-dashboard-bootstrap.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = []
          for line in source[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/unified_pe_dashboard.py').write_text('\n'.join(body) + '\n')
          PY
          python /tmp/unified_pe_dashboard.py
          rm -f .github/workflows/unified-pe-dashboard-pr-bootstrap.yml

      - name: Commit integrated dashboard
        run: |
          git config user.name "plasma-ci-bot"
          git config user.email "plasma-ci-bot@users.noreply.github.com"
          git add -A
          git commit -m "Unify P E batch dashboard controls and summaries"
          git push origin HEAD:agent/unified-pe-batch-dashboard
