name: OPP Common AXI-Lite host-only regression

on:
  pull_request:
    paths:
      - 'pl/rtl/bus/opp_common_axi_lite_v1.sv'
      - 'pl/sim/tb_opp_common_axi_lite_v1.sv'
      - 'software/python/plasma_interfaces/opp_common_registers.py'
      - 'software/python/tests/test_opp_common_registers.py'
      - '.github/workflows/opp-common-host-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opp-common:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends iverilog
      - name: Run actual Common AXI-Lite RTL simulation
        run: |
          set -euo pipefail
          iverilog -g2012 -s tb -o /tmp/opp-common-sim pl/rtl/bus/opp_common_axi_lite_v1.sv pl/sim/tb_opp_common_axi_lite_v1.sv
          vvp /tmp/opp-common-sim | tee /tmp/opp-common-sim.log
          grep -Fq 'OPP AXI4-Lite simulation PASS' /tmp/opp-common-sim.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Common Python API tests
        env:
          PYTHONPATH: software/python
        run: |
          python -m pip install pytest
          python -m pytest -q software/python/tests/test_opp_common_registers.py
