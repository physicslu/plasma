name: Device catalog STM32H7 partition materialization

on:
  push:
    branches:
      - agent/stm32h7-partitioned-scope-selection
    paths:
      - 'data/device-catalog/research/stm32h7_partitioned_scope_selection.py'
      - '.github/workflows/device-catalog-stm32h7-partition-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stm32h7-partitioned-scope-selection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze H7 partition source
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path

          root = Path('.')
          research = root / 'data/device-catalog/research'
          canonical = research / 'openocd-parts-canonical.csv'
          dup = research / 'openocd-duplicate-resolutions.csv'

          with canonical.open(newline='', encoding='utf-8') as f:
              rows = [r for r in csv.DictReader(f) if r.get('vendor') == 'STMicroelectronics' and r.get('plasma_series') == 'STM32H7']
          rows = sorted(rows, key=lambda r: (r['target_config'], r['family'], r['subfamily'], r['part_number'], r['identifier_kind']))
          if len(rows) != 200:
              raise SystemExit(f'expected 200 H7 rows, got {len(rows)}')

          with dup.open(newline='', encoding='utf-8') as f:
              resolutions = [r for r in csv.DictReader(f) if r.get('vendor') == 'STMicroelectronics' and r.get('selected_target_config') == 'tcl/target/stm32h7rsx.cfg']
          resolutions = sorted(resolutions, key=lambda r: r['part_number'])
          if len(resolutions) != 34:
              raise SystemExit(f'expected 34 H7R/S resolutions, got {len(resolutions)}')

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          payload = {
              'schema_version': 1,
              'source_id': 'stm32h7-partition-source-v1',
              'canonical_source_path': str(canonical),
              'canonical_source_sha256': sha(canonical),
              'duplicate_resolution_source_path': str(dup),
              'duplicate_resolution_source_sha256': sha(dup),
              'row_count': len(rows),
              'rows': rows,
              'duplicate_resolution_count': len(resolutions),
              'duplicate_resolutions': resolutions,
          }
          out = research / 'stm32h7-partition-source.json'
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Render deterministic partition selection
        run: python data/device-catalog/research/stm32h7_partitioned_scope_selection.py --output data/device-catalog/research/stm32h7-partitioned-scope-selection.json
      - name: Commit deterministic artifacts
        run: |
          git add data/device-catalog/research/stm32h7-partition-source.json data/device-catalog/research/stm32h7-partitioned-scope-selection.json
          if git diff --cached --quiet; then
            echo 'Partition artifacts already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Device catalog: materialize STM32H7 partition selection'
          git push origin HEAD:agent/stm32h7-partitioned-scope-selection
