name: STM32G4 Phase 4.9E finalize one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32g4-phase49e-publication
    paths:
      - ".github/workflows/device-catalog-stm32g4-phase49e-finalize-oneoff.yml"

permissions:
  contents: write

jobs:
  finalize-current-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-stm32g4-phase49e-publication
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch current-state regressions without rewriting historical state
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          p = Path('software/python/tests/test_device_catalog.py')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, 'EXPECTED_PRODUCTION_CATALOG_SIZE = 610', 'EXPECTED_PRODUCTION_CATALOG_SIZE = 635', 'catalog size')
          s = replace_once(s, 'EXPECTED_STM32G0_CATALOG_SIZE = 47\n', 'EXPECTED_STM32G0_CATALOG_SIZE = 47\nEXPECTED_STM32G4_CATALOG_SIZE = 25\n', 'G4 size constant')
          s = replace_once(s, '        "STM32G0",\n    }', '        "STM32G0",\n        "STM32G4",\n    }', 'family set')
          s = replace_once(s, '    assert metadata["source_count"] == 7', '    assert metadata["source_count"] == 8', 'source count')
          s = replace_once(s, '                {"family": "STM32G0", "count": EXPECTED_STM32G0_CATALOG_SIZE},\n', '                {"family": "STM32G0", "count": EXPECTED_STM32G0_CATALOG_SIZE},\n                {"family": "STM32G4", "count": EXPECTED_STM32G4_CATALOG_SIZE},\n', 'taxonomy')
          marker = 'def test_production_payload_separates_catalog_verification_from_physical_validation() -> None:\n'
          g4_test = '''def test_stm32g4_publication_is_catalog_visible_without_physical_qualification() -> None:\n    record = get_default_device_catalog().search("stm32g441cby6tr", limit=1)[0]\n    assert record.identifier == "STM32G441CBY6TR"\n    assert record.family == "STM32G4"\n    assert record.package == "WLCSP"\n    assert record.pin_count == "49"\n    assert record.target_config == "tcl/target/stm32g4x.cfg"\n    payload = record.to_payload()\n    assert payload["catalog"]["scope"] == "production_admitted"\n    assert payload["physical_validation"] == {\n        "engineering_status": "no_evidence",\n        "ppu_status": "no_evidence",\n        "socket_status": "no_evidence",\n    }\n\n\n'''
          s = replace_once(s, marker, g4_test + marker, 'G4 visibility test')
          p.write_text(s, encoding='utf-8')

          p = Path('software/python/tests/test_device_catalog_web_gateway.py')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, 'EXPECTED_PRODUCTION_CATALOG_SIZE = 610', 'EXPECTED_PRODUCTION_CATALOG_SIZE = 635', 'gateway catalog size')
          p.write_text(s, encoding='utf-8')

          p = Path('data/device-catalog/research/test_stm32g0_phase4_8e_publication.py')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
              s,
              'EXPECTED_MANIFEST_SHA256 = "0dbb7df5a3ddc771326507fb42a47416d892d1d17f4e4141dde37cde23e95ddf"',
              'EXPECTED_G0_POST_MANIFEST_SHA256 = "0dbb7df5a3ddc771326507fb42a47416d892d1d17f4e4141dde37cde23e95ddf"\nEXPECTED_CURRENT_MANIFEST_SHA256 = "93c2a4541daeb1d4aa1dcc57edef54042862eb6d9da03e3a6b401e4b8481b11d"',
              'G0 manifest bindings',
          )
          s = replace_once(s, 'self.assertEqual(file_sha256(CURRENT_MANIFEST), EXPECTED_MANIFEST_SHA256)', 'self.assertEqual(file_sha256(CURRENT_MANIFEST), EXPECTED_CURRENT_MANIFEST_SHA256)', 'G0 current manifest assertion')
          s = replace_once(s, 'self.assertEqual(self.audit["production_manifest_sha256_after"], EXPECTED_MANIFEST_SHA256)', 'self.assertEqual(self.audit["production_manifest_sha256_after"], EXPECTED_G0_POST_MANIFEST_SHA256)', 'G0 historical audit assertion')
          s = replace_once(s, '        self.assertEqual(exact_count, 610)\n        self.assertEqual(base_count, 209)\n', '        self.assertEqual(exact_count, 635)\n        self.assertEqual(base_count, 217)\n', 'G0 current aggregate')
          s = replace_once(s, '            "STM32F4": 384, "STM32F7": 19, "STM32G0": 47,\n', '            "STM32F4": 384, "STM32F7": 19, "STM32G0": 47, "STM32G4": 25,\n', 'G0 current families')
          if 'EXPECTED_MANIFEST_SHA256' in s:
              raise SystemExit('G0 ambiguous manifest constant still present')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate historical/current separation and G4 publication hard-lock
        run: |
          python data/device-catalog/research/test_stm32g0_phase4_8e_publication.py
          python data/device-catalog/research/test_stm32g4_phase4_9e_publication.py
      - name: Validate current catalog and gateway behavior
        run: |
          python -m pip install -q pytest
          PYTHONPATH=software/python python -m pytest -q \
            software/python/tests/test_device_catalog.py \
            software/python/tests/test_device_catalog_web_gateway.py
      - name: Commit current-state regression migration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            software/python/tests/test_device_catalog.py \
            software/python/tests/test_device_catalog_web_gateway.py \
            data/device-catalog/research/test_stm32g0_phase4_8e_publication.py
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "Device catalog: migrate current state to STM32G4 publication"
          git push origin HEAD:agent/device-catalog-stm32g4-phase49e-publication
