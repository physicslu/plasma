name: Device catalog Phase 4.2X M/Y WLCSP81 discovery
on:
  push:
    branches: [agent/device-catalog-phase4.2x-my-wlcsp81-admission]
    paths: [".github/workflows/device-catalog-phase42x-discovery.yml", "data/device-catalog/research/stm32f4-phase4.2x-my-wlcsp81-admission-manifest.json"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  discover:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright==1.62.0 && python -m playwright install --with-deps chromium
      - run: |
          mkdir -p /tmp/phase42x
          xvfb-run -a python data/device-catalog/research/run_stm32f4_browser_pilot.py \
            --manifest data/device-catalog/research/stm32f4-phase4.2x-my-wlcsp81-admission-manifest.json \
            --catalog data/device-catalog/research/openocd-parts-canonical.csv \
            --output /tmp/phase42x/pilot-summary.json \
            --scope pilot --headed --timeout 75 --delay 2
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/phase42x/pilot-summary.json').read_text())
          expected = {'STM32F479ZG', 'STM32F413MG', 'STM32F413MH', 'STM32F423MH', 'STM32F446MC', 'STM32F446ME'}
          observed = {item['base_device'] for item in summary['results']}
          if summary['acquisition_failure'] or observed != expected:
              raise SystemExit(f'Phase 4.2X discovery failed: expected={sorted(expected)} observed={sorted(observed)} failures={summary["acquisition_failure"]}')
          PY
          cd /tmp/phase42x && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: phase42x-my-wlcsp81-discovery, path: /tmp/phase42x, if-no-files-found: error, retention-days: 30}
