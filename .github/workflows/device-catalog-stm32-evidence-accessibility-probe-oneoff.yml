name: STM32 evidence accessibility final replay one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32-evidence-accessibility-probe
    paths:
      - ".github/workflows/device-catalog-stm32-evidence-accessibility-probe-oneoff.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate offline probe contracts
        run: python data/device-catalog/research/test_stm32_evidence_accessibility_probe.py
      - name: Replay retained official-ST evidence
        run: python data/device-catalog/research/validate_stm32_evidence_accessibility_probe_retained.py
      - name: Assert Production remains outside probe scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/device-catalog/production/icpn-v1-manifest.json').read_text())
          counts={str(x['family']):int(x['row_count']) for x in p['sources']}
          assert sum(counts.values()) == 635
          assert counts.get('STM32U0',0) == 0
          assert counts.get('STM32C0',0) == 0
          assert counts.get('STM32L1',0) == 0
          print({'production_exact_icpns':sum(counts.values()),'probe_family_counts':{k:counts.get(k,0) for k in ('STM32U0','STM32C0','STM32L1')}})
          PY
