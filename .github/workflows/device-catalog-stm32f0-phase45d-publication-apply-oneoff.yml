name: STM32F0 Phase 4.5D publication apply one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f0-phase45d-publication
    paths:
      - ".github/workflows/device-catalog-stm32f0-phase45d-publication-apply-oneoff.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-stm32f0-phase45d-publication
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic publication transaction
        env:
          PYTHONPATH: data/device-catalog/research
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          from device_catalog_admission_framework import write_canonical_dataset
          from stm32f0_admission_policy import CANONICAL_FIELDS
          from stm32f0_phase4_5d_admission import admission_plan_is_clean, build_admission_plan

          root = Path('.')
          research = root / 'data/device-catalog/research'
          production_manifest = root / 'data/device-catalog/production/icpn-v1-manifest.json'
          prestate = research / 'stm32f0-phase4.5d-production-manifest-prestate.json'
          canonical = research / 'stm32f0-commercial-icpn.csv'
          policy = research / 'stm32f0_phase4_5c_policy.py'
          audit_path = research / 'stm32f0-phase4.5d-admission-audit.json'

          expected_plan_sha = '37eebcd8e8a537b28916934a4d4651aea3f1d1f7d449cb6586a1f641a884c5f1'
          expected_canonical_sha = 'c5e138eced2389cf99948536308142a2488bdaefa619130b9b50b6fc52cd80c9'
          expected_prestate_sha = hashlib.sha256(prestate.read_bytes()).hexdigest()
          current_prestate_sha = hashlib.sha256(production_manifest.read_bytes()).hexdigest()
          if production_manifest.read_bytes() != prestate.read_bytes():
              raise SystemExit(
                  f'Production prestate drifted before publication: retained={expected_prestate_sha} current={current_prestate_sha}'
              )
          if canonical.exists():
              raise SystemExit('STM32F0 canonical unexpectedly exists before controlled publication')

          plan = build_admission_plan(
              canonical_path=canonical,
              production_manifest_path=prestate,
          )
          if not admission_plan_is_clean(plan):
              raise SystemExit('historical admission plan is not clean')
          plan_payload = json.dumps(plan, indent=2, sort_keys=True) + '\n'
          plan_sha = hashlib.sha256(plan_payload.encode()).hexdigest()
          if plan_sha != expected_plan_sha:
              raise SystemExit(f'admission plan digest drifted: {plan_sha}')

          with canonical.open('w', newline='', encoding='utf-8') as handle:
              csv.DictWriter(handle, fieldnames=CANONICAL_FIELDS, lineterminator='\n').writeheader()
          first = write_canonical_dataset(plan=plan, canonical_path=canonical)
          second = write_canonical_dataset(plan=plan, canonical_path=canonical)
          if first.get('status') != 'written' or first.get('rows_before') != 0 or first.get('rows_after') != 42:
              raise SystemExit(f'unexpected canonical publication result: {first}')
          if second.get('status') != 'no_op':
              raise SystemExit(f'canonical writer is not idempotent: {second}')
          canonical_sha = hashlib.sha256(canonical.read_bytes()).hexdigest()
          if canonical_sha != expected_canonical_sha:
              raise SystemExit(f'canonical digest drifted: {canonical_sha}')
          canonical_blob = subprocess.check_output(
              ['git', 'hash-object', str(canonical)], text=True
          ).strip()
          if len(canonical_blob) != 40:
              raise SystemExit(f'invalid canonical git blob: {canonical_blob}')

          manifest = json.loads(prestate.read_text(encoding='utf-8'))
          if any(source.get('family') == 'STM32F0' for source in manifest['sources']):
              raise SystemExit('STM32F0 already exists in retained Production prestate')
          manifest['sources'].append(
              {
                  'manufacturer': 'STMicroelectronics',
                  'family': 'STM32F0',
                  'path': '../research/stm32f0-commercial-icpn.csv',
                  'row_count': 42,
                  'git_blob_sha': canonical_blob,
                  'sha256': canonical_sha,
              }
          )
          manifest['sources'].sort(key=lambda source: (source['manufacturer'], source['family']))
          production_manifest.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )

          policy_text = policy.read_text(encoding='utf-8')
          old_default = 'DEFAULT_PRODUCTION_MANIFEST = HERE.parent / "production/icpn-v1-manifest.json"'
          new_default = 'DEFAULT_PRODUCTION_MANIFEST = HERE / "stm32f0-phase4.5d-production-manifest-prestate.json"'
          if policy_text.count(old_default) != 1:
              raise SystemExit('cannot uniquely freeze STM32F0 Phase 4.5C Production boundary')
          policy.write_text(policy_text.replace(old_default, new_default, 1), encoding='utf-8')

          audit = {
              'schema_version': 1,
              'phase': '4.5D',
              'policy_phase': '4.5C',
              'status': 'published',
              'proposal_run_id': 34321124601,
              'proposal_artifact_id': 10091887563,
              'proposal_artifact_zip_sha256': 'c0bc8d975428325059f7012686b35ea04e9c72dcd6f5f73445843916d389e5e4',
              'admission_plan_sha256': plan_sha,
              'canonical_csv_file_sha256': canonical_sha,
              'canonical_csv_git_blob_sha': canonical_blob,
              'added_exact_icpns': first['added'],
              'stm32f0_rows_before': 0,
              'stm32f0_rows_after': 42,
              'stm32f0_base_devices_before': 0,
              'stm32f0_base_devices_after': 13,
              'production_exact_icpns_before': 502,
              'production_exact_icpns_after': 544,
              'production_base_devices_before': 175,
              'production_base_devices_after': 188,
              'production_family_count_before': 4,
              'production_family_count_after': 5,
              'lifecycle_exclusions': [],
              'programming_algorithm_equivalence_claimed': False,
              'physical_target_qualification_claimed': False,
              'runtime_programming_support_claimed': False,
              'full_stm32f0_surface_covered': False,
          }
          audit_path.write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          # Advance the current runtime release snapshot from 502 to 544 exact ICPNs.
          release = root / 'software/python/tests/test_device_catalog.py'
          release_text = release.read_text(encoding='utf-8')
          replacements = {
              'EXPECTED_PRODUCTION_CATALOG_SIZE = 502\nEXPECTED_STM32F2_CATALOG_SIZE = 33\n':
                  'EXPECTED_PRODUCTION_CATALOG_SIZE = 544\nEXPECTED_STM32F0_CATALOG_SIZE = 42\nEXPECTED_STM32F2_CATALOG_SIZE = 33\n',
              '{"STM32F1", "STM32F2", "STM32F3", "STM32F4"}':
                  '{"STM32F0", "STM32F1", "STM32F2", "STM32F3", "STM32F4"}',
              'assert metadata["source_count"] == 4': 'assert metadata["source_count"] == 5',
              '                {"family": "STM32F1", "count": 75},\n':
                  '                {"family": "STM32F0", "count": EXPECTED_STM32F0_CATALOG_SIZE},\n'
                  '                {"family": "STM32F1", "count": 75},\n',
          }
          for old, new in replacements.items():
              if release_text.count(old) != 1:
                  raise SystemExit(f'runtime release snapshot anchor is not unique: {old!r}')
              release_text = release_text.replace(old, new, 1)
          release.write_text(release_text, encoding='utf-8')

          gateway = root / 'software/python/tests/test_device_catalog_web_gateway.py'
          gateway_text = gateway.read_text(encoding='utf-8')
          if gateway_text.count('EXPECTED_PRODUCTION_CATALOG_SIZE = 502') != 1:
              raise SystemExit('web gateway Production snapshot anchor is not unique')
          gateway.write_text(
              gateway_text.replace('EXPECTED_PRODUCTION_CATALOG_SIZE = 502', 'EXPECTED_PRODUCTION_CATALOG_SIZE = 544', 1),
              encoding='utf-8',
          )

          validation = root / '.github/workflows/device-catalog-stm32f0-validation.yml'
          validation_text = validation.read_text(encoding='utf-8')
          anchor = '      - "data/device-catalog/research/test_stm32f0_phase4_5d_admission.py"\n'
          extra = (
              anchor
              + '      - "data/device-catalog/research/stm32f0-commercial-icpn.csv"\n'
              + '      - "data/device-catalog/research/stm32f0-phase4.5d-production-manifest-prestate.json"\n'
              + '      - "data/device-catalog/research/stm32f0-phase4.5d-admission-audit.json"\n'
              + '      - "data/device-catalog/production/icpn-v1-manifest.json"\n'
          )
          if validation_text.count(anchor) != 2:
              raise SystemExit('STM32F0 validation path anchor count drifted')
          validation_text = validation_text.replace(anchor, extra)
          validation_text = validation_text.replace(
              'Validate Phase 4.5D admission capability gate',
              'Validate Phase 4.5D post-publication regression',
              1,
          )
          validation.write_text(validation_text, encoding='utf-8')

          postpub_test = '''#!/usr/bin/env python3
          """Post-publication regressions for STM32F0 Phase 4.5D admission."""

          from __future__ import annotations

          import csv
          import hashlib
          import json
          import tempfile
          import unittest
          from pathlib import Path

          from device_catalog_admission_framework import AdmissionError, file_sha256, write_canonical_dataset
          from stm32f0_admission_policy import CANONICAL_FIELDS
          from stm32f0_phase4_5d_admission import admission_plan_is_clean, build_admission_plan

          HERE = Path(__file__).resolve().parent
          CURRENT_MANIFEST = HERE.parent / "production" / "icpn-v1-manifest.json"
          PRESTATE_MANIFEST = HERE / "stm32f0-phase4.5d-production-manifest-prestate.json"
          AUDIT_PATH = HERE / "stm32f0-phase4.5d-admission-audit.json"
          CURRENT_CANONICAL = HERE / "stm32f0-commercial-icpn.csv"

          EXPECTED_PLAN_SHA256 = "37eebcd8e8a537b28916934a4d4651aea3f1d1f7d449cb6586a1f641a884c5f1"
          EXPECTED_CANONICAL_SHA256 = "c5e138eced2389cf99948536308142a2488bdaefa619130b9b50b6fc52cd80c9"
          EXPECTED_CANONICAL_BLOB = "__CANONICAL_BLOB__"


          def write_empty_canonical(path: Path) -> None:
              with path.open("w", newline="", encoding="utf-8") as handle:
                  csv.DictWriter(handle, fieldnames=CANONICAL_FIELDS, lineterminator="\\n").writeheader()


          class STM32F0Phase45DAdmissionTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls) -> None:
                  cls.audit = json.loads(AUDIT_PATH.read_text(encoding="utf-8"))

              def _historical_plan(self, canonical: Path) -> dict:
                  self.assertFalse(canonical.exists())
                  plan = build_admission_plan(
                      canonical_path=canonical,
                      production_manifest_path=PRESTATE_MANIFEST,
                  )
                  self.assertTrue(admission_plan_is_clean(plan))
                  payload = json.dumps(plan, indent=2, sort_keys=True) + "\\n"
                  self.assertEqual(hashlib.sha256(payload.encode()).hexdigest(), EXPECTED_PLAN_SHA256)
                  return plan

              def test_published_canonical_manifest_and_audit_are_bound(self) -> None:
                  with CURRENT_CANONICAL.open(newline="", encoding="utf-8") as handle:
                      rows = list(csv.DictReader(handle))
                  self.assertEqual(len(rows), 42)
                  self.assertEqual(len({row["icpn"] for row in rows}), 42)
                  self.assertEqual(len({row["base_device"] for row in rows}), 13)
                  self.assertEqual(file_sha256(CURRENT_CANONICAL), EXPECTED_CANONICAL_SHA256)
                  self.assertTrue(all(row["family"] == "STM32F0" for row in rows))
                  self.assertTrue(all(row["openocd_target_config"] == "tcl/target/stm32f0x.cfg" for row in rows))

                  manifest = json.loads(CURRENT_MANIFEST.read_text(encoding="utf-8"))
                  source = next(item for item in manifest["sources"] if item["family"] == "STM32F0")
                  self.assertEqual(source["row_count"], 42)
                  self.assertEqual(source["sha256"], EXPECTED_CANONICAL_SHA256)
                  self.assertEqual(source["git_blob_sha"], EXPECTED_CANONICAL_BLOB)

                  self.assertEqual(self.audit["admission_plan_sha256"], EXPECTED_PLAN_SHA256)
                  self.assertEqual(self.audit["canonical_csv_file_sha256"], EXPECTED_CANONICAL_SHA256)
                  self.assertEqual(self.audit["canonical_csv_git_blob_sha"], EXPECTED_CANONICAL_BLOB)
                  self.assertEqual(set(self.audit["added_exact_icpns"]), {row["icpn"] for row in rows})
                  self.assertEqual(self.audit["stm32f0_rows_before"], 0)
                  self.assertEqual(self.audit["stm32f0_rows_after"], 42)
                  self.assertEqual(self.audit["stm32f0_base_devices_after"], 13)
                  self.assertEqual(self.audit["production_exact_icpns_before"], 502)
                  self.assertEqual(self.audit["production_exact_icpns_after"], 544)
                  self.assertEqual(self.audit["production_base_devices_before"], 175)
                  self.assertEqual(self.audit["production_base_devices_after"], 188)
                  self.assertEqual(self.audit["production_family_count_before"], 4)
                  self.assertEqual(self.audit["production_family_count_after"], 5)
                  self.assertEqual(self.audit["status"], "published")
                  self.assertFalse(self.audit["programming_algorithm_equivalence_claimed"])
                  self.assertFalse(self.audit["physical_target_qualification_claimed"])
                  self.assertFalse(self.audit["runtime_programming_support_claimed"])
                  self.assertFalse(self.audit["full_stm32f0_surface_covered"])

              def test_historical_plan_replays_exactly_and_writer_is_idempotent(self) -> None:
                  with tempfile.TemporaryDirectory() as tmp:
                      canonical = Path(tmp) / "stm32f0-commercial-icpn.csv"
                      plan = self._historical_plan(canonical)
                      self.assertEqual(plan["candidate_count"], 42)
                      self.assertEqual(plan["production_snapshot"]["exact_icpn_count"], 502)
                      self.assertEqual(plan["production_snapshot"]["base_device_count"], 175)
                      self.assertEqual(plan["canonical_rows_before"], 0)
                      write_empty_canonical(canonical)
                      first = write_canonical_dataset(plan=plan, canonical_path=canonical)
                      second = write_canonical_dataset(plan=plan, canonical_path=canonical)
                      self.assertEqual(first["status"], "written")
                      self.assertEqual(first["rows_after"], 42)
                      self.assertEqual(second["status"], "no_op")
                      self.assertEqual(file_sha256(canonical), EXPECTED_CANONICAL_SHA256)

              def test_current_published_canonical_cannot_be_re_admitted(self) -> None:
                  with self.assertRaisesRegex(AdmissionError, "zero-row STM32F0 canonical prestate"):
                      build_admission_plan()

              def test_published_metadata_contract_is_preserved(self) -> None:
                  with CURRENT_CANONICAL.open(newline="", encoding="utf-8") as handle:
                      rows = {row["icpn"]: row for row in csv.DictReader(handle)}
                  self.assertEqual(rows["STM32F078CBY6TR"]["package"], "WLCSP")
                  self.assertEqual(rows["STM32F078CBY6TR"]["pin_count"], "49")
                  self.assertEqual(rows["STM32F098CCT7"]["flash_size"], "256 KiB")
                  self.assertEqual(rows["STM32F071C8U7"]["temperature_grade"], "-40 to 105 C")


          if __name__ == "__main__":
              unittest.main()
          '''
          import textwrap
          postpub_test = textwrap.dedent(postpub_test).replace('__CANONICAL_BLOB__', canonical_blob)
          (research / 'test_stm32f0_phase4_5d_admission.py').write_text(postpub_test, encoding='utf-8')

          print('STM32F0_PUBLICATION=APPLIED')
          print('ADMISSION_PLAN_SHA256=' + plan_sha)
          print('CANONICAL_SHA256=' + canonical_sha)
          print('CANONICAL_GIT_BLOB=' + canonical_blob)
          print('PRODUCTION_EXACT_ICPNS_AFTER=544')
          print('PRODUCTION_BASE_DEVICES_AFTER=188')
          PY

          git diff --check

      - name: Validate publication and historical replay
        env:
          PYTHONPATH: data/device-catalog/research
        run: |
          python data/device-catalog/research/test_stm32f0_phase4_5c_policy.py
          python data/device-catalog/research/test_stm32f0_phase4_5d_admission.py
          PYTHONPATH=software/python python - <<'PY'
          from plasma_web.device_catalog import get_default_device_catalog
          catalog = get_default_device_catalog()
          assert catalog.size == 544, catalog.size
          assert catalog.source_count == 5, catalog.source_count
          counts = {item['family']: item['count'] for item in catalog.metadata['taxonomy'][0]['families']}
          assert counts == {
              'STM32F0': 42,
              'STM32F1': 75,
              'STM32F2': 33,
              'STM32F3': 10,
              'STM32F4': 384,
          }, counts
          record = catalog.resolve('STMicroelectronics', 'STM32F078CBY6TR')
          assert record is not None
          assert record.family == 'STM32F0'
          assert record.target_config == 'tcl/target/stm32f0x.cfg'
          print('RUNTIME_CATALOG_SNAPSHOT=CLEAN')
          PY

      - name: Commit publication transaction
        run: |
          git config user.name "plasma-ci"
          git config user.email "plasma-ci@users.noreply.github.com"
          git rm -f \
            .github/workflows/device-catalog-stm32f0-phase45d-publication-proposal-oneoff.yml \
            .github/workflows/device-catalog-stm32f0-phase45d-publication-apply-oneoff.yml
          git add \
            .github/workflows/device-catalog-stm32f0-validation.yml \
            data/device-catalog/production/icpn-v1-manifest.json \
            data/device-catalog/research/stm32f0-commercial-icpn.csv \
            data/device-catalog/research/stm32f0-phase4.5d-admission-audit.json \
            data/device-catalog/research/stm32f0_phase4_5c_policy.py \
            data/device-catalog/research/test_stm32f0_phase4_5d_admission.py \
            software/python/tests/test_device_catalog.py \
            software/python/tests/test_device_catalog_web_gateway.py
          git diff --cached --check
          git commit -m "device-catalog: publish STM32F0 Phase 4.5D exact ICPNs"
          git push origin HEAD:agent/device-catalog-stm32f0-phase45d-publication
