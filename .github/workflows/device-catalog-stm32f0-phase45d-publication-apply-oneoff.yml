name: STM32F0 Phase 4.5D publication apply one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f0-phase45d-publication
    paths:
      - ".github/workflows/device-catalog-stm32f0-phase45d-publication-apply-oneoff.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-stm32f0-phase45d-publication
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply deterministic catalog publication
        env:
          PYTHONPATH: data/device-catalog/research
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          from device_catalog_admission_framework import write_canonical_dataset
          from stm32f0_admission_policy import CANONICAL_FIELDS
          from stm32f0_phase4_5d_admission import admission_plan_is_clean, build_admission_plan

          root = Path('.')
          research = root / 'data/device-catalog/research'
          production_manifest = root / 'data/device-catalog/production/icpn-v1-manifest.json'
          prestate = research / 'stm32f0-phase4.5d-production-manifest-prestate.json'
          canonical = research / 'stm32f0-commercial-icpn.csv'
          policy = research / 'stm32f0_phase4_5c_policy.py'
          audit_path = research / 'stm32f0-phase4.5d-admission-audit.json'

          expected_plan_sha = '37eebcd8e8a537b28916934a4d4651aea3f1d1f7d449cb6586a1f641a884c5f1'
          expected_canonical_sha = 'c5e138eced2389cf99948536308142a2488bdaefa619130b9b50b6fc52cd80c9'

          if production_manifest.read_bytes() != prestate.read_bytes():
              raise SystemExit('Production manifest no longer matches the retained Phase 4.5D prestate')
          if canonical.exists():
              raise SystemExit('STM32F0 canonical unexpectedly exists before controlled publication')

          plan = build_admission_plan(canonical_path=canonical, production_manifest_path=prestate)
          if not admission_plan_is_clean(plan):
              raise SystemExit('historical admission plan is not clean')
          plan_payload = json.dumps(plan, indent=2, sort_keys=True) + '\n'
          plan_sha = hashlib.sha256(plan_payload.encode()).hexdigest()
          if plan_sha != expected_plan_sha:
              raise SystemExit(f'admission plan digest drifted: {plan_sha}')

          with canonical.open('w', newline='', encoding='utf-8') as handle:
              csv.DictWriter(handle, fieldnames=CANONICAL_FIELDS, lineterminator='\n').writeheader()
          first = write_canonical_dataset(plan=plan, canonical_path=canonical)
          second = write_canonical_dataset(plan=plan, canonical_path=canonical)
          if first.get('status') != 'written' or first.get('rows_before') != 0 or first.get('rows_after') != 42:
              raise SystemExit(f'unexpected canonical publication result: {first}')
          if second.get('status') != 'no_op':
              raise SystemExit(f'canonical writer is not idempotent: {second}')

          canonical_sha = hashlib.sha256(canonical.read_bytes()).hexdigest()
          if canonical_sha != expected_canonical_sha:
              raise SystemExit(f'canonical digest drifted: {canonical_sha}')
          canonical_blob = subprocess.check_output(['git', 'hash-object', str(canonical)], text=True).strip()
          if canonical_blob != 'ad9a5b0e643dcbee3118dff9f9863c637d66e3d6':
              raise SystemExit(f'canonical Git blob drifted: {canonical_blob}')

          manifest = json.loads(prestate.read_text(encoding='utf-8'))
          if any(source.get('family') == 'STM32F0' for source in manifest['sources']):
              raise SystemExit('STM32F0 already exists in retained Production prestate')
          manifest['sources'].append({
              'manufacturer': 'STMicroelectronics',
              'family': 'STM32F0',
              'path': '../research/stm32f0-commercial-icpn.csv',
              'row_count': 42,
              'git_blob_sha': canonical_blob,
              'sha256': canonical_sha,
          })
          manifest['sources'].sort(key=lambda source: (source['manufacturer'], source['family']))
          production_manifest.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          policy_text = policy.read_text(encoding='utf-8')
          old_default = 'DEFAULT_PRODUCTION_MANIFEST = HERE.parent / "production/icpn-v1-manifest.json"'
          new_default = 'DEFAULT_PRODUCTION_MANIFEST = HERE / "stm32f0-phase4.5d-production-manifest-prestate.json"'
          if policy_text.count(old_default) != 1:
              raise SystemExit('cannot uniquely freeze STM32F0 Phase 4.5C Production boundary')
          policy.write_text(policy_text.replace(old_default, new_default, 1), encoding='utf-8')

          audit = {
              'schema_version': 1,
              'phase': '4.5D',
              'policy_phase': '4.5C',
              'status': 'published',
              'proposal_run_id': 34321124601,
              'proposal_artifact_id': 10091887563,
              'proposal_artifact_zip_sha256': 'c0bc8d975428325059f7012686b35ea04e9c72dcd6f5f73445843916d389e5e4',
              'admission_plan_sha256': plan_sha,
              'canonical_csv_file_sha256': canonical_sha,
              'canonical_csv_git_blob_sha': canonical_blob,
              'added_exact_icpns': first['added'],
              'stm32f0_rows_before': 0,
              'stm32f0_rows_after': 42,
              'stm32f0_base_devices_before': 0,
              'stm32f0_base_devices_after': 13,
              'production_exact_icpns_before': 502,
              'production_exact_icpns_after': 544,
              'production_base_devices_before': 175,
              'production_base_devices_after': 188,
              'production_family_count_before': 4,
              'production_family_count_after': 5,
              'lifecycle_exclusions': [],
              'programming_algorithm_equivalence_claimed': False,
              'physical_target_qualification_claimed': False,
              'runtime_programming_support_claimed': False,
              'full_stm32f0_surface_covered': False,
          }
          audit_path.write_text(json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          print('STM32F0_PUBLICATION=APPLIED')
          print('ADMISSION_PLAN_SHA256=' + plan_sha)
          print('CANONICAL_SHA256=' + canonical_sha)
          print('CANONICAL_GIT_BLOB=' + canonical_blob)
          print('PRODUCTION_EXACT_ICPNS_AFTER=544')
          print('PRODUCTION_BASE_DEVICES_AFTER=188')
          PY
          git diff --check

      - name: Validate catalog publication
        env:
          PYTHONPATH: data/device-catalog/research
        run: |
          python data/device-catalog/research/test_stm32f0_phase4_5c_policy.py
          python - <<'PY'
          from device_catalog_admission_framework import AdmissionError
          from stm32f0_phase4_5d_admission import build_admission_plan
          try:
              build_admission_plan()
          except AdmissionError as exc:
              assert 'zero-row STM32F0 canonical prestate' in str(exc), exc
          else:
              raise SystemExit('published STM32F0 canonical was incorrectly re-admissible')
          print('POST_PUBLICATION_FAIL_CLOSED=CLEAN')
          PY
          PYTHONPATH=software/python python - <<'PY'
          from plasma_web.device_catalog import get_default_device_catalog
          catalog = get_default_device_catalog()
          assert catalog.size == 544, catalog.size
          assert catalog.source_count == 5, catalog.source_count
          counts = {item['family']: item['count'] for item in catalog.metadata['taxonomy'][0]['families']}
          assert counts == {
              'STM32F0': 42,
              'STM32F1': 75,
              'STM32F2': 33,
              'STM32F3': 10,
              'STM32F4': 384,
          }, counts
          record = catalog.resolve('STMicroelectronics', 'STM32F078CBY6TR')
          assert record is not None
          assert record.family == 'STM32F0'
          assert record.target_config == 'tcl/target/stm32f0x.cfg'
          print('RUNTIME_CATALOG_SNAPSHOT=CLEAN')
          PY

      - name: Commit catalog publication
        run: |
          git config user.name "plasma-ci"
          git config user.email "plasma-ci@users.noreply.github.com"
          git add \
            data/device-catalog/production/icpn-v1-manifest.json \
            data/device-catalog/research/stm32f0-commercial-icpn.csv \
            data/device-catalog/research/stm32f0-phase4.5d-admission-audit.json \
            data/device-catalog/research/stm32f0_phase4_5c_policy.py
          git diff --cached --check
          git commit -m "device-catalog: publish STM32F0 Phase 4.5D exact ICPNs"
          git push origin HEAD:agent/device-catalog-stm32f0-phase45d-publication
