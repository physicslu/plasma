name: NXP Phase1 Kinetis 21 Official Material Evidence
on:
  pull_request:
    paths:
      - "data/device-catalog/research/nxp-21-k40-k60-kl4x-official-materials-phase1-v1.csv"
      - "data/device-catalog/research/nxp_phase1_kinetis_21_official_v1.py"
      - "data/device-catalog/research/test_nxp_phase1_kinetis_21_official_v1.py"
      - "data/device-catalog/research/NXP_PHASE1_KINETIS_21_OFFICIAL_V1.md"
      - ".github/workflows/device-catalog-nxp-phase1-kinetis21-v1.yml"
  push:
    branches: [main]
    paths:
      - "data/device-catalog/research/nxp_phase1_kinetis_21_official_v1.py"
      - "data/device-catalog/research/test_nxp_phase1_kinetis_21_official_v1.py"
      - ".github/workflows/device-catalog-nxp-phase1-kinetis21-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nxp-phase1-kinetis-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Replay and preserve NXP Phase1 previous source-locked S1=276
        run: python data/device-catalog/research/nxp_phase1_official_lpc_25_v1.py
      - name: Audit 21 official manufacturer material codes and S1=297
        run: python data/device-catalog/research/nxp_phase1_kinetis_21_official_v1.py
      - name: Validate negative gates for Kinetis identity and non-qualification
        run: python -m unittest discover -s data/device-catalog/research -p "test_nxp_phase1_kinetis_21_official_v1.py" -v
