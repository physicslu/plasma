name: STM32G0 Phase 4.8D admission one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32g0-phase48d-admission
    paths:
      - .github/workflows/device-catalog-stm32g0-phase48d-admission-oneoff.yml

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay Phase 4.8C / 4.8D permanent gates
        run: |
          python data/device-catalog/research/test_stm32g0_phase4_8c_policy.py
          python data/device-catalog/research/test_stm32g0_phase4_8c_policy_plan.py
          python data/device-catalog/research/test_stm32g0_phase4_8d_admission.py
          python data/device-catalog/research/validate_stm32g0_phase4_8d_admission_plan.py
          sha256sum data/device-catalog/research/stm32g0-phase4.8d-admission-plan.json
