name: STM32C0 C0.2 live discovery retention temp

on:
  push:
    branches:
      - agent/device-catalog-stm32c0-phase-c02-discovery
    paths:
      - ".github/workflows/stm32c0-c02-live-retention-temp.yml"

permissions:
  contents: write

concurrency:
  group: stm32c0-c02-live-retention
  cancel-in-progress: false

jobs:
  live-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic C0.2 boundary tests
        run: python data/device-catalog/research/test_stm32c0_phase_c0_2_discovery.py

      - name: Generate exact C0.2 target manifest
        run: |
          mkdir -p .artifacts/stm32c0-c02/evidence
          python data/device-catalog/research/stm32c0_phase_c0_2_discovery.py \
            --targets-output .artifacts/stm32c0-c02/target-manifest.json \
            > .artifacts/stm32c0-c02/target-manifest.stdout.json
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('.artifacts/stm32c0-c02/target-manifest.json')
          m = json.loads(p.read_text())
          expected = {
              'STM32C011': 4, 'STM32C031': 8, 'STM32C051': 8,
              'STM32C071': 10, 'STM32C091': 10, 'STM32C092': 10,
          }
          assert m['base_device_count'] == 50, m['base_device_count']
          assert m['base_device_counts_by_subfamily'] == expected, m['base_device_counts_by_subfamily']
          assert len(m['targets']) == 50
          assert len({x['base_device'] for x in m['targets']}) == 50
          assert all(v is False for v in m['claims'].values())
          print(json.dumps({'base_device_count': 50, 'by_subfamily': expected}, sort_keys=True))
          PY

      - name: Install bounded browser acquisition dependencies
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium

      - name: Acquire all 50 deterministic STM32C0 Base Devices
        id: acquire
        continue-on-error: true
        run: |
          xvfb-run -a python data/device-catalog/research/run_stm32c0_phase_c0_2_discovery.py \
            --delay 1.0 \
            --timeout 75 \
            --output .artifacts/stm32c0-c02/live-summary.json \
            --targets-output .artifacts/stm32c0-c02/target-manifest-live.json \
            --evidence-dir .artifacts/stm32c0-c02/evidence

      - name: Validate authoritative C0.2 live closure
        id: validate
        if: always() && hashFiles('.artifacts/stm32c0-c02/live-summary.json') != ''
        continue-on-error: true
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('.artifacts/stm32c0-c02')
          summary = json.loads((root / 'live-summary.json').read_text())
          manifest = json.loads((root / 'target-manifest.json').read_text())
          manifest_live = json.loads((root / 'target-manifest-live.json').read_text())
          assert manifest == manifest_live, 'target manifest changed during live run'
          assert summary['schema_version'] == 1
          assert summary['phase'] == 'C0.2' and summary['family'] == 'STM32C0'
          assert summary['base_device_count'] == 50 and summary['attempted'] == 50
          assert summary['commercial_identity_verified_targets'] == 50
          assert summary['dispositioned_targets'] == 50
          assert summary['identity_manual_intervention_required'] == 0
          assert summary['source_unavailable_exclusions'] == 0
          assert summary['acquisition_failure'] == 0
          assert summary['representative_continuity_clean'] is True
          assert summary['commercial_identity_clean'] is True
          assert summary['bounded_discovery_clean'] is True
          assert summary['active_exact_icpn_candidates'] > 0
          assert summary['commercial_identity_authority'] == (
              'official_st_quality_and_reliability_exact_identity_plus_'
              'sample_and_buy_marketing_status_exact_set_join'
          )
          assert summary['evidence_surface'] == 'quality_and_reliability_identity_plus_sample_and_buy_lifecycle'
          assert summary['openocd_routing']['gates_commercial_identity'] is False
          assert all(v is False for v in summary['claims'].values())
          results = summary['results']
          assert len(results) == 50
          exact = []
          for result in results:
              assert result['acquisition_status'] == 'success'
              assert result['commercial_identity_status'] in {'verified_active', 'verified_non_active_only'}
              evidence = result['evidence']
              assert evidence['evidence_surface'] == 'quality_and_reliability_identity_plus_sample_and_buy_lifecycle'
              assert evidence['parser_profile'] == 'stm32c0_c0_2_dual_surface_v1'
              exact.extend(evidence['exact_icpns'])
          assert len(exact) == len(set(exact)), 'duplicate exact ICPNs across Base Devices'
          print(json.dumps({
              'base_devices': 50,
              'active_exact_icpns': len(set(exact)),
              'active_targets': summary['active_candidate_targets'],
              'lifecycle_excluded_targets': summary['lifecycle_excluded_targets'],
              'routing': summary['openocd_routing'],
              'live_summary_sha256': hashlib.sha256((root / 'live-summary.json').read_bytes()).hexdigest(),
          }, sort_keys=True))
          PY

      - name: Record execution provenance
        if: always() && hashFiles('.artifacts/stm32c0-c02/live-summary.json') != ''
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('.artifacts/stm32c0-c02')
          summary = json.loads((root / 'live-summary.json').read_text())
          manifest = root / 'target-manifest.json'
          c01 = pathlib.Path('data/device-catalog/research/stm32c0-phase-c0.1-foundation-baseline.json')
          prod = pathlib.Path('data/device-catalog/production/icpn-v1-manifest.json')
          catalog = 'data/device-catalog/research/openocd-parts-canonical.csv'
          def digest(p): return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          def blob(p): return subprocess.check_output(['git', 'rev-parse', f'HEAD:{p}'], text=True).strip()
          provenance = {
              'schema_version': 1,
              'phase': 'C0.2',
              'family': 'STM32C0',
              'source_repository': os.environ['GITHUB_REPOSITORY'],
              'executed_git_sha': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'target_manifest_sha256': digest(manifest),
              'live_summary_sha256': digest(root / 'live-summary.json'),
              'c0_1_foundation_sha256': digest(c01),
              'c0_1_foundation_git_blob': blob(str(c01)),
              'openocd_catalog_git_blob': blob(catalog),
              'production_manifest_sha256': digest(prod),
              'production_manifest_git_blob': blob(str(prod)),
              'acquisition_transport': summary.get('acquisition_transport'),
              'browser': summary.get('browser'),
              'commercial_identity_authority': summary.get('commercial_identity_authority'),
              'target_count': summary.get('attempted'),
              'active_exact_icpn_candidates': summary.get('active_exact_icpn_candidates'),
              'bounded_discovery_clean': summary.get('bounded_discovery_clean'),
              'canonical_admission_authorized': False,
              'production_write_authorized': False,
              'runtime_programming_support_claimed': False,
          }
          (root / 'provenance.json').write_text(json.dumps(provenance, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload immutable live acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32c0-c02-live-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            .artifacts/stm32c0-c02/target-manifest.json
            .artifacts/stm32c0-c02/live-summary.json
            .artifacts/stm32c0-c02/provenance.json
            .artifacts/stm32c0-c02/evidence/*.json

      - name: Enforce live discovery gate before repository retention
        run: |
          if [ "${{ steps.acquire.outcome }}" != "success" ]; then
            echo "C0.2 live acquisition is not clean; retained artifact requires review." >&2
            exit 1
          fi
          if [ "${{ steps.validate.outcome }}" != "success" ]; then
            echo "C0.2 live evidence failed authoritative closure validation." >&2
            exit 1
          fi

      - name: Retain compact C0.2 evidence on feature branch
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_REF_NAME}"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/${GITHUB_REF_NAME})" ]; then
            echo "Feature branch moved during live acquisition; refusing stale retention." >&2
            exit 1
          fi
          root="data/device-catalog/research/evidence/stm32c0-c0.2-official-st-discovery-live-2026-09-11"
          mkdir -p "$root/evidence"
          cp .artifacts/stm32c0-c02/target-manifest.json data/device-catalog/research/stm32c0-phase-c0.2-discovery-manifest.json
          cp .artifacts/stm32c0-c02/live-summary.json "$root/pilot-summary.json"
          cp .artifacts/stm32c0-c02/provenance.json "$root/provenance.json"
          cp .artifacts/stm32c0-c02/evidence/*.json "$root/evidence/"
          cat > "$root/README.md" <<'EOF'
          # STM32C0 Phase C0.2 retained evidence

          Compact retained projection of the Gate-1-approved manufacturer-authoritative
          STM32C0 commercial discovery. Commercial identity/lifecycle authority is the
          official ST Quality & Reliability exact Part Number set joined fail-closed to
          Sample & Buy Marketing Status on the identical exact Part Number set.

          OpenOCD only bounds the deterministic research surface and records routing
          observations; it never gates commercial identity. No Production, canonical
          admission, programming, HIL, or runtime authority is created here.
          EOF
          git config user.name "plasma-ci"
          git config user.email "plasma-ci@users.noreply.github.com"
          git add data/device-catalog/research/stm32c0-phase-c0.2-discovery-manifest.json "$root"
          git commit -m "device-catalog: retain STM32C0 C0.2 live evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
