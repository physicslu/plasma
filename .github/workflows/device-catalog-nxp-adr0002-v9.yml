name: NXP ADR-0002 OpenOCD-first 501 exact v9
on:
  pull_request:
    paths:
      - 'data/device-catalog/research/nxp_adr0002_openocd_triage_v9.py'
      - 'data/device-catalog/research/test_nxp_adr0002_openocd_triage_v9.py'
      - 'data/device-catalog/research/nxp-501-adr0002-openocd-priority-v9.csv'
      - 'data/device-catalog/research/nxp-adr0002-openocd-source-v9.json'
      - '.github/workflows/device-catalog-nxp-adr0002-v9.yml'
      - 'data/device-catalog/research/nxp_adr0002_core_qual_v10.py'
      - 'data/device-catalog/research/test_nxp_adr0002_core_qual_v10.py'
      - 'data/device-catalog/research/nxp-501-adr0002-core-transport-qualification-v10.csv'
      - 'data/device-catalog/research/nxp-adr0002-core-source-v10.json'
      - 'data/device-catalog/research/nxp-adr0002-core-aware-metrics-v10.json'
      - 'data/device-catalog/research/NXP_ADR0002_CORE_DRIVER_METRICS_V10.md'
      - 'data/device-catalog/research/nxp_27_p0_flash_evidence_v11.py'
      - 'data/device-catalog/research/test_nxp_27_p0_flash_evidence_v11.py'
      - 'data/device-catalog/research/nxp-27-p0-exact-flash-review-v11.csv'
      - 'data/device-catalog/research/nxp-27-p0-openocd-source-evidence-v11.json'
      - 'data/device-catalog/research/NXP_27_P0_FLASH_REVIEW_V11.md'
      - 'data/device-catalog/research/nxp_38_p1_bounded_v12.py'
      - 'data/device-catalog/research/test_nxp_38_p1_bounded_v12.py'
      - 'data/device-catalog/research/nxp-38-p1-one-pass-v12.csv'
      - 'data/device-catalog/research/nxp-38-p1-source-lock-v12.json'
      - 'data/device-catalog/research/NXP_38_P1_BOUNDED_V12.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-pinned-upstream-nxp-priority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: openocd-org/openocd
          ref: 9ea7f3d647c8ecf6b0f1424002dfc3f4504a162c
          path: .evidence/openocd-0.12.0
          persist-credentials: false
      - run: python data/device-catalog/research/nxp_adr0002_openocd_triage_v9.py --upstream-root .evidence/openocd-0.12.0
      - run: python -m unittest discover -s data/device-catalog/research -p 'test_nxp_adr0002_openocd_triage_v9.py' -v
      - name: Replay Core, Transport, Flash source operations and 501 exact ICPN source chain against approved ADR
        run: python data/device-catalog/research/nxp_adr0002_core_qual_v10.py --upstream-root .evidence/openocd-0.12.0
      - name: Verify Core-aware denominators and fail-closed support semantics
        run: python -m unittest discover -s data/device-catalog/research -p 'test_nxp_adr0002_core_qual_v10.py' -v
      - name: P0 27 source-attested flash and silicon-ID safety audit
        run: python data/device-catalog/research/nxp_27_p0_flash_evidence_v11.py --upstream-root .evidence/openocd-0.12.0
      - name: P0 27 negative exact-ICPN software qualification tests
        run: python -m unittest discover -s data/device-catalog/research -p 'test_nxp_27_p0_flash_evidence_v11.py' -v
      - name: P1 bounded 38 exact part source evidence check (one-pass stop rule)
        run: python data/device-catalog/research/nxp_38_p1_bounded_v12.py --upstream-root .evidence/openocd-0.12.0
      - name: P1 38 negative no-promotion and reproducible ledger tests
        run: python -m unittest discover -s data/device-catalog/research -p 'test_nxp_38_p1_bounded_v12.py' -v
