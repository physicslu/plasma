name: NXP ADR-0002 OpenOCD-first 501 exact v9
on:
  pull_request:
    paths:
      - 'data/device-catalog/research/nxp_adr0002_openocd_triage_v9.py'
      - 'data/device-catalog/research/test_nxp_adr0002_openocd_triage_v9.py'
      - 'data/device-catalog/research/nxp-501-adr0002-openocd-priority-v9.csv'
      - 'data/device-catalog/research/nxp-adr0002-openocd-source-v9.json'
      - '.github/workflows/device-catalog-nxp-adr0002-v9.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-pinned-upstream-nxp-priority:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: openocd-org/openocd
          ref: 9ea7f3d647c8ecf6b0f1424002dfc3f4504a162c
          path: .evidence/openocd-0.12.0
          persist-credentials: false
      - run: python data/device-catalog/research/nxp_adr0002_openocd_triage_v9.py --upstream-root .evidence/openocd-0.12.0
      - run: python -m unittest discover -s data/device-catalog/research -p 'test_nxp_adr0002_openocd_triage_v9.py' -v
