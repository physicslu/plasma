name: STM32WB0 metadata replay v5.1

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32wb0-ordering-authority-v5.1.json'
      - 'data/device-catalog/research/analyze_stm32wb0_metadata_replay_v51.py'
      - 'data/device-catalog/research/test_analyze_stm32wb0_metadata_replay_v51.py'
      - 'data/device-catalog/research/STM32WB0_METADATA_REPLAY_V51.md'
      - '.github/workflows/device-catalog-stm32wb0-metadata-replay-v51.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay STM32WB0 Layer-1 metadata authority
        run: |
          python data/device-catalog/research/analyze_stm32wb0_metadata_replay_v51.py
          python -m unittest discover -s data/device-catalog/research \
            -p test_analyze_stm32wb0_metadata_replay_v51.py -v
