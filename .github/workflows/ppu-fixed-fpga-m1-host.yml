name: PPU Fixed FPGA Driver M1 Host Contracts
on:
  pull_request:
    paths:
      - 'pl/verification/fixed_image_abi_v1_gate1.json'
      - 'pl/tools/fixed_image_abi_contract.py'
      - 'pl/tests/test_fixed_image_abi_contract.py'
      - 'docs/adr/0003-runtime-fpga-driver-reconfiguration-boundary.md'
      - 'docs/architecture/fixed-fpga-hardware-abi-v1-gate1.md'
      - 'docs/architecture/fixed-fpga-hardware-broker-eight-site-gate1.md'
      - 'docs/development/fixed-fpga-uio-driver-contract-gate1.md'
      - '.github/workflows/ppu-fixed-fpga-m1-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-fixed-fpga-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline pytest
        run: python -m pip install pytest
      - name: Validate fixed ABI review candidate
        run: python -m pl.tools.fixed_image_abi_contract pl/verification/fixed_image_abi_v1_gate1.json
      - name: Host-only fixed Driver ABI/ownership regressions
        run: python -m pytest -q pl/tests/test_fixed_image_abi_contract.py
      - name: Existing Host-only UIO and configuration owner regressions
        run: |
          PYTHONPATH=software/python python -m pytest -q \
            software/python/tests/test_uio_backend_host.py \
            software/python/tests/test_configuration_owner_host.py \
            software/python/tests/test_configuration_safety_contract_host.py \
            software/python/tests/test_linux_mmio.py
