name: STM32F0 Phase 4.5A inventory one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f0-phase45a-foundation
    paths:
      - .github/workflows/device-catalog-stm32f0-phase45a-inventory-oneoff.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/device-catalog-stm32f0-phase45a-inventory-oneoff.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory STM32F0 OpenOCD source surface
        run: |
          python - <<'PY'
          import csv
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          path = Path('data/device-catalog/research/openocd-parts-canonical.csv')
          with path.open(newline='', encoding='utf-8') as handle:
              all_rows = list(csv.DictReader(handle))

          rows = [
              row for row in all_rows
              if row.get('vendor') == 'STMicroelectronics'
              and row.get('plasma_series') == 'STM32F0'
          ]
          if not rows:
              raise SystemExit('STM32F0 inventory is empty')

          by_subfamily = defaultdict(list)
          for row in rows:
              by_subfamily[row.get('subfamily', '')].append(row)

          initial_targets = []
          subfamily_part_numbers = {}
          for subfamily in sorted(by_subfamily):
              part_numbers = sorted({row.get('part_number', '') for row in by_subfamily[subfamily]})
              subfamily_part_numbers[subfamily] = part_numbers
              concrete = []
              for pattern in part_numbers:
                  if pattern.endswith('x') and len(pattern) >= 2:
                      concrete.append(pattern[:-1])
              initial_targets.append({
                  'subfamily': subfamily,
                  'first_part_number': part_numbers[0] if part_numbers else None,
                  'first_base_candidate': sorted(set(concrete))[0] if concrete else None,
              })

          result = {
              'schema_version': 1,
              'family': 'STM32F0',
              'source_row_count': len(rows),
              'unique_part_number_count': len({row.get('part_number', '') for row in rows}),
              'subfamily_counts': dict(sorted(Counter(row.get('subfamily', '') for row in rows).items())),
              'identifier_kinds': sorted({row.get('identifier_kind', '') for row in rows}),
              'target_configs': sorted({row.get('target_config', '') for row in rows}),
              'openocd_distributions': sorted({row.get('openocd_distribution', '') for row in rows}),
              'mapping_statuses': sorted({row.get('mapping_status', '') for row in rows}),
              'validation_statuses': sorted({row.get('validation_status', '') for row in rows}),
              'initial_targets': initial_targets,
              'subfamily_part_numbers': subfamily_part_numbers,
          }
          out = Path('stm32f0-phase4.5a-inventory.json')
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stm32f0-phase4.5a-inventory
          path: stm32f0-phase4.5a-inventory.json
          if-no-files-found: error
