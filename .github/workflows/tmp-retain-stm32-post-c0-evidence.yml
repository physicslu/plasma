name: TEMP retain STM32 post-C0 evidence artifact

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-retain-stm32-post-c0-evidence.yml"

permissions:
  actions: read
  contents: write

jobs:
  retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "34674798156"
      SOURCE_ARTIFACT: "stm32-post-c0-live-34674798156-1"
      DEST: "data/device-catalog/research/evidence/stm32-l1-l0-l4-post-c0-live-2026-09-12"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Download immutable acquisition artifact
        run: |
          rm -rf /tmp/post-c0-artifact
          mkdir -p /tmp/post-c0-artifact
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SOURCE_ARTIFACT" --dir /tmp/post-c0-artifact
          test -f /tmp/post-c0-artifact/probe-summary.json
          test -f /tmp/post-c0-artifact/targets.json
          test -f /tmp/post-c0-artifact/provenance.json
          test "$(find /tmp/post-c0-artifact/evidence -maxdepth 1 -name '*.json' | wc -l)" -eq 44

      - name: Retain evidence without transformation
        run: |
          rm -rf "$DEST"
          mkdir -p "$DEST/evidence"
          cp /tmp/post-c0-artifact/probe-summary.json "$DEST/probe-summary.json"
          cp /tmp/post-c0-artifact/targets.json "$DEST/targets.json"
          cp /tmp/post-c0-artifact/provenance.json "$DEST/provenance.json"
          cp /tmp/post-c0-artifact/evidence/*.json "$DEST/evidence/"
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/device-catalog/research/evidence/stm32-l1-l0-l4-post-c0-live-2026-09-12/probe-summary.json")
          s = json.loads(p.read_text())
          assert s["attempted_targets"] == 44
          assert s["dispositioned_targets"] == 44
          assert s["manual_review_targets"] == 0
          assert s["bounded_probe_complete"] is True
          assert s["candidate_series"] == ["STM32L1", "STM32L0", "STM32L4"]
          PY

      - name: Commit retained evidence to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Evidence already retained."
            exit 0
          fi
          git commit -m "Post-C0: retain official ST live evidence"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
