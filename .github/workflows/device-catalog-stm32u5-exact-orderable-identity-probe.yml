name: STM32U5 exact orderable identity probe

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32u5_exact_orderable_identity_probe.py'
      - 'data/device-catalog/research/stm32u5-base-device-discovery.csv'
      - '.github/workflows/device-catalog-stm32u5-exact-orderable-identity-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe ST exact Part Number tokens
        working-directory: data/device-catalog/research
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stm32u5-exact-probe"
          python stm32u5_exact_orderable_identity_probe.py \
            --output-csv "$RUNNER_TEMP/stm32u5-exact-probe/stm32u5-exact-orderable-identity-probe.csv" \
            --output-json "$RUNNER_TEMP/stm32u5-exact-probe/stm32u5-exact-orderable-identity-probe.json"
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: stm32u5-exact-orderable-identity-probe-${{ github.sha }}
          path: ${{ runner.temp }}/stm32u5-exact-probe/
          if-no-files-found: error
          retention-days: 7
