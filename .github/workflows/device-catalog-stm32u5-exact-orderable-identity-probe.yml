name: STM32U5 exact orderable identity validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32u5-exact-orderable-identity-enumeration.json'
      - 'data/device-catalog/research/stm32u5-manufacturer-identity-discovery.json'
      - 'data/device-catalog/research/stm32u5-base-device-discovery.csv'
      - 'data/device-catalog/research/stm32u5-security-scope-foundation.json'
      - 'data/device-catalog/research/validate_stm32u5_exact_orderable_identity_enumeration.py'
      - 'data/device-catalog/research/validate_stm32u5_manufacturer_identity_discovery.py'
      - 'data/device-catalog/production/icpn-v1-manifest.json'
      - 'docs/architecture/icpn-catalog-admission-policy.json'
      - '.github/workflows/device-catalog-stm32u5-exact-orderable-identity-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate completed STM32U5 parent identity discovery
        run: python data/device-catalog/research/validate_stm32u5_manufacturer_identity_discovery.py

      - name: Validate frozen STM32U5 exact orderable identities
        run: python data/device-catalog/research/validate_stm32u5_exact_orderable_identity_enumeration.py

      - name: Enforce offline-only gate
        run: |
          test ! -e .artifacts/stm32u5-exact-orderable
          echo "STM32U5 exact identity validation uses repository-retained evidence only."
