name: TEMP freeze STM32 post-C0 selection

on:
  pull_request:
    paths:
      - ".github/workflows/tmp-freeze-stm32-post-c0-selection.yml"

permissions:
  contents: write

concurrency:
  group: tmp-freeze-stm32-post-c0-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate evidence and selection policy
        working-directory: data/device-catalog/research
        run: |
          python test_stm32_post_c0_evidence_probe.py
          python test_stm32_post_c0_selection.py

      - name: Freeze deterministic next-family selection
        working-directory: data/device-catalog/research
        run: |
          python freeze_stm32_post_c0_selection.py
          python - <<'PY'
          import json
          p = json.load(open('stm32-post-c0-next-family-selection.json'))
          assert p['selected_next_research_family'] == 'STM32L0'
          assert p['ordering_review_candidates'] == ['STM32L0', 'STM32L4']
          assert all(v is False for v in p['authority_boundaries'].values())
          PY
          sha256sum \
            stm32-post-c0-next-family-selection.json \
            evidence/stm32-l1-l0-l4-post-c0-live-2026-09-12/probe-summary.json \
            evidence/stm32-l1-l0-l4-post-c0-live-2026-09-12/provenance.json \
            evidence/stm32-l1-l0-l4-post-c0-live-2026-09-12/targets.json \
            stm32-l0-l4-post-c0-ordering-authority-review.json \
            stm32-post-c0-production-manifest-prestate.json

      - name: Commit frozen selection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/device-catalog/research/stm32-post-c0-next-family-selection.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Selection already frozen."
            exit 0
          fi
          git commit -m "Post-C0: freeze STM32L0 next-family selection"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
