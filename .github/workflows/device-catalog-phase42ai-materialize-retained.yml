name: Device catalog Phase 4.2AI materialize retained evidence
on:
  push:
    branches: [agent/device-catalog-phase4.2ai-ay-wlcsp168-admission]
    paths: [".github/workflows/device-catalog-phase42ai-materialize-retained.yml"]
  workflow_dispatch:
permissions: {actions: read, contents: write}
jobs:
  materialize:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2ai-ay-wlcsp168-admission, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: phase42ai-ay-wlcsp168-retained, path: /tmp/phase42ai, repository: physicslu/plasma, run-id: 33969172921, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Materialize exact retained evidence
        run: |
          set -euo pipefail
          dst=data/device-catalog/research/evidence/stm32f4-phase4.2ai-ay-wlcsp168-admission-live-2026-09-05
          test -f /tmp/phase42ai/retained/manifest.json
          test "$(python -c "import json; print(json.load(open('/tmp/phase42ai/retained/manifest.json'))['evidence_id'])")" = "stm32f4-phase4.2ai-ay-wlcsp168-admission-2026-09-05-retained-20260905T133254Z-de33e30"
          test ! -e "$dst"
          mkdir -p "$dst"
          cp -a /tmp/phase42ai/retained/. "$dst/"
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir "$dst" --baseline data/device-catalog/research/stm32f4-phase4.2ai-ay-wlcsp168-admission-baseline.json
      - name: Commit retained evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/evidence/stm32f4-phase4.2ai-ay-wlcsp168-admission-live-2026-09-05
          git commit -m 'device-catalog: retain Phase 4.2AI official ST evidence'
          git push origin HEAD:agent/device-catalog-phase4.2ai-ay-wlcsp168-admission
