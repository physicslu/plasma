name: STM32H5 Layer-1 Production publication v2.9

on:
  pull_request:
    paths:
      - 'data/device-catalog/production/icpn-v1-manifest.json'
      - 'data/device-catalog/research/stm32h5-commercial-icpn.csv'
      - 'data/device-catalog/research/stm32h5-layer1-production-publication-v2.9.json'
      - 'data/device-catalog/research/validate_stm32h5_layer1_publication_v29.py'
      - 'data/device-catalog/research/STM32H5_LAYER1_PRODUCTION_PUBLICATION_V29.md'
      - 'data/ic-support/test_coverage_inventory.py'
      - 'software/python/tests/test_device_catalog_stm32h5.py'
      - '.github/workflows/device-catalog-stm32h5-layer1-publication-v29.yml'

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved H5 publication and Production graph
        run: |
          python data/device-catalog/research/validate_stm32h5_layer1_publication_v29.py
          python scripts/ci/device-catalog-production-invariants.py
          python data/ic-support/test_coverage_inventory.py
      - name: Install Python development package
        run: python -m pip install -e './software/python[dev]'
      - name: Validate runtime Catalog Layer-1/Layer-2 separation
        run: |
          python -m pytest -q \
            software/python/tests/test_device_catalog.py \
            software/python/tests/test_device_catalog_stm32h5.py \
            software/python/tests/test_device_catalog_web_gateway.py
