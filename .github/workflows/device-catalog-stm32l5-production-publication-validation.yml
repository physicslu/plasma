name: STM32L5 Production catalog publication validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32l5-*'
      - 'data/device-catalog/research/publish_stm32l5_catalog.py'
      - 'docs/architecture/icpn-catalog-admission-policy.json'
      - '.github/workflows/device-catalog-stm32l5-production-publication-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render STM32L5 publication candidate
        working-directory: data/device-catalog/research
        run: python publish_stm32l5_catalog.py --output-dir "$RUNNER_TEMP/stm32l5-publication" --json
      - name: Materialize generated publication
        run: |
          cp "$RUNNER_TEMP/stm32l5-publication/stm32l5-commercial-icpn.csv" data/device-catalog/research/stm32l5-commercial-icpn.csv
          cp "$RUNNER_TEMP/stm32l5-publication/icpn-v1-manifest.json" data/device-catalog/production/icpn-v1-manifest.json
          cp "$RUNNER_TEMP/stm32l5-publication/stm32l5-production-publication-proposal.json" data/device-catalog/research/stm32l5-production-publication-proposal.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/device-catalog/research/stm32l5-commercial-icpn.csv \
                  data/device-catalog/research/stm32l5-production-publication-proposal.json \
                  data/device-catalog/production/icpn-v1-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Device catalog: materialize STM32L5 publication"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
