name: z2like-demo Browser Runtime live acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/z2like-demo-browser-live-acceptance.yml"
      - "scripts/z2like-demo-browser-live-acceptance.py"
      - "scripts/openocd-control-plane-armv7-acceptance.py"
      - "scripts/openocd-runtime.py"
      - "software/python/plasma_interfaces/openocd_rpc.py"
      - "software/python/plasma_interfaces/openocd_worker.py"
      - "software/python/plasma_manager/server.py"
      - "software/python/plasma_web/gateway_base.py"
      - "software/web/app/api/manager/ppu/**"
      - "scripts/z2like-demo-qemu-control-plane.py"
      - "scripts/z2like-demo-qemu-build-kit.py"
      - "scripts/z2like-demo-qemu-kit.py"
      - "scripts/z2like-demo-qemu-installer.py"
      - "software/python/tests/test_z2like_demo_qemu_control_plane_contract.py"
      - "handover/H021-z2like-demo-browser-runtime-deployment-plan-2026-09-14.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/z2like-demo-browser-live-acceptance.yml"
      - ".github/workflows/z2like-demo-active-job-disable-live-negative.yml"
      - "scripts/z2like-demo-browser-live-acceptance.py"
      - "scripts/openocd-control-plane-armv7-acceptance.py"
      - "scripts/openocd-runtime.py"
      - "software/python/plasma_interfaces/openocd_rpc.py"
      - "software/python/plasma_interfaces/openocd_worker.py"
      - "software/python/plasma_manager/server.py"
      - "software/python/plasma_web/gateway_base.py"
      - "software/web/app/api/manager/ppu/**"
      - "scripts/z2like-demo-active-job-disable-live-acceptance.py"
      - "scripts/z2like-demo-qemu-control-plane.py"
      - "scripts/z2like-demo-qemu-build-kit.py"
      - "scripts/z2like-demo-qemu-kit.py"
      - "scripts/z2like-demo-qemu-installer.py"
      - "scripts/plasmactl-z2like-demo-managed-ingress"
      - "scripts/render-control-station-start.sh"
      - "scripts/ppu-bootstrap-service.py"
      - "render.yaml"
      - "software/python/plasma_manager/bootstrap.py"
      - "software/python/plasma_manager/bootstrap_server.py"
      - "software/python/plasma_manager/verified_bootstrap.py"
      - "software/python/tests/test_z2like_demo_active_job_disable_live_contract.py"
      - "software/python/tests/test_z2like_demo_qemu_control_plane_contract.py"
      - "software/web/app/api/manager/bootstrap-bff.ts"
      - "software/web/app/api/manager/maintenance-capability.mjs"
      - "software/web/app/api/manager/registry/**"
      - "software/web/app/engineering/ppu-runtime-deployment.tsx"
      - "handover/H021-z2like-demo-browser-runtime-deployment-plan-2026-09-14.md"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  OPENOCD_ARMV7_CACHE_SCHEMA: "v1"
  OPENOCD_ARMV7_CACHE_DIR: "../.plasma-cache/openocd-armv7l-cached"

concurrency:
  group: z2like-demo-browser-runtime-live-acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate live acceptance source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/z2like-demo-browser-live-acceptance.py \
            scripts/z2like-demo-qemu-control-plane.py \
            scripts/z2like-demo-qemu-build-kit.py \
            scripts/z2like-demo-qemu-kit.py
          python3 scripts/z2like-demo-browser-live-acceptance.py --help >/dev/null
          python3 scripts/z2like-demo-qemu-control-plane.py --help >/dev/null
          python3 software/python/tests/test_z2like_demo_qemu_control_plane_contract.py

  live-swpc-render-qemu:
    needs: contract
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'physicslu/plasma' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, plasma-integration]
    timeout-minutes: 35
    steps:
      - name: Assert trusted post-deployment execution identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "physicslu/plasma"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$GITHUB_SHA"
          test "$(id -u)" -ne 0

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Reconcile exact-commit QEMU control plane
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/z2like-demo-qemu-control-plane.py \
            --expected-commit "$GITHUB_SHA"

      - name: Reconcile exact-commit SWPC-local maintenance Manager
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/z2like-demo-qemu.py \
            --ppu-ip 172.30.77.2 \
            --alias z2like-qemu \
            configure-control-station

      - name: Preflight canonical SWPC/QEMU target
        shell: bash
        run: |
          set -euo pipefail
          if ! docker inspect plasma-z2like-demo-qemu >/dev/null; then
            echo "::error::QEMU target container plasma-z2like-demo-qemu is unavailable"
            exit 1
          fi
          if ! curl --noproxy '*' --fail --silent --show-error --max-time 5 \
            http://127.0.0.1:18082/__plasma/bootstrap/v1/status >/dev/null; then
            echo "::error::SWPC managed Bootstrap status probe failed at 127.0.0.1:18082. Run ./scripts/plasmactl update z2like-demo as an operator before rerunning this gate."
            exit 1
          fi
          if ! curl -4 --http1.1 --fail --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 70 \
            --connect-timeout 5 --max-time 20 \
            https://z2like-demo.open4th.com/deployment.json >/dev/null; then
            echo "::error::Public z2like-demo deployment identity probe failed"
            exit 1
          fi

      - name: Set up repository validation dependencies
        shell: bash
        run: bash scripts/codex-cloud-setup.sh

      - name: Restore qualified ARMv7 OpenOCD build cache
        id: openocd-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.OPENOCD_ARMV7_CACHE_DIR }}
          key: >-
            qemu-openocd-${{ env.OPENOCD_ARMV7_CACHE_SCHEMA }}-${{ runner.os }}-armv7-ubuntu22.04-
            ${{ hashFiles('release/openocd.json', 'scripts/build-openocd-runtime.sh', 'scripts/openocd-runtime.py') }}

      - name: Require and verify qualified ARMv7 OpenOCD cache
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.openocd-cache.outputs.cache-hit }}" != "true" ]; then
            echo "::error::Qualified ARMv7 OpenOCD cache is missing. Let the main z2like-demo QEMU ARMv7 acceptance populate it before running Browser live qualification."
            exit 1
          fi
          out="$OPENOCD_ARMV7_CACHE_DIR"
          runtime_id="$(python3 -c 'import json; print(json.load(open("release/openocd.json"))["runtime_id"])')"
          artifact="$out/plasma-openocd-$runtime_id-linux-armv7l.tar.gz"
          test -f "$artifact"
          test -f "$artifact.sha256"
          python3 scripts/openocd-runtime.py verify "$artifact" --sidecar "$artifact.sha256"             > "$RUNNER_TEMP/browser-live-openocd-cache-verified.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path("release/openocd.json").read_text())
          evidence = json.loads((Path(os.environ["RUNNER_TEMP"]) / "browser-live-openocd-cache-verified.json").read_text())
          assert evidence["result"] == "PASS"
          assert evidence["architecture"] == "armv7l"
          assert evidence["runtime_id"] == release["runtime_id"]
          assert evidence["source_commit"] == release["source_commit"]
          assert evidence["openocd_version"] == release["version"]
          assert evidence["hardware_runtime_ready"] is False
          print("Browser live ARMv7 OpenOCD cache verification PASS")
          PY
          echo "Browser live OpenOCD ARMv7 cache: HIT (qualified artifact reused)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build canonical ARMv7 Z2 PS kit
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/z2like-demo-browser-live-kit"
          rm -rf "$build_root"
          build_json="$(
            PLASMA_Z2LIKE_DEMO_BUILD_PYTHON="$PWD/software/python/.venv/bin/python" \
            PLASMA_Z2LIKE_DEMO_OPENOCD_ARTIFACT_DIR="$OPENOCD_ARMV7_CACHE_DIR" \
              python3 scripts/z2like-demo-qemu-build-kit.py --output-dir "$build_root"
          )"
          LIVE_KIT="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["kit"])' <<<"$build_json")"
          LIVE_SIDECAR="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sidecar"])' <<<"$build_json")"
          test -f "$LIVE_KIT"
          test -f "$LIVE_SIDECAR"
          printf 'PLASMA_LIVE_KIT=%s\n' "$LIVE_KIT" >> "$GITHUB_ENV"
          printf 'PLASMA_LIVE_SIDECAR=%s\n' "$LIVE_SIDECAR" >> "$GITHUB_ENV"

      - name: Run Browser -> Render -> SWPC/QEMU live acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/z2like-demo-browser-live"
          software/python/.venv/bin/python scripts/z2like-demo-browser-live-acceptance.py \
            --kit "$PLASMA_LIVE_KIT" \
            --sidecar "$PLASMA_LIVE_SIDECAR" \
            --expected-commit "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/z2like-demo-browser-live/report.json"

      - name: Upload live acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: z2like-demo-browser-runtime-live-${{ github.sha }}
          path: ${{ runner.temp }}/z2like-demo-browser-live/report.json
          if-no-files-found: warn
          retention-days: 14
