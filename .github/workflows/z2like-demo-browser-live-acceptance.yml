name: z2like-demo Browser Runtime live acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/z2like-demo-browser-live-acceptance.yml"
      - "scripts/z2like-demo-browser-live-acceptance.py"
      - "handover/H021-z2like-demo-browser-runtime-deployment-plan-2026-09-14.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/z2like-demo-browser-live-acceptance.yml"
      - "scripts/z2like-demo-browser-live-acceptance.py"
      - "scripts/plasmactl-z2like-demo-managed-ingress"
      - "scripts/render-control-station-start.sh"
      - "scripts/ppu-bootstrap-service.py"
      - "render.yaml"
      - "software/python/plasma_manager/bootstrap.py"
      - "software/python/plasma_manager/bootstrap_server.py"
      - "software/python/plasma_manager/verified_bootstrap.py"
      - "software/web/app/api/manager/bootstrap-bff.ts"
      - "software/web/app/api/manager/maintenance-capability.mjs"
      - "software/web/app/api/manager/registry/route.ts"
      - "software/web/app/api/manager/registry/[...path]/route.ts"
      - "software/web/app/engineering/ppu-runtime-deployment.tsx"
      - "handover/H021-z2like-demo-browser-runtime-deployment-plan-2026-09-14.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z2like-demo-browser-runtime-live-acceptance
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate live acceptance source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/z2like-demo-browser-live-acceptance.py
          python3 scripts/z2like-demo-browser-live-acceptance.py --help >/dev/null

  live-swpc-render-qemu:
    needs: contract
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'physicslu/plasma' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, plasma-integration]
    timeout-minutes: 35
    steps:
      - name: Assert trusted post-merge execution identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "physicslu/plasma"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$GITHUB_SHA"
          test "$(id -u)" -ne 0

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Preflight canonical SWPC/QEMU target
        shell: bash
        run: |
          set -euo pipefail
          docker inspect plasma-z2like-demo-qemu >/dev/null
          curl --noproxy '*' --fail --silent --show-error --max-time 5 \
            http://127.0.0.1:18082/__plasma/bootstrap/v1/status >/dev/null
          curl --fail --silent --show-error --max-time 15 \
            https://z2like-demo.open4th.com/deployment.json >/dev/null

      - name: Set up repository validation dependencies
        shell: bash
        run: bash scripts/codex-cloud-setup.sh

      - name: Build canonical ARMv7 Z2 PS kit
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/z2like-demo-browser-live-kit"
          rm -rf "$build_root"
          build_json="$(
            PLASMA_Z2LIKE_DEMO_BUILD_PYTHON="$PWD/software/python/.venv/bin/python" \
              python3 scripts/z2like-demo-qemu-build-kit.py --output-dir "$build_root"
          )"
          LIVE_KIT="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["kit"])' <<<"$build_json")"
          LIVE_SIDECAR="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["sidecar"])' <<<"$build_json")"
          test -f "$LIVE_KIT"
          test -f "$LIVE_SIDECAR"
          printf 'PLASMA_LIVE_KIT=%s\n' "$LIVE_KIT" >> "$GITHUB_ENV"
          printf 'PLASMA_LIVE_SIDECAR=%s\n' "$LIVE_SIDECAR" >> "$GITHUB_ENV"

      - name: Run Browser -> Render -> SWPC/QEMU live acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/z2like-demo-browser-live"
          software/python/.venv/bin/python scripts/z2like-demo-browser-live-acceptance.py \
            --kit "$PLASMA_LIVE_KIT" \
            --sidecar "$PLASMA_LIVE_SIDECAR" \
            --expected-commit "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/z2like-demo-browser-live/report.json"

      - name: Upload live acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: z2like-demo-browser-runtime-live-${{ github.sha }}
          path: ${{ runner.temp }}/z2like-demo-browser-live/report.json
          if-no-files-found: warn
          retention-days: 14
