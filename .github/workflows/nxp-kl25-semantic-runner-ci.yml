name: NXP KL25 semantic runner CI

on:
  push:
    branches:
      - main
    paths:
      - "data/ic-support/benchmarks/nxp-kl25/**"
      - "scripts/ic-support-kl25-live.sh"
      - ".github/workflows/nxp-kl25-semantic-runner-ci.yml"
  pull_request:
    paths:
      - "data/ic-support/benchmarks/nxp-kl25/**"
      - "scripts/ic-support-kl25-live.sh"
      - ".github/workflows/nxp-kl25-semantic-runner-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-mock-semantic-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile semantic runner and live qualification modules
        run: |
          python -m py_compile \
            data/ic-support/benchmarks/nxp-kl25/semantic_extraction.py \
            data/ic-support/benchmarks/nxp-kl25/semantic_context.py \
            data/ic-support/benchmarks/nxp-kl25/semantic_runner.py \
            data/ic-support/benchmarks/nxp-kl25/ollama_transport.py \
            data/ic-support/benchmarks/nxp-kl25/run_ollama_semantic.py \
            data/ic-support/benchmarks/nxp-kl25/audit_semantic_context.py \
            data/ic-support/benchmarks/nxp-kl25/ollama_live_runtime.py \
            data/ic-support/benchmarks/nxp-kl25/qualify_semantic_run.py \
            data/ic-support/benchmarks/nxp-kl25/run_live_model_qualification.py \
            data/ic-support/benchmarks/nxp-kl25/test_output_contract_hardening.py \
            data/ic-support/benchmarks/nxp-kl25/test_context_compaction.py \
            data/ic-support/benchmarks/nxp-kl25/test_semantic_coverage_gate53.py \
            data/ic-support/benchmarks/nxp-kl25/test_citation_completeness_gate54.py
      - name: Validate KL25 operator helper syntax
        run: |
          bash -n scripts/ic-support-kl25-live.sh
          bash scripts/ic-support-kl25-live.sh help >/dev/null
      - name: Revalidate pre-AI boundary
        run: python data/ic-support/benchmarks/nxp-kl25/test_pre_ai_ci.py
      - name: Validate semantic runner failure matrix
        run: python data/ic-support/benchmarks/nxp-kl25/test_semantic_runner.py
      - name: Validate structured output hardening regressions
        run: python data/ic-support/benchmarks/nxp-kl25/test_output_contract_hardening.py
      - name: Validate deterministic context compaction and 64K envelope wiring
        run: python data/ic-support/benchmarks/nxp-kl25/test_context_compaction.py
      - name: Validate Gate 5.3 semantic coverage screening robustness
        run: python data/ic-support/benchmarks/nxp-kl25/test_semantic_coverage_gate53.py
      - name: Validate Gate 5.4 atomic facts and citation completeness policy
        run: python data/ic-support/benchmarks/nxp-kl25/test_citation_completeness_gate54.py
      - name: Validate real Ollama transport code without model weights
        run: python data/ic-support/benchmarks/nxp-kl25/test_ollama_transport.py
      - name: Validate Gate 3 workspace through executable Ollama semantic path
        run: python data/ic-support/benchmarks/nxp-kl25/test_ollama_semantic_run.py
      - name: Validate Ollama live-runtime identity lock without model weights
        run: python data/ic-support/benchmarks/nxp-kl25/test_ollama_live_runtime.py
      - name: Validate live-model qualification integrity and screening matrix
        run: python data/ic-support/benchmarks/nxp-kl25/test_live_model_qualification.py
      - name: Validate frozen live-model execution wiring without model weights
        run: python data/ic-support/benchmarks/nxp-kl25/test_run_live_model_qualification.py
      - name: Validate Gate 5.5 bounded extraction without network or model weights
        run: python data/ic-support/benchmarks/nxp-kl25/test_bounded_extraction.py
