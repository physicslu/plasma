name: NXP bulk ICPN research coverage contract v1

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/nxp-bulk-source-registry-v1.json'
      - 'data/device-catalog/research/nxp_bulk_coverage_v1.py'
      - 'data/device-catalog/research/test_nxp_bulk_coverage_v1.py'
      - 'data/device-catalog/research/test_nxp_official_bounded_snapshot_v1.py'
      - 'data/device-catalog/research/nxp-official-bounded-snapshot-2026-10-13-v1.json'
      - 'data/device-catalog/research/NXP_BULK_ACQUISITION_V1.md'
      - '.github/workflows/device-catalog-nxp-bulk-coverage-v1.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/nxp-bulk-source-registry-v1.json'
      - 'data/device-catalog/research/nxp_bulk_coverage_v1.py'
      - 'data/device-catalog/research/test_nxp_bulk_coverage_v1.py'
      - 'data/device-catalog/research/test_nxp_official_bounded_snapshot_v1.py'
      - 'data/device-catalog/research/nxp-official-bounded-snapshot-2026-10-13-v1.json'
      - 'data/device-catalog/research/NXP_BULK_ACQUISITION_V1.md'
      - '.github/workflows/device-catalog-nxp-bulk-coverage-v1.yml'

permissions:
  contents: read

jobs:
  research-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bounded research-only NXP population policy
        run: |
          python -m py_compile data/device-catalog/research/nxp_bulk_coverage_v1.py data/device-catalog/research/test_nxp_bulk_coverage_v1.py
          python -m unittest discover -s data/device-catalog/research -p 'test_nxp_bulk_coverage_v1.py' -v
          python -m unittest discover -s data/device-catalog/research -p 'test_nxp_official_bounded_snapshot_v1.py' -v
          python data/device-catalog/research/nxp_bulk_coverage_v1.py > /tmp/nxp-bulk-summary.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/nxp-bulk-summary.json'))
          assert x['locked_kl25_pilot_exact']==12
          assert x['complete_global_active_denominator'] is None
          assert x['global_active_identity_coverage'] is None
          assert x['claims']['production_write_authorized'] is False
          print('Research-only NXP portfolio baseline PASS; no ungrounded vendor coverage claims')
          PY
