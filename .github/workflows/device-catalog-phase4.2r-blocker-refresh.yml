name: Device catalog Phase 4.2R blocker refresh

on:
  pull_request:
    branches:
      - main
    paths:
      - "data/device-catalog/**"
      - ".github/workflows/device-catalog-phase4.2r-blocker-refresh.yml"

permissions:
  contents: read

jobs:
  refresh-stm32f4-gap-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate fresh STM32F4 coverage-gap inventory
        run: |
          python data/device-catalog/research/stm32f4_coverage_gap_inventory.py --output /tmp/stm32f4-gap.json
          cat /tmp/stm32f4-gap.json
      - name: Check locked Phase 4.2R prestate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'data/device-catalog/research')
          from stm32f4_coverage_gap_inventory import build_inventory
          scope=json.loads(Path('data/device-catalog/research/stm32f4-phase4.2r-blocker-prioritization-scope.json').read_text())
          inv=build_inventory(
              catalog_path=Path('data/device-catalog/research/openocd-parts-canonical.csv'),
              canonical_path=Path('data/device-catalog/research/stm32f4-commercial-icpn.csv'),
          )
          locked=scope['locked_prestate']
          actual={
              'stm32f4_exact_icpns': inv['production']['exact_icpn_rows'],
              'stm32f4_production_base_devices': inv['production']['base_device_count'],
              'stm32f4_openocd_ordering_pattern_base_devices': inv['openocd_ordering_pattern_base_device_count'],
              'stm32f4_gap_base_devices': inv['gap']['base_device_count'],
          }
          for key,value in actual.items():
              assert value == locked[key], (key, value, locked[key])
          print(json.dumps({
              'locked_prestate_match': True,
              'policy_ready_count': inv['gap']['policy_ready_count'],
              'policy_blocked_count': inv['gap']['policy_blocked_count'],
              'policy_ready': inv['gap']['policy_ready'],
              'policy_blocked': inv['gap']['policy_blocked'],
          }, indent=2, sort_keys=True))
          PY
