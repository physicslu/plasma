name: Device catalog Phase 4.2I STM32F405O/415OG lifecycle

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Phase 4.2I retained evidence and post-admission replay
        run: |
          python data/device-catalog/research/test_stm32f4_phase4_2i_f405o_f415og_post_admission.py
