name: OpenOCD Tier A residual classification v6.8

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/classify_openocd_tier_a_residual_v68.py'
      - 'data/device-catalog/research/test_classify_openocd_tier_a_residual_v68.py'
      - 'data/device-catalog/research/OPENOCD_TIER_A_RESIDUAL_CLASSIFICATION_V68.md'
      - '.github/workflows/device-catalog-openocd-tier-a-residual-v68.yml'

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify residual Tier A route gaps
        run: |
          python data/device-catalog/research/classify_openocd_tier_a_residual_v68.py \
            --classified /tmp/openocd-tier-a-residual-v68.csv \
            --summary /tmp/openocd-tier-a-residual-v68.json
          python -m unittest discover -s data/device-catalog/research \
            -p test_classify_openocd_tier_a_residual_v68.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: openocd-tier-a-residual-v68
          path: |
            /tmp/openocd-tier-a-residual-v68.csv
            /tmp/openocd-tier-a-residual-v68.json
          if-no-files-found: error
          retention-days: 30
