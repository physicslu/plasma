name: STM32F4 Phase 3.3 scaleout batch2 materialize

on:
  pull_request:
    paths:
      - "data/device-catalog/research/stm32f4-phase3.3-scaleout-batch2-*"
      - "data/device-catalog/research/evidence/stm32f4-phase3.3-scaleout-batch2-live-2026-08-30/**"
      - ".github/workflows/stm32f4-phase3.3-scaleout-batch2-materialize.yml"

permissions:
  contents: read

jobs:
  materialize-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build clean read-only plan
        run: |
          mkdir -p phase3.3-batch2-materialize
          python data/device-catalog/research/stm32f4_admission.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase3.3-scaleout-batch2-live-2026-08-30 \
            --baseline data/device-catalog/research/stm32f4-phase3.3-scaleout-batch2-baseline.json \
            --catalog data/device-catalog/research/openocd-parts-canonical.csv \
            --canonical data/device-catalog/research/stm32f4-commercial-icpn.csv \
            --admit-base STM32F407ZE \
            --admit-base STM32F415VG \
            --admit-base STM32F427VG \
            --admit-base STM32F427ZG \
            --admit-base STM32F437VG \
            --output phase3.3-batch2-materialize/admission-plan.json
      - name: Materialize canonical and prove idempotency
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          import sys
          from pathlib import Path

          research = Path('data/device-catalog/research')
          sys.path.insert(0, str(research.resolve()))
          from device_catalog_admission_framework import write_canonical_dataset

          out = Path('phase3.3-batch2-materialize')
          plan_path = out / 'admission-plan.json'
          canonical_src = research / 'stm32f4-commercial-icpn.csv'
          canonical_out = out / 'stm32f4-commercial-icpn.csv'
          shutil.copyfile(canonical_src, canonical_out)
          plan = json.loads(plan_path.read_text(encoding='utf-8'))

          assert plan['candidate_count'] == 15
          assert plan['decision_counts'] == {
              'admit': 15,
              'already_present': 0,
              'manual_review_required': 0,
              'reject': 0,
          }
          assert plan['conflicts'] == 0
          assert plan['issues'] == []
          assert plan['canonical_rows_before'] == 34

          first = write_canonical_dataset(plan=plan, canonical_path=canonical_out)
          assert first['status'] == 'written'
          assert first['rows_before'] == 34
          assert first['rows_after'] == 49
          assert len(first['added']) == 15

          second = write_canonical_dataset(plan=plan, canonical_path=canonical_out)
          assert second == {'status': 'no_op', 'rows_before': 49, 'rows_after': 49, 'added': []}

          audit = {
              'schema_version': 1,
              'phase': '3.3',
              'batch_id': 'stm32f4-phase3.3-scaleout-batch2-2026-08-30',
              'admission_base_devices': ['STM32F407ZE', 'STM32F415VG', 'STM32F427VG', 'STM32F427ZG', 'STM32F437VG'],
              'candidate_count': 15,
              'decision_counts': plan['decision_counts'],
              'canonical_rows_before': 34,
              'canonical_rows_after': 49,
              'icpns': sorted(first['added']),
              'executed_git_sha': plan['source_provenance']['executed_git_sha'],
              'canonical_input_sha256': plan['inputs']['canonical_input_sha256'],
              'mapping_catalog_sha256': plan['inputs']['mapping_catalog_sha256'],
              'baseline_sha256': plan['inputs']['baseline_sha256'],
              'evidence_manifest_sha256': plan['source_provenance']['evidence_manifest_sha256'],
              'admission_plan_sha256': hashlib.sha256(plan_path.read_bytes()).hexdigest(),
              'canonical_sha256_after': hashlib.sha256(canonical_out.read_bytes()).hexdigest(),
          }
          (out / 'admission-audit.json').write_text(json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'first': first, 'second': second, 'audit': audit}, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stm32f4-phase3.3-scaleout-batch2-materialized
          path: phase3.3-batch2-materialize/
          if-no-files-found: error
