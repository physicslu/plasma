name: ST M1 selector probe v1

on:
  push:
    branches:
      - agent/st-device-basic-remaining-m1
    paths:
      - 'data/device-catalog/research/st_m1_selector_probe_v1.py'
      - '.github/workflows/st-m1-selector-probe-v1.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official ST Product Selector pages
        run: python data/device-catalog/research/st_m1_selector_probe_v1.py
