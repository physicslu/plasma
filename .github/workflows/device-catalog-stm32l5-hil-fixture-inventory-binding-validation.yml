name: STM32L5 HIL fixture inventory binding validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32l5-hil-fixture-inventory.json'
      - 'data/device-catalog/research/stm32l5_hil_fixture_inventory_binding.py'
      - 'data/device-catalog/research/validate_stm32l5_hil_fixture_inventory_binding_gate.py'
      - 'data/device-catalog/research/device-catalog-stm32l5-hil-fixture-inventory-binding-gate.md'
      - 'data/device-catalog/research/stm32l5-hil-observer-debug-readiness.json'
      - 'data/device-catalog/research/stm32l5_hil_observer_debug_readiness.py'
      - 'data/device-catalog/research/stm32l5-commercial-identity-discovery.csv'
      - '.github/workflows/device-catalog-stm32l5-hil-fixture-inventory-binding-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/stm32l5-hil-fixture-inventory.json'
      - 'data/device-catalog/research/stm32l5_hil_fixture_inventory_binding.py'
      - 'data/device-catalog/research/validate_stm32l5_hil_fixture_inventory_binding_gate.py'
      - 'data/device-catalog/research/device-catalog-stm32l5-hil-fixture-inventory-binding-gate.md'
      - 'data/device-catalog/research/stm32l5-hil-observer-debug-readiness.json'
      - 'data/device-catalog/research/stm32l5_hil_observer_debug_readiness.py'
      - 'data/device-catalog/research/stm32l5-commercial-identity-discovery.csv'
      - '.github/workflows/device-catalog-stm32l5-hil-fixture-inventory-binding-validation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate HIL fixture inventory binding gate
        run: python data/device-catalog/research/validate_stm32l5_hil_fixture_inventory_binding_gate.py
      - name: Enforce zero Production writes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- data/device-catalog/production/)"
          test -z "$changed" || { echo "Production writes are forbidden in STM32L5 fixture inventory binding:"; echo "$changed"; exit 1; }
