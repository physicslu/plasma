name: Device catalog Phase 4.2T STM32F410TB admission proposal
on:
  push:
    branches: [agent/device-catalog-phase4.2t-f410tb-admission]
    paths: [".github/workflows/device-catalog-phase42t-proposal.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  propose:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2t-f410tb-admission}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build proposal
        run: |
          mkdir -p /tmp/phase42t
          PYTHONPATH=data/device-catalog/research python data/device-catalog/research/stm32f4_admission.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2t-f410tb-admission-live-2026-09-03 --baseline data/device-catalog/research/stm32f4-phase4.2t-f410tb-admission-baseline.json --admit-base STM32F410TB --output /tmp/phase42t/admission-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/phase42t/admission-plan.json').read_text())
          expected={'admit':3,'already_present':0,'manual_review_required':0,'reject':0}
          if p['candidate_count'] != 3 or p['decision_counts'] != expected or p['conflicts'] != 0 or p['canonical_rows_before'] != 304:
              raise SystemExit('unclean Phase 4.2T plan')
          if {x['icpn'] for x in p['candidates']} != {'STM32F410TBY3TR','STM32F410TBY6TR','STM32F410TBY7TR'}:
              raise SystemExit('unexpected Phase 4.2T candidate set')
          PY
          cd /tmp/phase42t && sha256sum admission-plan.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: {name: phase42t-admission-proposal, path: /tmp/phase42t, if-no-files-found: error, retention-days: 30}
