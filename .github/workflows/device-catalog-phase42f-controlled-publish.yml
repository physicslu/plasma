name: Device catalog Phase 4.2F F412RE/RG controlled publish

on:
  push:
    branches:
      - agent/device-catalog-phase4.2f-f412re-rg-admission

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-phase4.2f-f412re-rg-admission
      - uses: actions/download-artifact@v4
        with:
          name: phase42f-stm32f4-f412re-rg-admission-proposal
          path: /tmp/phase42f-proposal
          github-token: ${{ github.token }}
          repository: physicslu/plasma
          run-id: 33597158933
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify proposal and publish atomically
        run: |
          set -euo pipefail
          echo 'f589d55036448ba53c8cf3222d5e528f5acd71b8ff494d8f45e0f684046b266c  /tmp/phase42f-proposal/plan.json' | sha256sum -c -
          echo '22419b078f1c6436f0aa6dd3b410791170a1976be59a03a814469acc54690f09  /tmp/phase42f-proposal/proposed.csv' | sha256sum -c -
          echo 'c868a783eeaa818a4714f264e5453338195d469e8594aefb1633eb56b74ffa7c  /tmp/phase42f-proposal/write-result.json' | sha256sum -c -
          python - <<'PY'
          import csv, hashlib, json, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'data/device-catalog/research')
          from device_catalog_admission_framework import write_canonical_dataset

          canonical = Path('data/device-catalog/research/stm32f4-commercial-icpn.csv')
          manifest_path = Path('data/device-catalog/production/icpn-v1-manifest.json')
          audit_path = Path('data/device-catalog/research/stm32f4-phase4.2f-f412re-rg-admission-audit.json')
          plan_path = Path('/tmp/phase42f-proposal/plan.json')
          proposed = Path('/tmp/phase42f-proposal/proposed.csv')

          pre_sha = hashlib.sha256(canonical.read_bytes()).hexdigest()
          assert pre_sha == 'c4e3889392383cb7861bb29c759074c5089a47ae518a1a8cb5330af97335c7f4', pre_sha
          with canonical.open(newline='', encoding='utf-8') as f:
              assert sum(1 for _ in csv.DictReader(f)) == 199
          manifest = json.loads(manifest_path.read_text())
          f4 = next(x for x in manifest['sources'] if x['family'] == 'STM32F4')
          assert f4['row_count'] == 199
          assert f4['sha256'] == pre_sha
          assert f4['git_blob_sha'] == 'c77df45c0cd8c03c71090df04176da5371d57124'

          plan = json.loads(plan_path.read_text())
          assert plan['candidate_count'] == 9
          assert plan['decision_counts'] == {'admit': 9, 'already_present': 0, 'manual_review_required': 0, 'reject': 0}
          assert plan['conflicts'] == 0 and plan['issues'] == []
          result = write_canonical_dataset(plan=plan, canonical_path=canonical)
          assert result['status'] == 'written'
          assert result['rows_before'] == 199 and result['rows_after'] == 208 and len(result['added']) == 9
          assert canonical.read_bytes() == proposed.read_bytes()
          post_sha = hashlib.sha256(canonical.read_bytes()).hexdigest()
          assert post_sha == '22419b078f1c6436f0aa6dd3b410791170a1976be59a03a814469acc54690f09'
          post_blob = subprocess.check_output(['git', 'hash-object', str(canonical)], text=True).strip()

          f4['row_count'] = 208
          f4['sha256'] = post_sha
          f4['git_blob_sha'] = post_blob
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          audit = {
              'schema_version': 1,
              'transaction': 'stm32f4-phase4.2f-f412re-rg-admission-2026-09-02',
              'retained_evidence_id': 'stm32f4-phase4.2f-f412re-rg-admission-2026-09-02-retained-20260902T045042Z-501ca11',
              'retained_run_id': '33592306507',
              'retained_artifact_id': '9832182808',
              'retained_artifact_sha256': 'b21c32e754c7b81bd4f2150c53e88a80ba265ca148df5bf2a7a87f3adda796c7',
              'proposal_run_id': '33597158933',
              'proposal_artifact_id': '9833785496',
              'proposal_artifact_sha256': 'e385fdb3c4132ad9fbcc9c05aeba61a0e5e3f1e0ae34dbc98f5466654d573051',
              'proposal_plan_sha256': 'f589d55036448ba53c8cf3222d5e528f5acd71b8ff494d8f45e0f684046b266c',
              'pre_rows': 199,
              'post_rows': 208,
              'new_exact_icpns': sorted(result['added']),
              'final_csv_sha256': post_sha,
              'final_csv_git_blob': post_blob,
              'canonical_dataset_written': True,
              'algorithm_equivalence_claimed': False,
              'physical_ppu_validation_claimed': False,
          }
          audit_path.write_text(json.dumps(audit, indent=2, sort_keys=True) + '\n')
          print(json.dumps(audit, indent=2, sort_keys=True))
          PY
          git diff --check -- data/device-catalog/production/icpn-v1-manifest.json data/device-catalog/research/stm32f4-commercial-icpn.csv data/device-catalog/research/stm32f4-phase4.2f-f412re-rg-admission-audit.json
      - name: Commit controlled Production publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/stm32f4-commercial-icpn.csv \
                  data/device-catalog/production/icpn-v1-manifest.json \
                  data/device-catalog/research/stm32f4-phase4.2f-f412re-rg-admission-audit.json
          git commit -m 'device-catalog: admit STM32F412RE/RG exact ICPNs'
          git push origin HEAD:agent/device-catalog-phase4.2f-f412re-rg-admission
