name: STM32H7 Production catalog publication validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32h7-classic-*'
      - 'data/device-catalog/research/publish_stm32h7_classic_catalog.py'
      - 'data/device-catalog/research/validate_stm32h7_classic_production_publication.py'
      - 'docs/architecture/icpn-catalog-admission-policy.json'
      - 'scripts/ci/device-catalog-production-invariants.py'
      - '.github/workflows/device-catalog-stm32h7-production-publication-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/stm32h7-classic-*'
      - 'data/device-catalog/research/publish_stm32h7_classic_catalog.py'
      - 'data/device-catalog/research/validate_stm32h7_classic_production_publication.py'
      - 'docs/architecture/icpn-catalog-admission-policy.json'
      - 'scripts/ci/device-catalog-production-invariants.py'
      - '.github/workflows/device-catalog-stm32h7-production-publication-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate historical 191-row subset and current STM32H7 v5.9 publication
        run: python data/device-catalog/research/validate_stm32h7_layer1_publication_v59.py
      - name: Validate Production manifest invariants
        run: python scripts/ci/device-catalog-production-invariants.py
      - name: Load Production catalog through runtime implementation
        run: PYTHONPATH=software/python python -m plasma_web.device_catalog --json
