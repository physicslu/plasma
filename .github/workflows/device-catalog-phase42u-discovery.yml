name: Device catalog Phase 4.2U STM32F413 H discovery
on:
  push:
    branches: [agent/device-catalog-phase4.2u-h-admission-batch1]
    paths: [".github/workflows/device-catalog-phase42u-discovery.yml", "data/device-catalog/research/stm32f4-phase4.2u-h-admission-batch1-manifest.json"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  discover:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright==1.62.0 && python -m playwright install --with-deps chromium
      - run: |
          mkdir -p /tmp/phase42u
          xvfb-run -a python data/device-catalog/research/run_stm32f4_browser_pilot.py \
            --manifest data/device-catalog/research/stm32f4-phase4.2u-h-admission-batch1-manifest.json \
            --catalog data/device-catalog/research/openocd-parts-canonical.csv \
            --output /tmp/phase42u/pilot-summary.json \
            --scope pilot --headed --timeout 45 --delay 2
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/phase42u/pilot-summary.json').read_text())
          expected = {'STM32F479ZG', 'STM32F413CH', 'STM32F413RH', 'STM32F413VH', 'STM32F413ZH'}
          observed = {item['base_device'] for item in summary['results']}
          if summary['acquisition_failure'] or observed != expected:
              raise SystemExit(f'Phase 4.2U discovery failed: expected={sorted(expected)} observed={sorted(observed)} failures={summary["acquisition_failure"]}')
          PY
          cd /tmp/phase42u && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: phase42u-h-batch1-discovery
          path: /tmp/phase42u
          if-no-files-found: error
          retention-days: 30
