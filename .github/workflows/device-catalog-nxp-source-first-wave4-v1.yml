name: NXP pinned OpenOCD source-first LPC Wave 4
on:
  pull_request:
    paths:
      - 'data/device-catalog/research/nxp-openocd-source-first-wave4-v1.json'
      - 'data/device-catalog/research/nxp_validate_source_first_wave4_v1.py'
      - 'data/device-catalog/research/test_nxp_source_first_wave4_v1.py'
      - 'data/device-catalog/research/NXP_OPENOCD_SOURCE_FIRST_WAVE4_V1.md'
      - 'data/device-catalog/research/nxp-openocd-reverse-target-lock-v1.json'
      - 'data/device-catalog/research/nxp-openocd-exact-active-discovery-v2.json'
      - 'data/device-catalog/research/nxp-openocd-source-first-wave3-v1.json'
      - 'data/device-catalog/research/nxp-501-adr0002-core-transport-qualification-v10.csv'
      - 'release/openocd.json'
      - '.github/workflows/device-catalog-nxp-source-first-wave4-v1.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/nxp-openocd-source-first-wave4-v1.json'
      - 'data/device-catalog/research/nxp_validate_source_first_wave4_v1.py'
      - 'data/device-catalog/research/test_nxp_source_first_wave4_v1.py'
      - '.github/workflows/device-catalog-nxp-source-first-wave4-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nxp-openocd-source-first-wave4:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate new 20 exact NXP materials against pinned upstream source
        run: python data/device-catalog/research/nxp_validate_source_first_wave4_v1.py
      - name: Test source authority, Active/NLM, Part ID and admission negative gates
        run: python data/device-catalog/research/test_nxp_source_first_wave4_v1.py -v
      - name: Regression test previous bounded NXP OpenOCD wave
        run: python data/device-catalog/research/test_nxp_source_first_wave3_v1.py -v
