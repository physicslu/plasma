name: Web tests

on:
  push:
    paths:
      - "software/web/**"
      - "scripts/plasmactl"
      - ".github/workflows/web-tests.yml"
  pull_request:
    paths:
      - "software/web/**"
      - "scripts/plasmactl"
      - ".github/workflows/web-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: software/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: |
            software/web/package-lock.json
            software/web/e2e/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build and source/SSR tests
        run: npm test
      - name: Install E2E dependencies
        run: npm --prefix e2e ci
      - name: Install Chromium
        timeout-minutes: 10
        run: cd e2e && npx playwright install --with-deps chromium
      - name: Playwright E2E
        timeout-minutes: 10
        run: cd e2e && npm test
      - name: Upload visual regression diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diagnostics
          path: |
            software/web/e2e/test-results/
            software/web/e2e/tests/__snapshots__/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: software/web/e2e/playwright-report/
          retention-days: 14
