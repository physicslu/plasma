name: Web validation

on:
  push:
    paths:
      - "software/web/**"
      - "scripts/plasmactl"
      - ".github/workflows/web-tests.yml"
  pull_request:
    paths:
      - "software/web/**"
      - "scripts/plasmactl"
      - ".github/workflows/web-tests.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: software/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: software/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build and source/SSR tests
        run: npm test

  e2e:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: software/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: |
            software/web/package-lock.json
            software/web/e2e/package-lock.json
      - name: Install Web dependencies
        run: npm ci
      - name: Install E2E dependencies
        run: npm --prefix e2e ci
      - name: Install visual regression CJK font
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends fonts-wqy-zenhei
          fc-match -f '%{family}\n' 'sans-serif:lang=zh-tw' | head -n 1
      - name: Install Chromium
        timeout-minutes: 10
        run: cd e2e && npx playwright install chromium
      - name: Playwright E2E
        timeout-minutes: 10
        run: cd e2e && npm test
      - name: Upload visual regression diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diagnostics
          path: |
            software/web/e2e/test-results/
            software/web/e2e/tests/__snapshots__/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: software/web/e2e/playwright-report/
          retention-days: 14
