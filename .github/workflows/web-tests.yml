name: Web tests

on:
  push:
    paths:
      - "software/web/**"
      - "scripts/plasmactl"
      - ".github/workflows/web-tests.yml"
  pull_request:
    paths:
      - "software/web/**"
      - "scripts/plasmactl"
      - ".github/workflows/web-tests.yml"

permissions:
  contents: read

jobs:
  pr68-refresh-visual-baselines:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-rest-v1-firmware-compat'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: |
            software/web/package-lock.json
            software/web/e2e/package-lock.json
      - name: Install Web and Playwright dependencies
        run: |
          npm --prefix software/web ci
          npm --prefix software/web/e2e ci
      - name: Install deterministic visual environment
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends fonts-wqy-zenhei
          cd software/web/e2e && npx playwright install chromium
      - name: Refresh expected visual baselines
        working-directory: software/web/e2e
        run: npx playwright test tests/visual.spec.ts --update-snapshots
      - name: Commit refreshed baselines
        run: |
          if git diff --quiet -- software/web/e2e/tests/__snapshots__; then
            exit 0
          fi
          git config user.name "plasma-pr68-bot"
          git config user.email "plasma-pr68-bot@users.noreply.github.com"
          git add software/web/e2e/tests/__snapshots__
          git commit -m "Refresh visual baselines for Programming Asset UI"
          git push origin HEAD:${{ github.head_ref }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: software/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: |
            software/web/package-lock.json
            software/web/e2e/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build and source/SSR tests
        run: npm test
      - name: Install E2E dependencies
        run: npm --prefix e2e ci
      - name: Install visual regression CJK font
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends fonts-wqy-zenhei
          fc-match -f '%{family}\n' 'sans-serif:lang=zh-tw' | head -n 1
      - name: Install Chromium
        timeout-minutes: 10
        run: cd e2e && npx playwright install chromium
      - name: Playwright E2E
        timeout-minutes: 10
        run: cd e2e && npm test
      - name: Upload visual regression diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diagnostics
          path: |
            software/web/e2e/test-results/
            software/web/e2e/tests/__snapshots__/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: software/web/e2e/playwright-report/
          retention-days: 14
