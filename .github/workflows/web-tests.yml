name: Web tests

on:
  push:
    paths:
      - "software/web/**"
      - "scripts/plasmactl"
      - ".github/workflows/web-tests.yml"
  pull_request:
    paths:
      - "software/web/**"
      - "scripts/plasmactl"
      - ".github/workflows/web-tests.yml"

permissions:
  contents: write

jobs:
  pr68-contract-refactor:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/remove-rest-v1-firmware-compat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Migrate E2E mocks to REST v3 Programming Assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("software/web/e2e/tests")
          replacements = (
              ("firmware_scope", "programming_asset_scope"),
              ("firmware_cache_scope", "programming_asset_cache_scope"),
              ("firmware_sha256", "asset_sha256"),
              ("firmware_name", "asset_name"),
              ("firmware_size", "asset_size"),
              ("firmware_base64", "asset_base64"),
              ("programming_image_scope", "programming_asset_scope"),
              ("programming_image_cache_scope", "programming_asset_cache_scope"),
              ("api/programming-images", "api/programming-assets"),
              ("programming_image", "programming_asset"),
              ("image_sha256", "asset_sha256"),
              ("image_name", "asset_name"),
              ("image_size", "asset_size"),
              ("image_base64", "asset_base64"),
              ("Engineering Firmware file", "Engineering Programming Image Asset file"),
              ("選擇 Firmware 檔案", "選擇 Programming Image Asset 檔案"),
              ("previous firmware cache cleared", "previous Programming Asset cache cleared"),
              ("PPU Programming Image cache", "PPU Programming Asset cache"),
              ("programming-image-log-job", "programming-asset-log-job"),
          )
          for path in sorted(root.glob("*.ts")):
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              text = re.sub(r"\bfirmware\b", "imageAssetBytes", text)
              text = re.sub(r"\bFirmware\b", "Programming Image Asset", text)
              if text != original:
                  path.write_text(text, encoding="utf-8")

          offenders = []
          for path in sorted(root.glob("*.ts")):
              text = path.read_text(encoding="utf-8")
              if re.search(r"(?i)\bfirmware(?:\b|_)", text):
                  offenders.append(f"{path}: retired programming term")
              if "api/programming-images" in text or "programming_image_" in text:
                  offenders.append(f"{path}: retired REST v2 contract")
          if offenders:
              raise SystemExit("\n".join(offenders))
          PY
      - name: Commit branch-only E2E migration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "plasma-pr68-bot"
          git config user.email "plasma-pr68-bot@users.noreply.github.com"
          git add software/web/e2e/tests
          git commit -m "Migrate browser mocks to Programming Asset REST v3"
          git push origin HEAD:${{ github.head_ref }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: software/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: |
            software/web/package-lock.json
            software/web/e2e/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build and source/SSR tests
        run: npm test
      - name: Install E2E dependencies
        run: npm --prefix e2e ci
      - name: Install visual regression CJK font
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends fonts-wqy-zenhei
          fc-match -f '%{family}\n' 'sans-serif:lang=zh-tw' | head -n 1
      - name: Install Chromium
        timeout-minutes: 10
        run: cd e2e && npx playwright install chromium
      - name: Playwright E2E
        timeout-minutes: 10
        run: cd e2e && npm test
      - name: Upload visual regression diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diagnostics
          path: |
            software/web/e2e/test-results/
            software/web/e2e/tests/__snapshots__/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: software/web/e2e/playwright-report/
          retention-days: 14
