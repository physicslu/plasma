name: Device catalog Phase 4.2F STM32F412RE/RG lifecycle

on:
  push:
    branches:
      - main
    paths:
      - "data/device-catalog/**"
      - "software/python/plasma_web/device_catalog.py"
      - ".github/workflows/device-catalog-phase42f-f412re-rg-validation.yml"
  pull_request:
    paths:
      - "data/device-catalog/**"
      - "software/python/plasma_web/device_catalog.py"
      - ".github/workflows/device-catalog-phase42f-f412re-rg-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Phase 4.2F retained evidence and post-admission replay
        run: |
          python data/device-catalog/research/test_stm32f4_phase4_2f_f412re_rg_post_admission.py
