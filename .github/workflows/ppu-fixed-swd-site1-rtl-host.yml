name: PPU Fixed ABI SWD Site 1 RTL Slice Host Simulation
on:
  pull_request:
    paths:
      - 'pl/rtl/bus/fixed_fpga_swd_site_axi_lite.sv'
      - 'pl/verification/test_fixed_fpga_swd_site_rtl.py'
      - 'pl/verification/cocotb/test_fixed_fpga_swd_site_axi.py'
      - 'pl/verification/models/fixed_swd_site_driver.py'
      - 'pl/tests/test_fixed_swd_site_slice_source.py'
      - 'docs/architecture/fixed-fpga-swd-site1-rtl-gate1.md'
      - '.github/workflows/ppu-fixed-swd-site1-rtl-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cocotb-swd-site1:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline simulator and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          python -m pip install pytest cocotb cocotb-test
      - name: RTL AXI-Lite SWD v1 virtual DPIDR
        run: python -m pytest -q pl/verification/test_fixed_fpga_swd_site_rtl.py
      - name: Host source/gap contracts
        run: python -m pytest -q pl/tests/test_fixed_swd_site_slice_source.py
