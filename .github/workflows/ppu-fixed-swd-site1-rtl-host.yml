name: PPU Fixed ABI SWD Site 1 RTL Slice Host Simulation
on:
  pull_request:
    paths:
      - 'pl/rtl/bus/fixed_fpga_swd_site_axi_lite.sv'
      - 'pl/verification/test_fixed_fpga_swd_site_rtl.py'
      - 'pl/verification/cocotb/test_fixed_fpga_swd_site_axi.py'
      - 'pl/verification/models/fixed_swd_site_driver.py'
      - 'software/python/plasma_interfaces/fixed_abi_swd.py'
      - 'software/python/plasma_interfaces/fixed_abi_mmio_port.py'
      - 'software/python/plasma_interfaces/linux_mmio.py'
      - 'software/python/tests/test_fixed_abi_mmio_port_host.py'
      - 'software/python/native/armv7_mmio_barrier.c'
      - 'software/python/tests/test_fixed_abi_swd_control.py'
      - 'docs/development/fixed-abi-v2-ps-pl-host-verification-gate1.md'
      - 'pl/verification/fixed_image_abi_v1_gate1.json'
      - 'pl/tools/fixed_image_abi_contract.py'
      - 'pl/tests/test_fixed_image_abi_contract.py'
      - 'docs/architecture/fixed-fpga-swd-semantics-gate1.md'
      - 'pl/tests/test_fixed_swd_site_slice_source.py'
      - 'docs/architecture/fixed-fpga-swd-site1-rtl-gate1.md'
      - '.github/workflows/ppu-fixed-swd-site1-rtl-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cocotb-swd-site1:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline simulator and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          python -m pip install 'pytest==8.4.2' 'cocotb==1.9.2' 'cocotb-test==0.2.6'
          python -m pip install -e ./software/python
      - name: RTL AXI-Lite SWD v1 virtual DPIDR
        run: python -m pytest -q pl/verification/test_fixed_fpga_swd_site_rtl.py
      - name: Fixed ABI P0 native-word port and barrier Host-only contracts
        run: python -m pytest -q software/python/tests/test_fixed_abi_mmio_port_host.py
      - name: Production fixed ABI PS control negative contracts (host only)
        run: python -m pytest -q software/python/tests/test_fixed_abi_swd_control.py
      - name: Validate machine ABI semantic contract
        run: |
          python -m pl.tools.fixed_image_abi_contract pl/verification/fixed_image_abi_v1_gate1.json
          python -m pytest -q pl/tests/test_fixed_image_abi_contract.py
      - name: Host source/gap contracts
        run: python -m pytest -q pl/tests/test_fixed_swd_site_slice_source.py
