name: OpenOCD C0 route inventory proposal v6.25

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/openocd-c0-bounded-route-inventory-v6.25.json'
      - 'data/device-catalog/research/prepare_openocd_c0_route_inventory_v625.py'
      - 'data/device-catalog/research/test_prepare_openocd_c0_route_inventory_v625.py'
      - 'data/device-catalog/research/OPENOCD_C0_ROUTE_INVENTORY_PROPOSAL_V625.md'
      - '.github/workflows/device-catalog-openocd-c0-route-v625.yml'

permissions:
  contents: read

jobs:
  proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded C0 route-inventory proposal
        run: |
          python data/device-catalog/research/prepare_openocd_c0_route_inventory_v625.py \
            --proposal-csv /tmp/openocd-c0-route-v625.csv \
            --summary /tmp/openocd-c0-route-v625.json
          python -m unittest discover -s data/device-catalog/research \
            -p test_prepare_openocd_c0_route_inventory_v625.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: openocd-c0-route-inventory-proposal-v625
          path: |
            /tmp/openocd-c0-route-v625.csv
            /tmp/openocd-c0-route-v625.json
          if-no-files-found: error
          retention-days: 30
