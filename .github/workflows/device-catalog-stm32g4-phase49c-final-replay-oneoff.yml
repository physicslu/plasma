name: STM32G4 Phase 4.9C final replay one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32g4-phase49c-policy
    paths:
      - ".github/workflows/device-catalog-stm32g4-phase49c-final-replay-oneoff.yml"

permissions:
  contents: read

jobs:
  replay-stm32g4-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay retained discovery and Phase 4.9C policy
        run: |
          python data/device-catalog/research/validate_stm32g4_phase4_9b_retained_evidence.py
          python data/device-catalog/research/test_stm32g4_phase4_9c_policy.py
          python data/device-catalog/research/stm32g4_phase4_9c_policy.py
      - name: Assert Phase 4.9C remains metadata-only
        run: |
          cmp data/device-catalog/production/icpn-v1-manifest.json data/device-catalog/research/stm32g4-phase4.9c-production-manifest-prestate.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('data/device-catalog/research/stm32g4-phase4.9c-policy-baseline.json').read_text())
          assert p['candidate_count'] == 25
          assert p['decision_counts'] == {'metadata_ready':25,'manual_review_required':0,'reject':0}
          assert p['production_snapshot']['exact_icpn_count'] == 610
          assert p['production_snapshot']['base_device_count'] == 209
          assert p['production_snapshot']['stm32g4_exact_icpn_count'] == 0
          assert p['production_write_applied'] is False
          assert p['capability_mapping_deferred'] is True
          assert p['metadata_distribution']['pin_count'] == {'48':24,'49':1}
          print('Phase 4.9C metadata-only boundary: PASS')
          PY
      - name: Report immutable policy digests
        run: |
          sha256sum data/device-catalog/research/stm32g4-phase4.9c-ordering-authority.json
          sha256sum data/device-catalog/research/stm32g4-phase4.9c-production-manifest-prestate.json
          sha256sum data/device-catalog/research/stm32g4-phase4.9c-policy-baseline.json
