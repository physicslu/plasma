name: STM32F2 metadata replay v3.9
on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32f2-ordering-authority-v3.9.json'
      - 'data/device-catalog/research/analyze_stm32f2_metadata_replay_v39.py'
      - 'data/device-catalog/research/test_analyze_stm32f2_metadata_replay_v39.py'
      - 'data/device-catalog/research/STM32F2_METADATA_REPLAY_V39.md'
      - 'scripts/device-catalog-family-ci.py'
      - '.github/workflows/device-catalog-stm32f2-metadata-replay-v39.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python data/device-catalog/research/analyze_stm32f2_metadata_replay_v39.py
          python -m unittest discover -s data/device-catalog/research \
            -p test_analyze_stm32f2_metadata_replay_v39.py -v
