name: STM32F0 Phase 4.5B ST schema diagnostic one-off

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/device-catalog-stm32f0-phase45b-diagnostic-oneoff.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'playwright==1.62.0'
          python -m playwright install --with-deps chromium
      - name: Diagnose STM32F030C6 ST source surfaces
        env:
          PYTHONPATH: data/device-catalog/research
        run: |
          xvfb-run -a python - <<'PY'
          import json

          from stm32f3_browser_acquisition import STM32F3BrowserAcquirer
          from stm32f3_dual_surface_evidence import (
              QUALITY_HEADING,
              SAMPLE_BUY_HEADING,
              _parse_section,
              extract_dual_surface_part_number_records,
          )

          base = 'STM32F030C6'
          url = 'https://www.st.com/en/microcontrollers-microprocessors/stm32f030c6.html'
          with STM32F3BrowserAcquirer(base_by_url={url: base}, headless=False) as acquirer:
              body, final_url, _etag, _last_modified = acquirer.fetch(url, 90.0)
              html = body.decode('utf-8')
              quality = _parse_section(html, QUALITY_HEADING)
              sample = _parse_section(html, SAMPLE_BUY_HEADING)
              records, _canonical_text = extract_dual_surface_part_number_records(html, base)
              result = {
                  'base_device': base,
                  'source_url': url,
                  'final_url': final_url,
                  'browser_version': acquirer.browser_version,
                  'quality_seen': quality.seen,
                  'quality_table_rows_head': quality.table_rows[:5],
                  'sample_buy_seen': sample.seen,
                  'sample_buy_table_rows_head': sample.table_rows[:5],
                  'part_number_records': records,
              }
              print(json.dumps(result, indent=2, sort_keys=True))
          PY
