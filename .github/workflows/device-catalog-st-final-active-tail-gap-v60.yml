name: ST final Active tail-gap metadata replay v6.0

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/st-final-active-tail-gap-v6.0.txt'
      - 'data/device-catalog/research/st-final-active-tail-gap-lock-v6.0.json'
      - 'data/device-catalog/research/st-final-active-tail-gap-metadata-authority-v6.0.json'
      - 'data/device-catalog/research/analyze_st_final_active_tail_gap_v60.py'
      - 'data/device-catalog/research/test_analyze_st_final_active_tail_gap_v60.py'
      - 'data/device-catalog/research/ST_FINAL_ACTIVE_TAIL_GAP_METADATA_REPLAY_V60.md'
      - '.github/workflows/device-catalog-st-final-active-tail-gap-v60.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate final nine Active identities
        run: |
          python data/device-catalog/research/analyze_st_final_active_tail_gap_v60.py
          python -m unittest discover -s data/device-catalog/research \
            -p test_analyze_st_final_active_tail_gap_v60.py -v
