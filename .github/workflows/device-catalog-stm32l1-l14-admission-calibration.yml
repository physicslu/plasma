name: STM32L1 L1.4 admission-plan calibration

on:
  workflow_dispatch:
  push:
    branches:
      - agent/device-catalog-stm32l1-l14-admission-plan
    paths:
      - "data/device-catalog/research/stm32l1_admission_policy.py"
      - "data/device-catalog/research/stm32l1_phase_l1_4_admission.py"
      - "data/device-catalog/research/test_stm32l1_phase_l1_4_admission.py"
      - ".github/workflows/device-catalog-stm32l1-l14-admission-calibration.yml"

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run L1.4 negative controls
        run: |
          python data/device-catalog/research/test_stm32l1_phase_l1_4_admission.py

      - name: Replay full admission plan
        run: |
          python data/device-catalog/research/stm32l1_phase_l1_4_admission.py \
            --summary-only \
            --output /tmp/stm32l1-l1.4-summary.json
          cat /tmp/stm32l1-l1.4-summary.json

      - name: Enforce zero Production writes
        run: |
          if git diff --name-only origin/main...HEAD -- data/device-catalog/production/ | grep -q .; then
            echo "L1.4 must not modify Production"
            exit 1
          fi
