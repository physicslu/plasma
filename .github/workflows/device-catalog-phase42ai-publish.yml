name: Device catalog Phase 4.2AI controlled Production publish
on:
  push:
    branches: [agent/device-catalog-phase4.2ai-ay-wlcsp168-admission]
    paths: [".github/workflows/device-catalog-phase42ai-publish.yml"]
  workflow_dispatch:
permissions: {actions: read, contents: write}
jobs:
  publish:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2ai-ay-wlcsp168-admission, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: phase42ai-ay-wlcsp168-admission-proposal, path: /tmp/phase42ai, repository: physicslu/plasma, run-id: 33971024145, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Publish exact bound proposal
        run: |
          set -euo pipefail
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2ai-ay-wlcsp168-admission-live-2026-09-05 --baseline data/device-catalog/research/stm32f4-phase4.2ai-ay-wlcsp168-admission-baseline.json
          PYTHONPATH=data/device-catalog/research python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from device_catalog_admission_framework import read_csv,write_canonical_dataset
          from device_catalog_pipeline_framework import pipeline_plan_is_clean
          root=Path('data/device-catalog/research')
          canonical=root/'stm32f4-commercial-icpn.csv'
          evidence=root/'evidence/stm32f4-phase4.2ai-ay-wlcsp168-admission-live-2026-09-05'
          plan_out=root/'stm32f4-phase4.2ai-ay-wlcsp168-admission-plan.json'
          audit_out=root/'stm32f4-phase4.2ai-ay-wlcsp168-admission-audit.json'
          raw=Path('/tmp/phase42ai/admission-plan.json').read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          if sha!='c64c7c5d9d6248fc6042322785041b4326293a143cb7f5a859a86ac7433ab3c9': raise SystemExit('proposal hash mismatch')
          plan=json.loads(raw)
          expected={'STM32F469AEH6','STM32F469AEH7','STM32F469AEH7TR','STM32F469AGH6','STM32F469AGH6TR','STM32F469AGY6TR','STM32F469AIH6','STM32F469AIY6TR','STM32F479AGH6','STM32F479AIH6','STM32F479AIY6TR'}
          if {i['icpn'] for i in plan['candidates']}!=expected or not pipeline_plan_is_clean(plan): raise SystemExit('unclean plan')
          _,rows=read_csv(canonical)
          if len(rows)!=373 or len({r['base_device'] for r in rows})!=134: raise SystemExit('pre-state mismatch')
          result=write_canonical_dataset(plan=plan,canonical_path=canonical)
          _,after=read_csv(canonical)
          if result['rows_after']!=384 or len({r['base_device'] for r in after})!=139: raise SystemExit('post-state mismatch')
          plan_out.write_bytes(raw)
          manifest=json.loads((evidence/'manifest.json').read_text())
          if manifest['evidence_id']!='stm32f4-phase4.2ai-ay-wlcsp168-admission-2026-09-05-retained-20260905T133254Z-de33e30': raise SystemExit('evidence id mismatch')
          pilot=json.loads((evidence/'pilot-summary.json').read_text())
          exclusions={i['icpn'] for r in pilot['results'] for i in r['evidence']['excluded_non_active_part_numbers']}
          if exclusions: raise SystemExit('unexpected lifecycle exclusions')
          summary={
            'schema_version':1,
            'phase':'4.2AI',
            'proposal_run_id':33971024145,
            'proposal_artifact_id':9970915767,
            'proposal_artifact_zip_sha256':'c7bddf328cbedaf15227cda783ec1334ea05083e13b2fb84f3764458609d82cf',
            'admission_plan_sha256':sha,
            'retained_evidence_id':manifest['evidence_id'],
            'production_rows_before':373,
            'production_rows_after':384,
            'production_base_devices_before':134,
            'production_base_devices_after':139,
            'added_exact_icpns':sorted(expected),
            'lifecycle_exclusions':[],
            'canonical_csv_file_sha256':hashlib.sha256(canonical.read_bytes()).hexdigest(),
            'status':'published'
          }
          audit_out.write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2ai-ay-wlcsp168-admission-live-2026-09-05 --baseline data/device-catalog/research/stm32f4-phase4.2ai-ay-wlcsp168-admission-baseline.json
      - name: Commit publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/stm32f4-commercial-icpn.csv data/device-catalog/research/stm32f4-phase4.2ai-ay-wlcsp168-admission-plan.json data/device-catalog/research/stm32f4-phase4.2ai-ay-wlcsp168-admission-audit.json
          git commit -m 'device-catalog: admit Phase 4.2AI A/Y WLCSP168 ICPNs'
          git push origin HEAD:agent/device-catalog-phase4.2ai-ay-wlcsp168-admission
