name: Device catalog STM32H7RS exact ICPN discovery live acquisition

on:
  push:
    branches:
      - agent/stm32h7rs-exact-icpn-discovery
    paths:
      - 'data/device-catalog/research/stm32h7rs_exact_icpn_discovery.py'
      - '.github/workflows/device-catalog-stm32h7rs-exact-icpn-discovery-live.yml'

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stm32h7rs-exact-icpn-discovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-only browser dependency
        run: |
          python -m pip install --disable-pip-version-check -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium
      - name: Acquire bounded STM32H7RS exact ICPNs
        run: |
          xvfb-run -a python data/device-catalog/research/stm32h7rs_exact_icpn_discovery.py \
            --output-dir data/device-catalog/research/evidence/stm32h7rs-exact-icpn-live-2026-09-16 \
            --delay-seconds 1.0 \
            --timeout-seconds 90
      - name: Commit retained discovery evidence
        run: |
          git add data/device-catalog/research/evidence/stm32h7rs-exact-icpn-live-2026-09-16
          if git diff --cached --quiet; then
            echo 'Discovery evidence already retained.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Device catalog: retain STM32H7RS exact ICPN discovery evidence'
          git fetch origin agent/stm32h7rs-exact-icpn-discovery
          git rebase origin/agent/stm32h7rs-exact-icpn-discovery
          git push origin HEAD:agent/stm32h7rs-exact-icpn-discovery
