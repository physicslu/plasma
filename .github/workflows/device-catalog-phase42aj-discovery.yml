name: Device catalog Phase 4.2AJ F429/F439 B/T lifecycle discovery

on:
  push:
    branches: [agent/device-catalog-phase4.2aj-bt-lqfp208-lifecycle-closure]
    paths:
      - ".github/workflows/device-catalog-phase42aj-discovery.yml"
      - "data/device-catalog/research/stm32f4-phase4.2aj-f429-f439-bt-lifecycle-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0 && python -m playwright install --with-deps chromium
      - name: Acquire official ST lifecycle evidence
        run: |
          mkdir -p /tmp/phase42aj
          set +e
          xvfb-run -a python data/device-catalog/research/run_stm32f4_browser_pilot.py \
            --manifest data/device-catalog/research/stm32f4-phase4.2aj-f429-f439-bt-lifecycle-manifest.json \
            --catalog data/device-catalog/research/openocd-parts-canonical.csv \
            --output /tmp/phase42aj/pilot-summary.json \
            --scope pilot --headed --timeout 150 --delay 2
          pilot_rc=$?
          set -e
          if [ "$pilot_rc" -ne 0 ] && [ "$pilot_rc" -ne 1 ]; then
            exit "$pilot_rc"
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('/tmp/phase42aj/pilot-summary.json').read_text())
          expected = {
              'STM32F429BE',
              'STM32F429BG',
              'STM32F429BI',
              'STM32F439BG',
              'STM32F439BI',
          }
          results = summary.get('results')
          if not isinstance(results, list):
              raise SystemExit('Phase 4.2AJ discovery did not produce result records')
          observed = {item.get('base_device') for item in results}
          if observed != expected:
              raise SystemExit(
                  f'Phase 4.2AJ target mismatch: expected={sorted(expected)} observed={sorted(observed)}'
              )
          if summary.get('acquisition_success') != len(expected) or summary.get('acquisition_failure') != 0:
              raise SystemExit(
                  f'Phase 4.2AJ acquisition failure: success={summary.get("acquisition_success")} '
                  f'failure={summary.get("acquisition_failure")}'
              )
          excluded_total = 0
          for item in results:
              base = item['base_device']
              evidence = item.get('evidence')
              if not isinstance(evidence, dict):
                  raise SystemExit(f'{base}: missing official evidence')
              active = evidence.get('exact_icpns')
              excluded = evidence.get('excluded_non_active_part_numbers')
              records = evidence.get('part_number_records')
              if active:
                  raise SystemExit(f'{base}: Active exact ICPN observed; lifecycle-only closure is invalid: {active}')
              if not isinstance(excluded, list) or not excluded:
                  raise SystemExit(f'{base}: expected at least one excluded non-Active exact part')
              if not isinstance(records, list) or not records:
                  raise SystemExit(f'{base}: missing lifecycle records')
              if any(record.get('active') is not False for record in records):
                  raise SystemExit(f'{base}: lifecycle record is not explicitly non-Active')
              statuses = {str(record.get('marketing_status', '')).strip() for record in records}
              if any(not (status.startswith('NRND') or status.startswith('Proposal')) for status in statuses):
                  raise SystemExit(f'{base}: unsupported non-Active lifecycle status: {sorted(statuses)}')
              excluded_total += len(excluded)
          if excluded_total == 0:
              raise SystemExit('Phase 4.2AJ did not observe any lifecycle exclusions')
          if summary.get('exact_icpn_candidates') != 0:
              raise SystemExit('Phase 4.2AJ lifecycle-only discovery must expose zero Active candidates')
          PY
          cd /tmp/phase42aj
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase42aj-f429-f439-bt-lifecycle-discovery
          path: /tmp/phase42aj
          if-no-files-found: error
          retention-days: 30
