name: Microchip CFG-first Phase 1 Reverse Coverage

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/microchip_openocd_reverse_coverage_v1.py'
      - 'data/device-catalog/research/test_microchip_openocd_reverse_coverage_v1.py'
      - 'data/device-catalog/research/microchip_phase1_p0_information_ledger_v1.py'
      - 'data/device-catalog/research/test_microchip_phase1_p0_information_ledger_v1.py'
      - 'data/device-catalog/research/MICROCHIP_P0_PHASE1_INFORMATION_LEDGER_V1.md'
      - 'data/device-catalog/research/MICROCHIP_OPENOCD_REVERSE_COVERAGE_V1.md'
      - '.github/workflows/device-catalog-microchip-cfg-first-reverse-coverage-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reverse-openocd-cfg-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source-lock and fail-closed reverse join regression
        run: |
          set -euo pipefail
          python -m unittest discover -s data/device-catalog/research \
            -p 'test_microchip_openocd_reverse_coverage_v1.py' -v
          python -m unittest discover -s data/device-catalog/research \
            -p 'test_microchip_phase1_p0_information_ledger_v1.py' -v
          python -m unittest discover -s data/device-catalog/research \
            -p 'test_microchip_openocd_core_first_v1.py' -v
          python data/device-catalog/research/microchip_openocd_reverse_coverage_v1.py \
            --output "${{ runner.temp }}/microchip-reverse-frozen-source-only.json"
      - name: Download immutable manufacturer original DFP and MCP research captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/microchip-dfp" "${{ runner.temp }}/microchip-source-zip"
          gh run download 38338847345 --repo "${{ github.repository }}" \
            --name microchip-official-packs-index-raw \
            --dir "${{ runner.temp }}/microchip-dfp"
          gh run download 38535507957 --repo "${{ github.repository }}" \
            --name microchip-phase1-portable-bundle-live-and-receipts-v1 \
            --dir "${{ runner.temp }}/microchip-source-zip"
      - name: Reverse pinned CFG -> original DFP names -> 24 original MCP order-code candidates
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          found=[
              p.parent for p in (root/"microchip-dfp").rglob("index.html")
              if (p.parent/"manifest.json").is_file()
          ]
          bundles=list((root/"microchip-source-zip").rglob("portable-original-evidence.zip"))
          if len(found)!=1 or len(bundles)!=1:
              raise SystemExit(
                  f"missing/ambiguous original manufacturer evidence: DFP={len(found)}, MCP={len(bundles)}")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              print(f"MICROCHIP_DFP_ROOT={found[0]}",file=f)
              print(f"MICROCHIP_SOURCE_BUNDLE={bundles[0]}",file=f)
          PY
      - name: Perform real original-byte reverse mapping and independent report replay
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python data/device-catalog/research/microchip_openocd_reverse_coverage_v1.py \
            --dfp-evidence-root "$MICROCHIP_DFP_ROOT" \
            --portable-bundle "$MICROCHIP_SOURCE_BUNDLE" \
            --output "${{ runner.temp }}/microchip-reverse-cfg-icpn-report.json"
          python data/device-catalog/research/microchip_openocd_reverse_coverage_v1.py \
            --dfp-evidence-root "$MICROCHIP_DFP_ROOT" \
            --portable-bundle "$MICROCHIP_SOURCE_BUNDLE" \
            --output "${{ runner.temp }}/microchip-reverse-cfg-icpn-report.json" --verify
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/
              "microchip-reverse-cfg-icpn-report.json").read_text())
          assert report["actual_original_dfp_p0_names_replayed"] == 364
          assert report["actual_original_dfp_p1_names_replayed"] == 12
          assert report["all_icpn_original_bytes_replayed_in_this_command"] is True
          assert report["production_write_authorized"] is False
          assert report["cfg_software_supported_claimed"] is False
          assert report["icpn_denominator_joined_in_this_run"] == 24
          print(json.dumps({
              "p0_cfg_groups": report["p0_target_cfg_count"],
              "original_dfp_p0": report["actual_original_dfp_p0_names_replayed"],
              "original_mcp_icpn_joined": report["icpn_denominator_joined_in_this_run"],
              "icpn_statuses": report["icpn_mapping_state_counts"],
              "icpn_cfg_counts": report["icpn_by_cfg_candidate_counts"],
              "remaining_icpn_research_population_not_joined": "UNKNOWN",
          },indent=2,sort_keys=True))
          PY
      - name: Preserve Research-only mapping output and independent frozen summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microchip-phase1-cfg-first-original-evidence-crosswalk-v1
          path: |
            ${{ runner.temp }}/microchip-reverse-frozen-source-only.json
            ${{ runner.temp }}/microchip-reverse-cfg-icpn-report.json
          if-no-files-found: warn
          retention-days: 90
      - name: State strict non-admission boundary
        if: always()
        run: |
          echo "CFG/DFP matching means CANDIDATE only; not OpenOCD SUPPORTED" >> "$GITHUB_STEP_SUMMARY"
          echo "Only 24 source-observed two-family commercial ICPNs are replayed, not 24,051" >> "$GITHUB_STEP_SUMMARY"
          echo "No Production admission, Flash Driver qualification, firmware, hardware or UI changes" >> "$GITHUB_STEP_SUMMARY"

  full-original-batch-reverse-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all archived official DFP and 13 original MCP data sources
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 14
        run: |
          set -euo pipefail
          root="${{ runner.temp }}/microchip-full-sources"
          mkdir -p "$root/dfp" "$root/old"
          gh run download 38338847345 --repo "${{ github.repository }}" --name microchip-official-packs-index-raw --dir "$root/dfp"
          gh run download 38348043707 --repo "${{ github.repository }}" --name microchip-multilane-16-batch-raw-research-20261013 --dir "$root/old"
          for shard in $(seq 0 11); do
            mkdir -p "$root/shard-$shard"
            gh run download 38357451545 --repo "${{ github.repository }}" --name "microchip-dfp-shard-$shard-raw-20261013" --dir "$root/shard-$shard"
          done
      - name: Validate original input source directory presence
        run: |
          set -euo pipefail
          root="${{ runner.temp }}/microchip-full-sources"
          test -f "$root/dfp/index.html"
          test -f "$root/dfp/manifest.json"
          test -d "$root/old/microchip-live-research"
          test "$(find "$root/old/microchip-live-research" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 16
          echo "MICROCHIP_DFP_ROOT=$root/dfp" >> "$GITHUB_ENV"
          echo "MICROCHIP_SWEEP_ROOT=$root" >> "$GITHUB_ENV"
          for shard in $(seq 0 11); do
            dir="$root/shard-$shard/microchip-live-shard"
            test -d "$dir"
            test "$(find "$dir" -mindepth 1 -maxdepth 1 -type d | wc -l)" -ge 1
          done
      - name: Replay all 313 source batches and reverse-map full Research ICPN subset
        timeout-minutes: 27
        run: |
          set -euo pipefail
          set -- --dfp-evidence-root "$MICROCHIP_DFP_ROOT" --original-batch-source "original-16-batches=$MICROCHIP_SWEEP_ROOT/old/microchip-live-research"
          for shard in $(seq 0 11); do
            set -- "$@" --original-batch-source "shard-$shard=$MICROCHIP_SWEEP_ROOT/shard-$shard/microchip-live-shard"
          done
          python data/device-catalog/research/microchip_openocd_reverse_coverage_v1.py "$@" --output "${{ runner.temp }}/microchip-full-reverse.json"
          python data/device-catalog/research/microchip_openocd_reverse_coverage_v1.py "$@" --output "${{ runner.temp }}/microchip-full-reverse.json" --verify
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"microchip-full-reverse.json"
          data=json.loads(path.read_text(encoding="utf-8"))
          source=data["full_batch_original_source_replay"]
          assert source["source_replay_status"]=="REPLAYED_AGAINST_PINNED_ORIGINAL_BYTES"
          assert source["historical_research_icpn_candidates_replayed"]==23276
          assert source["original_batch_archives_replayed"]==313
          assert source["exact_prefix_queries_replayed"]==2821
          assert data["icpn_denominator_joined_in_this_run"]==23276
          assert sum(data["icpn_mapping_state_counts"].values())==23276
          assert data["all_icpn_original_bytes_replayed_in_this_command"] is True
          assert data["actual_original_dfp_p0_names_replayed"]==364
          assert data["production_write_authorized"] is False
          assert data["cfg_software_supported_claimed"] is False
          print(json.dumps({"source_replayed_icpn_count":len(data["icpn_rows"]),
                            "mapping_states":data["icpn_mapping_state_counts"],
                            "cfg_counts":data["icpn_by_cfg_candidate_counts"],
                            "historical_24051_complete":False},sort_keys=True,indent=2))
          PY
      - name: Derive all 2437 P0 exact-ICPN Phase 1 field-evidence states and source gaps
        run: |
          set -euo pipefail
          python data/device-catalog/research/microchip_phase1_p0_information_ledger_v1.py \
            --upstream-cfg-report "${{ runner.temp }}/microchip-full-reverse.json" \
            --output "${{ runner.temp }}/microchip-p0-phase1-information-ledger.json"
          python data/device-catalog/research/microchip_phase1_p0_information_ledger_v1.py \
            --upstream-cfg-report "${{ runner.temp }}/microchip-full-reverse.json" \
            --output "${{ runner.temp }}/microchip-p0-phase1-information-ledger.json" --verify
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/
            "microchip-p0-phase1-information-ledger.json").read_text(encoding="utf-8"))
          assert report["p0_icpn_count"] == 2437
          assert len(report["records"]) == 2437
          assert report["record_level_phase1_information_complete"] == 0
          assert report["record_level_internal_identity_admitted"] == 0
          for f in ("manufacturer","icpn","base_device"):
            assert report["per_field_coverage"][f]["VERIFIED"] == 2437
          for f in ("package","pin_count","flash","ram","vdd","io_supply","vdda",
                    "temperature","core_architecture","core_model"):
            assert report["per_field_coverage"][f]["UNKNOWN"] == 2437
          assert not report["production_write_authorized"]
          assert not report["catalog_publication_authorized"]
          assert not report["phase1_p0_information_complete_claimed"]
          print("MICROCHIP P0 FIELD GAPS: 2437 exact ICPNs; only identity fields verified; all other fields require source work")
          PY
      - name: Archive Research-only exact ICPN crosswalk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microchip-phase1-full-original-mcp-cfg-reverse-coverage-v1
          path: |
            ${{ runner.temp }}/microchip-full-reverse.json
            ${{ runner.temp }}/microchip-p0-phase1-information-ledger.json
          if-no-files-found: warn
          retention-days: 90
