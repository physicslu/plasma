name: Microchip CFG-first Phase 1 Reverse Coverage

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/microchip_openocd_reverse_coverage_v1.py'
      - 'data/device-catalog/research/test_microchip_openocd_reverse_coverage_v1.py'
      - 'data/device-catalog/research/microchip_phase1_p0_information_ledger_v1.py'
      - 'data/device-catalog/research/microchip_phase1_p1_information_ledger_v1.py'
      - 'data/device-catalog/research/microchip_phase1_p1_ordering_crosswalk_v1.py'
      - 'data/device-catalog/research/microchip_phase1_p1_dfp_discovery_v1.py'
      - 'data/device-catalog/research/test_microchip_phase1_p1_dfp_discovery_v1.py'
      - 'data/device-catalog/research/MICROCHIP_P1_DFP_DISCOVERY_V1.md'
      - 'data/device-catalog/research/test_microchip_phase1_p1_ordering_crosswalk_v1.py'
      - 'data/device-catalog/research/MICROCHIP_P1_ORDERING_APPLICABILITY_V1.md'
      - 'data/device-catalog/research/test_microchip_phase1_p1_information_ledger_v1.py'
      - 'data/device-catalog/research/MICROCHIP_P1_PHASE1_INFORMATION_V1.md'
      - 'data/device-catalog/research/test_microchip_phase1_p0_information_ledger_v1.py'
      - 'data/device-catalog/research/MICROCHIP_P0_PHASE1_INFORMATION_LEDGER_V1.md'
      - 'data/device-catalog/research/MICROCHIP_P0_OFFICIAL_SOURCE_GAPS_V1.md'
      - 'data/device-catalog/research/microchip_phase1_s1_exact_identity_funnel_v1.py'
      - 'data/device-catalog/research/test_microchip_phase1_s1_exact_identity_funnel_v1.py'
      - 'data/device-catalog/research/microchip_adr0002_canonical_phase_contract_v1.py'
      - 'data/device-catalog/research/test_microchip_adr0002_canonical_phase_contract_v1.py'
      - 'data/device-catalog/research/microchip_adr0002_cfg2563_target_scope_v1.py'
      - 'data/device-catalog/research/test_microchip_adr0002_cfg2563_target_scope_v1.py'
      - 'data/device-catalog/research/microchip_adr0002_phase1_remaining2441_queue_v1.py'
      - 'data/device-catalog/research/test_microchip_adr0002_phase1_remaining2441_queue_v1.py'
      - 'data/device-catalog/research/MICROCHIP_ADR0002_2441_PHASE1_DELIVERY_QUEUE_V1.md'
      - 'data/device-catalog/research/MICROCHIP_ADR0002_PHASE_CONFORMANCE_V1.md'
      - 'data/device-catalog/research/MICROCHIP_PHASE1_S1_IDENTITY_FUNNEL_V1.md'
      - 'data/device-catalog/research/microchip_phase1_cfg2563_st_field_ledger_v1.py'
      - 'data/device-catalog/research/test_microchip_phase1_cfg2563_st_field_ledger_v1.py'
      - 'data/device-catalog/research/MICROCHIP_5CFG_2563_PHASE1_ST_FIELDS_V1.md'
      - 'data/device-catalog/research/microchip_phase1_p0_samr30_online_original_v1.py'
      - 'data/device-catalog/research/test_microchip_phase1_p0_samr30_online_original_v1.py'
      - 'data/device-catalog/research/MICROCHIP_OPENOCD_REVERSE_COVERAGE_V1.md'
      - '.github/workflows/device-catalog-microchip-cfg-first-reverse-coverage-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reverse-openocd-cfg-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source-lock and fail-closed reverse join regression
        run: |
          set -euo pipefail
          python -m unittest discover -s data/device-catalog/research \
            -p 'test_microchip_openocd_reverse_coverage_v1.py' -v
          python -m unittest discover -s data/device-catalog/research \
            -p 'test_microchip_phase1_p0_information_ledger_v1.py' -v
          python -m unittest discover -s data/device-catalog/research \
            -p 'test_microchip_phase1_p1_information_ledger_v1.py' -v
          python -m unittest discover -s data/device-catalog/research \
            -p 'test_microchip_phase1_p1_ordering_crosswalk_v1.py' -v
          python -m unittest discover -s data/device-catalog/research \
            -p 'test_microchip_phase1_p0_samr30_online_original_v1.py' -v
          python -m unittest discover -s data/device-catalog/research \
            -p 'test_microchip_openocd_core_first_v1.py' -v
          python data/device-catalog/research/microchip_openocd_reverse_coverage_v1.py \
            --output "${{ runner.temp }}/microchip-reverse-frozen-source-only.json"
      - name: Download immutable manufacturer original DFP and MCP research captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/microchip-dfp" "${{ runner.temp }}/microchip-source-zip"
          gh run download 38338847345 --repo "${{ github.repository }}" \
            --name microchip-official-packs-index-raw \
            --dir "${{ runner.temp }}/microchip-dfp"
          gh run download 38535507957 --repo "${{ github.repository }}" \
            --name microchip-phase1-portable-bundle-live-and-receipts-v1 \
            --dir "${{ runner.temp }}/microchip-source-zip"
      - name: Reverse pinned CFG -> original DFP names -> 24 original MCP order-code candidates
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          found=[
              p.parent for p in (root/"microchip-dfp").rglob("index.html")
              if (p.parent/"manifest.json").is_file()
          ]
          bundles=list((root/"microchip-source-zip").rglob("portable-original-evidence.zip"))
          if len(found)!=1 or len(bundles)!=1:
              raise SystemExit(
                  f"missing/ambiguous original manufacturer evidence: DFP={len(found)}, MCP={len(bundles)}")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              print(f"MICROCHIP_DFP_ROOT={found[0]}",file=f)
              print(f"MICROCHIP_SOURCE_BUNDLE={bundles[0]}",file=f)
          PY
      - name: Perform real original-byte reverse mapping and independent report replay
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python data/device-catalog/research/microchip_openocd_reverse_coverage_v1.py \
            --dfp-evidence-root "$MICROCHIP_DFP_ROOT" \
            --portable-bundle "$MICROCHIP_SOURCE_BUNDLE" \
            --output "${{ runner.temp }}/microchip-reverse-cfg-icpn-report.json"
          python data/device-catalog/research/microchip_openocd_reverse_coverage_v1.py \
            --dfp-evidence-root "$MICROCHIP_DFP_ROOT" \
            --portable-bundle "$MICROCHIP_SOURCE_BUNDLE" \
            --output "${{ runner.temp }}/microchip-reverse-cfg-icpn-report.json" --verify
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/
              "microchip-reverse-cfg-icpn-report.json").read_text())
          assert report["actual_original_dfp_p0_names_replayed"] == 364
          assert report["actual_original_dfp_p1_names_replayed"] == 12
          assert report["all_icpn_original_bytes_replayed_in_this_command"] is True
          assert report["production_write_authorized"] is False
          assert report["cfg_software_supported_claimed"] is False
          assert report["icpn_denominator_joined_in_this_run"] == 24
          print(json.dumps({
              "p0_cfg_groups": report["p0_target_cfg_count"],
              "original_dfp_p0": report["actual_original_dfp_p0_names_replayed"],
              "original_mcp_icpn_joined": report["icpn_denominator_joined_in_this_run"],
              "icpn_statuses": report["icpn_mapping_state_counts"],
              "icpn_cfg_counts": report["icpn_by_cfg_candidate_counts"],
              "remaining_icpn_research_population_not_joined": "UNKNOWN",
          },indent=2,sort_keys=True))
          PY
      - name: Preserve Research-only mapping output and independent frozen summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: microchip-phase1-cfg-first-original-evidence-crosswalk-v1
          path: |
            ${{ runner.temp }}/microchip-reverse-frozen-source-only.json
            ${{ runner.temp }}/microchip-reverse-cfg-icpn-report.json
          if-no-files-found: warn
          retention-days: 90
      - name: State strict non-admission boundary
        if: always()
        run: |
          echo "CFG/DFP matching means CANDIDATE only; not OpenOCD SUPPORTED" >> "$GITHUB_STEP_SUMMARY"
          echo "Only 24 source-observed two-family commercial ICPNs are replayed, not 24,051" >> "$GITHUB_STEP_SUMMARY"
          echo "No Production admission, Flash Driver qualification, firmware, hardware or UI changes" >> "$GITHUB_STEP_SUMMARY"

  full-original-batch-reverse-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all archived official DFP and 13 original MCP data sources
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 14
        run: |
          set -euo pipefail
          root="${{ runner.temp }}/microchip-full-sources"
          mkdir -p "$root/dfp" "$root/old"
          gh run download 38338847345 --repo "${{ github.repository }}" --name microchip-official-packs-index-raw --dir "$root/dfp"
          gh run download 38348043707 --repo "${{ github.repository }}" --name microchip-multilane-16-batch-raw-research-20261013 --dir "$root/old"
          mkdir -p "$root/chart-archive"
          gh run download 38535507957 --repo "${{ github.repository }}" \
            --name microchip-phase1-portable-bundle-live-and-receipts-v1 \
            --dir "$root/chart-archive"
          for shard in $(seq 0 11); do
            mkdir -p "$root/shard-$shard"
            gh run download 38357451545 --repo "${{ github.repository }}" --name "microchip-dfp-shard-$shard-raw-20261013" --dir "$root/shard-$shard"
          done
      - name: Validate original input source directory presence
        run: |
          set -euo pipefail
          root="${{ runner.temp }}/microchip-full-sources"
          test -f "$root/dfp/index.html"
          test -f "$root/dfp/manifest.json"
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          import sys
          sys.path.insert(0,"data/device-catalog/research")
          import microchip_phase1_portable_custody_v1 as portable
          root=Path(os.environ["RUNNER_TEMP"])/"microchip-full-sources"
          archives=list((root/"chart-archive").rglob("portable-original-evidence.zip"))
          if len(archives)!=1:
              raise SystemExit(f"Expected exactly one original official chart bundle; got {len(archives)}")
          receipt=portable.verify(archives[0])
          if receipt["offline_bundle_verification"]!="PASS":
              raise SystemExit("Original manufacturer source bundle not verified")
          chart=root/"official-chart"
          chart.mkdir(mode=0o700)
          with ZipFile(archives[0]) as z:
              for name in ("chart/original-chart.html","chart/manifest.json"):
                  (chart/Path(name).name).write_bytes(z.read(name))
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              print(f"MICROCHIP_CHART_ROOT={chart}",file=f)
          PY
          test -d "$root/old/microchip-live-research"
          test "$(find "$root/old/microchip-live-research" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 16
          echo "MICROCHIP_DFP_ROOT=$root/dfp" >> "$GITHUB_ENV"
          echo "MICROCHIP_SWEEP_ROOT=$root" >> "$GITHUB_ENV"
          for shard in $(seq 0 11); do
            dir="$root/shard-$shard/microchip-live-shard"
            test -d "$dir"
            test "$(find "$dir" -mindepth 1 -maxdepth 1 -type d | wc -l)" -ge 1
          done
      - name: Replay all 313 source batches and reverse-map full Research ICPN subset
        timeout-minutes: 27
        run: |
          set -euo pipefail
          set -- --dfp-evidence-root "$MICROCHIP_DFP_ROOT" --original-batch-source "original-16-batches=$MICROCHIP_SWEEP_ROOT/old/microchip-live-research"
          for shard in $(seq 0 11); do
            set -- "$@" --original-batch-source "shard-$shard=$MICROCHIP_SWEEP_ROOT/shard-$shard/microchip-live-shard"
          done
          python data/device-catalog/research/microchip_openocd_reverse_coverage_v1.py "$@" --output "${{ runner.temp }}/microchip-full-reverse.json"
          python data/device-catalog/research/microchip_openocd_reverse_coverage_v1.py "$@" --output "${{ runner.temp }}/microchip-full-reverse.json" --verify
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"microchip-full-reverse.json"
          data=json.loads(path.read_text(encoding="utf-8"))
          source=data["full_batch_original_source_replay"]
          assert source["source_replay_status"]=="REPLAYED_AGAINST_PINNED_ORIGINAL_BYTES"
          assert source["historical_research_icpn_candidates_replayed"]==23276
          assert source["original_batch_archives_replayed"]==313
          assert source["exact_prefix_queries_replayed"]==2821
          assert data["icpn_denominator_joined_in_this_run"]==23276
          assert sum(data["icpn_mapping_state_counts"].values())==23276
          assert data["all_icpn_original_bytes_replayed_in_this_command"] is True
          assert data["actual_original_dfp_p0_names_replayed"]==364
          assert data["production_write_authorized"] is False
          assert data["cfg_software_supported_claimed"] is False
          print(json.dumps({"source_replayed_icpn_count":len(data["icpn_rows"]),
                            "mapping_states":data["icpn_mapping_state_counts"],
                            "cfg_counts":data["icpn_by_cfg_candidate_counts"],
                            "historical_24051_complete":False},sort_keys=True,indent=2))
          PY
      - name: Audit original-MCP x DFP-only P2 identity archive (ADR-0002 corrected)
        run: |
          set -euo pipefail
          python -m unittest discover -s data/device-catalog/research \
            -p 'test_microchip_phase1_p1_dfp_discovery_v1.py' -v
          python data/device-catalog/research/microchip_phase1_p1_dfp_discovery_v1.py \
            --upstream-cfg-report "${{ runner.temp }}/microchip-full-reverse.json" \
            --dfp-evidence-root "$MICROCHIP_DFP_ROOT" \
            --output "${{ runner.temp }}/microchip-p2-dfp-identity-archive.json"
          python data/device-catalog/research/microchip_phase1_p1_dfp_discovery_v1.py \
            --upstream-cfg-report "${{ runner.temp }}/microchip-full-reverse.json" \
            --dfp-evidence-root "$MICROCHIP_DFP_ROOT" \
            --output "${{ runner.temp }}/microchip-p2-dfp-identity-archive.json" --verify
          python - <<'PY'
          import json,os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/
              "microchip-p2-dfp-identity-archive.json").read_text())
          assert report["schema_version"]==2
          assert report["source_subset_original_mcp_exact_icpns"]==23276
          assert report["baseline_p0_exact_icpns_unchanged"]==2437
          assert report["baseline_p1_target_only_exact_icpns_unchanged"]==126
          assert report["adr0002_p1_openocd_candidate_exact_icpns"]==126
          assert report["adr0002_p2_archive_exact_icpns"]==20713
          assert report["dfp_only_p2_archive_exact_icpn_subset"]==2065
          assert report["p2_other_archived_exact_icpns"]==18648
          assert report["manufacturer_dfp_matched_distinct_base_names"]==340
          assert 2437+126+20713==23276
          assert 2065+18648==20713
          assert report["dfp_only_archive_not_adr0002_p1"] is True
          assert "p1_expanded_research_queue_total" not in report
          assert "p1_discovery_exact_icpn_candidates" not in report
          assert report["baseline_p0_p1_records_reclassified"]==0
          assert report["new_phase1_fields_verified"]==0
          assert report["openocd_software_supported_count"]==0
          assert report["catalog_publication_authorized"] is False
          assert report["production_write_authorized"] is False
          assert report["phase2_programming_authorized"] is False
          assert len(report["records"])==2065
          assert len({r["icpn"] for r in report["records"]})==2065
          assert all(r["adr0002_research_priority"]=="P2"
              and r["counts_as_adr0002_p1_candidate"] is False
              and r["dfp_identity_research_state"]==
                  "P2_ARCHIVE_DFP_IDENTITY_ONLY_NO_OPENOCD_LEAD"
              and r["openocd_target_cfg"] is None
              and r["phase2_software_supported"] is False
              and r["production_write_authorized"] is False
              for r in report["records"])
          print("ADR0002_MICROCHIP_P0",2437)
          print("ADR0002_MICROCHIP_P1_TARGET_ONLY",126)
          print("ADR0002_MICROCHIP_P2_ARCHIVE",20713)
          print("MICROCHIP_P2_DFP_ONLY_ARCHIVE_SUBSET",2065)
          print("MICROCHIP_DFP_ONLY_DISTINCT_BASE",340)
          print("MICROCHIP_DFP_ONLY_BY_PACK",
                json.dumps(report["dfp_archive_exact_icpn_by_manufacturer_pack"],
                           sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("ADR-0002 Microchip P0: 2,437; bounded P1: 126; P2: 20,713\n")
              f.write("Included within P2: 2,065 exact original-MCP x DFP-only "
                      "identity records across 340 DFP Base Devices\n")
              f.write("Historical 2,191 combined-P1 label corrected; NOT P1.\n")
              f.write("No OpenOCD SUPPORTED, Phase 2, Catalog or Production.\n")
          PY
      - name: Derive all 2437 P0 exact-ICPN Phase 1 field-evidence states and source gaps
        run: |
          set -euo pipefail
          python data/device-catalog/research/microchip_phase1_p0_information_ledger_v1.py \
            --upstream-cfg-report "${{ runner.temp }}/microchip-full-reverse.json" \
            --chart-original-root "$MICROCHIP_CHART_ROOT" \
            --output "${{ runner.temp }}/microchip-p0-phase1-information-ledger.json"
          python data/device-catalog/research/microchip_phase1_p0_information_ledger_v1.py \
            --upstream-cfg-report "${{ runner.temp }}/microchip-full-reverse.json" \
            --chart-original-root "$MICROCHIP_CHART_ROOT" \
            --output "${{ runner.temp }}/microchip-p0-phase1-information-ledger.json" --verify
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/
            "microchip-p0-phase1-information-ledger.json").read_text(encoding="utf-8"))
          assert report["p0_icpn_count"] == 2437
          assert len(report["records"]) == 2437
          assert report["record_level_phase1_information_complete"] == 0
          assert report["record_level_internal_identity_admitted"] == 0
          for f in ("manufacturer","icpn","base_device"):
            assert report["per_field_coverage"][f]["VERIFIED"] == 2437
          for f in ("package","pin_count","flash","ram","vdd","io_supply","vdda",
                    "temperature","core_architecture","core_model"):
            states=report["per_field_coverage"][f]
            assert sum(states.values()) == 2437
            assert states["VERIFIED"] == 0
            assert states["CONFLICT"] == 0
          assert report["chart_original_bytes_replayed_by_upstream_chart_builder"]
          assert report["p0_family_chart_evidence"]["p0_manufacturer_chart_base_count"] == 341
          proof = report["p0_family_chart_evidence"]
          assert proof["p0_icpns_exact_manufacturer_base_joined_to_chart"] == 2370
          assert 0 <= proof["p0_icpns_reviewed_manufacturer_alias_joined_to_chart"] <= 23
          assert proof["p0_icpns_reviewed_manufacturer_alias_joined_to_chart"] == 0
          assert proof["p0_icpns_not_in_observed_chart"] == 67
          assert proof["p0_unmatched_distinct_manufacturer_base_count"] == 27
          assert len(proof["p0_official_source_acquisition_queue"]) == 27
          assert sum(x["exact_icpn_count"] for x in
                     proof["p0_official_source_acquisition_queue"]) == 67
          assert proof["chart_unmatched_by_research_cfg"] == {
              "tcl/target/at91samdXX.cfg": 42,
              "tcl/target/atsamv.cfg": 14,
              "tcl/target/pic32mx.cfg": 11,
          }
          assert all(x["official_exact_ordering_table_state"] == "NOT_REPLAYED"
                     and x["field_inference_authorized"] is False for x in
                     proof["p0_official_source_acquisition_queue"])
          assert (proof["p0_icpns_exact_manufacturer_base_joined_to_chart"] +
                  proof["p0_icpns_reviewed_manufacturer_alias_joined_to_chart"] +
                  proof["p0_icpns_not_in_observed_chart"]) == 2437
          assert len(proof["chart_unmatched_exact_icpns"]) == proof["p0_icpns_not_in_observed_chart"]
          assert sum(proof["chart_unmatched_by_research_cfg"].values()) == proof["p0_icpns_not_in_observed_chart"]
          assert sum(proof["chart_unmatched_by_manufacturer_base"].values()) == proof["p0_icpns_not_in_observed_chart"]
          print(json.dumps({
            "exact_base_chart_joins": proof["p0_icpns_exact_manufacturer_base_joined_to_chart"],
            "source_reviewed_alias_chart_joins": proof["p0_icpns_reviewed_manufacturer_alias_joined_to_chart"],
            "remaining_unmatched": proof["p0_icpns_not_in_observed_chart"],
            "unmatched_by_cfg": proof["chart_unmatched_by_research_cfg"],
            "unmatched_by_original_mcp_base": proof["chart_unmatched_by_manufacturer_base"]
          },indent=2,sort_keys=True))
          for f in ("io_supply","vdda","core_architecture"):
            assert report["per_field_coverage"][f]["UNKNOWN"] == 2437
          assert not report["production_write_authorized"]
          assert not report["catalog_publication_authorized"]
          assert not report["phase1_p0_information_complete_claimed"]
          print("MICROCHIP P0 FIELD GAPS: 2437 exact ICPNs; identity VERIFIED; applicable chart fields PARTIAL; exact-variant evidence remains UNKNOWN")
          PY
      - name: Create original-source-replayed Microchip P1 exact-ICPN Phase 1 information ledger
        run: |
          set -euo pipefail
          python data/device-catalog/research/microchip_phase1_p1_information_ledger_v1.py \
            --upstream-cfg-report "${{ runner.temp }}/microchip-full-reverse.json" \
            --chart-original-root "$MICROCHIP_CHART_ROOT" \
            --output "${{ runner.temp }}/microchip-p1-phase1-information-ledger.json"
          python data/device-catalog/research/microchip_phase1_p1_information_ledger_v1.py \
            --upstream-cfg-report "${{ runner.temp }}/microchip-full-reverse.json" \
            --chart-original-root "$MICROCHIP_CHART_ROOT" \
            --output "${{ runner.temp }}/microchip-p1-phase1-information-ledger.json" --verify
          python - <<'PY'
          import json,os
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"microchip-p1-phase1-information-ledger.json"
          out=json.loads(path.read_text(encoding="utf-8"))
          assert out["p1_target_only_icpn_count"] == 126
          assert len(out["records"]) == 126
          assert out["p1_unique_original_mcp_base_device_count"] == 12
          assert out["p1_distinct_base_icpn_counts"] == {
             "ATSAML10D14A":8, "ATSAML10D15A":10, "ATSAML10D16A":11,
             "ATSAML10E14A":8, "ATSAML10E15A":12, "ATSAML10E16A":15,
             "ATSAML11D14A":8, "ATSAML11D15A":10, "ATSAML11D16A":10,
             "ATSAML11E14A":8, "ATSAML11E15A":12, "ATSAML11E16A":14,
          }
          assert out["p1_openocd_target_cfg_research_only"] == "tcl/target/atsaml1x.cfg"
          assert out["p1_target_only_not_software_supported"] is True
          assert out["chart_original_bytes_replayed_by_upstream_chart_builder"] is True
          audit=out["p1_official_chart_evidence"]
          assert audit["chart_p1_base_name_count"] == 12
