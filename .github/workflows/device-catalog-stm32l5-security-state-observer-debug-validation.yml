name: STM32L5 security-state observer/debug validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32l5-security-state-observer-debug-policy.json'
      - 'data/device-catalog/research/stm32l5_security_state_observer_debug.py'
      - 'data/device-catalog/research/validate_stm32l5_security_state_observer_debug_gate.py'
      - 'data/device-catalog/research/device-catalog-stm32l5-security-state-observer-debug-validation-gate.md'
      - 'data/device-catalog/research/stm32l5-runtime-enforcement-policy.json'
      - 'data/device-catalog/research/stm32l5_runtime_enforcement.py'
      - 'data/device-catalog/research/stm32l5-security-state-model.json'
      - 'data/device-catalog/research/stm32l5_security_state_gate.py'
      - '.github/workflows/device-catalog-stm32l5-security-state-observer-debug-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/stm32l5-security-state-observer-debug-policy.json'
      - 'data/device-catalog/research/stm32l5_security_state_observer_debug.py'
      - 'data/device-catalog/research/validate_stm32l5_security_state_observer_debug_gate.py'
      - 'data/device-catalog/research/device-catalog-stm32l5-security-state-observer-debug-validation-gate.md'
      - 'data/device-catalog/research/stm32l5-runtime-enforcement-policy.json'
      - 'data/device-catalog/research/stm32l5_runtime_enforcement.py'
      - 'data/device-catalog/research/stm32l5-security-state-model.json'
      - 'data/device-catalog/research/stm32l5_security_state_gate.py'
      - '.github/workflows/device-catalog-stm32l5-security-state-observer-debug-validation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate observer/debug gate
        run: python data/device-catalog/research/validate_stm32l5_security_state_observer_debug_gate.py
      - name: Enforce zero Production writes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- data/device-catalog/production/)"
          test -z "$changed" || { echo "Production writes are forbidden in STM32L5 observer/debug validation:"; echo "$changed"; exit 1; }
