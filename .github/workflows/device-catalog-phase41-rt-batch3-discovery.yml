name: Device catalog Phase 4.1 R/T batch3 discovery

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-stm32f4-rt-batch3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser acquisition dependencies
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium
      - name: Acquire bounded official ST candidate set
        env:
          DISCOVERY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DISCOVERY_RUN_ID: ${{ github.run_id }}
        run: |
          xvfb-run -a python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path('data/device-catalog/research')
          out = Path('phase41-rt-batch3-discovery')
          out.mkdir(parents=True, exist_ok=True)
          sys.path.insert(0, str(root))

          from st_browser_acquisition import (
              BROWSER_TRANSPORT,
              CHROMIUM_LAUNCH_ARGS,
              STBrowserAcquirer,
              build_browser_evidence_record,
          )
          from stm32f4_acquisition_pilot import pilot_is_clean, read_catalog, read_manifest, run_pilot

          manifest = root / 'stm32f4-phase4.1-rt-admission-batch3-manifest.json'
          catalog = root / 'openocd-parts-canonical.csv'
          pilot_id, targets = read_manifest(manifest)
          catalog_rows = read_catalog(catalog)

          attempt_outcomes = []
          summary = None
          browser_version = None
          for attempt in range(1, 3):
              with STBrowserAcquirer(headless=False) as acquirer:
                  summary = run_pilot(
                      pilot_id=pilot_id,
                      targets=targets,
                      catalog_rows=catalog_rows,
                      fetcher=acquirer.fetch,
                      evidence_builder=build_browser_evidence_record,
                      timeout_seconds=45.0,
                  )
                  browser_version = acquirer.browser_version
              failed_targets = [
                  {'base_device': result.get('base_device'), 'error': result.get('error')}
                  for result in summary.get('results', [])
                  if result.get('acquisition_status') != 'success'
              ]
              outcome = {
                  'attempt': attempt,
                  'clean': pilot_is_clean(summary),
                  'acquisition_success': summary.get('acquisition_success'),
                  'acquisition_failure': summary.get('acquisition_failure'),
                  'failed_targets': failed_targets,
              }
              attempt_outcomes.append(outcome)
              print(json.dumps(outcome, indent=2, sort_keys=True))
              if pilot_is_clean(summary):
                  break
              if attempt == 1:
                  print('Transient discovery failure; retrying the whole bounded batch with a fresh browser.')

          assert summary is not None
          summary['acquisition_transport'] = BROWSER_TRANSPORT
          summary['browser_scope'] = 'discovery'
          summary['browser_runtime'] = {
              'engine': 'chromium',
              'browser_version': browser_version,
              'playwright_requirement': '1.62.0',
              'headless': False,
              'launch_args': CHROMIUM_LAUNCH_ARGS,
          }
          summary['canonical_dataset_admission'] = False
          summary['discovery_attempts'] = len(attempt_outcomes)
          summary['discovery_attempt_outcomes'] = attempt_outcomes
          summary['run_metadata'] = {
              'repository': 'physicslu/plasma',
              'head_sha': os.environ['DISCOVERY_HEAD_SHA'],
              'workflow_run_id': os.environ['DISCOVERY_RUN_ID'],
          }

          if not pilot_is_clean(summary):
              raise SystemExit('bounded ST discovery remains dirty after one whole-batch retry')

          observed = {}
          excluded = []
          for result in summary['results']:
              evidence = result['evidence']
              base = result['base_device']
              observed[base] = evidence['exact_icpns']
              excluded.extend(
                  {'base_device': base, **item}
                  for item in evidence.get('excluded_non_active_part_numbers', [])
              )

          admission_base_devices = [
              'STM32F411RC',
              'STM32F411RE',
              'STM32F413RG',
              'STM32F415RG',
          ]
          discovery = {
              'schema_version': 1,
              'pilot_id': pilot_id,
              'canonical_dataset_admission': False,
              'control_base_device': 'STM32F479ZG',
              'admission_base_devices': admission_base_devices,
              'observed_active_exact_icpns': observed,
              'excluded_non_active_observations': excluded,
              'active_candidate_count_including_control': sum(len(values) for values in observed.values()),
              'active_admission_candidate_count': sum(
                  len(values) for base, values in observed.items() if base != 'STM32F479ZG'
              ),
              'discovery_attempts': len(attempt_outcomes),
          }
          (out / 'pilot-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (out / 'discovery.json').write_text(
              json.dumps(discovery, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(discovery, indent=2, sort_keys=True))
          PY
      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase41-stm32f4-rt-batch3-discovery
          path: phase41-rt-batch3-discovery
          if-no-files-found: error
          retention-days: 7
