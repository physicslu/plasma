name: Device catalog Phase 4.2Z N/H TFBGA216 admission proposal
on:
  push:
    branches: [agent/device-catalog-phase4.2z-nh-tfbga216-admission]
    paths: [".github/workflows/device-catalog-phase42z-proposal.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  propose:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2z-nh-tfbga216-admission}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build proposal
        run: |
          mkdir -p /tmp/phase42z
          PYTHONPATH=data/device-catalog/research python data/device-catalog/research/stm32f4_admission.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2z-nh-tfbga216-admission-batch1-live-2026-09-04 \
            --baseline data/device-catalog/research/stm32f4-phase4.2z-nh-tfbga216-admission-baseline.json \
            --admit-base STM32F429NE --admit-base STM32F429NG --admit-base STM32F429NI --admit-base STM32F439NG --admit-base STM32F439NI \
            --output /tmp/phase42z/admission-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/phase42z/admission-plan.json').read_text())
          expected={'admit':7,'already_present':0,'manual_review_required':0,'reject':0}
          expected_icpns={'STM32F429NEH6','STM32F429NGH6','STM32F429NIH6','STM32F429NIH6TR','STM32F429NIH7','STM32F439NGH6','STM32F439NIH6'}
          if p['candidate_count'] != 7 or p['decision_counts'] != expected or p['conflicts'] != 0 or p['canonical_rows_before'] != 338:
              raise SystemExit('unclean Phase 4.2Z plan')
          if {x['icpn'] for x in p['candidates']} != expected_icpns:
              raise SystemExit('unexpected Phase 4.2Z candidate set')
          PY
          cd /tmp/phase42z && sha256sum admission-plan.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: {name: phase42z-nh-tfbga216-admission-proposal, path: /tmp/phase42z, if-no-files-found: error, retention-days: 30}
