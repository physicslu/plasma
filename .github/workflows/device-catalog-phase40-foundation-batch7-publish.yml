name: Device catalog Phase 4.0 foundation batch7 controlled publish

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  publish-stm32f4-foundation-batch7:
    if: github.event.pull_request.number == 266 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PROPOSAL_RUN_ID: "33371127532"
      PROPOSAL_ARTIFACT_ID: "9750084244"
      PROPOSAL_ZIP_SHA256: "30a58d96549602e55ee0a6d91d5326b0f67d074b553873ec0101b91ee9b71b93"
      EXPECTED_PLAN_SHA256: "60866cf5ccc91952efea82953efca64137273cef614c173fa5ae00e666cff288"
      EXPECTED_CSV_SHA256: "f7fbf1d8b6bcc7728f20dcb30c0b261e4b315459f05f76d6123308621f66a0a7"
      PRE_BATCH7_ROWS: "133"
      PRE_BATCH7_CSV_SHA256: "4a6bf6ffbf384ce3d9c91d318b6793c710d621d6f9e11f0a6c5b50206a5acb2a"
      PRE_BATCH7_GIT_BLOB: "434443479cd8a7d5b87b723a9fde93806c4faddd"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable proposal artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROPOSAL_ARTIFACT_ID}/zip" \
            --output /tmp/batch7-proposal.zip
          echo "${PROPOSAL_ZIP_SHA256}  /tmp/batch7-proposal.zip" | sha256sum --check --strict
          rm -rf /tmp/batch7-proposal
          mkdir -p /tmp/batch7-proposal
          unzip -q /tmp/batch7-proposal.zip -d /tmp/batch7-proposal
          echo "${EXPECTED_PLAN_SHA256}  /tmp/batch7-proposal/admission-plan.json" | sha256sum --check --strict
          echo "${EXPECTED_CSV_SHA256}  /tmp/batch7-proposal/stm32f4-commercial-icpn.proposed.csv" | sha256sum --check --strict
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('/tmp/batch7-proposal/admission-report.json').read_text(encoding='utf-8'))
          if report.get('plan_sha256') != os.environ['EXPECTED_PLAN_SHA256']:
              raise SystemExit('proposal report plan SHA mismatch')
          if report.get('proposed_csv_sha256') != os.environ['EXPECTED_CSV_SHA256']:
              raise SystemExit('proposal report CSV SHA mismatch')
          if report.get('source_rows') != 133 or report.get('proposed_rows') != 140:
              raise SystemExit(f'unexpected proposal row accounting: {report}')
          if len(report.get('added', [])) != 7 or len(set(report.get('added', []))) != 7:
              raise SystemExit(f'unexpected proposal added list: {report.get("added")}')
          PY

      - name: Rebuild proposal from retained evidence and verify immutable bindings
        run: |
          set -euo pipefail
          rm -rf /tmp/batch7-rebuild
          mkdir -p /tmp/batch7-rebuild
          python data/device-catalog/research/stm32f4_admission.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.0-foundation-batch7-live-2026-08-31 \
            --baseline data/device-catalog/research/stm32f4-phase4.0-foundation-batch7-baseline.json \
            --canonical data/device-catalog/research/stm32f4-commercial-icpn.csv \
            --admit-base STM32F439ZG \
            --admit-base STM32F439ZI \
            --output /tmp/batch7-rebuild/admission-plan.json
          echo "${EXPECTED_PLAN_SHA256}  /tmp/batch7-rebuild/admission-plan.json" | sha256sum --check --strict
          python - <<'PY'
          import json
          import os
          import shutil
          import sys
          from pathlib import Path
          root = Path('data/device-catalog/research')
          sys.path.insert(0, str(root))
          from device_catalog_admission_framework import write_canonical_dataset
          import validate_stm32f4_commercial_icpn as validator
          plan = json.loads(Path('/tmp/batch7-rebuild/admission-plan.json').read_text(encoding='utf-8'))
          expected = {'admit': 7, 'already_present': 0, 'manual_review_required': 0, 'reject': 0}
          if plan.get('candidate_count') != 7 or plan.get('decision_counts') != expected:
              raise SystemExit(f'unexpected rebuilt plan: {plan}')
          if plan.get('canonical_rows_before') != int(os.environ['PRE_BATCH7_ROWS']):
              raise SystemExit(f'unexpected pre-row count: {plan.get("canonical_rows_before")}')
          if plan.get('conflicts') != 0 or plan.get('issues') != []:
              raise SystemExit(f'unsafe rebuilt plan: {plan}')
          source = root / 'stm32f4-commercial-icpn.csv'
          proposed = Path('/tmp/batch7-rebuild/stm32f4-commercial-icpn.proposed.csv')
          shutil.copyfile(source, proposed)
          write_report = write_canonical_dataset(plan=plan, canonical_path=proposed)
          if write_report.get('status') != 'written' or write_report.get('rows_before') != 133 or write_report.get('rows_after') != 140:
              raise SystemExit(f'unexpected writer report: {write_report}')
          if len(write_report.get('added', [])) != 7:
              raise SystemExit(f'unexpected writer added list: {write_report}')
          validator.CANONICAL = proposed
          validation = validator.validate()
          if validation.get('errors') or validation.get('rows') != 140 or validation.get('unique_icpns') != 140:
              raise SystemExit(f'proposed validation failed: {validation}')
          PY
          echo "${EXPECTED_CSV_SHA256}  /tmp/batch7-rebuild/stm32f4-commercial-icpn.proposed.csv" | sha256sum --check --strict
          cmp /tmp/batch7-proposal/admission-plan.json /tmp/batch7-rebuild/admission-plan.json
          cmp /tmp/batch7-proposal/stm32f4-commercial-icpn.proposed.csv /tmp/batch7-rebuild/stm32f4-commercial-icpn.proposed.csv

      - name: Enforce production precondition and publish canonical bytes
        run: |
          set -euo pipefail
          canonical="data/device-catalog/research/stm32f4-commercial-icpn.csv"
          echo "${PRE_BATCH7_CSV_SHA256}  ${canonical}" | sha256sum --check --strict
          test "$(git hash-object "${canonical}")" = "${PRE_BATCH7_GIT_BLOB}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path('data/device-catalog/production/icpn-v1-manifest.json').read_text(encoding='utf-8'))
          source = next(item for item in payload['sources'] if item['family'] == 'STM32F4')
          expected = (int(os.environ['PRE_BATCH7_ROWS']), os.environ['PRE_BATCH7_CSV_SHA256'], os.environ['PRE_BATCH7_GIT_BLOB'])
          observed = (source['row_count'], source['sha256'], source['git_blob_sha'])
          if observed != expected:
              raise SystemExit(f'production manifest drifted: expected={expected} observed={observed}')
          PY
          cp /tmp/batch7-rebuild/stm32f4-commercial-icpn.proposed.csv "${canonical}"
          test "$(sha256sum "${canonical}" | awk '{print $1}')" = "${EXPECTED_CSV_SHA256}"

      - name: Update production manifest and admission audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          canonical = Path('data/device-catalog/research/stm32f4-commercial-icpn.csv')
          manifest_path = Path('data/device-catalog/production/icpn-v1-manifest.json')
          audit_path = Path('data/device-catalog/research/stm32f4-phase4.0-foundation-batch7-admission-audit.json')
          plan = json.loads(Path('/tmp/batch7-rebuild/admission-plan.json').read_text(encoding='utf-8'))
          proposal_report = json.loads(Path('/tmp/batch7-proposal/admission-report.json').read_text(encoding='utf-8'))
          added = proposal_report.get('added', [])
          if len(added) != 7 or len(set(added)) != 7:
              raise SystemExit(f'invalid immutable added list: {added}')
          csv_sha = hashlib.sha256(canonical.read_bytes()).hexdigest()
          git_blob = subprocess.check_output(['git', 'hash-object', str(canonical)], text=True).strip()
          if csv_sha != os.environ['EXPECTED_CSV_SHA256']:
              raise SystemExit('final CSV SHA mismatch')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          source = next(item for item in manifest['sources'] if item['family'] == 'STM32F4')
          source['row_count'] = 140
          source['sha256'] = csv_sha
          source['git_blob_sha'] = git_blob
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          audit = {
              'schema_version': 1,
              'phase': 'stm32f4-phase4.0-foundation-batch7',
              'canonical_dataset_written': True,
              'evidence_id': 'stm32f4-phase4.0-foundation-batch7-2026-08-31-retained-20260831T080025Z-feef382',
              'evidence_artifact_id': '9749987963',
              'proposal_workflow_run_id': os.environ['PROPOSAL_RUN_ID'],
              'proposal_artifact_id': os.environ['PROPOSAL_ARTIFACT_ID'],
              'admission_plan_sha256': os.environ['EXPECTED_PLAN_SHA256'],
              'pre_rows': 133,
              'post_rows': 140,
              'new_exact_icpns': 7,
              'decision_counts': plan['decision_counts'],
              'conflicts': plan['conflicts'],
              'issues': plan['issues'],
              'added': added,
              'pre_csv_sha256': os.environ['PRE_BATCH7_CSV_SHA256'],
              'pre_git_blob_sha': os.environ['PRE_BATCH7_GIT_BLOB'],
              'final_csv_sha256': csv_sha,
              'final_git_blob_sha': git_blob,
          }
          audit_path.write_text(json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(audit, indent=2, sort_keys=True))
          PY

      - name: Validate published production state
        env:
          PYTHONPATH: software/python
        run: |
          python data/device-catalog/research/validate_stm32f4_commercial_icpn.py
          python -m plasma_web.device_catalog \
            --manifest data/device-catalog/production/icpn-v1-manifest.json \
            --json

      - name: Remove one-shot publish workflow and commit controlled promotion
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/device-catalog-phase40-foundation-batch7-publish.yml
          git add \
            data/device-catalog/research/stm32f4-commercial-icpn.csv \
            data/device-catalog/production/icpn-v1-manifest.json \
            data/device-catalog/research/stm32f4-phase4.0-foundation-batch7-admission-audit.json \
            .github/workflows/device-catalog-phase40-foundation-batch7-publish.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "device-catalog: admit STM32F4 foundation batch7 ICPNs"
          git push origin "HEAD:${HEAD_REF}"
