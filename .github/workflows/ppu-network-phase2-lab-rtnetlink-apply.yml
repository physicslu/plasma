name: PPU Network Phase 2 lab rtnetlink apply

on:
  push:
    branches:
      - agent/ppu-network-phase2-safe-activation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ppu-network-phase2-safe-activation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded lab-helper fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('scripts/ppu-network-phase2-acceptance.py')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          if old not in text:
              raise SystemExit('expected bounded _set_ipv4 block not found; refusing to patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile scripts/ppu-network-phase2-acceptance.py
          git diff --check
      - name: Commit bounded fix
        shell: bash
        run: |
          if git diff --quiet -- scripts/ppu-network-phase2-acceptance.py; then
            echo 'No bounded change produced'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ppu-network-phase2-acceptance.py
          git commit -m 'fix: replace lab IPv4 with rtnetlink'
          git push origin HEAD:agent/ppu-network-phase2-safe-activation
