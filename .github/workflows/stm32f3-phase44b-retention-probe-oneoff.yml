name: STM32F3 Phase 4.4B retention probe one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f3-phase44b-discovery

permissions:
  contents: read

jobs:
  retention-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build retained package manifest
        env:
          PYTHONPATH: data/device-catalog/research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from device_catalog_evidence_framework import build_manifest, sha256

          research = Path('data/device-catalog/research')
          evidence = research / 'evidence/stm32f3-phase4.4b-official-st-discovery-live-2026-09-08'
          evidence_id = 'stm32f3-phase4.4b-official-st-discovery-2026-09-08-retained-20260908T083224Z-0ac86cbf'
          retained = ['README.md', 'pilot-summary.json', 'provenance.json']
          manifest = build_manifest(evidence, evidence_id=evidence_id, retained_files=retained)
          payload = {
              'manifest': manifest,
              'baseline_sha256': sha256(research / 'stm32f3-phase4.4b-discovery-baseline.json'),
          }
          print(json.dumps(payload, indent=2, sort_keys=True))
          Path('/tmp/stm32f3-phase4.4b-retention-final.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stm32f3-phase4.4b-retention-final
          path: /tmp/stm32f3-phase4.4b-retention-final.json
          retention-days: 2
