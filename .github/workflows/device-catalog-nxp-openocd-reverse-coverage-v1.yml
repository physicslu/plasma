name: NXP ADR-0002 bounded OpenOCD reverse coverage v1
on:
  pull_request:
    paths:
      - 'data/device-catalog/research/nxp-openocd-reverse-target-lock-v1.json'
      - 'data/device-catalog/research/nxp-openocd-reverse-coverage-v1.json'
      - 'data/device-catalog/research/nxp_adr0002_reverse_coverage_v1.py'
      - 'data/device-catalog/research/test_nxp_adr0002_reverse_coverage_v1.py'
      - 'data/device-catalog/research/NXP_ADR0002_REVERSE_COVERAGE_V1.md'
      - 'data/device-catalog/research/nxp-501-adr0002-core-transport-qualification-v10.csv'
      - 'data/device-catalog/research/nxp-official-bounded-snapshot-2026-10-13-v1.json'
      - 'data/device-catalog/research/nxp-adr0002-openocd-source-v9.json'
      - 'release/openocd.json'
      - '.github/workflows/device-catalog-nxp-openocd-reverse-coverage-v1.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/nxp-openocd-reverse-target-lock-v1.json'
      - 'data/device-catalog/research/nxp-openocd-reverse-coverage-v1.json'
      - 'data/device-catalog/research/nxp_adr0002_reverse_coverage_v1.py'
      - 'data/device-catalog/research/test_nxp_adr0002_reverse_coverage_v1.py'
      - '.github/workflows/device-catalog-nxp-openocd-reverse-coverage-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nxp-reverse-source-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministically replay bounded 501 versus 353 source inputs
        run: python data/device-catalog/research/nxp_adr0002_reverse_coverage_v1.py --check
      - name: Reject source SHA, input-scope and unreviewed P0/Active promotions
        run: python data/device-catalog/research/test_nxp_adr0002_reverse_coverage_v1.py -v
      - name: Preserve archived original OpenOCD first triage source contract
        run: python data/device-catalog/research/nxp_adr0002_openocd_triage_v9.py
