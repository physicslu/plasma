name: STM32F3 Layer-1 admission proposal v3.2
on:
  pull_request:
    paths:
      - 'data/device-catalog/research/prepare_stm32f3_layer1_admission_proposal_v32.py'
      - 'data/device-catalog/research/test_prepare_stm32f3_layer1_admission_proposal_v32.py'
      - 'data/device-catalog/research/stm32f3-layer1-admission-proposal-v3.2.json'
      - 'data/device-catalog/research/validate_stm32f3_layer1_proposal_lock_v32.py'
      - 'data/device-catalog/research/STM32F3_LAYER1_ADMISSION_PROPOSAL_V32.md'
      - '.github/workflows/device-catalog-stm32f3-layer1-proposal-v32.yml'
permissions:
  contents: read
jobs:
  proposal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate STM32F3 Layer-1 proposal
        run: |
          python data/device-catalog/research/prepare_stm32f3_layer1_admission_proposal_v32.py \
            --proposal /tmp/stm32f3-layer1-candidates-v32.csv \
            --summary /tmp/stm32f3-layer1-proposal-v32.json
          python -m unittest discover -s data/device-catalog/research \
            -p test_prepare_stm32f3_layer1_admission_proposal_v32.py -v
          python data/device-catalog/research/validate_stm32f3_layer1_proposal_lock_v32.py
      - uses: actions/upload-artifact@v4
        with:
          name: stm32f3-layer1-admission-proposal-v32
          path: |
            /tmp/stm32f3-layer1-candidates-v32.csv
            /tmp/stm32f3-layer1-proposal-v32.json
          if-no-files-found: error
          retention-days: 30
