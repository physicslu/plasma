name: NXP manufacturer device 353 exact bulk qualification v5

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/nxp_manufacturer_device_bulk_v5.py'
      - 'data/device-catalog/research/test_nxp_manufacturer_device_bulk_v5.py'
      - 'data/device-catalog/research/NXP_MANUFACTURER_DEVICE_BULK_V5.md'
      - 'data/device-catalog/research/nxp-212-manufacturer-device-evidence-v5.csv'
      - 'data/device-catalog/research/nxp-212-source-verified-commercial-v5.csv'
      - 'data/device-catalog/research/nxp-mcx-196-commercial-v5.csv'
      - 'data/device-catalog/research/nxp-k32l2-16-commercial-v5.csv'
      - 'data/device-catalog/research/nxp_official_expansion_v5.py'
      - 'data/device-catalog/research/nxp-official-expansion-pages-v5.json'
      - 'data/device-catalog/research/nxp-five-page-expanded-active-evidence-v5.csv'
      - '.github/workflows/device-catalog-nxp-manufacturer-bulk-v5.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-source-353-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4==4.14.2'
      - name: Check NXP manufacturer-only exact-SKU metadata parsing
        run: python -m unittest discover -s data/device-catalog/research -p 'test_nxp_manufacturer_device_bulk_v5.py' -v
      - uses: actions/download-artifact@v4
        with:
          run-id: 38337377867
          github-token: ${{ github.token }}
          pattern: nxp-part-metadata-shard-*
          path: /tmp/nxp-353-original-source
      - name: Replay 353 exact SKU and serialize source-backed 212 manufacturer candidates
        run: |
          python data/device-catalog/research/nxp_manufacturer_device_bulk_v5.py \
            --root /tmp/nxp-353-original-source \
            --output /tmp/nxp-353-manufacturer-v5 \
            --emit-marked-csv-stdout
          python - <<'PY'
          import csv,json
          from pathlib import Path
          output=Path("/tmp/nxp-353-manufacturer-v5")
          summary=json.loads((output/"nxp-212-evidence-summary-v5.json").read_text())
          with (output/"nxp-212-canonical-source-unpublished-v5.csv").open() as f:
              rows=list(csv.DictReader(f))
          import hashlib
          import subprocess
          canonical=output/"nxp-212-canonical-source-unpublished-v5.csv"
          device=output/"nxp-212-manufacturer-device-evidence-v5.csv"
          committed_canonical=Path("data/device-catalog/research/nxp-212-source-verified-commercial-v5.csv")
          committed_device=Path("data/device-catalog/research/nxp-212-manufacturer-device-evidence-v5.csv")
          assert canonical.read_bytes()==committed_canonical.read_bytes(), "staged 212 canonical CSV differs from original NXP HTML replay"
          assert device.read_bytes()==committed_device.read_bytes(), "staged manufacturer device evidence CSV differs from original NXP HTML replay"
          print("NXP_212_CANONICAL_SHA256="+hashlib.sha256(canonical.read_bytes()).hexdigest())
          print("NXP_212_DEVICE_SHA256="+hashlib.sha256(device.read_bytes()).hexdigest())
          print("NXP_212_CANONICAL_GIT_BLOB="+subprocess.check_output(["git","hash-object",str(committed_canonical)],text=True).strip())
          import io
          from collections import Counter
          for family, n, name in (
              ("MCX",196,"nxp-mcx-196-commercial-v5.csv"),
              ("K32L2",16,"nxp-k32l2-16-commercial-v5.csv")
          ):
              retained=Path("data/device-catalog/research")/name
              subset=[x for x in rows if x["family"]==family]
              assert len(subset)==n
              out=io.StringIO(newline="")
              w=csv.DictWriter(out,fieldnames=list(rows[0]),lineterminator="\n")
              w.writeheader();w.writerows(subset)
              encoded=out.getvalue().encode("utf-8")
              assert retained.read_bytes()==encoded, "source family split differs from manufacturer replay"
              print("NXP_V5_SOURCE_"+family+"_SHA256="+hashlib.sha256(encoded).hexdigest())
              print("NXP_V5_SOURCE_"+family+"_GIT_BLOB="+subprocess.check_output(
                  ["git","hash-object",str(retained)],text=True).strip())
          assert summary["full_bounded_active_exact"]==353
          assert summary["new_source_bound_four_field_candidates"]==len(rows)==212
          assert summary["unresolved_source_or_metadata_exact"]==129
          assert all(x["manufacturer"]=="NXP" and x["mapping_status"]=="no_mapping"
                     and not x["openocd_target_config"] for x in rows)
          assert summary["programming_profile_qualified"] is False
          assert summary["production_publication_authorized"] is False
          print("NXP 353 manufacturer-only exact source replay PASS: 212 source-qualified M0 candidates")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nxp-353-source-212-exact-manufacturer-v5-NOT-YET-PRODUCTION
          path: /tmp/nxp-353-manufacturer-v5/
          if-no-files-found: warn
          retention-days: 30

  expanded-official-exact-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Official exact lifecycle and package material declaration, five new NXP product pages
        run: |
          python data/device-catalog/research/nxp_official_expansion_v5.py --output /tmp/nxp-expanded-official-v5
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("/tmp/nxp-expanded-official-v5/nxp-five-page-discovery-summary-v5.json").read_text())
          assert report["source_pages_requested"]==5
          assert report["source_pages_verified"]+report["source_pages_blocked"]==5
          assert report["manufacturer_wide_population_complete"] is False
          assert report["manufacturer_wide_active_denominator"] is None
          assert report["production_publication_authorized"] is False
          print("NXP official 5-page exact Active Discovery batch checked")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nxp-five-new-product-pages-active-exact-discovery-v5
          path: /tmp/nxp-expanded-official-v5/
          if-no-files-found: warn
          retention-days: 30
