name: STM32WBA2X admission readiness validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32wba2x_admission_readiness.py'
      - 'data/device-catalog/research/validate_stm32wba2x_admission_readiness.py'
      - 'data/device-catalog/research/stm32wba2x-admission-readiness.json'
      - 'data/device-catalog/research/stm32wba2x-metadata-authority.json'
      - 'data/device-catalog/research/stm32wba2x-commercial-icpn.csv'
      - 'data/device-catalog/research/evidence/stm32wba2x-exact-icpn-live-2026-09-18/**'
      - '.github/workflows/device-catalog-stm32wba2x-admission-readiness-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'data/device-catalog/research/stm32wba2x_admission_readiness.py'
      - 'data/device-catalog/research/validate_stm32wba2x_admission_readiness.py'
      - 'data/device-catalog/research/stm32wba2x-admission-readiness.json'
      - 'data/device-catalog/research/stm32wba2x-metadata-authority.json'
      - 'data/device-catalog/research/stm32wba2x-commercial-icpn.csv'
      - 'data/device-catalog/research/evidence/stm32wba2x-exact-icpn-live-2026-09-18/**'
      - '.github/workflows/device-catalog-stm32wba2x-admission-readiness-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STM32WBA2X admission readiness
        run: python data/device-catalog/research/validate_stm32wba2x_admission_readiness.py
