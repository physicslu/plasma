name: STM32F7 Phase 4.6C permanent replay one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f7-phase46c-policy
    paths:
      - .github/workflows/device-catalog-stm32f7-phase46c-oneoff.yml

permissions:
  contents: read

jobs:
  permanent-policy-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay Phase 4.6B retained evidence
        run: python data/device-catalog/research/validate_stm32f7_phase4_6b_retained_evidence.py
      - name: Validate Phase 4.6C metadata decoding boundary
        run: python data/device-catalog/research/test_stm32f7_phase4_6c_policy.py
      - name: Validate Phase 4.6C frozen policy replay
        run: python data/device-catalog/research/test_stm32f7_phase4_6c_policy_plan.py
      - name: Replay exact Phase 4.6C policy baseline
        run: python data/device-catalog/research/stm32f7_phase4_6c_policy.py
      - name: Assert current Production remains unchanged by Phase 4.6C
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('data/device-catalog/production/icpn-v1-manifest.json').read_text())
          assert all(item.get('family') != 'STM32F7' for item in manifest['sources'])
          assert sum(int(item['row_count']) for item in manifest['sources']) == 544
          print('Phase 4.6C permanent replay PASS; current Production remains 544 exact ICPNs and STM32F7=0')
          PY
