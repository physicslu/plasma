name: STM32F7 Phase 4.6C metadata-policy one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f7-phase46c-policy
    paths:
      - .github/workflows/device-catalog-stm32f7-phase46c-oneoff.yml

permissions:
  contents: read

jobs:
  validate-policy-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay Phase 4.6B retained evidence
        run: python data/device-catalog/research/validate_stm32f7_phase4_6b_retained_evidence.py
      - name: Validate Phase 4.6C metadata boundary
        run: python data/device-catalog/research/test_stm32f7_phase4_6c_policy.py
      - name: Assert no STM32F7 Production publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('data/device-catalog/production/icpn-v1-manifest.json').read_text())
          assert all(x.get('family') != 'STM32F7' for x in manifest['sources'])
          assert sum(int(x['row_count']) for x in manifest['sources']) == 544
          print('Phase 4.6C boundary PASS; Production unchanged')
          PY
