name: NXP KL25 official commercial evidence accessibility validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/post-stm32-cross-vendor-pilot-selection.json'
      - 'data/device-catalog/research/nxp_kl25_official_accessibility_probe.py'
      - 'data/device-catalog/research/nxp-kl25-evidence-accessibility-gate.json'
      - 'data/device-catalog/research/validate_nxp_kl25_evidence_accessibility.py'
      - 'data/device-catalog/research/evidence/nxp-kl25-accessibility-live-2026-09-29/**'
      - 'data/ic-support/benchmarks/nxp-kl25/source-lock.json'
      - '.github/workflows/device-catalog-nxp-kl25-evidence-accessibility-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/post-stm32-cross-vendor-pilot-selection.json'
      - 'data/device-catalog/research/nxp_kl25_official_accessibility_probe.py'
      - 'data/device-catalog/research/nxp-kl25-evidence-accessibility-gate.json'
      - 'data/device-catalog/research/validate_nxp_kl25_evidence_accessibility.py'
      - 'data/device-catalog/research/evidence/nxp-kl25-accessibility-live-2026-09-29/**'
      - 'data/ic-support/benchmarks/nxp-kl25/source-lock.json'
      - '.github/workflows/device-catalog-nxp-kl25-evidence-accessibility-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install playwright
      - name: Validate retained NXP KL25 representative evidence
        run: python data/device-catalog/research/validate_nxp_kl25_evidence_accessibility.py
