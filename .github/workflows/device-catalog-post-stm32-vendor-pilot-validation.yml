name: Post-STM32 cross-vendor ICPN pilot selection validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/openocd-parts-canonical.csv'
      - 'data/device-catalog/research/select_post_stm32_vendor_pilot.py'
      - 'data/device-catalog/research/post-stm32-cross-vendor-pilot-selection.json'
      - 'data/device-catalog/research/validate_post_stm32_vendor_pilot.py'
      - 'data/ic-support/benchmarks/nxp-kl25/source-lock.json'
      - '.github/workflows/device-catalog-post-stm32-vendor-pilot-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/openocd-parts-canonical.csv'
      - 'data/device-catalog/research/select_post_stm32_vendor_pilot.py'
      - 'data/device-catalog/research/post-stm32-cross-vendor-pilot-selection.json'
      - 'data/device-catalog/research/validate_post_stm32_vendor_pilot.py'
      - 'data/ic-support/benchmarks/nxp-kl25/source-lock.json'
      - '.github/workflows/device-catalog-post-stm32-vendor-pilot-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded cross-vendor pilot
        run: python data/device-catalog/research/validate_post_stm32_vendor_pilot.py
