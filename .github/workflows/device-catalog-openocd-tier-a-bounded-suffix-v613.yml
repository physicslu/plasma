name: OpenOCD Tier A bounded suffix normalization v6.13

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/propose_openocd_tier_a_bounded_suffix_v613.py'
      - 'data/device-catalog/research/test_propose_openocd_tier_a_bounded_suffix_v613.py'
      - 'data/device-catalog/research/OPENOCD_TIER_A_BOUNDED_SUFFIX_V613.md'
      - '.github/workflows/device-catalog-openocd-tier-a-bounded-suffix-v613.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate exact-set suffix bridge
        run: |
          python data/device-catalog/research/propose_openocd_tier_a_bounded_suffix_v613.py \
            --output /tmp/openocd-tier-a-bounded-suffix-v6.13.json
          python -m unittest discover -s data/device-catalog/research \
            -p test_propose_openocd_tier_a_bounded_suffix_v613.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: openocd-tier-a-bounded-suffix-v613
          path: /tmp/openocd-tier-a-bounded-suffix-v6.13.json
          if-no-files-found: error
          retention-days: 30
