name: Device catalog Phase 4.0 foundation batch8 live evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  acquire-stm32f4-foundation-batch8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser acquisition dependencies
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium
      - name: Acquire baseline-locked official ST evidence
        env:
          LIVE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LIVE_RUN_ID: ${{ github.run_id }}
        run: |
          xvfb-run -a python - <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path('data/device-catalog/research')
          out = Path('phase40-foundation-batch8-retained')
          out.mkdir(parents=True, exist_ok=True)
          sys.path.insert(0, str(root))

          from st_browser_acquisition import (
              BROWSER_TRANSPORT,
              CHROMIUM_LAUNCH_ARGS,
              STBrowserAcquirer,
              build_browser_evidence_record,
          )
          from stm32f4_acquisition_pilot import pilot_is_clean, read_catalog, read_manifest, run_pilot

          manifest_path = root / 'stm32f4-phase4.0-foundation-batch8-manifest.json'
          baseline_path = root / 'stm32f4-phase4.0-foundation-batch8-baseline.json'
          catalog = root / 'openocd-parts-canonical.csv'
          pilot_id, targets = read_manifest(manifest_path)
          catalog_rows = read_catalog(catalog)
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          expected = {item['base_device']: item['exact_icpns'] for item in baseline['targets']}

          attempt_outcomes = []
          summary = None
          browser_version = None
          for attempt in range(1, 3):
              with STBrowserAcquirer(headless=False) as acquirer:
                  summary = run_pilot(
                      pilot_id=pilot_id,
                      targets=targets,
                      catalog_rows=catalog_rows,
                      fetcher=acquirer.fetch,
                      evidence_builder=build_browser_evidence_record,
                      timeout_seconds=45.0,
                  )
                  browser_version = acquirer.browser_version
              failed_targets = [
                  {
                      'base_device': result.get('base_device'),
                      'error': result.get('error'),
                  }
                  for result in summary.get('results', [])
                  if result.get('acquisition_status') != 'success'
              ]
              attempt_outcomes.append({
                  'attempt': attempt,
                  'clean': pilot_is_clean(summary),
                  'acquisition_success': summary.get('acquisition_success'),
                  'acquisition_failure': summary.get('acquisition_failure'),
                  'failed_targets': failed_targets,
              })
              if pilot_is_clean(summary):
                  break
              print('Transient live acquisition failure; retrying entire bounded batch with a fresh browser.')
              print(json.dumps(attempt_outcomes[-1], indent=2, sort_keys=True))

          assert summary is not None
          runtime = {
              'engine': 'chromium',
              'browser_version': browser_version,
              'playwright_requirement': '1.62.0',
              'headless': False,
              'launch_args': CHROMIUM_LAUNCH_ARGS,
          }
          summary['acquisition_transport'] = BROWSER_TRANSPORT
          summary['browser_scope'] = 'pilot'
          summary['browser_runtime'] = runtime
          summary['canonical_dataset_admission'] = False
          summary['live_acquisition_attempts'] = len(attempt_outcomes)
          summary['live_acquisition_attempt_outcomes'] = attempt_outcomes

          observed = {}
          excluded = []
          for result in summary.get('results', []):
              base = result.get('base_device')
              evidence = result.get('evidence') or {}
              observed[base] = evidence.get('exact_icpns', [])
              excluded.extend(
                  {'base_device': base, **item}
                  for item in evidence.get('excluded_non_active_part_numbers', [])
              )

          issues = []
          if not pilot_is_clean(summary):
              issues.append('live acquisition is not clean after bounded retry')
          if observed != expected:
              issues.append(f'candidate baseline drift: expected={expected!r} observed={observed!r}')
          expected_excluded = {
              (item['base_device'], item['icpn'], item['marketing_status'])
              for item in baseline['excluded_non_active_observations']
          }
          observed_excluded = {
              (item['base_device'], item['icpn'], str(item['marketing_status']).split()[0])
              for item in excluded
          }
          if observed_excluded != expected_excluded:
              issues.append(
                  f'non-active audit drift: expected={expected_excluded!r} observed={observed_excluded!r}'
              )

          if issues:
              print(json.dumps({'attempt_outcomes': attempt_outcomes}, indent=2, sort_keys=True))
              raise SystemExit('\n'.join(issues))

          control_result = next(
              result for result in summary['results'] if result['base_device'] == 'STM32F417VG'
          )
          control = {
              'schema_version': summary['schema_version'],
              'pilot_id': summary['pilot_id'],
              'attempted': 1,
              'acquisition_success': 1,
              'acquisition_failure': 0,
              'exact_icpn_candidates': len(control_result['evidence']['exact_icpns']),
              'canonical_mapping': {'unique': 1, 'ambiguous': 0, 'unmapped': 0},
              'openocd_cfg_mapping': {'mapped': 1, 'total': 1},
              'manual_intervention_required': 0,
              'results': [control_result],
              'acquisition_transport': BROWSER_TRANSPORT,
              'browser_scope': 'control',
              'browser_runtime': runtime,
              'canonical_dataset_admission': False,
          }
          (out / 'pilot-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (out / 'control-summary.json').write_text(
              json.dumps(control, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (out / 'non-active-audit.json').write_text(
              json.dumps(excluded, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
      - name: Evaluate locked candidate set
        env:
          LIVE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python data/device-catalog/research/evaluate_stm32f4_pilot.py \
            --summary phase40-foundation-batch8-retained/pilot-summary.json \
            --baseline data/device-catalog/research/stm32f4-phase4.0-foundation-batch8-baseline.json \
            --output phase40-foundation-batch8-retained/evaluation.json \
            --repository physicslu/plasma \
            --git-sha "$LIVE_HEAD_SHA"
      - name: Build retained evidence package
        run: |
          python - <<'PY'
          import hashlib
          import json
          import sys
          from datetime import datetime
          from pathlib import Path

          root = Path('data/device-catalog/research')
          out = Path('phase40-foundation-batch8-retained')
          sys.path.insert(0, str(root))
          from device_catalog_evidence_framework import build_manifest

          baseline_path = root / 'stm32f4-phase4.0-foundation-batch8-baseline.json'
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          summary = json.loads((out / 'pilot-summary.json').read_text(encoding='utf-8'))
          evaluation = json.loads((out / 'evaluation.json').read_text(encoding='utf-8'))
          excluded = json.loads((out / 'non-active-audit.json').read_text(encoding='utf-8'))
          head_sha = evaluation['run_metadata']['git_sha']
          first_time = summary['results'][0]['evidence']['retrieved_at_utc']
          stamp = datetime.fromisoformat(first_time.replace('Z', '+00:00')).strftime('%Y%m%dT%H%M%SZ')
          evidence_id = f"{baseline['pilot_id']}-retained-{stamp}-{head_sha[:7]}"
          times = [result['evidence']['retrieved_at_utc'] for result in summary['results']]

          provenance = {
              'schema_version': 1,
              'evidence_id': evidence_id,
              'manufacturer': 'STMicroelectronics',
              'source_repository': 'physicslu/plasma',
              'executed_git_sha': head_sha,
              'acquisition_transport': summary['acquisition_transport'],
              'headed': True,
              'playwright_version': summary['browser_runtime']['playwright_requirement'],
              'chromium_version': summary['browser_runtime']['browser_version'],
              'target_count': summary['attempted'],
              'acquisition_success': summary['acquisition_success'],
              'acquisition_failure': summary['acquisition_failure'],
              'exact_icpn_candidate_count': summary['exact_icpn_candidates'],
              'evaluator_result': evaluation['decision'],
              'scale_ready': evaluation['scale_ready'],
              'canonical_dataset_admission': False,
              'live_acquisition_attempts': summary['live_acquisition_attempts'],
              'live_acquisition_attempt_outcomes': summary['live_acquisition_attempt_outcomes'],
              'baseline': {
                  'pilot_id': baseline['pilot_id'],
                  'schema_version': baseline['schema_version'],
                  'sha256': hashlib.sha256(baseline_path.read_bytes()).hexdigest(),
              },
              'acquisition_time_utc': {
                  'control': times[0],
                  'pilot_first': times[0],
                  'pilot_last': times[-1],
              },
              'excluded_non_active_observations': excluded,
          }
          (out / 'provenance.json').write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (out / 'README.md').write_text(
              '# Retained STM32F4 Phase 4.0 foundation batch8 browser evidence\n\n'
              f'Evidence ID: `{evidence_id}`\n\n'
              f'- targets: {summary["attempted"]}\n'
              f'- exact ICPN candidates: {summary["exact_icpn_candidates"]}\n'
              f'- live acquisition attempts: {summary["live_acquisition_attempts"]}\n'
              '- mapping: deterministic OpenOCD ordering patterns\n'
              '- acquisition transport: `chromium_rendered_dom`\n'
              '- canonical dataset admission: false\n',
              encoding='utf-8',
          )
          (out / 'non-active-audit.json').unlink()
          retained_files = [
              'README.md',
              'control-summary.json',
              'evaluation.json',
              'pilot-summary.json',
              'provenance.json',
          ]
          manifest = build_manifest(out, evidence_id=evidence_id, retained_files=retained_files)
          (out / 'manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'evidence_id': evidence_id,
              'target_count': summary['attempted'],
              'exact_icpn_candidates': summary['exact_icpn_candidates'],
              'live_acquisition_attempts': summary['live_acquisition_attempts'],
              'scale_ready': evaluation['scale_ready'],
          }, indent=2, sort_keys=True))
          PY
      - name: Verify retained package offline
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir phase40-foundation-batch8-retained \
            --baseline data/device-catalog/research/stm32f4-phase4.0-foundation-batch8-baseline.json
      - name: Emit retained package bytes for repository retention
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          root = Path('phase40-foundation-batch8-retained')
          for name in ('README.md', 'control-summary.json', 'evaluation.json', 'pilot-summary.json', 'provenance.json', 'manifest.json'):
              encoded = base64.b64encode((root / name).read_bytes()).decode('ascii')
              print(f'RETAINED_FILE_BEGIN:{name}')
              print(encoded)
              print(f'RETAINED_FILE_END:{name}')
          PY
      - name: Upload retained evidence package
        uses: actions/upload-artifact@v4
        with:
          name: phase40-stm32f4-foundation-batch8-retained
          path: phase40-foundation-batch8-retained
          if-no-files-found: error
          retention-days: 7
