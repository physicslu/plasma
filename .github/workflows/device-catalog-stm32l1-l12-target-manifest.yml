name: STM32L1 L1.2 target manifest diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/device-catalog-stm32l1-l12-target-manifest.yml"

permissions:
  contents: read

jobs:
  target-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate deterministic target manifest
        run: |
          python data/device-catalog/research/stm32l1_phase_l1_2_discovery.py \
            --targets-output /tmp/stm32l1-l1.2-targets.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/stm32l1-l1.2-targets.json'))
          print('base_device_count=', p['base_device_count'])
          print('generation_pair_target_count=', p['generation_pair_target_count'])
          print('evidence_surface_count=', p['evidence_surface_count'])
          print('base_device_counts_by_subfamily=', p['base_device_counts_by_subfamily'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stm32l1-l12-target-manifest-${{ github.run_id }}
          path: /tmp/stm32l1-l1.2-targets.json
          retention-days: 7
