name: PLASMA Engineering protected claim one-shot canary (Issue 981)

# No general Dispatcher or Codex. No SWPC, Z2, LA2016 or DUT access.
on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - ".github/workflows/plasma-engineering-claim-canary.yml"
      - "scripts/plasma_engineering_claim_canary.py"
      - "scripts/tests/test_plasma_engineering_claim_canary.py"
      - "docs/development/plasma-engineering-claim-canary.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/plasma-engineering-claim-canary.yml"
      - "scripts/plasma_engineering_claim_canary.py"
      - "scripts/tests/test_plasma_engineering_claim_canary.py"
      - "docs/development/plasma-engineering-claim-canary.md"

permissions:
  contents: read

concurrency:
  group: plasma-claim-canary-981
  cancel-in-progress: false

jobs:
  contract:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Offline-only negative canary contract
        run: |
          python3 -m py_compile scripts/plasma_engineering_claim_canary.py scripts/tests/test_plasma_engineering_claim_canary.py
          python3 scripts/tests/test_plasma_engineering_claim_canary.py

  authorize:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'physicslu/plasma' &&
      github.actor == 'physicslu' &&
      github.event.issue.number == 981 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == '/plasma-dispatch claim-canary 981'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout pinned event main SHA without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify trusted owner, exact issue and immutable source
        run: |
          python3 scripts/plasma_engineering_claim_canary.py authorize --event "$GITHUB_EVENT_PATH"

  canary:
    needs: authorize
    if: ${{ needs.authorize.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout pinned event main SHA without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Protected GitHub ref create replay update delete and readback
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -m 0700 -p "$RUNNER_TEMP/plasma-claim-canary-$GITHUB_RUN_ID"
          python3 scripts/plasma_engineering_claim_canary.py run \
            --event "$GITHUB_EVENT_PATH" \
            --proposal specs/engineering-dispatch/claim-protection-ruleset-v1.json \
            --report "$RUNNER_TEMP/plasma-claim-canary-$GITHUB_RUN_ID/report.json"
      - name: Upload sanitized one-shot evidence even if denied
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plasma-claim-canary-981-${{ github.run_id }}
          path: ${{ runner.temp }}/plasma-claim-canary-${{ github.run_id }}/report.json
          if-no-files-found: warn
          retention-days: 14
