name: Device catalog Phase 4.2T controlled Production publish
on:
  push:
    branches: [agent/device-catalog-phase4.2t-f410tb-admission]
    paths: [".github/workflows/device-catalog-phase42t-publish.yml"]
  workflow_dispatch:
permissions: {actions: read, contents: write}
jobs:
  publish:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2t-f410tb-admission, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: phase42t-admission-proposal, path: /tmp/phase42t, repository: physicslu/plasma, run-id: 33741730096, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Publish exact bound proposal
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2t-f410tb-admission-live-2026-09-03 --baseline data/device-catalog/research/stm32f4-phase4.2t-f410tb-admission-baseline.json
          PYTHONPATH=data/device-catalog/research python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from device_catalog_admission_framework import read_csv,write_canonical_dataset
          from device_catalog_pipeline_framework import pipeline_plan_is_clean
          root=Path('data/device-catalog/research')
          canonical=root/'stm32f4-commercial-icpn.csv'
          evidence=root/'evidence/stm32f4-phase4.2t-f410tb-admission-live-2026-09-03'
          plan_out=root/'stm32f4-phase4.2t-f410tb-admission-plan.json'
          audit_out=root/'stm32f4-phase4.2t-f410tb-admission-audit.json'
          raw=Path('/tmp/phase42t/admission-plan.json').read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          if sha!='ea3f68cdaddfd99cae37483442ec5d5204bf6139fb363bcecd838a997446c61d': raise SystemExit('proposal hash mismatch')
          plan=json.loads(raw)
          expected={i['icpn'] for i in plan['candidates']}
          if expected!={'STM32F410TBY3TR','STM32F410TBY6TR','STM32F410TBY7TR'} or not pipeline_plan_is_clean(plan): raise SystemExit('unclean plan')
          _,rows=read_csv(canonical)
          if len(rows)!=304 or len({r['base_device'] for r in rows})!=100: raise SystemExit('pre-state mismatch')
          result=write_canonical_dataset(plan=plan,canonical_path=canonical)
          _,after=read_csv(canonical)
          if result['rows_after']!=307 or len({r['base_device'] for r in after})!=101: raise SystemExit('post-state mismatch')
          plan_out.write_bytes(raw)
          manifest=json.loads((evidence/'manifest.json').read_text())
          summary={
            'schema_version':1,
            'phase':'4.2T',
            'proposal_run_id':33741730096,
            'proposal_artifact_id':9887984179,
            'proposal_artifact_zip_sha256':'6df1b93f41535026a75bdbd6572a4b0359315f8be16ae25ddf92c7e17a5e818f',
            'admission_plan_sha256':sha,
            'retained_evidence_id':manifest['evidence_id'],
            'production_rows_before':304,
            'production_rows_after':307,
            'production_base_devices_before':100,
            'production_base_devices_after':101,
            'added_exact_icpns':sorted(expected),
            'lifecycle_exclusions':[],
            'canonical_csv_file_sha256':hashlib.sha256(canonical.read_bytes()).hexdigest(),
            'status':'published'
          }
          audit_out.write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2t-f410tb-admission-live-2026-09-03 --baseline data/device-catalog/research/stm32f4-phase4.2t-f410tb-admission-baseline.json
      - name: Commit publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/stm32f4-commercial-icpn.csv data/device-catalog/research/stm32f4-phase4.2t-f410tb-admission-plan.json data/device-catalog/research/stm32f4-phase4.2t-f410tb-admission-audit.json
          git commit -m 'device-catalog: admit Phase 4.2T STM32F410TB ICPNs'
          git push origin HEAD:agent/device-catalog-phase4.2t-f410tb-admission
