name: Device catalog Phase 4.2AG controlled Production publish
on:
  push:
    branches: [agent/device-catalog-phase4.2ag-ah-ufbga169-admission]
    paths: [".github/workflows/device-catalog-phase42ag-publish.yml"]
  workflow_dispatch:
permissions: {actions: read, contents: write}
jobs:
  publish:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2ag-ah-ufbga169-admission, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: phase42ag-ah-ufbga169-admission-proposal, path: /tmp/phase42ag, repository: physicslu/plasma, run-id: 33944452604, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Publish exact bound proposal
        run: |
          set -euo pipefail
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2ag-ah-ufbga169-admission-live-2026-09-05 --baseline data/device-catalog/research/stm32f4-phase4.2ag-ah-ufbga169-admission-baseline.json
          PYTHONPATH=data/device-catalog/research python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from device_catalog_admission_framework import read_csv,write_canonical_dataset
          from device_catalog_pipeline_framework import pipeline_plan_is_clean
          root=Path('data/device-catalog/research')
          canonical=root/'stm32f4-commercial-icpn.csv'
          evidence=root/'evidence/stm32f4-phase4.2ag-ah-ufbga169-admission-live-2026-09-05'
          plan_out=root/'stm32f4-phase4.2ag-ah-ufbga169-admission-plan.json'
          audit_out=root/'stm32f4-phase4.2ag-ah-ufbga169-admission-audit.json'
          raw=Path('/tmp/phase42ag/admission-plan.json').read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          if sha!='b2d8976f6562c1d7e7aee90f25e466399d4f72216161a14510bc4d4ef8ca4ad0': raise SystemExit('proposal hash mismatch')
          plan=json.loads(raw)
          expected={'STM32F427AGH6','STM32F427AIH6','STM32F427AIH6TR','STM32F429AGH6','STM32F429AGH6TR','STM32F429AIH6','STM32F437AIH6','STM32F437AIH6TR','STM32F439AIH6'}
          if {i['icpn'] for i in plan['candidates']}!=expected or not pipeline_plan_is_clean(plan): raise SystemExit('unclean plan')
          _,rows=read_csv(canonical)
          if len(rows)!=364 or len({r['base_device'] for r in rows})!=128: raise SystemExit('pre-state mismatch')
          result=write_canonical_dataset(plan=plan,canonical_path=canonical)
          _,after=read_csv(canonical)
          if result['rows_after']!=373 or len({r['base_device'] for r in after})!=134: raise SystemExit('post-state mismatch')
          plan_out.write_bytes(raw)
          manifest=json.loads((evidence/'manifest.json').read_text())
          if manifest['evidence_id']!='stm32f4-phase4.2ag-ah-ufbga169-admission-2026-09-05-retained-20260905T041556Z-bee616f': raise SystemExit('evidence id mismatch')
          pilot=json.loads((evidence/'pilot-summary.json').read_text())
          exclusions={i['icpn'] for r in pilot['results'] for i in r['evidence']['excluded_non_active_part_numbers']}
          if exclusions: raise SystemExit('unexpected lifecycle exclusions')
          summary={
            'schema_version':1,
            'phase':'4.2AG',
            'proposal_run_id':33944452604,
            'proposal_artifact_id':9962871328,
            'proposal_artifact_zip_sha256':'a82aaa78b3378b71fc48cfd2d04dc0f761293afa8cae34ecad9f1e28cdd42478',
            'admission_plan_sha256':sha,
            'retained_evidence_id':manifest['evidence_id'],
            'production_rows_before':364,
            'production_rows_after':373,
            'production_base_devices_before':128,
            'production_base_devices_after':134,
            'added_exact_icpns':sorted(expected),
            'lifecycle_exclusions':[],
            'canonical_csv_file_sha256':hashlib.sha256(canonical.read_bytes()).hexdigest(),
            'status':'published'
          }
          audit_out.write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2ag-ah-ufbga169-admission-live-2026-09-05 --baseline data/device-catalog/research/stm32f4-phase4.2ag-ah-ufbga169-admission-baseline.json
      - name: Commit publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/stm32f4-commercial-icpn.csv data/device-catalog/research/stm32f4-phase4.2ag-ah-ufbga169-admission-plan.json data/device-catalog/research/stm32f4-phase4.2ag-ah-ufbga169-admission-audit.json
          git commit -m 'device-catalog: admit Phase 4.2AG A/H UFBGA169 ICPNs'
          git push origin HEAD:agent/device-catalog-phase4.2ag-ah-ufbga169-admission
