name: STM32F3 Phase 4.4D freeze historical defaults one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f3-phase44d-publication
    paths:
      - .github/workflows/stm32f3-phase44d-freeze-historical-defaults-oneoff.yml

permissions:
  contents: write

jobs:
  freeze-defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-stm32f3-phase44d-publication
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Freeze historical Production boundary as the closed-phase default
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('data/device-catalog/research/stm32f3_phase4_4c_policy.py')
          text = p.read_text(encoding='utf-8')
          old = 'DEFAULT_PRODUCTION_MANIFEST = HERE.parent / "production" / "icpn-v1-manifest.json"\n'
          new = (
              'DEFAULT_PRODUCTION_MANIFEST = HERE / "stm32f3-phase4.4d-production-manifest-prestate.json"\n'
              'DEFAULT_PRODUCTION_MANIFEST_BINDING_NAME = "icpn-v1-manifest.json"\n'
          )
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '    production_manifest_binding_name: str | None = None,\n) -> dict[str, Any]:\n'
          new = '    production_manifest_binding_name: str | None = DEFAULT_PRODUCTION_MANIFEST_BINDING_NAME,\n) -> dict[str, Any]:\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '    production_manifest_binding_name: str | None = None,\n) -> tuple[dict[str, Any], dict[str, Any]]:\n'
          new = '    production_manifest_binding_name: str | None = DEFAULT_PRODUCTION_MANIFEST_BINDING_NAME,\n) -> tuple[dict[str, Any], dict[str, Any]]:\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('data/device-catalog/research/stm32f3_phase4_4d_admission.py')
          text = p.read_text(encoding='utf-8')
          old = '    DEFAULT_PRODUCTION_MANIFEST,\n'
          new = '    DEFAULT_PRODUCTION_MANIFEST,\n    DEFAULT_PRODUCTION_MANIFEST_BINDING_NAME,\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          old = '    production_manifest_binding_name: str | None = None,\n) -> dict[str, Any]:\n'
          new = '    production_manifest_binding_name: str | None = DEFAULT_PRODUCTION_MANIFEST_BINDING_NAME,\n) -> dict[str, Any]:\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          python data/device-catalog/research/test_stm32f3_phase4_4c_policy.py
      - name: Commit closed-phase defaults
        run: |
          git config user.name "plasma-ci"
          git config user.email "plasma-ci@users.noreply.github.com"
          git add data/device-catalog/research/stm32f3_phase4_4c_policy.py data/device-catalog/research/stm32f3_phase4_4d_admission.py
          git commit -m "device-catalog: freeze STM32F3 Phase 4.4D historical boundary"
          git push origin HEAD:agent/device-catalog-stm32f3-phase44d-publication
