name: OpenOCD Production bounded bridge v6.20 dry-run

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/prepare_openocd_production_transaction_v620.py'
      - 'data/device-catalog/research/test_prepare_openocd_production_transaction_v620.py'
      - 'data/device-catalog/research/OPENOCD_PRODUCTION_TRANSACTION_V620.md'
      - '.github/workflows/device-catalog-openocd-production-v620.yml'

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frozen bounded-bridge transaction package
        run: |
          python data/device-catalog/research/prepare_openocd_production_transaction_v620.py \
            --manifest-out /tmp/openocd-v620-transaction.json \
            --package-dir /tmp/openocd-v620-package
          python -m unittest discover -s data/device-catalog/research \
            -p test_prepare_openocd_production_transaction_v620.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: openocd-production-transaction-v620-dry-run
          path: |
            /tmp/openocd-v620-transaction.json
            /tmp/openocd-v620-package/
          if-no-files-found: error
          retention-days: 30
