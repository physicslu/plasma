name: Device catalog current validation

on:
  push:
    branches:
      - main
    paths:
      - "data/device-catalog/**"
      - "software/python/plasma_web/device_catalog.py"
      - ".github/workflows/device-catalog-current-validation.yml"
  pull_request:
    paths:
      - "data/device-catalog/**"
      - "software/python/plasma_web/device_catalog.py"
      - ".github/workflows/device-catalog-current-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-current-device-catalog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Phase 4.1 R/T batch4 retained evidence and post-admission replay
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.1-rt-admission-batch4-live-2026-09-02 \
            --baseline data/device-catalog/research/stm32f4-phase4.1-rt-admission-batch4-baseline.json
          python data/device-catalog/research/test_stm32f4_phase4_1_rt_admission_batch4_post_admission.py

      - name: Validate Phase 4.2A C/T LQFP48 policy delta and historical boundary
        run: |
          python data/device-catalog/research/test_stm32f4_phase4_2a_ct_lqfp48_policy.py
          python data/device-catalog/research/test_stm32f4_phase4_1_rt_policy.py

      - name: Validate Phase 4.2B STM32F410CB retained evidence
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2b-f410cb-admission-live-2026-09-02 \
            --baseline data/device-catalog/research/stm32f4-phase4.2b-f410cb-admission-baseline.json

      - name: Validate Phase 4.2B post-admission lifecycle
        run: python data/device-catalog/research/test_stm32f4_phase4_2b_f410cb_post_admission.py

      - name: Validate Phase 4.2D R/Y WLCSP64 policy
        run: python data/device-catalog/research/test_stm32f4_phase4_2d_ry_wlcsp64_policy.py

      - name: Validate Phase 4.2E0 P-option routing
        run: python data/device-catalog/research/test_stm32f4_phase4_2e0_p_option_routing.py

      - name: Validate Phase 4.2F STM32F412RE/RG post-admission replay
        run: python data/device-catalog/research/test_stm32f4_phase4_2f_f412re_rg_post_admission.py

      - name: Validate Phase 4.2H O/Y WLCSP90 policy
        run: python data/device-catalog/research/test_stm32f4_phase4_2h_oy_wlcsp90_policy.py

      - name: Validate Phase 4.2I STM32F405O/415OG post-admission replay
        run: python data/device-catalog/research/test_stm32f4_phase4_2i_f405o_f415og_post_admission.py

      - name: Validate Phase 4.2J I/HT176 policy
        run: python data/device-catalog/research/test_stm32f4_phase4_2j_i_ht_176_policy.py

      - name: Validate Phase 4.2K STM32F407/417 I-pin post-admission closure
        run: python data/device-catalog/research/test_stm32f4_phase4_2k_f407_f417_i_post_admission.py

      - name: Validate Phase 4.2L STM32F427/429 I-pin post-admission closure
        run: python data/device-catalog/research/test_stm32f4_phase4_2l_f427_f429_i_post_admission.py

      - name: Validate Phase 4.2M STM32F437/439 I-pin post-admission closure
        run: python data/device-catalog/research/test_stm32f4_phase4_2m_f437_f439_i_post_admission.py

      - name: Validate Phase 4.2N STM32F469/479 I-pin post-admission closure
        run: python data/device-catalog/research/test_stm32f4_phase4_2n_f469_f479_i_post_admission.py

      - name: Validate Phase 4.2O V/H UFBGA100 policy boundary
        run: python data/device-catalog/research/test_stm32f4_phase4_2o_vh_ufbga100_policy.py

      - name: Validate Phase 4.2P V/H batch1 post-admission closure
        run: python data/device-catalog/research/test_stm32f4_phase4_2p_vh_admission_batch1_post_admission.py

      - name: Validate Phase 4.2Q V/H batch2 retained evidence and post-admission closure
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2q-vh-admission-batch2-live-2026-09-03 \
            --baseline data/device-catalog/research/stm32f4-phase4.2q-vh-admission-batch2-baseline.json
          python data/device-catalog/research/test_stm32f4_phase4_2q_vh_admission_batch2_post_admission.py

      - name: Validate Phase 4.2S T/Y WLCSP36 policy boundary
        run: python data/device-catalog/research/test_stm32f4_phase4_2s_ty_wlcsp36_policy.py

      - name: Validate Phase 4.2T STM32F410TB retained evidence and post-admission closure
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2t-f410tb-admission-live-2026-09-03 \
            --baseline data/device-catalog/research/stm32f4-phase4.2t-f410tb-admission-baseline.json
          python data/device-catalog/research/test_stm32f4_phase4_2t_f410tb_post_admission.py

      - name: Validate Phase 4.2R H=1536 KiB flash-size policy boundary
        run: python data/device-catalog/research/test_stm32f4_phase4_2r_h1536_policy.py

      - name: Validate Phase 4.2U STM32F413 H retained evidence and post-admission closure
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2u-h-admission-batch1-live-2026-09-03 \
            --baseline data/device-catalog/research/stm32f4-phase4.2u-h-admission-batch1-baseline.json
          python data/device-catalog/research/test_stm32f4_phase4_2u_h_admission_batch1_post_admission.py

      - name: Validate Phase 4.2V STM32F423 H retained evidence and post-admission closure
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2v-h-admission-batch2-live-2026-09-03 \
            --baseline data/device-catalog/research/stm32f4-phase4.2v-h-admission-batch2-baseline.json
          python data/device-catalog/research/test_stm32f4_phase4_2v_h_admission_batch2_post_admission.py

      - name: Validate Phase 4.2W M/Y WLCSP81 policy boundary
        run: python data/device-catalog/research/test_stm32f4_phase4_2w_my_wlcsp81_policy.py
