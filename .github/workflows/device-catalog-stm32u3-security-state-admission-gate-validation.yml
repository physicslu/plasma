name: STM32U3 security-state admission gate validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32u3-security-state-model.json'
      - 'data/device-catalog/research/stm32u3_security_state_gate.py'
      - 'data/device-catalog/research/validate_stm32u3_security_state_admission_gate.py'
      - 'data/device-catalog/research/device-catalog-stm32u3-security-state-admission-gate.md'
      - 'data/device-catalog/research/stm32u3-security-scope-foundation.json'
      - 'data/device-catalog/research/stm32u3-canonical-admission-plan.json'
      - 'data/device-catalog/research/stm32u3_admission_policy.py'
      - 'data/device-catalog/research/stm32u3_metadata_policy.py'
      - '.github/workflows/device-catalog-stm32u3-security-state-admission-gate-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STM32U3 security-state admission gate
        working-directory: data/device-catalog/research
        run: python validate_stm32u3_security_state_admission_gate.py
