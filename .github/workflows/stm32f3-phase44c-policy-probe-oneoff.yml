name: STM32F3 Phase 4.4C policy probe one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f3-phase44c-policy

permissions:
  contents: read

jobs:
  policy-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Phase 4.4C policy regressions
        run: python data/device-catalog/research/test_stm32f3_phase4_4c_policy.py
      - name: Generate deterministic Phase 4.4C policy summary
        run: |
          python data/device-catalog/research/stm32f3_phase4_4c_policy.py \
            --skip-baseline-check \
            --output /tmp/stm32f3-phase4.4c-policy-baseline.json
          cat /tmp/stm32f3-phase4.4c-policy-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: stm32f3-phase4.4c-policy-probe
          path: /tmp/stm32f3-phase4.4c-policy-baseline.json
          retention-days: 2
