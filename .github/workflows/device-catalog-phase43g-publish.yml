name: Device catalog Phase 4.3G controlled STM32F2 batch-2 Production publish
on:
  push:
    branches: [agent/device-catalog-phase43e-stm32f2-batch2]
    paths: [".github/workflows/device-catalog-phase43g-publish.yml"]
  workflow_dispatch:
permissions: {actions: read, contents: write}
jobs:
  publish:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase43e-stm32f2-batch2, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: phase43g-stm32f2-admission-proposal, path: /tmp/phase43g, repository: physicslu/plasma, run-id: 34084714720, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Publish exact artifact-bound STM32F2 batch 2
        run: |
          PYTHONPATH=data/device-catalog/research python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from device_catalog_admission_framework import read_csv,write_canonical_dataset
          from stm32f2_phase4_3g_admission import admission_plan_is_clean

          root=Path('data/device-catalog/research')
          canonical=root/'stm32f2-commercial-icpn.csv'
          manifest_path=Path('data/device-catalog/production/icpn-v1-manifest.json')
          artifact_plan=Path('/tmp/phase43g/admission-plan.json')
          raw=artifact_plan.read_bytes()
          plan_sha=hashlib.sha256(raw).hexdigest()
          if plan_sha!='343350cc187254e63d7bd58f05f600bb822cf0f5df6279f506e093cae1179b65': raise SystemExit('proposal hash mismatch')
          plan=json.loads(raw)
          if not admission_plan_is_clean(plan): raise SystemExit('unclean Phase 4.3G plan')
          rebuilt=Path('/tmp/phase43g-rebuilt.json')
          subprocess.run(['python',str(root/'stm32f2_phase4_3g_admission.py'),'--output',str(rebuilt)],check=True)
          if rebuilt.read_bytes()!=raw: raise SystemExit('repository-local proposal rebuild mismatch')
          _,before=read_csv(canonical)
          if len(before)!=9: raise SystemExit('STM32F2 pre-state row count mismatch')
          manifest=json.loads(manifest_path.read_text())
          families={source['family']:source for source in manifest['sources']}
          if set(families)!={'STM32F1','STM32F2','STM32F4'}: raise SystemExit('Production family set mismatch')
          if {key:value['row_count'] for key,value in families.items()}!={'STM32F1':75,'STM32F2':9,'STM32F4':384}: raise SystemExit('Production manifest pre-state mismatch')
          result=write_canonical_dataset(plan=plan,canonical_path=canonical)
          _,after=read_csv(canonical)
          expected={item['icpn'] for item in plan['candidates']}
          if result['status']!='written' or len(after)!=22 or set(result['added'])!=expected: raise SystemExit('STM32F2 publish mismatch')
          if len({row['base_device'] for row in after})!=8: raise SystemExit('STM32F2 Base Device count mismatch')
          data=canonical.read_bytes()
          source=families['STM32F2']
          source.update({
            'row_count':22,
            'git_blob_sha':hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest(),
            'sha256':hashlib.sha256(data).hexdigest(),
          })
          manifest_path.write_text(json.dumps(manifest,indent=2)+'\n')
          (root/'stm32f2-phase4.3g-admission-plan.json').write_bytes(raw)
          audit={
            'schema_version':1,'phase':'4.3G','status':'published','proposal_run_id':34084714720,
            'proposal_artifact_id':10004806088,'proposal_artifact_zip_sha256':'a00dcca758c3cf9ace827772abe3b3115f58d591e47dfc81a9d60821ac1da261',
            'admission_plan_sha256':plan_sha,'production_exact_icpns_before':468,'production_exact_icpns_after':481,
            'production_family_count_before':3,'production_family_count_after':3,
            'production_base_devices_before':161,'production_base_devices_after':165,
            'stm32f2_rows_before':9,'stm32f2_rows_after':22,'stm32f2_base_devices_before':4,'stm32f2_base_devices_after':8,
            'added_exact_icpns':sorted(expected),'lifecycle_exclusions':[],
            'canonical_csv_file_sha256':source['sha256'],'canonical_csv_git_blob_sha':source['git_blob_sha'],
            'programming_algorithm_equivalence_claimed':False,'runtime_programming_support_claimed':False,
            'full_stm32f2_surface_covered':False,
          }
          (root/'stm32f2-phase4.3g-admission-audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit controlled publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/production/icpn-v1-manifest.json data/device-catalog/research/stm32f2-commercial-icpn.csv data/device-catalog/research/stm32f2-phase4.3g-admission-plan.json data/device-catalog/research/stm32f2-phase4.3g-admission-audit.json
          git commit -m 'device-catalog: admit Phase 4.3G STM32F2 batch-2 ICPNs'
          git push origin HEAD:agent/device-catalog-phase43e-stm32f2-batch2
