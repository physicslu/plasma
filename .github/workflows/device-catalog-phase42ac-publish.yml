name: Device catalog Phase 4.2AC controlled Production publish
on:
  push:
    branches: [agent/device-catalog-phase4.2ac-f410-x8-admission]
    paths: [".github/workflows/device-catalog-phase42ac-publish.yml"]
  workflow_dispatch:
permissions: {actions: read, contents: write}
jobs:
  publish:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2ac-f410-x8-admission, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: phase42ac-f410-x8-admission-proposal, path: /tmp/phase42ac, repository: physicslu/plasma, run-id: 33902426600, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Publish exact bound proposal
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2ac-f410-x8-admission-live-2026-09-05 --baseline data/device-catalog/research/stm32f4-phase4.2ac-f410-x8-admission-baseline.json
          PYTHONPATH=data/device-catalog/research python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from device_catalog_admission_framework import read_csv,write_canonical_dataset
          from device_catalog_pipeline_framework import pipeline_plan_is_clean
          root=Path('data/device-catalog/research')
          canonical=root/'stm32f4-commercial-icpn.csv'
          evidence=root/'evidence/stm32f4-phase4.2ac-f410-x8-admission-live-2026-09-05'
          plan_out=root/'stm32f4-phase4.2ac-f410-x8-admission-plan.json'
          audit_out=root/'stm32f4-phase4.2ac-f410-x8-admission-audit.json'
          raw=Path('/tmp/phase42ac/admission-plan.json').read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          if sha!='99ae4906573f168574c4ac6bce0b35b9e692a67a8d05183c020b96f5251b61a9': raise SystemExit('proposal hash mismatch')
          plan=json.loads(raw)
          expected={'STM32F410C8U6','STM32F410C8U6TR','STM32F410C8U7','STM32F410C8U7TR','STM32F410T8Y6TR'}
          if {i['icpn'] for i in plan['candidates']}!=expected or not pipeline_plan_is_clean(plan): raise SystemExit('unclean plan')
          _,rows=read_csv(canonical)
          if len(rows)!=352 or len({r['base_device'] for r in rows})!=124: raise SystemExit('pre-state mismatch')
          result=write_canonical_dataset(plan=plan,canonical_path=canonical)
          _,after=read_csv(canonical)
          if result['rows_after']!=357 or len({r['base_device'] for r in after})!=126: raise SystemExit('post-state mismatch')
          plan_out.write_bytes(raw)
          manifest=json.loads((evidence/'manifest.json').read_text())
          if manifest['evidence_id']!='stm32f4-phase4.2ac-f410-x8-admission-2026-09-05-retained-20260904T174206Z-160bb17': raise SystemExit('evidence id mismatch')
          pilot=json.loads((evidence/'pilot-summary.json').read_text())
          exclusions={i['icpn'] for r in pilot['results'] for i in r['evidence']['excluded_non_active_part_numbers']}
          if exclusions: raise SystemExit('unexpected lifecycle exclusions')
          summary={
            'schema_version':1,
            'phase':'4.2AC',
            'proposal_run_id':33902426600,
            'proposal_artifact_id':9948137100,
            'proposal_artifact_zip_sha256':'8b573829635247fcaee096df4e73826c31bfb08bf5a52e85a49970d83776f782',
            'admission_plan_sha256':sha,
            'retained_evidence_id':manifest['evidence_id'],
            'production_rows_before':352,
            'production_rows_after':357,
            'production_base_devices_before':124,
            'production_base_devices_after':126,
            'added_exact_icpns':sorted(expected),
            'lifecycle_exclusions':[],
            'canonical_csv_file_sha256':hashlib.sha256(canonical.read_bytes()).hexdigest(),
            'status':'published'
          }
          audit_out.write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2ac-f410-x8-admission-live-2026-09-05 --baseline data/device-catalog/research/stm32f4-phase4.2ac-f410-x8-admission-baseline.json
      - name: Commit publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/stm32f4-commercial-icpn.csv data/device-catalog/research/stm32f4-phase4.2ac-f410-x8-admission-plan.json data/device-catalog/research/stm32f4-phase4.2ac-f410-x8-admission-audit.json
          git commit -m 'device-catalog: admit Phase 4.2AC STM32F410 x8 ICPNs'
          git push origin HEAD:agent/device-catalog-phase4.2ac-f410-x8-admission
