name: TEMP STM32WBX live accessibility acquisition

on:
  push:
    branches:
      - agent/stm32wbx-evidence-accessibility

permissions:
  contents: read

concurrency:
  group: temp-stm32wbx-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded browser acquisition dependencies
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium

      - name: Run deterministic STM32WBX official-ST accessibility probe
        id: acquire
        continue-on-error: true
        run: |
          rm -rf .artifacts/stm32wbx-accessibility
          mkdir -p .artifacts/stm32wbx-accessibility
          xvfb-run -a python data/device-catalog/research/stm32wbx_evidence_accessibility_probe.py \
            --output-dir .artifacts/stm32wbx-accessibility \
            --delay-seconds 1.0 \
            --timeout-seconds 90

      - name: Emit retained candidate evidence to workflow log
        if: always() && hashFiles('.artifacts/stm32wbx-accessibility/*.json') != ''
        run: |
          python - <<'PY'
          import base64
          import pathlib
          root = pathlib.Path(".artifacts/stm32wbx-accessibility")
          for path in sorted(root.glob("*.json")):
              print(f"EVIDENCE_FILE_BEGIN {path.name}")
              print(base64.b64encode(path.read_bytes()).decode("ascii"))
              print(f"EVIDENCE_FILE_END {path.name}")
          PY

      - name: Upload candidate acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32wbx-accessibility-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: .artifacts/stm32wbx-accessibility/*.json

      - name: Enforce accessibility acquisition gate
        if: always()
        run: |
          if [ "${{ steps.acquire.outcome }}" != "success" ]; then
            echo "STM32WBX accessibility acquisition requires manual review." >&2
            exit 1
          fi
