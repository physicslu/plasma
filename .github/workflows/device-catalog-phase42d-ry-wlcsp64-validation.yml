name: Device catalog Phase 4.2D R/Y WLCSP64 policy

on:
  push:
    branches: [main]
    paths:
      - "data/device-catalog/**"
      - "software/python/plasma_web/device_catalog.py"
      - ".github/workflows/device-catalog-phase42d-ry-wlcsp64-validation.yml"
  pull_request:
    paths:
      - "data/device-catalog/**"
      - "software/python/plasma_web/device_catalog.py"
      - ".github/workflows/device-catalog-phase42d-ry-wlcsp64-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python data/device-catalog/research/test_stm32f4_phase4_2d_ry_wlcsp64_policy.py
