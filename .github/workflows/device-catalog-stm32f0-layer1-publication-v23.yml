name: STM32F0 Layer-1 Production publication v2.3

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32f0-commercial-icpn.csv'
      - 'data/device-catalog/research/stm32f0-layer1-production-publication-v2.3.json'
      - 'data/device-catalog/research/validate_stm32f0_layer1_publication_v23.py'
      - 'data/device-catalog/research/STM32F0_LAYER1_PRODUCTION_PUBLICATION_V23.md'
      - 'scripts/device-catalog-family-ci.py'
      - 'data/ic-support/test_coverage_inventory.py'
      - 'software/python/tests/test_device_catalog.py'
      - '.github/workflows/device-catalog-stm32f0-layer1-publication-v23.yml'

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved proposal reconstruction and Production graph
        run: |
          python data/device-catalog/research/validate_stm32f0_layer1_publication_v23.py
          python scripts/ci/device-catalog-production-invariants.py
          python data/ic-support/test_coverage_inventory.py
      - name: Install Python development package
        run: python -m pip install -e "./software/python[dev]"
      - name: Validate runtime Catalog semantics
        run: python -m pytest -q software/python/tests/test_device_catalog.py
