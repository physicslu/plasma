name: OpenOCD Tier A backend promotion proposal v6.6

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/prepare_openocd_tier_a_backend_promotion_v66.py'
      - 'data/device-catalog/research/test_prepare_openocd_tier_a_backend_promotion_v66.py'
      - 'data/device-catalog/research/OPENOCD_TIER_A_BACKEND_PROMOTION_PROPOSAL_V66.md'
      - 'data/device-catalog/research/openocd-tier-a-backend-promotion-proposal-v6.6.json'
      - 'data/device-catalog/research/validate_openocd_tier_a_promotion_lock_v66.py'
      - '.github/workflows/device-catalog-openocd-tier-a-promotion-v66.yml'

permissions:
  contents: read

jobs:
  proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate backend-promotion proposal
        run: |
          python data/device-catalog/research/prepare_openocd_tier_a_backend_promotion_v66.py \
            --delta /tmp/openocd-tier-a-v66-delta.csv \
            --summary /tmp/openocd-tier-a-v66-summary.json \
            --patched-dir /tmp/openocd-tier-a-v66-patched
          python -m unittest discover -s data/device-catalog/research \
            -p test_prepare_openocd_tier_a_backend_promotion_v66.py -v
          python data/device-catalog/research/validate_openocd_tier_a_promotion_lock_v66.py
      - uses: actions/upload-artifact@v4
        with:
          name: openocd-tier-a-backend-promotion-proposal-v66
          path: |
            /tmp/openocd-tier-a-v66-delta.csv
            /tmp/openocd-tier-a-v66-summary.json
            /tmp/openocd-tier-a-v66-patched/
          if-no-files-found: error
          retention-days: 30
