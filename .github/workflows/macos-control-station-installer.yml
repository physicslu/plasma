name: macOS Control Station installer acceptance

on:
  push:
    paths:
      - "packaging/macos/**"
      - "scripts/macos-control-station-pkg.py"
      - "scripts/macos-control-station-installer-acceptance.py"
      - "scripts/control-station-runtime.py"
      - "software/web/**"
      - "software/python/plasma_manager/**"
      - "software/python/pyproject.toml"
      - "software/python/tests/test_macos_control_station_installer.py"
      - "release/product.json"
      - ".github/workflows/macos-control-station-installer.yml"
      - "docs/deployment/**"
  pull_request:
    paths:
      - "packaging/macos/**"
      - "scripts/macos-control-station-pkg.py"
      - "scripts/macos-control-station-installer-acceptance.py"
      - "scripts/control-station-runtime.py"
      - "software/web/**"
      - "software/python/plasma_manager/**"
      - "software/python/pyproject.toml"
      - "software/python/tests/test_macos_control_station_installer.py"
      - "release/product.json"
      - ".github/workflows/macos-control-station-installer.yml"
      - "docs/deployment/**"

permissions:
  contents: read

jobs:
  macos-installer-pilot:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: software/web/package-lock.json
      - name: Install build/test dependencies
        run: python -m pip install ./software/python pytest
      - name: Install Web build dependencies
        working-directory: software/web
        run: npm ci
      - name: Build standalone Control Station Console
        working-directory: software/web
        run: npm run build:product
      - name: Build Control Station runtime
        run: >-
          python scripts/control-station-runtime.py build
          --standalone-console software/web/dist/standalone
          --output-dir "${{ runner.temp }}/plasma-control-station-runtime"
      - name: Run installer packaging regression tests
        run: >-
          python -m pytest -q
          software/python/tests/test_macos_control_station_installer.py
          software/python/tests/test_control_station_runtime.py
      - name: Build unsigned macOS installer pilot
        run: >-
          python scripts/macos-control-station-pkg.py
          --runtime-dir "${{ runner.temp }}/plasma-control-station-runtime"
          --output-dir "${{ runner.temp }}/plasma-macos-installer"
      - name: Expose stable external runtimes to installer pilot
        run: |
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$(command -v node)" /usr/local/bin/node
          sudo ln -sf "$(command -v python3)" /usr/local/bin/python3
          /usr/local/bin/node --version
          /usr/local/bin/python3 --version
      - name: Install, launch, restart, stop/start, and uninstall
        run: |
          PKG="$(find "${{ runner.temp }}/plasma-macos-installer" -maxdepth 1 -name '*.pkg' -print -quit)"
          test -n "$PKG"
          python scripts/macos-control-station-installer-acceptance.py --pkg "$PKG"
      - name: Upload unsigned installer pilot
        uses: actions/upload-artifact@v4
        with:
          name: plasma-control-station-macos-installer-pilot
          path: |
            ${{ runner.temp }}/plasma-macos-installer/*.pkg
            ${{ runner.temp }}/plasma-macos-installer/*.sha256
          if-no-files-found: error
          retention-days: 14
