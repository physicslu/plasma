name: STM32U3 security-state observer debug validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32u3-security-state-observer-debug-policy.json'
      - 'data/device-catalog/research/stm32u3_security_state_observer_debug.py'
      - 'data/device-catalog/research/validate_stm32u3_security_state_observer_debug_gate.py'
      - 'data/device-catalog/research/device-catalog-stm32u3-security-state-observer-debug-validation-gate.md'
      - 'data/device-catalog/research/stm32u3-runtime-enforcement-policy.json'
      - 'data/device-catalog/research/stm32u3_runtime_enforcement.py'
      - 'data/device-catalog/research/stm32u3-security-state-model.json'
      - 'data/device-catalog/research/stm32u3_security_state_gate.py'
      - '.github/workflows/device-catalog-stm32u3-security-state-observer-debug-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STM32U3 observer/debug gate
        working-directory: data/device-catalog/research
        run: python validate_stm32u3_security_state_observer_debug_gate.py
