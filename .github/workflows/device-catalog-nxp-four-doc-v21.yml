name: NXP Phase 1 four official exact SRAM tables v21
on:
  pull_request:
    paths:
      - 'data/device-catalog/research/nxp-54-exact-ordering-rows-v21.csv'
      - 'data/device-catalog/research/nxp-501-phase1-four-doc-enriched-v21.csv'
      - 'data/device-catalog/research/nxp-phase1-four-doc-coverage-v21.json'
      - 'data/device-catalog/research/nxp-phase1-exact-four-doc-lock-v21.json'
      - 'data/device-catalog/research/nxp_phase1_four_doc_v21.py'
      - 'data/device-catalog/research/test_nxp_phase1_four_doc_v21.py'
      - 'data/device-catalog/research/NXP_PHASE1_FOUR_DOC_V21.md'
      - '.github/workflows/device-catalog-nxp-four-doc-v21.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase1-official-four-exact-tables:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate 53 exact accepted RAM records against four NXP documents
        run: python data/device-catalog/research/nxp_phase1_four_doc_v21.py
      - name: Test RAM nominal vs ECC, identity and unchanged VDD
        run: python -m unittest discover -s data/device-catalog/research -p 'test_nxp_phase1_four_doc_v21.py' -v
