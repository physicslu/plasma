name: Device catalog Phase 4.1 R/T batch4 controlled publish

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  publish-stm32f4-rt-batch4:
    if: >-
      github.actor == 'physicslu' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/device-catalog-phase4.1-rt-admission-batch4'
    runs-on: ubuntu-latest
    env:
      RESEARCH: data/device-catalog/research
      EVIDENCE_DIR: data/device-catalog/research/evidence/stm32f4-phase4.1-rt-admission-batch4-live-2026-09-02
      BASELINE: data/device-catalog/research/stm32f4-phase4.1-rt-admission-batch4-baseline.json
      CANONICAL: data/device-catalog/research/stm32f4-commercial-icpn.csv
      PRODUCTION_MANIFEST: data/device-catalog/production/icpn-v1-manifest.json
      PROPOSAL_ARTIFACT_ID: '9827276583'
      PROPOSAL_ZIP_SHA256: 'f9503ac60347376347439682ec34000e9b8fb2121c434a2d4e9574528900f114'
      PLAN_SHA256: '05913c6bf5b1f35998208add33145ed0730a29d1be15480e1f527615b590f06c'
      PROPOSED_CSV_SHA256: '8339390cdafe1aee25cac8f3e371a09fbc01d57a243ad66f012bcb205b322cac'
      PRE_CSV_SHA256: 'c9f7709994c4894f335c9c07264149ffa25b1cbe11343eb667ec41dbc84be6d8'
      PRE_GIT_BLOB: '02af1f1557b2f2c1bb5429edeb09837111225d73'
      FINAL_GIT_BLOB: 'b6aaef8f8cafd0ad2d26b89dfc17c0f670bf8f77'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify production pre-state
        run: |
          set -euo pipefail
          echo "${PRE_CSV_SHA256}  ${CANONICAL}" | sha256sum -c -
          test "$(git hash-object "${CANONICAL}")" = "${PRE_GIT_BLOB}"
          python - <<'PY'
          import csv, json
          from pathlib import Path
          canonical = Path('data/device-catalog/research/stm32f4-commercial-icpn.csv')
          rows = list(csv.DictReader(canonical.open(newline='', encoding='utf-8')))
          assert len(rows) == 186
          manifest = json.loads(Path('data/device-catalog/production/icpn-v1-manifest.json').read_text())
          sources = {item['family']: item for item in manifest['sources']}
          assert sources['STM32F1']['row_count'] == 75
          assert sources['STM32F4']['row_count'] == 186
          assert sources['STM32F4']['sha256'] == 'c9f7709994c4894f335c9c07264149ffa25b1cbe11343eb667ec41dbc84be6d8'
          assert sources['STM32F4']['git_blob_sha'] == '02af1f1557b2f2c1bb5429edeb09837111225d73'
          assert sum(item['row_count'] for item in manifest['sources']) == 261
          PY
      - name: Download and verify immutable proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/proposal
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROPOSAL_ARTIFACT_ID}/zip" > /tmp/proposal.zip
          echo "${PROPOSAL_ZIP_SHA256}  /tmp/proposal.zip" | sha256sum -c -
          unzip -q /tmp/proposal.zip -d /tmp/proposal
          echo "${PLAN_SHA256}  /tmp/proposal/admission-plan.json" | sha256sum -c -
          echo "${PROPOSED_CSV_SHA256}  /tmp/proposal/stm32f4-commercial-icpn.proposed.csv" | sha256sum -c -
          test "$(git hash-object /tmp/proposal/stm32f4-commercial-icpn.proposed.csv)" = "${FINAL_GIT_BLOB}"
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/proposal/proposal-summary.json').read_text())
          plan = json.loads(Path('/tmp/proposal/admission-plan.json').read_text())
          assert summary['candidate_count'] == 8
          assert summary['decision_counts'] == {'admit': 8, 'already_present': 0, 'manual_review_required': 0, 'reject': 0}
          assert summary['conflicts'] == 0
          assert summary['canonical_rows_before'] == 186
          assert summary['canonical_rows_after'] == 194
          assert summary['admission_plan_sha256'] == '05913c6bf5b1f35998208add33145ed0730a29d1be15480e1f527615b590f06c'
          assert summary['proposed_csv_sha256'] == '8339390cdafe1aee25cac8f3e371a09fbc01d57a243ad66f012bcb205b322cac'
          assert plan['issues'] == []
          assert plan['conflicts'] == 0
          assert plan['inputs']['admission_base_devices'] == ['STM32F446RC', 'STM32F446RE']
          PY
      - name: Rebuild proposal from retained evidence
        run: |
          set -euo pipefail
          python "${RESEARCH}/validate_stm32f4_retained_evidence.py" --evidence-dir "${EVIDENCE_DIR}" --baseline "${BASELINE}"
          python "${RESEARCH}/stm32f4_admission.py" \
            --evidence-dir "${EVIDENCE_DIR}" --baseline "${BASELINE}" \
            --catalog "${RESEARCH}/openocd-parts-canonical.csv" --canonical "${CANONICAL}" \
            --admit-base STM32F446RC --admit-base STM32F446RE \
            --output /tmp/rebuilt-plan.json
          echo "${PLAN_SHA256}  /tmp/rebuilt-plan.json" | sha256sum -c -
          cmp /tmp/rebuilt-plan.json /tmp/proposal/admission-plan.json
          cp "${CANONICAL}" /tmp/rebuilt.csv
          python - <<'PY'
          import json, sys
          from pathlib import Path
          research = Path('data/device-catalog/research'); sys.path.insert(0, str(research))
          from device_catalog_admission_framework import write_canonical_dataset
          plan = json.loads(Path('/tmp/rebuilt-plan.json').read_text())
          result = write_canonical_dataset(plan=plan, canonical_path=Path('/tmp/rebuilt.csv'))
          assert result['status'] == 'written'
          assert result['rows_before'] == 186 and result['rows_after'] == 194
          assert len(result['added']) == 8
          PY
          echo "${PROPOSED_CSV_SHA256}  /tmp/rebuilt.csv" | sha256sum -c -
          cmp /tmp/rebuilt.csv /tmp/proposal/stm32f4-commercial-icpn.proposed.csv
      - name: Publish canonical dataset manifest and audit
        run: |
          set -euo pipefail
          cp /tmp/rebuilt.csv "${CANONICAL}"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest_path = Path('data/device-catalog/production/icpn-v1-manifest.json')
          manifest = json.loads(manifest_path.read_text())
          f4 = next(item for item in manifest['sources'] if item['family'] == 'STM32F4')
          assert f4['row_count'] == 186
          f4['row_count'] = 194
          f4['sha256'] = '8339390cdafe1aee25cac8f3e371a09fbc01d57a243ad66f012bcb205b322cac'
          f4['git_blob_sha'] = 'b6aaef8f8cafd0ad2d26b89dfc17c0f670bf8f77'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          proposal = json.loads(Path('/tmp/proposal/proposal-summary.json').read_text())
          audit = {
            'schema_version': 1,
            'phase': 'stm32f4-phase4.1-rt-admission-batch4',
            'evidence_id': proposal['evidence_id'],
            'evidence_artifact_id': '9827190036',
            'evidence_zip_sha256': '8a46be75ed83d442ad0acb7fa61c9bbdcb4785eda88271385ebb987c575ba726',
            'proposal_workflow_run_id': '33577825725',
            'proposal_artifact_id': '9827276583',
            'proposal_zip_sha256': 'f9503ac60347376347439682ec34000e9b8fb2121c434a2d4e9574528900f114',
            'admission_plan_sha256': proposal['admission_plan_sha256'],
            'decision_counts': proposal['decision_counts'],
            'conflicts': proposal['conflicts'],
            'issues': [],
            'pre_rows': 186, 'post_rows': 194, 'new_exact_icpns': 8,
            'added': proposal['added'], 'excluded_non_active': [],
            'pre_csv_sha256': 'c9f7709994c4894f335c9c07264149ffa25b1cbe11343eb667ec41dbc84be6d8',
            'pre_git_blob_sha': '02af1f1557b2f2c1bb5429edeb09837111225d73',
            'final_csv_sha256': '8339390cdafe1aee25cac8f3e371a09fbc01d57a243ad66f012bcb205b322cac',
            'final_git_blob_sha': 'b6aaef8f8cafd0ad2d26b89dfc17c0f670bf8f77',
            'canonical_dataset_written': True,
          }
          Path('data/device-catalog/research/stm32f4-phase4.1-rt-admission-batch4-admission-audit.json').write_text(json.dumps(audit, indent=2, sort_keys=True) + '\n')
          PY
          echo "${PROPOSED_CSV_SHA256}  ${CANONICAL}" | sha256sum -c -
          test "$(git hash-object "${CANONICAL}")" = "${FINAL_GIT_BLOB}"
      - name: Validate controlled post-state
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path
          rows = list(csv.DictReader(Path('data/device-catalog/research/stm32f4-commercial-icpn.csv').open(newline='', encoding='utf-8')))
          assert len(rows) == 194
          icpns = {r['icpn'] for r in rows}
          expected = {'STM32F446RCT6','STM32F446RCT6TR','STM32F446RCT7','STM32F446RCT7TR','STM32F446RET6','STM32F446RET6TR','STM32F446RET7','STM32F446RET7TR'}
          assert expected <= icpns
          manifest = json.loads(Path('data/device-catalog/production/icpn-v1-manifest.json').read_text())
          sources = {i['family']: i for i in manifest['sources']}
          assert sources['STM32F1']['row_count'] == 75
          assert sources['STM32F4']['row_count'] == 194
          assert sum(i['row_count'] for i in manifest['sources']) == 269
          PY
          python "${RESEARCH}/stm32f4_coverage_gap_inventory.py" --output /tmp/post.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/post.json').read_text())
          assert r['production']['exact_icpn_rows'] == 194
          assert r['production']['base_device_count'] == 67
          assert r['openocd_ordering_pattern_base_device_count'] == 149
          assert r['gap']['base_device_count'] == 82
          assert r['gap']['policy_ready_count'] == 0
          assert r['gap']['policy_blocked_count'] == 82
          assert r['gap']['policy_ready'] == []
          PY
      - name: Commit controlled publish
        run: |
          set -euo pipefail
          git config user.name 'Gordon'
          git config user.email 'physicslu@gmail.com'
          git add "${CANONICAL}" "${PRODUCTION_MANIFEST}" data/device-catalog/research/stm32f4-phase4.1-rt-admission-batch4-admission-audit.json
          git diff --cached --check
          git commit -m 'device-catalog: admit STM32F4 R/T batch4 exact ICPNs'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
