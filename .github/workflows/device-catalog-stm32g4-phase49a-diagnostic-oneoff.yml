name: STM32G4 Phase 4.9A diagnostic one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32g4-phase49a-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-stm32g4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect guarded STM32G4 source surface
        run: |
          python - <<'PY'
          import csv, json, re
          from collections import Counter, defaultdict
          from pathlib import Path

          path = Path('data/device-catalog/research/openocd-parts-canonical.csv')
          with path.open(newline='', encoding='utf-8') as f:
              rows = [r for r in csv.DictReader(f)
                      if r.get('vendor') == 'STMicroelectronics'
                      and r.get('plasma_series') == 'STM32G4']
          print('row_count=', len(rows))
          print('identifier_kinds=', json.dumps(Counter(r['identifier_kind'] for r in rows), sort_keys=True))
          print('target_configs=', json.dumps(Counter(r['target_config'] for r in rows), sort_keys=True))
          print('openocd_distribution=', json.dumps(Counter(r['openocd_distribution'] for r in rows), sort_keys=True))
          print('mapping_status=', json.dumps(Counter(r['mapping_status'] for r in rows), sort_keys=True))
          print('validation_status=', json.dumps(Counter(r['validation_status'] for r in rows), sort_keys=True))

          by_sub = defaultdict(Counter)
          parts_by_sub = defaultdict(list)
          for r in rows:
              by_sub[r['subfamily']][r['identifier_kind']] += 1
              parts_by_sub[r['subfamily']].append((r['part_number'], r['identifier_kind']))
          print('subfamily_kind_counts=')
          for sub in sorted(by_sub):
              print(sub, json.dumps(dict(sorted(by_sub[sub].items())), sort_keys=True))

          pat = re.compile(r'^(STM32G4[A-Z0-9]+)([A-Z])x$')
          print('deterministic_first_ordering_target_by_subfamily=')
          for sub in sorted(by_sub):
              candidates = []
              for pn, kind in parts_by_sub[sub]:
                  if kind != 'ordering_pattern':
                      continue
                  m = pat.fullmatch(pn)
                  if m:
                      candidates.append((m.group(1), pn))
              print(sub, json.dumps(sorted(candidates)[0] if candidates else None))

          print('non_ordering_rows=')
          for r in rows:
              if r['identifier_kind'] != 'ordering_pattern':
                  print(json.dumps({k: r[k] for k in ('subfamily','part_number','identifier_kind','target_config')}, sort_keys=True))
          PY
