name: PL SWD-05 Linux PS SWD transaction driver

on:
  pull_request:
    paths:
      - "software/python/plasma_interfaces/swd_transaction.py"
      - "software/python/plasma_interfaces/linux_mmio.py"
      - "pl/hil/swd04/native_qualify.py"
      - "pl/tests/test_mmio_z2_qualification.py"
      - "software/python/tests/test_swd_transaction_driver.py"
      - "software/python/tests/test_linux_mmio.py"
      - "docs/development/swd05-linux-swd-transaction-driver.md"
      - "docs/development/linux-mmio-backend-v1.md"
      - ".github/workflows/pl-swd05-linux-driver.yml"
  push:
    branches: [main]
    paths:
      - "software/python/plasma_interfaces/swd_transaction.py"
      - "software/python/plasma_interfaces/linux_mmio.py"
      - "pl/hil/swd04/native_qualify.py"
      - "pl/tests/test_mmio_z2_qualification.py"
      - "software/python/tests/test_swd_transaction_driver.py"
      - "software/python/tests/test_linux_mmio.py"
      - "docs/development/swd05-linux-swd-transaction-driver.md"
      - "docs/development/linux-mmio-backend-v1.md"
      - ".github/workflows/pl-swd05-linux-driver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swd05-host-driver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install software package and host test dependencies
        run: |
          python3 -m pip install -e ./software/python
          python3 -m pip install 'pytest==8.4.2'
      - name: Compile SWD-05, native MMIO and Z2 qualification CLI
        run: |
          python3 -m py_compile software/python/plasma_interfaces/swd_transaction.py software/python/plasma_interfaces/linux_mmio.py pl/hil/swd04/native_qualify.py
          python3 -m pl.hil.swd04.native_qualify --help
      - name: SWD-05, native MMIO and supervised Z2 qualification (host only)
        run: |
          python3 -m pytest -v software/python/tests/test_swd_transaction_driver.py software/python/tests/test_linux_mmio.py pl/tests/test_mmio_z2_qualification.py
      - name: Explicit acceptance boundary
        run: |
          echo "SWD05_HOST_MMIO_AND_Z2_GATE_TESTS_PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Host-only synthetic files / test doubles. No FPGA load, physical Z2 MMIO, OpenOCD adapter registration, external SWD pins or IC operations performed." >> "$GITHUB_STEP_SUMMARY"
