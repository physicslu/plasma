name: Device catalog Phase 4.2X controlled Production publish
on:
  push:
    branches: [agent/device-catalog-phase4.2x-my-wlcsp81-admission]
    paths: [".github/workflows/device-catalog-phase42x-publish.yml"]
  workflow_dispatch:
permissions: {actions: read, contents: write}
jobs:
  publish:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2x-my-wlcsp81-admission, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: phase42x-my-wlcsp81-admission-proposal, path: /tmp/phase42x, repository: physicslu/plasma, run-id: 33857494821, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Publish exact bound proposal
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2x-my-wlcsp81-admission-live-2026-09-04 --baseline data/device-catalog/research/stm32f4-phase4.2x-my-wlcsp81-admission-baseline.json
          PYTHONPATH=data/device-catalog/research python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from device_catalog_admission_framework import read_csv,write_canonical_dataset
          from device_catalog_pipeline_framework import pipeline_plan_is_clean
          root=Path('data/device-catalog/research')
          canonical=root/'stm32f4-commercial-icpn.csv'
          evidence=root/'evidence/stm32f4-phase4.2x-my-wlcsp81-admission-live-2026-09-04'
          plan_out=root/'stm32f4-phase4.2x-my-wlcsp81-admission-plan.json'
          audit_out=root/'stm32f4-phase4.2x-my-wlcsp81-admission-audit.json'
          raw=Path('/tmp/phase42x/admission-plan.json').read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          if sha!='a6789820fc0fd301556486342293bfc115538efc173211608c0e6f3ad9f4faba': raise SystemExit('proposal hash mismatch')
          plan=json.loads(raw)
          expected={'STM32F413MGY6TR','STM32F413MHY6TR','STM32F423MHY3TR','STM32F423MHY6TR','STM32F446MCY6TR','STM32F446MEY6MTR','STM32F446MEY6TR'}
          if {i['icpn'] for i in plan['candidates']}!=expected or not pipeline_plan_is_clean(plan): raise SystemExit('unclean plan')
          _,rows=read_csv(canonical)
          if len(rows)!=331 or len({r['base_device'] for r in rows})!=109: raise SystemExit('pre-state mismatch')
          result=write_canonical_dataset(plan=plan,canonical_path=canonical)
          _,after=read_csv(canonical)
          if result['rows_after']!=338 or len({r['base_device'] for r in after})!=114: raise SystemExit('post-state mismatch')
          plan_out.write_bytes(raw)
          manifest=json.loads((evidence/'manifest.json').read_text())
          if manifest['evidence_id']!='stm32f4-phase4.2x-my-wlcsp81-admission-2026-09-04-retained-20260904T091210Z-94f6bdf': raise SystemExit('evidence id mismatch')
          pilot=json.loads((evidence/'pilot-summary.json').read_text())
          exclusions={i['icpn'] for r in pilot['results'] for i in r['evidence']['excluded_non_active_part_numbers']}
          expected_exclusions={'STM32F413MGY3TR','STM32F413MHY3TR'}
          if exclusions!=expected_exclusions: raise SystemExit('lifecycle exclusion mismatch')
          if expected & exclusions: raise SystemExit('lifecycle exclusion admitted')
          summary={
            'schema_version':1,
            'phase':'4.2X',
            'proposal_run_id':33857494821,
            'proposal_artifact_id':9930758729,
            'proposal_artifact_zip_sha256':'fb617885b7a5477f9b6c51f18be98eb9da52ece9244f21093e416428fdc66484',
            'admission_plan_sha256':sha,
            'retained_evidence_id':manifest['evidence_id'],
            'production_rows_before':331,
            'production_rows_after':338,
            'production_base_devices_before':109,
            'production_base_devices_after':114,
            'added_exact_icpns':sorted(expected),
            'lifecycle_exclusions':sorted(exclusions),
            'canonical_csv_file_sha256':hashlib.sha256(canonical.read_bytes()).hexdigest(),
            'status':'published'
          }
          audit_out.write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2x-my-wlcsp81-admission-live-2026-09-04 --baseline data/device-catalog/research/stm32f4-phase4.2x-my-wlcsp81-admission-baseline.json
      - name: Commit publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/stm32f4-commercial-icpn.csv data/device-catalog/research/stm32f4-phase4.2x-my-wlcsp81-admission-plan.json data/device-catalog/research/stm32f4-phase4.2x-my-wlcsp81-admission-audit.json
          git commit -m 'device-catalog: admit Phase 4.2X M/Y WLCSP81 ICPNs'
          git push origin HEAD:agent/device-catalog-phase4.2x-my-wlcsp81-admission
