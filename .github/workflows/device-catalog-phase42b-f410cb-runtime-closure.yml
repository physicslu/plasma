name: Device catalog Phase 4.2B STM32F410CB runtime closure

on:
  pull_request:

permissions:
  contents: write

jobs:
  close-runtime-contract:
    if: >-
      github.actor == 'physicslu' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/device-catalog-phase4.2b-f410cb-admission'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-phase4.2b-f410cb-admission
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update bounded runtime expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog = Path('software/python/tests/test_device_catalog.py')
          text = catalog.read_text(encoding='utf-8')
          text = text.replace(
              'EXPECTED_PRODUCTION_CATALOG_SIZE = 269\nEXPECTED_STM32F4_CATALOG_SIZE = 194\n',
              'EXPECTED_PRODUCTION_CATALOG_SIZE = 274\nEXPECTED_STM32F4_CATALOG_SIZE = 199\n',
          )
          old = '    rt_batch4 = catalog.search("stm32f446ret7tr", limit=1)[0]\n    rt_batch4 = catalog.search("stm32f446ret7tr", limit=1)[0]\n'
          new = '    rt_batch4 = catalog.search("stm32f446ret7tr", limit=1)[0]\n    phase42b = catalog.search("stm32f410cbt6", limit=1)[0]\n'
          if old not in text:
              raise SystemExit('runtime insertion anchor not found')
          text = text.replace(old, new, 1)
          anchor = '''    assert rt_batch4.target_config == "tcl/target/stm32f4x.cfg"\n'''
          addition = '''    assert rt_batch4.target_config == "tcl/target/stm32f4x.cfg"\n    assert phase42b.identifier == "STM32F410CBT6"\n    assert phase42b.family == "STM32F4"\n    assert phase42b.package == "LQFP"\n    assert phase42b.pin_count == "48"\n    assert phase42b.flash_size == "128 KiB"\n    assert phase42b.target_config == "tcl/target/stm32f4x.cfg"\n'''
          if anchor not in text:
              raise SystemExit('runtime assertion anchor not found')
          text = text.replace(anchor, addition, 1)
          text = text.replace('full 194-row F4 family.', 'full 199-row F4 family.')
          catalog.write_text(text, encoding='utf-8')

          gateway = Path('software/python/tests/test_device_catalog_web_gateway.py')
          text = gateway.read_text(encoding='utf-8')
          text = text.replace('EXPECTED_PRODUCTION_CATALOG_SIZE = 269\n', 'EXPECTED_PRODUCTION_CATALOG_SIZE = 274\n', 1)
          marker = '    def test_research_only_identifier_is_not_exposed_by_production_search(self) -> None:\n'
          if marker not in text:
              raise SystemExit('gateway insertion anchor not found')
          test = '''    def test_phase42b_stm32f410cb_icpn_is_exposed_after_admission(self) -> None:\n        status, payload = self.request("/api/devices/search?q=STM32F410CBT6&limit=5")\n        self.assertEqual(status, 200)\n        self.assertEqual(payload["catalog_size"], EXPECTED_PRODUCTION_CATALOG_SIZE)\n        self.assertEqual(payload["count"], 1)\n        result = payload["results"][0]\n        self.assertEqual(result["icpn"], "STM32F410CBT6")\n        self.assertEqual(result["family"], "STM32F4")\n        self.assertEqual(result["package"], "LQFP")\n        self.assertEqual(result["pin_count"], "48")\n        self.assertEqual(result["flash_size"], "128 KiB")\n        self.assertEqual(result["backend"]["target_config"], "tcl/target/stm32f4x.cfg")\n\n'''
          text = text.replace(marker, test + marker, 1)
          gateway.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Install Python test dependencies
        run: python -m pip install -e './software/python[dev]'
      - name: Validate Phase 4.2B lifecycle and runtime contracts
        run: |
          python data/device-catalog/research/test_stm32f4_phase4_2b_f410cb_post_admission.py
          python data/device-catalog/research/test_stm32f4_phase4_2a_ct_lqfp48_policy.py
          pytest -q software/python/tests/test_device_catalog.py software/python/tests/test_device_catalog_web_gateway.py
      - name: Commit runtime contract closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add software/python/tests/test_device_catalog.py software/python/tests/test_device_catalog_web_gateway.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Runtime contract already closed.'
            exit 0
          fi
          git commit -m 'test: close STM32F410CB runtime catalog contract'
          git push origin HEAD:agent/device-catalog-phase4.2b-f410cb-admission
