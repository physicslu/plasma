name: Device catalog Phase 4.1 R/T batch2 retained artifact publish

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  publish-retained-evidence:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/device-catalog-phase4.1-rt-admission-batch2-retained'
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ID: '9801196525'
      ARTIFACT_SHA256: 'ebd6bcf6a7eaccbf69dabba72adcaed736bbf8c29952091fe73d9bc336468e5b'
      EVIDENCE_DIR: data/device-catalog/research/evidence/stm32f4-phase4.1-rt-admission-batch2-live-2026-09-01
      BASELINE: data/device-catalog/research/stm32f4-phase4.1-rt-admission-batch2-baseline.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable retained artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/retained.zip
          echo "${ARTIFACT_SHA256}  /tmp/retained.zip" | sha256sum -c -
          test ! -e "${EVIDENCE_DIR}"
          mkdir -p "${EVIDENCE_DIR}"
          unzip -q /tmp/retained.zip -d "${EVIDENCE_DIR}"
      - name: Validate retained evidence offline
        run: |
          set -euo pipefail
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir "${EVIDENCE_DIR}" \
            --baseline "${BASELINE}"
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = Path('data/device-catalog/research/evidence/stm32f4-phase4.1-rt-admission-batch2-live-2026-09-01')
          provenance = json.loads((evidence / 'provenance.json').read_text(encoding='utf-8'))
          evaluation = json.loads((evidence / 'evaluation.json').read_text(encoding='utf-8'))
          assert provenance['evidence_id'] == 'stm32f4-phase4.1-rt-admission-batch2-2026-09-01-retained-20260901T125059Z-4e0435d'
          assert provenance['workflow_run_id'] == '33509865291'
          assert provenance['live_acquisition_attempts'] == 1
          assert provenance['live_acquisition_attempt_outcomes'] == [{
              'attempt': 1,
              'clean': True,
              'acquisition_success': 6,
              'acquisition_failure': 0,
              'failed_targets': [],
          }]
          assert len(provenance['excluded_non_active_observations']) == 2
          assert evaluation['candidate_baseline_match'] is True
          assert evaluation['candidate_drift'] == []
          assert evaluation['observed_exact_icpn_candidates'] == 18
          assert evaluation['scale_ready'] is True
          PY
      - name: Record artifact binding
        run: |
          cat > data/device-catalog/research/stm32f4-phase4.1-rt-admission-batch2-retained-source.json <<'JSON'
          {
            "schema_version": 1,
            "workflow_run_id": "33509865291",
            "artifact_id": "9801196525",
            "artifact_name": "phase41-stm32f4-rt-batch2-retained",
            "artifact_sha256": "ebd6bcf6a7eaccbf69dabba72adcaed736bbf8c29952091fe73d9bc336468e5b",
            "evidence_id": "stm32f4-phase4.1-rt-admission-batch2-2026-09-01-retained-20260901T125059Z-4e0435d",
            "canonical_dataset_admission": false
          }
          JSON
      - name: Commit retained bytes and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'Gordon'
          git config user.email 'physicslu@gmail.com'
          git add "${EVIDENCE_DIR}" data/device-catalog/research/stm32f4-phase4.1-rt-admission-batch2-retained-source.json
          git rm .github/workflows/device-catalog-phase41-rt-batch2-retained-artifact-publish.yml
          git diff --cached --check
          git commit -m 'device-catalog: retain R/T batch2 official ST evidence'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
