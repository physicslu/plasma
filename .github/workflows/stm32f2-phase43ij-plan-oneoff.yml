name: STM32F2 Phase 4.3I/J plan one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f2-phase43ij-policy-admission

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate deterministic Phase 4.3I policy and 4.3J admission plans
        run: |
          set -euo pipefail
          python data/device-catalog/research/stm32f2_bounded_policy.py \
            --phase 4.3I \
            --skip-baseline-check \
            --output /tmp/stm32f2-phase4.3i-policy-baseline.json
          cp /tmp/stm32f2-phase4.3i-policy-baseline.json \
            data/device-catalog/research/stm32f2-phase4.3i-policy-baseline.json
          python data/device-catalog/research/stm32f2_bounded_admission.py \
            --phase 4.3J \
            --output /tmp/stm32f2-phase4.3j-admission-plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path('/tmp/stm32f2-phase4.3i-policy-baseline.json').read_text())
          plan = json.loads(Path('/tmp/stm32f2-phase4.3j-admission-plan.json').read_text())
          assert policy['candidate_count'] == 11
          assert policy['decision_counts'] == {
              'admit': 11,
              'already_present': 0,
              'manual_review_required': 0,
              'reject': 0,
          }
          assert plan['candidate_count'] == 11
          assert plan['decision_counts'] == policy['decision_counts']
          rows = {item['icpn']: item['proposed_canonical_row'] for item in plan['candidates']}
          assert rows['STM32F207IFH6']['flash_size'] == '768 KiB'
          assert rows['STM32F215VET6']['package'] == 'LQFP'
          assert rows['STM32F215VET6']['pin_count'] == '100'
          assert rows['STM32F205REY6TR']['package'] == 'WLCSP'
          assert rows['STM32F205REY6TR']['pin_count'] == '66'
          report = {
              'status': 'clean',
              'policy_phase': '4.3I',
              'admission_phase': '4.3J',
              'candidate_count': 11,
              'canonical_rows_before': plan['canonical_rows_before'],
              'canonical_rows_after_if_published': plan['canonical_rows_before'] + 11,
              'production_exact_icpns_before': plan['production_snapshot']['exact_icpn_count'],
              'production_exact_icpns_after_if_published': plan['production_snapshot']['exact_icpn_count'] + 11,
              'manual_review_required': 0,
              'reject': 0,
              'production_write_applied': False,
          }
          Path('/tmp/stm32f2-phase4.3ij-plan-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          PY
          cat /tmp/stm32f2-phase4.3ij-plan-report.json

      - name: Upload Phase 4.3I/J planning artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32f2-phase4.3ij-plan
          path: |
            /tmp/stm32f2-phase4.3i-policy-baseline.json
            /tmp/stm32f2-phase4.3j-admission-plan.json
            /tmp/stm32f2-phase4.3ij-plan-report.json
          retention-days: 7
