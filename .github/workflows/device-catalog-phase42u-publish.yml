name: Device catalog Phase 4.2U controlled Production publish
on:
  push:
    branches: [agent/device-catalog-phase4.2u-h-admission-batch1]
    paths: [".github/workflows/device-catalog-phase42u-publish.yml"]
  workflow_dispatch:
permissions: {actions: read, contents: write}
jobs:
  publish:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2u-h-admission-batch1, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: phase42u-h-batch1-admission-proposal, path: /tmp/phase42u, repository: physicslu/plasma, run-id: 33757105044, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Publish exact bound proposal
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2u-h-admission-batch1-live-2026-09-03 --baseline data/device-catalog/research/stm32f4-phase4.2u-h-admission-batch1-baseline.json
          PYTHONPATH=data/device-catalog/research python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from device_catalog_admission_framework import read_csv,write_canonical_dataset
          from device_catalog_pipeline_framework import pipeline_plan_is_clean
          root=Path('data/device-catalog/research')
          canonical=root/'stm32f4-commercial-icpn.csv'
          evidence=root/'evidence/stm32f4-phase4.2u-h-admission-batch1-live-2026-09-03'
          plan_out=root/'stm32f4-phase4.2u-h-admission-batch1-plan.json'
          audit_out=root/'stm32f4-phase4.2u-h-admission-batch1-audit.json'
          raw=Path('/tmp/phase42u/admission-plan.json').read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          if sha!='13251cba507dea125654da403d808382850b8b602921f5dbca1fd1790c8c8852': raise SystemExit('proposal hash mismatch')
          plan=json.loads(raw)
          expected={'STM32F413CHU3','STM32F413CHU3TR','STM32F413CHU6','STM32F413CHU6TR','STM32F413RHT3','STM32F413RHT6','STM32F413RHT6TR','STM32F413VHH3','STM32F413VHH6','STM32F413VHT6','STM32F413ZHJ6','STM32F413ZHJ6TR','STM32F413ZHT3','STM32F413ZHT6'}
          if {i['icpn'] for i in plan['candidates']}!=expected or not pipeline_plan_is_clean(plan): raise SystemExit('unclean plan')
          _,rows=read_csv(canonical)
          if len(rows)!=307 or len({r['base_device'] for r in rows})!=101: raise SystemExit('pre-state mismatch')
          result=write_canonical_dataset(plan=plan,canonical_path=canonical)
          _,after=read_csv(canonical)
          if result['rows_after']!=321 or len({r['base_device'] for r in after})!=105: raise SystemExit('post-state mismatch')
          plan_out.write_bytes(raw)
          manifest=json.loads((evidence/'manifest.json').read_text())
          pilot=json.loads((evidence/'pilot-summary.json').read_text())
          exclusions={i['icpn'] for r in pilot['results'] for i in r['evidence']['excluded_non_active_part_numbers']}
          if exclusions!={'STM32F413VHT3','STM32F413ZHJ3'}: raise SystemExit('lifecycle exclusion mismatch')
          summary={
            'schema_version':1,
            'phase':'4.2U',
            'proposal_run_id':33757105044,
            'proposal_artifact_id':9893881941,
            'proposal_artifact_zip_sha256':'bfe6f065b55165faad4f41d13ff11f6d6634ebbcf0525c49aec45fb33c1d369f',
            'admission_plan_sha256':sha,
            'retained_evidence_id':manifest['evidence_id'],
            'production_rows_before':307,
            'production_rows_after':321,
            'production_base_devices_before':101,
            'production_base_devices_after':105,
            'added_exact_icpns':sorted(expected),
            'lifecycle_exclusions':sorted(exclusions),
            'canonical_csv_file_sha256':hashlib.sha256(canonical.read_bytes()).hexdigest(),
            'status':'published'
          }
          audit_out.write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2u-h-admission-batch1-live-2026-09-03 --baseline data/device-catalog/research/stm32f4-phase4.2u-h-admission-batch1-baseline.json
      - name: Commit publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/stm32f4-commercial-icpn.csv data/device-catalog/research/stm32f4-phase4.2u-h-admission-batch1-plan.json data/device-catalog/research/stm32f4-phase4.2u-h-admission-batch1-audit.json
          git commit -m 'device-catalog: admit Phase 4.2U STM32F413 H ICPNs'
          git push origin HEAD:agent/device-catalog-phase4.2u-h-admission-batch1
