name: TEMP STM32WBA5X evidence remediation acquisition

on:
  push:
    branches:
      - agent/stm32wba5x-evidence-remediation

permissions:
  contents: read

concurrency:
  group: temp-stm32wba5x-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-remediation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded browser acquisition dependencies
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium

      - name: Run deterministic STM32WBA5X evidence remediation probe
        id: acquire
        continue-on-error: true
        run: |
          rm -rf .artifacts/stm32wba5x-remediation
          mkdir -p .artifacts/stm32wba5x-remediation
          xvfb-run -a python data/device-catalog/research/stm32wba5x_evidence_remediation_probe.py \
            --output-dir .artifacts/stm32wba5x-remediation \
            --delay-seconds 1.0 \
            --timeout-seconds 90

      - name: Emit remediation evidence to workflow log
        if: always() && hashFiles('.artifacts/stm32wba5x-remediation/*.json') != ''
        run: |
          python - <<'PY'
          import base64
          import pathlib
          root = pathlib.Path(".artifacts/stm32wba5x-remediation")
          for path in sorted(root.glob("*.json")):
              print(f"EVIDENCE_FILE_BEGIN {path.name}")
              print(base64.b64encode(path.read_bytes()).decode("ascii"))
              print(f"EVIDENCE_FILE_END {path.name}")
          PY

      - name: Upload remediation acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32wba5x-remediation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: .artifacts/stm32wba5x-remediation/*.json

      - name: Enforce remediation acquisition gate
        if: always()
        run: |
          if [ "${{ steps.acquire.outcome }}" != "success" ]; then
            echo "STM32WBA5X evidence remediation requires manual review." >&2
            exit 1
          fi
