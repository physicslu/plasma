name: PPU Fixed Unified 64KiB AXI/SWD Site1 Host RTL
on:
  pull_request:
    paths:
      - '.github/workflows/ppu-fixed-unified-axi-host.yml'
      - 'pl/rtl/bus/fixed_ppu_unified_axi_site1.sv'
      - 'pl/rtl/bus/fixed_fpga_swd_site_axi_lite.sv'
      - 'pl/rtl/bus/fixed_fpga_ppu_global_identity_axi_lite.sv'
      - 'pl/verification/test_fixed_ppu_unified_axi_rtl.py'
      - 'pl/verification/cocotb/test_fixed_ppu_unified_axi.py'
      - 'pl/tools/verification_evidence.py'
      - 'pl/verification/verification-result-v1.schema.json'
      - 'pl/tests/test_verification_evidence.py'
      - 'docs/architecture/plasma-verification-platform-v1.md'
      - 'pl/verification/cocotb/test_fixed_fpga_swd_site_axi.py'
      - 'software/python/plasma_interfaces/fixed_abi_swd.py'
      - 'pl/verification/models/fixed_swd_site_driver.py'
      - 'docs/architecture/fixed-ppu-unified-axi-site1-gate1.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-axi-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Icarus and Cocotb (Host-only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iverilog
          python -m pip install 'pytest==8.4.2' 'pytest-asyncio>=0.23' 'cocotb==1.9.2' 'cocotb-test==0.2.6' 'PyYAML>=6.0'
          python -m pip install -e ./software/python
      - name: Strict verification evidence Schema and negative contracts
        run: python -m pytest -q pl/tests/test_verification_evidence.py
      - name: Unified AXI SIM-2 Production PS Controller / RTL with measured receipt
        run: |
          python -m pl.tools.verification_evidence run \
            --stage SIM-2 \
            --suite pl/verification/test_fixed_ppu_unified_axi_rtl.py \
            --rtl-top fixed_ppu_unified_axi_site1 \
            --rtl-source pl/rtl/site/swd_waveform_engine.sv \
            --rtl-source pl/rtl/site/swd_transaction_master.sv \
            --rtl-source pl/rtl/bus/fixed_fpga_ppu_global_identity_axi_lite.sv \
            --rtl-source pl/rtl/bus/fixed_fpga_swd_site_axi_lite.sv \
            --rtl-source pl/rtl/bus/fixed_ppu_unified_axi_site1.sv \
            --driver-module plasma_interfaces.fixed_abi_swd.FixedABISWDController \
            --output-dir pl/build/verification/unified-sim2
      - name: Validate emitted SIM-2 receipt against current RTL sources
        run: |
          python -m pl.tools.verification_evidence validate \
            --receipt pl/build/verification/unified-sim2/verification-result.json \
            --verify-source
      - name: Standalone Identity and SWD regressions
        run: |
          python -m pytest -q pl/verification/test_fixed_ppu_global_identity_rtl.py
          python -m pytest -q pl/verification/test_fixed_fpga_swd_site_rtl.py
      - name: ABI/Host Driver admission contracts
        run: |
          python -m pl.tools.fixed_image_abi_contract pl/verification/fixed_image_abi_v1_gate1.json
          python -m pytest -q pl/tests/test_fixed_image_abi_contract.py pl/tests/test_fixed_swd_site_slice_source.py pl/tests/test_fixed_ppu_global_admission_host.py
      - name: Preserve SIM-2 measured evidence and diagnostics on PASS or FAIL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plasma-unified-sim2-evidence-${{ github.sha }}
          path: pl/build/verification/unified-sim2/
          if-no-files-found: warn
          retention-days: 14
