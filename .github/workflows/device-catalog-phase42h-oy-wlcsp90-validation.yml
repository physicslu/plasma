name: Device catalog Phase 4.2H O/Y WLCSP90 policy

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32f4_admission_policy.py'
      - 'data/device-catalog/research/stm32f4_coverage_gap_inventory.py'
      - 'data/device-catalog/research/test_stm32f4_phase4_1_rt_policy.py'
      - 'data/device-catalog/research/test_stm32f4_phase4_2h_oy_wlcsp90_policy.py'
      - '.github/workflows/device-catalog-phase42h-oy-wlcsp90-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'data/device-catalog/research/stm32f4_admission_policy.py'
      - 'data/device-catalog/research/stm32f4_coverage_gap_inventory.py'
      - 'data/device-catalog/research/test_stm32f4_phase4_1_rt_policy.py'
      - 'data/device-catalog/research/test_stm32f4_phase4_2h_oy_wlcsp90_policy.py'
      - '.github/workflows/device-catalog-phase42h-oy-wlcsp90-validation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Phase 4.2H O/Y policy and historical fail-closed boundary
        run: |
          python data/device-catalog/research/test_stm32f4_phase4_2h_oy_wlcsp90_policy.py
          python data/device-catalog/research/test_stm32f4_phase4_1_rt_policy.py
