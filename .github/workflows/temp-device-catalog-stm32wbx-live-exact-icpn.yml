name: TEMP STM32WBX live exact ICPN discovery

on:
  push:
    branches:
      - agent/stm32wbx-exact-icpn-discovery

permissions:
  contents: read

concurrency:
  group: temp-stm32wbx-exact-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded browser acquisition dependencies
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run deterministic STM32WBX exact ICPN discovery
        id: acquire
        continue-on-error: true
        run: |
          rm -rf .artifacts/stm32wbx-exact
          mkdir -p .artifacts/stm32wbx-exact
          xvfb-run -a python data/device-catalog/research/stm32wbx_exact_icpn_discovery.py \
            --output-dir .artifacts/stm32wbx-exact \
            --delay-seconds 1.0 \
            --timeout-seconds 90
      - name: Emit retained discovery evidence to workflow log
        if: always() && hashFiles('.artifacts/stm32wbx-exact/*.json') != ''
        run: |
          python - <<'PY'
          import base64
          import pathlib
          root = pathlib.Path(".artifacts/stm32wbx-exact")
          for path in sorted(root.glob("*.json")):
              print(f"EVIDENCE_FILE_BEGIN {path.name}")
              print(base64.b64encode(path.read_bytes()).decode("ascii"))
              print(f"EVIDENCE_FILE_END {path.name}")
          PY
      - name: Upload candidate discovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32wbx-exact-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: .artifacts/stm32wbx-exact/*.json
      - name: Enforce exact discovery gate
        if: always()
        run: |
          if [ "${{ steps.acquire.outcome }}" != "success" ]; then
            echo "STM32WBX exact ICPN discovery requires manual review." >&2
            exit 1
          fi
