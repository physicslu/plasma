name: TEMP STM32L4 L4.2 retained postprocess

on:
  push:
    branches:
      - agent/device-catalog-stm32l4-phase-l42-discovery
    paths:
      - "data/device-catalog/research/evidence/stm32l4-l4.2-official-st-discovery-live-2026-09-13/retained-manifest.json"

permissions:
  contents: write

concurrency:
  group: stm32l4-l42-postprocess
  cancel-in-progress: true

jobs:
  build-retained-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deterministic retained baseline and root manifest
        run: python data/device-catalog/research/build_stm32l4_phase_l4_2_retained_baseline.py
      - name: Commit generated retained contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/device-catalog/research/stm32l4-phase-l4.2-discovery-baseline.json \
                  data/device-catalog/research/stm32l4-phase-l4.2-discovery-manifest.json
          git commit -m "Freeze STM32L4 L4.2 retained discovery baseline"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:${{ github.ref_name }}
