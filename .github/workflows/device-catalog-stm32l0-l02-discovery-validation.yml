name: STM32L0 L0.2 discovery validation

on:
  pull_request:
    paths:
      - "data/device-catalog/research/stm32l0_phase_l0_1_foundation.py"
      - "data/device-catalog/research/stm32l0-phase-l0.1-foundation-baseline.json"
      - "data/device-catalog/research/stm32l0_phase_l0_2_discovery.py"
      - "data/device-catalog/research/run_stm32l0_phase_l0_2_discovery.py"
      - "data/device-catalog/research/test_stm32l0_phase_l0_2_discovery.py"
      - "data/device-catalog/research/validate_stm32l0_phase_l0_2_retained_evidence.py"
      - "data/device-catalog/research/stm32l0-phase-l0.2-discovery-manifest.json"
      - "data/device-catalog/research/stm32l0-phase-l0.2-discovery-baseline.json"
      - "data/device-catalog/research/evidence/stm32l0-l0.2-official-st-discovery-live-2026-09-12/**"
      - "data/device-catalog/research/openocd-parts-canonical.csv"
      - ".github/workflows/device-catalog-stm32l0-l02-discovery-validation.yml"
  push:
    branches: [main]
    paths:
      - "data/device-catalog/research/stm32l0_phase_l0_1_foundation.py"
      - "data/device-catalog/research/stm32l0-phase-l0.1-foundation-baseline.json"
      - "data/device-catalog/research/stm32l0_phase_l0_2_discovery.py"
      - "data/device-catalog/research/run_stm32l0_phase_l0_2_discovery.py"
      - "data/device-catalog/research/test_stm32l0_phase_l0_2_discovery.py"
      - "data/device-catalog/research/validate_stm32l0_phase_l0_2_retained_evidence.py"
      - "data/device-catalog/research/stm32l0-phase-l0.2-discovery-manifest.json"
      - "data/device-catalog/research/stm32l0-phase-l0.2-discovery-baseline.json"
      - "data/device-catalog/research/evidence/stm32l0-l0.2-official-st-discovery-live-2026-09-12/**"
      - "data/device-catalog/research/openocd-parts-canonical.csv"
      - ".github/workflows/device-catalog-stm32l0-l02-discovery-validation.yml"

permissions:
  contents: read

jobs:
  discovery-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run L0.2 negative controls
        run: python data/device-catalog/research/test_stm32l0_phase_l0_2_discovery.py
      - name: Replay deterministic Base Device manifest
        run: |
          python data/device-catalog/research/stm32l0_phase_l0_2_discovery.py \
            --targets-output /tmp/stm32l0-l0.2-targets.json >/tmp/stm32l0-l0.2-targets.stdout
          cmp /tmp/stm32l0-l0.2-targets.json data/device-catalog/research/stm32l0-phase-l0.2-discovery-manifest.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/stm32l0-l0.2-targets.json'))
          assert p['base_device_count'] == 99
          assert len(p['base_device_counts_by_subfamily']) == 16
          assert all(v is False for v in p['claims'].values())
          print('L0.2 deterministic manifest replay: PASS (99 Base Devices)')
          PY
      - name: Hard-lock retained manufacturer evidence
        run: python data/device-catalog/research/validate_stm32l0_phase_l0_2_retained_evidence.py
