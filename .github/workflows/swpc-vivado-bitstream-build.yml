name: SWPC Vivado Bitstream Build

# Persistent SWPC runner has access to a rootful Docker host.
# NEVER run checkout of unreviewed PR or arbitrary workflow ref here.
on:
  workflow_dispatch:

concurrency:
  group: swpc-vivado-bitstream-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trusted-main-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert reviewed code
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "physicslu/plasma"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$GITHUB_SHA"

  fpga-bitstream:
    needs: trusted-main-guard
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'physicslu/plasma' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, plasma-integration]
    timeout-minutes: 120
    env:
      VIVADO_SETTINGS64: /storage/tools/xilinx/2026.1/Vivado/settings64.sh
      PLASMA_VIVADO_JOBS: "4"
      PLASMA_BITSTREAM_VERSION: "0.1.0"

    steps:
      - name: Validate persistent-runner identity before checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REPOSITORY" = "physicslu/plasma"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(id -un)" = "plasma-ci"
          test "$(id -u)" -ne 0
          test "$(hostname)" = "SWPC"
          test "$RUNNER_NAME" = "SWPC-plasma-ci"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Revalidate source identity and installed Vivado
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f "$VIVADO_SETTINGS64"
          test -f /home/plasma-ci/.Xilinx/Xilinx.lic
          echo "Building exact main SHA: $GITHUB_SHA"
          echo "Runner: $RUNNER_NAME on $(hostname)"

      - name: Reproducible PS/PL Vivado build and report generation
        shell: bash
        run: |
          set -euo pipefail
          bash pl/projects/z2-swd-gpio/build-on-swpc.sh

      - name: Upload validated Bitstream / handoff / manifest
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plasma-z2-swd-bitstream-${{ github.sha }}
          path: |
            pl/build/z2-swd-gpio/artifacts/
            pl/build/z2-swd-gpio/reports/
          if-no-files-found: error
          retention-days: 14

      - name: Preserve Vivado diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plasma-z2-swd-vivado-logs-${{ github.run_id }}
          path: |
            pl/build/z2-swd-gpio/logs/
            pl/build/z2-swd-gpio/generated/build-identity.json
            pl/build/z2-swd-gpio/generated/identity-axi-base.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Record strict qualification boundary
        if: success()
        shell: bash
        run: |
          {
            echo "Vivado 2026.1 implementation / Bitstream: PASS"
            echo "Git commit: $GITHUB_SHA"
            echo "Board Files: pinned xupsh commit e02d6a3866b5465218f777168cdc51344ac94e07"
            echo "HIL / FPGA loading / target IC: NOT RUN"
          } >> "$GITHUB_STEP_SUMMARY"
