name: Device catalog Phase 4.2AA controlled Production publish
on:
  push:
    branches: [agent/device-catalog-phase4.2aa-nh-tfbga216-admission-batch2]
    paths: [".github/workflows/device-catalog-phase42aa-publish.yml"]
  workflow_dispatch:
permissions: {actions: read, contents: write}
jobs:
  publish:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2aa-nh-tfbga216-admission-batch2, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: phase42aa-nh-tfbga216-batch2-admission-proposal, path: /tmp/phase42aa, repository: physicslu/plasma, run-id: 33897829637, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Publish exact bound proposal
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2aa-nh-tfbga216-admission-batch2-live-2026-09-05 --baseline data/device-catalog/research/stm32f4-phase4.2aa-nh-tfbga216-admission-batch2-baseline.json
          PYTHONPATH=data/device-catalog/research python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from device_catalog_admission_framework import read_csv,write_canonical_dataset
          from device_catalog_pipeline_framework import pipeline_plan_is_clean
          root=Path('data/device-catalog/research')
          canonical=root/'stm32f4-commercial-icpn.csv'
          evidence=root/'evidence/stm32f4-phase4.2aa-nh-tfbga216-admission-batch2-live-2026-09-05'
          plan_out=root/'stm32f4-phase4.2aa-nh-tfbga216-admission-plan.json'
          audit_out=root/'stm32f4-phase4.2aa-nh-tfbga216-admission-audit.json'
          raw=Path('/tmp/phase42aa/admission-plan.json').read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          if sha!='3134a7efee2395c4d01f745c3e2624d311cb243967c2ed19917191ae488b79cd': raise SystemExit('proposal hash mismatch')
          plan=json.loads(raw)
          expected={'STM32F469NEH6','STM32F469NGH6','STM32F469NIH6','STM32F469NIH6TR','STM32F469NIH7','STM32F479NGH6','STM32F479NIH6'}
          if {i['icpn'] for i in plan['candidates']}!=expected or not pipeline_plan_is_clean(plan): raise SystemExit('unclean plan')
          _,rows=read_csv(canonical)
          if len(rows)!=345 or len({r['base_device'] for r in rows})!=119: raise SystemExit('pre-state mismatch')
          result=write_canonical_dataset(plan=plan,canonical_path=canonical)
          _,after=read_csv(canonical)
          if result['rows_after']!=352 or len({r['base_device'] for r in after})!=124: raise SystemExit('post-state mismatch')
          plan_out.write_bytes(raw)
          manifest=json.loads((evidence/'manifest.json').read_text())
          if manifest['evidence_id']!='stm32f4-phase4.2aa-nh-tfbga216-admission-batch2-2026-09-05-retained-20260904T164441Z-a465a62': raise SystemExit('evidence id mismatch')
          pilot=json.loads((evidence/'pilot-summary.json').read_text())
          exclusions={i['icpn'] for r in pilot['results'] for i in r['evidence']['excluded_non_active_part_numbers']}
          if exclusions: raise SystemExit('unexpected lifecycle exclusions')
          summary={
            'schema_version':1,
            'phase':'4.2AA',
            'proposal_run_id':33897829637,
            'proposal_artifact_id':9946427139,
            'proposal_artifact_zip_sha256':'b221918310c51c16d20f27903de5d779802bc6bd05062e31b03e252eff734cad',
            'admission_plan_sha256':sha,
            'retained_evidence_id':manifest['evidence_id'],
            'production_rows_before':345,
            'production_rows_after':352,
            'production_base_devices_before':119,
            'production_base_devices_after':124,
            'added_exact_icpns':sorted(expected),
            'lifecycle_exclusions':[],
            'canonical_csv_file_sha256':hashlib.sha256(canonical.read_bytes()).hexdigest(),
            'status':'published'
          }
          audit_out.write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2aa-nh-tfbga216-admission-batch2-live-2026-09-05 --baseline data/device-catalog/research/stm32f4-phase4.2aa-nh-tfbga216-admission-batch2-baseline.json
      - name: Commit publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/stm32f4-commercial-icpn.csv data/device-catalog/research/stm32f4-phase4.2aa-nh-tfbga216-admission-plan.json data/device-catalog/research/stm32f4-phase4.2aa-nh-tfbga216-admission-audit.json
          git commit -m 'device-catalog: admit Phase 4.2AA N/H TFBGA216 ICPNs'
          git push origin HEAD:agent/device-catalog-phase4.2aa-nh-tfbga216-admission-batch2
