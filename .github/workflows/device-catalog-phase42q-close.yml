name: Device catalog Phase 4.2Q permanent closure
on:
  push:
    branches: [agent/device-catalog-phase4.2q-vh-admission-batch2]
    paths: [".github/workflows/device-catalog-phase42q-close.yml"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  close:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2q-vh-admission-batch2, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Materialize non-workflow permanent Phase 4.2Q closure
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, hashlib, json, subprocess
          from pathlib import Path
          root=Path('data/device-catalog/research')
          evidence=root/'evidence/stm32f4-phase4.2q-vh-admission-batch2-live-2026-09-03'
          canonical=root/'stm32f4-commercial-icpn.csv'
          with canonical.open(newline='',encoding='utf-8') as f: rows=list(csv.DictReader(f))
          assert len(rows)==304 and len({r['base_device'] for r in rows})==100
          assert 'STM32F413VGH3' not in {r['icpn'] for r in rows}
          plan=evidence/'admission-plan.json'; audit=evidence/'publish-summary.json'
          assert hashlib.sha256(plan.read_bytes()).hexdigest()=='5e89433425228adf250ceda168eb4030638b9b5e3d07f5b79c1dd6afead9444b'
          a=json.loads(audit.read_text()); assert a['status']=='published' and a['production_rows_after']==304 and a['production_base_devices_after']==100 and a['lifecycle_exclusions']==['STM32F413VGH3']
          (root/'stm32f4-phase4.2q-vh-admission-batch2-plan.json').write_bytes(plan.read_bytes())
          (root/'stm32f4-phase4.2q-vh-admission-batch2-audit.json').write_bytes(audit.read_bytes())
          manifest_path=Path('data/device-catalog/production/icpn-v1-manifest.json')
          manifest=json.loads(manifest_path.read_text())
          f4=next(s for s in manifest['sources'] if s['manufacturer']=='STMicroelectronics' and s['family']=='STM32F4')
          f4['row_count']=304
          f4['git_blob_sha']=subprocess.check_output(['git','hash-object',str(canonical)],text=True).strip()
          f4['sha256']=hashlib.sha256(canonical.read_bytes()).hexdigest()
          manifest_path.write_text(json.dumps(manifest,indent=2)+'\n')
          replacements={
            Path('data/ic-support/test_coverage_inventory.py'):[
              ('metrics["exact_icpns"] == 358','metrics["exact_icpns"] == 379'),
              ('{"STM32F1": 75, "STM32F4": 283}','{"STM32F1": 75, "STM32F4": 304}'),
              ('metrics["base_devices"] == 114','metrics["base_devices"] == 118'),
              ('metrics["deterministic_openocd_exact_icpns"] == 358','metrics["deterministic_openocd_exact_icpns"] == 379'),
              ('metrics["unresolved_programming_profile_exact_icpns"] == 356','metrics["unresolved_programming_profile_exact_icpns"] == 377'),
            ],
            Path('software/python/tests/test_device_catalog.py'):[
              ('EXPECTED_PRODUCTION_CATALOG_SIZE = 358','EXPECTED_PRODUCTION_CATALOG_SIZE = 379'),
              ('EXPECTED_STM32F4_CATALOG_SIZE = 283','EXPECTED_STM32F4_CATALOG_SIZE = 304'),
            ],
            Path('software/python/tests/test_device_catalog_web_gateway.py'):[
              ('EXPECTED_PRODUCTION_CATALOG_SIZE = 358','EXPECTED_PRODUCTION_CATALOG_SIZE = 379'),
            ],
          }
          for path,repls in replacements.items():
              text=path.read_text()
              for old,new in repls:
                  if old not in text: raise SystemExit(f'missing expected closure token in {path}: {old}')
                  text=text.replace(old,new,1)
              path.write_text(text)
          PY
          cat > data/device-catalog/research/validate_stm32f4_phase4_2q_retained_evidence.py <<'PY'
          #!/usr/bin/env python3
          import json, shutil, subprocess, sys, tempfile
          from pathlib import Path
          HERE=Path(__file__).resolve().parent
          SRC=HERE/'evidence/stm32f4-phase4.2q-vh-admission-batch2-live-2026-09-03'
          BASELINE=HERE/'stm32f4-phase4.2q-vh-admission-batch2-baseline.json'
          VALIDATOR=HERE/'validate_stm32f4_retained_evidence.py'
          manifest=json.loads((SRC/'manifest.json').read_text())
          with tempfile.TemporaryDirectory(prefix='phase42q-retained-') as td:
              dst=Path(td)
              shutil.copy2(SRC/'manifest.json',dst/'manifest.json')
              for entry in manifest['files']:
                  rel=Path(entry['path']); target=dst/rel; target.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(SRC/rel,target)
              subprocess.run([sys.executable,str(VALIDATOR),'--evidence-dir',str(dst),'--baseline',str(BASELINE)],check=True)
          print('Phase 4.2Q retained-evidence replay PASS')
          PY
          cat > data/device-catalog/research/test_stm32f4_phase4_2q_vh_admission_batch2_post_admission.py <<'PY'
          #!/usr/bin/env python3
          import csv, hashlib, json
          from pathlib import Path
          HERE=Path(__file__).resolve().parent
          UFBGA={"STM32F411VEH6","STM32F411VEH6TR","STM32F412VEH3TR","STM32F412VEH6","STM32F412VEH6TR","STM32F412VGH6","STM32F412VGH6TR","STM32F413VGH6"}
          LQFP={"STM32F411VET6","STM32F411VET6TR","STM32F412VET3","STM32F412VET3TR","STM32F412VET6","STM32F412VET6TR","STM32F412VGT6","STM32F412VGT6TR","STM32F412VGT7","STM32F413VGT3","STM32F413VGT3TR","STM32F413VGT6","STM32F413VGT6TR"}
          EXPECTED=UFBGA|LQFP
          plan=HERE/'stm32f4-phase4.2q-vh-admission-batch2-plan.json'; audit=HERE/'stm32f4-phase4.2q-vh-admission-batch2-audit.json'
          with (HERE/'stm32f4-commercial-icpn.csv').open(newline='',encoding='utf-8') as f: rows=list(csv.DictReader(f))
          assert len(rows)>=304 and len(rows)==len({r['icpn'] for r in rows})
          by={r['icpn']:r for r in rows}; assert EXPECTED<=set(by); assert 'STM32F413VGH3' not in by
          assert all(by[x]['openocd_target_config']=='tcl/target/stm32f4x.cfg' and by[x]['pin_count']=='100' for x in EXPECTED)
          assert all(by[x]['package']=='UFBGA' for x in UFBGA) and all(by[x]['package']=='LQFP' for x in LQFP)
          p=json.loads(plan.read_text()); assert hashlib.sha256(plan.read_bytes()).hexdigest()=='5e89433425228adf250ceda168eb4030638b9b5e3d07f5b79c1dd6afead9444b'
          assert p['decision_counts']=={'admit':21,'already_present':0,'manual_review_required':0,'reject':0} and {x['icpn'] for x in p['candidates']}==EXPECTED
          a=json.loads(audit.read_text()); assert a['status']=='published' and set(a['added_exact_icpns'])==EXPECTED and a['lifecycle_exclusions']==['STM32F413VGH3']
          print('Phase 4.2Q post-admission closure PASS')
          PY
          cat > software/python/tests/test_device_catalog_phase42q.py <<'PY'
          from __future__ import annotations
          import json, threading
          from http.client import HTTPConnection
          from http.server import ThreadingHTTPServer
          from plasma_web.device_catalog import get_default_device_catalog
          from plasma_web.gateway import PlasmaWebHandler
          EXPECTED_MIN_PRODUCTION_CATALOG_SIZE=379
          UFBGA_ICPN='STM32F412VEH3TR'; LQFP_ICPN='STM32F413VGT6TR'
          def test_phase42q_exact_icpns_are_resolved_by_runtime_catalog() -> None:
              catalog=get_default_device_catalog(); assert catalog.size>=EXPECTED_MIN_PRODUCTION_CATALOG_SIZE
              for icpn,package,flash_size in ((UFBGA_ICPN,'UFBGA','512 KiB'),(LQFP_ICPN,'LQFP','1024 KiB')):
                  matches=catalog.search(icpn.lower(),limit=5); assert {r.icpn for r in matches}=={icpn}
                  row=matches[0]; assert row.package==package and row.pin_count=='100' and row.flash_size==flash_size and row.target_config=='tcl/target/stm32f4x.cfg' and row.production_admitted
          def test_phase42q_exact_icpn_is_exposed_by_rest_catalog() -> None:
              server=ThreadingHTTPServer(('127.0.0.1',0),PlasmaWebHandler); thread=threading.Thread(target=server.serve_forever,daemon=True); thread.start()
              try:
                  connection=HTTPConnection('127.0.0.1',server.server_port); connection.request('GET',f'/api/devices/search?q={UFBGA_ICPN}&limit=5'); response=connection.getresponse(); payload=json.loads(response.read()); connection.close()
                  assert response.status==200 and payload['rest_contract_version']=='3' and payload['catalog_size']>=EXPECTED_MIN_PRODUCTION_CATALOG_SIZE and payload['count']==1
                  result=payload['results'][0]; assert result['icpn']==UFBGA_ICPN and result['package']=='UFBGA' and result['pin_count']=='100' and result['flash_size']=='512 KiB' and result['backend']['target_config']=='tcl/target/stm32f4x.cfg' and result['catalog']['scope']=='production_admitted'
              finally:
                  server.shutdown(); server.server_close(); thread.join()
          PY
      - name: Validate non-workflow permanent closure before commit
        run: |
          python data/device-catalog/research/validate_stm32f4_phase4_2q_retained_evidence.py
          python data/device-catalog/research/test_stm32f4_phase4_2q_vh_admission_batch2_post_admission.py
          python data/ic-support/test_coverage_inventory.py
          python -m compileall -q software/python/tests/test_device_catalog_phase42q.py
      - name: Commit non-workflow permanent closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/production/icpn-v1-manifest.json data/device-catalog/research/stm32f4-phase4.2q-vh-admission-batch2-plan.json data/device-catalog/research/stm32f4-phase4.2q-vh-admission-batch2-audit.json data/device-catalog/research/validate_stm32f4_phase4_2q_retained_evidence.py data/device-catalog/research/test_stm32f4_phase4_2q_vh_admission_batch2_post_admission.py data/ic-support/test_coverage_inventory.py software/python/tests/test_device_catalog.py software/python/tests/test_device_catalog_web_gateway.py software/python/tests/test_device_catalog_phase42q.py
          git commit -m 'device-catalog: close Phase 4.2Q V/H batch2 data and runtime'
          git push origin HEAD:agent/device-catalog-phase4.2q-vh-admission-batch2
