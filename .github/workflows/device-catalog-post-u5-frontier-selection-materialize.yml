name: Device catalog post-U5 frontier selection materialization

on:
  push:
    branches:
      - agent/post-u5-frontier-selection
    paths:
      - 'data/device-catalog/research/stm32_post_u5_frontier_selection.py'
      - '.github/workflows/device-catalog-post-u5-frontier-selection-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-u5-frontier-selection
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render deterministic post-U5 frontier selection
        run: python data/device-catalog/research/stm32_post_u5_frontier_selection.py --output data/device-catalog/research/stm32-post-u5-frontier-selection.json
      - name: Commit deterministic selection
        run: |
          if git diff --quiet -- data/device-catalog/research/stm32-post-u5-frontier-selection.json; then
            echo 'Selection already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/stm32-post-u5-frontier-selection.json
          git commit -m 'Device catalog: materialize post-U5 frontier selection'
          git push origin HEAD:agent/post-u5-frontier-selection
