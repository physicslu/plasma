name: Device catalog Phase 4.3G STM32F2 batch-2 admission proposal
on:
  push:
    branches: [agent/device-catalog-phase43e-stm32f2-batch2]
    paths:
      - ".github/workflows/device-catalog-phase43g-proposal.yml"
      - "data/device-catalog/research/stm32f2_phase4_3g_admission.py"
      - "data/device-catalog/research/test_stm32f2_phase4_3g_admission.py"
      - "data/device-catalog/research/stm32f2_phase4_3f_policy.py"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  propose:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase43e-stm32f2-batch2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate retained evidence, policy, and read-only writer contract
        run: |
          python data/device-catalog/research/validate_stm32f2_phase4_3e_retained_evidence.py
          python data/device-catalog/research/stm32f2_phase4_3f_policy.py
          python data/device-catalog/research/test_stm32f2_phase4_3g_admission.py
      - name: Build exact proposal
        run: |
          mkdir -p /tmp/phase43g
          PYTHONPATH=data/device-catalog/research python data/device-catalog/research/stm32f2_phase4_3g_admission.py --output /tmp/phase43g/admission-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/phase43g/admission-plan.json').read_text())
          if p['candidate_count'] != 13 or p['decision_counts'] != {'admit':13,'already_present':0,'manual_review_required':0,'reject':0} or p['conflicts'] != 0 or p['canonical_rows_before'] != 9 or p['lifecycle_exclusions'] != []:
              raise SystemExit('unclean Phase 4.3G plan')
          PY
          cd /tmp/phase43g && sha256sum admission-plan.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: {name: phase43g-stm32f2-admission-proposal, path: /tmp/phase43g, if-no-files-found: error, retention-days: 30}
