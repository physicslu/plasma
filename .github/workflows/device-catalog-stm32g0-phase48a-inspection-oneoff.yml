name: STM32G0 Phase 4.8A foundation one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32g0-phase48a-foundation
    paths:
      - .github/workflows/device-catalog-stm32g0-phase48a-inspection-oneoff.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STM32G0 Phase 4.8A foundation contract
        run: python data/device-catalog/research/test_stm32g0_phase4_8a_foundation.py
