name: Windows Control Station installer acceptance

on:
  push:
    paths:
      - "packaging/windows/**"
      - "scripts/windows-control-station-msi.py"
      - "scripts/windows-control-station-installer-acceptance.py"
      - "scripts/control-station-runtime.py"
      - "scripts/control-station-release.py"
      - "scripts/product-release.py"
      - "software/web/package.json"
      - "software/web/scripts/build-product.mjs"
      - "software/web/scripts/validate-product-runtime.mjs"
      - "software/web/scripts/patch-vinext-windows-static-assets.mjs"
      - "software/python/pyproject.toml"
      - "software/python/tests/test_windows_control_station_installer.py"
      - "release/product.json"
      - ".github/workflows/windows-control-station-installer.yml"
  pull_request:
    paths:
      - "packaging/windows/**"
      - "scripts/windows-control-station-msi.py"
      - "scripts/windows-control-station-installer-acceptance.py"
      - "scripts/control-station-runtime.py"
      - "scripts/control-station-release.py"
      - "scripts/product-release.py"
      - "software/web/package.json"
      - "software/web/scripts/build-product.mjs"
      - "software/web/scripts/validate-product-runtime.mjs"
      - "software/web/scripts/patch-vinext-windows-static-assets.mjs"
      - "software/python/pyproject.toml"
      - "software/python/tests/test_windows_control_station_installer.py"
      - "release/product.json"
      - ".github/workflows/windows-control-station-installer.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-installer-pilot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: software/web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Fetch pinned self-contained target runtimes
        shell: pwsh
        run: |
          $pythonVersion = '3.12.10'
          $pythonZip = "${{ runner.temp }}\\python-$pythonVersion-embed-amd64.zip"
          $pythonRuntime = "${{ runner.temp }}\\plasma-bundled-python"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$pythonVersion/python-$pythonVersion-embed-amd64.zip" -OutFile $pythonZip
          $pythonActual = (Get-FileHash -Algorithm SHA256 $pythonZip).Hash.ToLowerInvariant()
          $pythonExpected = '4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3'
          if ($pythonActual -ne $pythonExpected) { throw "CPython embeddable SHA-256 mismatch: $pythonActual" }
          Expand-Archive -LiteralPath $pythonZip -DestinationPath $pythonRuntime
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/python/cpython/v$pythonVersion/LICENSE" -OutFile (Join-Path $pythonRuntime 'LICENSE.txt')
          & (Join-Path $pythonRuntime 'python.exe') --version

          $nodeVersion = '22.23.0'
          $nodeZip = "${{ runner.temp }}\\node-v$nodeVersion-win-x64.zip"
          $nodeExtract = "${{ runner.temp }}\\plasma-bundled-node-extract"
          Invoke-WebRequest -Uri "https://nodejs.org/download/release/v$nodeVersion/node-v$nodeVersion-win-x64.zip" -OutFile $nodeZip
          $nodeActual = (Get-FileHash -Algorithm SHA256 $nodeZip).Hash.ToLowerInvariant()
          $nodeExpected = '425a5bd68cc95e8eb16bcccd0a75081b48983fc6a26f67126bd4d6c7198231e8'
          if ($nodeActual -ne $nodeExpected) { throw "Node.js archive SHA-256 mismatch: $nodeActual" }
          Expand-Archive -LiteralPath $nodeZip -DestinationPath $nodeExtract
          $nodeRuntime = Join-Path $nodeExtract "node-v$nodeVersion-win-x64"
          & (Join-Path $nodeRuntime 'node.exe') --version

          Add-Content -Path $env:GITHUB_ENV -Value "PLASMA_BUNDLED_PYTHON_RUNTIME=$pythonRuntime"
          Add-Content -Path $env:GITHUB_ENV -Value "PLASMA_BUNDLED_NODE_RUNTIME=$nodeRuntime"
      - name: Install build and test dependencies
        run: python -m pip install ./software/python pytest
      - name: Install Web build dependencies
        working-directory: software/web
        run: npm ci
      - name: Build standalone Control Station Console
        working-directory: software/web
        run: npm run build:product
      - name: Build Control Station runtime
        run: >-
          python scripts/control-station-runtime.py build
          --standalone-console software/web/dist/standalone
          --output-dir "${{ runner.temp }}\\plasma-control-station-runtime"
      - name: Run Windows installer packaging regression tests
        run: >-
          python -m pytest -q
          software/python/tests/test_windows_control_station_installer.py
          software/python/tests/test_control_station_runtime.py
      - name: Build and verify Windows Common Release Format input
        shell: pwsh
        run: |
          python scripts/control-station-release.py `
            --runtime-dir "${{ runner.temp }}\\plasma-control-station-runtime" `
            --output-dir "${{ runner.temp }}\\plasma-control-station-release" `
            --platform windows `
            --architecture x86_64 `
            --git-sha "${{ github.sha }}"
          $release = Get-ChildItem "${{ runner.temp }}\\plasma-control-station-release" -Filter *.zip | Select-Object -First 1
          if (-not $release) { throw 'Windows Control Station release artifact was not created' }
          if (-not (Test-Path "$($release.FullName).sha256")) { throw 'release SHA-256 sidecar is missing' }
      - name: Fetch pinned WinSW service adapter
        shell: pwsh
        run: |
          $url = 'https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe'
          $target = "${{ runner.temp }}\\WinSW-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $target
          $actual = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
          $expected = '05b82d46ad331cc16bdc00de5c6332c1ef818df8ceefcd49c726553209b3a0da'
          if ($actual -ne $expected) { throw "WinSW SHA-256 mismatch: $actual" }
      - name: Install pinned WiX Toolset build CLI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version
      - name: Build unsigned self-contained Windows MSI pilot
        shell: pwsh
        run: |
          $release = Get-ChildItem "${{ runner.temp }}\\plasma-control-station-release" -Filter *.zip | Select-Object -First 1
          python scripts/windows-control-station-msi.py `
            --release-artifact $release.FullName `
            --winsw-exe "${{ runner.temp }}\\WinSW-x64.exe" `
            --python-runtime-dir "$env:PLASMA_BUNDLED_PYTHON_RUNTIME" `
            --node-runtime-dir "$env:PLASMA_BUNDLED_NODE_RUNTIME" `
            --output-dir "${{ runner.temp }}\\plasma-windows-installer"
      - name: Install, launch, restart, stop/start, and uninstall without host runtime prerequisites
        shell: pwsh
        run: |
          $msi = Get-ChildItem "${{ runner.temp }}\\plasma-windows-installer" -Filter *.msi | Select-Object -First 1
          if (-not $msi) { throw 'MSI was not created' }
          python scripts/windows-control-station-installer-acceptance.py --msi $msi.FullName
      - name: Upload unsigned Windows installer pilot
        uses: actions/upload-artifact@v4
        with:
          name: plasma-control-station-windows-installer-pilot
          path: |
            ${{ runner.temp }}/plasma-windows-installer/*.msi
            ${{ runner.temp }}/plasma-windows-installer/*.sha256
          if-no-files-found: error
          retention-days: 14
