name: OpenOCD A residual diagnostic v6.18

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/diagnose_openocd_a_residual_v618.py'
      - 'data/device-catalog/research/test_diagnose_openocd_a_residual_v618.py'
      - 'data/device-catalog/research/OPENOCD_A_RESIDUAL_DIAGNOSTIC_V618.md'
      - '.github/workflows/device-catalog-openocd-a-residual-v618.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose current A residual
        run: |
          python data/device-catalog/research/diagnose_openocd_a_residual_v618.py \
            --diagnostic /tmp/openocd-a-residual-v618.csv \
            --summary /tmp/openocd-a-residual-v618.json
          python -m unittest discover -s data/device-catalog/research \
            -p test_diagnose_openocd_a_residual_v618.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: openocd-a-residual-diagnostic-v618
          path: |
            /tmp/openocd-a-residual-v618.csv
            /tmp/openocd-a-residual-v618.json
          if-no-files-found: error
          retention-days: 30
