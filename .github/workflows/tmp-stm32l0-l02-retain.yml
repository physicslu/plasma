name: Temporary STM32L0 L0.2 evidence retention

on:
  push:
    branches:
      - agent/device-catalog-stm32l0-phase-l02-discovery
    paths:
      - ".github/workflows/tmp-stm32l0-l02-retain.yml"

permissions:
  contents: write
  actions: read

jobs:
  retain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-stm32l0-phase-l02-discovery
          fetch-depth: 0

      - name: Download immutable acquisition artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/l02-artifact
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10296507776/zip" \
            -o /tmp/l02-artifact/artifact.zip
          echo "5732782fce1911debe7360c07ccbae5ba03fd86cc097a975bc271fe9c6b334bd  /tmp/l02-artifact/artifact.zip" | sha256sum -c -
          unzip -q /tmp/l02-artifact/artifact.zip -d /tmp/l02-artifact/unpacked

      - name: Validate and retain evidence bundle
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import pathlib
          import shutil

          src = pathlib.Path('/tmp/l02-artifact/unpacked')
          root = pathlib.Path('data/device-catalog/research')
          evidence = root / 'evidence/stm32l0-l0.2-official-st-discovery-live-2026-09-12'
          evidence.mkdir(parents=True, exist_ok=True)

          summary = json.loads((src / 'live-summary.json').read_text())
          targets = json.loads((src / 'targets.json').read_text())
          acq = json.loads((src / 'provenance.json').read_text())

          def req(state: bool, message: str) -> None:
              if not state:
                  raise SystemExit(message)

          def sha256_bytes(body: bytes) -> str:
              return hashlib.sha256(body).hexdigest()

          def set_sha(values: list[str]) -> str:
              return sha256_bytes(''.join(value + '\n' for value in sorted(values)).encode())

          req(summary['phase'] == 'L0.2' and summary['family'] == 'STM32L0', 'summary identity drift')
          req(summary['base_device_count'] == summary['attempted'] == 99, 'target count drift')
          req(summary['commercial_identity_verified_targets'] == 99, 'identity verification drift')
          req(summary['active_candidate_targets'] == 99, 'active target drift')
          req(summary['lifecycle_excluded_targets'] == 0, 'unexpected lifecycle-only target')
          req(summary['source_unavailable_exclusions'] == 0, 'source unavailable drift')
          req(summary['identity_manual_intervention_required'] == 0, 'manual review drift')
          req(summary['acquisition_failure'] == 0, 'acquisition failure drift')
          req(summary['dispositioned_targets'] == 99, 'disposition drift')
          req(summary['active_exact_icpn_candidates'] == 360, 'Active exact ICPN count drift')
          req(summary['excluded_non_active_part_numbers'] == 10, 'excluded non-Active count drift')
          req(summary['routing_followup_required'] == 0, 'routing followup drift')
          req(summary['openocd_routing'] == {
              'ambiguous': 0,
              'gates_commercial_identity': False,
              'not_applicable': 0,
              'unique': 99,
              'unmapped': 0,
          }, 'routing aggregate drift')
          req(summary['bounded_discovery_clean'] is True, 'bounded discovery not clean')
          req(summary['commercial_identity_clean'] is True, 'commercial identity not clean')
          req(summary['representative_continuity_clean'] is True, 'L0.1 continuity not clean')
          req(summary['claims'] and set(summary['claims'].values()) == {False}, 'claims escaped fail-closed state')
          req(summary['browser'] == {
              'browser_version': '151.0.7922.34',
              'evidence_profile': 'stm32l0_l0_2_dual_surface_v1',
              'headless': False,
              'playwright_version': '1.62.0',
          }, 'browser profile drift')
          req(targets['base_device_count'] == 99 and len(targets['targets']) == 99, 'target manifest drift')
          req(targets['claims'] and set(targets['claims'].values()) == {False}, 'target claims drift')
          req(acq['workflow_run_id'] == 34686132303 and acq['workflow_run_attempt'] == 1, 'run provenance drift')
          req(acq['executed_git_sha'] == '4423e029cea8ac541d25c87ea8612fae2a3e68ee', 'executed merge-ref SHA drift')
          req(acq['live_summary_validation'] == 'success', 'live validation provenance drift')

          active: list[str] = []
          excluded: list[str] = []
          bases: list[str] = []
          leaf_rows: list[dict[str, str]] = []
          acquisition_times: list[str] = []
          target_bases = [item['base_device'] for item in targets['targets']]
          result_bases = [item['base_device'] for item in summary['results']]
          req(result_bases == target_bases, 'summary/target ordering drift')

          for result in summary['results']:
              base = result['base_device']
              bases.append(base)
              req(result['acquisition_status'] == 'success', f'{base}: acquisition status drift')
              req(result['commercial_identity_status'] == 'verified_active', f'{base}: identity status drift')
              req(result['disposition'] == 'active_candidates', f'{base}: disposition drift')
              req(result['manual_intervention_required'] is False, f'{base}: manual review drift')
              req(result['openocd_routing'] == {'status': 'unique', 'gates_commercial_identity': False}, f'{base}: route drift')
              ev = result['evidence']
              exact = ev['exact_icpns']
              req(exact and len(exact) == len(set(exact)), f'{base}: missing/duplicate exact ICPNs')
              req(all(value.startswith(base) for value in exact), f'{base}: foreign exact ICPN')
              active.extend(exact)
              excluded.extend(item['icpn'] for item in ev['excluded_non_active_part_numbers'])
              acquisition_times.append(ev['retrieved_at_utc'])

              leaf_path = src / 'evidence' / f'{base}.json'
              req(leaf_path.is_file(), f'{base}: missing artifact leaf')
              canonical = (json.dumps(ev, indent=2, sort_keys=True) + '\n').encode()
              leaf_bytes = leaf_path.read_bytes()
              req(canonical == leaf_bytes, f'{base}: summary/leaf byte mismatch')
              leaf_rows.append({
                  'base_device': base,
                  'path': f'evidence/{base}.json',
                  'sha256': sha256_bytes(leaf_bytes),
              })

          req(len(bases) == len(set(bases)) == 99, 'Base Device uniqueness drift')
          req(len(active) == len(set(active)) == 360, 'Active exact ICPN uniqueness drift')
          req(len(excluded) == len(set(excluded)) == 10, 'excluded exact ICPN uniqueness drift')
          req(set(active).isdisjoint(excluded), 'Active/non-Active overlap')
          req(set_sha(bases) == '1c9dc41c8f8dc44a132e8303e0c88b2168dc3bbf745a6250aa7f382e57d5f8af', 'Base set digest drift')
          req(set_sha(active) == '8c7f0cc10829ff5e1ceb98cf6783247a5f685a9f1407dbd560a350348c0a521b', 'Active set digest drift')
          req(set_sha(excluded) == '86be718862ed2641a3e857d0d7016aca459852d7dc3f210123893b28f66a6960', 'excluded set digest drift')

          shutil.copyfile(src / 'live-summary.json', evidence / 'live-summary.json')
          shutil.copyfile(src / 'targets.json', evidence / 'targets.json')
          shutil.copyfile(src / 'provenance.json', evidence / 'acquisition-provenance.json')
          shutil.copyfile(src / 'targets.json', root / 'stm32l0-phase-l0.2-discovery-manifest.json')

          leaf_manifest = {
              'schema_version': 1,
              'phase': 'L0.2',
              'family': 'STM32L0',
              'artifact_id': 10296507776,
              'artifact_zip_sha256': '5732782fce1911debe7360c07ccbae5ba03fd86cc097a975bc271fe9c6b334bd',
              'leaf_count': 99,
              'leaves': sorted(leaf_rows, key=lambda item: item['base_device']),
          }
          (evidence / 'leaf-digests.json').write_text(json.dumps(leaf_manifest, indent=2, sort_keys=True) + '\n')

          evidence_id = 'stm32l0-l0.2-official-st-discovery-2026-09-12-retained-20260912T110725Z-996489c8'
          provenance = {
              'schema_version': 1,
              'evidence_id': evidence_id,
              'manufacturer': 'STMicroelectronics',
              'source_repository': 'physicslu/plasma',
              'pr_number': 509,
              'pr_head_sha': '996489c8fe5e871310dd42c0d06c7b0302ca0750',
              'base_sha': 'a7918156547aebbed95fe7e91d1ed2e44f389cb4',
              'executed_git_sha': '4423e029cea8ac541d25c87ea8612fae2a3e68ee',
              'workflow_run_id': 34686132303,
              'workflow_run_attempt': 1,
              'artifact_id': 10296507776,
              'artifact_zip_sha256': '5732782fce1911debe7360c07ccbae5ba03fd86cc097a975bc271fe9c6b334bd',
              'acquisition_transport': 'chromium_rendered_dom',
              'headed': True,
              'browser_version': '151.0.7922.34',
              'playwright_version': '1.62.0',
              'evidence_profile': 'stm32l0_l0_2_dual_surface_v1',
              'commercial_identity_authority': summary['commercial_identity_authority'],
              'target_count': 99,
              'acquisition_success': 99,
              'acquisition_failure': 0,
              'exact_icpn_candidate_count': 360,
              'excluded_non_active_part_number_count': 10,
              'acquisition_time_utc': {'first': min(acquisition_times), 'last': max(acquisition_times)},
              'evaluator_result': 'clean',
              'scale_ready': True,
              'canonical_dataset_admission': False,
              'production_write_authorized': False,
              'runtime_programming_support_claimed': False,
              'l0_1_foundation_sha256': '958572fa69a4457966256851a39badfdc38490e0c3ce155978155baf3ca9e488',
              'production_prestate_sha256': '15f9c9a9be8640bc0664b562c667f676d0084e4c157e01f582c87a10886c5420',
          }
          (evidence / 'provenance.json').write_text(json.dumps(provenance, indent=2, sort_keys=True) + '\n')

          readme = f'''# STM32L0 L0.2 retained manufacturer evidence\n\nThis directory retains the successful official-ST L0.2 acquisition from workflow run `34686132303`, artifact `10296507776`.\n\n- 99 deterministic Base Devices across 16 STM32L0 subfamilies\n- 360 unique Active exact ICPNs\n- 10 exact non-Active Part Numbers excluded by Marketing Status\n- 0 lifecycle-only Base Devices\n- 0 source-unavailable targets\n- 0 manual review / acquisition failures\n- 99/99 OpenOCD routing observations unique; routing does not gate commercial identity\n- L0.1 representative continuity passed\n\n`live-summary.json` embeds the complete 99 evidence records. The original artifact also contained one JSON leaf per Base Device. To avoid duplicating the same evidence twice in Git, `leaf-digests.json` retains the SHA-256 of every original leaf, and the retained-evidence validator reconstructs each leaf byte-for-byte from the embedded summary before checking those digests.\n\nThis evidence is research-only. It does not authorize canonical admission, Production publication, programming algorithm equivalence, Flash/security semantics, electrical/socket qualification, HIL, or runtime programming support.\n'''
          (evidence / 'README.md').write_text(readme)

          retained_names = [
              'README.md', 'acquisition-provenance.json', 'leaf-digests.json',
              'live-summary.json', 'provenance.json', 'targets.json',
          ]
          manifest = {
              'schema_version': 1,
              'evidence_id': evidence_id,
              'canonical_dataset_admission': False,
              'files': [
                  {'path': name, 'sha256': hashlib.sha256((evidence / name).read_bytes()).hexdigest()}
                  for name in sorted(retained_names)
              ],
          }
          (evidence / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')

          baseline = {
              'schema_version': 1,
              'phase': 'L0.2',
              'family': 'STM32L0',
              'scope': 'retained official-ST complete commercial identity/lifecycle discovery; no Production write',
              'evidence_root': str(evidence),
              'evidence_id': evidence_id,
              'commercial_identity_authority': summary['commercial_identity_authority'],
              'aggregate': {
                  'base_device_count': 99,
                  'active_candidate_targets': 99,
                  'active_exact_icpn_candidates': 360,
                  'excluded_non_active_part_numbers': 10,
                  'lifecycle_excluded_targets': 0,
                  'source_unavailable_exclusions': 0,
                  'identity_manual_intervention_required': 0,
                  'acquisition_failure': 0,
                  'routing_followup_required': 0,
                  'openocd_unique_targets': 99,
                  'representative_continuity_clean': True,
                  'bounded_discovery_clean': True,
              },
              'set_digests': {
                  'base_device_set_sha256': '1c9dc41c8f8dc44a132e8303e0c88b2168dc3bbf745a6250aa7f382e57d5f8af',
                  'active_exact_icpn_set_sha256': '8c7f0cc10829ff5e1ceb98cf6783247a5f685a9f1407dbd560a350348c0a521b',
                  'excluded_non_active_set_sha256': '86be718862ed2641a3e857d0d7016aca459852d7dc3f210123893b28f66a6960',
              },
              'excluded_non_active_exact_part_numbers': sorted(excluded),
              'retained_evidence': {
                  'workflow_run_id': 34686132303,
                  'workflow_run_attempt': 1,
                  'artifact_id': 10296507776,
                  'artifact_zip_sha256': '5732782fce1911debe7360c07ccbae5ba03fd86cc097a975bc271fe9c6b334bd',
                  'pr_head_sha': '996489c8fe5e871310dd42c0d06c7b0302ca0750',
                  'executed_git_sha': '4423e029cea8ac541d25c87ea8612fae2a3e68ee',
                  'live_summary_sha256': hashlib.sha256((evidence / 'live-summary.json').read_bytes()).hexdigest(),
                  'targets_sha256': hashlib.sha256((evidence / 'targets.json').read_bytes()).hexdigest(),
                  'acquisition_provenance_sha256': hashlib.sha256((evidence / 'acquisition-provenance.json').read_bytes()).hexdigest(),
                  'retention_provenance_sha256': hashlib.sha256((evidence / 'provenance.json').read_bytes()).hexdigest(),
                  'leaf_digests_sha256': hashlib.sha256((evidence / 'leaf-digests.json').read_bytes()).hexdigest(),
                  'manifest_sha256': hashlib.sha256((evidence / 'manifest.json').read_bytes()).hexdigest(),
              },
              'source_bindings': {
                  'l0_1_foundation_sha256': '958572fa69a4457966256851a39badfdc38490e0c3ce155978155baf3ca9e488',
                  'openocd_catalog_sha256': '43ca9f9bbd2826aef8cd147a251263255d957dd1bcac7da653905d3bf980b6a3',
                  'production_prestate_sha256': '15f9c9a9be8640bc0664b562c667f676d0084e4c157e01f582c87a10886c5420',
                  'production_prestate_exact_icpn_count': 912,
                  'stm32l0_production_prestate_exact_icpn_count': 0,
              },
              'claims': {
                  'canonical_admission_authorized': False,
                  'flash_geometry_qualified': False,
                  'manufacturer_evidence_is_admission': False,
                  'option_security_semantics_qualified': False,
                  'physical_hil_qualified': False,
                  'production_write_authorized': False,
                  'programming_algorithm_equivalence': False,
                  'programming_policy_defined': False,
                  'runtime_programming_support_claimed': False,
              },
          }
          (root / 'stm32l0-phase-l0.2-discovery-baseline.json').write_text(json.dumps(baseline, indent=2, sort_keys=True) + '\n')
          print(json.dumps({'evidence_id': evidence_id, 'active_exact_icpns': 360, 'excluded': 10}, sort_keys=True))
          PY

      - name: Commit retained evidence
        run: |
          set -euo pipefail
          git config user.name "Gordon"
          git config user.email "physicslu@gmail.com"
          git add \
            data/device-catalog/research/evidence/stm32l0-l0.2-official-st-discovery-live-2026-09-12 \
            data/device-catalog/research/stm32l0-phase-l0.2-discovery-manifest.json \
            data/device-catalog/research/stm32l0-phase-l0.2-discovery-baseline.json
          git diff --cached --check
          git commit -m "STM32L0 L0.2: retain manufacturer discovery evidence"
          git push origin HEAD:agent/device-catalog-stm32l0-phase-l02-discovery
