name: TEMP STM32 post-WBA2X wireless frontier materialization

on:
  push:
    branches:
      - agent/stm32-post-wba2x-wireless-frontier-selection

permissions:
  contents: read

concurrency:
  group: temp-stm32-post-wba2x-wireless-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize deterministic remaining wireless selection
        run: |
          mkdir -p .artifacts/wireless-selection
          python data/device-catalog/research/stm32_post_wba2x_wireless_frontier_selection.py \
            --output .artifacts/wireless-selection/stm32-post-wba2x-wireless-frontier-selection.json
      - name: Emit selection to workflow log
        run: |
          python - <<'PY'
          import base64, pathlib
          path = pathlib.Path(".artifacts/wireless-selection/stm32-post-wba2x-wireless-frontier-selection.json")
          print(f"SELECTION_FILE_BEGIN {path.name}")
          print(base64.b64encode(path.read_bytes()).decode("ascii"))
          print(f"SELECTION_FILE_END {path.name}")
          PY
      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: stm32-post-wba2x-wireless-selection-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: .artifacts/wireless-selection/*
