name: z2like-demo active Site Job disable live negative

on:
  pull_request:
    paths:
      - ".github/workflows/z2like-demo-active-job-disable-live-negative.yml"
      - "scripts/z2like-demo-active-job-disable-live-acceptance.py"
      - "scripts/z2like-demo-qemu-installer.py"
      - "software/python/tests/test_z2like_demo_active_job_disable_live_contract.py"
      - "handover/H021-z2like-demo-browser-runtime-deployment-plan-2026-09-14.md"
  workflow_run:
    workflows:
      - "z2like-demo Browser Runtime live acceptance"
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: z2like-demo-active-site-job-disable-live-negative
  cancel-in-progress: false

jobs:
  contract:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Validate active-Job live-negative contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/z2like-demo-browser-live-acceptance.py \
            scripts/z2like-demo-active-job-disable-live-acceptance.py \
            scripts/z2like-demo-qemu-installer.py
          python3 scripts/z2like-demo-active-job-disable-live-acceptance.py --help >/dev/null
          python3 software/python/tests/test_z2like_demo_active_job_disable_live_contract.py

  live-swpc-render-qemu:
    needs: contract
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        github.repository == 'physicslu/plasma' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == 'physicslu/plasma' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
      }}
    runs-on: [self-hosted, linux, x64, plasma-integration]
    timeout-minutes: 20
    env:
      PLASMA_ACCEPTED_SHA: ${{ github.event.workflow_run.head_sha }}
      PLASMA_UPSTREAM_BROWSER_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Assert trusted post-deployment execution identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_run"
          test "$GITHUB_REPOSITORY" = "physicslu/plasma"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$PLASMA_ACCEPTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PLASMA_UPSTREAM_BROWSER_RUN_ID" =~ ^[0-9]+$ ]]
          test "$(id -u)" -ne 0

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Preflight canonical SWPC/QEMU target
        shell: bash
        run: |
          set -euo pipefail
          if ! docker inspect plasma-z2like-demo-qemu >/dev/null; then
            echo "::error::QEMU target container plasma-z2like-demo-qemu is unavailable"
            exit 1
          fi
          if ! curl --noproxy '*' --fail --silent --show-error --max-time 5 \
            http://127.0.0.1:18082/__plasma/bootstrap/v1/status >/dev/null; then
            echo "::error::SWPC managed Bootstrap status probe failed at 127.0.0.1:18082. Run ./scripts/plasmactl update z2like-demo as an operator before rerunning the upstream Browser Runtime gate."
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 15 \
            https://z2like-demo.open4th.com/deployment.json >/dev/null; then
            echo "::error::Public z2like-demo deployment identity probe failed"
            exit 1
          fi

      - name: Prove active Site Job blocks disable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/z2like-demo-active-job-disable-live"
          python3 scripts/z2like-demo-active-job-disable-live-acceptance.py \
            --expected-commit "$PLASMA_ACCEPTED_SHA" \
            --upstream-browser-run-id "$PLASMA_UPSTREAM_BROWSER_RUN_ID" \
            --report "$RUNNER_TEMP/z2like-demo-active-job-disable-live/report.json"

      - name: Upload active-Job live-negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: z2like-demo-active-job-disable-live-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/z2like-demo-active-job-disable-live/report.json
          if-no-files-found: warn
          retention-days: 14
