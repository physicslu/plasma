name: PLASMA Engineering Reusable Runtime Dispatcher (Path 2 / Path 3)

# ONE reusable workflow, never task-specific workflows.
# Qualification workflow_dispatch remains OFF; owner-only Development Mode
# issue_comment runs reviewed tasks using existing SWPC Runner.
on:
  workflow_dispatch:
    inputs:
      work_order_id:
        description: Reviewed immutable Work Order ID from main
        required: true
        type: string
      bundle_sha256:
        description: SHA256 of full canonical runtime request
        required: true
        type: string
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - ".github/workflows/plasma-engineering-runtime-dispatch.yml"
      - "scripts/plasma_engineering_runtime_v1.py"
      - "scripts/plasma_development_dispatch.py"
      - "scripts/plasma_engineering_monitor.py"
      - "scripts/tests/test_plasma_engineering_monitor.py"
      - "scripts/tests/test_plasma_development_dispatch.py"
      - "scripts/tests/test_plasma_development_blocking.py"
      - "scripts/plasma_vivado_host_build.py"
      - "scripts/plasma_fpga_build_diagnostics.py"
      - "scripts/tests/test_plasma_fpga_build_diagnostics.py"
      - "scripts/plasma_path2_build_qualification.py"
      - "scripts/plasma_path2_runtime_integration.py"
      - "scripts/tests/test_plasma_path2_runtime_integration.py"
      - "scripts/plasma_path2_stage_orchestrator.py"
      - "scripts/plasma_path2_f1b_adapters.py"
      - "scripts/plasma_path2_persistent_lease.py"
      - "scripts/plasma_path2_bin_provenance.py"
      - "scripts/plasma_path2_held_provider.py"
      - "scripts/tests/test_plasma_path2_held_provider.py"
      - "pl/hil/path2_z2_target_guard.py"
      - "scripts/tests/test_plasma_path2_z2_target_guard.py"
      - "pl/hil/path2_f1b_dev_risk.py"
      - "scripts/tests/test_plasma_path2_f1b_dev_risk.py"
      - "pl/hil/path2_f1b_minimal_stage.py"
      - "scripts/tests/test_plasma_path2_f1b_minimal_stage.py"
      - "scripts/plasma_development_stage_transport.py"
      - "scripts/z2/plasma-path2-f1b-root-entry"
      - "scripts/tests/test_plasma_path2_swpc_bridge.py"
      - "scripts/tests/test_plasma_development_stage_transport.py"
      - "specs/engineering-dispatch/development-tasks-v1.json"
      - "specs/engineering-dispatch/runtime-activation-v1.json"
      - "scripts/tests/test_plasma_engineering_runtime_v1.py"
      - "docs/architecture/plasma-engineering-runtime-dispatch-v1.md"
      - "scripts/plasma_hil_a2_cpu_only.py"
      - "scripts/tests/test_plasma_hil_a2_cpu_only.py"
      - "specs/engineering-dispatch/work-orders/hil-a2-cpu-only-r1.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/plasma-engineering-runtime-dispatch.yml"
      - "scripts/plasma_engineering_runtime_v1.py"
      - "scripts/plasma_development_dispatch.py"
      - "scripts/plasma_engineering_monitor.py"
      - "scripts/tests/test_plasma_engineering_monitor.py"
      - "scripts/tests/test_plasma_development_dispatch.py"
      - "scripts/tests/test_plasma_development_blocking.py"
      - "scripts/plasma_vivado_host_build.py"
      - "scripts/plasma_fpga_build_diagnostics.py"
      - "scripts/tests/test_plasma_fpga_build_diagnostics.py"
      - "scripts/plasma_path2_build_qualification.py"
      - "scripts/plasma_path2_runtime_integration.py"
      - "scripts/tests/test_plasma_path2_runtime_integration.py"
      - "scripts/plasma_path2_stage_orchestrator.py"
      - "scripts/plasma_path2_f1b_adapters.py"
      - "scripts/plasma_path2_persistent_lease.py"
      - "scripts/plasma_path2_bin_provenance.py"
      - "scripts/plasma_path2_held_provider.py"
      - "scripts/tests/test_plasma_path2_held_provider.py"
      - "pl/hil/path2_z2_target_guard.py"
      - "scripts/tests/test_plasma_path2_z2_target_guard.py"
      - "pl/hil/path2_f1b_dev_risk.py"
      - "scripts/tests/test_plasma_path2_f1b_dev_risk.py"
      - "pl/hil/path2_f1b_minimal_stage.py"
      - "scripts/tests/test_plasma_path2_f1b_minimal_stage.py"
      - "scripts/plasma_development_stage_transport.py"
      - "scripts/z2/plasma-path2-f1b-root-entry"
      - "scripts/tests/test_plasma_path2_swpc_bridge.py"
      - "scripts/tests/test_plasma_development_stage_transport.py"
      - "specs/engineering-dispatch/development-tasks-v1.json"
      - "specs/engineering-dispatch/runtime-activation-v1.json"
      - "scripts/tests/test_plasma_engineering_runtime_v1.py"
      - "docs/architecture/plasma-engineering-runtime-dispatch-v1.md"
      - "scripts/plasma_hil_a2_cpu_only.py"
      - "scripts/tests/test_plasma_hil_a2_cpu_only.py"
      - "specs/engineering-dispatch/work-orders/hil-a2-cpu-only-r1.json"

permissions:
  contents: read

concurrency:
  group: plasma-engineering-runtime-${{ inputs.work_order_id || github.ref }}
  cancel-in-progress: false

jobs:
  offline-contract:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run offline runtime and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/plasma_engineering_runtime_v1.py scripts/tests/test_plasma_engineering_runtime_v1.py scripts/plasma_development_dispatch.py scripts/tests/test_plasma_development_dispatch.py
          python3 scripts/tests/test_plasma_engineering_runtime_v1.py
          python3 scripts/tests/test_plasma_development_dispatch.py
          python3 scripts/tests/test_plasma_development_blocking.py
          python3 scripts/tests/test_plasma_engineering_monitor.py
          python3 -m py_compile scripts/plasma_fpga_build_diagnostics.py scripts/plasma_vivado_host_build.py scripts/tests/test_plasma_fpga_build_diagnostics.py
          python3 scripts/tests/test_plasma_fpga_build_diagnostics.py
          python3 -m py_compile scripts/plasma_path2_build_qualification.py scripts/plasma_path2_runtime_integration.py scripts/tests/test_plasma_path2_runtime_integration.py
          python3 scripts/tests/test_plasma_path2_runtime_integration.py
          python3 -m py_compile scripts/plasma_path2_bin_provenance.py scripts/plasma_path2_held_provider.py scripts/tests/test_plasma_path2_held_provider.py
          python3 scripts/tests/test_plasma_path2_held_provider.py
          python3 -m py_compile pl/hil/path2_z2_target_guard.py scripts/tests/test_plasma_path2_z2_target_guard.py
          python3 scripts/tests/test_plasma_path2_z2_target_guard.py
          python3 -m py_compile pl/hil/path2_f1b_dev_risk.py scripts/tests/test_plasma_path2_f1b_dev_risk.py
          python3 scripts/tests/test_plasma_path2_f1b_dev_risk.py
          python3 -m py_compile pl/hil/path2_f1b_minimal_stage.py scripts/tests/test_plasma_path2_f1b_minimal_stage.py
          python3 scripts/tests/test_plasma_path2_f1b_minimal_stage.py
          python3 -m py_compile scripts/plasma_development_stage_transport.py scripts/tests/test_plasma_path2_swpc_bridge.py
          python3 scripts/tests/test_plasma_path2_swpc_bridge.py
          python3 scripts/tests/test_plasma_development_stage_transport.py
          python3 scripts/tests/test_plasma_hil_a2_cpu_only.py
          git diff --exit-code

  candidate-dispatcher-premerge:
    # Existing PR event is the unprivileged branch-test entry. This runs the
    # exact candidate Dispatcher CLI with synthetic fixtures on GitHub-hosted
    # infrastructure. It MUST NOT use SWPC/self-hosted labels or real Codex.
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'physicslu/plasma' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == 'physicslu/plasma'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact trusted base SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout exact candidate HEAD SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Run candidate Dispatcher CLI integration in hosted simulation
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PLASMA_TRUSTED_SHA: ${{ github.event.pull_request.base.sha }}
          PLASMA_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          PLASMA_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_EVENT_NAME" = pull_request
          test "$GITHUB_REPOSITORY" = physicslu/plasma
          test -z "${SSH_AUTH_SOCK:-}"
          test "$(git -C trusted rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$PLASMA_CANDIDATE_SHA"
          python3 candidate/scripts/tests/test_plasma_candidate_dispatcher_premerge.py

  development-authorize:
    # Trusted main adapter; PR candidate fetched only after owner request.
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'physicslu/plasma' &&
      github.actor == 'physicslu' &&
      github.event.issue.number == 981 &&
      !github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/plasma-dispatch run ') ||
       startsWith(github.event.comment.body, '/plasma-dispatch work-order 981'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pinned_sha: ${{ steps.approve.outputs.pinned_sha }}
      trusted_sha: ${{ steps.approve.outputs.trusted_sha }}
      pr_number: ${{ steps.approve.outputs.pr_number }}
      pr_info_base64: ${{ steps.approve.outputs.pr_info_base64 }}
      registry_sha256: ${{ steps.approve.outputs.registry_sha256 }}
      execution_path: ${{ steps.approve.outputs.execution_path }}
      execution_capability: ${{ steps.approve.outputs.execution_capability }}
      task_id: ${{ steps.approve.outputs.task_id }}
      comment_id: ${{ steps.approve.outputs.comment_id }}
      claim_ref: ${{ steps.approve.outputs.claim_ref }}
      work_order_sha256: ${{ steps.approve.outputs.work_order_sha256 }}
    steps:
      - name: Checkout trusted main dispatcher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Parse owner command before PR API access
        id: request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git -C trusted rev-parse HEAD)" = "$GITHUB_SHA"
          python3 trusted/scripts/plasma_development_dispatch.py request \
            --event "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/plasma-dev-request.json"
          python3 - "$RUNNER_TEMP/plasma-dev-request.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data=json.load(f)
          assert data["status"] == "VALID_OWNER_REQUEST"
          with open(sys.argv[2],"a",encoding="utf-8") as f:
              f.write(f"pr_number={data['pr_number']}\n")
              f.write(f"source_sha={data['source_sha']}\n")
          PY
      - name: Read live PR metadata for branch request only
        if: ${{ steps.request.outputs.pr_number != '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh api "repos/physicslu/plasma/pulls/$PR_NUMBER" \
            > "$RUNNER_TEMP/plasma-dev-pr.json"
      - name: Checkout exact candidate SHA without running candidate logic
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.request.outputs.source_sha }}
          path: candidate
          persist-credentials: false
      - name: Approve candidate contract with trusted main code
        id: approve
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"
          args=()
          if [ "$PR_NUMBER" != 0 ]; then
            args+=(--pr-info "$RUNNER_TEMP/plasma-dev-pr.json")
          fi
          python3 trusted/scripts/plasma_development_dispatch.py authorize \
            --event "$GITHUB_EVENT_PATH" \
            --registry candidate/specs/engineering-dispatch/development-tasks-v1.json \
            "${args[@]}" > "$RUNNER_TEMP/plasma-dev-auth.json"
          python3 - "$RUNNER_TEMP/plasma-dev-auth.json" "$GITHUB_OUTPUT" "$RUNNER_TEMP/plasma-dev-pr.json" <<'PY'
          import base64,json,sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data=json.load(f)
          assert data["status"] == "AUTHORIZED_DEV_TASK"
          with open(sys.argv[2],"a",encoding="utf-8") as f:
              for k in ("pinned_sha","trusted_sha","pr_number",
                        "registry_sha256","execution_path","execution_capability","task_id"):
                  f.write(f"{k}={data[k]}\n")
              for k in ("comment_id","claim_ref","work_order_sha256"):
                  f.write(f"{k}={data.get(k,'')}\n")
              # Pass only the minimal, already-verified PR identity snapshot.
              # No second PR API client or runner is required on SWPC.
              if data["pr_number"]:
                  with open(sys.argv[3],encoding="utf-8") as pr_file:
                      raw=json.load(pr_file)
                  snapshot={
                      "number":raw["number"],"state":raw["state"],
                      "merged_at":raw["merged_at"],
                      "user":{"login":raw["user"]["login"]},
                      "head":{"ref":raw["head"]["ref"],"sha":raw["head"]["sha"],
                              "repo":{"full_name":raw["head"]["repo"]["full_name"]}},
                      "base":{"ref":raw["base"]["ref"],
                              "repo":{"full_name":raw["base"]["repo"]["full_name"]}},
                  }
                  packed=base64.b64encode(json.dumps(
                      snapshot,sort_keys=True,separators=(",",":")
                  ).encode("utf-8")).decode("ascii")
                  f.write(f"pr_info_base64={packed}\n")
          PY

  development-claim:
    # A2 only: hosted atomic Git ref creation is the one-shot idempotency gate.
    # If ruleset or GitHub token cannot prove CREATE/readback, fail closed.
    needs: development-authorize
    if: >-
      github.event_name == 'issue_comment' &&
      needs.development-authorize.result == 'success' &&
      needs.development-authorize.outputs.task_id == 'hil-a2-cpu-only' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      claim_ref: ${{ steps.claim.outputs.claim_ref }}
      work_order_sha256: ${{ steps.claim.outputs.work_order_sha256 }}
    steps:
      - name: Atomically claim exact Owner A2 comment and pinned Work Order
        id: claim
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          A2_CLAIM_REF: ${{ needs.development-authorize.outputs.claim_ref }}
          A2_PINNED_SHA: ${{ needs.development-authorize.outputs.pinned_sha }}
          A2_WORK_ORDER_SHA256: ${{ needs.development-authorize.outputs.work_order_sha256 }}
          A2_COMMENT_ID: ${{ needs.development-authorize.outputs.comment_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ref = process.env.A2_CLAIM_REF;
            const sha = process.env.A2_PINNED_SHA;
            const digest = process.env.A2_WORK_ORDER_SHA256;
            const cid = process.env.A2_COMMENT_ID;
            if (context.eventName !== 'issue_comment' ||
                context.actor !== 'physicslu' ||
                context.repo.owner !== 'physicslu' ||
                context.repo.repo !== 'plasma' ||
                context.issue.number !== 981 ||
                context.payload.issue.pull_request ||
                context.payload.action !== 'created' ||
                String(context.payload.comment?.id) !== cid ||
                context.payload.comment?.user?.login !== 'physicslu' ||
                process.env.GITHUB_RUN_ATTEMPT !== '1' ||
                !/^[0-9a-f]{40}$/.test(sha) || sha !== context.sha ||
                !/^[0-9a-f]{64}$/.test(digest) ||
                !/^[1-9][0-9]*$/.test(cid) ||
                ref !== `refs/heads/plasma-engineering-claims/981/a2-${cid}-${digest.slice(0,16)}-r1`) {
              throw new Error('A2_CLAIM_AUTHORIZATION_DENIED');
            }
            // Atomic create: a duplicate/ambiguous failure never retries.
            // Never update or delete the protected claim ref.
            await github.rest.git.createRef({owner: 'physicslu', repo: 'plasma', ref, sha});
            const readback = await github.rest.git.getRef({
              owner: 'physicslu', repo: 'plasma', ref: ref.slice('refs/'.length)
            });
            if (readback.data.ref !== ref || readback.data.object.sha !== sha) {
              throw new Error('A2_CLAIM_READBACK_DENIED');
            }
            const evidence = {
              status: 'CLAIM_CREATED_AND_READBACK',
              schema: 'plasma.hil.a2.claim.v1',
              claim_ref: ref,
              main_sha: sha,
              work_order_sha256: digest,
              issue_number: 981,
              comment_id: Number(cid),
              run_id: context.runId,
              run_attempt: 1
            };
            require('fs').writeFileSync(
              process.env.RUNNER_TEMP + '/plasma-a2-claim.json',
              JSON.stringify(evidence, null, 2) + '\n',
              {flag: 'wx', mode: 0o600}
            );
            core.setOutput('claim_ref', ref);
            core.setOutput('work_order_sha256', digest);
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: plasma-a2-claim-${{ github.run_id }}
          path: ${{ runner.temp }}/plasma-a2-claim.json
          if-no-files-found: warn
          retention-days: 14

  development-execute:
    # Both Paths reuse this ONE trusted provider; hardware never runs in Codex.
    # Hardware-capable A2 retains its existing one-shot claim gate.
    needs: [development-authorize, development-claim, development-codex]
    if: >-
      always() &&
      needs.development-authorize.result == 'success' &&
      (
        (needs.development-authorize.outputs.execution_path == 'path2-cli' &&
         (
          contains(fromJSON('["cpu-only","vivado-host-build","path2-stage-contract"]'),
                   needs.development-authorize.outputs.execution_capability) ||
          (needs.development-authorize.outputs.execution_capability == 'z2-cpu-only' &&
           needs.development-authorize.outputs.task_id == 'hil-a2-cpu-only' &&
           needs.development-claim.result == 'success' &&
           needs.development-claim.outputs.claim_ref == needs.development-authorize.outputs.claim_ref &&
           needs.development-claim.outputs.work_order_sha256 == needs.development-authorize.outputs.work_order_sha256 &&
           github.run_attempt == 1)
         )) ||
        (needs.development-authorize.outputs.execution_path == 'path3-codex' &&
         needs.development-authorize.outputs.execution_capability == 'codex-guarded-hardware' &&
         needs.development-codex.result == 'success')
      )
    # PR #1046: reuse existing SWPC Runner, not a new isolated Runner.
    runs-on: [self-hosted, linux, x64, plasma-codex]
    timeout-minutes: ${{ needs.development-authorize.outputs.execution_capability == 'vivado-host-build' && 50 || needs.development-authorize.outputs.execution_capability == 'codex-guarded-hardware' && 10 || needs.development-authorize.outputs.task_id == 'z2-path2-full-hil' && 10 || 5 }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check SWPC identity and trusted dispatcher SHA
        shell: bash
        env:
          TRUSTED_SHA: ${{ needs.development-authorize.outputs.trusted_sha }}
        run: |
          set -euo pipefail
          # Scheduling labels are metadata; retain the effective privilege boundary.
          test "$(id -u)" != 0
      - name: Checkout trusted main dispatcher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.development-authorize.outputs.trusted_sha }}
          path: trusted
          persist-credentials: false
          clean: true
      - name: Checkout authorized candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.development-authorize.outputs.pinned_sha }}
          path: candidate
          persist-credentials: false
          clean: true
      - name: Download exact pinned A1 artifact for claimed A2 only
        if: >-
          needs.development-authorize.outputs.task_id == 'hil-a2-cpu-only' &&
          needs.development-claim.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          repository: physicslu/plasma
          run-id: 39192248348
          name: plasma-armv7-hil-a1-pr-39192248348
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/plasma-hil-a2-source
      - name: Execute candidate CLI using trusted dispatcher
        shell: bash
        env:
          TRUSTED_SHA: ${{ needs.development-authorize.outputs.trusted_sha }}
          PINNED_SHA: ${{ needs.development-authorize.outputs.pinned_sha }}
          PR_NUMBER: ${{ needs.development-authorize.outputs.pr_number }}
          PR_INFO_BASE64: ${{ needs.development-authorize.outputs.pr_info_base64 }}
          REGISTRY_SHA256: ${{ needs.development-authorize.outputs.registry_sha256 }}
          WORK_ORDER_SHA256: ${{ needs.development-authorize.outputs.work_order_sha256 }}
          EXECUTION_CAPABILITY: ${{ needs.development-authorize.outputs.execution_capability }}
          PLASMA_HIL_A2_CLAIM_REF: ${{ needs.development-claim.outputs.claim_ref }}
          PLASMA_HIL_A2_WORK_ORDER_SHA256: ${{ needs.development-claim.outputs.work_order_sha256 }}
          PLASMA_HIL_A2_ARTIFACT_DIR: ${{ runner.temp }}/plasma-hil-a2-source
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$PINNED_SHA"
          pr_info_args=()
          if [ "$PR_NUMBER" != "0" ]; then
            # A completed trusted authorization job supplied this pinned
            # PR identity; revalidate it inside the trusted SWPC dispatcher.
            python3 - "$RUNNER_TEMP/plasma-dev-pr.json" <<'PY'
          import base64,json,os,sys
          from pathlib import Path
          encoded=os.environ.get("PR_INFO_BASE64","")
          assert 0 < len(encoded) <= 8192,"AUTHORIZED_PR_SNAPSHOT_MISSING"
          data=base64.b64decode(encoded,validate=True)
          assert len(data) <= 4096,"AUTHORIZED_PR_SNAPSHOT_TOO_LARGE"
          record=json.loads(data)
          Path(sys.argv[1]).write_text(json.dumps(record),encoding="utf-8")
          PY
            pr_info_args+=(--pr-info "$RUNNER_TEMP/plasma-dev-pr.json")
          else
            test -z "$PR_INFO_BASE64"
          fi
          python3 trusted/scripts/plasma_engineering_monitor.py run path2 -- \
            python3 trusted/scripts/plasma_development_dispatch.py execute \
            --event "$GITHUB_EVENT_PATH" \
            --registry candidate/specs/engineering-dispatch/development-tasks-v1.json \
            "${pr_info_args[@]}" \
            --workspace candidate --evidence-dir "$RUNNER_TEMP" \
            --trusted-sha "$TRUSTED_SHA" --pinned-sha "$PINNED_SHA" \
            --pr-number "$PR_NUMBER" --registry-sha256 "$REGISTRY_SHA256" \
            --execution-capability "$EXECUTION_CAPABILITY" \
            --work-order-sha256 "$WORK_ORDER_SHA256" \
            > "$RUNNER_TEMP/plasma-path2-receipt.json"
          cat "$RUNNER_TEMP/plasma-path2-receipt.json"
          git -C trusted diff --exit-code
          git -C candidate diff --exit-code
          sha256sum "$RUNNER_TEMP/plasma-path2-receipt.json" \
            > "$RUNNER_TEMP/plasma-path2-receipt.json.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: plasma-development-cli-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/plasma-path2-receipt.json
            ${{ runner.temp }}/plasma-path2-receipt.json.sha256
            ${{ runner.temp }}/plasma-path2-stdout.txt
            ${{ runner.temp }}/plasma-path2-stderr.txt
            ${{ runner.temp }}/plasma-fpga-build-diagnostics.json
            ${{ runner.temp }}/plasma-fpga-build-diagnostics.json.sha256
            ${{ runner.temp }}/plasma-path2-vivado-host-receipt.json
            candidate/pl/build/**/*.log
            candidate/pl/build/**/*.rpt
            candidate/pl/build/**/*.bit
            candidate/pl/build/**/*.hwh
          if-no-files-found: warn
          retention-days: 14

  development-codex:
    needs: development-authorize
    if: >-
      github.event_name == 'issue_comment' &&
      needs.development-authorize.result == 'success' &&
      needs.development-authorize.outputs.execution_path == 'path3-codex'
    runs-on: [self-hosted, linux, x64, plasma-codex]
    # Long RTL/Vivado implementation is expected in Development Mode.
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read  # F1-B only: trusted step fetches immutable prior artifact
    steps:
      - name: Check SWPC identity and trusted dispatcher SHA
        shell: bash
        env:
          TRUSTED_SHA: ${{ needs.development-authorize.outputs.trusted_sha }}
        run: |
          set -euo pipefail
          # Scheduling labels are metadata; retain the effective privilege boundary.
          test "$(id -u)" != 0
          command -v codex
          codex --version
      - name: Checkout trusted main dispatcher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.development-authorize.outputs.trusted_sha }}
          path: trusted
          persist-credentials: false
          clean: true
      - name: Checkout authorized candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.development-authorize.outputs.pinned_sha }}
          path: candidate
          persist-credentials: false
          clean: true
      - name: Prefetch exact F1-B BIT/HWH with step-scoped GitHub token
        if: needs.development-authorize.outputs.task_id == 'f1b-path3-z2-hil-once'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/plasma-f1b-pinned"
          gh api repos/physicslu/plasma/actions/artifacts/12229639751/zip > "$RUNNER_TEMP/plasma-f1b-pinned/source.zip"
          python3 - "$RUNNER_TEMP/plasma-f1b-pinned" <<'PY'
          import hashlib
          import os
          import pathlib
          import sys
          import zipfile
          root = pathlib.Path(sys.argv[1])
          items = (
              ('system_wrapper.bit', 4045769, 'fdbde5c66999a9dab37339587d304b9c16e71a06f1890b24893c8391859cf075'),
              ('system.hwh', 138977, 'bf3690d69fefc8da3fc62964209776466894cd4353aec0a475b373257899ca76'),
          )
          with zipfile.ZipFile(root / 'source.zip') as bundle:
              for name, length, expected in items:
                  archive_path = 'plasma/plasma/candidate/pl/build/f1b-deliverables/' + name
                  data = bundle.read(archive_path)
                  if len(data) != length or hashlib.sha256(data).hexdigest() != expected:
                      raise SystemExit('F1B_ARTIFACT_IDENTITY_DENIED: ' + name)
                  dest = root / name
                  fd = os.open(dest, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                  with os.fdopen(fd, 'wb') as stream:
                      stream.write(data)
          print('F1B_ARTIFACT_CUSTODY_PASS: exact BIT/HWH size and SHA256')
          PY
      - name: Codex develops, builds and tests candidate; preserve real evidence
        shell: bash
        env:
          TRUSTED_SHA: ${{ needs.development-authorize.outputs.trusted_sha }}
          PINNED_SHA: ${{ needs.development-authorize.outputs.pinned_sha }}
          PR_NUMBER: ${{ needs.development-authorize.outputs.pr_number }}
          REGISTRY_SHA256: ${{ needs.development-authorize.outputs.registry_sha256 }}
          WORK_ORDER_SHA256: ${{ needs.development-authorize.outputs.work_order_sha256 }}
          EXECUTION_CAPABILITY: ${{ needs.development-authorize.outputs.execution_capability }}
          PLASMA_F1B_TASK_ID: ${{ needs.development-authorize.outputs.task_id }}
          # Only the owner-authorized F1-B engineering task admits Vivado.
          PLASMA_FPGA_PATH3_APPROVED: ${{ needs.development-authorize.outputs.task_id == 'f1b-path3-codex-vivado-build' && '1' || '0' }}
          PLASMA_FPGA_PINNED_SHA: ${{ needs.development-authorize.outputs.pinned_sha }}
          PLASMA_FPGA_PR_NUMBER: ${{ needs.development-authorize.outputs.pr_number }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C candidate status --porcelain --untracked-files=all)"
          if [ "$PLASMA_F1B_TASK_ID" = 'f1b-path3-z2-hil-once' ]; then
            install -d -m 0700 candidate/pl/build/f1b-deliverables
            install -m 0600 "$RUNNER_TEMP/plasma-f1b-pinned/system_wrapper.bit" candidate/pl/build/f1b-deliverables/system_wrapper.bit
            install -m 0600 "$RUNNER_TEMP/plasma-f1b-pinned/system.hwh" candidate/pl/build/f1b-deliverables/system.hwh
          fi
          python3 trusted/scripts/plasma_engineering_monitor.py run path3 -- \
            python3 trusted/scripts/plasma_development_dispatch.py execute-codex \
            --event "$GITHUB_EVENT_PATH" \
            --registry candidate/specs/engineering-dispatch/development-tasks-v1.json \
            --workspace candidate \
            --trusted-sha "$TRUSTED_SHA" --pinned-sha "$PINNED_SHA" \
            --pr-number "$PR_NUMBER" --registry-sha256 "$REGISTRY_SHA256" \
            --work-order-sha256 "$WORK_ORDER_SHA256" \
            --execution-capability "$EXECUTION_CAPABILITY" \
            > "$RUNNER_TEMP/plasma-path3-receipt.json"
          # Runner exits nonzero when Codex failed/incomplete. Do not put
          # evidence extraction here: 'set -e' would skip it on failure.
          cat "$RUNNER_TEMP/plasma-path3-receipt.json"
          git -C trusted diff --exit-code
      - name: Collect Path 3 evidence even when Codex or preflight fails
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Admission failure may leave no candidate checkout. Never fetch
          # additional source, rerun the agent, or access physical devices.
          if [ -d candidate/.git ]; then
            # HEAD includes BOTH staged and unstaged changes. Output is only
            # for evidence; the candidate checkout must remain uncommitted.
            git -C candidate diff --binary HEAD > "$RUNNER_TEMP/plasma-path3-source.patch"
            git -C candidate status --porcelain=v1 --untracked-files=all \
              > "$RUNNER_TEMP/plasma-path3-status.txt"
            git -C candidate ls-files --others --exclude-standard -z \
              > "$RUNNER_TEMP/plasma-path3-new-file-list.nul"
            if [ -s "$RUNNER_TEMP/plasma-path3-new-file-list.nul" ]; then
              tar -C candidate --null -T "$RUNNER_TEMP/plasma-path3-new-file-list.nul" \
                -czf "$RUNNER_TEMP/plasma-path3-new-files.tar.gz"
            fi
          fi
          if [ -f "$RUNNER_TEMP/plasma-path3-receipt.json" ]; then
            cat "$RUNNER_TEMP/plasma-path3-receipt.json"
            sha256sum "$RUNNER_TEMP/plasma-path3-receipt.json" \
              > "$RUNNER_TEMP/plasma-path3-receipt.json.sha256"
          fi
          if [ -f "$RUNNER_TEMP/plasma-path3-source.patch" ]; then
            sha256sum "$RUNNER_TEMP/plasma-path3-source.patch" \
              > "$RUNNER_TEMP/plasma-path3-source.patch.sha256"
          fi
          # upload-artifact excludes hidden paths by default. The Codex
          # session log and *.test.log under .plasma-path3-evidence were
          # missing even when the task succeeded. Explicitly package only
          # this evidence directory; do NOT enable include-hidden-files for
          # unrelated build outputs or other workspace secrets.
          if [ -L candidate/.plasma-path3-evidence ]; then
            echo "PATH3_EVIDENCE_SYMLINK_DENIED" >&2
            exit 1
          fi
          if [ -d candidate/.plasma-path3-evidence ]; then
            tar -C candidate -czf "$RUNNER_TEMP/plasma-path3-engineering-evidence.tar.gz" \
              -- .plasma-path3-evidence
            sha256sum "$RUNNER_TEMP/plasma-path3-engineering-evidence.tar.gz" \
              > "$RUNNER_TEMP/plasma-path3-engineering-evidence.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: plasma-development-codex-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/plasma-path3-receipt.json
            ${{ runner.temp }}/plasma-path3-receipt.json.sha256
            ${{ runner.temp }}/plasma-path3-source.patch
            ${{ runner.temp }}/plasma-path3-source.patch.sha256
            ${{ runner.temp }}/plasma-path3-status.txt
            ${{ runner.temp }}/plasma-path3-new-files.tar.gz
            ${{ runner.temp }}/plasma-path3-engineering-evidence.tar.gz
            ${{ runner.temp }}/plasma-path3-engineering-evidence.tar.gz.sha256
            candidate/.plasma-path3-evidence/**
            candidate/pl/build/**/*.log
            candidate/pl/build/**/*.rpt
            candidate/pl/build/**/*.bit
            candidate/pl/build/**/*.hwh
            candidate/pl/build/**/reports/**
            candidate/scripts/experiments/plasma_*_generated.py
            candidate/scripts/experiments/plasma_*_generated.csv
            candidate/scripts/experiments/plasma_*_generated.txt
            candidate/scripts/experiments/plasma_*_generated.test.log
            candidate/scripts/experiments/plasma_*_generated.codex.log
          if-no-files-found: warn
          retention-days: 14

  authorize:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'physicslu/plasma' &&
      github.actor == 'physicslu' &&
      github.ref == 'refs/heads/main' &&
      vars.PLASMA_ENGINEERING_DISPATCH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      execution_path: ${{ steps.plan.outputs.execution_path }}
      pinned_sha: ${{ steps.plan.outputs.pinned_sha }}
      bundle_sha256: ${{ steps.plan.outputs.bundle_sha256 }}
      work_order_id: ${{ steps.plan.outputs.work_order_id }}
      claim_ref: ${{ steps.plan.outputs.claim_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate trusted owner, reviewed SHA and immutable bundle
        id: plan
        shell: bash
        env:
          WORK_ORDER_ID: ${{ inputs.work_order_id }}
          EXPECTED_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          [[ "$WORK_ORDER_ID" =~ ^[a-z0-9][a-z0-9-]{2,63}$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bundle="specs/engineering-dispatch/runtime-requests/$WORK_ORDER_ID.json"
          test -f "$bundle" && test ! -L "$bundle"
          python3 scripts/plasma_engineering_runtime_v1.py authorize \
            --bundle "$bundle" \
            --policy specs/engineering-dispatch/capabilities-v1.json \
            --event "$GITHUB_EVENT_PATH" \
            --expected-sha256 "$EXPECTED_SHA256" \
            > "$RUNNER_TEMP/authorization.json"
          python3 - "$RUNNER_TEMP/authorization.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          assert data["status"] == "AUTHORIZED_PENDING_ATOMIC_CLAIM"
          with open(sys.argv[2],"a",encoding="utf-8") as f:
              for field in ("execution_path","bundle_sha256","work_order_id","claim_ref"):
                  f.write(f"{field}={data[field]}\n")
              f.write(f"pinned_sha={data['reviewed_main_sha']}\n")
          PY
      - name: Atomically claim work order revision in protected Git ref
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CLAIM_REF: ${{ steps.plan.outputs.claim_ref }}
          PINNED_SHA: ${{ steps.plan.outputs.pinned_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ref = process.env.CLAIM_REF;
            const sha = process.env.PINNED_SHA;
            if (!/^refs\/heads\/plasma-engineering-claims\/[a-z0-9][a-z0-9-]{2,63}\/r[1-9][0-9]*$/.test(ref)) {
              throw new Error("INVALID_CLAIM_REF");
            }
            if (!/^[a-f0-9]{40}$/.test(sha) || sha !== context.sha) {
              throw new Error("INVALID_PINNED_SHA");
            }
            // createRef is an atomic GitHub API create: existing ref fails.
            // The active claims ruleset forbids subsequent mutation/deletion.
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo, ref, sha
            });
            const bare = ref.slice("refs/".length);
            const readback = await github.rest.git.getRef({
              owner: context.repo.owner, repo: context.repo.repo, ref: bare
            });
            if (readback.data.ref !== ref || readback.data.object.sha !== sha) {
              throw new Error("CLAIM_READBACK_FAILED");
            }

  execute:
    needs: authorize
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.authorize.result == 'success' &&
      vars.PLASMA_ENGINEERING_DISPATCH_ENABLED == 'true' &&
      (needs.authorize.outputs.execution_path == 'path2-cli' ||
       needs.authorize.outputs.execution_path == 'path3-codex')
    # Do not assign this label to the current hardware-capable plasma-codex worker.
    runs-on: [self-hosted, linux, x64, plasma-dispatch-isolated]
    timeout-minutes: 17
    permissions:
      contents: read
    steps:
      - name: Trusted worker event / runner admission before checkout
        shell: bash
        env:
          PINNED_SHA: ${{ needs.authorize.outputs.pinned_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = physicslu/plasma
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$PINNED_SHA"
          test "$RUNNER_NAME" = SWPC-plasma-dispatch-isolated
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$(id -u)" -ne 0
          test -z "${SSH_AUTH_SOCK:-}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.pinned_sha }}
          persist-credentials: false
          clean: true
      - name: Execute only claimed, bounded CLI/Codex task in OS-isolated worker
        shell: bash
        env:
          WORK_ORDER_ID: ${{ needs.authorize.outputs.work_order_id }}
          EXPECTED_SHA256: ${{ needs.authorize.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          [[ "$WORK_ORDER_ID" =~ ^[a-z0-9][a-z0-9-]{2,63}$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          bundle="specs/engineering-dispatch/runtime-requests/$WORK_ORDER_ID.json"
          python3 scripts/plasma_engineering_runtime_v1.py worker \
            --bundle "$bundle" \
            --policy specs/engineering-dispatch/capabilities-v1.json \
            --expected-sha256 "$EXPECTED_SHA256" > "$RUNNER_TEMP/dispatch-result.json"
          sha256sum "$RUNNER_TEMP/dispatch-result.json" > "$RUNNER_TEMP/dispatch-result.json.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: plasma-runtime-dispatch-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dispatch-result.json
            ${{ runner.temp }}/dispatch-result.json.sha256
          if-no-files-found: warn
          retention-days: 14
