name: PLASMA Engineering Reusable Runtime Dispatcher (Path 2 / Path 3)

# ONE reusable workflow, never task-specific workflows.
# Qualification workflow_dispatch remains OFF; owner-only Development Mode
# issue_comment runs reviewed tasks using existing SWPC Runner.
on:
  workflow_dispatch:
    inputs:
      work_order_id:
        description: Reviewed immutable Work Order ID from main
        required: true
        type: string
      bundle_sha256:
        description: SHA256 of full canonical runtime request
        required: true
        type: string
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - ".github/workflows/plasma-engineering-runtime-dispatch.yml"
      - "scripts/plasma_engineering_runtime_v1.py"
      - "scripts/plasma_development_dispatch.py"
      - "scripts/tests/test_plasma_development_dispatch.py"
      - "specs/engineering-dispatch/development-tasks-v1.json"
      - "specs/engineering-dispatch/runtime-activation-v1.json"
      - "scripts/tests/test_plasma_engineering_runtime_v1.py"
      - "docs/architecture/plasma-engineering-runtime-dispatch-v1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/plasma-engineering-runtime-dispatch.yml"
      - "scripts/plasma_engineering_runtime_v1.py"
      - "scripts/plasma_development_dispatch.py"
      - "scripts/tests/test_plasma_development_dispatch.py"
      - "specs/engineering-dispatch/development-tasks-v1.json"
      - "specs/engineering-dispatch/runtime-activation-v1.json"
      - "scripts/tests/test_plasma_engineering_runtime_v1.py"
      - "docs/architecture/plasma-engineering-runtime-dispatch-v1.md"

permissions:
  contents: read

concurrency:
  group: plasma-engineering-runtime-${{ inputs.work_order_id || github.ref }}
  cancel-in-progress: false

jobs:
  offline-contract:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run offline runtime and adversarial tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/plasma_engineering_runtime_v1.py scripts/tests/test_plasma_engineering_runtime_v1.py scripts/plasma_development_dispatch.py scripts/tests/test_plasma_development_dispatch.py
          python3 scripts/tests/test_plasma_engineering_runtime_v1.py
          python3 scripts/tests/test_plasma_development_dispatch.py
          git diff --exit-code

  development-authorize:
    # Trusted main adapter; PR candidate fetched only after owner request.
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'physicslu/plasma' &&
      github.actor == 'physicslu' &&
      github.event.issue.number == 981 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/plasma-dispatch run ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pinned_sha: ${{ steps.approve.outputs.pinned_sha }}
      trusted_sha: ${{ steps.approve.outputs.trusted_sha }}
      pr_number: ${{ steps.approve.outputs.pr_number }}
      registry_sha256: ${{ steps.approve.outputs.registry_sha256 }}
      execution_path: ${{ steps.approve.outputs.execution_path }}
      task_id: ${{ steps.approve.outputs.task_id }}
    steps:
      - name: Checkout trusted main dispatcher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Parse owner command before PR API access
        id: request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git -C trusted rev-parse HEAD)" = "$GITHUB_SHA"
          python3 trusted/scripts/plasma_development_dispatch.py request \
            --event "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/plasma-dev-request.json"
          python3 - "$RUNNER_TEMP/plasma-dev-request.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data=json.load(f)
          assert data["status"] == "VALID_OWNER_REQUEST"
          with open(sys.argv[2],"a",encoding="utf-8") as f:
              f.write(f"pr_number={data['pr_number']}\n")
              f.write(f"source_sha={data['source_sha']}\n")
          PY
      - name: Read live PR metadata for branch request only
        if: ${{ steps.request.outputs.pr_number != '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh api "repos/physicslu/plasma/pulls/$PR_NUMBER" \
            > "$RUNNER_TEMP/plasma-dev-pr.json"
      - name: Checkout exact candidate SHA without running candidate logic
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.request.outputs.source_sha }}
          path: candidate
          persist-credentials: false
      - name: Approve candidate contract with trusted main code
        id: approve
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"
          args=()
          if [ "$PR_NUMBER" != 0 ]; then
            args+=(--pr-info "$RUNNER_TEMP/plasma-dev-pr.json")
          fi
          python3 trusted/scripts/plasma_development_dispatch.py authorize \
            --event "$GITHUB_EVENT_PATH" \
            --registry candidate/specs/engineering-dispatch/development-tasks-v1.json \
            "${args[@]}" > "$RUNNER_TEMP/plasma-dev-auth.json"
          python3 - "$RUNNER_TEMP/plasma-dev-auth.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data=json.load(f)
          assert data["status"] == "AUTHORIZED_DEV_TASK"
          with open(sys.argv[2],"a",encoding="utf-8") as f:
              for k in ("pinned_sha","trusted_sha","pr_number",
                        "registry_sha256","execution_path","task_id"):
                  f.write(f"{k}={data[k]}\n")
          PY

  development-execute:
    needs: development-authorize
    if: >-
      github.event_name == 'issue_comment' &&
      needs.development-authorize.result == 'success' &&
      needs.development-authorize.outputs.execution_path == 'path2-cli'
    runs-on: [self-hosted, linux, x64, plasma-codex]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check SWPC identity and trusted dispatcher SHA
        shell: bash
        env:
          TRUSTED_SHA: ${{ needs.development-authorize.outputs.trusted_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = issue_comment
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$TRUSTED_SHA"
          test "$GITHUB_REPOSITORY" = physicslu/plasma
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$RUNNER_NAME" = SWPC-plasma-codex
          test "$(hostname)" = SWPC
          test "$(id -un)" = plasma-codex
          test "$(id -u)" -ne 0
      - name: Checkout trusted main dispatcher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.development-authorize.outputs.trusted_sha }}
          path: trusted
          persist-credentials: false
          clean: true
      - name: Checkout authorized candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.development-authorize.outputs.pinned_sha }}
          path: candidate
          persist-credentials: false
          clean: true
      - name: Execute candidate CLI using trusted dispatcher
        shell: bash
        env:
          TRUSTED_SHA: ${{ needs.development-authorize.outputs.trusted_sha }}
          PINNED_SHA: ${{ needs.development-authorize.outputs.pinned_sha }}
          PR_NUMBER: ${{ needs.development-authorize.outputs.pr_number }}
          REGISTRY_SHA256: ${{ needs.development-authorize.outputs.registry_sha256 }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$PINNED_SHA"
          python3 trusted/scripts/plasma_development_dispatch.py execute \
            --event "$GITHUB_EVENT_PATH" \
            --registry candidate/specs/engineering-dispatch/development-tasks-v1.json \
            --workspace candidate --evidence-dir "$RUNNER_TEMP" \
            --trusted-sha "$TRUSTED_SHA" --pinned-sha "$PINNED_SHA" \
            --pr-number "$PR_NUMBER" --registry-sha256 "$REGISTRY_SHA256" \
            > "$RUNNER_TEMP/plasma-path2-receipt.json"
          cat "$RUNNER_TEMP/plasma-path2-receipt.json"
          git -C trusted diff --exit-code
          git -C candidate diff --exit-code
          sha256sum "$RUNNER_TEMP/plasma-path2-receipt.json" \
            > "$RUNNER_TEMP/plasma-path2-receipt.json.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: plasma-development-cli-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/plasma-path2-receipt.json
            ${{ runner.temp }}/plasma-path2-receipt.json.sha256
            ${{ runner.temp }}/plasma-path2-stdout.txt
            ${{ runner.temp }}/plasma-path2-stderr.txt
          if-no-files-found: warn
          retention-days: 14

  development-codex:
    needs: development-authorize
    if: >-
      github.event_name == 'issue_comment' &&
      needs.development-authorize.result == 'success' &&
      needs.development-authorize.outputs.execution_path == 'path3-codex'
    runs-on: [self-hosted, linux, x64, plasma-codex]
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Check SWPC identity and trusted dispatcher SHA
        shell: bash
        env:
          TRUSTED_SHA: ${{ needs.development-authorize.outputs.trusted_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = issue_comment
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$TRUSTED_SHA"
          test "$GITHUB_REPOSITORY" = physicslu/plasma
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$RUNNER_NAME" = SWPC-plasma-codex
          test "$(hostname)" = SWPC
          test "$(id -un)" = plasma-codex
          test "$(id -u)" -ne 0
          command -v codex
          codex --version
      - name: Checkout trusted main dispatcher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.development-authorize.outputs.trusted_sha }}
          path: trusted
          persist-credentials: false
          clean: true
      - name: Checkout authorized candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.development-authorize.outputs.pinned_sha }}
          path: candidate
          persist-credentials: false
          clean: true
      - name: Codex autonomously tests candidate; preserve actual evidence
        shell: bash
        env:
          TRUSTED_SHA: ${{ needs.development-authorize.outputs.trusted_sha }}
          PINNED_SHA: ${{ needs.development-authorize.outputs.pinned_sha }}
          PR_NUMBER: ${{ needs.development-authorize.outputs.pr_number }}
          REGISTRY_SHA256: ${{ needs.development-authorize.outputs.registry_sha256 }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$TRUSTED_SHA"
          test "$(git -C candidate rev-parse HEAD)" = "$PINNED_SHA"
          test -z "$(git -C candidate status --porcelain --untracked-files=all)"
          python3 trusted/scripts/plasma_development_dispatch.py execute-codex \
            --event "$GITHUB_EVENT_PATH" \
            --registry candidate/specs/engineering-dispatch/development-tasks-v1.json \
            --workspace candidate \
            --trusted-sha "$TRUSTED_SHA" --pinned-sha "$PINNED_SHA" \
            --pr-number "$PR_NUMBER" --registry-sha256 "$REGISTRY_SHA256" \
            > "$RUNNER_TEMP/plasma-path3-receipt.json"
          cat "$RUNNER_TEMP/plasma-path3-receipt.json"
          git -C trusted diff --exit-code
          python3 - "$RUNNER_TEMP/plasma-path3-receipt.json" \
            "$RUNNER_TEMP/plasma-path3-source.patch" <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          with open(sys.argv[1],encoding="utf-8") as file:
              receipt=json.load(file)
          source=receipt["source_path"]
          allowed={source,receipt["output_path"],receipt["test_log_path"],
                   receipt["codex_log_path"]}
          status=subprocess.run(
              ["git","-C","candidate","status","--porcelain=v1",
               "--untracked-files=all","-z"],
              check=True,capture_output=True,
          ).stdout
          for entry in status.split(b"\0"):
              if not entry:
                  continue
              mode=entry[:2].decode("ascii")
              name=entry[3:].decode("utf-8")
              assert name in allowed and (name==source or mode=="??"), (
                  "CODEX_UNAPPROVED_WORKSPACE_CHANGE",name,mode)
              assert mode in ("??"," M"),("CODEX_STAGE_OR_CHANGE_DENIED",name,mode)
          patch=subprocess.run(
              ["git","-C","candidate","diff","--binary","--",source],
              check=True,capture_output=True,
          )
          Path(sys.argv[2]).write_bytes(patch.stdout)
          PY
          git -C candidate status --short
          sha256sum "$RUNNER_TEMP/plasma-path3-receipt.json" \
            > "$RUNNER_TEMP/plasma-path3-receipt.json.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: plasma-development-codex-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/plasma-path3-receipt.json
            ${{ runner.temp }}/plasma-path3-receipt.json.sha256
            ${{ runner.temp }}/plasma-path3-source.patch
            candidate/scripts/experiments/plasma_*_generated.py
            candidate/scripts/experiments/plasma_*_generated.csv
            candidate/scripts/experiments/plasma_*_generated.test.log
            candidate/scripts/experiments/plasma_*_generated.codex.log
          if-no-files-found: warn
          retention-days: 14

  authorize:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'physicslu/plasma' &&
      github.actor == 'physicslu' &&
      github.ref == 'refs/heads/main' &&
      vars.PLASMA_ENGINEERING_DISPATCH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      execution_path: ${{ steps.plan.outputs.execution_path }}
      pinned_sha: ${{ steps.plan.outputs.pinned_sha }}
      bundle_sha256: ${{ steps.plan.outputs.bundle_sha256 }}
      work_order_id: ${{ steps.plan.outputs.work_order_id }}
      claim_ref: ${{ steps.plan.outputs.claim_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate trusted owner, reviewed SHA and immutable bundle
        id: plan
        shell: bash
        env:
          WORK_ORDER_ID: ${{ inputs.work_order_id }}
          EXPECTED_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          [[ "$WORK_ORDER_ID" =~ ^[a-z0-9][a-z0-9-]{2,63}$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bundle="specs/engineering-dispatch/runtime-requests/$WORK_ORDER_ID.json"
          test -f "$bundle" && test ! -L "$bundle"
          python3 scripts/plasma_engineering_runtime_v1.py authorize \
            --bundle "$bundle" \
            --policy specs/engineering-dispatch/capabilities-v1.json \
            --event "$GITHUB_EVENT_PATH" \
            --expected-sha256 "$EXPECTED_SHA256" \
            > "$RUNNER_TEMP/authorization.json"
          python3 - "$RUNNER_TEMP/authorization.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          assert data["status"] == "AUTHORIZED_PENDING_ATOMIC_CLAIM"
          with open(sys.argv[2],"a",encoding="utf-8") as f:
              for field in ("execution_path","bundle_sha256","work_order_id","claim_ref"):
                  f.write(f"{field}={data[field]}\n")
              f.write(f"pinned_sha={data['reviewed_main_sha']}\n")
          PY
      - name: Atomically claim work order revision in protected Git ref
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CLAIM_REF: ${{ steps.plan.outputs.claim_ref }}
          PINNED_SHA: ${{ steps.plan.outputs.pinned_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const ref = process.env.CLAIM_REF;
            const sha = process.env.PINNED_SHA;
            if (!/^refs\/heads\/plasma-engineering-claims\/[a-z0-9][a-z0-9-]{2,63}\/r[1-9][0-9]*$/.test(ref)) {
              throw new Error("INVALID_CLAIM_REF");
            }
            if (!/^[a-f0-9]{40}$/.test(sha) || sha !== context.sha) {
              throw new Error("INVALID_PINNED_SHA");
            }
            // createRef is an atomic GitHub API create: existing ref fails.
            // The active claims ruleset forbids subsequent mutation/deletion.
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo, ref, sha
            });
            const bare = ref.slice("refs/".length);
            const readback = await github.rest.git.getRef({
              owner: context.repo.owner, repo: context.repo.repo, ref: bare
            });
            if (readback.data.ref !== ref || readback.data.object.sha !== sha) {
              throw new Error("CLAIM_READBACK_FAILED");
            }

  execute:
    needs: authorize
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.authorize.result == 'success' &&
      vars.PLASMA_ENGINEERING_DISPATCH_ENABLED == 'true' &&
      (needs.authorize.outputs.execution_path == 'path2-cli' ||
       needs.authorize.outputs.execution_path == 'path3-codex')
    # Do not assign this label to the current hardware-capable plasma-codex worker.
    runs-on: [self-hosted, linux, x64, plasma-dispatch-isolated]
    timeout-minutes: 17
    permissions:
      contents: read
    steps:
      - name: Trusted worker event / runner admission before checkout
        shell: bash
        env:
          PINNED_SHA: ${{ needs.authorize.outputs.pinned_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = physicslu/plasma
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$PINNED_SHA"
          test "$RUNNER_NAME" = SWPC-plasma-dispatch-isolated
          test "$RUNNER_ENVIRONMENT" = self-hosted
          test "$(id -u)" -ne 0
          test -z "${SSH_AUTH_SOCK:-}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.pinned_sha }}
          persist-credentials: false
          clean: true
      - name: Execute only claimed, bounded CLI/Codex task in OS-isolated worker
        shell: bash
        env:
          WORK_ORDER_ID: ${{ needs.authorize.outputs.work_order_id }}
          EXPECTED_SHA256: ${{ needs.authorize.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          [[ "$WORK_ORDER_ID" =~ ^[a-z0-9][a-z0-9-]{2,63}$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          bundle="specs/engineering-dispatch/runtime-requests/$WORK_ORDER_ID.json"
          python3 scripts/plasma_engineering_runtime_v1.py worker \
            --bundle "$bundle" \
            --policy specs/engineering-dispatch/capabilities-v1.json \
            --expected-sha256 "$EXPECTED_SHA256" > "$RUNNER_TEMP/dispatch-result.json"
          sha256sum "$RUNNER_TEMP/dispatch-result.json" > "$RUNNER_TEMP/dispatch-result.json.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: plasma-runtime-dispatch-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dispatch-result.json
            ${{ runner.temp }}/dispatch-result.json.sha256
          if-no-files-found: warn
          retention-days: 14
