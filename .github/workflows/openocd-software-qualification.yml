      - "data/ic-support/profiles/memory-geometry/stm32f103vd-384k-v0.json"
      - "data/ic-support/profiles/memory-geometry/stm32f103ve-512k-v0.json"
      - "data/ic-support/profiles/memory-geometry/stm32f103zc-256k-v0.json"
      - "data/ic-support/profiles/memory-geometry/stm32f103zd-384k-v0.json"
      - "data/ic-support/profiles/memory-geometry/stm32f103ze-512k-v0.json"
      - "data/ic-support/openocd-comparison/stm32f103c8t6-openocd-v0.12.0-v1.json"
      - "data/ic-support/openocd-comparison/stm32f103-high-density-openocd-v0.12.0-v1.json"
      - "data/ic-support/benchmarks/stm32f103c/vendor-neutral-admission-contract-v1.json"
      - "data/ic-support/benchmarks/stm32f103-high-density/programming-review-v1.json"
      - "data/ic-support/benchmarks/stm32f103-high-density/programming-review-v2.json"
      - "data/ic-support/benchmarks/stm32f103-high-density/programming-review-v3.json"
      - "data/ic-support/profiles/programming/stm32f1-medium-density-flash-v0.json"
      - "data/ic-support/profiles/programming/stm32f1-high-density-flash-v0.json"
      - "data/ic-support/bindings/stm32f103c-pilot-v0.json"
      - "data/ic-support/manufacturer-baseline/stm32f103c8t6-manufacturer-only-v1.json"
      - "data/ic-support/execution-ir/stm32f103c-programming-execution-ir-v0.json"
      - ".github/workflows/openocd-software-qualification.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Phase 2 qualification diff whitespace
        run: git diff --check HEAD^1 HEAD
      - name: Validate ADR-0002 Phase 2 software qualification registry
        env:
          PYTHONPATH: software/python
        run: |
          python -m py_compile \
            software/python/plasma_web/openocd_software_qualification.py \
            software/python/plasma_web/programming_qualification.py
          python software/python/tests/test_openocd_software_qualification_v1.py
          python software/python/tests/test_programming_qualification.py
          python software/python/tests/test_stm32f103_low_density_v10_candidate.py
      - name: Collect official DS5936 original PDF hash (host-only evidence, not L2 authority)
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          ok=0
          for url in \
            https://www.st.com/resource/en/datasheet/stm32f103c6.pdf \
            https://www.st.com/resource/en/datasheet/cd00210843.pdf; do
            if curl --fail --silent --show-error --location --retry 1 --connect-timeout 10 --max-time 45 \
              --user-agent 'Mozilla/5.0 PLASMA-DS5936-Evidence/1.0' "$url" -o "$tmp"; then
              if [[ "$(head -c 5 "$tmp")" == '%PDF-' ]]; then
                echo "DS5936_OFFICIAL_URL=$url"
                echo "DS5936_ORIGINAL_BYTE_LENGTH=$(wc -c < "$tmp" | tr -d ' ')"
                echo "DS5936_SHA256=$(sha256sum "$tmp" | cut -d ' ' -f 1)"
                ok=1
                break
              fi
            fi
          done
          if [[ "$ok" -ne 1 ]]; then
            echo 'DS5936_ORIGINAL_BYTES=NOT_AVAILABLE; L2 admission remains blocked'
          fi
      - name: Report reviewed software support
        env:
          PYTHONPATH: software/python
        run: |
          python - <<'PY'
          import json
          from plasma_web.openocd_software_qualification import (
              get_default_openocd_software_qualification_registry,
          )
          from plasma_web.programming_qualification import (
              get_default_programming_qualification_registry,
          )
          provider = get_default_openocd_software_qualification_registry()
          assert provider is not None
          registry = get_default_programming_qualification_registry()
          print(json.dumps(registry.summary, indent=2, sort_keys=True))
          print("ST_PROVIDER_SUPPORTED=" + ",".join(provider.supported_exact_icpns()))
          PY
