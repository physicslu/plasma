name: STM32G0 Phase 4.8B final replay one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32g0-phase48b-discovery
    paths:
      - .github/workflows/device-catalog-stm32g0-phase48b-final-replay-oneoff.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay permanent STM32G0 Phase 4.8A/4.8B gates
        run: |
          python data/device-catalog/research/test_stm32g0_phase4_8a_foundation.py
          python data/device-catalog/research/test_stm32g0_dual_surface_evidence.py
          python data/device-catalog/research/test_stm32g0_phase4_8b_discovery.py
          python data/device-catalog/research/validate_stm32g0_phase4_8b_retained_evidence.py
