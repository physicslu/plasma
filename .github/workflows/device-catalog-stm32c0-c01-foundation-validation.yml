name: STM32C0 C0.1 foundation validation

on:
  pull_request:
    paths:
      - "data/device-catalog/research/stm32c0_phase_c0_1_foundation.py"
      - "data/device-catalog/research/stm32c0-phase-c0.1-foundation-baseline.json"
      - "data/device-catalog/research/test_stm32c0_phase_c0_1_foundation.py"
      - "data/device-catalog/research/validate_stm32c0_phase_c0_1_foundation.py"
      - "data/device-catalog/research/stm32-post-u0-next-family-selection.json"
      - "data/device-catalog/research/stm32-c0-l0-post-u0-ordering-authority-review.json"
      - "data/device-catalog/research/evidence/stm32-c0-l1-l0-post-u0-live-2026-09-11/**"
      - "data/device-catalog/research/openocd-parts-canonical.csv"
      - ".github/workflows/device-catalog-stm32c0-c01-foundation-validation.yml"
  push:
    branches: [main]
    paths:
      - "data/device-catalog/research/stm32c0_phase_c0_1_foundation.py"
      - "data/device-catalog/research/stm32c0-phase-c0.1-foundation-baseline.json"
      - "data/device-catalog/research/test_stm32c0_phase_c0_1_foundation.py"
      - "data/device-catalog/research/validate_stm32c0_phase_c0_1_foundation.py"
      - "data/device-catalog/research/stm32-post-u0-next-family-selection.json"
      - "data/device-catalog/research/stm32-c0-l0-post-u0-ordering-authority-review.json"
      - "data/device-catalog/research/evidence/stm32-c0-l1-l0-post-u0-live-2026-09-11/**"
      - "data/device-catalog/research/openocd-parts-canonical.csv"
      - ".github/workflows/device-catalog-stm32c0-c01-foundation-validation.yml"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run C0.1 negative controls
        run: python data/device-catalog/research/test_stm32c0_phase_c0_1_foundation.py
      - name: Replay frozen C0.1 baseline
        run: python data/device-catalog/research/stm32c0_phase_c0_1_foundation.py --check
      - name: Report frozen baseline digest
        run: sha256sum data/device-catalog/research/stm32c0-phase-c0.1-foundation-baseline.json
      - name: Run C0.1 hard-lock validator when present
        shell: bash
        run: |
          if test -f data/device-catalog/research/validate_stm32c0_phase_c0_1_foundation.py; then
            python data/device-catalog/research/validate_stm32c0_phase_c0_1_foundation.py
          fi
