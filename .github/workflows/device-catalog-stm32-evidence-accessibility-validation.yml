name: STM32 evidence accessibility validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/device-catalog/research/stm32_evidence_accessibility_probe.py"
      - "data/device-catalog/research/test_stm32_evidence_accessibility_probe.py"
      - "data/device-catalog/research/validate_stm32_evidence_accessibility_probe_retained.py"
      - "data/device-catalog/research/stm32-evidence-accessibility-probe-manifest.json"
      - "data/device-catalog/research/stm32-evidence-accessibility-probe-baseline.json"
      - "data/device-catalog/research/evidence/stm32-u0-c0-l1-evidence-accessibility-probe-live-2026-09-10/**"
      - "data/device-catalog/research/stm32-u0-c0-ordering-authority-review.json"
      - "data/device-catalog/research/stm32-next-family-selection.json"
      - "data/device-catalog/research/test_stm32_u0_c0_ordering_selection.py"
      - "data/device-catalog/research/validate_stm32_u0_c0_ordering_selection.py"
      - "data/device-catalog/research/stm32u0_phase_u0_1_foundation.py"
      - "data/device-catalog/research/stm32u0-phase-u0.1-foundation-baseline.json"
      - "data/device-catalog/research/test_stm32u0_phase_u0_1_foundation.py"
      - "data/device-catalog/research/validate_stm32u0_phase_u0_1_foundation.py"
      - "data/device-catalog/research/device-catalog-stm32u0-phase-u0.1-foundation.md"
      - "data/device-catalog/research/stm32-cross-family-prioritization-baseline.json"
      - "data/device-catalog/research/openocd-parts-canonical.csv"
      - "data/device-catalog/production/icpn-v1-manifest.json"
      - ".github/workflows/device-catalog-stm32-evidence-accessibility-validation.yml"
  push:
    branches:
      - main
    paths:
      - "data/device-catalog/research/stm32_evidence_accessibility_probe.py"
      - "data/device-catalog/research/test_stm32_evidence_accessibility_probe.py"
      - "data/device-catalog/research/validate_stm32_evidence_accessibility_probe_retained.py"
      - "data/device-catalog/research/stm32-evidence-accessibility-probe-manifest.json"
      - "data/device-catalog/research/stm32-evidence-accessibility-probe-live-2026-09-10/**"
      - "data/device-catalog/research/stm32-u0-c0-ordering-authority-review.json"
      - "data/device-catalog/research/stm32-next-family-selection.json"
      - "data/device-catalog/research/test_stm32_u0_c0_ordering_selection.py"
      - "data/device-catalog/research/validate_stm32_u0_c0_ordering_selection.py"
      - "data/device-catalog/research/stm32u0_phase_u0_1_foundation.py"
      - "data/device-catalog/research/stm32u0-phase-u0.1-foundation-baseline.json"
      - "data/device-catalog/research/test_stm32u0_phase_u0_1_foundation.py"
      - "data/device-catalog/research/validate_stm32u0_phase_u0_1_foundation.py"
      - "data/device-catalog/research/device-catalog-stm32u0-phase-u0.1-foundation.md"
      - "data/device-catalog/research/stm32-cross-family-prioritization-baseline.json"
      - "data/device-catalog/research/openocd-parts-canonical.csv"
      - "data/device-catalog/production/icpn-v1-manifest.json"
      - ".github/workflows/device-catalog-stm32-evidence-accessibility-validation.yml"

permissions:
  contents: read

jobs:
  validate-evidence-accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate probe policy and negative controls
        run: python data/device-catalog/research/test_stm32_evidence_accessibility_probe.py
      - name: Replay immutable retained manufacturer evidence
        run: python data/device-catalog/research/validate_stm32_evidence_accessibility_probe_retained.py
      - name: Validate U0/C0 ordering-selection negative controls
        run: python data/device-catalog/research/test_stm32_u0_c0_ordering_selection.py
      - name: Replay U0/C0 ordering evidence and research selection
        run: python data/device-catalog/research/validate_stm32_u0_c0_ordering_selection.py
      - name: Validate STM32U0 U0.1 foundation negative controls
        run: python data/device-catalog/research/test_stm32u0_phase_u0_1_foundation.py
      - name: Replay STM32U0 U0.1 frozen foundation
        run: python data/device-catalog/research/validate_stm32u0_phase_u0_1_foundation.py
