name: TEMP run STM32C0 C0.5 generator v2

on:
  push:
    branches:
      - agent/device-catalog-stm32c0-phase-c05-publication
    paths:
      - ".github/workflows/tmp-run-stm32c0-c05-generator-v2.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-stm32c0-phase-c05-publication
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract and run deterministic generator with normalized paths
        env:
          PYTHONPATH: data/device-catalog/research
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/tmp-stm32c0-c05-generate.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(src) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(src)) if src[i] == '          PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end]) + '\n'
          code = code.replace('HERE = Path("data/device-catalog/research")', 'HERE = Path("data/device-catalog/research").resolve()', 1)
          Path('/tmp/stm32c0_c05_generate.py').write_text(code)
          PY
          python /tmp/stm32c0_c05_generate.py
      - name: Commit generated publication bytes
        run: |
          git config user.name "plasma-catalog-bot"
          git config user.email "plasma-catalog-bot@users.noreply.github.com"
          git add \
            data/device-catalog/production/icpn-v1-manifest.json \
            data/device-catalog/research/stm32c0-commercial-icpn.csv \
            data/device-catalog/research/stm32c0-phase-c0.5-publication-proposal.json \
            data/device-catalog/research/stm32c0-phase-c0.5-publication-audit.json
          git commit -m "C0.5: generate deterministic STM32C0 publication bytes"
          git push origin HEAD:agent/device-catalog-stm32c0-phase-c05-publication
