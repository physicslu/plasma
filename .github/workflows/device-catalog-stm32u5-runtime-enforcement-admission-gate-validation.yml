name: STM32U5 runtime enforcement admission gate validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32u5-runtime-enforcement-policy.json'
      - 'data/device-catalog/research/stm32u5_runtime_enforcement.py'
      - 'data/device-catalog/research/validate_stm32u5_runtime_enforcement_admission_gate.py'
      - 'data/device-catalog/research/device-catalog-stm32u5-runtime-enforcement-admission-gate.md'
      - 'data/device-catalog/research/stm32u5-security-state-model.json'
      - 'data/device-catalog/research/stm32u5_security_state_gate.py'
      - '.github/workflows/device-catalog-stm32u5-runtime-enforcement-admission-gate-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STM32U5 runtime enforcement gate
        working-directory: data/device-catalog/research
        run: python validate_stm32u5_runtime_enforcement_admission_gate.py
