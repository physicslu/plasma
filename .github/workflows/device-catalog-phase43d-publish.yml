name: Device catalog Phase 4.3D controlled STM32F2 Production publish
on:
  push:
    branches: [agent/device-catalog-phase43d-stm32f2-admission]
    paths: [".github/workflows/device-catalog-phase43d-publish.yml"]
  workflow_dispatch:
permissions: {actions: read, contents: write}
jobs:
  publish:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase43d-stm32f2-admission, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: phase43d-stm32f2-admission-proposal, path: /tmp/phase43d, repository: physicslu/plasma, run-id: 34070625312, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Publish exact artifact-bound STM32F2 family
        run: |
          PYTHONPATH=data/device-catalog/research python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from device_catalog_admission_framework import read_csv,write_canonical_dataset
          from stm32f2_phase4_3d_admission import admission_plan_is_clean

          root=Path('data/device-catalog/research')
          canonical=root/'stm32f2-commercial-icpn.csv'
          manifest_path=Path('data/device-catalog/production/icpn-v1-manifest.json')
          raw=Path('/tmp/phase43d/admission-plan.json').read_bytes()
          plan_sha=hashlib.sha256(raw).hexdigest()
          if plan_sha!='b657e31ea214348e3153acc7a2514b11b48b88de4ca84f31237cf0574a36a8e8': raise SystemExit('proposal hash mismatch')
          plan=json.loads(raw)
          if not admission_plan_is_clean(plan): raise SystemExit('unclean Phase 4.3D plan')
          fields,before=read_csv(canonical)
          if before: raise SystemExit('STM32F2 pre-state is not empty')
          manifest=json.loads(manifest_path.read_text())
          families={source['family']:source for source in manifest['sources']}
          if set(families)!={'STM32F1','STM32F4'} or families['STM32F1']['row_count']!=75 or families['STM32F4']['row_count']!=384: raise SystemExit('Production manifest pre-state mismatch')
          result=write_canonical_dataset(plan=plan,canonical_path=canonical)
          _,after=read_csv(canonical)
          expected={item['icpn'] for item in plan['candidates']}
          if result['status']!='written' or len(after)!=9 or {row['icpn'] for row in after}!=expected: raise SystemExit('STM32F2 publish mismatch')
          data=canonical.read_bytes()
          source={
            'manufacturer':'STMicroelectronics','family':'STM32F2','path':'../research/stm32f2-commercial-icpn.csv','row_count':9,
            'git_blob_sha':hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest(),
            'sha256':hashlib.sha256(data).hexdigest(),
          }
          manifest['sources'].append(source)
          manifest['sources'].sort(key=lambda item:item['family'])
          manifest_path.write_text(json.dumps(manifest,indent=2)+'\n')
          (root/'stm32f2-phase4.3d-admission-plan.json').write_bytes(raw)
          audit={
            'schema_version':1,'phase':'4.3D','status':'published','proposal_run_id':34070625312,
            'proposal_artifact_id':10000326131,'proposal_artifact_zip_sha256':'871ca9719279278d3cad7563164324626951288605e165f664e7f63adc028a12',
            'admission_plan_sha256':plan_sha,'production_exact_icpns_before':459,'production_exact_icpns_after':468,
            'production_family_count_before':2,'production_family_count_after':3,
            'stm32f2_rows_before':0,'stm32f2_rows_after':9,'stm32f2_base_devices_after':4,
            'added_exact_icpns':sorted(expected),'lifecycle_exclusions':[],
            'canonical_csv_file_sha256':source['sha256'],'canonical_csv_git_blob_sha':source['git_blob_sha'],
            'programming_algorithm_equivalence_claimed':False,'runtime_programming_support_claimed':False,
            'full_stm32f2_surface_covered':False,
          }
          (root/'stm32f2-phase4.3d-admission-audit.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit controlled publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/production/icpn-v1-manifest.json data/device-catalog/research/stm32f2-commercial-icpn.csv data/device-catalog/research/stm32f2-phase4.3d-admission-plan.json data/device-catalog/research/stm32f2-phase4.3d-admission-audit.json
          git commit -m 'device-catalog: admit Phase 4.3D STM32F2 exact ICPNs'
          git push origin HEAD:agent/device-catalog-phase43d-stm32f2-admission
