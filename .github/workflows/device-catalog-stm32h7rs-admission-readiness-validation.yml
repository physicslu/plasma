name: STM32H7RS admission readiness validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32h7rs_admission_readiness.py'
      - 'data/device-catalog/research/stm32h7rs-admission-readiness.json'
      - 'data/device-catalog/research/stm32h7rs-metadata-authority.json'
      - 'data/device-catalog/research/stm32h7rs-commercial-icpn.csv'
      - 'data/device-catalog/research/validate_stm32h7rs_admission_readiness.py'
      - '.github/workflows/device-catalog-stm32h7rs-admission-readiness-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STM32H7RS admission readiness
        run: python data/device-catalog/research/validate_stm32h7rs_admission_readiness.py
