name: STM32L4 L4.2 discovery validation

on:
  pull_request:
    paths:
      - "data/device-catalog/research/stm32l4_phase_l4_1_foundation.py"
      - "data/device-catalog/research/stm32l4-phase-l4.1-foundation-baseline.json"
      - "data/device-catalog/research/stm32l4_phase_l4_2_discovery.py"
      - "data/device-catalog/research/run_stm32l4_phase_l4_2_discovery.py"
      - "data/device-catalog/research/test_stm32l4_phase_l4_2_discovery.py"
      - "data/device-catalog/research/validate_stm32l4_phase_l4_2_retained_evidence.py"
      - "data/device-catalog/research/stm32l4-phase-l4.2-discovery-manifest.json"
      - "data/device-catalog/research/stm32l4-phase-l4.2-discovery-baseline.json"
      - "data/device-catalog/research/evidence/stm32l4-l4.2-official-st-discovery-live-2026-09-13/**"
      - "data/device-catalog/research/openocd-parts-canonical.csv"
      - ".github/workflows/device-catalog-stm32l4-l42-discovery-validation.yml"
  push:
    branches: [main]
    paths:
      - "data/device-catalog/research/stm32l4_phase_l4_1_foundation.py"
      - "data/device-catalog/research/stm32l4-phase-l4.1-foundation-baseline.json"
      - "data/device-catalog/research/stm32l4_phase_l4_2_discovery.py"
      - "data/device-catalog/research/run_stm32l4_phase_l4_2_discovery.py"
      - "data/device-catalog/research/test_stm32l4_phase_l4_2_discovery.py"
      - "data/device-catalog/research/validate_stm32l4_phase_l4_2_retained_evidence.py"
      - "data/device-catalog/research/stm32l4-phase-l4.2-discovery-manifest.json"
      - "data/device-catalog/research/stm32l4-phase-l4.2-discovery-baseline.json"
      - "data/device-catalog/research/evidence/stm32l4-l4.2-official-st-discovery-live-2026-09-13/**"
      - "data/device-catalog/research/openocd-parts-canonical.csv"
      - ".github/workflows/device-catalog-stm32l4-l42-discovery-validation.yml"

permissions:
  contents: read

jobs:
  discovery-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run L4.2 negative controls
        run: python data/device-catalog/research/test_stm32l4_phase_l4_2_discovery.py
      - name: Replay deterministic 138-Base-Device manifest
        run: |
          python data/device-catalog/research/stm32l4_phase_l4_2_discovery.py \
            --targets-output /tmp/stm32l4-l4.2-targets.json >/tmp/stm32l4-l4.2-targets.stdout
          cmp /tmp/stm32l4-l4.2-targets.json data/device-catalog/research/stm32l4-phase-l4.2-discovery-manifest.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/stm32l4-l4.2-targets.json'))
          assert p['base_device_count'] == 138
          assert len(p['base_device_counts_by_subfamily']) == 24
          assert all(v is False for v in p['claims'].values())
          print('L4.2 deterministic manifest replay: PASS (138 Base Devices)')
          PY
      - name: Hard-lock retained manufacturer evidence
        run: python data/device-catalog/research/validate_stm32l4_phase_l4_2_retained_evidence.py
      - name: Enforce zero Production writes in this transaction
        if: github.event_name == 'pull_request'
        run: git diff --exit-code "${{ github.event.pull_request.base.sha }}...HEAD" -- data/device-catalog/production
