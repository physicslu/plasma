name: IC Support official source integrity

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify-official-source-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify locked official PDF bytes
        run: python data/ic-support/evidence/source_integrity.py verify
