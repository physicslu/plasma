name: STM32C0 Layer-1 admission proposal v5.5

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/prepare_stm32c0_layer1_admission_proposal_v55.py'
      - 'data/device-catalog/research/test_prepare_stm32c0_layer1_admission_proposal_v55.py'
      - 'data/device-catalog/research/STM32C0_LAYER1_ADMISSION_PROPOSAL_V55.md'
      - 'data/device-catalog/research/stm32c0-layer1-admission-proposal-v5.5.json'
      - 'data/device-catalog/research/validate_stm32c0_layer1_proposal_lock_v55.py'
      - '.github/workflows/device-catalog-stm32c0-layer1-proposal-v55.yml'

permissions:
  contents: read

jobs:
  proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate STM32C0 delta proposal
        run: |
          python data/device-catalog/research/prepare_stm32c0_layer1_admission_proposal_v55.py \
            --proposal /tmp/stm32c0-v55.csv \
            --summary /tmp/stm32c0-v55.json
          python -m unittest discover -s data/device-catalog/research \
            -p test_prepare_stm32c0_layer1_admission_proposal_v55.py -v
          if [ -f data/device-catalog/research/validate_stm32c0_layer1_proposal_lock_v55.py ]; then
            python data/device-catalog/research/validate_stm32c0_layer1_proposal_lock_v55.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stm32c0-layer1-admission-proposal-v55
          path: |
            /tmp/stm32c0-v55.csv
            /tmp/stm32c0-v55.json
          if-no-files-found: error
          retention-days: 30
