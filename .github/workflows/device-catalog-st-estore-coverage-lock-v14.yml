name: ST eStore Active coverage lock v1.4
on:
  pull_request:
    paths:
      - 'data/device-catalog/research/st-estore-active-exact-coverage-lock-v1.4.json'
      - 'data/device-catalog/research/st-estore-v13-family-coverage-v1.4.csv'
      - 'data/device-catalog/research/validate_st_estore_active_coverage_lock_v14.py'
      - 'data/device-catalog/research/ST_ESTORE_ACTIVE_COVERAGE_LOCK_V14.md'
      - '.github/workflows/device-catalog-st-estore-coverage-lock-v14.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python data/device-catalog/research/validate_st_estore_active_coverage_lock_v14.py
