name: STM32H7-classic exact ICPN discovery validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32h7_classic_exact_icpn_discovery.py'
      - 'data/device-catalog/research/validate_stm32h7_classic_exact_icpn_discovery.py'
      - 'data/device-catalog/research/stm32h7-partition-source.json'
      - 'data/device-catalog/research/stm32h7-classic-scope-selection.json'
      - 'data/device-catalog/research/evidence/stm32h7-classic-accessibility-live-2026-09-18/**'
      - 'data/device-catalog/research/evidence/stm32h7-classic-exact-icpn-live-2026-09-18/**'
      - '.github/workflows/device-catalog-stm32h7-classic-exact-icpn-discovery-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'data/device-catalog/research/stm32h7_classic_exact_icpn_discovery.py'
      - 'data/device-catalog/research/validate_stm32h7_classic_exact_icpn_discovery.py'
      - 'data/device-catalog/research/stm32h7-partition-source.json'
      - 'data/device-catalog/research/stm32h7-classic-scope-selection.json'
      - 'data/device-catalog/research/evidence/stm32h7-classic-accessibility-live-2026-09-18/**'
      - 'data/device-catalog/research/evidence/stm32h7-classic-exact-icpn-live-2026-09-18/**'
      - '.github/workflows/device-catalog-stm32h7-classic-exact-icpn-discovery-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate retained STM32H7-classic exact ICPN discovery
        run: python data/device-catalog/research/validate_stm32h7_classic_exact_icpn_discovery.py
