name: Device catalog Phase 4.2A C/T LQFP48 policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-ct-lqfp48-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded C/T LQFP48 policy delta
        run: |
          python data/device-catalog/research/test_stm32f4_phase4_2a_ct_lqfp48_policy.py
          python data/device-catalog/research/test_stm32f4_phase4_1_rt_policy.py
