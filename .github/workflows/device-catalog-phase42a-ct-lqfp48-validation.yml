name: Device catalog Phase 4.2A C/T LQFP48 policy

on:
  pull_request:
    paths:
      - "data/device-catalog/**"
      - "software/python/plasma_web/device_catalog.py"
      - ".github/workflows/device-catalog-phase42a-ct-lqfp48-validation.yml"
  push:
    branches:
      - main
    paths:
      - "data/device-catalog/**"
      - "software/python/plasma_web/device_catalog.py"
      - ".github/workflows/device-catalog-phase42a-ct-lqfp48-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-ct-lqfp48-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bounded C/T LQFP48 policy delta
        run: |
          python data/device-catalog/research/test_stm32f4_phase4_2a_ct_lqfp48_policy.py
          python data/device-catalog/research/test_stm32f4_phase4_1_rt_policy.py
