name: STM32F7 Phase 4.6A foundation validation one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f7-phase46a-foundation
    paths:
      - ".github/workflows/device-catalog-stm32f7-phase46a-surface-inspection-oneoff.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate permanent Phase 4.6A contract
        run: python data/device-catalog/research/test_stm32f7_phase4_6a_foundation.py
      - name: Verify no STM32F7 Production publication occurred
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('data/device-catalog/production/icpn-v1-manifest.json').read_text())
          assert all(source.get('family') != 'STM32F7' for source in manifest['sources'])
          print('STM32F7_PRODUCTION_WRITE=NONE')
          PY
