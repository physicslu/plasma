name: STM32 post-U0 next-family selection validation

on:
  pull_request:
    paths:
      - "data/device-catalog/research/stm32_post_u0_evidence_probe.py"
      - "data/device-catalog/research/run_stm32_post_u0_evidence_probe.py"
      - "data/device-catalog/research/stm32_post_u0_qr_evidence.py"
      - "data/device-catalog/research/run_stm32_post_u0_qr_method_diagnostic.py"
      - "data/device-catalog/research/test_stm32_post_u0_evidence_probe.py"
      - "data/device-catalog/research/stm32_post_u0_selection.py"
      - "data/device-catalog/research/test_stm32_post_u0_selection.py"
      - "data/device-catalog/research/freeze_stm32_post_u0_selection.py"
      - "data/device-catalog/research/validate_stm32_post_u0_selection.py"
      - "data/device-catalog/research/stm32-post-u0-next-family-selection.json"
      - "data/device-catalog/research/stm32-c0-l0-post-u0-ordering-authority-review.json"
      - "data/device-catalog/research/device-catalog-stm32c0-phase-c0.0-evidence-selection.md"
      - "data/device-catalog/research/evidence/stm32-c0-l1-l0-post-u0-live-2026-09-11/**"
      - "data/device-catalog/research/evidence/stm32-c0-l1-l0-post-u0-qr-live-2026-09-11/**"
      - "data/device-catalog/research/openocd-parts-canonical.csv"
      - "data/device-catalog/production/icpn-v1-manifest.json"
      - ".github/workflows/device-catalog-stm32-post-u0-selection-validation.yml"
  push:
    branches:
      - main
    paths:
      - "data/device-catalog/research/stm32_post_u0_evidence_probe.py"
      - "data/device-catalog/research/run_stm32_post_u0_evidence_probe.py"
      - "data/device-catalog/research/stm32_post_u0_qr_evidence.py"
      - "data/device-catalog/research/run_stm32_post_u0_qr_method_diagnostic.py"
      - "data/device-catalog/research/test_stm32_post_u0_evidence_probe.py"
      - "data/device-catalog/research/stm32_post_u0_selection.py"
      - "data/device-catalog/research/test_stm32_post_u0_selection.py"
      - "data/device-catalog/research/freeze_stm32_post_u0_selection.py"
      - "data/device-catalog/research/validate_stm32_post_u0_selection.py"
      - "data/device-catalog/research/stm32-post-u0-next-family-selection.json"
      - "data/device-catalog/research/stm32-c0-l0-post-u0-ordering-authority-review.json"
      - "data/device-catalog/research/device-catalog-stm32c0-phase-c0.0-evidence-selection.md"
      - "data/device-catalog/research/evidence/stm32-c0-l1-l0-post-u0-live-2026-09-11/**"
      - "data/device-catalog/research/evidence/stm32-c0-l1-l0-post-u0-qr-live-2026-09-11/**"
      - "data/device-catalog/research/openocd-parts-canonical.csv"
      - "data/device-catalog/production/icpn-v1-manifest.json"
      - ".github/workflows/device-catalog-stm32-post-u0-selection-validation.yml"

permissions:
  contents: read

jobs:
  validate-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bounded post-U0 evidence policy
        run: python data/device-catalog/research/test_stm32_post_u0_evidence_probe.py
      - name: Validate selection policy negative controls
        run: python data/device-catalog/research/test_stm32_post_u0_selection.py
      - name: Replay frozen selection bytes
        run: python data/device-catalog/research/freeze_stm32_post_u0_selection.py --check
      - name: Hard-lock C0.0 selection transaction
        run: python data/device-catalog/research/validate_stm32_post_u0_selection.py
