name: STM32L1 L1.2 headed browser calibration

on:
  pull_request:
    paths:
      - ".github/workflows/device-catalog-stm32l1-l12-headed-calibration.yml"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  headed-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research-only browser acquisition dependency
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium
      - name: Calibrate known generation-aware representative under headed Chromium
        run: |
          xvfb-run -a python - <<'PY'
          import sys
          sys.path.insert(0, 'data/device-catalog/research')
          from st_dual_surface_browser_acquisition import STDualSurfaceBrowserAcquirer
          import stm32l1_phase_l1_2_discovery as core

          base = 'STM32L100C6'
          surfaces = core.surfaces_for_base('STM32L100', base)
          base_by_url = {surface.source_url: base for surface in surfaces}
          acquired = []
          with STDualSurfaceBrowserAcquirer(
              base_by_url=base_by_url,
              family_label='STM32L1 L1.2 headed calibration',
              headless=False,
              reuse_browser=True,
              global_deadline=False,
          ) as acquirer:
              fetcher = core.RateLimitedFetcher(delay_seconds=1.0, fetcher=acquirer.fetch)
              for surface in surfaces:
                  body, final_url, etag, last_modified = fetcher(surface.source_url, 90.0)
                  evidence = core.build_discovery_evidence_record(
                      body=body,
                      source_url=surface.source_url,
                      final_url=final_url,
                      base_device=base,
                      retrieved_at_utc='2026-09-13T00:00:00Z',
                      http_etag=etag,
                      http_last_modified=last_modified,
                  )
                  acquired.append({'role': surface.role, 'source_url': surface.source_url, 'final_url': final_url, 'evidence': evidence})
          target = core.DiscoveryTarget(
              subfamily='STM32L100',
              base_device=base,
              surfaces=surfaces,
              selection_reason='headed-browser calibration only',
          )
          aggregate = core._aggregate_surface_evidence(target=target, acquired=acquired)
          assert aggregate['exact_icpns'] == ['STM32L100C6U6A', 'STM32L100C6U6ATR']
          assert [row['icpn'] for row in aggregate['excluded_non_active_part_numbers']] == ['STM32L100C6U6', 'STM32L100C6U6TR']
          print('STM32L1 L1.2 headed browser calibration: PASS')
          PY
