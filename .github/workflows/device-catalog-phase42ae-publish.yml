name: Device catalog Phase 4.2AE controlled Production publish
on:
  push:
    branches: [agent/device-catalog-phase4.2ae-f410-rx-admission]
    paths: [".github/workflows/device-catalog-phase42ae-publish.yml"]
  workflow_dispatch:
permissions: {actions: read, contents: write}
jobs:
  publish:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2ae-f410-rx-admission, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: phase42ae-f410-rx-admission-proposal, path: /tmp/phase42ae, repository: physicslu/plasma, run-id: 33936475732, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Publish exact bound proposal
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2ae-f410-rx-admission-live-2026-09-05 --baseline data/device-catalog/research/stm32f4-phase4.2ae-f410-rx-admission-baseline.json
          PYTHONPATH=data/device-catalog/research python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from device_catalog_admission_framework import read_csv,write_canonical_dataset
          from device_catalog_pipeline_framework import pipeline_plan_is_clean
          root=Path('data/device-catalog/research')
          canonical=root/'stm32f4-commercial-icpn.csv'
          evidence=root/'evidence/stm32f4-phase4.2ae-f410-rx-admission-live-2026-09-05'
          plan_out=root/'stm32f4-phase4.2ae-f410-rx-admission-plan.json'
          audit_out=root/'stm32f4-phase4.2ae-f410-rx-admission-audit.json'
          raw=Path('/tmp/phase42ae/admission-plan.json').read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          if sha!='6fd04aa2c1dfa1a362bb881f69c614b597604d1e2f14550e53e80f449fe14a9a': raise SystemExit('proposal hash mismatch')
          plan=json.loads(raw)
          expected={'STM32F410R8T6','STM32F410RBI3','STM32F410RBI6','STM32F410RBT6','STM32F410RBT6TR','STM32F410RBT7','STM32F410RBT7TR'}
          if {i['icpn'] for i in plan['candidates']}!=expected or not pipeline_plan_is_clean(plan): raise SystemExit('unclean plan')
          _,rows=read_csv(canonical)
          if len(rows)!=357 or len({r['base_device'] for r in rows})!=126: raise SystemExit('pre-state mismatch')
          result=write_canonical_dataset(plan=plan,canonical_path=canonical)
          _,after=read_csv(canonical)
          if result['rows_after']!=364 or len({r['base_device'] for r in after})!=128: raise SystemExit('post-state mismatch')
          plan_out.write_bytes(raw)
          manifest=json.loads((evidence/'manifest.json').read_text())
          if manifest['evidence_id']!='stm32f4-phase4.2ae-f410-rx-admission-2026-09-05-retained-20260904T223827Z-38671c7': raise SystemExit('evidence id mismatch')
          pilot=json.loads((evidence/'pilot-summary.json').read_text())
          exclusions={i['icpn'] for r in pilot['results'] for i in r['evidence']['excluded_non_active_part_numbers']}
          if exclusions: raise SystemExit('unexpected lifecycle exclusions')
          summary={
            'schema_version':1,
            'phase':'4.2AE',
            'proposal_run_id':33936475732,
            'proposal_artifact_id':9960336185,
            'proposal_artifact_zip_sha256':'1fc390581bab2c469826e429ff98a93d6e6d37e330a2c33566e9eb011732c416',
            'admission_plan_sha256':sha,
            'retained_evidence_id':manifest['evidence_id'],
            'production_rows_before':357,
            'production_rows_after':364,
            'production_base_devices_before':126,
            'production_base_devices_after':128,
            'added_exact_icpns':sorted(expected),
            'lifecycle_exclusions':[],
            'canonical_csv_file_sha256':hashlib.sha256(canonical.read_bytes()).hexdigest(),
            'status':'published'
          }
          audit_out.write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2ae-f410-rx-admission-live-2026-09-05 --baseline data/device-catalog/research/stm32f4-phase4.2ae-f410-rx-admission-baseline.json
      - name: Commit publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/stm32f4-commercial-icpn.csv data/device-catalog/research/stm32f4-phase4.2ae-f410-rx-admission-plan.json data/device-catalog/research/stm32f4-phase4.2ae-f410-rx-admission-audit.json
          git commit -m 'device-catalog: admit Phase 4.2AE STM32F410 Rx ICPNs'
          git push origin HEAD:agent/device-catalog-phase4.2ae-f410-rx-admission
