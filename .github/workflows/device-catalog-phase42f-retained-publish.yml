name: Device catalog Phase 4.2F retained artifact publish

on:
  push:
    branches:
      - agent/device-catalog-phase4.2f-f412re-rg-admission

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-phase4.2f-f412re-rg-admission
      - uses: actions/download-artifact@v4
        with:
          name: phase42f-stm32f4-f412re-rg-retained
          path: /tmp/phase42f
          github-token: ${{ github.token }}
          repository: physicslu/plasma
          run-id: 33592306507
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and stage retained evidence
        run: |
          set -euo pipefail
          SRC=/tmp/phase42f/retained
          DST=data/device-catalog/research/evidence/stm32f4-phase4.2f-f412re-rg-admission-live-2026-09-02
          test -d "$SRC"
          test ! -e "$DST"
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir "$SRC" \
            --baseline data/device-catalog/research/stm32f4-phase4.2f-f412re-rg-admission-baseline.json
          cp -a "$SRC" "$DST"
          cat > data/device-catalog/research/stm32f4-phase4.2f-f412re-rg-admission-retained-source.json <<'JSON'
          {
            "schema_version": 1,
            "workflow_run_id": "33592306507",
            "artifact_id": "9832182808",
            "artifact_name": "phase42f-stm32f4-f412re-rg-retained",
            "artifact_sha256": "b21c32e754c7b81bd4f2150c53e88a80ba265ca148df5bf2a7a87f3adda796c7",
            "source_discovery_run_id": "33589566576",
            "source_discovery_artifact_id": "9831285375",
            "source_discovery_artifact_sha256": "0b2a245cca793ecc42fb90293ff18744d21ea3ef68ad1cf4be39c26fc5a712da"
          }
          JSON
      - name: Commit retained evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/evidence/stm32f4-phase4.2f-f412re-rg-admission-live-2026-09-02 \
                  data/device-catalog/research/stm32f4-phase4.2f-f412re-rg-admission-retained-source.json
          git commit -m 'device-catalog: retain Phase4.2F F412RE/RG evidence'
          git push origin HEAD:agent/device-catalog-phase4.2f-f412re-rg-admission
