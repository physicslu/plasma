name: Device catalog Phase 4.1 R/T batch3 runtime contract

on:
  pull_request:

permissions:
  contents: write

jobs:
  update-runtime-contract:
    if: >-
      github.actor == 'physicslu' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/device-catalog-phase4.1-rt-admission-batch3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime test dependencies
        run: python -m pip install -e "./software/python[dev]"
      - name: Update runtime and REST catalog contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('software/python/tests/test_device_catalog.py')
          text = runtime.read_text(encoding='utf-8')
          old = text
          text = text.replace('EXPECTED_PRODUCTION_CATALOG_SIZE = 250', 'EXPECTED_PRODUCTION_CATALOG_SIZE = 261', 1)
          text = text.replace('EXPECTED_STM32F4_CATALOG_SIZE = 175', 'EXPECTED_STM32F4_CATALOG_SIZE = 186', 1)
          text = text.replace(
              '    rt_batch2 = catalog.search("stm32f405rgt7tr", limit=1)[0]\n',
              '    rt_batch2 = catalog.search("stm32f405rgt7tr", limit=1)[0]\n'
              '    rt_batch3 = catalog.search("stm32f413rgt6tr", limit=1)[0]\n',
              1,
          )
          anchor = (
              '    assert rt_batch2.identifier == "STM32F405RGT7TR"\n'
              '    assert rt_batch2.family == "STM32F4"\n'
              '    assert rt_batch2.target_config == "tcl/target/stm32f4x.cfg"\n'
          )
          replacement = anchor + (
              '    assert rt_batch3.identifier == "STM32F413RGT6TR"\n'
              '    assert rt_batch3.family == "STM32F4"\n'
              '    assert rt_batch3.target_config == "tcl/target/stm32f4x.cfg"\n'
          )
          if anchor not in text:
              raise SystemExit('runtime Batch2 assertion anchor not found')
          text = text.replace(anchor, replacement, 1)
          text = text.replace('full 175-row F4 family', 'full 186-row F4 family', 1)
          if text == old:
              raise SystemExit('runtime contract update made no changes')
          if text.count('EXPECTED_PRODUCTION_CATALOG_SIZE = 261') != 1:
              raise SystemExit('runtime catalog size replacement is not unique')
          if text.count('EXPECTED_STM32F4_CATALOG_SIZE = 186') != 1:
              raise SystemExit('runtime F4 size replacement is not unique')
          if text.count('stm32f413rgt6tr') != 1:
              raise SystemExit('runtime Batch3 search insertion is not unique')
          runtime.write_text(text, encoding='utf-8')

          gateway = Path('software/python/tests/test_device_catalog_web_gateway.py')
          text = gateway.read_text(encoding='utf-8')
          old = text
          text = text.replace('EXPECTED_PRODUCTION_CATALOG_SIZE = 250', 'EXPECTED_PRODUCTION_CATALOG_SIZE = 261', 1)
          marker = '    def test_research_only_identifier_is_not_exposed_by_production_search(self) -> None:\n'
          method = '''    def test_phase41_rt_batch3_icpn_is_exposed_after_admission(self) -> None:\n        status, payload = self.request("/api/devices/search?q=STM32F413RGT6TR&limit=5")\n        self.assertEqual(status, 200)\n        self.assertEqual(payload["catalog_size"], EXPECTED_PRODUCTION_CATALOG_SIZE)\n        self.assertEqual(payload["count"], 1)\n        result = payload["results"][0]\n        self.assertEqual(result["icpn"], "STM32F413RGT6TR")\n        self.assertEqual(result["family"], "STM32F4")\n        self.assertEqual(result["backend"]["target_config"], "tcl/target/stm32f4x.cfg")\n\n'''
          if marker not in text:
              raise SystemExit('gateway insertion marker not found')
          text = text.replace(marker, method + marker, 1)
          if text == old:
              raise SystemExit('gateway contract update made no changes')
          if text.count('EXPECTED_PRODUCTION_CATALOG_SIZE = 261') != 1:
              raise SystemExit('gateway catalog size replacement is not unique')
          if text.count('test_phase41_rt_batch3_icpn_is_exposed_after_admission') != 1:
              raise SystemExit('gateway Batch3 test insertion is not unique')
          gateway.write_text(text, encoding='utf-8')
          PY
      - name: Validate historical and current Device Catalog lifecycle
        run: |
          python data/device-catalog/research/test_stm32f4_phase4_1_rt_policy.py
          python data/device-catalog/research/test_stm32f4_phase4_1_rt_admission_batch2_post_admission.py
          python data/device-catalog/research/test_stm32f4_phase4_1_rt_admission_batch3_post_admission.py
      - name: Validate runtime and REST contracts
        env:
          PYTHONPATH: software/python
        run: |
          python -m pytest -q software/python/tests/test_device_catalog.py software/python/tests/test_device_catalog_web_gateway.py
          python -m plasma_web.device_catalog \
            --manifest data/device-catalog/production/icpn-v1-manifest.json \
            --json > /tmp/catalog.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/catalog.json').read_text(encoding='utf-8'))
          assert payload['catalog_size'] == 261
          PY
      - name: Commit runtime contract update
        run: |
          set -euo pipefail
          git config user.name 'Gordon'
          git config user.email 'physicslu@gmail.com'
          git add software/python/tests/test_device_catalog.py \
            software/python/tests/test_device_catalog_web_gateway.py
          git diff --cached --check
          git commit -m 'device-catalog: update runtime contract for 261 ICPNs'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
