name: STM32F0 validation

on:
  push:
    branches:
      - main
    paths:
      - "data/device-catalog/research/openocd-parts-canonical.csv"
      - "data/device-catalog/research/device_catalog_bounded_discovery.py"
      - "data/device-catalog/research/device_catalog_evidence_framework.py"
      - "data/device-catalog/research/st_product_page_acquisition.py"
      - "data/device-catalog/research/st_browser_acquisition.py"
      - "data/device-catalog/research/st_dual_surface_evidence.py"
      - "data/device-catalog/research/st_dual_surface_browser_acquisition.py"
      - "data/device-catalog/research/stm32f0_foundation.py"
      - "data/device-catalog/research/stm32f0-phase4.5a-foundation-baseline.json"
      - "data/device-catalog/research/test_stm32f0_phase4_5a_foundation.py"
      - "data/device-catalog/research/device-catalog-phase4.5a-stm32f0-foundation.md"
      - "data/device-catalog/research/stm32f0_dual_surface_evidence.py"
      - "data/device-catalog/research/stm32f0_browser_acquisition.py"
      - "data/device-catalog/research/stm32f0-phase4.5b-discovery-manifest.json"
      - "data/device-catalog/research/stm32f0-phase4.5b-discovery-baseline.json"
      - "data/device-catalog/research/stm32f0_phase4_5b_discovery.py"
      - "data/device-catalog/research/run_stm32f0_phase4_5b_browser_discovery.py"
      - "data/device-catalog/research/test_stm32f0_dual_surface_evidence.py"
      - "data/device-catalog/research/test_stm32f0_phase4_5b_discovery.py"
      - "data/device-catalog/research/validate_stm32f0_phase4_5b_retained_evidence.py"
      - "data/device-catalog/research/evidence/stm32f0-phase4.5b-official-st-discovery-live-2026-09-09/**"
      - "data/device-catalog/research/device-catalog-phase4.5b-stm32f0-discovery.md"
      - "data/device-catalog/research/stm32f0_metadata_policy.py"
      - "data/device-catalog/research/stm32f0_phase4_5c_policy.py"
      - "data/device-catalog/research/stm32f0-phase4.5c-policy-baseline.json"
      - "data/device-catalog/research/test_stm32f0_phase4_5c_policy.py"
      - "data/device-catalog/research/device-catalog-phase4.5c-stm32f0-policy.md"
      - ".github/workflows/device-catalog-stm32f0-validation.yml"
  pull_request:
    paths:
      - "data/device-catalog/research/openocd-parts-canonical.csv"
      - "data/device-catalog/research/device_catalog_bounded_discovery.py"
      - "data/device-catalog/research/device_catalog_evidence_framework.py"
      - "data/device-catalog/research/st_product_page_acquisition.py"
      - "data/device-catalog/research/st_browser_acquisition.py"
      - "data/device-catalog/research/st_dual_surface_evidence.py"
      - "data/device-catalog/research/st_dual_surface_browser_acquisition.py"
      - "data/device-catalog/research/stm32f0_foundation.py"
      - "data/device-catalog/research/stm32f0-phase4.5a-foundation-baseline.json"
      - "data/device-catalog/research/test_stm32f0_phase4_5a_foundation.py"
      - "data/device-catalog/research/device-catalog-phase4.5a-stm32f0-foundation.md"
      - "data/device-catalog/research/stm32f0_dual_surface_evidence.py"
      - "data/device-catalog/research/stm32f0_browser_acquisition.py"
      - "data/device-catalog/research/stm32f0-phase4.5b-discovery-manifest.json"
      - "data/device-catalog/research/stm32f0-phase4.5b-discovery-baseline.json"
      - "data/device-catalog/research/stm32f0_phase4_5b_discovery.py"
      - "data/device-catalog/research/run_stm32f0_phase4_5b_browser_discovery.py"
      - "data/device-catalog/research/test_stm32f0_dual_surface_evidence.py"
      - "data/device-catalog/research/test_stm32f0_phase4_5b_discovery.py"
      - "data/device-catalog/research/validate_stm32f0_phase4_5b_retained_evidence.py"
      - "data/device-catalog/research/evidence/stm32f0-phase4.5b-official-st-discovery-live-2026-09-09/**"
      - "data/device-catalog/research/device-catalog-phase4.5b-stm32f0-discovery.md"
      - "data/device-catalog/research/stm32f0_metadata_policy.py"
      - "data/device-catalog/research/stm32f0_phase4_5c_policy.py"
      - "data/device-catalog/research/stm32f0-phase4.5c-policy-baseline.json"
      - "data/device-catalog/research/test_stm32f0_phase4_5c_policy.py"
      - "data/device-catalog/research/device-catalog-phase4.5c-stm32f0-policy.md"
      - ".github/workflows/device-catalog-stm32f0-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-stm32f0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Phase 4.5A STM32F0 source surface and deterministic targets
        run: python data/device-catalog/research/test_stm32f0_phase4_5a_foundation.py
      - name: Validate STM32F0 dual-surface identity/lifecycle evidence
        run: python data/device-catalog/research/test_stm32f0_dual_surface_evidence.py
      - name: Validate Phase 4.5B bounded discovery and identity/capability separation
        run: python data/device-catalog/research/test_stm32f0_phase4_5b_discovery.py
      - name: Report retained Phase 4.5B baseline SHA-256
        run: sha256sum data/device-catalog/research/stm32f0-phase4.5b-discovery-baseline.json
      - name: Validate retained Phase 4.5B evidence and semantic replay
        run: python data/device-catalog/research/validate_stm32f0_phase4_5b_retained_evidence.py
      - name: Validate Phase 4.5C metadata policy and immutable baseline
        run: python data/device-catalog/research/test_stm32f0_phase4_5c_policy.py
