name: TEMP STM32 post-C0 live evidence probe

on:
  pull_request:
    paths:
      - "data/device-catalog/research/stm32_post_c0_evidence_probe.py"
      - "data/device-catalog/research/run_stm32_post_c0_evidence_probe.py"
      - "data/device-catalog/research/test_stm32_post_c0_evidence_probe.py"
      - ".github/workflows/tmp-stm32-post-c0-live-evidence.yml"

permissions:
  contents: read

concurrency:
  group: tmp-stm32-post-c0-live-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate post-C0 probe boundary
        run: python data/device-catalog/research/test_stm32_post_c0_evidence_probe.py

      - name: Install bounded browser acquisition dependencies
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium

      - name: Acquire 44 deterministic STM32L1/L0/L4 representatives
        id: acquire
        continue-on-error: true
        run: |
          mkdir -p .artifacts/post-c0/evidence
          xvfb-run -a python data/device-catalog/research/run_stm32_post_c0_evidence_probe.py \
            --delay 1.0 \
            --timeout 75 \
            --output .artifacts/post-c0/probe-summary.json \
            --targets-output .artifacts/post-c0/targets.json \
            --evidence-dir .artifacts/post-c0/evidence

      - name: Record execution provenance
        if: always() && hashFiles('.artifacts/post-c0/probe-summary.json') != ''
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('.artifacts/post-c0')
          summary = json.loads((root / 'probe-summary.json').read_text())
          manifest = pathlib.Path('data/device-catalog/production/icpn-v1-manifest.json')
          catalog = pathlib.Path('data/device-catalog/research/openocd-parts-canonical.csv')
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          provenance = {
              'schema_version': 1,
              'phase': 'post-C0-selection',
              'source_repository': os.environ['GITHUB_REPOSITORY'],
              'executed_git_sha': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'production_manifest_sha256': sha(manifest),
              'openocd_catalog_sha256': sha(catalog),
              'attempted_targets': summary.get('attempted_targets'),
              'dispositioned_targets': summary.get('dispositioned_targets'),
              'manual_review_targets': summary.get('manual_review_targets'),
              'bounded_probe_complete': summary.get('bounded_probe_complete'),
              'acquire_step_outcome': '${{ steps.acquire.outcome }}',
              'production_write_authorized': False,
              'selected_next_research_family': False,
          }
          (root / 'provenance.json').write_text(json.dumps(provenance, indent=2, sort_keys=True) + '\n')
          PY

      - name: Upload live evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32-post-c0-live-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            .artifacts/post-c0/probe-summary.json
            .artifacts/post-c0/targets.json
            .artifacts/post-c0/provenance.json
            .artifacts/post-c0/evidence/*.json

      - name: Report acquisition outcome
        if: always()
        run: echo "live acquisition outcome=${{ steps.acquire.outcome }}; inspect uploaded artifact"
