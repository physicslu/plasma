name: Device catalog Phase 4.2V STM32F423 H admission proposal
on:
  push:
    branches: [agent/device-catalog-phase4.2v-h-admission-batch2]
    paths: [".github/workflows/device-catalog-phase42v-proposal.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  propose:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2v-h-admission-batch2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build proposal
        run: |
          mkdir -p /tmp/phase42v
          PYTHONPATH=data/device-catalog/research python data/device-catalog/research/stm32f4_admission.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2v-h-admission-batch2-live-2026-09-03 \
            --baseline data/device-catalog/research/stm32f4-phase4.2v-h-admission-batch2-baseline.json \
            --admit-base STM32F423CH --admit-base STM32F423RH --admit-base STM32F423VH --admit-base STM32F423ZH \
            --output /tmp/phase42v/admission-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/phase42v/admission-plan.json').read_text())
          expected={'admit':10,'already_present':0,'manual_review_required':0,'reject':0}
          expected_icpns={'STM32F423CHU6','STM32F423RHT6','STM32F423RHT6TR','STM32F423VHH6','STM32F423VHT6','STM32F423VHT6TR','STM32F423ZHJ6','STM32F423ZHJ6I','STM32F423ZHT3','STM32F423ZHT6'}
          if p['candidate_count'] != 10 or p['decision_counts'] != expected or p['conflicts'] != 0 or p['canonical_rows_before'] != 321:
              raise SystemExit('unclean Phase 4.2V plan')
          if {x['icpn'] for x in p['candidates']} != expected_icpns:
              raise SystemExit('unexpected Phase 4.2V candidate set')
          PY
          cd /tmp/phase42v && sha256sum admission-plan.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: {name: phase42v-h-batch2-admission-proposal, path: /tmp/phase42v, if-no-files-found: error, retention-days: 30}
