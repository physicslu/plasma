name: Device catalog Phase 4.2AG materialize retained evidence
on:
  push:
    branches: [agent/device-catalog-phase4.2ag-ah-ufbga169-admission]
    paths: [".github/workflows/device-catalog-phase42ag-materialize-retained.yml"]
  workflow_dispatch:
permissions: {actions: read, contents: write}
jobs:
  materialize:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2ag-ah-ufbga169-admission, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: phase42ag-ah-ufbga169-retained, path: /tmp/phase42ag, repository: physicslu/plasma, run-id: 33944044378, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Materialize exact retained evidence
        run: |
          set -euo pipefail
          dst=data/device-catalog/research/evidence/stm32f4-phase4.2ag-ah-ufbga169-admission-live-2026-09-05
          test -f /tmp/phase42ag/retained/manifest.json
          test "$(python -c "import json; print(json.load(open('/tmp/phase42ag/retained/manifest.json'))['evidence_id'])")" = "stm32f4-phase4.2ag-ah-ufbga169-admission-2026-09-05-retained-20260905T041556Z-bee616f"
          test ! -e "$dst"
          mkdir -p "$dst"
          cp -a /tmp/phase42ag/retained/. "$dst/"
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir "$dst" --baseline data/device-catalog/research/stm32f4-phase4.2ag-ah-ufbga169-admission-baseline.json
      - name: Commit retained evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/evidence/stm32f4-phase4.2ag-ah-ufbga169-admission-live-2026-09-05
          git commit -m 'device-catalog: retain Phase 4.2AG official ST evidence'
          git push origin HEAD:agent/device-catalog-phase4.2ag-ah-ufbga169-admission
