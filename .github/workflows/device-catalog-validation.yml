name: Device catalog validation

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate-device-catalog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Phase 4.0 temporary ST browser acquisition dependencies
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium
      - name: Phase 4.0 temporary F446 retained-evidence probe
        if: github.event_name == 'pull_request'
        run: |
          xvfb-run -a python - <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path('data/device-catalog/research')
          sys.path.insert(0, str(root))

          from st_browser_acquisition import (
              BROWSER_TRANSPORT,
              CHROMIUM_LAUNCH_ARGS,
              STBrowserAcquirer,
              build_browser_evidence_record,
          )
          from stm32f4_acquisition_pilot import read_catalog, read_manifest, run_pilot

          manifest = root / 'stm32f4-phase4.0-f446-batch1-manifest.json'
          baseline_path = root / 'stm32f4-phase4.0-f446-batch1-baseline.json'
          catalog = root / 'openocd-parts-canonical.csv'

          pilot_id, targets = read_manifest(manifest)
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          expected = {
              item['base_device']: item['exact_icpns']
              for item in baseline['targets']
          }

          with STBrowserAcquirer(headless=False) as acquirer:
              summary = run_pilot(
                  pilot_id=pilot_id,
                  targets=targets,
                  catalog_rows=read_catalog(catalog),
                  fetcher=acquirer.fetch,
                  evidence_builder=build_browser_evidence_record,
                  timeout_seconds=45.0,
              )
              browser_version = acquirer.browser_version

          summary['acquisition_transport'] = BROWSER_TRANSPORT
          summary['browser_scope'] = 'pilot'
          summary['browser_runtime'] = {
              'engine': 'chromium',
              'browser_version': browser_version,
              'playwright_requirement': '1.62.0',
              'headless': False,
              'launch_args': CHROMIUM_LAUNCH_ARGS,
          }
          summary['canonical_dataset_admission'] = False

          issues = []
          if summary.get('acquisition_failure') != 0:
              issues.append('browser acquisition failure')
          if summary.get('manual_intervention_required') != 0:
              issues.append('manual intervention required')

          observed = {}
          excluded = []
          for result in summary.get('results', []):
              base = result.get('base_device')
              evidence = result.get('evidence') or {}
              observed[base] = evidence.get('exact_icpns', [])
              excluded.extend(
                  {'base_device': base, **item}
                  for item in evidence.get('excluded_non_active_part_numbers', [])
              )

          if observed != expected:
              issues.append(f'candidate baseline drift: expected={expected!r} observed={observed!r}')
          if not any(
              item.get('base_device') == 'STM32F446ZC'
              and item.get('icpn') == 'STM32F446ZCT7'
              and not str(item.get('marketing_status', '')).casefold().startswith('active')
              for item in excluded
          ):
              issues.append('STM32F446ZCT7 non-active exclusion was not observed')

          print('PHASE40_EVIDENCE_JSON_BEGIN')
          print(json.dumps(summary, indent=2, sort_keys=True))
          print('PHASE40_EVIDENCE_JSON_END')
          print('PHASE40_EXCLUDED_JSON_BEGIN')
          print(json.dumps(excluded, indent=2, sort_keys=True))
          print('PHASE40_EXCLUDED_JSON_END')

          if issues:
              raise SystemExit('\n'.join(issues))
          PY
      - name: Check device catalog diff whitespace
        run: git diff --check HEAD^1 HEAD
      - name: Validate STM32F1 commercial ICPN dataset
        run: python data/device-catalog/research/validate_stm32f1_commercial_icpn.py
      - name: Validate ST authoritative source acquisition parser
        run: python data/device-catalog/research/test_st_product_page_acquisition.py
      - name: Validate STM32F1 controlled batch acquisition pilot
        run: python data/device-catalog/research/test_stm32f1_acquisition_pilot.py
      - name: Validate STM32F1 live evidence contract
        run: python data/device-catalog/research/test_stm32f1_live_pilot.py
      - name: Validate ST transport diagnostic contract
        run: python data/device-catalog/research/test_st_transport_diagnostic.py
      - name: Validate ST browser acquisition contract
        run: python data/device-catalog/research/test_st_browser_acquisition.py
      - name: Validate generic device catalog evidence framework
        run: python data/device-catalog/research/test_device_catalog_evidence_framework.py
      - name: Validate retained STM32F1 browser evidence
        run: |
          python data/device-catalog/research/validate_stm32f1_retained_evidence.py
          python data/device-catalog/research/test_stm32f1_retained_evidence.py
      - name: Validate generic device catalog pipeline framework
        run: python data/device-catalog/research/test_device_catalog_pipeline_framework.py
      - name: Validate generic device catalog admission framework
        run: python data/device-catalog/research/test_device_catalog_admission_framework.py
      - name: Validate STM32F1 canonical admission
        run: |
          python data/device-catalog/research/validate_stm32f1_admission_plan.py
          python data/device-catalog/research/test_stm32f1_canonical_admission.py
      - name: Validate STM32F1 Phase 2.9 scaleout contract
        run: python data/device-catalog/research/test_stm32f1_phase2_9_scaleout.py
      - name: Validate STM32F4 Phase 3.1 family adapter and synthetic pipeline
        run: |
          python data/device-catalog/research/test_stm32f4_phase3_1_policy.py
          python data/device-catalog/research/test_stm32f4_phase3_1_pipeline.py
      - name: Validate STM32F4 Phase 3.1 retained evidence and canonical lifecycle
        run: |
          python data/device-catalog/research/validate_stm32f4_commercial_icpn.py
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase3.1-bounded-pilot-live-2026-08-30 \
            --baseline data/device-catalog/research/stm32f4-phase3.1-pilot-baseline.json
          python data/device-catalog/research/test_stm32f4_phase3_1_post_admission.py
      - name: Validate STM32F4 Phase 3.3 scaleout batch 1
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase3.3-scaleout-batch1-live-2026-08-30 \
            --baseline data/device-catalog/research/stm32f4-phase3.3-scaleout-batch1-baseline.json
          python data/device-catalog/research/test_stm32f4_phase3_3_scaleout.py
      - name: Validate STM32F4 Phase 3.3 scaleout batch 2
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase3.3-scaleout-batch2-live-2026-08-30 \
            --baseline data/device-catalog/research/stm32f4-phase3.3-scaleout-batch2-baseline.json
          python data/device-catalog/research/test_stm32f4_phase3_3_scaleout_batch2.py
      - name: Validate STM32F4 Phase 4.0 F446 mapping gate
        run: python data/device-catalog/research/test_stm32f4_phase4_0_f446.py
      - name: Report admitted production source SHA-256
        run: |
          sha256sum data/device-catalog/research/stm32f1-commercial-icpn.csv
          sha256sum data/device-catalog/research/stm32f4-commercial-icpn.csv
      - name: Validate ICPN v1 production manifest and runtime view
        env:
          PYTHONPATH: software/python
        run: |
          python -m plasma_web.device_catalog \
            --manifest data/device-catalog/production/icpn-v1-manifest.json \
            --json
