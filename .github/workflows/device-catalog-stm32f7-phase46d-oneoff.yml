name: STM32F7 Phase 4.6D admission-plan freeze one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f7-phase46d-admission
    paths:
      - .github/workflows/device-catalog-stm32f7-phase46d-oneoff.yml

permissions:
  contents: write

jobs:
  freeze-admission-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-stm32f7-phase46d-admission
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay closed Phase 4.6C policy
        run: |
          python data/device-catalog/research/test_stm32f7_phase4_6c_policy.py
          python data/device-catalog/research/test_stm32f7_phase4_6c_policy_plan.py
          python data/device-catalog/research/stm32f7_phase4_6c_policy.py
      - name: Validate Phase 4.6D admission negatives and clean plan
        run: python data/device-catalog/research/test_stm32f7_phase4_6d_admission.py
      - name: Generate deterministic Phase 4.6D admission plan
        run: |
          python data/device-catalog/research/stm32f7_phase4_6d_admission.py \
            --output data/device-catalog/research/stm32f7-phase4.6d-admission-plan.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('data/device-catalog/research/stm32f7-phase4.6d-admission-plan.json')
          plan = json.loads(p.read_text())
          print(json.dumps({
              'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
              'candidate_count': plan['candidate_count'],
              'decision_counts': plan['decision_counts'],
              'required_target_config': plan['required_target_config'],
              'canonical_write_applied': plan['canonical_write_applied'],
              'production_write_applied': plan['production_write_applied'],
          }, indent=2, sort_keys=True))
          PY
      - name: Commit immutable read-only admission plan
        run: |
          set -Eeuo pipefail
          git config user.name 'plasma-ci'
          git config user.email 'plasma-ci@users.noreply.github.com'
          git add data/device-catalog/research/stm32f7-phase4.6d-admission-plan.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'ERROR: admission plan generation produced no changes' >&2; exit 1; }
          git commit -m 'device-catalog: freeze STM32F7 Phase 4.6D admission plan'
          git push origin HEAD:agent/device-catalog-stm32f7-phase46d-admission
