name: STM32F7 Phase 4.6D permanent replay one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f7-phase46d-admission
    paths:
      - .github/workflows/device-catalog-stm32f7-phase46d-oneoff.yml

permissions:
  contents: read

jobs:
  permanent-admission-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay closed Phase 4.6C policy
        run: |
          python data/device-catalog/research/test_stm32f7_phase4_6c_policy.py
          python data/device-catalog/research/test_stm32f7_phase4_6c_policy_plan.py
          python data/device-catalog/research/stm32f7_phase4_6c_policy.py
      - name: Validate Phase 4.6D admission negatives
        run: python data/device-catalog/research/test_stm32f7_phase4_6d_admission.py
      - name: Replay frozen Phase 4.6D admission plan
        run: python data/device-catalog/research/validate_stm32f7_phase4_6d_admission_plan.py
      - name: Assert no Phase 4.6D publication occurred
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert not Path('data/device-catalog/research/stm32f7-commercial-icpn.csv').exists()
          manifest = json.loads(Path('data/device-catalog/production/icpn-v1-manifest.json').read_text())
          assert all(item.get('family') != 'STM32F7' for item in manifest['sources'])
          assert sum(int(item['row_count']) for item in manifest['sources']) == 544
          print('Phase 4.6D permanent replay PASS; canonical absent and Production remains 544/F7=0')
          PY
