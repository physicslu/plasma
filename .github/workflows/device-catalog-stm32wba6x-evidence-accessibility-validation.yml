name: STM32WBA6X official ST evidence accessibility validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/openocd-parts-canonical.csv'
      - 'data/device-catalog/research/stm32-post-wlx-wireless-frontier-selection.json'
      - 'data/device-catalog/research/stm32wba6x_evidence_accessibility_probe.py'
      - 'data/device-catalog/research/validate_stm32wba6x_evidence_accessibility.py'
      - 'data/device-catalog/research/stm32wba6x-evidence-accessibility-gate.json'
      - 'data/device-catalog/research/evidence/stm32wba6x-accessibility-live-2026-09-22/**'
      - '.github/workflows/device-catalog-stm32wba6x-evidence-accessibility-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'data/device-catalog/research/openocd-parts-canonical.csv'
      - 'data/device-catalog/research/stm32-post-wlx-wireless-frontier-selection.json'
      - 'data/device-catalog/research/stm32wba6x_evidence_accessibility_probe.py'
      - 'data/device-catalog/research/validate_stm32wba6x_evidence_accessibility.py'
      - 'data/device-catalog/research/stm32wba6x-evidence-accessibility-gate.json'
      - 'data/device-catalog/research/evidence/stm32wba6x-accessibility-live-2026-09-22/**'
      - '.github/workflows/device-catalog-stm32wba6x-evidence-accessibility-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate retained blocked STM32WBA6X accessibility evidence
        run: python data/device-catalog/research/validate_stm32wba6x_evidence_accessibility.py
