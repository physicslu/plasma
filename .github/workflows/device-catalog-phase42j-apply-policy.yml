# retry after Phase 4.2H growth-safe replay fix
name: Device catalog Phase 4.2J apply I/H+I/T policy

on:
  push:
    branches:
      - agent/device-catalog-phase4.2j-blocker-taxonomy
    paths:
      - ".github/workflows/device-catalog-phase42j-apply-policy.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-phase4.2j-blocker-taxonomy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded I/H and I/T package policy
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('data/device-catalog/research/stm32f4_admission_policy.py')
          s = p.read_text(encoding='utf-8')
          old = '''        ("C", "Y"): "49",\n        ("O", "Y"): "90",\n        ("R", "T"): "64",\n'''
          new = '''        ("C", "Y"): "49",\n        ("I", "H"): "176",\n        ("I", "T"): "176",\n        ("O", "Y"): "90",\n        ("R", "T"): "64",\n'''
          if s.count(old) != 1:
              raise SystemExit('expected policy anchor not found exactly once')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

          cat > data/device-catalog/research/test_stm32f4_phase4_2j_i_ht_176_policy.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import sys
          import unittest
          from pathlib import Path

          HERE = Path(__file__).resolve().parent
          if str(HERE) not in sys.path:
              sys.path.insert(0, str(HERE))

          from stm32f4_admission_policy import _package_and_pins
          from stm32f4_coverage_gap_inventory import build_inventory

          CATALOG = HERE / "openocd-parts-canonical.csv"
          CANONICAL = HERE / "stm32f4-commercial-icpn.csv"
          EXPECTED_READY = {
              "STM32F407IE", "STM32F407IG",
              "STM32F417IE", "STM32F417IG",
              "STM32F427IG", "STM32F427II",
              "STM32F429IE", "STM32F429IG", "STM32F429II",
              "STM32F437IG", "STM32F437II",
              "STM32F439IG", "STM32F439II",
              "STM32F469IE", "STM32F469IG", "STM32F469II",
              "STM32F479IG", "STM32F479II",
          }


          class STM32F4Phase42JIHT176PolicyTests(unittest.TestCase):
              def test_i_h_and_i_t_map_to_176_pin_packages(self) -> None:
                  self.assertEqual(_package_and_pins("I", "H"), ("UFBGA", "176"))
                  self.assertEqual(_package_and_pins("I", "T"), ("LQFP", "176"))

              def test_policy_unlocks_exactly_eighteen_bases(self) -> None:
                  inventory = build_inventory(catalog_path=CATALOG, canonical_path=CANONICAL)
                  self.assertEqual(inventory["production"]["exact_icpn_rows"], 211)
                  self.assertEqual(inventory["production"]["base_device_count"], 73)
                  self.assertEqual(inventory["openocd_ordering_pattern_base_device_count"], 149)
                  self.assertEqual(inventory["gap"]["base_device_count"], 76)
                  self.assertEqual(inventory["gap"]["policy_ready_count"], 18)
                  self.assertEqual(inventory["gap"]["policy_blocked_count"], 58)
                  ready = {item["base_device"] for item in inventory["gap"]["policy_ready"]}
                  self.assertEqual(ready, EXPECTED_READY)

              def test_ready_bases_require_both_h_and_t_and_have_no_residual_blocker(self) -> None:
                  inventory = build_inventory(catalog_path=CATALOG, canonical_path=CANONICAL)
                  ready = {item["base_device"]: item for item in inventory["gap"]["policy_ready"]}
                  for base in EXPECTED_READY:
                      self.assertEqual(ready[base]["package_codes"], ["H", "T"])
                      self.assertEqual(ready[base]["policy_blockers"], [])

              def test_no_production_write_occurs_in_policy_transaction(self) -> None:
                  inventory = build_inventory(catalog_path=CATALOG, canonical_path=CANONICAL)
                  production = set(inventory["production"]["base_devices"])
                  self.assertTrue(EXPECTED_READY.isdisjoint(production))


          if __name__ == "__main__":
              unittest.main()
          PY

          cat > .github/workflows/device-catalog-phase42j-i-ht176-validation.yml <<'YML'
          name: Device catalog Phase 4.2J I/H+I/T 176-pin policy

          on:
            pull_request:
              paths:
                - 'data/device-catalog/research/stm32f4_admission_policy.py'
                - 'data/device-catalog/research/stm32f4_coverage_gap_inventory.py'
                - 'data/device-catalog/research/test_stm32f4_phase4_2j_i_ht_176_policy.py'
                - '.github/workflows/device-catalog-phase42j-i-ht176-validation.yml'
            push:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            validate:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - name: Validate Phase 4.2J I/H+I/T policy and historical boundaries
                  run: |
                    python data/device-catalog/research/test_stm32f4_phase4_2j_i_ht_176_policy.py
                    python data/device-catalog/research/test_stm32f4_phase4_2h_oy_wlcsp90_policy.py
                    python data/device-catalog/research/test_stm32f4_phase4_2i_f405o_f415og_post_admission.py
          YML

          rm -f .github/workflows/device-catalog-phase42j-blocker-taxonomy.yml
          rm -f .github/workflows/device-catalog-phase42j-apply-policy.yml

      - name: Validate bounded policy before commit
        run: |
          set -euo pipefail
          python data/device-catalog/research/test_stm32f4_phase4_2j_i_ht_176_policy.py
          python data/device-catalog/research/test_stm32f4_phase4_2h_oy_wlcsp90_policy.py
          python data/device-catalog/research/test_stm32f4_phase4_2i_f405o_f415og_post_admission.py
          git diff --check
      - name: Commit bounded policy transaction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'device-catalog: add STM32F4 I/H and I/T 176-pin policy'
          git push origin HEAD:agent/device-catalog-phase4.2j-blocker-taxonomy
