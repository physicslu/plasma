name: STM32U3 HIL observer/debug readiness validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32u3-hil-observer-debug-readiness.json'
      - 'data/device-catalog/research/stm32u3_hil_observer_debug_readiness.py'
      - 'data/device-catalog/research/validate_stm32u3_hil_observer_debug_readiness_gate.py'
      - 'data/device-catalog/research/device-catalog-stm32u3-hil-observer-debug-readiness-gate.md'
      - 'data/device-catalog/research/stm32u3-security-state-observer-debug-policy.json'
      - 'data/device-catalog/research/stm32u3_security_state_observer_debug.py'
      - '.github/workflows/device-catalog-stm32u3-hil-observer-debug-readiness-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/stm32u3-hil-observer-debug-readiness.json'
      - 'data/device-catalog/research/stm32u3_hil_observer_debug_readiness.py'
      - 'data/device-catalog/research/validate_stm32u3_hil_observer_debug_readiness_gate.py'
      - 'data/device-catalog/research/device-catalog-stm32u3-hil-observer-debug-readiness-gate.md'
      - 'data/device-catalog/research/stm32u3-security-state-observer-debug-policy.json'
      - 'data/device-catalog/research/stm32u3_security_state_observer_debug.py'
      - '.github/workflows/device-catalog-stm32u3-hil-observer-debug-readiness-validation.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STM32U3 HIL observer/debug readiness gate
        run: python data/device-catalog/research/validate_stm32u3_hil_observer_debug_readiness_gate.py
      - name: Enforce zero Production writes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- data/device-catalog/production/)"
          test -z "$changed" || { echo "Production writes are forbidden in STM32U3 HIL readiness gating:"; echo "$changed"; exit 1; }
