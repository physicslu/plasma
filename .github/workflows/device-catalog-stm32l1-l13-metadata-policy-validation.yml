name: STM32L1 L1.3 metadata policy validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "data/device-catalog/research/stm32l1_metadata_policy.py"
      - "data/device-catalog/research/stm32l1_phase_l1_3_policy.py"
      - "data/device-catalog/research/build_stm32l1_phase_l1_3_baseline.py"
      - "data/device-catalog/research/test_stm32l1_phase_l1_3_policy.py"
      - "data/device-catalog/research/validate_stm32l1_phase_l1_3_policy.py"
      - "data/device-catalog/research/stm32l1-phase-l1.3-ordering-authority.json"
      - "data/device-catalog/research/stm32l1-phase-l1.3-exact-variant-exceptions.json"
      - "data/device-catalog/research/stm32l1-phase-l1.3-policy-baseline.json"
      - "data/device-catalog/research/stm32l1-phase-l1.2-discovery-baseline.json"
      - "data/device-catalog/research/evidence/stm32l1-l1.2-official-st-discovery-live-2026-09-13/**"
      - ".github/workflows/device-catalog-stm32l1-l13-metadata-policy-validation.yml"
  push:
    branches:
      - main
    paths:
      - "data/device-catalog/research/stm32l1_metadata_policy.py"
      - "data/device-catalog/research/stm32l1_phase_l1_3_policy.py"
      - "data/device-catalog/research/build_stm32l1_phase_l1_3_baseline.py"
      - "data/device-catalog/research/test_stm32l1_phase_l1_3_policy.py"
      - "data/device-catalog/research/validate_stm32l1_phase_l1_3_policy.py"
      - "data/device-catalog/research/stm32l1-phase-l1.3-ordering-authority.json"
      - "data/device-catalog/research/stm32l1-phase-l1.3-exact-variant-exceptions.json"
      - "data/device-catalog/research/stm32l1-phase-l1.3-policy-baseline.json"
      - "data/device-catalog/research/stm32l1-phase-l1.2-discovery-baseline.json"
      - "data/device-catalog/research/evidence/stm32l1-l1.2-official-st-discovery-live-2026-09-13/**"
      - ".github/workflows/device-catalog-stm32l1-l13-metadata-policy-validation.yml"

permissions:
  contents: read

jobs:
  metadata-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run L1.3 negative controls
        run: |
          python data/device-catalog/research/test_stm32l1_phase_l1_3_policy.py

      - name: Validate frozen L1.3 metadata policy
        run: |
          python data/device-catalog/research/validate_stm32l1_phase_l1_3_policy.py

      - name: Enforce zero Production writes in this transaction
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- data/device-catalog/production/ | grep -q .; then
            echo "L1.3 must not modify Production"
            exit 1
          fi
