name: PLASMA Engineering Dispatch Gate 1D Claim Protection Contracts

# Contract-only: no issue_comment, workflow_dispatch, GitHub ruleset writes,
# model invocation, SWPC runner or real ref creation/deletion.
on:
  pull_request:
    paths:
      - ".github/workflows/plasma-engineering-dispatch-gate1d-contract.yml"
      - "scripts/plasma_engineering_dispatch_gate1d.py"
      - "scripts/tests/test_plasma_engineering_dispatch_gate1d.py"
      - "specs/engineering-dispatch/**"
      - "docs/architecture/plasma-engineering-dispatch-v1.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/plasma-engineering-dispatch-gate1d-contract.yml"
      - "scripts/plasma_engineering_dispatch_gate1d.py"
      - "scripts/tests/test_plasma_engineering_dispatch_gate1d.py"
      - "specs/engineering-dispatch/**"
      - "docs/architecture/plasma-engineering-dispatch-v1.md"

permissions:
  contents: read

jobs:
  offline-ruleset-qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Claim protection and read-only canary contract negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/plasma_engineering_dispatch_gate1d.py \
            scripts/tests/test_plasma_engineering_dispatch_gate1d.py
          python3 scripts/tests/test_plasma_engineering_dispatch_gate1d.py
          python3 scripts/plasma_engineering_dispatch_gate1d.py proposal \
            --proposal specs/engineering-dispatch/claim-protection-ruleset-v1.json
