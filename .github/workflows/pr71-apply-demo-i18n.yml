name: PR71 Apply Demo i18n

on:
  push:
    branches:
      - agent/fix-demo-i18n

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-demo-i18n
          fetch-depth: 0
      - name: Apply Demo landing i18n
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("software/web/app/demo/page.tsx")
          page.write_text('''"use client";\n\nimport Link from "next/link";\nimport { useI18n } from "../i18n";\nimport "./demo.css";\n\nexport default function DemoLandingPage() {\n  const { t } = useI18n();\n\n  return (\n    <main className="demoLanding" data-route-marker="Choose a Demo">\n      <section className="demoHero">\n        <div className="demoBrand"><span>P</span><div><b>PLASMA</b><small>PROGRAMMING PLATFORM</small></div></div>\n        <p className="demoEyebrow">{t("demo.eyebrow")}</p>\n        <h1>{t("demo.title")}</h1>\n        <p className="demoLead">{t("demo.lead")}</p>\n\n        <div className="demoChoices">\n          <Link className="demoCard fleet" href="/fleet">\n            <div className="demoCardHead"><span>01</span><b>{t("mode.production")}</b></div>\n            <h2>{t("demo.production.title")}</h2>\n            <p>{t("demo.production.description")}</p>\n            <dl><div><dt>{t("mode.label")}</dt><dd>production</dd></div><div><dt>Manager</dt><dd>{t("demo.production.manager")}</dd></div></dl>\n            <strong>{t("demo.production.open")}</strong>\n          </Link>\n\n          <Link className="demoCard" href="/engineering">\n            <div className="demoCardHead"><span>02</span><b>{t("mode.engineering")}</b></div>\n            <h2>{t("demo.engineering.title")}</h2>\n            <p>{t("demo.engineering.description")}</p>\n            <dl><div><dt>{t("mode.label")}</dt><dd>engineering</dd></div><div><dt>PPU Console</dt><dd>{t("demo.engineering.ppuConsole")}</dd></div></dl>\n            <strong>{t("demo.engineering.open")}</strong>\n          </Link>\n        </div>\n\n        <div className="demoBoundary">\n          <b>{t("demo.boundary.title")}</b>\n          <span>{t("demo.boundary.description")}</span>\n        </div>\n      </section>\n    </main>\n  );\n}\n''')

          i18n = Path("software/web/app/i18n.tsx")
          text = i18n.read_text()
          zh_anchor = '    "locale.zh": "繁中", "locale.en": "EN",\n'
          zh_keys = '''    "demo.eyebrow": "PLASMA 產品入口",\n    "demo.title": "選擇產品模式",\n    "demo.lead": "Plasma 的產品層只保留兩種模式：量產模式與工程模式。多 PPU aggregation、Manager 與單機 PPU Console 都是模式底下的實作能力，不再作為平行的產品模式。",\n    "demo.production.title": "工廠量產控制台",\n    "demo.production.description": "工廠操作介面：同畫面監控多台 PPU × Sites、PASS / FAIL、批次選取與 Factory Log。",\n    "demo.production.manager": "唯讀聚合",\n    "demo.production.open": "開啟量產模式 →",\n    "demo.engineering.title": "工程工作台",\n    "demo.engineering.description": "工程與維護工作台：PPU / Sites、Programming、Diagnostics、Logs、Tools 與後續低階功能。",\n    "demo.engineering.ppuConsole": "工程能力",\n    "demo.engineering.open": "開啟工程模式 →",\n    "demo.boundary.title": "架構邊界",\n    "demo.boundary.description": "Manager 聚合失效不會停止本地 PPU 燒錄。",\n'''
          if text.count(zh_anchor) != 2:
              raise SystemExit(f"expected zh/en locale anchors twice, got {text.count(zh_anchor)}")
          text = text.replace(zh_anchor, zh_anchor + zh_keys, 1)

          en_anchor = '    "locale.zh": "繁中", "locale.en": "EN",\n'
          en_keys = '''    "demo.eyebrow": "PLASMA PRODUCT ENTRY",\n    "demo.title": "Choose Product Mode",\n    "demo.lead": "Plasma exposes only two product modes: Production Mode and Engineering Mode. Multi-PPU aggregation, Manager, and the standalone PPU Console are implementation capabilities within those modes rather than parallel product modes.",\n    "demo.production.title": "Factory Production Console",\n    "demo.production.description": "Factory operations view for multiple PPUs × Sites, PASS / FAIL status, batch selection, and Factory Log on one screen.",\n    "demo.production.manager": "Read-only aggregation",\n    "demo.production.open": "Open Production Mode →",\n    "demo.engineering.title": "Engineering Workspace",\n    "demo.engineering.description": "Engineering and maintenance workspace for PPU / Sites, Programming, Diagnostics, Logs, Tools, and future low-level capabilities.",\n    "demo.engineering.ppuConsole": "Engineering capability",\n    "demo.engineering.open": "Open Engineering Mode →",\n    "demo.boundary.title": "Architecture boundary",\n    "demo.boundary.description": "Manager aggregation failure does not stop local PPU programming.",\n'''
          idx = text.find(en_anchor, text.find(en_anchor) + 1)
          if idx < 0:
              raise SystemExit("second locale anchor not found")
          text = text[:idx] + text[idx:].replace(en_anchor, en_anchor + en_keys, 1)
          i18n.write_text(text)

          test = Path("software/web/e2e/tests/demo-routing.spec.ts")
          text = test.read_text()
          text = text.replace('  await expect(page.getByRole("heading", { name: "Choose Product Mode" })).toBeVisible();\n  const production = page.getByRole("link", { name: /Open Production Mode/ });\n  const engineering = page.getByRole("link", { name: /Open Engineering Mode/ });', '  await expect(page.getByRole("heading", { name: "選擇產品模式" })).toBeVisible();\n  const production = page.locator(\'a.demoCard[href="/fleet"]\');\n  const engineering = page.locator(\'a.demoCard[href="/engineering"]\');', 1)
          text = text.replace('  await expect(page.getByRole("heading", { name: "Choose Product Mode" })).toBeVisible();\n  await expectProductNavigation(page, "入口");', '  await expect(page.getByRole("heading", { name: "選擇產品模式" })).toBeVisible();\n  await expectProductNavigation(page, "入口");', 1)
          append = '''\n\ntest("demo landing content follows locale switching", async ({ page }) => {\n  await page.goto("/demo");\n  await expect(page.getByRole("heading", { name: "選擇產品模式" })).toBeVisible();\n  await expect(page.getByText("架構邊界", { exact: true })).toBeVisible();\n  await expect(page.getByText("開啟量產模式 →", { exact: true })).toBeVisible();\n\n  await page.getByRole("button", { name: "EN", exact: true }).click();\n  await expect(page.locator("html")).toHaveAttribute("lang", "en-US", { timeout: 300 });\n  await expect(page.getByRole("heading", { name: "Choose Product Mode" })).toBeVisible({ timeout: 300 });\n  await expect(page.getByText("Architecture boundary", { exact: true })).toBeVisible({ timeout: 300 });\n  await expect(page.getByText("Open Production Mode →", { exact: true })).toBeVisible({ timeout: 300 });\n  await expect(page.getByText("Open Engineering Mode →", { exact: true })).toBeVisible({ timeout: 300 });\n\n  await page.getByRole("button", { name: "繁中", exact: true }).click();\n  await expect(page.locator("html")).toHaveAttribute("lang", "zh-TW", { timeout: 300 });\n  await expect(page.getByRole("heading", { name: "選擇產品模式" })).toBeVisible({ timeout: 300 });\n});\n'''
          test.write_text(text + append)
          PY

          rm .github/workflows/pr71-apply-demo-i18n.yml
          git diff --check
      - name: Commit changes
        run: |
          git config user.name "plasma-pr71-bot"
          git config user.email "plasma-pr71-bot@users.noreply.github.com"
          git add software/web/app/demo/page.tsx software/web/app/i18n.tsx software/web/e2e/tests/demo-routing.spec.ts .github/workflows/pr71-apply-demo-i18n.yml
          git commit -m "Fix Demo landing locale switching"
          git push origin HEAD:agent/fix-demo-i18n
