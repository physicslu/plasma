name: PR71 Fix Demo SSR Contract

on:
  push:
    branches:
      - agent/fix-demo-i18n

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-demo-i18n
          fetch-depth: 0
      - name: Update SSR default-locale expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("software/web/tests/fleet-ui-contract.test.mjs")
          text = p.read_text()
          replacements = {
              'assert.match(html, />Choose Product Mode</);': 'assert.match(html, />選擇產品模式</);',
              'assert.match(html, />Production Mode</);': 'assert.match(html, />量產模式</);',
              'assert.match(html, />Engineering Mode</);': 'assert.match(html, />工程模式</);',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match for {old!r}, got {text.count(old)}")
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          rm .github/workflows/pr71-fix-ssr-contract.yml
          git diff --check
      - name: Commit changes
        run: |
          git config user.name "plasma-pr71-bot"
          git config user.email "plasma-pr71-bot@users.noreply.github.com"
          git add software/web/tests/fleet-ui-contract.test.mjs .github/workflows/pr71-fix-ssr-contract.yml
          git commit -m "Align Demo SSR test with localized default"
          git push origin HEAD:agent/fix-demo-i18n
