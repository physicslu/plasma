name: STM32WB0 Layer-1 Production publication v5.3

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32wb0-commercial-icpn.csv'
      - 'data/device-catalog/research/stm32wb0-layer1-production-publication-v5.3.json'
      - 'data/device-catalog/research/validate_stm32wb0_layer1_publication_v53.py'
      - 'data/device-catalog/research/STM32WB0_LAYER1_PRODUCTION_PUBLICATION_V53.md'
      - 'data/device-catalog/research/validate_stm32n6_layer1_publication_v50.py'
      - 'data/ic-support/test_coverage_inventory.py'
      - 'software/python/tests/test_device_catalog_stm32wb0.py'
      - '.github/workflows/device-catalog-stm32wb0-layer1-publication-v53.yml'

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved STM32WB0 publication and Production graph
        run: |
          python data/device-catalog/research/validate_stm32wb0_layer1_publication_v53.py
          python data/device-catalog/research/validate_stm32n6_layer1_publication_v50.py
          python scripts/ci/device-catalog-production-invariants.py
          python data/ic-support/test_coverage_inventory.py
      - name: Install Python development package
        run: python -m pip install -e './software/python[dev]'
      - name: Validate runtime Catalog Layer-1/Layer-2 separation
        run: |
          python -m pytest -q \
            software/python/tests/test_device_catalog.py \
            software/python/tests/test_device_catalog_stm32wb0.py \
            software/python/tests/test_device_catalog_web_gateway.py
