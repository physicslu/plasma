name: Control Station runtime packaging acceptance

on:
  push:
    paths:
      - "scripts/control-station-runtime.py"
      - "scripts/control-station-release.py"
      - "scripts/control-station-runtime-smoke.py"
      - "scripts/control-station-runtime-acceptance.py"
      - "scripts/product-release.py"
      - "software/web/**"
      - "!software/web/e2e/**"
      - "!software/web/tests/**"
      - "software/python/plasma_manager/**"
      - "software/python/pyproject.toml"
      - "software/python/tests/test_control_station_runtime.py"
      - "software/python/tests/test_control_station_release.py"
      - "release/**"
      - ".github/workflows/control-station-runtime.yml"
  pull_request:
    paths:
      - "scripts/control-station-runtime.py"
      - "scripts/control-station-release.py"
      - "scripts/control-station-runtime-smoke.py"
      - "scripts/control-station-runtime-acceptance.py"
      - "scripts/product-release.py"
      - "software/web/**"
      - "!software/web/e2e/**"
      - "!software/web/tests/**"
      - "software/python/plasma_manager/**"
      - "software/python/pyproject.toml"
      - "software/python/tests/test_control_station_runtime.py"
      - "software/python/tests/test_control_station_release.py"
      - "release/**"
      - ".github/workflows/control-station-runtime.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-package:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.0"
          cache: npm
          cache-dependency-path: software/web/package-lock.json
      - name: Install build/test dependencies
        run: python -m pip install ./software/python pytest
      - name: Install Web build dependencies
        working-directory: software/web
        run: npm ci
      - name: Build standalone Control Station Console
        working-directory: software/web
        run: npm run build:product
      - name: Run runtime packaging regression tests
        run: >-
          python -m pytest -q
          software/python/tests/test_control_station_runtime.py
          software/python/tests/test_control_station_release.py
          software/python/tests/test_product_release.py
      - name: Build release, clean-extract, and run Console/BFF + Manager smoke
        run: >-
          python scripts/control-station-runtime-acceptance.py
          --work-dir "${{ runner.temp }}/plasma-control-station-runtime"
