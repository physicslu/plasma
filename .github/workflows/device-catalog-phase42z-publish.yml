name: Device catalog Phase 4.2Z controlled Production publish
on:
  push:
    branches: [agent/device-catalog-phase4.2z-nh-tfbga216-admission]
    paths: [".github/workflows/device-catalog-phase42z-publish.yml"]
  workflow_dispatch:
permissions: {actions: read, contents: write}
jobs:
  publish:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2z-nh-tfbga216-admission, fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: phase42z-nh-tfbga216-admission-proposal, path: /tmp/phase42z, repository: physicslu/plasma, run-id: 33875778983, github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Publish exact bound proposal
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2z-nh-tfbga216-admission-batch1-live-2026-09-04 --baseline data/device-catalog/research/stm32f4-phase4.2z-nh-tfbga216-admission-baseline.json
          PYTHONPATH=data/device-catalog/research python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from device_catalog_admission_framework import read_csv,write_canonical_dataset
          from device_catalog_pipeline_framework import pipeline_plan_is_clean
          root=Path('data/device-catalog/research')
          canonical=root/'stm32f4-commercial-icpn.csv'
          evidence=root/'evidence/stm32f4-phase4.2z-nh-tfbga216-admission-batch1-live-2026-09-04'
          plan_out=root/'stm32f4-phase4.2z-nh-tfbga216-admission-plan.json'
          audit_out=root/'stm32f4-phase4.2z-nh-tfbga216-admission-audit.json'
          raw=Path('/tmp/phase42z/admission-plan.json').read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          if sha!='0717c9717fd3c4c9d3ab608a216fe8745cf47731cd59783a03850302caee489a': raise SystemExit('proposal hash mismatch')
          plan=json.loads(raw)
          expected={'STM32F429NEH6','STM32F429NGH6','STM32F429NIH6','STM32F429NIH6TR','STM32F429NIH7','STM32F439NGH6','STM32F439NIH6'}
          if {i['icpn'] for i in plan['candidates']}!=expected or not pipeline_plan_is_clean(plan): raise SystemExit('unclean plan')
          _,rows=read_csv(canonical)
          if len(rows)!=338 or len({r['base_device'] for r in rows})!=114: raise SystemExit('pre-state mismatch')
          result=write_canonical_dataset(plan=plan,canonical_path=canonical)
          _,after=read_csv(canonical)
          if result['rows_after']!=345 or len({r['base_device'] for r in after})!=119: raise SystemExit('post-state mismatch')
          plan_out.write_bytes(raw)
          manifest=json.loads((evidence/'manifest.json').read_text())
          if manifest['evidence_id']!='stm32f4-phase4.2z-nh-tfbga216-admission-batch1-2026-09-04-retained-20260904T124757Z-6a606b9': raise SystemExit('evidence id mismatch')
          pilot=json.loads((evidence/'pilot-summary.json').read_text())
          exclusions={i['icpn'] for r in pilot['results'] for i in r['evidence']['excluded_non_active_part_numbers']}
          if exclusions: raise SystemExit('unexpected lifecycle exclusions')
          summary={
            'schema_version':1,
            'phase':'4.2Z',
            'proposal_run_id':33875778983,
            'proposal_artifact_id':9937768684,
            'proposal_artifact_zip_sha256':'dd73f7b74475e83350241528cccb04387fca5a8c4a2d5fd2c0ba57f4776fa24d',
            'admission_plan_sha256':sha,
            'retained_evidence_id':manifest['evidence_id'],
            'production_rows_before':338,
            'production_rows_after':345,
            'production_base_devices_before':114,
            'production_base_devices_after':119,
            'added_exact_icpns':sorted(expected),
            'lifecycle_exclusions':[],
            'canonical_csv_file_sha256':hashlib.sha256(canonical.read_bytes()).hexdigest(),
            'status':'published'
          }
          audit_out.write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2z-nh-tfbga216-admission-batch1-live-2026-09-04 --baseline data/device-catalog/research/stm32f4-phase4.2z-nh-tfbga216-admission-baseline.json
      - name: Commit publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/stm32f4-commercial-icpn.csv data/device-catalog/research/stm32f4-phase4.2z-nh-tfbga216-admission-plan.json data/device-catalog/research/stm32f4-phase4.2z-nh-tfbga216-admission-audit.json
          git commit -m 'device-catalog: admit Phase 4.2Z N/H TFBGA216 ICPNs'
          git push origin HEAD:agent/device-catalog-phase4.2z-nh-tfbga216-admission
