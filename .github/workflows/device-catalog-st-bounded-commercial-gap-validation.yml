name: ST bounded official commercial gap v0.5 validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/st-bounded-active-commercial-gap-v0.5.csv'
      - 'data/device-catalog/research/st-bounded-active-commercial-gap-v0.5.json'
      - 'data/device-catalog/research/validate_st_bounded_commercial_gap.py'
      - 'data/device-catalog/research/test_validate_st_bounded_commercial_gap.py'
      - 'data/device-catalog/research/ST_COVERAGE_GAP_BOUNDED_COMMERCIAL_2026-09-29.md'
      - '.github/workflows/device-catalog-st-bounded-commercial-gap-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/st-bounded-active-commercial-gap-v0.5.csv'
      - 'data/device-catalog/research/st-bounded-active-commercial-gap-v0.5.json'
      - 'data/device-catalog/research/validate_st_bounded_commercial_gap.py'
      - 'data/device-catalog/research/test_validate_st_bounded_commercial_gap.py'
      - 'data/device-catalog/research/ST_COVERAGE_GAP_BOUNDED_COMMERCIAL_2026-09-29.md'
      - '.github/workflows/device-catalog-st-bounded-commercial-gap-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay v0.5 bounded ST Active cohort and frozen Production sources
        run: |
          python data/device-catalog/research/validate_st_bounded_commercial_gap.py
          python -m unittest discover -s data/device-catalog/research -p test_validate_st_bounded_commercial_gap.py -v
