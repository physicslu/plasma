name: Device catalog Phase 4.2M STM32F437/439 I-pin admission proposal

on:
  push:
    branches:
      - agent/device-catalog-phase4.2m-next-admission
    paths:
      - ".github/workflows/device-catalog-phase42m-proposal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propose:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-phase4.2m-next-admission
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify clean admission plan
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase42m
          PYTHONPATH=data/device-catalog/research python \
            data/device-catalog/research/stm32f4_admission.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2m-f437-f439-i-admission-live-2026-09-03 \
            --baseline data/device-catalog/research/stm32f4-phase4.2m-f437-f439-i-admission-baseline.json \
            --admit-base STM32F437IG \
            --admit-base STM32F437II \
            --admit-base STM32F439IG \
            --admit-base STM32F439II \
            --output /tmp/phase42m/admission-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('/tmp/phase42m/admission-plan.json').read_text())
          expected = {
              'STM32F437IGH6', 'STM32F437IGT6',
              'STM32F437IIH6', 'STM32F437IIH6TR', 'STM32F437IIT6', 'STM32F437IIT7',
              'STM32F439IGH6', 'STM32F439IGT6',
              'STM32F439IIH6', 'STM32F439IIH6TR', 'STM32F439IIH7', 'STM32F439IIT6',
          }
          observed = {item['icpn'] for item in plan['candidates']}
          if observed != expected:
              raise SystemExit({'candidate_set_mismatch': sorted(observed ^ expected)})
          if plan['candidate_count'] != 12 or plan['decision_counts'] != {
              'admit': 12, 'already_present': 0, 'manual_review_required': 0, 'reject': 0,
          } or plan['conflicts'] != 0 or plan['canonical_rows_before'] != 242:
              raise SystemExit({'unexpected_plan': plan['decision_counts'], 'conflicts': plan['conflicts']})
          PY
      - name: Hash proposal
        run: |
          cd /tmp/phase42m
          sha256sum admission-plan.json | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: phase42m-stm32f437-f439-i-admission-proposal
          path: /tmp/phase42m
          if-no-files-found: error
          retention-days: 30
