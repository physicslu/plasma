name: STM32U5 security-scope foundation validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32u5-security-scope-foundation.json'
      - 'data/device-catalog/research/validate_stm32u5_security_scope_foundation.py'
      - 'data/device-catalog/research/device-catalog-stm32u5-security-scope-foundation.md'
      - 'data/device-catalog/research/stm32-trustzone-cohort-gate1-qualification.json'
      - 'docs/architecture/icpn-catalog-admission-policy.json'
      - '.github/workflows/device-catalog-stm32u5-security-scope-foundation-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/stm32u5-security-scope-foundation.json'
      - 'data/device-catalog/research/validate_stm32u5_security_scope_foundation.py'
      - 'data/device-catalog/research/device-catalog-stm32u5-security-scope-foundation.md'
      - 'data/device-catalog/research/stm32-trustzone-cohort-gate1-qualification.json'
      - 'docs/architecture/icpn-catalog-admission-policy.json'
      - '.github/workflows/device-catalog-stm32u5-security-scope-foundation-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STM32U5 security-scope foundation
        working-directory: data/device-catalog/research
        run: python validate_stm32u5_security_scope_foundation.py
      - name: Enforce zero Production writes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          if printf '%s\n' "$changed" | grep -q '^data/device-catalog/production/'; then
            echo 'STM32U5 security-scope foundation must not modify Production catalog files.' >&2
            printf '%s\n' "$changed" | grep '^data/device-catalog/production/' >&2
            exit 1
          fi
