name: Web E2E and visual regression

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: software/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: |
            software/web/package-lock.json
            software/web/e2e/package-lock.json
      - name: Install Web dependencies
        run: npm ci
      - name: Install E2E dependencies
        run: npm --prefix e2e ci
      - name: Install visual regression CJK font
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends fonts-wqy-zenhei
          fc-match -f '%{family}\n' 'sans-serif:lang=zh-tw' | head -n 1
      - name: Install Chromium
        timeout-minutes: 10
        run: cd e2e && npx playwright install chromium
      - name: Playwright E2E
        timeout-minutes: 10
        run: cd e2e && npm test
      - name: Upload visual regression diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diagnostics
          path: |
            software/web/e2e/test-results/
            software/web/e2e/tests/__snapshots__/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: software/web/e2e/playwright-report/
          retention-days: 14
