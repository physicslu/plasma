name: STM32L1 L1.4 admission plan validation

on:
  pull_request:
    paths:
      - "data/device-catalog/research/stm32l1_admission_policy.py"
      - "data/device-catalog/research/stm32l1_phase_l1_4_admission.py"
      - "data/device-catalog/research/test_stm32l1_phase_l1_4_admission.py"
      - "data/device-catalog/research/validate_stm32l1_phase_l1_4_admission_plan.py"
      - "data/device-catalog/research/stm32l1-phase-l1.4-admission-plan.json"
      - ".github/workflows/device-catalog-stm32l1-l14-admission-plan-validation.yml"
  push:
    branches: [main]
    paths:
      - "data/device-catalog/research/stm32l1_admission_policy.py"
      - "data/device-catalog/research/stm32l1_phase_l1_4_admission.py"
      - "data/device-catalog/research/test_stm32l1_phase_l1_4_admission.py"
      - "data/device-catalog/research/validate_stm32l1_phase_l1_4_admission_plan.py"
      - "data/device-catalog/research/stm32l1-phase-l1.4-admission-plan.json"
      - ".github/workflows/device-catalog-stm32l1-l14-admission-plan-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run L1.4 negative controls
        run: python data/device-catalog/research/test_stm32l1_phase_l1_4_admission.py

      - name: Validate frozen L1.4 admission plan
        run: python data/device-catalog/research/validate_stm32l1_phase_l1_4_admission_plan.py

      - name: Enforce zero Production writes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD -- data/device-catalog/production/ | grep -q .; then
            echo "L1.4 must not modify Production"
            exit 1
          fi
