name: Device catalog Phase 4.2Q V/H batch2 discovery
on:
  push:
    branches: [agent/device-catalog-phase4.2q-vh-admission-batch2]
    paths: [".github/workflows/device-catalog-phase42q-discovery.yml","data/device-catalog/research/stm32f4-phase4.2q-vh-admission-batch2-manifest.json"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  discover:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright==1.62.0 && python -m playwright install --with-deps chromium
      - run: |
          mkdir -p /tmp/phase42q
          xvfb-run -a python data/device-catalog/research/run_stm32f4_browser_pilot.py --manifest data/device-catalog/research/stm32f4-phase4.2q-vh-admission-batch2-manifest.json --catalog data/device-catalog/research/openocd-parts-canonical.csv --output /tmp/phase42q/pilot-summary.json --scope pilot --headed --timeout 45 --delay 2
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/phase42q/pilot-summary.json').read_text())
          expected={'STM32F479ZG','STM32F411VE','STM32F412VE','STM32F412VG','STM32F413VG'}
          if p['acquisition_failure'] or {x['base_device'] for x in p['results']}!=expected: raise SystemExit('discovery failed')
          PY
          cd /tmp/phase42q && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: {name: phase42q-vh-batch2-discovery, path: /tmp/phase42q, if-no-files-found: error, retention-days: 30}
