name: PLASMA Codex Agent guarded KINGST LA2016 loopback (Issue 981)

# PR CI is hosted/offline only. Trusted owner exact Issue command on merged main
# is the sole route to the hardware-capable dedicated SWPC runner.
# Legacy Issue #981 /plasma-codex runtime dispatch retired; hosted CI only.
on:
  pull_request:
    paths:
      - ".github/workflows/plasma-codex-la2016.yml"
      - "scripts/plasma-codex-la2016*"
      - "scripts/tests/test-plasma-codex-la2016.py"
      - "docs/development/plasma-codex-la2016.md"
      - "docs/README.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/plasma-codex-la2016.yml"
      - "scripts/plasma-codex-la2016*"
      - "scripts/tests/test-plasma-codex-la2016.py"
      - "docs/development/plasma-codex-la2016.md"

permissions:
  contents: read

concurrency:
  group: plasma-codex-la2016-981
  cancel-in-progress: false

jobs:
  contract:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Offline Codex intent, USB isolation, waveform, owner gating and shell checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/plasma-codex-la2016-contract.py check
          python3 scripts/plasma-codex-la2016.py --self-test
          python3 scripts/tests/test-plasma-codex-la2016.py
          python3 -m py_compile scripts/plasma-codex-la2016*.py
          bash -n scripts/plasma-codex-la2016.sh scripts/plasma-codex-la2016-inner.sh

  authorize:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'physicslu/plasma' &&
      github.actor == 'physicslu' &&
      github.event.issue.number == 981 &&
      !github.event.issue.pull_request &&
      github.event.comment.body == '/plasma-codex la2016 981'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      reviewed_sha: ${{ steps.auth.outputs.reviewed_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify exact owner event and pin reviewed main
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/plasma-codex-la2016-contract.py event "$GITHUB_EVENT_PATH"
          printf 'reviewed_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  loopback:
    needs: authorize
    if: ${{ needs.authorize.result == 'success' }}
    runs-on: [self-hosted, linux, x64, plasma-codex]
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - name: Checkout pinned reviewed main (never untrusted PR)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.authorize.outputs.reviewed_sha }}
          persist-credentials: false
          clean: true
      - name: Validate dedicated runner and no broad privileged groups
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = issue_comment
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = physicslu/plasma
          test "$(hostname)" = SWPC
          test "$(id -un)" = plasma-codex
          test "$(id -u)" -ne 0
          test "$RUNNER_NAME" = SWPC-plasma-codex
          for group in plasma-codex-io plasma-monitor; do
            id -nG | tr ' ' '\n' | grep -Fxq "$group"
          done
          if id -nG | tr ' ' '\n' | grep -Eq '^(sudo|docker|adm|dialout|gpio|i2c|video|plasma-hil)$'; then
            echo "Unexpected privileged Linux worker group" >&2
            exit 1
          fi
          test "$(stat -c '%U:%G:%a' /run/plasma-codex)" = plasma-codex:plasma-monitor:2770
          test -z "$(git status --porcelain)"
      - name: Launch real Codex Agent intent and guarded LA2016 hardware in tmux
        shell: bash
        run: bash scripts/plasma-codex-la2016.sh
      - name: Summarize sanitized result
        if: always()
        shell: bash
        run: |
          out="$RUNNER_TEMP/plasma-la2016-$GITHUB_RUN_ID"
          if test -f "$out/report.json"; then
            python3 - "$out/report.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          for key in ("agent_exec", "agent_request", "result",
                      "pwm_off_command", "off_capture", "z2_fpga", "external_dut"):
              print(f"{key}: {r.get(key, 'NOT_RUN')}")
          PY
          else
            echo "Codex LA2016 NO_GO: missing report or early stop" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload sanitized waveform edge samples and SHA256 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plasma-codex-la2016-981-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/plasma-la2016-${{ github.run_id }}/report.json
            ${{ runner.temp }}/plasma-la2016-${{ github.run_id }}/exit_code
            ${{ runner.temp }}/plasma-la2016-${{ github.run_id }}/SHA256SUMS
            ${{ runner.temp }}/plasma-la2016-${{ github.run_id }}/*hz-edges.csv
          if-no-files-found: warn
          retention-days: 14
