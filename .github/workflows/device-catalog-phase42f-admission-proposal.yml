name: Device catalog Phase 4.2F F412RE/RG admission proposal

on:
  push:
    branches:
      - agent/device-catalog-phase4.2f-f412re-rg-admission

permissions:
  contents: read

jobs:
  proposal:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-phase4.2f-f412re-rg-admission
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build immutable admission proposal
        run: |
          set -euo pipefail
          EVIDENCE=data/device-catalog/research/evidence/stm32f4-phase4.2f-f412re-rg-admission-live-2026-09-02
          BASELINE=data/device-catalog/research/stm32f4-phase4.2f-f412re-rg-admission-baseline.json
          CANONICAL=data/device-catalog/research/stm32f4-commercial-icpn.csv
          CATALOG=data/device-catalog/research/openocd-parts-canonical.csv
          mkdir -p /tmp/phase42f-proposal
          python data/device-catalog/research/stm32f4_admission.py \
            --evidence-dir "$EVIDENCE" \
            --baseline "$BASELINE" \
            --catalog "$CATALOG" \
            --canonical "$CANONICAL" \
            --admit-base STM32F412RE \
            --admit-base STM32F412RG \
            --output /tmp/phase42f-proposal/plan.json
          cp "$CANONICAL" /tmp/phase42f-proposal/proposed.csv
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'data/device-catalog/research')
          from device_catalog_admission_framework import write_canonical_dataset
          plan = json.loads(Path('/tmp/phase42f-proposal/plan.json').read_text())
          assert plan['candidate_count'] == 9, plan['candidate_count']
          assert plan['decision_counts'] == {'admit': 9, 'already_present': 0, 'manual_review_required': 0, 'reject': 0}, plan['decision_counts']
          assert plan['conflicts'] == 0 and plan['issues'] == []
          result = write_canonical_dataset(plan=plan, canonical_path=Path('/tmp/phase42f-proposal/proposed.csv'))
          assert result['status'] == 'written', result
          assert result['rows_before'] == 199 and result['rows_after'] == 208, result
          Path('/tmp/phase42f-proposal/write-result.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          PY
          sha256sum /tmp/phase42f-proposal/plan.json /tmp/phase42f-proposal/proposed.csv /tmp/phase42f-proposal/write-result.json | tee /tmp/phase42f-proposal/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: phase42f-stm32f4-f412re-rg-admission-proposal
          path: /tmp/phase42f-proposal
          if-no-files-found: error
          retention-days: 30
