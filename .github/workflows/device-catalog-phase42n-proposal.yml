name: Device catalog Phase 4.2N admission proposal
on:
  push:
    branches: [agent/device-catalog-phase4.2n-next-admission]
    paths: [".github/workflows/device-catalog-phase42n-proposal.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  propose:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2n-next-admission}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build proposal
        run: |
          mkdir -p /tmp/phase42n
          PYTHONPATH=data/device-catalog/research python data/device-catalog/research/stm32f4_admission.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2n-f469-f479-i-admission-live-2026-09-03 --baseline data/device-catalog/research/stm32f4-phase4.2n-f469-f479-i-admission-baseline.json --admit-base STM32F469IE --admit-base STM32F469IG --admit-base STM32F469II --admit-base STM32F479IG --admit-base STM32F479II --output /tmp/phase42n/admission-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/phase42n/admission-plan.json').read_text())
          if p['candidate_count'] != 11 or p['decision_counts'] != {'admit':11,'already_present':0,'manual_review_required':0,'reject':0} or p['conflicts'] != 0 or p['canonical_rows_before'] != 254:
              raise SystemExit('unclean Phase 4.2N plan')
          PY
          cd /tmp/phase42n && sha256sum admission-plan.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: {name: phase42n-admission-proposal, path: /tmp/phase42n, if-no-files-found: error, retention-days: 30}
