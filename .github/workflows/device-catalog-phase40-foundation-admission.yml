name: Device catalog Phase 4.0 foundation batch3 admission proposal

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-admission-proposal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build clean selective admission plan
        run: |
          mkdir -p phase40-foundation-batch3-admission
          python data/device-catalog/research/stm32f4_admission.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.0-foundation-batch3-live-2026-08-31 \
            --baseline data/device-catalog/research/stm32f4-phase4.0-foundation-batch3-baseline.json \
            --canonical data/device-catalog/research/stm32f4-commercial-icpn.csv \
            --admit-base STM32F401CD \
            --admit-base STM32F401CE \
            --admit-base STM32F412CE \
            --admit-base STM32F412CG \
            --admit-base STM32F412ZE \
            --output phase40-foundation-batch3-admission/admission-plan.json
      - name: Apply plan to isolated canonical copy and validate
        run: |
          python - <<'PY'
          import hashlib
          import json
          import shutil
          import sys
          from pathlib import Path

          root = Path('data/device-catalog/research')
          out = Path('phase40-foundation-batch3-admission')
          sys.path.insert(0, str(root))
          from device_catalog_admission_framework import write_canonical_dataset
          import validate_stm32f4_commercial_icpn as canonical_validator

          plan_path = out / 'admission-plan.json'
          plan = json.loads(plan_path.read_text(encoding='utf-8'))
          expected_counts = {
              'admit': 16,
              'already_present': 0,
              'manual_review_required': 0,
              'reject': 0,
          }
          if plan.get('candidate_count') != 16:
              raise SystemExit(f'unexpected candidate_count: {plan.get("candidate_count")}')
          if plan.get('decision_counts') != expected_counts:
              raise SystemExit(f'unexpected decision_counts: {plan.get("decision_counts")}')
          if plan.get('conflicts') != 0 or plan.get('issues') != []:
              raise SystemExit('admission plan is not conflict/issue free')
          if plan.get('canonical_rows_before') != 85:
              raise SystemExit(f'unexpected canonical_rows_before: {plan.get("canonical_rows_before")}')

          source = root / 'stm32f4-commercial-icpn.csv'
          proposed = out / 'stm32f4-commercial-icpn.proposed.csv'
          shutil.copyfile(source, proposed)
          write_report = write_canonical_dataset(plan=plan, canonical_path=proposed)
          if write_report.get('status') != 'written':
              raise SystemExit(f'writer did not produce canonical proposal: {write_report}')
          if write_report.get('rows_before') != 85 or write_report.get('rows_after') != 101:
              raise SystemExit(f'unexpected writer row accounting: {write_report}')
          if len(write_report.get('added', [])) != 16:
              raise SystemExit(f'unexpected added ICPNs: {write_report}')

          canonical_validator.CANONICAL = proposed
          validation = canonical_validator.validate()
          if validation.get('errors'):
              raise SystemExit('proposed canonical validation failed: ' + repr(validation['errors']))
          if validation.get('rows') != 101 or validation.get('unique_icpns') != 101:
              raise SystemExit(f'unexpected proposed canonical counts: {validation}')

          report = {
              'schema_version': 1,
              'canonical_dataset_written': False,
              'source_rows': 85,
              'proposed_rows': 101,
              'new_exact_icpns': 16,
              'decision_counts': plan['decision_counts'],
              'conflicts': plan['conflicts'],
              'issues': plan['issues'],
              'added': write_report['added'],
              'plan_sha256': hashlib.sha256(plan_path.read_bytes()).hexdigest(),
              'proposed_csv_sha256': hashlib.sha256(proposed.read_bytes()).hexdigest(),
              'proposed_validation': validation,
          }
          (out / 'admission-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
      - name: Upload admission proposal
        uses: actions/upload-artifact@v4
        with:
          name: phase40-stm32f4-foundation-batch3-admission
          path: phase40-foundation-batch3-admission
          if-no-files-found: error
          retention-days: 7
