name: Device catalog Phase 4.2K governance repair

on:
  push:
    branches:
      - agent/device-catalog-phase4.2k-f407-f417-i-admission
    paths:
      - ".github/workflows/device-catalog-phase42k-governance-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-phase4.2k-f407-f417-i-admission
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore retained-evidence boundary and refresh Production manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('data/device-catalog/research')
          evidence = root / 'evidence/stm32f4-phase4.2k-f407-f417-i-admission-live-2026-09-03'
          old_plan = evidence / 'admission-plan.json'
          old_audit = evidence / 'publish-summary.json'
          new_plan = root / 'stm32f4-phase4.2k-f407-f417-i-admission-plan.json'
          new_audit = root / 'stm32f4-phase4.2k-f407-f417-i-admission-audit.json'
          test_path = root / 'test_stm32f4_phase4_2k_f407_f417_i_post_admission.py'
          manifest_path = Path('data/device-catalog/production/icpn-v1-manifest.json')
          canonical = root / 'stm32f4-commercial-icpn.csv'

          expected_plan_sha = '5bf84e7ebbac8808e6ef3f1cc072bc55ac380e0ba64a59b23a0684db0b76764f'
          expected_audit_sha = hashlib.sha256(old_audit.read_bytes()).hexdigest()
          if hashlib.sha256(old_plan.read_bytes()).hexdigest() != expected_plan_sha:
              raise SystemExit('admission plan byte binding changed')
          if new_plan.exists() or new_audit.exists():
              raise SystemExit('refusing to overwrite existing transaction record')

          old_plan.rename(new_plan)
          old_audit.rename(new_audit)
          if hashlib.sha256(new_plan.read_bytes()).hexdigest() != expected_plan_sha:
              raise SystemExit('plan hash changed during move')
          if hashlib.sha256(new_audit.read_bytes()).hexdigest() != expected_audit_sha:
              raise SystemExit('audit hash changed during move')

          text = test_path.read_text()
          old = 'PLAN = EVIDENCE / "admission-plan.json"\nSUMMARY = EVIDENCE / "publish-summary.json"\n'
          new = 'PLAN = HERE / "stm32f4-phase4.2k-f407-f417-i-admission-plan.json"\nSUMMARY = HERE / "stm32f4-phase4.2k-f407-f417-i-admission-audit.json"\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected Phase 4.2K transaction path block')
          test_path.write_text(text.replace(old, new))

          csv_bytes = canonical.read_bytes()
          csv_sha = hashlib.sha256(csv_bytes).hexdigest()
          csv_blob = hashlib.sha1(f'blob {len(csv_bytes)}\0'.encode() + csv_bytes).hexdigest()
          rows = sum(1 for line in csv_bytes.splitlines() if line.strip()) - 1
          if (rows, csv_sha, csv_blob) != (
              226,
              '780ff3801bbc95476b6c366eda5946fa70bebff978c35d891197bf7527c5c181',
              '730e0313d56370703504003e7a826c2c488ed5e4',
          ):
              raise SystemExit({'unexpected_current_f4': [rows, csv_sha, csv_blob]})

          manifest = json.loads(manifest_path.read_text())
          matches = [s for s in manifest['sources'] if s['family'] == 'STM32F4']
          if len(matches) != 1:
              raise SystemExit('expected exactly one STM32F4 manifest source')
          f4 = matches[0]
          if f4['path'] != '../research/stm32f4-commercial-icpn.csv':
              raise SystemExit('unexpected STM32F4 manifest path')
          f4['row_count'] = rows
          f4['git_blob_sha'] = csv_blob
          f4['sha256'] = csv_sha
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          PY

          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2k-f407-f417-i-admission-live-2026-09-03 \
            --baseline data/device-catalog/research/stm32f4-phase4.2k-f407-f417-i-admission-baseline.json
          python data/device-catalog/research/validate_stm32f4_commercial_icpn.py >/tmp/phase42k-commercial-validation.json
          cat /tmp/phase42k-commercial-validation.json
          python data/device-catalog/research/test_stm32f4_phase4_2k_f407_f417_i_post_admission.py
      - name: Commit bounded governance repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            data/device-catalog/research \
            data/device-catalog/production/icpn-v1-manifest.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'refusing no-op repair'; exit 1; }
          git commit -m 'device-catalog: close Phase 4.2K governance bindings'
          git push origin HEAD:agent/device-catalog-phase4.2k-f407-f417-i-admission
