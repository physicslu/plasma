name: STM32G4 Phase 4.9B live one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32g4-phase49b-discovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-stm32g4:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate offline Phase 4.9A and 4.9B contracts
        run: |
          python data/device-catalog/research/test_stm32g4_phase4_9a_foundation.py
          python data/device-catalog/research/test_stm32g4_dual_surface_evidence.py
          python data/device-catalog/research/test_stm32g4_phase4_9b_discovery.py
      - name: Install pinned Playwright research dependency
        run: python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
      - name: Install Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Acquire 11-target official-ST dual-surface evidence
        id: discovery
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/stm32g4-phase4.9b-evidence
          xvfb-run -a python data/device-catalog/research/run_stm32g4_phase4_9b_browser_discovery.py \
            --output /tmp/stm32g4-phase4.9b-live-summary.json \
            --evidence-dir /tmp/stm32g4-phase4.9b-evidence \
            --timeout 90 \
            --delay 2
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Stage immutable acquisition artifact
        if: always()
        run: |
          mkdir -p /tmp/stm32g4-phase4.9b-artifact/evidence
          test -f /tmp/stm32g4-phase4.9b-live-summary.json && cp /tmp/stm32g4-phase4.9b-live-summary.json /tmp/stm32g4-phase4.9b-artifact/live-summary.json || true
          cp -a /tmp/stm32g4-phase4.9b-evidence/. /tmp/stm32g4-phase4.9b-artifact/evidence/ 2>/dev/null || true
          printf '%s\n' '${{ github.run_id }}' > /tmp/stm32g4-phase4.9b-artifact/workflow-run-id.txt
          printf '%s\n' '${{ github.sha }}' > /tmp/stm32g4-phase4.9b-artifact/executed-git-sha.txt
      - name: Upload live evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32g4-phase4.9b-official-st-discovery-live-20260910
          path: /tmp/stm32g4-phase4.9b-artifact
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Enforce bounded discovery result
        if: always()
        run: |
          test '${{ steps.discovery.outputs.exit_code }}' = '0'
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/stm32g4-phase4.9b-live-summary.json')
          data=json.loads(p.read_text())
          assert data['attempted'] == 11
          assert data['dispositioned_targets'] == 11
          assert data['acquisition_failure'] == 0
          assert data['identity_manual_intervention_required'] == 0
          assert data['bounded_discovery_clean'] is True
          assert data['claims'] and set(data['claims'].values()) == {False}
          print(json.dumps({k:data[k] for k in (
              'attempted','acquisition_success','acquisition_failure','active_candidate_targets',
              'lifecycle_excluded_targets','source_unavailable_exclusions','dispositioned_targets',
              'commercial_identity_verified_targets','commercial_identity_unresolved_targets',
              'active_exact_icpn_candidates','excluded_non_active_part_numbers',
              'commercial_identity_clean','bounded_discovery_clean','identity_manual_intervention_required',
              'routing_followup_required')}, indent=2, sort_keys=True))
          print(json.dumps(data['openocd_routing'], indent=2, sort_keys=True))
          PY
