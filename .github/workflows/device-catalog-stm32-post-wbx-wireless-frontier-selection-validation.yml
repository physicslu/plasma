name: STM32 post-WBX wireless frontier selection validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32-post-wbx-production-prestate.json'
      - 'data/device-catalog/research/stm32-post-wbx-wireless-frontier-selection.json'
      - 'data/device-catalog/research/stm32_post_wbx_wireless_frontier_selection.py'
      - 'data/device-catalog/research/validate_stm32_post_wbx_wireless_frontier_selection.py'
      - 'data/device-catalog/research/stm32-post-wba6x-blocked-wireless-frontier-selection.json'
      - '.github/workflows/device-catalog-stm32-post-wbx-wireless-frontier-selection-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/stm32-post-wbx-production-prestate.json'
      - 'data/device-catalog/research/stm32-post-wbx-wireless-frontier-selection.json'
      - 'data/device-catalog/research/stm32_post_wbx_wireless_frontier_selection.py'
      - 'data/device-catalog/research/validate_stm32_post_wbx_wireless_frontier_selection.py'
      - 'data/device-catalog/research/stm32-post-wba6x-blocked-wireless-frontier-selection.json'
      - '.github/workflows/device-catalog-stm32-post-wbx-wireless-frontier-selection-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate post-WBX wireless frontier selection
        run: python data/device-catalog/research/validate_stm32_post_wbx_wireless_frontier_selection.py
