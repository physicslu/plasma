name: Temporary STM32L0 L0.2 live discovery

on:
  pull_request:
    paths:
      - "data/device-catalog/research/stm32l0_phase_l0_2_discovery.py"
      - "data/device-catalog/research/run_stm32l0_phase_l0_2_discovery.py"
      - "data/device-catalog/research/test_stm32l0_phase_l0_2_discovery.py"
      - ".github/workflows/tmp-stm32l0-l02-live-discovery.yml"

permissions:
  contents: read

concurrency:
  group: tmp-stm32l0-l02-live-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate deterministic 99-target boundary
        run: |
          python data/device-catalog/research/test_stm32l0_phase_l0_2_discovery.py
          python data/device-catalog/research/stm32l0_phase_l0_2_discovery.py \
            --targets-output /tmp/l0-targets.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('/tmp/l0-targets.json'))
          assert p['base_device_count'] == 99, p['base_device_count']
          assert len(p['base_device_counts_by_subfamily']) == 16
          assert all(v is False for v in p['claims'].values())
          print('STM32L0 L0.2 target boundary: PASS (99 Base Devices)')
          PY

      - name: Install bounded browser acquisition dependencies
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium

      - name: Acquire all 99 deterministic STM32L0 Base Devices
        id: acquire
        continue-on-error: true
        run: |
          mkdir -p .artifacts/stm32l0-l02/evidence
          xvfb-run -a python data/device-catalog/research/run_stm32l0_phase_l0_2_discovery.py \
            --delay 1.0 \
            --timeout 75 \
            --output .artifacts/stm32l0-l02/live-summary.json \
            --targets-output .artifacts/stm32l0-l02/targets.json \
            --evidence-dir .artifacts/stm32l0-l02/evidence

      - name: Validate live summary boundary
        id: validate
        if: always() && hashFiles('.artifacts/stm32l0-l02/live-summary.json') != ''
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          p=json.load(open('.artifacts/stm32l0-l02/live-summary.json'))
          assert p['phase'] == 'L0.2' and p['family'] == 'STM32L0'
          assert p['base_device_count'] == 99 and p['attempted'] == 99
          assert p['dispositioned_targets'] == 99
          assert p['identity_manual_intervention_required'] == 0
          assert p['acquisition_failure'] == 0
          assert p['source_unavailable_exclusions'] == 0
          assert p['representative_continuity_clean'] is True
          assert p['bounded_discovery_clean'] is True
          assert all(v is False for v in p['claims'].values())
          print(json.dumps({k:p[k] for k in [
              'base_device_count','active_candidate_targets','lifecycle_excluded_targets',
              'active_exact_icpn_candidates','excluded_non_active_part_numbers',
              'identity_manual_intervention_required','routing_followup_required']}, indent=2, sort_keys=True))
          PY

      - name: Record execution provenance
        if: always() && hashFiles('.artifacts/stm32l0-l02/live-summary.json') != ''
        run: |
          python - <<'PY'
          import json, os, pathlib
          root=pathlib.Path('.artifacts/stm32l0-l02')
          s=json.loads((root/'live-summary.json').read_text())
          p={
            'schema_version': 1,
            'phase': 'L0.2',
            'family': 'STM32L0',
            'source_repository': os.environ['GITHUB_REPOSITORY'],
            'executed_git_sha': os.environ['GITHUB_SHA'],
            'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
            'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
            'acquisition_transport': s.get('acquisition_transport'),
            'browser': s.get('browser'),
            'target_count': s.get('attempted'),
            'active_candidate_targets': s.get('active_candidate_targets'),
            'lifecycle_excluded_targets': s.get('lifecycle_excluded_targets'),
            'active_exact_icpn_candidates': s.get('active_exact_icpn_candidates'),
            'bounded_discovery_clean': s.get('bounded_discovery_clean'),
            'live_summary_validation': '${{ steps.validate.outcome }}',
            'canonical_admission_authorized': False,
            'production_write_authorized': False,
            'runtime_programming_support_claimed': False,
          }
          (root/'provenance.json').write_text(json.dumps(p, indent=2, sort_keys=True)+'\n')
          PY

      - name: Upload immutable live acquisition candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32l0-l02-live-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            .artifacts/stm32l0-l02/live-summary.json
            .artifacts/stm32l0-l02/targets.json
            .artifacts/stm32l0-l02/provenance.json
            .artifacts/stm32l0-l02/evidence/*.json

      - name: Enforce bounded discovery gate
        if: always()
        run: |
          if [ "${{ steps.acquire.outcome }}" != "success" ]; then
            echo "STM32L0 L0.2 live acquisition requires review; inspect retained artifact." >&2
            exit 1
          fi
          if [ "${{ steps.validate.outcome }}" != "success" ]; then
            echo "STM32L0 L0.2 live evidence failed bounded summary validation." >&2
            exit 1
          fi
