name: STM32L5 security-scope foundation validation

on:
  pull_request:
    paths:
      - "data/device-catalog/research/stm32l5-security-scope-foundation.json"
      - "data/device-catalog/research/validate_stm32l5_security_scope_foundation.py"
      - "data/device-catalog/research/test_stm32l5_security_scope_foundation.py"
      - "data/device-catalog/research/device-catalog-stm32l5-security-scope-foundation.md"
      - "data/device-catalog/research/stm32-trustzone-cohort-gate1-qualification.json"
      - ".github/workflows/device-catalog-stm32l5-security-scope-foundation-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate security-scope negative controls
        working-directory: data/device-catalog/research
        run: python -m unittest -v test_stm32l5_security_scope_foundation.py
      - name: Replay frozen security-scope foundation
        working-directory: data/device-catalog/research
        run: python validate_stm32l5_security_scope_foundation.py
      - name: Enforce zero Production writes
        if: github.event_name == 'pull_request'
        run: git diff --exit-code "${{ github.event.pull_request.base.sha }}...HEAD" -- data/device-catalog/production
