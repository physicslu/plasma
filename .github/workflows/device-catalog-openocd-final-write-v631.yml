name: OpenOCD final write gate v6.31

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32f3-commercial-icpn.csv'
      - 'data/device-catalog/research/stm32f7-commercial-icpn.csv'
      - 'data/device-catalog/research/stm32g4-commercial-icpn.csv'
      - 'data/device-catalog/research/openocd-parts-canonical-v631.csv'
      - 'data/device-catalog/research/openocd-final-production-dry-run-v6.31.json'
      - 'data/device-catalog/research/openocd-final-safe-bindings-v6.31.csv'
      - 'data/device-catalog/research/openocd-final-runtime-blocked-v6.31.csv'
      - 'data/device-catalog/research/openocd_backend_evolution_v631.py'
      - 'data/device-catalog/research/validate_openocd_final_write_v631.py'
      - 'data/device-catalog/research/test_validate_openocd_final_write_v631.py'
      - 'data/device-catalog/research/validate_stm32f3_layer1_publication_v33.py'
      - 'data/device-catalog/research/validate_stm32f7_layer1_publication_v37.py'
      - 'data/device-catalog/research/validate_stm32g4_layer1_publication_v21.py'
      - 'data/device-catalog/research/validate_openocd_production_write_v621.py'
      - 'data/ic-support/test_coverage_inventory.py'
      - '.github/workflows/device-catalog-openocd-final-write-v631.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact prewrite or approved exact postwrite state
        run: |
          python data/device-catalog/research/validate_openocd_final_write_v631.py
          python -m unittest discover -s data/device-catalog/research \
            -p test_validate_openocd_final_write_v631.py -v
      - name: Replay historical backend/publication evidence
        run: |
          python data/device-catalog/research/validate_openocd_production_write_v621.py
          python data/device-catalog/research/validate_stm32f3_layer1_publication_v33.py
          python data/device-catalog/research/validate_stm32f7_layer1_publication_v37.py
          python data/device-catalog/research/validate_stm32g4_layer1_publication_v21.py
      - name: Validate current catalog invariants
        run: |
          python scripts/ci/device-catalog-production-invariants.py
          python data/ic-support/test_coverage_inventory.py
