name: STM32WL3 Layer-1 admission proposal v4.6

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/prepare_stm32wl3_layer1_admission_proposal_v46.py'
      - 'data/device-catalog/research/test_prepare_stm32wl3_layer1_admission_proposal_v46.py'
      - 'data/device-catalog/research/STM32WL3_LAYER1_ADMISSION_PROPOSAL_V46.md'
      - 'data/device-catalog/research/stm32wl3-layer1-admission-proposal-v4.6.json'
      - 'data/device-catalog/research/validate_stm32wl3_layer1_proposal_lock_v46.py'
      - '.github/workflows/device-catalog-stm32wl3-layer1-proposal-v46.yml'

permissions:
  contents: read

jobs:
  proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate STM32WL3 proposal
        run: |
          python data/device-catalog/research/prepare_stm32wl3_layer1_admission_proposal_v46.py \
            --proposal /tmp/stm32wl3-v46.csv \
            --summary /tmp/stm32wl3-v46.json
          python -m unittest discover -s data/device-catalog/research \
            -p test_prepare_stm32wl3_layer1_admission_proposal_v46.py -v
          if [ -f data/device-catalog/research/validate_stm32wl3_layer1_proposal_lock_v46.py ]; then
            python data/device-catalog/research/validate_stm32wl3_layer1_proposal_lock_v46.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stm32wl3-layer1-admission-proposal-v46
          path: |
            /tmp/stm32wl3-v46.csv
            /tmp/stm32wl3-v46.json
          if-no-files-found: error
          retention-days: 30
