name: STM32 U0 C0 technical-document HTML diagnostic one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32-evidence-accessibility-probe
    paths:
      - ".github/workflows/device-catalog-stm32-u0-c0-ordering-accessibility-oneoff.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe official ST technical-document HTML projections
        run: |
          set -euo pipefail
          mkdir -p /tmp/stm32-technical-doc-diagnostic
          python - <<'PY'
          import json, subprocess
          from pathlib import Path

          targets={
              'STM32U031C6':('DS14581','https://www.st.com/content/st_com/en/technical-documents/DS14581.html'),
              'STM32C031C4':('DS13867','https://www.st.com/content/st_com/en/technical-documents/DS13867.html'),
          }
          out={'schema_version':1,'targets':[],'claims':{'technical_document_html_available':False,'ordering_semantics_available':False,'family_selected':False}}
          for base,(doc,url) in targets.items():
              process=subprocess.run(
                  ['curl','-L','--silent','--show-error','--max-time','20','--connect-timeout','8','-A','Mozilla/5.0','-w','\n__HTTP_STATUS__:%{http_code}\n__FINAL_URL__:%{url_effective}\n',url],
                  stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False,
              )
              text=process.stdout.decode('utf-8',errors='replace')
              status=None; final_url=None
              for line in text.splitlines()[-6:]:
                  if line.startswith('__HTTP_STATUS__:'): status=line.split(':',1)[1]
                  if line.startswith('__FINAL_URL__:'): final_url=line.split(':',1)[1]
              body=text.split('\n__HTTP_STATUS__:',1)[0]
              folded=body.casefold()
              record={
                  'base_device':base,'document_id':doc,'url':url,'curl_exit_code':process.returncode,
                  'http_status':status,'final_url':final_url,'body_size_bytes':len(body.encode('utf-8')),
                  'document_id_present':doc.casefold() in folded,
                  'ordering_information_present':'ordering information' in folded,
                  'device_family_present':'device family' in folded,
                  'product_type_present':'product type' in folded,
                  'device_subfamily_present':'device subfamily' in folded,
                  'pin_count_present':'pin count' in folded,
                  'flash_memory_size_present':'flash memory size' in folded,
                  'package_present':'package' in folded,
                  'temperature_range_present':'temperature range' in folded,
                  'stderr':process.stderr.decode('utf-8',errors='replace')[-500:],
              }
              out['targets'].append(record)
          Path('/tmp/stm32-technical-doc-diagnostic/diagnostic.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: stm32-u0-c0-technical-document-html-diagnostic
          path: /tmp/stm32-technical-doc-diagnostic
          if-no-files-found: error
          retention-days: 30
