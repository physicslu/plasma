name: STM32 U0 C0 ordering-document link-surface diagnostic one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32-evidence-accessibility-probe
    paths:
      - ".github/workflows/device-catalog-stm32-u0-c0-ordering-accessibility-oneoff.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser tooling
        run: |
          python -m pip install --disable-pip-version-check playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Inspect representative official-ST datasheet link surfaces
        run: |
          mkdir -p /tmp/stm32-ordering-link-diagnostic
          xvfb-run -a python - <<'PY'
          import json, re
          from pathlib import Path
          from html.parser import HTMLParser
          from st_dual_surface_browser_acquisition import STDualSurfaceBrowserAcquirer

          targets={
              'STM32U031C6':'https://www.st.com/en/microcontrollers-microprocessors/stm32u031c6.html',
              'STM32C031C4':'https://www.st.com/en/microcontrollers-microprocessors/stm32c031c4.html',
          }

          class A(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True); self.rows=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()!='a': return
                  d={k:v for k,v in attrs if v is not None}
                  href=d.get('href','')
                  if '/resource/en/datasheet/' in href.lower() or 'datasheet' in json.dumps(d).lower():
                      self.rows.append({'attrs':d})

          out={'schema_version':1,'targets':[],'claims':{'alternate_endpoint_proven':False,'document_semantics_proven':False,'family_selected':False}}
          with STDualSurfaceBrowserAcquirer(base_by_url={v:k for k,v in targets.items()},family_label='STM32 U0/C0 ordering-link diagnostic',headless=False) as acq:
              for base,url in targets.items():
                  body,final_url,_,_=acq.fetch(url,45.0)
                  html=body.decode('utf-8')
                  p=A(); p.feed(html); p.close()
                  contexts=[]
                  folded=html.lower()
                  needles=['/resource/en/datasheet/', 'documentid', 'document-id', 'docid', 'datasheet']
                  spans=[]
                  for needle in needles:
                      start=0
                      while True:
                          pos=folded.find(needle,start)
                          if pos<0: break
                          spans.append((max(0,pos-350),min(len(html),pos+700),needle))
                          start=pos+len(needle)
                          if len(spans)>=80: break
                      if len(spans)>=80: break
                  seen=set()
                  for lo,hi,needle in spans:
                      text=re.sub(r'\s+',' ',html[lo:hi])
                      key=text[:500]
                      if key in seen: continue
                      seen.add(key)
                      contexts.append({'needle':needle,'text':text[:1050]})
                      if len(contexts)>=24: break
                  urls=sorted(set(re.findall(r'https://www\.st\.com[^"\'<> ]+',html)))
                  datasheet_urls=[u.rstrip('\\') for u in urls if '/resource/en/datasheet/' in u.lower()]
                  record={'base_device':base,'product_url':url,'final_url':final_url,'datasheet_anchors':p.rows,'datasheet_urls':datasheet_urls,'contexts':contexts}
                  out['targets'].append(record)
          Path('/tmp/stm32-ordering-link-diagnostic/diagnostic.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: stm32-u0-c0-ordering-link-surface-diagnostic
          path: /tmp/stm32-ordering-link-diagnostic
          if-no-files-found: error
          retention-days: 30
