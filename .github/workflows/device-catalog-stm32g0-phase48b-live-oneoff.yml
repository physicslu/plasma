name: STM32G0 Phase 4.8B official-ST discovery one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32g0-phase48b-discovery
    paths:
      - .github/workflows/device-catalog-stm32g0-phase48b-live-oneoff.yml
      - data/device-catalog/research/stm32g0_*.py
      - data/device-catalog/research/stm32g0-phase4.8b-discovery-manifest.json

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate offline Phase 4.8A/4.8B contracts
        run: |
          python data/device-catalog/research/test_stm32g0_phase4_8a_foundation.py
          python data/device-catalog/research/test_stm32g0_phase4_8b_discovery.py
      - name: Install pinned Playwright Chromium
        run: |
          python -m pip install 'playwright==1.62.0'
          python -m playwright install --with-deps chromium
      - name: Acquire 12-target official-ST evidence
        run: |
          rm -rf /tmp/stm32g0-4.8b-evidence
          mkdir -p /tmp/stm32g0-4.8b-evidence
          xvfb-run -a python data/device-catalog/research/run_stm32g0_phase4_8b_browser_discovery.py \
            --delay 2 --timeout 90 \
            --output /tmp/stm32g0-phase4.8b-live-summary.json \
            --evidence-dir /tmp/stm32g0-4.8b-evidence
      - name: Print compact disposition summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/stm32g0-phase4.8b-live-summary.json').read_text())
          keys=['attempted','acquisition_success','acquisition_failure','active_candidate_targets','lifecycle_excluded_targets','source_unavailable_exclusions','dispositioned_targets','commercial_identity_verified_targets','commercial_identity_unresolved_targets','active_exact_icpn_candidates','excluded_non_active_part_numbers','commercial_identity_clean','bounded_discovery_clean','identity_manual_intervention_required','openocd_routing']
          print(json.dumps({k:p[k] for k in keys}, indent=2, sort_keys=True))
          for r in p['results']:
              print(json.dumps({'base_device':r['base_device'],'disposition':r.get('disposition'),'commercial_identity_status':r.get('commercial_identity_status'),'exact_icpns':(r.get('evidence') or {}).get('exact_icpns',[]),'excluded':(r.get('evidence') or {}).get('excluded_non_active_part_numbers',[]),'error':r.get('error')}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stm32g0-phase4.8b-official-st-live-20260909
          path: |
            /tmp/stm32g0-phase4.8b-live-summary.json
            /tmp/stm32g0-4.8b-evidence
          if-no-files-found: error
          retention-days: 30
