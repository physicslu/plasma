name: Device catalog Phase 4.1 R/T batch2 regression fix v2

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-growth-safe-regressions-v2:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/device-catalog-phase4.1-rt-admission-batch2-retained'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make historical regressions growth-safe and register Batch2 closure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('data/device-catalog/research')

          def replace_one(path: Path, pattern: str, replacement: str) -> None:
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, got {count}')
              path.write_text(updated, encoding='utf-8')

          batch10 = root / 'test_stm32f4_phase4_0_foundation_batch10_post_admission.py'
          replace_one(
              batch10,
              r'    def test_production_manifest_retains_batch10_after_exact_batch11_state\(self\) -> None:\n.*?(?=\n\n\nif __name__)',
              '''    def test_production_manifest_retains_batch10_after_later_growth(self) -> None:\n        manifest = json.loads(PRODUCTION_MANIFEST.read_text(encoding="utf-8"))\n        sources = {source["family"]: source for source in manifest["sources"]}\n        with CANONICAL.open(newline="", encoding="utf-8") as handle:\n            rows = list(csv.DictReader(handle))\n        payload = CANONICAL.read_bytes()\n        current_sha = hashlib.sha256(payload).hexdigest()\n        current_blob = hashlib.sha1(f"blob {len(payload)}".encode() + bytes([0]) + payload).hexdigest()\n        self.assertTrue(self._baseline_new_icpns() <= {row["icpn"] for row in rows})\n        self.assertGreaterEqual(len(rows), 158)\n        self.assertEqual(sources["STM32F4"]["row_count"], len(rows))\n        self.assertEqual(sources["STM32F4"]["sha256"], current_sha)\n        self.assertEqual(sources["STM32F4"]["git_blob_sha"], current_blob)\n        self.assertEqual(sum(source["row_count"] for source in sources.values()), 75 + len(rows))''',
          )

          batch11 = root / 'test_stm32f4_phase4_0_foundation_batch11_post_admission.py'
          replace_one(
              batch11,
              r'    def test_production_manifest_binds_158_f4_rows_and_233_total_rows\(self\) -> None:\n.*?(?=\n\n    def test_phase41_rt_policy_preserves_batch11_production_and_unlocks_only_rt)',
              '''    def test_production_manifest_preserves_batch11_after_later_growth(self) -> None:\n        manifest = json.loads(PRODUCTION_MANIFEST.read_text(encoding="utf-8"))\n        sources = {source["family"]: source for source in manifest["sources"]}\n        with CANONICAL.open(newline="", encoding="utf-8") as handle:\n            rows = list(csv.DictReader(handle))\n        payload = CANONICAL.read_bytes()\n        current_sha = hashlib.sha256(payload).hexdigest()\n        current_blob = hashlib.sha1(f"blob {len(payload)}".encode() + bytes([0]) + payload).hexdigest()\n        self.assertGreaterEqual(len(rows), 158)\n        self.assertIn(NEW_ICPN, {row["icpn"] for row in rows})\n        self.assertEqual(sources["STM32F4"]["row_count"], len(rows))\n        self.assertEqual(sources["STM32F4"]["sha256"], current_sha)\n        self.assertEqual(sources["STM32F4"]["git_blob_sha"], current_blob)\n        self.assertEqual(sum(source["row_count"] for source in sources.values()), 75 + len(rows))''',
          )
          replace_one(
              batch11,
              r'    def test_phase41_rt_policy_preserves_batch11_production_and_unlocks_only_rt\(self\) -> None:\n.*?(?=\n\n\nif __name__)',
              '''    def test_later_growth_preserves_batch11_inventory_consistency(self) -> None:\n        inventory = build_inventory(catalog_path=CATALOG, canonical_path=CANONICAL)\n        self.assertFalse(inventory["algorithm_equivalence_claimed"])\n        self.assertEqual(inventory["openocd_ordering_pattern_base_device_count"], 149)\n        self.assertGreaterEqual(inventory["production"]["base_device_count"], 56)\n        self.assertGreaterEqual(inventory["production"]["exact_icpn_rows"], 158)\n        self.assertEqual(\n            inventory["gap"]["base_device_count"],\n            149 - inventory["production"]["base_device_count"],\n        )\n        self.assertEqual(\n            inventory["gap"]["base_device_count"],\n            inventory["gap"]["policy_ready_count"] + inventory["gap"]["policy_blocked_count"],\n        )''',
          )

          policy = root / 'test_stm32f4_phase4_1_rt_policy.py'
          replace_one(
              policy,
              r'    def test_inventory_delta_is_exactly_eleven_ready_and_eighty_two_blocked\(self\) -> None:\n.*?(?=\n\n    def test_all_unapproved_policy_classes_remain_fail_closed)',
              '''    def test_rt_policy_remains_effective_after_catalog_growth(self) -> None:\n        inventory = build_inventory(catalog_path=CATALOG, canonical_path=CANONICAL)\n        self.assertFalse(inventory["algorithm_equivalence_claimed"])\n        self.assertEqual(inventory["openocd_ordering_pattern_base_device_count"], 149)\n        self.assertEqual(\n            inventory["gap"]["base_device_count"],\n            149 - inventory["production"]["base_device_count"],\n        )\n        self.assertEqual(\n            inventory["gap"]["base_device_count"],\n            inventory["gap"]["policy_ready_count"] + inventory["gap"]["policy_blocked_count"],\n        )\n        with CANONICAL.open(newline="", encoding="utf-8") as handle:\n            production_bases = {row["base_device"] for row in csv.DictReader(handle)}\n        ready_bases = {item["base_device"] for item in inventory["gap"]["policy_ready"]}\n        blocked_bases = {item["base_device"] for item in inventory["gap"]["policy_blocked"]}\n        self.assertEqual(EXPECTED_BASE_DEVICES - production_bases, EXPECTED_BASE_DEVICES & ready_bases)\n        self.assertTrue(EXPECTED_BASE_DEVICES.isdisjoint(blocked_bases))''',
          )
          replace_one(
              policy,
              r'    def test_policy_only_change_preserves_production_catalog_and_preview_audit\(self\) -> None:\n.*?(?=\n\n\nif __name__)',
              '''    def test_policy_history_and_preview_audit_survive_later_growth(self) -> None:\n        with CANONICAL.open(newline="", encoding="utf-8") as handle:\n            rows = {row["icpn"]: row for row in csv.DictReader(handle)}\n        self.assertIn(PREVIEW_AUDIT_ONLY_ICPN, rows)\n\n        baseline = json.loads(F446_BASELINE.read_text(encoding="utf-8"))\n        preview = next(\n            item\n            for item in baseline["excluded_non_active_observations"]\n            if item["icpn"] == PREVIEW_AUDIT_ONLY_ICPN\n        )\n        self.assertEqual(preview["marketing_status"], "Preview")\n        self.assertFalse(preview["admission"])\n\n        payload = CANONICAL.read_bytes()\n        current_sha = hashlib.sha256(payload).hexdigest()\n        current_blob = hashlib.sha1(f"blob {len(payload)}".encode() + bytes([0]) + payload).hexdigest()\n        manifest = json.loads(PRODUCTION_MANIFEST.read_text(encoding="utf-8"))\n        sources = {source["family"]: source for source in manifest["sources"]}\n        self.assertEqual(sources["STM32F4"]["row_count"], len(rows))\n        self.assertEqual(sources["STM32F4"]["sha256"], current_sha)\n        self.assertEqual(sources["STM32F4"]["git_blob_sha"], current_blob)\n        self.assertEqual(sum(source["row_count"] for source in sources.values()), 75 + len(rows))''',
          )

          workflow = Path('.github/workflows/device-catalog-validation.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = '''      - name: Inventory STM32F4 production coverage gaps\n'''
          addition = '''      - name: Validate STM32F4 Phase 4.1 R/T batch2 admission lifecycle\n        run: |\n          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \\\n            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.1-rt-admission-batch2-live-2026-09-01 \\\n            --baseline data/device-catalog/research/stm32f4-phase4.1-rt-admission-batch2-baseline.json\n          python data/device-catalog/research/test_stm32f4_phase4_1_rt_admission_batch2_post_admission.py\n'''
          if addition not in text:
              if marker not in text:
                  raise SystemExit('device-catalog validation insertion marker missing')
              text = text.replace(marker, addition + marker, 1)
              workflow.write_text(text, encoding='utf-8')
          PY
          python -m py_compile \
            data/device-catalog/research/test_stm32f4_phase4_0_foundation_batch10_post_admission.py \
            data/device-catalog/research/test_stm32f4_phase4_0_foundation_batch11_post_admission.py \
            data/device-catalog/research/test_stm32f4_phase4_1_rt_policy.py \
            data/device-catalog/research/test_stm32f4_phase4_1_rt_admission_batch2_post_admission.py
          python data/device-catalog/research/test_stm32f4_phase4_0_foundation_batch10_post_admission.py
          python data/device-catalog/research/test_stm32f4_phase4_0_foundation_batch11_post_admission.py
          python data/device-catalog/research/test_stm32f4_phase4_1_rt_policy.py
          python data/device-catalog/research/test_stm32f4_phase4_1_rt_admission_batch2_post_admission.py
      - name: Commit regression fixes and remove one-shot workflows
        run: |
          set -euo pipefail
          git config user.name 'Gordon'
          git config user.email 'physicslu@gmail.com'
          git add \
            .github/workflows/device-catalog-validation.yml \
            data/device-catalog/research/test_stm32f4_phase4_0_foundation_batch10_post_admission.py \
            data/device-catalog/research/test_stm32f4_phase4_0_foundation_batch11_post_admission.py \
            data/device-catalog/research/test_stm32f4_phase4_1_rt_policy.py
          git rm .github/workflows/device-catalog-phase41-rt-batch2-regression-fix.yml
          git rm .github/workflows/device-catalog-phase41-rt-batch2-regression-fix-v2.yml
          git diff --cached --check
          git commit -m 'device-catalog: make historical regressions growth-safe'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
