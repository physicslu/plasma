name: NXP KL25 applicability retention

on:
  pull_request:
    paths:
      - ".github/workflows/nxp-kl25-applicability-retain.yml"
      - "data/ic-support/benchmarks/nxp-kl25/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate-applicability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic PDF tooling
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Acquire retained KL25 manufacturer bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nxp-kl25-source
          curl --fail --location --retry 3 --output /tmp/nxp-kl25-source/KL25P80M48SF0.pdf \
            https://www.nxp.com/docs/en/data-sheet/KL25P80M48SF0.pdf
          curl --fail --location --retry 3 --output /tmp/nxp-kl25-source/KL25P80M48SF0RM.pdf \
            https://community.nxp.com/pwmxy87654/attachments/pwmxy87654/kinetis/8734/1/KL25P80M48SF0RM.pdf
      - name: Regenerate applicability candidates from source-locked bytes
        run: |
          python data/ic-support/benchmarks/nxp-kl25/discover_applicability.py \
            --source-dir /tmp/nxp-kl25-source \
            --output /tmp/nxp-kl25-applicability-v1.json
          python data/ic-support/benchmarks/nxp-kl25/summarize_applicability.py \
            /tmp/nxp-kl25-applicability-v1.json
      - name: Extract bounded review pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nxp-kl25-review
          pdftotext -layout -enc UTF-8 -f 1 -l 21 /tmp/nxp-kl25-source/KL25P80M48SF0.pdf /tmp/nxp-kl25-review/ds-pages-1-21.txt
          pdftotext -layout -enc UTF-8 -f 38 -l 44 /tmp/nxp-kl25-source/KL25P80M48SF0RM.pdf /tmp/nxp-kl25-review/rm-pages-38-44.txt
          pdftotext -layout -enc UTF-8 -f 72 -l 79 /tmp/nxp-kl25-source/KL25P80M48SF0RM.pdf /tmp/nxp-kl25-review/rm-pages-72-79.txt
          pdftotext -layout -enc UTF-8 -f 149 -l 157 /tmp/nxp-kl25-source/KL25P80M48SF0RM.pdf /tmp/nxp-kl25-review/rm-pages-149-157.txt
          pdftotext -layout -enc UTF-8 -f 419 -l 456 /tmp/nxp-kl25-source/KL25P80M48SF0RM.pdf /tmp/nxp-kl25-review/rm-pages-419-456.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nxp-kl25-applicability-v1
          path: |
            /tmp/nxp-kl25-applicability-v1.json
            /tmp/nxp-kl25-review/*.txt
          if-no-files-found: error
          retention-days: 1
