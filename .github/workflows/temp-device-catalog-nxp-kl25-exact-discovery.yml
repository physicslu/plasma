name: TEMP NXP KL25 bounded exact ICPN discovery

on:
  push:
    branches:
      - agent/nxp-kl25-exact-icpn-discovery

permissions:
  contents: read

concurrency:
  group: temp-nxp-kl25-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official product browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Acquire bounded NXP KL25 exact active commercial identities
        id: acquire
        continue-on-error: true
        run: |
          rm -rf .artifacts/nxp-kl25-discovery
          mkdir -p .artifacts/nxp-kl25-discovery
          python data/device-catalog/research/nxp_kl25_exact_icpn_discovery.py \
            --output-dir .artifacts/nxp-kl25-discovery
      - name: Emit discovery evidence
        if: always()
        run: |
          python - <<'PY'
          import base64,pathlib
          root=pathlib.Path(".artifacts/nxp-kl25-discovery")
          for path in sorted(root.glob("*.json")):
              print(f"EVIDENCE_FILE_BEGIN {path.name}")
              print(base64.b64encode(path.read_bytes()).decode("ascii"))
              print(f"EVIDENCE_FILE_END {path.name}")
          PY
      - name: Upload live discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxp-kl25-exact-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: .artifacts/nxp-kl25-discovery/*.json
      - name: Enforce exact discovery gate
        if: always()
        run: |
          if [ "${{ steps.acquire.outcome }}" != "success" ]; then
            echo "NXP KL25 exact discovery requires manual review" >&2
            exit 1
          fi
