name: STM32 next-family prioritization one-off

on:
  push:
    branches:
      - agent/device-catalog-phase47a-next-family-prioritization
    paths:
      - .github/workflows/device-catalog-phase47a-next-family-oneoff.yml

permissions:
  contents: read

jobs:
  prioritize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute next STM32 family from current Production
        run: |
          python data/device-catalog/research/stm32_next_family_prioritization.py --output /tmp/next-family.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/next-family.json').read_text())
          print(json.dumps({
              'production_invariants': report['production_invariants'],
              'inventory': report['inventory'],
              'selected_next_research_family': report['selected_next_research_family'],
              'eligible_ranking': report['eligible_ranking'][:12],
              'claims': report['claims'],
          }, indent=2, sort_keys=True))
          PY
