name: Device catalog Phase 4.2K I176 discovery

on:
  push:
    branches:
      - agent/device-catalog-phase4.2k-i176-admission
    paths:
      - '.github/workflows/device-catalog-phase42k-i176-discovery.yml'
      - 'data/device-catalog/research/stm32f4-phase4.2k-i176-admission-manifest.json'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser runtime
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Acquire official ST discovery evidence
        run: |
          set +e
          mkdir -p /tmp/phase42k
          xvfb-run -a python data/device-catalog/research/run_stm32f4_browser_pilot.py \
            --manifest data/device-catalog/research/stm32f4-phase4.2k-i176-admission-manifest.json \
            --catalog data/device-catalog/research/openocd-parts-canonical.csv \
            --output /tmp/phase42k/pilot-summary.json \
            --scope pilot \
            --headed \
            --timeout 30 \
            --delay 2
          rc=$?
          printf '%s\n' "$rc" > /tmp/phase42k/acquisition-exit-code.txt
          exit 0
      - name: Hash discovery output
        if: always()
        run: |
          cd /tmp/phase42k
          sha256sum * > SHA256SUMS || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase42k-stm32f4-i176-discovery
          path: /tmp/phase42k
          if-no-files-found: error
          retention-days: 30
      - name: Enforce discovery result
        if: always()
        run: |
          test -f /tmp/phase42k/acquisition-exit-code.txt
          test "$(cat /tmp/phase42k/acquisition-exit-code.txt)" = "0"
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/phase42k/pilot-summary.json')
          if not p.exists():
              raise SystemExit('pilot-summary.json missing')
          data = json.loads(p.read_text())
          if data.get('acquisition_failure') != 0:
              raise SystemExit(f"acquisition failures: {data.get('acquisition_failure')}")
          manifest = json.loads(Path('data/device-catalog/research/stm32f4-phase4.2k-i176-admission-manifest.json').read_text())
          expected = {x['base_device'] for x in manifest['targets']}
          got = {x.get('base_device') for x in data.get('results', [])}
          if got != expected:
              raise SystemExit(f'unexpected target set: expected={sorted(expected)} got={sorted(got)}')
          if len(got) != 19:
              raise SystemExit(f'expected 19 bounded targets, got {len(got)}')
          print(f"bounded_targets={len(got)}")
          print(f"active_exact_icpn_candidates={data.get('exact_icpn_candidates')}")
          PY
