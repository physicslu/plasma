name: STM32U3 canonical admission plan validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32u3_admission_policy.py'
      - 'data/device-catalog/research/stm32u3-canonical-admission-plan.json'
      - 'data/device-catalog/research/stm32u3-admission-route-evidence.csv'
      - 'data/device-catalog/research/validate_stm32u3_canonical_admission_plan.py'
      - 'data/device-catalog/research/device-catalog-stm32u3-canonical-admission-plan.md'
      - '.github/workflows/device-catalog-stm32u3-canonical-admission-plan-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe STM32U3 route surface
        working-directory: data/device-catalog/research
        run: python stm32u3_admission_policy.py
