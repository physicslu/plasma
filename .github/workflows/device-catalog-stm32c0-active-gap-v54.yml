name: STM32C0 active gap metadata replay v5.4

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/st-stm32c0-active-gap-v5.4.txt'
      - 'data/device-catalog/research/stm32c0-active-gap-lock-v5.4.json'
      - 'data/device-catalog/research/stm32c0-active-gap-ordering-authority-v5.4.json'
      - 'data/device-catalog/research/analyze_stm32c0_active_gap_v54.py'
      - 'data/device-catalog/research/test_analyze_stm32c0_active_gap_v54.py'
      - 'data/device-catalog/research/STM32C0_ACTIVE_GAP_METADATA_REPLAY_V54.md'
      - '.github/workflows/device-catalog-stm32c0-active-gap-v54.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STM32C0 17-row Active delta
        run: |
          python data/device-catalog/research/analyze_stm32c0_active_gap_v54.py
          python -m unittest discover -s data/device-catalog/research \
            -p test_analyze_stm32c0_active_gap_v54.py -v
