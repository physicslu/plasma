name: STM32G4 Phase 4.9A validation one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32g4-phase49a-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-stm32g4-foundation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STM32G4 Phase 4.9A foundation
        run: python data/device-catalog/research/test_stm32g4_phase4_9a_foundation.py
      - name: Report frozen baseline SHA-256
        run: sha256sum data/device-catalog/research/stm32g4-phase4.9a-foundation-baseline.json
