name: STM32G0 official ordering authority replay v1.7
on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32g0-ordering-authority-v1.7.json'
      - 'data/device-catalog/research/replay_stm32g0_ordering_authority_v17.py'
      - 'data/device-catalog/research/test_replay_stm32g0_ordering_authority_v17.py'
      - 'data/device-catalog/research/STM32G0_ORDERING_AUTHORITY_V17.md'
      - '.github/workflows/device-catalog-stm32g0-ordering-authority-v17.yml'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python data/device-catalog/research/replay_stm32g0_ordering_authority_v17.py
          python -m unittest discover -s data/device-catalog/research -p test_replay_stm32g0_ordering_authority_v17.py -v
