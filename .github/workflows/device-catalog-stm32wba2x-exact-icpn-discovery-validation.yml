name: STM32WBA2X exact ICPN discovery validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/openocd-parts-canonical.csv'
      - 'data/device-catalog/research/stm32-post-h7-wireless-frontier-selection.json'
      - 'data/device-catalog/research/evidence/stm32wba2x-accessibility-live-2026-09-18/**'
      - 'data/device-catalog/research/stm32wba2x_exact_icpn_discovery.py'
      - 'data/device-catalog/research/validate_stm32wba2x_exact_icpn_discovery.py'
      - 'data/device-catalog/research/evidence/stm32wba2x-exact-icpn-live-2026-09-18/**'
      - '.github/workflows/device-catalog-stm32wba2x-exact-icpn-discovery-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'data/device-catalog/research/openocd-parts-canonical.csv'
      - 'data/device-catalog/research/stm32-post-h7-wireless-frontier-selection.json'
      - 'data/device-catalog/research/evidence/stm32wba2x-accessibility-live-2026-09-18/**'
      - 'data/device-catalog/research/stm32wba2x_exact_icpn_discovery.py'
      - 'data/device-catalog/research/validate_stm32wba2x_exact_icpn_discovery.py'
      - 'data/device-catalog/research/evidence/stm32wba2x-exact-icpn-live-2026-09-18/**'
      - '.github/workflows/device-catalog-stm32wba2x-exact-icpn-discovery-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate retained STM32WBA2X exact ICPN discovery
        run: python data/device-catalog/research/validate_stm32wba2x_exact_icpn_discovery.py
