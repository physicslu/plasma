name: Device catalog Phase 4.2B STM32F410CB retained publish

on:
  pull_request:

permissions:
  actions: read
  contents: write

jobs:
  publish-retained-evidence:
    if: >-
      github.actor == 'physicslu' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/device-catalog-phase4.2b-f410cb-admission'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-phase4.2b-f410cb-admission
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable retained artifact
        uses: actions/download-artifact@v4
        with:
          name: phase42b-stm32f410cb-retained
          path: /tmp/retained
          repository: physicslu/plasma
          run-id: '33585683509'
          github-token: ${{ github.token }}
      - name: Validate and bind retained evidence
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            /tmp/retained \
            --baseline data/device-catalog/research/stm32f4-phase4.2b-f410cb-admission-baseline.json
          dst=data/device-catalog/research/evidence/stm32f4-phase4.2b-f410cb-admission-live-2026-09-02
          rm -rf "$dst"
          mkdir -p "$dst"
          cp -a /tmp/retained/. "$dst/"
          cat > data/device-catalog/research/stm32f4-phase4.2b-f410cb-admission-retained-source.json <<'JSON'
          {
            "schema_version": 1,
            "workflow_run_id": "33585683509",
            "artifact_id": "9830008020",
            "artifact_name": "phase42b-stm32f410cb-retained",
            "artifact_zip_sha256": "2424bc688f67d4cd01c34505f9e210735ac7456e4536d022133249548d13512d",
            "evidence_id": "stm32f4-phase4.2b-f410cb-admission-2026-09-02-retained-20260902T030605Z-664109b",
            "discovery_workflow_run_id": "33585423385",
            "discovery_artifact_id": "9829921112",
            "discovery_artifact_sha256": "81cfc4be87e5e378597c557a0f43ab14b9deca9c0eda315572efa27b103ad98a"
          }
          JSON
      - name: Commit retained evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/device-catalog/research/evidence/stm32f4-phase4.2b-f410cb-admission-live-2026-09-02 \
                  data/device-catalog/research/stm32f4-phase4.2b-f410cb-admission-retained-source.json
          if git diff --cached --quiet; then
            echo 'Retained evidence already published.'
            exit 0
          fi
          git commit -m 'device-catalog: retain STM32F410CB official ST evidence'
          git push origin HEAD:agent/device-catalog-phase4.2b-f410cb-admission
