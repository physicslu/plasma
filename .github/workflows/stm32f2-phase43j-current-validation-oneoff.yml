name: STM32F2 Phase 4.3I/J current validation update one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32f2-phase43j-publish

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append post-admission validation step and remove this workflow
        run: |
          set -euo pipefail
          file=.github/workflows/device-catalog-current-validation.yml
          ! grep -q 'Validate Phase 4.3I-J STM32F2 policy and post-admission closure' "$file"
          tail -n 6 "$file" | grep -q 'Validate Phase 4.3H STM32F2 third bounded discovery'
          printf '\n      - name: Validate Phase 4.3I-J STM32F2 policy and post-admission closure\n        run: |\n          python data/device-catalog/research/stm32f2_phase4_3i_policy.py\n          python data/device-catalog/research/test_stm32f2_phase4_3j_admission.py\n          PYTHONPATH=software/python python software/python/tests/test_device_catalog.py\n' >> "$file"
          git rm .github/workflows/stm32f2-phase43j-current-validation-oneoff.yml
          git config user.name 'plasma-ci'
          git config user.email 'plasma-ci@users.noreply.github.com'
          git add "$file"
          git commit -m 'ci: validate STM32F2 Phase 4.3J post-admission closure'
          git push origin HEAD:agent/device-catalog-stm32f2-phase43j-publish
