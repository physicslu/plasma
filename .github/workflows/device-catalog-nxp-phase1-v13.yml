name: NXP Phase 1 IC Information exact 501 source replay v13
on:
  pull_request:
    paths:
      - 'data/device-catalog/research/nxp_phase1_information_v13.py'
      - 'data/device-catalog/research/test_nxp_phase1_information_v13.py'
      - 'data/device-catalog/research/nxp-501-phase1-ic-information-v13.csv'
      - 'data/device-catalog/research/nxp-phase1-field-coverage-v13.json'
      - 'data/device-catalog/research/nxp-phase1-source-lock-v13.json'
      - 'data/device-catalog/research/NXP_PHASE1_IC_INFORMATION_V13.md'
      - '.github/workflows/device-catalog-nxp-phase1-v13.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase1-original-source-and-field-completeness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm exact 501 manufacturer observations without software or HIL claims
        run: python data/device-catalog/research/nxp_phase1_information_v13.py
      - name: Test unknown/partial evidence, units and identity-vs-information boundary
        run: python -m unittest discover -s data/device-catalog/research -p 'test_nxp_phase1_information_v13.py' -v
