name: STM32WBA5X admission readiness validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32wba5x-commercial-icpn.csv'
      - 'data/device-catalog/research/stm32wba5x-admission-readiness.json'
      - 'data/device-catalog/research/stm32wba5x-metadata-authority.json'
      - 'data/device-catalog/research/stm32wba5x_admission_readiness.py'
      - 'data/device-catalog/research/validate_stm32wba5x_admission_readiness.py'
      - 'data/device-catalog/research/stm32wba5x-commercial-scope-reconciliation-v2.json'
      - 'data/device-catalog/research/evidence/stm32wba5x-exact-icpn-live-2026-09-23/**'
      - '.github/workflows/device-catalog-stm32wba5x-admission-readiness-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/stm32wba5x-commercial-icpn.csv'
      - 'data/device-catalog/research/stm32wba5x-admission-readiness.json'
      - 'data/device-catalog/research/stm32wba5x-metadata-authority.json'
      - 'data/device-catalog/research/stm32wba5x_admission_readiness.py'
      - 'data/device-catalog/research/validate_stm32wba5x_admission_readiness.py'
      - 'data/device-catalog/research/stm32wba5x-commercial-scope-reconciliation-v2.json'
      - 'data/device-catalog/research/evidence/stm32wba5x-exact-icpn-live-2026-09-23/**'
      - '.github/workflows/device-catalog-stm32wba5x-admission-readiness-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STM32WBA5X admission readiness
        run: python data/device-catalog/research/validate_stm32wba5x_admission_readiness.py
