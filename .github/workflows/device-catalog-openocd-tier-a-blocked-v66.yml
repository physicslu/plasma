name: OpenOCD Tier A blocked classification v6.6

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/classify_openocd_tier_a_blocked_v66.py'
      - 'data/device-catalog/research/test_classify_openocd_tier_a_blocked_v66.py'
      - 'data/device-catalog/research/OPENOCD_TIER_A_BLOCKED_CLASSIFICATION_V66.md'
      - '.github/workflows/device-catalog-openocd-tier-a-blocked-v66.yml'

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify v6.5 blocked identities
        run: |
          python data/device-catalog/research/classify_openocd_tier_a_blocked_v66.py \
            --classified /tmp/openocd-tier-a-blocked-v66.csv \
            --summary /tmp/openocd-tier-a-blocked-v66.json
          python -m unittest discover -s data/device-catalog/research \
            -p test_classify_openocd_tier_a_blocked_v66.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: openocd-tier-a-blocked-classification-v66
          path: |
            /tmp/openocd-tier-a-blocked-v66.csv
            /tmp/openocd-tier-a-blocked-v66.json
          if-no-files-found: error
          retention-days: 30
