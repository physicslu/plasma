name: PR70 Apply Batch Log Contract

on:
  push:
    branches:
      - agent/omit-empty-batch-log-groups

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/omit-empty-batch-log-groups
          fetch-depth: 0
      - name: Apply deterministic batch-log contract update
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "software/web/app/engineering/programming-workspace.tsx",
              '''      const label = (ids: number[]) => ids.length ? siteListLabel(ids) : "—";\n      appendLog(\n        `${outcome} · success: ${label(successful)} · cancelled: ${label(cancelled)} · failed: ${label(failed)}`,\n        failed.length > 0,\n        "BAT",\n      );''',
              '''      const groups: string[] = [];\n      if (successful.length > 0) groups.push(`success: ${siteListLabel(successful)}`);\n      if (cancelled.length > 0) groups.push(`cancelled: ${siteListLabel(cancelled)}`);\n      if (failed.length > 0) groups.push(`failed: ${siteListLabel(failed)}`);\n      appendLog(\n        `${outcome} · ${groups.join(" · ")}`,\n        failed.length > 0,\n        "BAT",\n      );''',
          )

          replace_once(
              "software/web/e2e/tests/engineering-log-observability.spec.ts",
              '  await expect(log).toContainText("[BAT] PARTIAL · success: SITE-01 · cancelled: SITE-02 · failed: —", { timeout: 15_000 });',
              '  await expect(log).toContainText("[BAT] PARTIAL · success: SITE-01 · cancelled: SITE-02", { timeout: 15_000 });',
          )

          p = Path("software/web/e2e/tests/engineering-log-observability.spec.ts")
          text = p.read_text()
          anchor = '  await expect(log).toContainText("reference only · no binary upload");\n'
          insertion = anchor + '  await expect(log).toContainText("[BAT] COMPLETE · success: SITE-01, SITE-02");\n  await expect(log).not.toContainText("cancelled: —");\n  await expect(log).not.toContainText("failed: —");\n'
          if text.count(anchor) != 1:
              raise SystemExit("engineering-log-observability.spec.ts: expected one insertion anchor")
          p.write_text(text.replace(anchor, insertion, 1))

          p = Path("docs/architecture/engineering-programming-observability.md")
          text = p.read_text()
          old = '''[BAT] START ERASE → PROGRAM → VERIFY · SITE-01, SITE-02\n[BAT] COMPLETE · success: SITE-01, SITE-02 · cancelled: — · failed: —\n[BAT] PARTIAL · success: SITE-01 · cancelled: SITE-02 · failed: —\n[BAT] CANCELLED · success: — · cancelled: SITE-01, SITE-02 · failed: —\n[BAT] FAILED · success: SITE-01 · cancelled: — · failed: SITE-02'''
          new = '''[BAT] START ERASE → PROGRAM → VERIFY · SITE-01, SITE-02\n[BAT] COMPLETE · success: SITE-01, SITE-02\n[BAT] PARTIAL · success: SITE-01 · cancelled: SITE-02\n[BAT] CANCELLED · cancelled: SITE-01, SITE-02\n[BAT] FAILED · success: SITE-01 · failed: SITE-02'''
          if text.count(old) != 1:
              raise SystemExit("observability doc: expected one batch example block")
          text = text.replace(old, new, 1)
          anchor = "These logs are evidence, not behavioral authority."
          note = "Rendered operator logs omit empty outcome groups. Machine-readable Batch results keep their complete structured fields; consumers must not infer schema from rendered text.\n\n"
          if text.count(anchor) != 1:
              raise SystemExit("observability doc: expected one authority anchor")
          p.write_text(text.replace(anchor, note + anchor, 1))
          PY

          git diff --check
          git diff -- software/web/app/engineering/programming-workspace.tsx software/web/e2e/tests/engineering-log-observability.spec.ts docs/architecture/engineering-programming-observability.md
      - name: Commit refactor
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "plasma-pr70-bot"
          git config user.email "plasma-pr70-bot@users.noreply.github.com"
          git add -- software/web/app/engineering/programming-workspace.tsx software/web/e2e/tests/engineering-log-observability.spec.ts docs/architecture/engineering-programming-observability.md
          git commit -m "Omit empty batch outcome groups from operator logs"
          git push origin HEAD:agent/omit-empty-batch-log-groups
