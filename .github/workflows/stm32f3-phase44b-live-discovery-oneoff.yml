name: STM32F3 Phase 4.4B live discovery one-off

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate offline discovery contract
        run: python data/device-catalog/research/test_stm32f3_phase4_4b_discovery.py
      - name: Install browser acquisition dependencies
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium
      - name: Run bounded headed Chromium acquisition
        id: acquire
        shell: bash
        run: |
          set +e
          xvfb-run -a python data/device-catalog/research/stm32f3_phase4_4b_discovery.py \
            --output /tmp/stm32f3-phase4.4b-live-summary.json \
            --evidence-dir /tmp/stm32f3-phase4.4b-evidence \
            --timeout 90 \
            --delay 2
          rc=$?
          echo "$rc" > /tmp/stm32f3-phase4.4b-exit-code.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload live discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32f3-phase4.4b-live-discovery-20260908
          path: |
            /tmp/stm32f3-phase4.4b-live-summary.json
            /tmp/stm32f3-phase4.4b-evidence
            /tmp/stm32f3-phase4.4b-exit-code.txt
          retention-days: 7
      - name: Enforce acquisition result
        if: always()
        run: exit "${{ steps.acquire.outputs.exit_code }}"
