name: PR99 Clean Generated Files

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr99-clean-generated.yml

permissions:
  contents: write

jobs:
  clean:
    if: github.head_ref == 'agent/unified-pe-batch-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-pe-batch-dashboard
          fetch-depth: 0

      - name: Remove accidentally tracked generated files
        run: |
          git rm -r --ignore-unmatch \
            software/web/e2e/node_modules \
            software/web/e2e/playwright-report \
            software/web/e2e/test-results
          rm -f .github/workflows/pr99-clean-generated.yml

      - name: Commit cleanup
        run: |
          git config user.name "plasma-ci-bot"
          git config user.email "plasma-ci-bot@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated Playwright artifacts from PR99"
          git push origin HEAD:agent/unified-pe-batch-dashboard
