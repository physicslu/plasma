name: STM32WB0 Layer-1 admission proposal v5.2

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/prepare_stm32wb0_layer1_admission_proposal_v52.py'
      - 'data/device-catalog/research/test_prepare_stm32wb0_layer1_admission_proposal_v52.py'
      - 'data/device-catalog/research/STM32WB0_LAYER1_ADMISSION_PROPOSAL_V52.md'
      - 'data/device-catalog/research/stm32wb0-layer1-admission-proposal-v5.2.json'
      - 'data/device-catalog/research/validate_stm32wb0_layer1_proposal_lock_v52.py'
      - '.github/workflows/device-catalog-stm32wb0-layer1-proposal-v52.yml'

permissions:
  contents: read

jobs:
  proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate STM32WB0 proposal
        run: |
          python data/device-catalog/research/prepare_stm32wb0_layer1_admission_proposal_v52.py \
            --proposal /tmp/stm32wb0-v52.csv \
            --summary /tmp/stm32wb0-v52.json
          python -m unittest discover -s data/device-catalog/research \
            -p test_prepare_stm32wb0_layer1_admission_proposal_v52.py -v
          python data/device-catalog/research/validate_stm32wb0_layer1_proposal_lock_v52.py
      - uses: actions/upload-artifact@v4
        with:
          name: stm32wb0-layer1-admission-proposal-v52
          path: |
            /tmp/stm32wb0-v52.csv
            /tmp/stm32wb0-v52.json
          if-no-files-found: error
          retention-days: 30
