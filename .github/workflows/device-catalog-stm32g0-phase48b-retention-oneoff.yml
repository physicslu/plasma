name: STM32G0 Phase 4.8B retention one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32g0-phase48b-discovery
    paths:
      - .github/workflows/device-catalog-stm32g0-phase48b-retention-oneoff.yml

permissions:
  actions: read
  contents: write

jobs:
  retain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-stm32g0-phase48b-discovery
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download immutable live artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/g0-artifact
          curl -L --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/physicslu/plasma/actions/artifacts/10111790513/zip \
            -o /tmp/g0-artifact.zip
          echo '2d261efb10ec0840208337edf8a3d2ebd1d0dc3aeb5effd78af735dd30dac36f  /tmp/g0-artifact.zip' | sha256sum -c -
          unzip -q /tmp/g0-artifact.zip -d /tmp/g0-artifact
      - name: Retain compact evidence projection
        run: |
          python data/device-catalog/research/retain_stm32g0_phase4_8b_artifact.py \
            --artifact-root /tmp/g0-artifact \
            --artifact-id 10111790513 \
            --artifact-zip-sha256 2d261efb10ec0840208337edf8a3d2ebd1d0dc3aeb5effd78af735dd30dac36f \
            --workflow-run-id 34369661142 \
            --executed-git-sha 233e9300bfac96f868e4d4c372246a3e02ff541b
      - name: Validate generated retention files
        run: |
          python data/device-catalog/research/test_stm32g0_phase4_8a_foundation.py
          python data/device-catalog/research/test_stm32g0_dual_surface_evidence.py
          python data/device-catalog/research/test_stm32g0_phase4_8b_discovery.py
          git status --short
      - name: Commit retained data only
        run: |
          git config user.name 'plasma-ci'
          git config user.email 'plasma-ci@users.noreply.github.com'
          git add \
            data/device-catalog/research/stm32g0-phase4.8b-discovery-baseline.json \
            data/device-catalog/research/evidence/stm32g0-phase4.8b-official-st-discovery-live-2026-09-09
          git diff --cached --check
          git commit -m 'device-catalog: retain STM32G0 Phase 4.8B live evidence'
          git push origin HEAD:agent/device-catalog-stm32g0-phase48b-discovery
