name: TEMP STM32L4 L4.2 live discovery retain

on:
  push:
    branches:
      - agent/device-catalog-stm32l4-phase-l42-discovery
    paths:
      - ".github/workflows/tmp-stm32l4-l42-live-retain.yml"

permissions:
  contents: write

concurrency:
  group: stm32l4-l42-live-retain
  cancel-in-progress: false

jobs:
  live-retain:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate deterministic L4.2 target boundary
        run: |
          python data/device-catalog/research/stm32l4_phase_l4_2_discovery.py --targets-output /tmp/l4-targets.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('/tmp/l4-targets.json'))
          assert p['phase'] == 'L4.2' and p['family'] == 'STM32L4'
          assert 24 <= p['base_device_count'] <= 207, p['base_device_count']
          assert len(p['base_device_counts_by_subfamily']) == 24
          assert all(v is False for v in p['claims'].values())
          print(f"STM32L4 L4.2 target boundary: PASS ({p['base_device_count']} Base Devices)")
          PY

      - name: Install bounded browser acquisition dependencies
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium

      - name: Acquire complete deterministic STM32L4 Base Device set
        id: acquire
        continue-on-error: true
        run: |
          ROOT=data/device-catalog/research/evidence/stm32l4-l4.2-official-st-discovery-live-2026-09-13
          mkdir -p "$ROOT/evidence"
          xvfb-run -a python data/device-catalog/research/run_stm32l4_phase_l4_2_discovery.py \
            --delay 1.0 \
            --timeout 75 \
            --output "$ROOT/live-summary.json" \
            --targets-output "$ROOT/targets.json" \
            --evidence-dir "$ROOT/evidence"

      - name: Validate and retain acquisition provenance
        id: validate
        if: always() && hashFiles('data/device-catalog/research/evidence/stm32l4-l4.2-official-st-discovery-live-2026-09-13/live-summary.json') != ''
        continue-on-error: true
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path('data/device-catalog/research/evidence/stm32l4-l4.2-official-st-discovery-live-2026-09-13')
          s=json.loads((root/'live-summary.json').read_text())
          t=json.loads((root/'targets.json').read_text())
          assert s['phase'] == 'L4.2' and s['family'] == 'STM32L4'
          assert s['attempted'] == s['base_device_count'] == t['base_device_count']
          assert s['dispositioned_targets'] == s['base_device_count']
          assert s['commercial_identity_verified_targets'] == s['base_device_count']
          assert s['identity_manual_intervention_required'] == 0
          assert s['acquisition_failure'] == 0
          assert s['source_unavailable_exclusions'] == 0
          assert s['representative_continuity_clean'] is True
          assert s['bounded_discovery_clean'] is True
          assert all(v is False for v in s['claims'].values())

          leaf={}
          for p in sorted((root/'evidence').glob('*.json')):
              leaf[p.name]=hashlib.sha256(p.read_bytes()).hexdigest()
          assert len(leaf) == s['base_device_count']
          (root/'leaf-digests.json').write_text(json.dumps({
              'schema_version':1,
              'phase':'L4.2',
              'family':'STM32L4',
              'leaf_count':len(leaf),
              'sha256_by_file':leaf,
          }, indent=2, sort_keys=True)+'\n')

          provenance={
              'schema_version':1,
              'phase':'L4.2',
              'family':'STM32L4',
              'source_repository':os.environ['GITHUB_REPOSITORY'],
              'source_branch':os.environ['GITHUB_REF_NAME'],
              'executed_git_sha':os.environ['GITHUB_SHA'],
              'workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
              'workflow_run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
              'acquisition_transport':s.get('acquisition_transport'),
              'browser':s.get('browser'),
              'target_count':s['base_device_count'],
              'active_candidate_targets':s['active_candidate_targets'],
              'lifecycle_excluded_targets':s['lifecycle_excluded_targets'],
              'active_exact_icpn_candidates':s['active_exact_icpn_candidates'],
              'excluded_non_active_part_numbers':s['excluded_non_active_part_numbers'],
              'routing_followup_required':s['routing_followup_required'],
              'bounded_discovery_clean':s['bounded_discovery_clean'],
              'canonical_admission_authorized':False,
              'production_write_authorized':False,
              'runtime_programming_support_claimed':False,
          }
          (root/'provenance.json').write_text(json.dumps(provenance, indent=2, sort_keys=True)+'\n')

          def digest(name): return hashlib.sha256((root/name).read_bytes()).hexdigest()
          manifest={
              'schema_version':1,
              'phase':'L4.2',
              'family':'STM32L4',
              'scope':'retained manufacturer-authoritative commercial discovery evidence',
              'base_device_count':s['base_device_count'],
              'active_exact_icpn_candidates':s['active_exact_icpn_candidates'],
              'excluded_non_active_part_numbers':s['excluded_non_active_part_numbers'],
              'live_summary_sha256':digest('live-summary.json'),
              'targets_sha256':digest('targets.json'),
              'provenance_sha256':digest('provenance.json'),
              'leaf_digests_sha256':digest('leaf-digests.json'),
              'claims':{
                  'canonical_admission_authorized':False,
                  'production_write_authorized':False,
                  'runtime_programming_support_claimed':False,
              },
          }
          (root/'retained-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True)+'\n')
          print(json.dumps({k:s[k] for k in [
              'base_device_count','active_candidate_targets','lifecycle_excluded_targets',
              'active_exact_icpn_candidates','excluded_non_active_part_numbers',
              'routing_followup_required','bounded_discovery_clean']}, indent=2, sort_keys=True))
          PY

      - name: Upload immutable acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32l4-l42-live-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: data/device-catalog/research/evidence/stm32l4-l4.2-official-st-discovery-live-2026-09-13/

      - name: Commit retained research evidence to transaction branch
        if: steps.acquire.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          ROOT=data/device-catalog/research/evidence/stm32l4-l4.2-official-st-discovery-live-2026-09-13
          rm -rf "$ROOT/evidence"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT/live-summary.json" "$ROOT/targets.json" "$ROOT/provenance.json" "$ROOT/leaf-digests.json" "$ROOT/retained-manifest.json"
          git commit -m "Retain STM32L4 L4.2 official ST discovery evidence"
          git push origin HEAD:${{ github.ref_name }}

      - name: Enforce bounded discovery gate
        if: always()
        run: |
          if [ "${{ steps.acquire.outcome }}" != "success" ]; then
            echo "STM32L4 L4.2 live acquisition requires review." >&2
            exit 1
          fi
          if [ "${{ steps.validate.outcome }}" != "success" ]; then
            echo "STM32L4 L4.2 live evidence failed bounded summary validation." >&2
            exit 1
          fi
