name: STM32G0 Phase 4.8E publication one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32g0-phase48e-publication
    paths:
      - .github/workflows/device-catalog-stm32g0-phase48e-publication-oneoff.yml

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay frozen Phase 4.8D and published Phase 4.8E invariants
        run: |
          python data/device-catalog/research/validate_stm32g0_phase4_8d_admission_plan.py
          python data/device-catalog/research/test_stm32g0_phase4_8e_publication.py
          sha256sum data/device-catalog/research/stm32g0-commercial-icpn.csv
          git hash-object data/device-catalog/research/stm32g0-commercial-icpn.csv
          sha256sum data/device-catalog/production/icpn-v1-manifest.json
          sha256sum data/device-catalog/research/stm32g0-phase4.8e-publication-audit.json
