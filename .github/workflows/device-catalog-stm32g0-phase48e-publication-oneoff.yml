name: STM32G0 Phase 4.8E publication one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32g0-phase48e-publication
    paths:
      - .github/workflows/device-catalog-stm32g0-phase48e-publication-oneoff.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-stm32g0-phase48e-publication
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay Phase 4.8D frozen admission gate
        run: |
          python data/device-catalog/research/validate_stm32g0_phase4_8d_admission_plan.py
          python data/device-catalog/research/publish_stm32g0_phase4_8e.py --dry-run
      - name: Apply canonical and Production publication transaction
        run: |
          python data/device-catalog/research/publish_stm32g0_phase4_8e.py
          sha256sum data/device-catalog/research/stm32g0-commercial-icpn.csv
          git hash-object data/device-catalog/research/stm32g0-commercial-icpn.csv
          sha256sum data/device-catalog/production/icpn-v1-manifest.json
          sha256sum data/device-catalog/research/stm32g0-phase4.8e-publication-audit.json
      - name: Commit publication transaction only
        run: |
          git config user.name 'plasma-ci'
          git config user.email 'plasma-ci@users.noreply.github.com'
          git add \
            data/device-catalog/research/stm32g0-commercial-icpn.csv \
            data/device-catalog/production/icpn-v1-manifest.json \
            data/device-catalog/research/stm32g0-phase4.8e-publication-audit.json
          git diff --cached --check
          git commit -m 'device-catalog: publish STM32G0 Phase 4.8E'
          git push origin HEAD:agent/device-catalog-stm32g0-phase48e-publication
