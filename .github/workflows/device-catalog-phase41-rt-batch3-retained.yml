name: Device catalog Phase 4.1 R/T batch3 retained evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  retain-stm32f4-rt-batch3:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/device-catalog-phase4.1-rt-admission-batch3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate ST browser readiness contracts
        run: |
          python data/device-catalog/research/test_st_browser_acquisition.py
          python data/device-catalog/research/test_st_browser_readiness_retry.py
      - name: Install browser acquisition dependencies
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium
      - name: Acquire baseline-locked official ST evidence
        env:
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
        run: |
          xvfb-run -a python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path('data/device-catalog/research')
          work = Path('phase41-rt-batch3-work')
          retained = Path('phase41-stm32f4-rt-batch3-retained')
          work.mkdir(parents=True, exist_ok=True)
          sys.path.insert(0, str(root))

          from device_catalog_evidence_framework import build_manifest
          from evaluate_stm32f4_pilot import evaluate_live_pilot, read_baseline
          from retain_stm32f4_browser_evidence import RETAINED_FILES, retain
          from st_browser_acquisition import (
              BROWSER_TRANSPORT,
              CHROMIUM_LAUNCH_ARGS,
              STBrowserAcquirer,
              build_browser_evidence_record,
          )
          from stm32f4_acquisition_pilot import pilot_is_clean, read_catalog, read_manifest, run_pilot
          from validate_stm32f4_retained_evidence import validate_retained_evidence

          manifest_path = root / 'stm32f4-phase4.1-rt-admission-batch3-manifest.json'
          baseline_path = root / 'stm32f4-phase4.1-rt-admission-batch3-baseline.json'
          catalog_path = root / 'openocd-parts-canonical.csv'
          pilot_id, targets = read_manifest(manifest_path)
          baseline = read_baseline(baseline_path)
          if baseline['pilot_id'] != pilot_id:
              raise SystemExit('manifest/baseline pilot_id mismatch')
          catalog_rows = read_catalog(catalog_path)

          def run_once(selected_targets):
              with STBrowserAcquirer(headless=False) as acquirer:
                  summary = run_pilot(
                      pilot_id=pilot_id,
                      targets=selected_targets,
                      catalog_rows=catalog_rows,
                      fetcher=acquirer.fetch,
                      evidence_builder=build_browser_evidence_record,
                      timeout_seconds=45.0,
                  )
                  version = acquirer.browser_version
              return summary, version

          control, control_version = run_once(targets[:1])
          if not pilot_is_clean(control):
              raise SystemExit('lifecycle control acquisition is not clean')

          attempt_outcomes = []
          pilot = None
          pilot_version = None
          for attempt in range(1, 3):
              pilot, pilot_version = run_once(targets)
              failed_targets = [
                  {'base_device': result.get('base_device'), 'error': result.get('error')}
                  for result in pilot.get('results', [])
                  if result.get('acquisition_status') != 'success'
              ]
              outcome = {
                  'attempt': attempt,
                  'clean': pilot_is_clean(pilot),
                  'acquisition_success': pilot.get('acquisition_success'),
                  'acquisition_failure': pilot.get('acquisition_failure'),
                  'failed_targets': failed_targets,
              }
              attempt_outcomes.append(outcome)
              print(json.dumps(outcome, indent=2, sort_keys=True))
              if pilot_is_clean(pilot):
                  break
              if attempt == 1:
                  print('Transient live acquisition failure; retrying the whole bounded batch with a fresh browser.')

          if pilot is None or pilot_version is None or not pilot_is_clean(pilot):
              raise SystemExit('baseline-locked live acquisition remains dirty after one whole-batch retry')
          if control_version != pilot_version:
              raise SystemExit('control/pilot Chromium version mismatch')

          runtime = {
              'engine': 'chromium',
              'browser_version': pilot_version,
              'playwright_requirement': '1.62.0',
              'headless': False,
              'launch_args': CHROMIUM_LAUNCH_ARGS,
          }
          for summary, scope in ((control, 'control'), (pilot, 'pilot')):
              summary['acquisition_transport'] = BROWSER_TRANSPORT
              summary['browser_scope'] = scope
              summary['browser_runtime'] = runtime
              summary['canonical_dataset_admission'] = False
          pilot['live_acquisition_attempts'] = len(attempt_outcomes)
          pilot['live_acquisition_attempt_outcomes'] = attempt_outcomes

          run_metadata = {
              'repository': 'physicslu/plasma',
              'git_sha': os.environ['EVIDENCE_HEAD_SHA'],
          }
          evaluation = evaluate_live_pilot(
              summary=pilot,
              baseline=baseline,
              run_metadata=run_metadata,
          )
          if not evaluation['scale_ready']:
              raise SystemExit('baseline-locked evidence evaluation is blocked: ' + json.dumps(evaluation['issues']))

          control_path = work / 'control-summary.json'
          pilot_path = work / 'pilot-summary.json'
          evaluation_path = work / 'evaluation.json'
          control_path.write_text(json.dumps(control, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          pilot_path.write_text(json.dumps(pilot, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          evaluation_path.write_text(json.dumps(evaluation, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          report = retain(
              control_path=control_path,
              pilot_path=pilot_path,
              evaluation_path=evaluation_path,
              baseline_path=baseline_path,
              output_dir=retained,
          )

          provenance_path = retained / 'provenance.json'
          provenance = json.loads(provenance_path.read_text(encoding='utf-8'))
          provenance['workflow_run_id'] = os.environ['EVIDENCE_RUN_ID']
          provenance['locked_discovery_source'] = {
              'workflow_run_id': baseline['source_workflow_run_id'],
              'artifact_id': baseline['source_artifact_id'],
              'artifact_sha256': baseline['source_artifact_sha256'],
          }
          provenance['live_acquisition_attempts'] = len(attempt_outcomes)
          provenance['live_acquisition_attempt_outcomes'] = attempt_outcomes
          excluded = []
          for result in pilot['results']:
              evidence = result['evidence']
              excluded.extend(
                  {'base_device': result['base_device'], **item}
                  for item in evidence.get('excluded_non_active_part_numbers', [])
              )
          provenance['excluded_non_active_observations'] = excluded
          provenance_path.write_text(json.dumps(provenance, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          admission_candidates = sum(
              len(target['exact_icpns'])
              for target in baseline['targets']
              if target['role'] == 'candidate'
          )
          (retained / 'README.md').write_text(
              '# Retained STM32F4 Phase 4.1 R/T batch3 browser evidence\n\n'
              f"Evidence ID: `{provenance['evidence_id']}`\n\n"
              f"- targets: {report['targets']}\n"
              f"- exact ICPN observations including lifecycle control: {report['exact_icpn_candidates']}\n"
              f'- new admission candidates: {admission_candidates}\n'
              f'- excluded non-Active observations: {len(excluded)} (audit-only)\n'
              '- mapping: deterministic OpenOCD ordering patterns\n'
              '- acquisition transport: `chromium_rendered_dom`\n'
              '- canonical dataset admission: false\n',
              encoding='utf-8',
          )
          retained_manifest = build_manifest(
              retained,
              evidence_id=provenance['evidence_id'],
              retained_files=RETAINED_FILES,
          )
          (retained / 'manifest.json').write_text(
              json.dumps(retained_manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          final_report = validate_retained_evidence(retained, baseline_path=baseline_path)
          print(json.dumps(final_report, indent=2, sort_keys=True))
          print(json.dumps({
              'evidence_id': provenance['evidence_id'],
              'live_acquisition_attempts': len(attempt_outcomes),
              'excluded_non_active_observations': excluded,
          }, indent=2, sort_keys=True))
          PY
      - name: Upload retained evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase41-stm32f4-rt-batch3-retained
          path: phase41-stm32f4-rt-batch3-retained
          if-no-files-found: error
          retention-days: 30
