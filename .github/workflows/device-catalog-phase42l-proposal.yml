name: Device catalog Phase 4.2L STM32F427/429 I-pin admission proposal

on:
  push:
    branches:
      - agent/device-catalog-phase4.2l-next-admission
    paths:
      - ".github/workflows/device-catalog-phase42l-proposal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propose:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-phase4.2l-next-admission
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify clean admission plan
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase42l
          PYTHONPATH=data/device-catalog/research python \
            data/device-catalog/research/stm32f4_admission.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2l-f427-f429-i-admission-live-2026-09-03 \
            --baseline data/device-catalog/research/stm32f4-phase4.2l-f427-f429-i-admission-baseline.json \
            --admit-base STM32F427IG \
            --admit-base STM32F427II \
            --admit-base STM32F429IE \
            --admit-base STM32F429IG \
            --admit-base STM32F429II \
            --output /tmp/phase42l/admission-plan.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path('/tmp/phase42l/admission-plan.json').read_text())
          expected = {
              'STM32F427IGH6', 'STM32F427IGH6TR', 'STM32F427IGH7', 'STM32F427IGT6',
              'STM32F427IIH6', 'STM32F427IIH6TR', 'STM32F427IIH7', 'STM32F427IIT6', 'STM32F427IIT7',
              'STM32F429IEH6', 'STM32F429IET6',
              'STM32F429IGH6', 'STM32F429IGT6',
              'STM32F429IIH6', 'STM32F429IIH6TR', 'STM32F429IIT6',
          }
          observed = {item['icpn'] for item in plan['candidates']}
          counts = plan['decision_counts']
          if observed != expected:
              raise SystemExit({'candidate_set_mismatch': sorted(observed ^ expected)})
          if plan['candidate_count'] != 16 or counts != {
              'admit': 16, 'already_present': 0, 'manual_review_required': 0, 'reject': 0,
          } or plan['conflicts'] != 0 or plan['canonical_rows_before'] != 226:
              raise SystemExit({'unexpected_plan': counts, 'conflicts': plan['conflicts']})
          PY
      - name: Hash proposal
        run: |
          cd /tmp/phase42l
          sha256sum admission-plan.json | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: phase42l-stm32f427-f429-i-admission-proposal
          path: /tmp/phase42l
          if-no-files-found: error
          retention-days: 30
