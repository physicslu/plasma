name: Device catalog Phase 4.1 R/T batch2 runtime contract fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-runtime-contract:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/device-catalog-phase4.1-rt-admission-batch2-retained'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update production runtime and REST catalog contract
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog_test = Path('software/python/tests/test_device_catalog.py')
          text = catalog_test.read_text(encoding='utf-8')

          marker = 'from plasma_web.device_catalog import DeviceCatalog, get_default_device_catalog\n\n\n'
          constants = (
              'from plasma_web.device_catalog import DeviceCatalog, get_default_device_catalog\n\n\n'
              'EXPECTED_PRODUCTION_CATALOG_SIZE = 250\n'
              'EXPECTED_STM32F4_CATALOG_SIZE = 175\n\n\n'
          )
          if 'EXPECTED_PRODUCTION_CATALOG_SIZE = 250' not in text:
              if marker not in text:
                  raise SystemExit('catalog test import marker missing')
              text = text.replace(marker, constants, 1)

          replacements = {
              'def test_checked_in_production_catalog_contains_only_233_admitted_exact_icpns() -> None:':
                  'def test_checked_in_production_catalog_contains_only_current_admitted_exact_icpns() -> None:',
              '    assert catalog.size == 233\n':
                  '    assert catalog.size == EXPECTED_PRODUCTION_CATALOG_SIZE\n',
              '    assert metadata["catalog_size"] == 233\n':
                  '    assert metadata["catalog_size"] == EXPECTED_PRODUCTION_CATALOG_SIZE\n',
              '            "count": 233,\n':
                  '            "count": EXPECTED_PRODUCTION_CATALOG_SIZE,\n',
              '                {"family": "STM32F4", "count": 158},\n':
                  '                {"family": "STM32F4", "count": EXPECTED_STM32F4_CATALOG_SIZE},\n',
              '    # Search results remain capped at 100 while metadata proves the full 158-row F4 family.\n':
                  '    # Search results remain capped at 100 while metadata proves the full 175-row F4 family.\n',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'catalog test replacement count={count}: {old!r}')
              text = text.replace(old, new, 1)

          anchor = '    foundation_batch11 = catalog.search("stm32f479zit6", limit=1)[0]\n'
          addition = anchor + '    rt_batch2 = catalog.search("stm32f405rgt7tr", limit=1)[0]\n'
          if 'rt_batch2 = catalog.search("stm32f405rgt7tr"' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('catalog Batch11 search anchor missing')
              text = text.replace(anchor, addition, 1)

          assertion_anchor = (
              '    assert foundation_batch11.target_config == "tcl/target/stm32f4x.cfg"\n'
          )
          assertion_addition = assertion_anchor + (
              '    assert rt_batch2.identifier == "STM32F405RGT7TR"\n'
              '    assert rt_batch2.family == "STM32F4"\n'
              '    assert rt_batch2.target_config == "tcl/target/stm32f4x.cfg"\n'
          )
          if 'assert rt_batch2.identifier == "STM32F405RGT7TR"' not in text:
              if text.count(assertion_anchor) != 1:
                  raise SystemExit('catalog Batch11 assertion anchor missing')
              text = text.replace(assertion_anchor, assertion_addition, 1)
          catalog_test.write_text(text, encoding='utf-8')

          gateway_test = Path('software/python/tests/test_device_catalog_web_gateway.py')
          text = gateway_test.read_text(encoding='utf-8')
          import_marker = 'from plasma_web.gateway import PlasmaWebHandler\n\n\n'
          gateway_constants = (
              'from plasma_web.gateway import PlasmaWebHandler\n\n\n'
              'EXPECTED_PRODUCTION_CATALOG_SIZE = 250\n\n\n'
          )
          if 'EXPECTED_PRODUCTION_CATALOG_SIZE = 250' not in text:
              if import_marker not in text:
                  raise SystemExit('gateway test import marker missing')
              text = text.replace(import_marker, gateway_constants, 1)

          old = 'self.assertEqual(payload["catalog_size"], 233)'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected 3 gateway catalog_size=233 assertions, got {count}')
          text = text.replace(old, 'self.assertEqual(payload["catalog_size"], EXPECTED_PRODUCTION_CATALOG_SIZE)')

          method_anchor = '    def test_research_only_identifier_is_not_exposed_by_production_search(self) -> None:\n'
          new_method = '''    def test_phase41_rt_batch2_icpn_is_exposed_after_admission(self) -> None:\n        status, payload = self.request("/api/devices/search?q=STM32F405RGT7TR&limit=5")\n        self.assertEqual(status, 200)\n        self.assertEqual(payload["catalog_size"], EXPECTED_PRODUCTION_CATALOG_SIZE)\n        self.assertEqual(payload["count"], 1)\n        result = payload["results"][0]\n        self.assertEqual(result["icpn"], "STM32F405RGT7TR")\n        self.assertEqual(result["family"], "STM32F4")\n        self.assertEqual(result["backend"]["target_config"], "tcl/target/stm32f4x.cfg")\n\n'''
          if 'def test_phase41_rt_batch2_icpn_is_exposed_after_admission' not in text:
              if text.count(method_anchor) != 1:
                  raise SystemExit('gateway method anchor missing')
              text = text.replace(method_anchor, new_method + method_anchor, 1)
          gateway_test.write_text(text, encoding='utf-8')
          PY
          git diff --check
          python -m pip install -e './software/python[dev]'
          python -m pytest -q \
            software/python/tests/test_device_catalog.py \
            software/python/tests/test_device_catalog_web_gateway.py
      - name: Commit tested runtime and REST contract update
        run: |
          set -euo pipefail
          git config user.name 'Gordon'
          git config user.email 'physicslu@gmail.com'
          git add \
            software/python/tests/test_device_catalog.py \
            software/python/tests/test_device_catalog_web_gateway.py
          git diff --cached --check
          git commit -m 'device-catalog: update runtime contract for 250 ICPNs'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
