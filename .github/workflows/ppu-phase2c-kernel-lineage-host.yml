name: PPU Phase 2C Z2 Kernel Source Lineage Host-only
on:
  pull_request:
    paths:
      - 'pl/tools/runtime_fpga_kernel_lineage.py'
      - 'pl/tests/test_runtime_fpga_kernel_lineage.py'
      - 'pl/verification/z2_kernel_source_reference_v1.json'
      - 'pl/tools/runtime_fpga_m1_gate.py'
      - 'pl/tests/test_runtime_fpga_m1_gate.py'
      - '.github/workflows/ppu-phase2c-kernel-lineage-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test runner
        run: python -m pip install pytest
      - name: Test pinned reference lineage, adversarial cases, M1 and Phase-1 contracts
        run: python -m pytest -q pl/tests/test_runtime_fpga_kernel_lineage.py pl/tests/test_runtime_fpga_m1_gate.py pl/tests/test_runtime_fpga_phase1.py
      - name: Produce non-authorizing reference-only result
        run: python -m pl.tools.runtime_fpga_kernel_lineage --manifest pl/verification/z2_kernel_source_reference_v1.json
