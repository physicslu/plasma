name: Device catalog Phase 4.2AC STM32F410 x8 admission proposal
on:
  push:
    branches: [agent/device-catalog-phase4.2ac-f410-x8-admission]
    paths: [".github/workflows/device-catalog-phase42ac-proposal.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  propose:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2ac-f410-x8-admission}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build proposal
        run: |
          mkdir -p /tmp/phase42ac
          PYTHONPATH=data/device-catalog/research python data/device-catalog/research/stm32f4_admission.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2ac-f410-x8-admission-live-2026-09-05 \
            --baseline data/device-catalog/research/stm32f4-phase4.2ac-f410-x8-admission-baseline.json \
            --admit-base STM32F410C8 --admit-base STM32F410T8 \
            --output /tmp/phase42ac/admission-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/phase42ac/admission-plan.json').read_text())
          expected={'admit':5,'already_present':0,'manual_review_required':0,'reject':0}
          expected_icpns={'STM32F410C8U6','STM32F410C8U6TR','STM32F410C8U7','STM32F410C8U7TR','STM32F410T8Y6TR'}
          if p['candidate_count'] != 5 or p['decision_counts'] != expected or p['conflicts'] != 0 or p['canonical_rows_before'] != 352:
              raise SystemExit('unclean Phase 4.2AC plan')
          if {x['icpn'] for x in p['candidates']} != expected_icpns:
              raise SystemExit('unexpected Phase 4.2AC candidate set')
          PY
          cd /tmp/phase42ac && sha256sum admission-plan.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: {name: phase42ac-f410-x8-admission-proposal, path: /tmp/phase42ac, if-no-files-found: error, retention-days: 30}
