name: Device catalog Phase 4.0 retained admission proof

on:
  pull_request:

permissions:
  contents: write

jobs:
  prove-f446-admission:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/device-catalog-phase4.0-stm32f446-expansion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frozen F446 retained evidence
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.0-f446-batch1-live-2026-08-30 \
            --baseline data/device-catalog/research/stm32f4-phase4.0-f446-batch1-baseline.json
      - name: Build admission plan from frozen retained evidence
        run: |
          mkdir -p phase40-output
          python data/device-catalog/research/stm32f4_admission.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.0-f446-batch1-live-2026-08-30 \
            --baseline data/device-catalog/research/stm32f4-phase4.0-f446-batch1-baseline.json \
            --catalog data/device-catalog/research/openocd-parts-canonical.csv \
            --canonical data/device-catalog/research/stm32f4-commercial-icpn.csv \
            --admit-base STM32F446VC \
            --admit-base STM32F446VE \
            --admit-base STM32F446ZC \
            --admit-base STM32F446ZE \
            --output phase40-output/admission-plan.json
      - name: Materialize or verify canonical F446 rows
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path('data/device-catalog/research')
          sys.path.insert(0, str(root))
          from device_catalog_admission_framework import write_canonical_dataset

          canonical = root / 'stm32f4-commercial-icpn.csv'
          plan = json.loads(Path('phase40-output/admission-plan.json').read_text(encoding='utf-8'))
          counts = plan['decision_counts']
          if plan['candidate_count'] != 23 or plan['conflicts'] != 0 or plan['issues'] != []:
              raise SystemExit(f'F446 plan is not clean: {plan!r}')

          if counts == {'admit': 23, 'already_present': 0, 'manual_review_required': 0, 'reject': 0}:
              result = write_canonical_dataset(plan=plan, canonical_path=canonical)
              if result['status'] != 'written' or result['rows_before'] != 49 or result['rows_after'] != 72:
                  raise SystemExit(f'unexpected first materialization: {result!r}')
          elif counts == {'admit': 0, 'already_present': 23, 'manual_review_required': 0, 'reject': 0}:
              with canonical.open(newline='', encoding='utf-8') as handle:
                  rows = list(csv.DictReader(handle))
              if len(rows) != 72:
                  raise SystemExit(f'expected 72 canonical rows, got {len(rows)}')
              result = {'status': 'no_op', 'rows_before': 72, 'rows_after': 72, 'added': []}
          else:
              raise SystemExit(f'unexpected F446 decisions: {counts!r}')

          payload = canonical.read_bytes()
          sha256 = hashlib.sha256(payload).hexdigest()
          if sha256 != '9ccab9f4de5c447410b2d649ce933fddcc569746431bf9cb0431fa8246676308':
              raise SystemExit(f'canonical SHA-256 drift: {sha256}')
          blob_sha = subprocess.check_output(['git', 'hash-object', str(canonical)], text=True).strip()

          manifest_path = Path('data/device-catalog/production/icpn-v1-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          f4 = next(item for item in manifest['sources'] if item['family'] == 'STM32F4')
          f4['row_count'] = 72
          f4['git_blob_sha'] = blob_sha
          f4['sha256'] = sha256
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          Path('phase40-output/canonical-output.json').write_text(
              json.dumps({
                  'status': result['status'],
                  'rows_before': result['rows_before'],
                  'rows_after': result['rows_after'],
                  'sha256': sha256,
                  'git_blob_sha': blob_sha,
                  'decision_counts': counts,
              }, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          Path('phase40-output/stm32f4-commercial-icpn.csv').write_bytes(payload)
          PY
          python data/device-catalog/research/validate_stm32f4_commercial_icpn.py
          PYTHONPATH=software/python python -m plasma_web.device_catalog \
            --manifest data/device-catalog/production/icpn-v1-manifest.json \
            --json
      - name: Publish exact canonical bytes and production manifest
        run: |
          if git diff --quiet -- data/device-catalog/research/stm32f4-commercial-icpn.csv data/device-catalog/production/icpn-v1-manifest.json; then
            echo 'F446 canonical and manifest already published; no-op.'
            exit 0
          fi
          git config user.name 'Plasma Device Catalog CI'
          git config user.email 'actions@users.noreply.github.com'
          git add data/device-catalog/research/stm32f4-commercial-icpn.csv data/device-catalog/production/icpn-v1-manifest.json
          git commit -m 'device-catalog: admit 23 STM32F446 exact ICPNs'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload deterministic Phase 4 output
        uses: actions/upload-artifact@v4
        with:
          name: phase40-f446-frozen-admission
          path: phase40-output
          if-no-files-found: error
          retention-days: 7
