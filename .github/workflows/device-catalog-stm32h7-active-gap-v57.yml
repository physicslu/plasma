name: STM32H7 active gap metadata replay v5.7

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/st-stm32h7-active-gap-v5.7.txt'
      - 'data/device-catalog/research/stm32h7-active-gap-lock-v5.7.json'
      - 'data/device-catalog/research/stm32h7-active-gap-ordering-authority-v5.7.json'
      - 'data/device-catalog/research/analyze_stm32h7_active_gap_v57.py'
      - 'data/device-catalog/research/test_analyze_stm32h7_active_gap_v57.py'
      - 'data/device-catalog/research/STM32H7_ACTIVE_GAP_METADATA_REPLAY_V57.md'
      - '.github/workflows/device-catalog-stm32h7-active-gap-v57.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate STM32H7 14-row Active delta metadata
        run: |
          python data/device-catalog/research/analyze_stm32h7_active_gap_v57.py
          python -m unittest discover -s data/device-catalog/research \
            -p test_analyze_stm32h7_active_gap_v57.py -v
