name: ST official MX1 and MX2 structural source boundary validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/sources/st-open-pin-mcu-tree-7d1f1514.tsv'
      - 'data/device-catalog/research/sources/st-c5-dfp-pinout-tree-a5f65bc6.tsv'
      - 'data/device-catalog/research/st-multisource-structural-coverage-v0.4.json'
      - 'data/device-catalog/research/validate_st_multisource_structure.py'
      - 'data/device-catalog/research/ST_COVERAGE_GAP_MULTI_SOURCE_2026-09-29.md'
      - 'data/device-catalog/research/ST_COVERAGE_GAP_EXPORT_RUNBOOK_2026-09-29.md'
      - '.github/workflows/device-catalog-st-multisource-structure-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/device-catalog/research/sources/st-open-pin-mcu-tree-7d1f1514.tsv'
      - 'data/device-catalog/research/sources/st-c5-dfp-pinout-tree-a5f65bc6.tsv'
      - 'data/device-catalog/research/st-multisource-structural-coverage-v0.4.json'
      - 'data/device-catalog/research/validate_st_multisource_structure.py'
      - 'data/device-catalog/research/ST_COVERAGE_GAP_MULTI_SOURCE_2026-09-29.md'
      - 'data/device-catalog/research/ST_COVERAGE_GAP_EXPORT_RUNBOOK_2026-09-29.md'
      - '.github/workflows/device-catalog-st-multisource-structure-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay cryptographically pinned official MX1 XML / MX2 C5 JSON structural sources
        run: python data/device-catalog/research/validate_st_multisource_structure.py
