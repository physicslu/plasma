name: Agent Programming Job Refactor

on:
  push:
    branches:
      - agent/fix-emode-programming-job-structure
    paths:
      - .github/workflows/agent-programming-job-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-emode-programming-job-structure

      - name: Replace mode-local Programming Job markup
        run: |
          python - <<'PY'
          from pathlib import Path

          pmod_path = Path("software/web/app/fleet/factory-console-v2.tsx")
          pmod = pmod_path.read_text(encoding="utf-8")
          pmod_import = 'import { BatchSummary } from "../operator-ui/batch-summary";\n'
          if 'programming-job-panel' not in pmod:
              pmod = pmod.replace(
                  pmod_import,
                  pmod_import + 'import { ProgrammingJobPanel } from "../operator-ui/programming-job-panel";\n',
                  1,
              )
          pmod_start_marker = '''            <OperatorPanel
              number={2}
              title={text.programmingJob}'''
          pmod_start = pmod.index(pmod_start_marker)
          pmod_close = '''
            </OperatorPanel>'''
          pmod_end = pmod.index(pmod_close, pmod_start) + len(pmod_close)
          pmod_shared = '''            <ProgrammingJobPanel
              mode="production"
              title={text.programmingJob}
              collapsed={programmingJobCollapsed}
              onToggleCollapsed={() => setProgrammingJobCollapsed(current => !current)}
              expandLabel={text.showSelection}
              collapseLabel={text.hideSelection}
              apiBase={apiBase}
              targetDevice={targetDevice}
              onTargetChange={setTargetDevice}
              targetDisabled={batchRunning}
              targetLabel={text.targetIc}
              imageLabel={text.image}
              image={{
                name: imageAsset?.name ?? (requiresImage && syntheticMockImageAvailable ? "Mock Synthetic Image" : "Select programming image (.bin)…"),
                title: imageAsset?.name,
                source: imageAsset ? "user" : requiresImage && syntheticMockImageAvailable ? "mock_synthetic" : "none",
                hint: text.imageHint,
                browseLabel: text.browse,
                browseDisabled: batchRunning,
                inputDisabled: batchRunning,
                inputAriaLabel: "Production Programming Image file",
                inputRef: imageInputRef,
                onBrowse: () => imageInputRef.current?.click(),
                onFileChange: (file, event) => {
                  if (file && file.size > MAX_IMAGE_BYTES) {
                    setOperatorWarning(text.imageTooLarge);
                    setImageAsset(null);
                    event.currentTarget.value = "";
                    return;
                  }
                  setImageAsset(file);
                  if (file) appendLog(`[IMG] SELECTED · ${file.name} · ${file.size} bytes`);
                },
              }}
              operationsLabel={text.operations}
              operations={operationOrder.map(operation => ({
                key: operation,
                code: operationCodes[operation],
                label: t(`operation.${operation}`),
                checked: selectedOperations.includes(operation),
                disabled: batchRunning,
                onChange: () => toggleOperation(operation),
              }))}
              policyLabel={text.batchPolicy}
              policy={{
                repeatLabel: text.repeat,
                repeatValue: repeatCount,
                repeatDisabled: batchRunning,
                repeatAriaLabel: "Repeat Count",
                onRepeatChange: setRepeatCount,
                retryLabel: text.retry,
                retryValue: siteRetryLimit,
                retryDisabled: batchRunning,
                retryAriaLabel: "Site Retry Limit",
                onRetryChange: setSiteRetryLimit,
                stopLabel: text.stopPolicy,
                stopValue: failedSiteThreshold,
                stopDisabled: batchRunning || !batchCounts.sites,
                stopAriaLabel: "Stop Policy",
                stopOptions: [
                  { value: "", label: text.never },
                  ...Array.from({ length: batchCounts.sites }, (_, index) => index + 1).map(value => ({ value: String(value), label: `${value} Fail` })),
                ],
                onStopChange: setFailedSiteThreshold,
              }}
              startLabel={text.start}
              startDisabled={!batchReadiness.ready || !policyValid}
              onStart={executeBatch}
              statusLabel={text.batchStatus}
              statusValue={batchStatusLabel}
              statusClassName={`state-${batchStatusState}`}
              abortLabel={text.abort}
              abortDisabled={!serverBatchRunning || serverBatchState === "stopping" || batchAborting}
              onAbort={abortBatch}
            />'''
          pmod = pmod[:pmod_start] + pmod_shared + pmod[pmod_end:]
          pmod_path.write_text(pmod, encoding="utf-8")

          emode_path = Path("software/web/app/engineering/programming-workspace-v2.tsx")
          emode = emode_path.read_text(encoding="utf-8")
          emode_import = 'import { BatchSummary } from "../operator-ui/batch-summary";\n'
          if 'programming-job-panel' not in emode:
              emode = emode.replace(
                  emode_import,
                  emode_import + 'import { ProgrammingJobPanel } from "../operator-ui/programming-job-panel";\n',
                  1,
              )
          emode_start_marker = '''            <section className={`productionProgrammingCard programmingJobCard unifiedBatchControlStack ${programmingJobCollapsed ? "is-collapsed" : ""}`} data-dashboard-mode="engineering">'''
          emode_start = emode.index(emode_start_marker)
          emode_close = '''
            </section>'''
          emode_end = emode.index(emode_close, emode_start) + len(emode_close)
          emode_shared = '''            <ProgrammingJobPanel
              mode="engineering"
              title="PROGRAMMING JOB"
              collapsed={programmingJobCollapsed}
              onToggleCollapsed={() => setProgrammingJobCollapsed(current => !current)}
              expandLabel={locale === "zh-TW" ? "展開" : "Show"}
              collapseLabel={locale === "zh-TW" ? "收合" : "Hide"}
              apiBase={apiBase}
              targetDevice={targetDevice}
              onTargetChange={selectTargetDevice}
              targetDisabled={targetLocked}
              targetPlaceholder="Search ICPN / IC identifier..."
              targetLabel="Target IC"
              imageLabel="Programming Image"
              image={{
                name: displayedImageName,
                title: displayedImageName,
                source: imageAsset ? "user" : batchSnapshot?.asset ? "batch_snapshot" : requiresImage && syntheticMockImageAvailable ? "mock_synthetic" : "none",
                hint: syntheticMockImageAvailable ? syntheticImageHint : "Binary Programming Image (.bin).",
                browseLabel: "Browse...",
                browseDisabled: targetLocked,
                inputDisabled: targetLocked,
                inputAriaLabel: "Engineering Programming Image Asset file",
                inputRef: imageInputRef,
                onBrowse: () => imageInputRef.current?.click(),
                onFileChange: file => selectImageAsset(file),
              }}
              operationsLabel="Operations"
              operations={operationOrder.map(operation => ({
                key: operation,
                code: operationCodes[operation],
                label: t(`operation.${operation}`),
                checked: selectedOperations.includes(operation),
                disabled: batchRunning,
                ariaLabel: `Engineering batch ${operation}`,
                onChange: () => toggleOperation(operation),
              }))}
              policyLabel="Batch Policy"
              policy={{
                repeatLabel: "Repeat",
                repeatValue: repeatCount,
                repeatDisabled: batchRunning,
                repeatAriaLabel: "Repeat Count",
                onRepeatChange: setRepeatCount,
                retryLabel: "Retry",
                retryValue: siteRetryLimit,
                retryDisabled: batchRunning,
                retryAriaLabel: "Site Retry Limit",
                onRetryChange: setSiteRetryLimit,
                stopLabel: "Stop Policy",
                stopValue: stopPolicyValue,
                stopDisabled: batchRunning,
                stopAriaLabel: "Engineering Stop Policy",
                stopOptions: [
                  { value: "never", label: "Never" },
                  ...selectedSiteIds.map((_, index) => ({ value: String(index + 1), label: `${index + 1} Fail` })),
                ],
                onStopChange: value => setStopPolicy(value === "never" ? { kind: "never" } : { kind: "failed_sites", threshold: Number(value) }),
              }}
              compatibilityFields={selectedOperations.includes("read") ? (
                <div className="engineeringReadRow">
                  <label>Offset:<input aria-label="Engineering READ offset" type="number" min="0" step="1" value={readOffset} disabled={batchRunning} onChange={event => setReadOffset(event.target.value)} /></label>
                  <label>Length:<input aria-label="Engineering READ length" type="number" min="1" step="1" value={readLength} disabled={batchRunning} onChange={event => setReadLength(event.target.value)} /></label>
                </div>
              ) : null}
              startLabel="START PROGRAMMING"
              startDisabled={!batchReadiness.ready || !policyValid}
              onStart={runBatch}
              statusLabel="BATCH STATUS"
              statusValue={batchRunning && batchObservationState === "reconnecting" ? "RECONNECTING" : batchReadiness.label}
              statusClassName={`readiness-${batchReadiness.code}`}
              abortLabel="ABORT"
              abortDisabled={!batchRunning || batchCancelling || !batchSnapshot}
              onAbort={cancelBatch}
            />

            {operatorWarning && <div className="warning engineeringOperationWarning" role="alert"><span>{operatorWarning}</span><button type="button" aria-label={dismissWarning} onClick={() => setOperatorWarning(null)}>×</button></div>}
            {engineeringBatch.error && batchObservationState === "reconnecting" && <div className="warning engineeringOperationWarning" role="status">{engineeringBatch.error}</div>}
            {imageAsset && imageAsset.size > MAX_IMAGE_ASSET_BYTES && <div className="warning">{t("engineeringProgramming.imageAssetTooLarge")}</div>}'''
          emode = emode[:emode_start] + emode_shared + emode[emode_end:]
          emode_path.write_text(emode, encoding="utf-8")
          PY

      - name: Commit refactor
        run: |
          git config user.name "plasma-agent"
          git config user.email "plasma-agent@users.noreply.github.com"
          git add software/web/app/fleet/factory-console-v2.tsx software/web/app/engineering/programming-workspace-v2.tsx
          git diff --cached --check
          git commit -m "Use shared Programming Job panel in PMode and EMode"
          git push origin HEAD:agent/fix-emode-programming-job-structure
