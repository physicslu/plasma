name: Device catalog Phase 4.0 gap discovery

on:
  push:
    branches:
      - agent/device-catalog-phase4.0-gap-batch3

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Print remaining STM32F4 coverage gaps
        run: python data/device-catalog/research/stm32f4_coverage_gap_inventory.py --compact
