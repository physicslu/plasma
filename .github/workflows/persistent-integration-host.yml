name: Persistent integration host acceptance

on:
  workflow_dispatch:

concurrency:
  group: persistent-integration-host
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  persistent-acceptance:
    runs-on: [self-hosted, linux, x64, plasma-integration]
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Assert persistent integration-host contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          command -v docker >/dev/null
          command -v ip >/dev/null
          command -v python3 >/dev/null
          command -v node >/dev/null
          command -v npm >/dev/null

          echo "git_sha=$(git rev-parse HEAD)"
          echo "uid=$(id -u) gid=$(id -g)"
          echo "kernel=$(uname -srmo)"
          echo "docker_server=$(docker version --format '{{.Server.Version}}')"
          echo "docker_security=$(docker info --format '{{json .SecurityOptions}}')"
          echo "node=$(node --version)"
          echo "python=$(python3 --version 2>&1)"
          echo "default_route=$(ip route show default | tr '\n' ';')"
          if [[ -r /etc/os-release ]]; then
            grep -E '^(NAME|VERSION|ID|VERSION_ID)=' /etc/os-release || true
          fi

      - name: Set up repository validation dependencies
        shell: bash
        run: bash scripts/codex-cloud-setup.sh

      - name: Run canonical source and configuration validation
        shell: bash
        run: bash scripts/codex-cloud-test.sh

      - name: Verify provisioned ARMv7 execution boundary
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --platform linux/arm/v7 \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            arm32v7/python@sha256:45eb5cbc14fe248e7598eb23a5a61424d44e556aed3efa955dfab2ac9a67d91c \
            python3 -c 'import platform; assert platform.machine().startswith("arm")'

      - name: Build and clean-extract packaged PPU runtime
        shell: bash
        run: |
          set -euo pipefail
          python="software/python/.venv/bin/python"
          runtime="$RUNNER_TEMP/plasma-persistent-ppu-runtime"
          output="$RUNNER_TEMP/plasma-persistent-ppu-release"
          verify="$RUNNER_TEMP/plasma-persistent-ppu-verify"
          sha="$(git rev-parse HEAD)"
          version="$($python -c 'import json; print(json.load(open("release/product.json"))["product_version"])')"

          rm -rf "$runtime" "$output" "$verify"
          "$python" scripts/ppu-runtime.py build --output-dir "$runtime"
          "$python" scripts/ppu-runtime.py validate "$runtime"
          "$python" scripts/ppu-release.py \
            --runtime-dir "$runtime" \
            --output-dir "$output" \
            --git-sha "$sha"

          archive="$output/plasma-ppu-$version-linux-armv7l.tar.gz"
          "$python" scripts/product-release.py verify \
            "$archive" \
            --expect-role ppu \
            --expect-platform linux \
            --expect-architecture armv7l \
            --expect-version "$version" \
            --extract-to "$verify"
          "$python" scripts/ppu-runtime.py validate "$verify/plasma-release/runtime"
          echo "PLASMA_PERSISTENT_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Capture persistent integration environment fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python="software/python/.venv/bin/python"
          persistent_root="${PLASMA_PERSISTENT_CI_ROOT:-$HOME/.local/state/plasma-ci}"
          "$python" scripts/ci-environment-fingerprint.py \
            --artifact "$PLASMA_PERSISTENT_ARCHIVE" \
            --work-dir "$persistent_root" \
            --report "$RUNNER_TEMP/plasma-persistent-environment-fingerprint.json"

      - name: Run persistent same-workdir repeatability and privilege-parity gate
        shell: bash
        run: |
          set -euo pipefail
          python="software/python/.venv/bin/python"
          persistent_root="${PLASMA_PERSISTENT_CI_ROOT:-$HOME/.local/state/plasma-ci}"
          work="$persistent_root/static-ipv4-fault-injection"
          report="$RUNNER_TEMP/plasma-static-ipv4-persistent-repeatability.json"

          mkdir -p "$persistent_root"
          "$python" scripts/static-ipv4-fault-injection-repeatability.py \
            --runtime-dir "$RUNNER_TEMP/plasma-persistent-ppu-verify/plasma-release/runtime" \
            --work-dir "$work" \
            --report "$report"

      - name: Upload persistent-host acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plasma-persistent-integration-${{ github.sha }}
          path: |
            ${{ runner.temp }}/plasma-persistent-environment-fingerprint.json
            ${{ runner.temp }}/plasma-static-ipv4-persistent-repeatability.json
            ${{ runner.temp }}/plasma-static-ipv4-persistent-repeatability-run1.json
            ${{ runner.temp }}/plasma-static-ipv4-persistent-repeatability-run2.json
          if-no-files-found: warn
          retention-days: 14
