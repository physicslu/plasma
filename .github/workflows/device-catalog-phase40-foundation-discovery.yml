name: Device catalog Phase 4.0 foundation discovery

on:
  pull_request:

permissions:
  contents: read

jobs:
  discover-stm32f4-foundation-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser acquisition dependencies
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium
      - name: Acquire bounded official ST candidate set
        env:
          DISCOVERY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISCOVERY_RUN_ID: ${{ github.run_id }}
        run: |
          xvfb-run -a python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path('data/device-catalog/research')
          out = Path('phase40-foundation-discovery')
          out.mkdir(parents=True, exist_ok=True)
          sys.path.insert(0, str(root))

          from st_browser_acquisition import (
              BROWSER_TRANSPORT,
              CHROMIUM_LAUNCH_ARGS,
              STBrowserAcquirer,
              build_browser_evidence_record,
          )
          from stm32f4_acquisition_pilot import read_catalog, read_manifest, run_pilot

          manifest = root / 'stm32f4-phase4.0-foundation-batch2-manifest.json'
          catalog = root / 'openocd-parts-canonical.csv'
          pilot_id, targets = read_manifest(manifest)

          with STBrowserAcquirer(headless=False) as acquirer:
              summary = run_pilot(
                  pilot_id=pilot_id,
                  targets=targets,
                  catalog_rows=read_catalog(catalog),
                  fetcher=acquirer.fetch,
                  evidence_builder=build_browser_evidence_record,
                  timeout_seconds=45.0,
              )
              browser_version = acquirer.browser_version

          summary['acquisition_transport'] = BROWSER_TRANSPORT
          summary['browser_scope'] = 'discovery'
          summary['browser_runtime'] = {
              'engine': 'chromium',
              'browser_version': browser_version,
              'playwright_requirement': '1.62.0',
              'headless': False,
              'launch_args': CHROMIUM_LAUNCH_ARGS,
          }
          summary['canonical_dataset_admission'] = False
          summary['run_metadata'] = {
              'repository': 'physicslu/plasma',
              'head_sha': os.environ['DISCOVERY_HEAD_SHA'],
              'workflow_run_id': os.environ['DISCOVERY_RUN_ID'],
          }

          if summary.get('acquisition_failure') != 0:
              raise SystemExit('bounded ST discovery contains acquisition failures')
          attempted = summary.get('attempted')
          if summary.get('canonical_mapping') != {'unique': attempted, 'ambiguous': 0, 'unmapped': 0}:
              raise SystemExit('bounded ST discovery contains non-unique ordering-pattern mappings')
          if summary.get('openocd_cfg_mapping') != {'mapped': attempted, 'total': attempted}:
              raise SystemExit('bounded ST discovery contains incomplete OpenOCD mappings')
          if summary.get('manual_intervention_required') != 0:
              raise SystemExit('bounded ST discovery requires manual intervention')

          observed = {}
          excluded = []
          for result in summary['results']:
              evidence = result['evidence']
              base = result['base_device']
              observed[base] = evidence['exact_icpns']
              excluded.extend(
                  {'base_device': base, **item}
                  for item in evidence.get('excluded_non_active_part_numbers', [])
              )

          discovery = {
              'schema_version': 1,
              'pilot_id': pilot_id,
              'canonical_dataset_admission': False,
              'observed_active_exact_icpns': observed,
              'excluded_non_active_observations': excluded,
              'active_candidate_count': sum(len(values) for values in observed.values()),
          }
          (out / 'pilot-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          (out / 'discovery.json').write_text(
              json.dumps(discovery, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(discovery, indent=2, sort_keys=True))
          PY
      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase40-stm32f4-foundation-discovery
          path: phase40-foundation-discovery
          if-no-files-found: error
          retention-days: 7
