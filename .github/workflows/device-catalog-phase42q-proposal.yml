name: Device catalog Phase 4.2Q admission proposal
on:
  push:
    branches: [agent/device-catalog-phase4.2q-vh-admission-batch2]
    paths: [".github/workflows/device-catalog-phase42q-proposal.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  propose:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2q-vh-admission-batch2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build proposal
        run: |
          mkdir -p /tmp/phase42q
          PYTHONPATH=data/device-catalog/research python data/device-catalog/research/stm32f4_admission.py --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2q-vh-admission-batch2-live-2026-09-03 --baseline data/device-catalog/research/stm32f4-phase4.2q-vh-admission-batch2-baseline.json --admit-base STM32F411VE --admit-base STM32F412VE --admit-base STM32F412VG --admit-base STM32F413VG --output /tmp/phase42q/admission-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/phase42q/admission-plan.json').read_text())
          if p['candidate_count'] != 21 or p['decision_counts'] != {'admit':21,'already_present':0,'manual_review_required':0,'reject':0} or p['conflicts'] != 0 or p['canonical_rows_before'] != 283:
              raise SystemExit('unclean Phase 4.2Q plan')
          PY
          cd /tmp/phase42q && sha256sum admission-plan.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: {name: phase42q-admission-proposal, path: /tmp/phase42q, if-no-files-found: error, retention-days: 30}
