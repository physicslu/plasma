name: Device catalog Phase 4.2AE STM32F410 Rx admission proposal
on:
  push:
    branches: [agent/device-catalog-phase4.2ae-f410-rx-admission]
    paths: [".github/workflows/device-catalog-phase42ae-proposal.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  propose:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2ae-f410-rx-admission}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build proposal
        run: |
          mkdir -p /tmp/phase42ae
          PYTHONPATH=data/device-catalog/research python data/device-catalog/research/stm32f4_admission.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.2ae-f410-rx-admission-live-2026-09-05 \
            --baseline data/device-catalog/research/stm32f4-phase4.2ae-f410-rx-admission-baseline.json \
            --admit-base STM32F410R8 --admit-base STM32F410RB \
            --output /tmp/phase42ae/admission-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/phase42ae/admission-plan.json').read_text())
          expected={'admit':7,'already_present':0,'manual_review_required':0,'reject':0}
          expected_icpns={'STM32F410R8T6','STM32F410RBI3','STM32F410RBI6','STM32F410RBT6','STM32F410RBT6TR','STM32F410RBT7','STM32F410RBT7TR'}
          if p['candidate_count'] != 7 or p['decision_counts'] != expected or p['conflicts'] != 0 or p['canonical_rows_before'] != 357:
              raise SystemExit('unclean Phase 4.2AE plan')
          if {x['icpn'] for x in p['candidates']} != expected_icpns:
              raise SystemExit('unexpected Phase 4.2AE candidate set')
          PY
          cd /tmp/phase42ae && sha256sum admission-plan.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: {name: phase42ae-f410-rx-admission-proposal, path: /tmp/phase42ae, if-no-files-found: error, retention-days: 30}
