name: OpenOCD current gap rebaseline v6.22

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/rebaseline_openocd_current_gap_v622.py'
      - 'data/device-catalog/research/test_rebaseline_openocd_current_gap_v622.py'
      - 'data/device-catalog/research/OPENOCD_CURRENT_GAP_REBASELINE_V622.md'
      - '.github/workflows/device-catalog-openocd-gap-v622.yml'

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reclassify current Production OpenOCD gap
        run: |
          python data/device-catalog/research/rebaseline_openocd_current_gap_v622.py \
            --classified /tmp/openocd-gap-v622.csv \
            --summary /tmp/openocd-gap-v622.json
          python -m unittest discover -s data/device-catalog/research \
            -p test_rebaseline_openocd_current_gap_v622.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: openocd-current-gap-rebaseline-v622
          path: |
            /tmp/openocd-gap-v622.csv
            /tmp/openocd-gap-v622.json
          if-no-files-found: error
          retention-days: 30
