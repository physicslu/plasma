name: Device catalog Phase 4.2G blocker analysis

on:
  push:
    branches:
      - agent/device-catalog-phase4.2g-blocker-analysis

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build current blocker portfolio
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase42g
          python data/device-catalog/research/stm32f4_phase4_2g_blocker_prioritization.py \
            --inventory-output /tmp/phase42g/inventory.json \
            --portfolio-output /tmp/phase42g/portfolio.json
          sha256sum /tmp/phase42g/inventory.json /tmp/phase42g/portfolio.json | tee /tmp/phase42g/SHA256SUMS
          python -m json.tool /tmp/phase42g/portfolio.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: phase42g-stm32f4-blocker-portfolio
          path: /tmp/phase42g
          if-no-files-found: error
          retention-days: 30
