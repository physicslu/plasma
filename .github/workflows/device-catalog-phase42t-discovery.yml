name: Device catalog Phase 4.2T STM32F410TB discovery
on:
  push:
    branches: [agent/device-catalog-phase4.2t-f410tb-admission]
    paths: [".github/workflows/device-catalog-phase42t-discovery.yml","data/device-catalog/research/stm32f4-phase4.2t-f410tb-admission-manifest.json"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  discover:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install playwright==1.62.0 && python -m playwright install --with-deps chromium
      - run: |
          mkdir -p /tmp/phase42t
          xvfb-run -a python data/device-catalog/research/run_stm32f4_browser_pilot.py --manifest data/device-catalog/research/stm32f4-phase4.2t-f410tb-admission-manifest.json --catalog data/device-catalog/research/openocd-parts-canonical.csv --output /tmp/phase42t/pilot-summary.json --scope pilot --headed --timeout 45 --delay 2
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/phase42t/pilot-summary.json').read_text())
          expected={'STM32F479ZG','STM32F410TB'}
          if p['acquisition_failure'] or {x['base_device'] for x in p['results']} != expected:
              raise SystemExit('Phase 4.2T discovery failed')
          PY
          cd /tmp/phase42t && sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: {name: phase42t-f410tb-discovery, path: /tmp/phase42t, if-no-files-found: error, retention-days: 30}
