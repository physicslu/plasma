name: STM32L1 live lifecycle requalification

on:
  push:
    branches:
      - agent/device-catalog-stm32l1-requalification
    paths:
      - "data/device-catalog/research/stm32l1_requalification_probe.py"
      - "data/device-catalog/research/run_stm32l1_requalification_probe.py"
      - ".github/workflows/device-catalog-stm32l1-requalification-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stm32l1-requalification-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-requalification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate deterministic boundary
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'data/device-catalog/research')
          from stm32l1_requalification_probe import deterministic_targets, target_manifest
          targets = deterministic_targets()
          manifest = target_manifest(targets)
          assert manifest['target_count'] == 7
          assert {t['subfamily'] for t in manifest['targets']} == {'STM32L100','STM32L151','STM32L152','STM32L162'}
          assert all(v is False for v in manifest['claims'].values())
          print('STM32L1 deterministic requalification boundary: PASS')
          PY

      - name: Install bounded browser acquisition dependencies
        run: |
          python -m pip install -r data/device-catalog/research/requirements-st-browser.txt
          python -m playwright install --with-deps chromium

      - name: Acquire official ST lifecycle evidence
        id: acquire
        continue-on-error: true
        run: |
          mkdir -p .artifacts/stm32l1-requalification/evidence
          xvfb-run -a python data/device-catalog/research/run_stm32l1_requalification_probe.py \
            --delay 1.0 \
            --timeout 75 \
            --output .artifacts/stm32l1-requalification/probe-summary.json \
            --targets-output .artifacts/stm32l1-requalification/targets.json \
            --evidence-dir .artifacts/stm32l1-requalification/evidence

      - name: Validate requalification result
        id: validate
        if: always() && hashFiles('.artifacts/stm32l1-requalification/probe-summary.json') != ''
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          p=json.load(open('.artifacts/stm32l1-requalification/probe-summary.json'))
          assert p['phase'] == 'post-L4-STM32L1-requalification'
          assert p['family'] == 'STM32L1'
          assert p['target_count'] == 7
          assert p['active_subfamily_count'] == 4
          assert p['active_subfamilies'] == ['STM32L100','STM32L151','STM32L152','STM32L162']
          assert p['historical_single_page_false_negative_subfamilies'] == ['STM32L100','STM32L151','STM32L152']
          assert p['manual_review_targets'] == 0
          assert p['source_unavailable_targets'] == 0
          assert p['bounded_probe_complete'] is True
          assert p['requalification_status'] == 'eligible_for_next_research_gate'
          assert p['selected_next_research_family'] is None
          assert all(v is False for v in p['claims'].values())
          print(json.dumps({k:p[k] for k in [
              'active_subfamilies','historical_single_page_false_negative_subfamilies',
              'requalification_status','bounded_probe_complete']}, indent=2))
          PY

      - name: Upload immutable live evidence candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stm32l1-requalification-live-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: .artifacts/stm32l1-requalification/

      - name: Enforce requalification gate
        if: always()
        run: |
          if [ "${{ steps.acquire.outcome }}" != "success" ]; then
            echo "STM32L1 live requalification acquisition requires review." >&2
            exit 1
          fi
          if [ "${{ steps.validate.outcome }}" != "success" ]; then
            echo "STM32L1 requalification evidence failed bounded validation." >&2
            exit 1
          fi
