name: Device catalog Phase 4.2AC STM32F410 x8 retained evidence
on:
  push:
    branches: [agent/device-catalog-phase4.2ac-f410-x8-admission]
    paths: [".github/workflows/device-catalog-phase42ac-retained.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  retain:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: agent/device-catalog-phase4.2ac-f410-x8-admission}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install browser
        run: python -m pip install playwright==1.62.0 && python -m playwright install --with-deps chromium
      - name: Acquire control and pilot
        run: |
          mkdir -p /tmp/phase42ac
          xvfb-run -a python data/device-catalog/research/run_stm32f4_browser_pilot.py \
            --manifest data/device-catalog/research/stm32f4-phase3.1-pilot-manifest.json \
            --catalog data/device-catalog/research/openocd-parts-canonical.csv \
            --output /tmp/phase42ac/control.json --scope control --headed --timeout 75 --delay 2
          xvfb-run -a python data/device-catalog/research/run_stm32f4_browser_pilot.py \
            --manifest data/device-catalog/research/stm32f4-phase4.2ac-f410-x8-admission-manifest.json \
            --catalog data/device-catalog/research/openocd-parts-canonical.csv \
            --output /tmp/phase42ac/pilot.json --scope pilot --headed --timeout 75 --delay 2
      - name: Evaluate and retain
        run: |
          python data/device-catalog/research/evaluate_stm32f4_pilot.py \
            --summary /tmp/phase42ac/pilot.json --baseline data/device-catalog/research/stm32f4-phase4.2ac-f410-x8-admission-baseline.json \
            --output /tmp/phase42ac/evaluation.json --repository physicslu/plasma --git-sha "$GITHUB_SHA"
          python data/device-catalog/research/retain_stm32f4_browser_evidence.py \
            --control /tmp/phase42ac/control.json --pilot /tmp/phase42ac/pilot.json --evaluation /tmp/phase42ac/evaluation.json \
            --baseline data/device-catalog/research/stm32f4-phase4.2ac-f410-x8-admission-baseline.json --output-dir /tmp/phase42ac/retained
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir /tmp/phase42ac/retained --baseline data/device-catalog/research/stm32f4-phase4.2ac-f410-x8-admission-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: phase42ac-f410-x8-retained, path: /tmp/phase42ac, if-no-files-found: error, retention-days: 30}
