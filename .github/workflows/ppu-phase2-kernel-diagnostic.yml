name: PPU Phase 2 probe fix

on:
  push:
    branches:
      - agent/ppu-network-phase2-safe-activation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply direct HTTP probe patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/ppu-network-phase2-acceptance.py')
          text = path.read_text(encoding='utf-8')
          old = '''req = urllib.request.Request(url, data=data, headers=headers, method=method)\ntry:\n    with urllib.request.urlopen(req, timeout=1.2) as r:\n'''
          new = '''req = urllib.request.Request(url, data=data, headers=headers, method=method)\nopener = urllib.request.build_opener(urllib.request.ProxyHandler({}))\ntry:\n    with opener.open(req, timeout=1.2) as r:\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one probe block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- scripts/ppu-network-phase2-acceptance.py
      - name: Commit bounded probe fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/ppu-network-phase2-acceptance.py; then
            echo 'No change to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ppu-network-phase2-acceptance.py
          git commit -m 'test: force direct Phase 2 HTTP probes'
          git push origin HEAD:agent/ppu-network-phase2-safe-activation
