name: TEMP STM32WLX admission-readiness materialization

on:
  push:
    branches:
      - agent/stm32wlx-admission-readiness

permissions:
  contents: read

concurrency:
  group: temp-stm32wlx-admission-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize deterministic STM32WLX admission candidate
        run: |
          mkdir -p .artifacts/admission
          python data/device-catalog/research/stm32wlx_admission_readiness.py \
            --csv-output .artifacts/admission/stm32wlx-commercial-icpn.csv \
            --json-output .artifacts/admission/stm32wlx-admission-readiness.json
      - name: Emit candidate to workflow log
        run: |
          python - <<'PY'
          import base64, pathlib
          root = pathlib.Path(".artifacts/admission")
          for path in sorted(root.iterdir()):
              print(f"ADMISSION_FILE_BEGIN {path.name}")
              print(base64.b64encode(path.read_bytes()).decode("ascii"))
              print(f"ADMISSION_FILE_END {path.name}")
          PY
      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: stm32wlx-admission-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: .artifacts/admission/*
