name: STM32F2 Layer-1 admission proposal v4.0
on:
  pull_request:
    paths:
      - 'data/device-catalog/research/prepare_stm32f2_layer1_admission_proposal_v40.py'
      - 'data/device-catalog/research/test_prepare_stm32f2_layer1_admission_proposal_v40.py'
      - 'data/device-catalog/research/stm32f2-layer1-admission-proposal-v4.0.json'
      - 'data/device-catalog/research/validate_stm32f2_layer1_proposal_lock_v40.py'
      - 'data/device-catalog/research/STM32F2_LAYER1_ADMISSION_PROPOSAL_V40.md'
      - '.github/workflows/device-catalog-stm32f2-layer1-proposal-v40.yml'
permissions:
  contents: read
jobs:
  proposal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python data/device-catalog/research/prepare_stm32f2_layer1_admission_proposal_v40.py --proposal /tmp/stm32f2-v40.csv --summary /tmp/stm32f2-v40.json
          python -m unittest discover -s data/device-catalog/research -p test_prepare_stm32f2_layer1_admission_proposal_v40.py -v
          python data/device-catalog/research/validate_stm32f2_layer1_proposal_lock_v40.py
      - uses: actions/upload-artifact@v4
        with:
          name: stm32f2-layer1-admission-proposal-v40
          path: |
            /tmp/stm32f2-v40.csv
            /tmp/stm32f2-v40.json
          if-no-files-found: error
          retention-days: 30
