name: Unified P E Dashboard Verify

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/unified-pe-dashboard-verify.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'agent/unified-pe-batch-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-pe-batch-dashboard
          fetch-depth: 0

      - name: Apply focused contract fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          pmod = Path('software/web/app/fleet/server-batch-page.tsx')
          text = pmod.read_text(encoding='utf-8')
          needle = '              <BatchTopologySummary\n      facilityCount={catalog.facility_count}'
          replacement = '              <BatchTopologySummary\n                ariaLabel="Mock topology summary"\n                facilityCount={catalog.facility_count}'
          if needle not in text:
              raise SystemExit('PMode BatchTopologySummary insertion point not found')
          text = text.replace(needle, replacement, 1)
          pmod.write_text(text, encoding='utf-8')

          tablet = Path('software/web/e2e/tests/production-tablet-layout.spec.ts')
          text = tablet.read_text(encoding='utf-8')
          old = '''test("Production batch toolbar uses two rows in a narrow content column at a wide viewport", async ({ page }) => {
            await openProduction(page, { width: 1440, height: 900 });

            const workspaceWidth = await page.locator(".productionMainPanel").evaluate(element => element.clientWidth);
            expect(workspaceWidth).toBeLessThanOrEqual(1060);
            await expectConstrainedToolbar(page);
          });'''
          new = '''test("Production batch toolbar follows a constrained content column at a wide viewport", async ({ page }) => {
            await openProduction(page, { width: 1440, height: 900 });

            const workspace = page.locator(".productionWorkspace");
            const mainPanel = page.locator(".productionMainPanel");
            await workspace.evaluate(element => {
              (element as HTMLElement).style.gridTemplateColumns = "286px minmax(0, 1040px)";
            });
            await mainPanel.evaluate(element => {
              const node = element as HTMLElement;
              node.style.width = "1040px";
              node.style.maxWidth = "1040px";
              node.style.justifySelf = "start";
            });

            await expect.poll(() => mainPanel.evaluate(element => element.clientWidth)).toBeLessThanOrEqual(1060);
            await expectConstrainedToolbar(page);
          });'''
          if old not in text:
              raise SystemExit('Production tablet wide-column test block not found')
          tablet.write_text(text.replace(old, new, 1), encoding='utf-8')

          theme = Path('software/web/e2e/tests/pmod-emode-theme-regression.spec.ts')
          text = theme.read_text(encoding='utf-8')
          old = '''  const toolbar = await page.locator(".engineeringExecutionToolbar").boundingBox();
            const header = await page.locator(".engineeringProgrammingHeader").boundingBox();
            const targetSelector = await page.locator(".engineeringTargetSelector").boundingBox();
            const sourceNote = await page.locator(".engineeringBoundaryNote").last().boundingBox();
            const sitePanel = await page.locator(".engineeringSelectorPanel").boundingBox();
            for (const box of [toolbar, header, targetSelector, sourceNote, sitePanel]) expect(box).not.toBeNull();
            expect(header!.height).toBeLessThanOrEqual(80);
            expect(toolbar!.height).toBeLessThanOrEqual(70);
            expect(targetSelector!.height).toBeLessThanOrEqual(72);
            expect(sourceNote!.height).toBeLessThanOrEqual(42);
            expect(sitePanel!.height).toBeLessThanOrEqual(118);
            expect(sitePanel!.y + sitePanel!.height - header!.y).toBeLessThanOrEqual(360);'''
          new = '''  const toolbar = await page.locator(".engineeringExecutionToolbar").boundingBox();
            const header = await page.locator(".engineeringProgrammingHeader").boundingBox();
            const topology = await page.locator(".engineeringProgramming .batchTopologySummary").boundingBox();
            const controls = await page.locator(".engineeringProgramming .unifiedBatchControlStack").boundingBox();
            const activeSummary = await page.locator(".engineeringProgramming .activeFpsSummary").boundingBox();
            const targetSelector = await page.locator(".engineeringTargetSelector").boundingBox();
            const sourceNote = await page.locator(".engineeringBoundaryNote").last().boundingBox();
            const sitePanel = await page.locator(".engineeringSelectorPanel").boundingBox();
            for (const box of [toolbar, header, topology, controls, activeSummary, targetSelector, sourceNote, sitePanel]) expect(box).not.toBeNull();
            expect(header!.height).toBeLessThanOrEqual(80);
            expect(toolbar!.height).toBeLessThanOrEqual(70);
            expect(topology!.height).toBeLessThanOrEqual(72);
            expect(controls!.height).toBeLessThanOrEqual(150);
            expect(activeSummary!.height).toBeLessThanOrEqual(76);
            expect(activeSummary!.y + activeSummary!.height - header!.y).toBeLessThanOrEqual(400);
            expect(targetSelector!.height).toBeLessThanOrEqual(72);
            expect(sourceNote!.height).toBeLessThanOrEqual(42);
            expect(sitePanel!.height).toBeLessThanOrEqual(118);
            expect(sitePanel!.y + sitePanel!.height - header!.y).toBeLessThanOrEqual(560);'''
          if old not in text:
              raise SystemExit('EMode density assertion block not found')
          theme.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: |
            software/web/package-lock.json
            software/web/e2e/package-lock.json

      - name: Install Web dependencies
        working-directory: software/web
        run: npm ci

      - name: Lint and source tests
        working-directory: software/web
        run: |
          npm run lint
          npm test

      - name: Install Playwright runtime
        working-directory: software/web/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run focused browser regressions
        working-directory: software/web/e2e
        run: >-
          npx playwright test
          tests/unified-batch-dashboard.spec.ts
          tests/production-tablet-layout.spec.ts
          tests/pmod-emode-theme-regression.spec.ts
          tests/factory-production-console.spec.ts

      - name: Remove verification workflow
        run: rm -f .github/workflows/unified-pe-dashboard-verify.yml

      - name: Commit verified fixes
        run: |
          git config user.name "plasma-ci-bot"
          git config user.email "plasma-ci-bot@users.noreply.github.com"
          git add -A
          git commit -m "Fix unified P E dashboard regressions"
          git push origin HEAD:agent/unified-pe-batch-dashboard
