name: Device catalog Phase 4.1 R/T batch4 lifecycle

on:
  push:
    branches:
      - main
    paths:
      - "data/device-catalog/**"
      - "software/python/plasma_web/device_catalog.py"
      - ".github/workflows/device-catalog-phase41-rt-batch4-validation.yml"
  pull_request:
    paths:
      - "data/device-catalog/**"
      - "software/python/plasma_web/device_catalog.py"
      - ".github/workflows/device-catalog-phase41-rt-batch4-validation.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-batch4-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate retained evidence and post-admission replay
        run: |
          python data/device-catalog/research/validate_stm32f4_retained_evidence.py \
            --evidence-dir data/device-catalog/research/evidence/stm32f4-phase4.1-rt-admission-batch4-live-2026-09-02 \
            --baseline data/device-catalog/research/stm32f4-phase4.1-rt-admission-batch4-baseline.json
          python data/device-catalog/research/test_stm32f4_phase4_1_rt_admission_batch4_post_admission.py
