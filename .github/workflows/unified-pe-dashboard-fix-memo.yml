name: Unified P E Dashboard Fix Memo

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/unified-pe-dashboard-fix-memo.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/unified-pe-batch-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-pe-batch-dashboard
          fetch-depth: 0

      - name: Remove unnecessary manual memoization
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('software/web/app/engineering/programming-workspace.tsx')
          text = path.read_text()
          old_import = 'import { useCallback, useEffect, useMemo, useRef, useState } from "react";'
          new_import = 'import { useCallback, useEffect, useRef, useState } from "react";'
          if old_import not in text:
              raise SystemExit('useMemo import was not found')
          text = text.replace(old_import, new_import, 1)

          pattern = re.compile(
              r'  const activeFpsCounts = useMemo\(\(\) => \{(?P<body>.*?)\n  \}, \[batchSiteStates, selectedSiteIds, selectedSites\]\);',
              re.S,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit('activeFpsCounts useMemo block was not found')
          replacement = '  const activeFpsCounts = (() => {' + match.group('body') + '\n  })();'
          text = text[:match.start()] + replacement + text[match.end():]
          path.write_text(text)

          Path('.github/workflows/unified-pe-dashboard-fix-memo.yml').unlink()
          PY

      - name: Commit fix
        run: |
          git config user.name "plasma-ci-bot"
          git config user.email "plasma-ci-bot@users.noreply.github.com"
          git add -A
          git commit -m "Simplify Engineering Active FPS computation"
          git push origin HEAD:agent/unified-pe-batch-dashboard
