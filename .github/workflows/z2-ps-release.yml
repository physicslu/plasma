name: Z2 PS release candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/z2-ps-release.yml"
      - "scripts/plasmactl"
      - "scripts/plasmactl-z2-ps"
      - "scripts/z2-python-runtime.py"
      - "scripts/ppu-runtime.py"
      - "scripts/ppu-release.py"
      - "scripts/ppu-z2-installer.py"
      - "scripts/product-release.py"
      - "docs/deployment/z2-ps-installer.md"
      - "docs/deployment/plasmactl-deployment-profiles.md"
      - "release/**"
      - "software/python/pyproject.toml"
      - "software/python/plasma_core/**"
      - "software/python/plasma_interfaces/**"
      - "software/python/plasma_handlers/**"
      - "software/python/plasma_server/**"
      - "software/python/plasma_client/**"
      - "software/python/plasma_web/**"
      - "software/python/tests/test_ppu_runtime.py"
      - "software/python/tests/test_ppu_release.py"
      - "software/python/tests/test_ppu_z2_installer.py"
      - "software/python/tests/test_z2_python_runtime_artifact.py"
      - "software/python/tests/test_z2_ps_release_cache_contract.py"
      - "software/python/tests/test_plasmactl_deployment_profiles.py"
  pull_request:
    paths:
      - ".github/workflows/z2-ps-release.yml"
      - "scripts/plasmactl"
      - "scripts/plasmactl-z2-ps"
      - "scripts/z2-python-runtime.py"
      - "scripts/ppu-runtime.py"
      - "scripts/ppu-release.py"
      - "scripts/ppu-z2-installer.py"
      - "scripts/product-release.py"
      - "docs/deployment/z2-ps-installer.md"
      - "docs/deployment/plasmactl-deployment-profiles.md"
      - "release/**"
      - "software/python/pyproject.toml"
      - "software/python/plasma_core/**"
      - "software/python/plasma_interfaces/**"
      - "software/python/plasma_handlers/**"
      - "software/python/plasma_server/**"
      - "software/python/plasma_client/**"
      - "software/python/plasma_web/**"
      - "software/python/tests/test_ppu_runtime.py"
      - "software/python/tests/test_ppu_release.py"
      - "software/python/tests/test_ppu_z2_installer.py"
      - "software/python/tests/test_z2_python_runtime_artifact.py"
      - "software/python/tests/test_z2_ps_release_cache_contract.py"
      - "software/python/tests/test_plasmactl_deployment_profiles.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  Z2_PYTHON_VERSION: "3.12.13"
  Z2_PYTHON_SOURCE_SHA256: "c08bc65a81971c1dd5783182826503369466c7e67374d1646519adf05207b684"
  Z2_PYTHON_CACHE_SCHEMA: "v1"

jobs:
  z2-python-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prove clean-PYNQ bootstrap compatibility
        run: |
          python -m py_compile scripts/z2-python-runtime.py scripts/ppu-z2-installer.py
          python scripts/z2-python-runtime.py --help
          python scripts/ppu-z2-installer.py --help
          python -m pip install pytest
          python -m pytest -q \
            software/python/tests/test_z2_python_runtime_artifact.py \
            software/python/tests/test_z2_ps_release_cache_contract.py

      - name: Restore verified ARMv7 Python build cache
        id: z2-python-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/z2-python-artifact
          key: >-
            z2-python-${{ env.Z2_PYTHON_CACHE_SCHEMA }}-${{ runner.os }}-armv7-ubuntu22.04-
            py${{ env.Z2_PYTHON_VERSION }}-${{ env.Z2_PYTHON_SOURCE_SHA256 }}-
            ${{ hashFiles('.github/workflows/z2-ps-release.yml', 'scripts/z2-python-runtime.py') }}

      - name: Set up QEMU for ARMv7 build and runtime smoke
        uses: docker/setup-qemu-action@v4
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm

      - name: Build CPython against Ubuntu 22.04 ARMv7 userspace
        if: steps.z2-python-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/z2-python-artifact"
          rm -rf "$output"
          mkdir -p "$output"
          docker run --rm \
            --platform linux/arm/v7 \
            --volume "$PWD:/repo:ro" \
            --volume "$output:/out" \
            --env PYTHON_VERSION="$Z2_PYTHON_VERSION" \
            --env PYTHON_SOURCE_SHA256="$Z2_PYTHON_SOURCE_SHA256" \
            arm32v7/ubuntu:22.04 \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential ca-certificates curl xz-utils \
                libssl-dev zlib1g-dev libbz2-dev libreadline-dev \
                libsqlite3-dev libffi-dev liblzma-dev uuid-dev
              curl --fail --silent --show-error --location \
                "https://www.python.org/ftp/python/${PYTHON_VERSION}/Python-${PYTHON_VERSION}.tar.xz" \
                --output /tmp/Python.tar.xz
              printf "%s  %s\n" "$PYTHON_SOURCE_SHA256" /tmp/Python.tar.xz | sha256sum --check -
              mkdir -p /tmp/python-src
              tar -xJf /tmp/Python.tar.xz -C /tmp/python-src --strip-components=1
              cd /tmp/python-src
              ./configure \
                --prefix="/opt/plasma/python/${PYTHON_VERSION}" \
                --with-ensurepip=install
              make -j2
              make altinstall
              minor="${PYTHON_VERSION%.*}"
              ln -s "python${minor}" "/opt/plasma/python/${PYTHON_VERSION}/bin/python3"
              "/opt/plasma/python/${PYTHON_VERSION}/bin/python3" -c \
                "import ssl,sqlite3,urllib.request; print(ssl.OPENSSL_VERSION, sqlite3.sqlite_version)"
              "/opt/plasma/python/${PYTHON_VERSION}/bin/python3" \
                /repo/scripts/z2-python-runtime.py build \
                --python-root "/opt/plasma/python/${PYTHON_VERSION}" \
                --output-dir /out \
                --source-ref "python.org/Python-${PYTHON_VERSION}.tar.xz#sha256=${PYTHON_SOURCE_SHA256}"
            '

      - name: Verify Python artifact without executing ARM code on x86 host
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/z2-python-artifact/plasma-python-$Z2_PYTHON_VERSION-linux-armv7l.tar.gz"
          test -f "$artifact"
          test -f "$artifact.sha256"
          python scripts/z2-python-runtime.py verify "$artifact" --sidecar "$artifact.sha256"

      - name: Install Python artifact on fresh Ubuntu 22.04 ARMv7 userspace
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/z2-python-artifact"
          docker run --rm \
            --platform linux/arm/v7 \
            --volume "$PWD:/repo:ro" \
            --volume "$artifact_dir:/artifacts:ro" \
            --env PYTHON_VERSION="$Z2_PYTHON_VERSION" \
            arm32v7/ubuntu:22.04 \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                python3 libssl3 libsqlite3-0 libffi8 libbz2-1.0 liblzma5 libreadline8
              artifact="/artifacts/plasma-python-${PYTHON_VERSION}-linux-armv7l.tar.gz"
              python3 /repo/scripts/z2-python-runtime.py install "$artifact" --sidecar "$artifact.sha256"
              "/opt/plasma/python/${PYTHON_VERSION}/bin/python3" -c \
                "import ssl,sqlite3,urllib.request; print(ssl.OPENSSL_VERSION, sqlite3.sqlite_version)"
              test "$(python3 -c "import sys; print(sys.version_info[:2])")" != "$(/opt/plasma/python/${PYTHON_VERSION}/bin/python3 -c "import sys; print(sys.version_info[:2])")"
            '

      - name: Save verified ARMv7 Python build cache
        if: >-
          steps.z2-python-cache.outputs.cache-hit != 'true' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/z2-python-artifact
          key: >-
            z2-python-${{ env.Z2_PYTHON_CACHE_SCHEMA }}-${{ runner.os }}-armv7-ubuntu22.04-
            py${{ env.Z2_PYTHON_VERSION }}-${{ env.Z2_PYTHON_SOURCE_SHA256 }}-
            ${{ hashFiles('.github/workflows/z2-ps-release.yml', 'scripts/z2-python-runtime.py') }}

      - name: Upload qualified Plasma Python runtime candidate
        uses: actions/upload-artifact@v4
        with:
          name: plasma-z2-python-${{ env.Z2_PYTHON_VERSION }}-linux-armv7l-${{ github.sha }}
          path: |
            ${{ runner.temp }}/z2-python-artifact/plasma-python-${{ env.Z2_PYTHON_VERSION }}-linux-armv7l.tar.gz
            ${{ runner.temp }}/z2-python-artifact/plasma-python-${{ env.Z2_PYTHON_VERSION }}-linux-armv7l.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  z2-ps-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: z2-python-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PPU packaging dependencies
        run: python -m pip install ./software/python pytest

      - name: Run Z2 PS package/profile regressions
        run: >-
          python -m pytest -q
          software/python/tests/test_ppu_runtime.py
          software/python/tests/test_ppu_release.py
          software/python/tests/test_ppu_z2_installer.py
          software/python/tests/test_z2_python_runtime_artifact.py
          software/python/tests/test_z2_ps_release_cache_contract.py
          software/python/tests/test_plasmactl_deployment_profiles.py

      - name: Download qualified Plasma Python runtime candidate
        uses: actions/download-artifact@v4
        with:
          name: plasma-z2-python-${{ env.Z2_PYTHON_VERSION }}-linux-armv7l-${{ github.sha }}
          path: ${{ runner.temp }}/z2-python-artifact

      - name: Build canonical PPU release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/plasma-ppu-runtime"
          output="$RUNNER_TEMP/plasma-ppu-release"
          sha="$(git rev-parse HEAD)"
          version="$(python -c 'import json; print(json.load(open("release/product.json"))["product_version"])')"
          identity="$version-${sha:0:12}"
          python scripts/ppu-runtime.py build --output-dir "$runtime"
          python scripts/ppu-runtime.py validate "$runtime"
          python scripts/ppu-release.py \
            --runtime-dir "$runtime" \
            --output-dir "$output" \
            --git-sha "$sha"
          archive="$output/plasma-ppu-$identity-linux-armv7l.tar.gz"
          test -f "$archive"
          test -f "$archive.sha256"
          python scripts/ppu-z2-installer.py verify \
            --release-artifact "$archive" \
            --sidecar "$archive.sha256"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Assemble source-tree-independent Z2 PS kit
        id: kit
        shell: bash
        env:
          IDENTITY: ${{ steps.release.outputs.identity }}
          PPU_ARCHIVE: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/plasma-z2-ps-kit-$IDENTITY"
          mkdir -p "$root/scripts" "$root/artifacts" "$root/docs"
          cp scripts/plasmactl "$root/scripts/plasmactl"
          cp scripts/plasmactl-z2-ps "$root/scripts/plasmactl-z2-ps"
          cp scripts/ppu-z2-installer.py "$root/scripts/ppu-z2-installer.py"
          cp scripts/z2-python-runtime.py "$root/scripts/z2-python-runtime.py"
          cp "$PPU_ARCHIVE" "$PPU_ARCHIVE.sha256" "$root/artifacts/"
          cp "$RUNNER_TEMP/z2-python-artifact/"* "$root/artifacts/"
          cp docs/deployment/z2-ps-installer.md "$root/docs/README.md"
          chmod +x "$root/scripts/plasmactl" "$root/scripts/plasmactl-z2-ps" \
            "$root/scripts/ppu-z2-installer.py" "$root/scripts/z2-python-runtime.py"
          python scripts/z2-python-runtime.py verify \
            "$root/artifacts/plasma-python-$Z2_PYTHON_VERSION-linux-armv7l.tar.gz" \
            --sidecar "$root/artifacts/plasma-python-$Z2_PYTHON_VERSION-linux-armv7l.tar.gz.sha256"
          python "$root/scripts/ppu-z2-installer.py" verify \
            --release-artifact "$root/artifacts/$(basename "$PPU_ARCHIVE")" \
            --sidecar "$root/artifacts/$(basename "$PPU_ARCHIVE").sha256"
          bash "$root/scripts/plasmactl" help >/dev/null
          (
            cd "$root"
            find scripts artifacts docs -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          kit="$RUNNER_TEMP/plasma-z2-ps-kit-$IDENTITY.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$kit" "plasma-z2-ps-kit-$IDENTITY"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$(basename "$kit")" > "$(basename "$kit").sha256"
          )
          echo "kit=$kit" >> "$GITHUB_OUTPUT"

      - name: Upload complete Z2 PS release candidate kit
        uses: actions/upload-artifact@v4
        with:
          name: plasma-z2-ps-kit-${{ steps.release.outputs.identity }}
          path: |
            ${{ steps.kit.outputs.kit }}
            ${{ steps.kit.outputs.kit }}.sha256
          if-no-files-found: error
          retention-days: 14
