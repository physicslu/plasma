name: Device catalog Phase 4.2J blocker taxonomy

on:
  push:
    branches:
      - agent/device-catalog-phase4.2j-blocker-taxonomy
    paths:
      - ".github/workflows/device-catalog-phase42j-blocker-taxonomy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  taxonomy:
    if: github.actor == 'physicslu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build blocker taxonomy
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import json
          import re
          import sys
          from pathlib import Path

          root = Path('data/device-catalog/research')
          sys.path.insert(0, str(root))
          from stm32f4_coverage_gap_inventory import build_inventory

          inv = build_inventory(
              catalog_path=root / 'openocd-parts-canonical.csv',
              canonical_path=root / 'stm32f4-commercial-icpn.csv',
          )
          assert inv['production']['exact_icpn_rows'] == 211, inv['production']
          assert inv['production']['base_device_count'] == 73, inv['production']
          assert inv['openocd_ordering_pattern_base_device_count'] == 149, inv
          assert inv['gap']['base_device_count'] == 76, inv['gap']
          assert inv['gap']['policy_ready_count'] == 0, inv['gap']
          assert inv['gap']['policy_blocked_count'] == 76, inv['gap']

          blocker_counter = collections.Counter()
          combo_counter = collections.Counter()
          package_counter = collections.Counter()
          flash_counter = collections.Counter()
          bases_by_combo = collections.defaultdict(list)
          bases_by_blocker = collections.defaultdict(list)

          combo_re = re.compile(r'unsupported STM32F4 pin/package combination: ([A-Z0-9])/([A-Z0-9])')
          flash_re = re.compile(r'unsupported flash-size code ([A-Z0-9])')
          package_re = re.compile(r'unsupported STM32F4 package code: ([A-Z0-9])')

          for item in inv['gap']['policy_blocked']:
              base = item['base_device']
              for blocker in item['policy_blockers']:
                  blocker_counter[blocker] += 1
                  bases_by_blocker[blocker].append(base)
                  m = combo_re.fullmatch(blocker)
                  if m:
                      combo = f'{m.group(1)}/{m.group(2)}'
                      combo_counter[combo] += 1
                      bases_by_combo[combo].append(base)
                      continue
                  m = flash_re.fullmatch(blocker)
                  if m:
                      flash_counter[m.group(1)] += 1
                      continue
                  m = package_re.fullmatch(blocker)
                  if m:
                      package_counter[m.group(1)] += 1

          report = {
              'schema_version': 1,
              'phase': '4.2J',
              'base_commit': '8fbdd5218faf216e3b682dac06d046c49065be57',
              'inventory_summary': {
                  'production_exact_icpn_rows': inv['production']['exact_icpn_rows'],
                  'production_base_devices': inv['production']['base_device_count'],
                  'openocd_base_devices': inv['openocd_ordering_pattern_base_device_count'],
                  'gap_base_devices': inv['gap']['base_device_count'],
                  'policy_ready': inv['gap']['policy_ready_count'],
                  'policy_blocked': inv['gap']['policy_blocked_count'],
              },
              'pin_package_combinations': [
                  {
                      'combo': combo,
                      'base_device_count': count,
                      'base_devices': sorted(set(bases_by_combo[combo])),
                  }
                  for combo, count in combo_counter.most_common()
              ],
              'unsupported_package_codes': dict(package_counter.most_common()),
              'unsupported_flash_codes': dict(flash_counter.most_common()),
              'all_blockers': [
                  {
                      'blocker': blocker,
                      'occurrences': count,
                      'base_devices': sorted(set(bases_by_blocker[blocker])),
                  }
                  for blocker, count in blocker_counter.most_common()
              ],
              'algorithm_equivalence_claimed': False,
              'canonical_dataset_written': False,
          }
          out = Path('/tmp/phase42j-taxonomy.json')
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(out.read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase42j-stm32f4-blocker-taxonomy
          path: /tmp/phase42j-taxonomy.json
          if-no-files-found: error
          retention-days: 30
