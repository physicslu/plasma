name: TEMP NXP KL25 admission readiness generation

on:
  push:
    branches:
      - agent/nxp-kl25-admission-readiness

permissions:
  contents: read

concurrency:
  group: temp-nxp-kl25-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministically generate NXP KL25 readiness candidate
        run: |
          mkdir -p .artifacts/nxp-kl25-readiness
          python data/device-catalog/research/nxp_kl25_admission_readiness.py \
            --csv-output .artifacts/nxp-kl25-readiness/nxp-kl25-commercial-icpn.csv \
            --readiness-output .artifacts/nxp-kl25-readiness/nxp-kl25-admission-readiness.json
      - name: Emit generated artifacts to workflow log
        run: |
          python - <<'PY'
          import base64,pathlib
          for path in sorted(pathlib.Path(".artifacts/nxp-kl25-readiness").iterdir()):
              print(f"ARTIFACT_FILE_BEGIN {path.name}")
              print(base64.b64encode(path.read_bytes()).decode("ascii"))
              print(f"ARTIFACT_FILE_END {path.name}")
          PY
      - name: Upload generated readiness
        uses: actions/upload-artifact@v4
        with:
          name: nxp-kl25-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: .artifacts/nxp-kl25-readiness/*
