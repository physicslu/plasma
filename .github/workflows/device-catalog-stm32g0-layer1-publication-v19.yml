name: STM32G0 Layer-1 Production publication v1.9

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32g0-commercial-icpn.csv'
      - 'data/device-catalog/research/stm32g0-layer1-production-publication-v1.9.json'
      - 'data/device-catalog/research/validate_stm32g0_layer1_publication_v19.py'
      - 'data/device-catalog/research/STM32G0_LAYER1_PRODUCTION_PUBLICATION_V19.md'
      - 'software/python/plasma_web/device_catalog.py'
      - 'software/python/tests/test_device_catalog.py'
      - 'software/python/tests/test_device_catalog_web_gateway.py'
      - '.github/workflows/device-catalog-stm32g0-layer1-publication-v19.yml'

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved publication and Production graph
        run: |
          python data/device-catalog/research/validate_stm32g0_layer1_publication_v19.py
          python scripts/ci/device-catalog-production-invariants.py
      - name: Install Python development package
        run: python -m pip install -e "./software/python[dev]"
      - name: Validate runtime Catalog Layer-1/Layer-2 separation
        run: |
          python -m pytest -q \
            software/python/tests/test_device_catalog.py \
            software/python/tests/test_device_catalog_web_gateway.py
