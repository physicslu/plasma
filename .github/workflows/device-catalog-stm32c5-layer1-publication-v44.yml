name: STM32C5 Layer-1 Production publication v4.4

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32c5-commercial-icpn.csv'
      - 'data/device-catalog/research/stm32c5-layer1-production-publication-v4.4.json'
      - 'data/device-catalog/research/validate_stm32c5_layer1_publication_v44.py'
      - 'data/device-catalog/research/STM32C5_LAYER1_PRODUCTION_PUBLICATION_V44.md'
      - 'data/device-catalog/research/validate_stm32f2_layer1_publication_v41.py'
      - 'data/ic-support/test_coverage_inventory.py'
      - 'software/python/tests/test_device_catalog_stm32c5.py'
      - '.github/workflows/device-catalog-stm32c5-layer1-publication-v44.yml'

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved STM32C5 publication and Production graph
        run: |
          python data/device-catalog/research/validate_stm32c5_layer1_publication_v44.py
          python scripts/ci/device-catalog-production-invariants.py
          python data/ic-support/test_coverage_inventory.py
      - name: Install Python development package
        run: python -m pip install -e './software/python[dev]'
      - name: Validate runtime Catalog Layer-1/Layer-2 separation
        run: |
          python -m pytest -q \
            software/python/tests/test_device_catalog.py \
            software/python/tests/test_device_catalog_stm32c5.py \
            software/python/tests/test_device_catalog_web_gateway.py
