name: NXP KL25 Gate 5.6 evidence boundary retention

on:
  pull_request:
    paths:
      - ".github/workflows/nxp-kl25-evidence-boundary-retention.yml"
      - "data/ic-support/benchmarks/nxp-kl25/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-real-corrected-kl25-evidence-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure deterministic PDF tooling
        run: |
          set -euo pipefail
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
          pdftotext -v 2>&1 | head -n 1
      - name: Acquire source-locked KL25 programming authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path("data/ic-support/benchmarks/nxp-kl25")
          lock = json.loads((root / "source-lock.json").read_text(encoding="utf-8"))
          source = next(item for item in lock["sources"] if item["source_id"] == "nxp_kl25_rm_rev3")
          source_dir = Path("${{ runner.temp }}") / "nxp-kl25-source"
          source_dir.mkdir(parents=True, exist_ok=True)
          destination = source_dir / source["local_filename"]
          subprocess.run([
              "curl", "--fail", "--location", "--retry", "3",
              "--output", str(destination), source["final_url"],
          ], check=True)
          data = destination.read_bytes()
          actual = hashlib.sha256(data).hexdigest()
          expected = source["integrity"]
          assert len(data) == expected["byte_length"], (len(data), expected["byte_length"])
          assert actual == expected["digest"], (actual, expected["digest"])
          assert data.startswith(b"%PDF-"), "locked authority is not a PDF"
          print(f"source-lock PASS bytes={len(data)} sha256={actual}")
          PY
      - name: Build corrected Evidence Packs through pre-AI assembly
        run: |
          set -euo pipefail
          python data/ic-support/benchmarks/nxp-kl25/build_evidence_pack.py \
            --source-dir "${{ runner.temp }}/nxp-kl25-source" \
            --output-dir "${{ runner.temp }}/nxp-kl25-gate56-output"
      - name: Validate Gate 5.6 real-source boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          repo = Path("data/ic-support/benchmarks/nxp-kl25")
          out = Path("${{ runner.temp }}") / "nxp-kl25-gate56-output"
          definitions = json.loads((repo / "reviewed-evidence-unit-definitions.json").read_text(encoding="utf-8"))
          release = definitions["boundary_release"]
          assert release["release_id"] == "nxp-kl25-evidence-boundary-release-v1"
          assert release["review_status"] == "REVIEWED"

          pack_path = out / "packs" / "nxp-kl25-program-longword-v0-pack-v0.json"
          pack = json.loads(pack_path.read_text(encoding="utf-8"))
          refs = {(ref["source_id"], ref["pdf_page_number"]): ref for ref in pack["page_refs"]}
          p446 = refs[("nxp_kl25_rm_rev3", 446)]
          assert "nxp-kl25-program-longword-v0" in p446["required_by_unit_ids"]
          assert ("nxp_kl25_rm_rev3", 447) not in refs

          included = {item["unit_id"]: item for item in pack["included_units"]}
          assert included["nxp-kl25-program-longword-v0"]["origin"] == "PRIMARY"
          assert included["nxp-kl25-program-longword-v0"]["pdf_page_range"] == [444, 446]

          report = json.loads((out / "build-report.json").read_text(encoding="utf-8"))
          assert report["manufacturer_text_in_report"] is False
          assert report["semantic_extraction_executed"] is False
          assert report["pack_count"] == 8
          print("Gate 5.6 real-source boundary PASS: Program Longword admits p446 and excludes p447")
          PY
      - name: Retain metadata only
        run: |
          set -euo pipefail
          src="${{ runner.temp }}/nxp-kl25-gate56-output"
          dst="${{ runner.temp }}/nxp-kl25-gate56-metadata"
          mkdir -p "$dst/packs"
          cp "$src/build-report.json" "$dst/"
          cp "$src/target-bundle.json" "$dst/"
          cp "$src/pre-ai-input.json" "$dst/"
          cp "$src"/packs/*.json "$dst/packs/"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("${{ runner.temp }}") / "nxp-kl25-gate56-metadata"
          report = json.loads((root / "build-report.json").read_text(encoding="utf-8"))
          assert report["manufacturer_text_in_report"] is False
          assert report["semantic_extraction_executed"] is False
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nxp-kl25-gate56-evidence-pack-metadata
          path: ${{ runner.temp }}/nxp-kl25-gate56-metadata
          if-no-files-found: error
          retention-days: 1
