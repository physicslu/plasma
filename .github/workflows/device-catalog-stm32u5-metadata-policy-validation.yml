name: STM32U5 metadata policy validation

on:
  pull_request:
    paths:
      - 'data/device-catalog/research/stm32u5-metadata-authority.json'
      - 'data/device-catalog/research/stm32u5-metadata-policy-baseline.json'
      - 'data/device-catalog/research/stm32u5_metadata_policy.py'
      - 'data/device-catalog/research/validate_stm32u5_metadata_policy.py'
      - 'data/device-catalog/research/device-catalog-stm32u5-metadata-policy.md'
      - 'data/device-catalog/research/stm32u5-exact-orderable-identity-enumeration.json'
      - 'data/device-catalog/research/stm32u5-manufacturer-identity-discovery.json'
      - 'data/device-catalog/research/stm32u5-security-scope-foundation.json'
      - '.github/workflows/device-catalog-stm32u5-metadata-policy-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen STM32U5 metadata policy
        run: python data/device-catalog/research/validate_stm32u5_metadata_policy.py
      - name: Enforce zero Production writes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          changed="$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- data/device-catalog/production/)"
          test -z "$changed" || { echo "Production writes are forbidden in STM32U5 metadata policy:"; echo "$changed"; exit 1; }
