name: STM32G4 Phase 4.9E publication apply one-off

on:
  push:
    branches:
      - agent/device-catalog-stm32g4-phase49e-publication
    paths:
      - ".github/workflows/device-catalog-stm32g4-phase49e-apply-oneoff.yml"

permissions:
  contents: write

jobs:
  apply-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/device-catalog-stm32g4-phase49e-publication
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen transaction inputs
        run: |
          python data/device-catalog/research/validate_stm32g4_phase4_9d_admission_plan.py
          test "$(sha256sum data/device-catalog/research/stm32g4-phase4.9e-publication-proposal.json | cut -d' ' -f1)" = "d6d6cd248e78658cb47b4781199d39d84d51ed9df0a032386e003bd1e6c23478"
          test "$(sha256sum data/device-catalog/production/icpn-v1-manifest.json | cut -d' ' -f1)" = "0dbb7df5a3ddc771326507fb42a47416d892d1d17f4e4141dde37cde23e95ddf"
          test ! -e data/device-catalog/research/stm32g4-commercial-icpn.csv
          test ! -e data/device-catalog/research/stm32g4-phase4.9e-publication-audit.json
      - name: Apply frozen Phase 4.9E publication proposal
        run: python data/device-catalog/research/publish_stm32g4_phase4_9e.py
      - name: Verify exact publication outputs and trust boundary
        run: |
          test "$(sha256sum data/device-catalog/research/stm32g4-commercial-icpn.csv | cut -d' ' -f1)" = "2e20c585687e9bc3148c7835575695a7d06f497c29409818b9b56064df7b07a8"
          test "$(git hash-object data/device-catalog/research/stm32g4-commercial-icpn.csv)" = "52958c5313e95f924a628c6a69c9f3b2f4ca5e05"
          test "$(sha256sum data/device-catalog/production/icpn-v1-manifest.json | cut -d' ' -f1)" = "93c2a4541daeb1d4aa1dcc57edef54042862eb6d9da03e3a6b401e4b8481b11d"
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('data/device-catalog')
          canonical=root/'research/stm32g4-commercial-icpn.csv'
          audit=json.loads((root/'research/stm32g4-phase4.9e-publication-audit.json').read_text())
          manifest=json.loads((root/'production/icpn-v1-manifest.json').read_text())
          rows=list(csv.DictReader(canonical.open(newline='',encoding='utf-8')))
          assert len(rows)==25
          assert len({r['icpn'] for r in rows})==25
          assert len({r['base_device'] for r in rows})==8
          assert all(r['family']=='STM32G4' for r in rows)
          assert all(r['openocd_target_config']=='tcl/target/stm32g4x.cfg' for r in rows)
          assert all(r['existing_identifier_kind']=='ordering_pattern' for r in rows)
          assert all(r['cmsis_device_name']=='' for r in rows)
          w=next(r for r in rows if r['icpn']=='STM32G441CBY6TR')
          assert (w['package'],w['pin_count'],w['option_suffix'])==('WLCSP','49','TR')
          g4=next(s for s in manifest['sources'] if s['family']=='STM32G4')
          assert g4['row_count']==25
          assert g4['sha256']=='2e20c585687e9bc3148c7835575695a7d06f497c29409818b9b56064df7b07a8'
          assert g4['git_blob_sha']=='52958c5313e95f924a628c6a69c9f3b2f4ca5e05'
          assert audit['status']=='published'
          assert audit['publication_proposal_sha256']=='d6d6cd248e78658cb47b4781199d39d84d51ed9df0a032386e003bd1e6c23478'
          assert audit['published_exact_icpn_count']==25
          assert audit['stm32g4_base_devices_after']==8
          assert audit['production_exact_icpns_before']==610
          assert audit['production_exact_icpns_after']==635
          assert audit['production_base_devices_before']==209
          assert audit['production_base_devices_after']==217
          assert audit['production_family_count_before']==7
          assert audit['production_family_count_after']==8
          assert audit['source_unavailable_base_devices']==['STM32G411C6','STM32G414CB','STM32G471CC']
          assert audit['proposal_exact_identity_exclusions']==['STM32G441CBT3','STM32G441CBU3','STM32G484CET3']
          assert audit['bounded_commercial_surface_complete'] is False
          for flag in ('programming_algorithm_equivalence_claimed','flash_geometry_equivalence_claimed','option_security_semantics_claimed','physical_target_qualification_claimed','hil_qualification_claimed','runtime_programming_support_claimed','full_stm32g4_surface_covered'):
              assert audit[flag] is False, flag
          assert audit['canonical_write_applied'] is True
          assert audit['production_write_applied'] is True
          print('STM32G4 Phase 4.9E exact publication transaction: PASS')
          PY
          sha256sum data/device-catalog/research/stm32g4-phase4.9e-publication-audit.json
      - name: Commit publication transaction outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/device-catalog/research/stm32g4-commercial-icpn.csv \
            data/device-catalog/research/stm32g4-phase4.9e-publication-audit.json \
            data/device-catalog/production/icpn-v1-manifest.json
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m "Device catalog: publish STM32G4 Phase 4.9E exact ICPNs"
          git push origin HEAD:agent/device-catalog-stm32g4-phase49e-publication
